file: knopf_ausgewaehlte-maertyrerakten-lat-grc-deu_krueger1929.txt
scheme: 'Knopf and Krueger 1929: the 33 numbered martyr acts of the collection (the number and title printed at the head of each and in the contents list); act 10 (Pionius) also by its printed roman chapter numbers; other section numbers are the editors'' own and are not used'
curator: Sonnet 5.5
status: drafted
rules:
  - id: act
    pattern: '^(?:\d{1,3} )?(?P<n>\d{1,2})\. (?P<t>(?:Martyrium|Akten|Brief|Die Lug|Das Testament)[^.,]*)[.,]'
    lines: [[737, 3510], [3512, 8903]]
    locus: 'act{n|int}'
    title: '{t}'
    number: n
    fixes:
      - line: 1546
        set: {n: '3'}
  - id: pionius-chapter
    parent: act
    pattern: '^(?:(?:[;.] )+|\d{1,2} )?(?P<c>[IVXLl]+)\. (?=\S)'
    lines: [3607, 4442]
    locus: 'ch{c|int}'
    number: c
    ocr_map: {'l': 'I'}
    fixes:
      - line: 3668
        quote: 'HI. LMeocev'
        set: {c: 'III'}
      - line: 3906
        set: {c: 'VIII'}
apparatus:
  - lines: [11, 736]
    kind: front
    locus: front
  - lines: [8904, 10597]
    kind: index
    locus: index
