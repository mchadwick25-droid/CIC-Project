    pattern: '^CTh\.(?P<b>\d+)\.(?P<t>\d+)\.0[. ]'
    lines: [[41, 397], [433, 804], [828, 1084], [1111, 1392], [1413, 1605], [1646, 2211], [2238, 2718], [2740, 3313], [3361, 4044], [4073, 4458], [4500, 5241], [5263, 5953], [5967, 6286], [6316, 6581], [6599, 6865], [6879, 7502]]
