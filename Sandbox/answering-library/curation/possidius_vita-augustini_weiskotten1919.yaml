    kind: front
    locus: front
  - lines: [5063, 5999]
    kind: notes
    locus: notes
  - lines: [6000, 6294]
    kind: index
    locus: index
evidence:
  - line: 1485
    quote: PRAEFATIO
  - line: 1518
    quote: PREFACE
  - line: 1563
    quote: CAPUT I
  - line: 1604
    quote: CHAPTER I
  - line: 2035
    quote: CAPUT VIII
  - line: 3241
    quote: CAPUT XXI
  - line: 4879
    quote: CAPUT XXXI
  - line: 4916
    quote: CHAPTER XXXI
  - line: 4260
    quote: '2. But this advice'
