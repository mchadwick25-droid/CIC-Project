file: ribbeck_donatus-und-augustinus-erste-haelfte-deu_1857.txt
scheme: 'Ribbeck''s three Theile (Erster, Zweiter, Dritter), each in Capitel numbered in words (Erstes, Zweites and so on) and, where the edition prints them, Abschnitte (Erster, Zweiter, Dritter), addressed T<Theil>/c<Capitel>/a<Abschnitt>; inside Zweiter Theil Capitel 4 the printed Erstes, Zweites and Drittes Buch, and inside Dritter Theil Capitel 1 Abschnitt 2 the printed Erster, Zweiter and Dritter Tag; the scan repeats the opening pages of Erster Theil Capitel 5 (second copy addressed by its line) and lacks printed pages 153 to 161, so the stretch from the printed page number 162 is addressed T1/page162; Vorrede, Einleitung, Inhalts-Verzeichniss and Druckfehler as printed'
curator: Sonnet 5.5
