# Human-verified, ready-to-download candidates - the seed half of
# DOWNLOAD-QUEUE.md (see gen_download_queue.py). The other half is
# WANTS-REGISTER.md's own "acquirable, public domain" bucket, which is
# already generated from records/ and needs no seeding here.
#
# WHY A SEPARATE SEED FILE, NOT JUST WANTS-REGISTER.md's OWN OUTPUT.
# WANTS-REGISTER.md is reactive by construction: an entry appears only
# after some world's build thread has already written a `source` record
# citing something it can't read. Every entry below was found the OTHER
# direction - a session went looking for a public-domain edition of
# something no world had cited yet, verified it against a real host, and
# recorded it here BEFORE any source record exists. Ammianus Marcellinus
# 27.3 is the clearest case: confirmed public domain 2026-09-02, and still
# absent from WANTS-REGISTER.md's own acquirable bucket as of that date,
# because nothing had cited it yet for the register's own generator to see.
#
# HAND-MAINTAINED, APPEND-ONLY - same discipline as WORKS.yaml. Add a row
# when a candidate is actually verified against a real host, not when it
# merely seems likely; leave rights_basis fields unfilled rather than
# guessed, per this project's standing rule against fabricated citations.
# Move a row's status to "downloaded" once vendored - don't delete it,
# the same no-rewrite-history practice texts_registry.py already follows.
#
# SCHEMA, per candidate:
#   title, author, translator, year
#   world:          which world's build surfaced the need (informational -
#                   the same edition may serve other worlds too, per
#                   corpus-map's own non-exclusive assignment principle)
#   why:            what gap this closes, and how it was found
#   url:            the specific host page verified to carry it
#   rights_basis:   one of texts_registry.py's rights_clears() categories,
#                   or "pd-us-by-date" pending that enum's own formalization
#   verified_by:    who/what actually confirmed the URL and rights basis
#                   carries the edition claimed, and when
#   status:         not-yet-downloaded | downloaded | superseded

