  - title: "Sancti Augustini Vita Scripta a Possidio Episcopo"
    author: "Possidius of Calama"
    translator: "Herbert T. Weiskotten (ed. and trans.)"
    year: 1919
    world: lpc
    why: >
      lpc's own G3, its own strongest candidate. Possidius was Augustine's
      companion for decades and wrote the Augustine-side counterpart to
      Pontius's already-vendored Life of Cyprian (row 7) - closes a
      one-sided formation-narrative gap this world's own Doc_02 SS4/SS9
      names. Also the underlying source for the Megalius/primate-of-Numidia
      identification Doc_01 SS5/SS9 disclose as resting on an unvendored
      work. Latin text with facing English translation - would clear both
      the English-evidence and original-language-witness needs at once.
    url: "https://archive.org/details/sanctiaugustiniv00possrich"
    rights_basis: pd-us-by-date
    verified_by: "lpc build thread, live web search + Cambridge Classical Review cross-citation, 2026-09-01; direct file inspection (OCR-quality sampled across the full document) 2026-09-05"
    status: downloaded

