  - title: "Vita Germani (Life of Germanus of Auxerre)"
    author: "Constantius of Lyon"
    translator: "(Latin only — ed. Wilhelm Levison)"
    year: 1920
    world: gallic
    why: >
      Surfaced by the same source-readiness routine as a load-bearing
      gap. No public-domain English translation exists: the only
      English translation (F. R. Hoare, "The Western Fathers," Sheed and
      Ward, 1954) is marked access-restricted / printdisabled on every
      archive.org copy found, and a renewal check against Stanford's
      Copyright Renewal Database could not be completed this session
      (exhibits.stanford.edu and tertullian.org are both blocked by this
      session's network egress proxy) — treat Hoare's translation as
      NOT confirmed public domain, not as a acquirable candidate, until
      that check is actually done. Levison's critical Latin edition (MGH
      Scriptores rerum Merovingicarum VII, pp. 225-283) is confirmed
      public domain instead, the same Latin-acquisition path already
      used for Faustus of Riez and Eucherius of Lyon below. A translation
      effort (not a rights problem) is what stands between this text and
      use, same as Faustus's De gratia.
    url: "https://archive.org/details/passionesvitaequesanctorum5"
    rights_basis: pd-us-by-date
    verified_by: "direct WebFetch verification, 2026-09-09"
    status: not-yet-downloaded

