      the same Opus adversarial review, 2026-09-02.
    url: "https://archive.org/details/liturgiesofssmar00neal"
    rights_basis: pd-us-by-date
    verified_by: "Opus adversarial review, 2026-09-02"
    status: not-yet-downloaded

