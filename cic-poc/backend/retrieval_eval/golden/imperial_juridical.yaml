# S1.2 golden retrieval cases - Imperial-Juridical Christianity
# Authored 2026-07-26 against data/imperial_juridical_world/{lexicon_chunks,
# story_chunks} front-matter. IDs are source_file stems. Conventions: see
# golden/syriac.yaml.

world_id: imperial-juridical-christianity
cases:
  # --- verbatim-term ---
  - id: IJC-VT-01
    category: verbatim-term
    retriever: lexicon
    query: "What is the homoousios?"
    must: [ijclex006_homoousios]
  - id: IJC-VT-02
    category: verbatim-term
    retriever: lexicon
    query: "Why does the bishop of Rome claim primacy over other sees?"
    must: [ijclex001_primatus]
  - id: IJC-VT-03
    category: verbatim-term
    retriever: lexicon
    query: "What does the formula 'the emperor is within the church, not above the church' mean?"
    must: [ijclex005_imperator_intra_ecclesiam]

  # --- thematic ---
  - id: IJC-TH-01
    category: thematic
    retriever: lexicon
    query: "Why did what counted as orthodoxy seem to shift depending on which emperor reigned?"
    must: [ijclex003_homoios]
  - id: IJC-TH-02
    category: thematic
    retriever: lexicon
    query: "How could a mere bishop stand against an emperor and survive?"
    must: [ijclex005_imperator_intra_ecclesiam]
  - id: IJC-TH-03
    category: thematic
    retriever: story
    query: "How did your world's alliance with imperial power begin?"
    must: [ijcstory001_the-vision-and-the-alliance]
  - id: IJC-TH-04
    category: thematic
    retriever: story
    query: "Tell me about Ambrose's confrontation in the basilica - the standoff with the court."
    must: [ijcstory004_the-vigil-in-the-basilica]
  - id: IJC-TH-05
    category: thematic
    retriever: story
    query: "What happened with Leo's Tome at the council of Chalcedon?"
    must: [ijcstory006_the-tome-that-would-not-bend]

  # --- de-dup ---
  - id: IJC-DD-01
    category: de-dup
    retriever: lexicon
    query: "Say more about that word the council chose."
    context: >-
      Marius: homoousios - of one being with the Father - is the word Nicaea
      set down. I have just explained homoousios at length this turn, its
      meaning and why it was fought over for half a century.
    must_not: [ijclex006_homoousios]
    surfaced: [ijclex006_homoousios]
    notes: >-
      Term is exactly "homoousios" (simple string), so the already_discussed
      proxy CAN fire here - the guard reroutes to the LLM vote; vote=skip is
      clean, vote=retrieve shows the duplicate (compare ALX-DD-01).
  - id: IJC-DD-02
    category: de-dup
    retriever: story
    query: "So what happened during that night in the basilica?"
    context: >-
      Marius: I have just told the story of The Vigil in the Basilica - the
      court's demand, the sealed doors, the people singing through the night
      around their bishop. That story has been told in full.
    must_not: [ijcstory004_the-vigil-in-the-basilica]
    surfaced: [ijcstory004_the-vigil-in-the-basilica]

  # --- negative-condition ---
  - id: IJC-NC-01
    category: negative-condition
    retriever: lexicon
    query: "What did Arius himself originally teach, in his own words?"
    must_not: [ijclex003_homoios]
    notes: "The chunk's guard: this world's record does not reconstruct Arius's own teaching."
  - id: IJC-NC-02
    category: negative-condition
    retriever: story
    query: "What does Lactantius's account say about the dream before the battle?"
    must: [ijcstory002_a-dream-before-the-battle]
    must_not: [ijcstory001_the-vision-and-the-alliance]
    notes: >-
      ijcstory001's guard routes Lactantius-specific questions to the
      separate Lactantius story.

  # --- reactive-turn ---
  - id: IJC-RT-01
    category: reactive-turn
    retriever: lexicon
    query: |-
      How did each of your worlds relate to political power?

      Chloe just said: For us the empire was a danger to be endured - we met
      in houses, prayed for the emperor but could not sacrifice to him, and
      when the magistrate summoned us, some of us did not come home.
    must: [ijclex005_imperator_intra_ecclesiam]

  # --- cross-world-isolation ---
  - id: IJC-XW-01
    category: cross-world-isolation
    retriever: lexicon
    query: "What is hesychia - the stillness the desert sought?"
    notes: "Desert term against the IJC index; isolation asserted structurally."
