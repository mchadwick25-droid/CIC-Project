# S1.2 golden retrieval cases - Alexandria Catechetical School
# Authored 2026-07-26 against data/alexandria_world/{lexicon_chunks,story_chunks}
# front-matter. IDs are source_file stems. Conventions: see golden/syriac.yaml.
#
# World-specific fact encoded: ALL 45 lexicon chunks are Tier 1, so the Tier-1
# short-circuit applies to every top-2-ranked candidate on every query -
# whatever ranks first and second auto-retrieves (unless already_discussed or
# force_llm_vote). With 45 near-adjacent theological terms, ranking precision
# carries this world's whole retrieval quality. The DD pair below (theosis vs
# gnosis) shows the de-dup guard firing and failing on this world's own
# simple-vs-composite Term strings.

world_id: alexandria-catechetical
cases:
  # --- verbatim-term ---
  - id: ALX-VT-01
    category: verbatim-term
    retriever: lexicon
    query: "What is theosis?"
    must: [alexlex008_theosis]
  - id: ALX-VT-02
    category: verbatim-term
    retriever: lexicon
    query: "What do you mean when you speak of the Logos?"
    must: [alexlex001_logos]
  - id: ALX-VT-03
    category: verbatim-term
    retriever: lexicon
    query: "Is allegorical interpretation legitimate, or just arbitrary?"
    must: [alexlex016_allegory]
  - id: ALX-VT-04
    category: verbatim-term
    retriever: lexicon
    query: "What is the Rule of Faith?"
    must: [alexlex031_rule-of-faith]

  # --- thematic ---
  - id: ALX-TH-01
    category: thematic
    retriever: lexicon
    query: "How does someone become a Christian in your school - what are the stages before baptism?"
    must: [alexlex003_catechesis]
  - id: ALX-TH-02
    category: thematic
    retriever: lexicon
    query: "Why does formation take so long? Why doesn't God just change a person at once?"
    must: [alexlex002_divine-pedagogy]
  - id: ALX-TH-03
    category: thematic
    retriever: lexicon
    query: "When you read the Old Testament, how do you find Christ in it?"
    must: [alexlex015_christological-reading, alexlex016_allegory]
    notes: >-
      Near-adjacent chunks split this theme (christological reading = the
      orientation, allegory = the method); pass@k is the honest headline,
      recall@k measures the split.
  - id: ALX-TH-04
    category: thematic
    retriever: lexicon
    query: "Is faith opposed to real knowledge of God?"
    must: [alexlex037_faith, alexlex005_knowledge-gnosis]
  - id: ALX-TH-05
    category: thematic
    retriever: story
    query: "How did persecution actually press on the life of your school - did it touch specific people?"
    must: [alexstory003_persecution-shapes-school]
  - id: ALX-TH-06
    category: thematic
    retriever: story
    query: "What was it actually like to study under Origen?"
    must: [alexstory001_gregory-address-origen]

  # --- de-dup ---
  - id: ALX-DD-01
    category: de-dup
    retriever: lexicon
    query: "Tell me more about that becoming-god idea."
    context: >-
      Theon: Theosis is the horizon of the whole ascent - I have just
      described Theosis at length, deification without dissolution, the
      creature drawn into God's own life without ceasing to be creature.
    must_not: [alexlex008_theosis]
    notes: >-
      The one shape where the already_discussed proxy CAN fire: this chunk's
      metadata Term is exactly "Theosis", and the context contains it. The
      guard reroutes to the LLM vote, so vote=skip is clean and vote=retrieve
      shows the duplicate - the guard's best case is still vote-dependent.
  - id: ALX-DD-02
    category: de-dup
    retriever: lexicon
    query: "Say more about that true knowledge."
    context: >-
      Theon: Gnosis, rightly held, is not the secret knowledge of the sects -
      I have just spent this turn distinguishing our gnosis from the Gnostic
      teachers' esoteric claim, the true gnostic being Clement's own figure
      of the formed knower.
    must_not: [alexlex005_knowledge-gnosis]
    notes: >-
      The failing shape beside ALX-DD-01: metadata Term is the composite
      "Knowledge / Gnosis", which a context saying "gnosis" never matches -
      Tier 1 + top rank auto-retrieves the duplicate deterministically (same
      gap as SYR-DD-01/DES-DD-01).

  # --- negative-condition ---
  - id: ALX-NC-01
    category: negative-condition
    retriever: lexicon
    query: "What does 'logos' mean in modern linguistics and semiotics?"
    must_not: [alexlex001_logos]
  - id: ALX-NC-02
    category: negative-condition
    retriever: story
    query: "Did Mark really found the church of Alexandria? Is that documented history?"
    must_not: [alexstory006_markan-foundation]
    notes: >-
      Do-Not-Retrieve-When: must not be offered as documented first/second
      century history - which is exactly what the question demands.
  - id: ALX-NC-03
    category: negative-condition
    retriever: story
    query: "Tell me the verified historical facts of Antony's visions and temptations - what actually happened?"
    must_not: [alexstory005_life-of-antony]

  # --- reactive-turn ---
  - id: ALX-RT-01
    category: reactive-turn
    retriever: lexicon
    query: |-
      How did each of your worlds understand a person becoming like God?

      Papnoute just said: For us it is the long labor of the cell - the
      stripping away of the passions through watchfulness, manual work, and
      the elder's word, until the heart grows still enough to receive what
      God gives; we would not dare call it more than that.
    must: [alexlex008_theosis]
  - id: ALX-RT-02
    category: reactive-turn
    retriever: lexicon
    query: |-
      What is prayer, in each of your worlds?

      Mar Yausep just said: Among the qyama, prayer is the vigil kept in the
      middle of the town - the night watch, the Psalter, the fast that
      accompanies it, the covenant's own discipline of presence before God
      while one's kin sleep on the other side of the wall.
    must: [alexlex028_prayer]

  # --- cross-world-isolation ---
  - id: ALX-XW-01
    category: cross-world-isolation
    retriever: lexicon
    query: "What is a madrasha - the teaching-hymn?"
    notes: "Syriac term against the Alexandria index; isolation asserted structurally."
