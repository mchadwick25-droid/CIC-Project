- id: PAHC-RT-01
  category: reactive-turn
  retriever: lexicon
  query: 'How did each of your communities decide who could lead?


    Papnoute just said: Among us there is no office to seek - a man or woman

    goes further into the desert, and it is the elder''s own life, tested and

    seen, that draws disciples; authority is the charisma of the geron, the

    abba or amma whose word has been proven in the cell.'
  must:
  - pahclex001_episkopos
  rewritten: Leadership selection and authority practices in house-churches
