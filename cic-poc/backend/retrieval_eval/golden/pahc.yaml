- id: PAHC-DD-01
  category: de-dup
  retriever: lexicon
  query: Tell me more about that overseer role.
  context: 'Chloe: The episkopos is the overseer - I have just described the episkopos at length,
    how the office stood among the presbyters and how Ignatius argued for one bishop at the
    center of each assembly.'
  must_not:
  - pahclex001_episkopos
  surfaced:
  - pahclex001_episkopos
  notes: 'Composite-Term de-dup gap, third world (see SYR-DD-01, DES-DD-01): metadata Term is
    "episkopos (with Greek script)", which plain "episkopos" in context never matches.'
- id: PAHC-DD-02
  category: de-dup
  retriever: story
  query: So how did the Roman authorities actually deal with Christians back then?
  context: 'Chloe: I told you the story of Pliny''s Interrogation in Bithynia-Pontus already
    - the governor''s letter to Trajan, the test of the images, the two ministrae he tortured,
    and the emperor''s reply. That full account has been given.'
  must_not:
  - pahcstory004_pliny-interrogation
  surfaced:
  - pahcstory004_pliny-interrogation
