# Commentary worklist, Eras 7 to 10 (1517 to present). Read-only research, 2026-10-26.
# Hosts and editions are from the author's knowledge; the sandbox blocks text hosts, so nothing was fetched.
# conf: repo = checked in the repo; repo+knowledge = vendoring checked, edition facts from memory; knowledge = from memory; unverified = partial memory.
# priority = number of (world x sub-question) cells unlocked. Method in meta.method and in the .md file.
meta:
  scope: Scripture commentaries, postils, sermon series on a biblical book, annotations and catenae, Eras 7 to 10
  date: '2026-10-26'
  rights_rule: 'Project 95-year rule: published 1930 or earlier is public domain in the US as of 2026. Later works are listed only if openly licensed; otherwise the row says rights block use.'
  method:
  - 'Worlds scored: witt, rzg (records exist), hus, jes, meth, obel (world files exist, records empty).'
  - 'Sub-questions: the 109 sub-questions of clusters C1 to C14 in 07-subquestions.yaml. C15 to C17 are excluded.'
  - 'Open cell: for witt, a sub-question the coverage maps rate L, I, N or ''-'' (24 cells, including Trinity and Spirit as Mark flagged). For rzg the same test gives 62 cells. For hus, jes, meth and obel
    every one of the 109 cells counts as open, because no record exists.'
  - A work serves a sub-question when the biblical books or doctrine it covers carry a direct answer, for example Romans for C4.S1 to S5, Genesis for C5.S4, Job and Psalms for C14. Each work's list was
    set by hand from the books it covers; it is written in the yaml as macros and as an expanded list.
  - A work serves a world when the author belongs to that world's tradition and window, or is the opponent voice the world's records cite (Calvin for meth, Rheims for jes). Judgement call; the yaml lists
    the worlds.
  - Priority = sum over served worlds of (work's sub-questions that are open cells in that world). Ties break on native voice (the world's own author), then witt+rzg cells, then count of later Atlas worlds.
  - Because four worlds have no records, a whole-Bible set scores about 76 for each unbuilt world it serves. The 'built cells' figure (witt plus rzg) is shown separately; use it to rank gap-filling for
    the two worlds that already have records.
  - 'Later worlds: the number of other Era 7 to 10 Atlas entries in the traditions listed for the work (groups defined in the yaml). It is a tie-break only and was not used in the priority.'
