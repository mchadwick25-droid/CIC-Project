  - CCEL holdings claimed (Calvin, Henry, Clarke, Keil and Delitzsch, Jamieson-Fausset-Brown, Barnes, Spurgeon's Treasury, Ryle, Wesley's Notes) are from memory and are the most confident of the host claims.
  - Whether Avvakum's volume (Materialy vol 5) holds his full Book of Interpretations was not checked; the file header says only 'his commentaries'.
  - Which volumes of Mossman's a Lapide and Davie's Maldonado exist in English was not verified.
  - The witt and rzg open-cell sets come from the C1 to C16 coverage maps. Mark flagged witt's Trinity and Spirit as missing although the map rates them R*; the score counts them as open.
  - Cells are counted for sub-questions C1 to C14 only. C15 to C17 (modern questions, source questions, facilitator ground) are not answered by a commentary.
