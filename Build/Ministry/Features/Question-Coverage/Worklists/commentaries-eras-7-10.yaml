rights_blocks:
- 'Luther''s Works, American Edition (Concordia and Fortress, 55 vols): in copyright. Use Latin and German originals, Lenker''s Postils (1905-09) and Hay''s Sermon on the Mount (1892) instead.'
- 'Watson (1953) on Galatians, Preus (1972) on Romans, Kramer (1992) on Melanchthon''s Romans, Preus (1989) Chemnitz Loci, Kramer (1971-86) Examen: in copyright.'
- 'Collected Works of Erasmus (Toronto), the Peter Martyr Library (Truman State), Backus''s Bucer (Brill), Eerdmans and Banner of Truth reprint typesetting: edition rights block copying even where the text
  is old.'
- 'Tolle Lege 2006 Geneva Bible facsimile apparatus; Supplementa Calviniana critical editions; Klassen and Klaassen Marpeck (1978): in copyright.'
- 'Yale Works of Jonathan Edwards: free to read online, but not an open licence; no redistribution.'
- Mossman's a Lapide is public domain; the Loreto revision (2008 on) is in copyright.
- 'Theophan the Recluse and Philaret in English (St Herman and other 20th-century presses): in copyright. Russian originals are public domain by date.'
- 'Africa Bible Commentary (2006) and the Asia, South Asia and Latin American commentary series: in copyright, not openly licensed. Do not copy. Permission request to the publisher is the only route.'
- 'NET Bible notes, Faithlife Study Bible notes, Spirit-Filled Life Bible, ESV Study Bible: free to read or sold, not open. Rights block.'
- 'A. T. Robertson, Word Pictures: only 1930 volumes are public domain now; later volumes enter in 2027 to 2029. Many sites ignore this.'
- 'International Critical Commentary and other series: only volumes published 1930 or earlier. Later volumes are in copyright.'
- 'New Scofield (1967) and later Scofield editions: in copyright. Use 1909 and 1917 only.'
- 'Barth''s Romans in Hoskyns''s English (1933): in copyright. German 1919 and 1922 are public domain in the US by date only; Barth died 1968, so the EU protects them to 2038.'
- 'Lagrange''s English translations: in copyright. French originals before 1931 are public domain in the US and in France (Lagrange d. 1938).'
- 'Era 10 commentary of any depth after 1930 (Barth''s Dogmatics, Bonhoeffer, Lenski, Hendriksen, Bruce, the NICNT and Anchor Bible sets, Black church, Pentecostal and global-south commentaries published
  after 1930): in copyright. Only openly licensed material is listed: unfoldingWord notes (CC BY-SA 4.0, confident), Tyndale Open Study Notes (CC BY-SA 4.0, unverified), Berean Standard Bible (public domain
  since 2023), World English Bible (public domain).'
- 'Hill''s 1944 Loci Communes translation: rights status unverified. Do not use until checked.'
