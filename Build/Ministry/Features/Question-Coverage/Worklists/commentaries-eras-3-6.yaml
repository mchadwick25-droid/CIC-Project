meta:
  about: Commentary and homily-series worklist for Eras 3-6 (451-1517). Read-only research, 2026-10-26. Editions from my own knowledge; anything marked unverified
    was not checked against a host. No downloads, no model calls.
  method: priority = n_worlds x n_subquestions. n_worlds counts the 90 Era 3-6 worlds in cic/corpus-map/ATLAS-TARGETS.md whose tradition tag matches the work's tradition
    and whose date window overlaps the work's reception window (composition to last documented use; to 1517 only for school-standard texts), narrowed by hand for
    regional works. n_subquestions counts ids in 07-subquestions.yaml (129 total) that the books covered can speak to. No Era 3-6 world is built, so the finished
    gap maps (all Eras 1-2 or 7) were not used. Priority is an upper bound on cells unlocked, not an attested count, and favours Latin works because the Era 3-6 list
    has more Latin worlds.
