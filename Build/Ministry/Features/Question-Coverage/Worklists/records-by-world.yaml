# Generated 2026-10-26 from the sixteen coverage reports C1 to C16 (scratchpad/search/). Read-only extraction; nothing in the repo was changed. Wording is the reports' own.
_about: "Every 'must add' or 'fix' item from the sixteen coverage reports, one row per item, for the twelve worlds with records, plus a _fleet section for engine, site, product and cross-world items. group (order within a world): loaded = the answering text is already vendored (LOADED to RENDERED); no_text = honest_limit / contested_claim / term / decision that needs no new text; acquire = depends on a source acquired first (see acquire.yaml); fix = registry drift, stale or overstated limits, mis-indexed or duplicate records, not_for guards, status and tag fixes. facilitator_adjacent marks rows the reports mark as Facilitator ground or adjacent (infants, suicide, interim state, grief and despair follow-up, abuse, a violent husband, system-nature questions, Facilitator-only context). path_exists is os.path.exists under /home/user/CIC-Project; null when no file applies; a record path under records/<code>/_not-found_/ means the record id was not found in the repo. Cells: Cn/Sm = cluster and sub-question; '*' = the report does not name a sub-question. The 4-cluster list is kept as records-by-world-4cluster.*; two of its rows (the Macarian and Salvian verbatim notes) were revised in the 16-cluster version because later reports matched those quotes. Wording is the reports' own; no theology added."
