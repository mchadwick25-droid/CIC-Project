method: read-only; no model calls; no downloads
scoring: priority = count of world x sub-question cells that are gaps in the finished maps (C3, C4, C5, C8 coverage.md) among the ten Era 1 and 2 worlds that have records (pahc, alx, syr, lpc, don, ijc,
  desert, cappadocian, gallic, hal), for the sub-questions the work treats. A gap is loaded-only, nothing, guard/limit-only (C3, C5, C8) or thin (C4). P = world voices the author (tradition or antecedent);
  C = context only. Priority is the sum, an upper bound, not a promise. Worlds without records (aec and the rest) are named but not scored.
