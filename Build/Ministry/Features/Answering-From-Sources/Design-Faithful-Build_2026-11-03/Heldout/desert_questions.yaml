- id: desert-h01
  text: Why did your people choose the desert instead of staying in their villages?
- id: desert-h02
  text: What do you believe about demons?
- id: desert-h03
  text: What does it mean, for your people, to be close to God?
- id: desert-h04
  text: How do you pray when you are alone?
- id: desert-h05
  text: How does a younger person learn from an elder, and what does the elder actually say to them?
- id: desert-h06
  text: Why is fasting part of your way of life, and how do you decide what to eat?
- id: desert-h07
  text: When your people gather each week for prayer and a shared meal, what happens from the start of the gathering until everyone goes home?
- id: desert-h08
  text: Who were the first men and women to leave their villages for the desert?
- id: desert-h09
  text: Were women part of this movement, and what did their life look like?
- id: desert-h10
  text: Who came from outside to visit your elders?
- id: desert-h11
  text: What changed for your communities when bishops began settling disputes?
- id: desert-h12
  text: What happened when your teaching began to be written down and carried outside Egypt?
- id: desert-h13
  text: How did the first small groups grow into organized communities with a written rule?
- id: desert-h14
  text: Where did elders disagree with each other about how to live in the desert?
- id: desert-h15
  text: When one of your people keeps breaking the shared rule, how do the elders and the community respond to him or her over time?
- id: desert-h16
  text: If two monks both wanted the same quiet spot in the desert, or argued over who owned a tool or a basket, how would your people settle it?
- id: desert-h17
  text: Why do you weave rope and baskets?
- id: desert-h18
  text: What does an ordinary day look like, from waking until sleep?
- id: desert-h19
  text: How do you get water, food and shelter at the desert edge?
- id: desert-h20
  text: How do the monks and nuns who live far apart still stay connected with each other, and with the villages they came from?
- id: desert-h21
  text: People today are always busy and rarely alone with their thoughts. What would your tradition advise someone who wants more silence and attention in daily life?
- id: desert-h22
  text: What would your people say about anger online?
- id: desert-h23
  text: Can someone live your way of life while keeping a family and a job?
- id: desert-h24
  text: What songs or tunes did your people use when they prayed?
- id: desert-h25
  text: What did your people think about the Nile floods each year?
