- id: hal-h01
  text: What did your people believe about the body and its desires?
- id: hal-h02
  text: What did your people teach about marriage and about staying unmarried, and how did they explain the difference to ordinary believers in the city?
- id: hal-h03
  text: What did your people believe happens to the soul after death?
- id: hal-h04
  text: Did your people visit holy places, and what would they do when they got there?
- id: hal-h05
  text: How did your people study the Bible together?
- id: hal-h06
  text: Why did your circle spend so much effort translating the Bible, and how did the work actually get done from day to day among you?
- id: hal-h07
  text: Who were the women in your circle, and what drew them to this life?
- id: hal-h08
  text: Who supported your communities with money, and why did they give?
- id: hal-h09
  text: Was there anyone in your circle who started out as an outsider or an opponent and then joined you?
- id: hal-h10
  text: Why did some of your people leave Rome for Bethlehem?
- id: hal-h11
  text: What happened to your circle after its last leaders had died around 420?
- id: hal-h12
  text: What were the main turning points in the life of your community between Rome and Bethlehem, as your people remember them?
- id: hal-h13
  text: Who disagreed with your way of life, and what did they say against it?
- id: hal-h14
  text: Did your people quarrel with other Christians over the teachings of earlier writers, and what were the sides?
- id: hal-h15
  text: How did letters and public writing help your people when an argument grew heated?
- id: hal-h16
  text: What did a normal day look like in your communities?
- id: hal-h17
  text: What clothes did your people wear?
- id: hal-h18
  text: How did the women in your communities care for the sick and for travelers who came to their doors?
- id: hal-h19
  text: Many people today read old texts in translation. What would your people say about trusting a translation?
- id: hal-h20
  text: Some people today give away their things to live simply. What would your tradition advise them to think about before they do it, and why?
- id: hal-h21
  text: Today many people are told to read a lot and then speak up in public. What would your people say makes someone fit to teach others?
- id: hal-h22
  text: What music did your people sing at their prayers?
- id: hal-h23
  text: How did the women of your circle describe their own lives, in their own words, when they wrote to each other?
- id: hal-h24
  text: What were the names of the women who copied manuscripts for your community?
