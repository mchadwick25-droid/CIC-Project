  text: Did your people quarrel with other Christians over the teachings of earlier writers, and what were the sides?
- theme: conflicts
  text: How did letters and public writing help your people when an argument grew heated?
- theme: daily_life
  text: What did a normal day look like in your communities?
- theme: daily_life
  text: What clothes did your people wear?
