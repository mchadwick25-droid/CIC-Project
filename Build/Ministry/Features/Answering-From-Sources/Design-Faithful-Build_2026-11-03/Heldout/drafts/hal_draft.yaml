  text: How did the women in your communities care for the sick and for travelers who came to their doors?
- theme: modern_concern
  text: Many people today read old texts in translation. What would your people say about trusting a translation?
- theme: modern_concern
  text: Some people today give away their things to live simply. What would your tradition advise them to think about before they do it, and why?
- theme: modern_concern
  text: Today many people are told to read a lot and then speak up in public. What would your people say makes someone fit to teach others?
- theme: unanswerable
  text: What music did your people sing at their prayers?
