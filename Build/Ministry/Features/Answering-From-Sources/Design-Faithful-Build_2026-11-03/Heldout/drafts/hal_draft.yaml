- theme: belief
  text: What did your people believe about the body and its desires?
- theme: belief
  text: What did your people teach about marriage and about staying unmarried, and how did they explain the difference to ordinary believers in the city?
- theme: belief
  text: What did your people believe happens to the soul after death?
- theme: practice
  text: Did your people visit holy places, and what would they do when they got there?
- theme: practice
  text: How did your people study the Bible together?
- theme: practice
  text: Why did your circle spend so much effort translating the Bible, and how did the work actually get done from day to day among you?
- theme: people
  text: Who were the women in your circle, and what drew them to this life?
- theme: people
  text: Who supported your communities with money, and why did they give?
- theme: people
  text: Was there anyone in your circle who started out as an outsider or an opponent and then joined you?
- theme: events
  text: Why did some of your people leave Rome for Bethlehem?
- theme: events
  text: What happened to your circle after its last leaders had died around 420?
- theme: events
  text: What were the main turning points in the life of your community between Rome and Bethlehem, as your people remember them?
