- id: syr-h01
  text: What did your people believe about sin and forgiveness?
- id: syr-h02
  text: What part did singing play in how your church taught about God?
- id: syr-h03
  text: What did your people believe about the body and the soul after a person dies?
- id: syr-h04
  text: Many of your people read the gospel as one continuous story. What did that way of reading mean for how ordinary believers understood Jesus's life?
- id: syr-h05
  text: How did your church celebrate baptism, and who could receive it?
- id: syr-h06
  text: How did your people fast, and why?
- id: syr-h07
  text: When your people met for worship, what did they do?
- id: syr-h08
  text: How did your church choose and train its leaders, such as bishops and deacons?
- id: syr-h09
  text: Who were the sons and daughters of the covenant, and what did they promise to live by?
- id: syr-h10
  text: Who were the people your church most admired as teachers, and what made them special?
- id: syr-h11
  text: What did ordinary believers, not clergy or celibates, contribute to your church?
- id: syr-h12
  text: What happened in 410 when the Persian churches were organized under one formal structure, and why did it matter to your people?
- id: syr-h13
  text: How did living on the border between Rome and Persia shape your people?
- id: syr-h14
  text: How did your church first take root in Edessa?
- id: syr-h15
  text: Why did your people oppose Marcion?
- id: syr-h16
  text: How did your church respond to the teaching of Bardaisan?
- id: syr-h17
  text: How did your church deal with the followers of Mani in its own cities?
- id: syr-h18
  text: What kind of houses did people live in?
- id: syr-h19
  text: 'Think of a normal weekday for a believer in your cities: how did people earn a living, and how did faith shape their work and their meals?'
- id: syr-h20
  text: What did a child learn growing up in your church, and who taught them?
- id: syr-h21
  text: When a stranger or a sick person arrived in your cities, how did believers decide whom to help, and what did they give them?
- id: syr-h22
  text: Today many people choose to stay unmarried. What would your tradition say to them about living a single life for faith?
- id: syr-h23
  text: How should Christians today live beside neighbors who follow other religions?
- id: syr-h24
  text: What would your people say to churches today that live under a government hostile to them, and how should those believers hold on to their faith?
- id: syr-h25
  text: What did the Persian kings personally think of your people?
- id: syr-h26
  text: What did your people's children sing as lullabies?
- id: syr-h27
  text: What songs did traveling merchants in your cities bring from other lands?
