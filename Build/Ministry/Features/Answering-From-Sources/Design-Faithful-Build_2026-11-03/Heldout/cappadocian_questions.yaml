- id: cappadocian-h01
  text: What did your church believe about the Trinity?
- id: cappadocian-h02
  text: What place did the Council of Nicaea have in your church, and how did ordinary believers come to understand what it taught about God?
- id: cappadocian-h03
  text: How did your people think about the Holy Spirit?
- id: cappadocian-h04
  text: What did your church teach about what happens to a person after death?
- id: cappadocian-h05
  text: What did your church teach about how human beings were made?
- id: cappadocian-h06
  text: How did your church baptize new members?
- id: cappadocian-h07
  text: What happened when your congregation gathered to worship together?
- id: cappadocian-h08
  text: How did monks and nuns in your tradition organize their daily life together?
- id: cappadocian-h09
  text: How did your people pray, both in church and at home?
- id: cappadocian-h10
  text: What role did reading the Bible play in your church's worship and private life?
- id: cappadocian-h11
  text: Who were the most important teachers in your church?
- id: cappadocian-h12
  text: Tell me about the women of your church, including the nuns and the widows, and what roles they held in worship and community life.
- id: cappadocian-h13
  text: Who held leadership in a village congregation?
- id: cappadocian-h14
  text: What kind of families supported your church, and how did the landowning families relate to village congregations?
- id: cappadocian-h15
  text: What happened in your church after the Council of Nicaea?
- id: cappadocian-h16
  text: How did your people react when the empire made the Nicene faith law, and what did that mean for ordinary congregations in villages and towns?
- id: cappadocian-h17
  text: Which events did your people remember most from these years?
- id: cappadocian-h18
  text: How did changes in the emperor's religion affect your church?
- id: cappadocian-h19
  text: What happened when two men both claimed to be the rightful bishop of the same city?
- id: cappadocian-h20
  text: How did your church deal with people who disagreed with its teaching about God, and what happened to those who would not accept it?
- id: cappadocian-h21
  text: How did your church relate to the pagan Greek schools and learning around it?
- id: cappadocian-h22
  text: What tensions existed between bishops, monks and village congregations?
- id: cappadocian-h23
  text: Describe a normal week for a believer in a highland village, from work in the fields to time spent at church with neighbors and family.
- id: cappadocian-h24
  text: How did landowning families treat the people who worked their land?
- id: cappadocian-h25
  text: How did families in the highlands get food through the long winters?
- id: cappadocian-h26
  text: How did people in your community mark births, marriages and funerals?
- id: cappadocian-h27
  text: Many churches today disagree about whether creeds should be required. What would your people say about requiring a creed of all believers?
- id: cappadocian-h28
  text: Today people argue about who should look after the sick and the homeless, the church or the government. What would your people say?
- id: cappadocian-h29
  text: What would your people say to someone today who prays alone and avoids organized church?
- id: cappadocian-h30
  text: Some people today want to preserve old monastic ways of life. What can modern communities learn from your monks and nuns?
- id: cappadocian-h31
  text: What was the name of the first person in your village to hear about the Council of Nicaea?
- id: cappadocian-h32
  text: What songs did village congregations sing, and what were the tunes?
- id: cappadocian-h33
  text: What did the shepherds in your hills quietly say to each other about the weather on the morning of a big feast day?
- id: cappadocian-h34
  text: What did the poor of your church say about the bishops among themselves?
- id: cappadocian-h35
  text: What were the exact words spoken at the very first baptism in your church?
