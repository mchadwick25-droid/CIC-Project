- id: pahc-h01
  text: When your people talk about what happens after death, what do they expect, and how does that shape the way they live each day?
- id: pahc-h02
  text: What is the teaching about two ways of living?
- id: pahc-h03
  text: Who do your people say Jesus is?
- id: pahc-h04
  text: What do your people believe about forgiveness of sins?
- id: pahc-h05
  text: What happens when someone is baptized in your church?
- id: pahc-h06
  text: How do your people pray, and how often?
- id: pahc-h07
  text: Do your people ever go without food on purpose, and if so, when and why?
- id: pahc-h08
  text: How does your church decide who may join the shared meal, and what must a person do or learn before they are allowed to sit with you?
- id: pahc-h09
  text: How do you welcome a visitor from another city?
- id: pahc-h10
  text: Who opens their home for the meeting, and what do they do?
- id: pahc-h11
  text: Who were the teachers your people respect most, apart from the apostles themselves?
- id: pahc-h12
  text: Which women and men have important roles among your people?
- id: pahc-h13
  text: Over these years, how did the leadership of a local church change, and what were the reasons people gave for moving from elders to a single bishop?
- id: pahc-h14
  text: What are the most important events your people remember since the apostles' time?
- id: pahc-h15
  text: Tell me about a time when one church sent help to another city.
- id: pahc-h16
  text: How do your neighbors in the city, who do not share your faith, usually speak about your gatherings, and how do your people respond to them?
- id: pahc-h17
  text: How do you handle teachers who say wrong things about Jesus?
- id: pahc-h18
  text: What do you do when officials order you to honor the emperor with a sacrifice?
- id: pahc-h19
  text: How do your people and the synagogue communities relate to each other?
- id: pahc-h20
  text: 'Walk me through an ordinary week for a family in your church: when they work, when they meet with the others, and what they do at home.'
- id: pahc-h21
  text: How do you greet each other when you meet?
- id: pahc-h22
  text: How do far-apart groups stay in touch?
- id: pahc-h23
  text: What do parents teach children in your households?
- id: pahc-h24
  text: Many modern churches own large buildings and have paid staff. What would your people think about a church that has no building of its own and meets in someone's home?
- id: pahc-h25
  text: How would your people feel about sharing a meal with strangers online instead of in a home?
- id: pahc-h26
  text: Many people today say they are spiritual but do not belong to any church. What would your people say to them?
- id: pahc-h27
  text: Do you know how the first groups of believers in your city chose which homes to meet in, and who owned those homes and paid for the food?
- id: pahc-h28
  text: What did the women of your households wear to meetings?
- id: pahc-h29
  text: What was the name of the first person baptized in your city?
- id: pahc-h30
  text: If a widow has no family to support her, what happens to her among your people?
