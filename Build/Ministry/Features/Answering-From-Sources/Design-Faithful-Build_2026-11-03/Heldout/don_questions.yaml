- id: don-h01
  text: What makes a church the true church?
- id: don-h02
  text: If a priest has done something seriously wrong, what happens to the sacraments he gives, and how did your people decide what to do about it?
- id: don-h03
  text: What did your people believe about Christians who gave up their faith under pressure and later wanted to return?
- id: don-h04
  text: Did your people believe anything different from the other church about God and Christ?
- id: don-h05
  text: What did your people hope would happen to them after death?
- id: don-h06
  text: Did your people fast, and were there certain days or seasons of the year when they did?
- id: don-h07
  text: How did your people honor their martyrs?
- id: don-h08
  text: What was worship like in a typical town church?
- id: don-h09
  text: How did your people choose and install a new bishop in a city?
- id: don-h10
  text: How did your people hold funerals and bury their dead?
- id: don-h11
  text: Who led your church in a small town?
- id: don-h12
  text: Which kinds of people were drawn to your church, and why?
- id: don-h13
  text: Which leaders did your people admire most, and what made them admired?
- id: don-h14
  text: How did the split begin in Carthage, and how did it spread from there to other towns across Numidia and the rest of the region?
- id: don-h15
  text: Did the emperor ever send officials or soldiers to deal with your church, and what happened when they came?
- id: don-h16
  text: What was the Diocletian persecution like for Christians in your region?
- id: don-h17
  text: Why could the two churches not simply reconcile?
- id: don-h18
  text: What arguments did the other church use against your people?
- id: don-h19
  text: Did your people ever meet the other church's bishops face to face to debate?
- id: don-h20
  text: What did your people argue about who should own the church buildings?
- id: don-h21
  text: When your people met Christians from the rival church in the same town, how did they deal with each other in markets, families and public life?
- id: don-h22
  text: What work did most members of your church do to earn a living?
- id: don-h23
  text: How did families teach children the faith at home?
- id: don-h24
  text: A government today may try to force one religious group to accept another. What would your people say about state power over church matters?
- id: don-h25
  text: Should a religious community ever separate itself from a larger body to keep its standards? What would your people say?
- id: don-h26
  text: What would your people think of Christians from different churches sharing one meeting place today?
- id: don-h27
  text: What did an ordinary farm family in your church say to each other at the table the night before they were rebaptized?
- id: don-h28
  text: Was there a favorite song or saying that a woman in your congregation hummed or repeated while she worked at home?
- id: don-h29
  text: Did your people keep written records of ordinary members, such as births, marriages and deaths, and where would those records be kept?
