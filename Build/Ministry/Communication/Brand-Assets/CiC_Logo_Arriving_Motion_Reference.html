<title>Arriving - motion implementation V1.0</title>
<!-- Church in Conversation - "Arriving" logo motion, IMPLEMENTATION REFERENCE.
     Lifted from Build/Ministry/Communication/CiC_Logo_Motion_Study_V0_1.html (V0.8,
     Mark: "this is it") and updated to the refined R1 geometry: opening widened
     to +/-50deg (dasharray 260/100, offset -50), dot r6.5 at (88.5,50).
     BINDING RULES (Logo & Motion Brief V1.0 sect.4):
     - one motion, once per page arrival; nothing else in the identity moves
     - the dot NEVER enters the circle; nothing ever pulls it
     - the opening is constant; the mark never reacts to the cursor
     - never spin / bounce / pulse-at-alert-speed / move-to-attract-a-click
     - prefers-reduced-motion gets the completed still mark as a full experience
     - phantom-dot trap: ring holds opacity 0 until the draw begins (a
       zero-length rounded-cap stroke renders a phantom dot) -->
<style>
  :root{ --parchment:#F7F3EB; --ink:#2A2521; --madder:#A13E2B; }
  @media (prefers-color-scheme: dark){
    :root{ --parchment:#221B13; --ink:#EDE5D6; --madder:#CB6E52; } }
  :root[data-theme="dark"]{ --parchment:#221B13; --ink:#EDE5D6; --madder:#CB6E52; }
  :root[data-theme="light"]{ --parchment:#F7F3EB; --ink:#2A2521; --madder:#A13E2B; }
  body{ background:var(--parchment); margin:0; min-height:100vh;
    display:grid; place-items:center; font-family:Georgia,serif; }
  .arriving-ring{ fill:none; stroke:var(--ink); stroke-width:11;
    stroke-linecap:round; stroke-dasharray:0 360; stroke-dashoffset:-50; opacity:0; }
  .arriving-seat{ fill:var(--madder); transform-origin:88.5px 50px;
    transform:translate(0,-6px); }
  .arriving.play .arriving-ring{
    animation:cic-buildC 1300ms cubic-bezier(.4,0,.2,1) 800ms both; }
  .arriving.play .arriving-seat{
    animation:cic-sitdown 600ms cubic-bezier(.3,0,.35,1.4) 2400ms both,
              cic-breath 5.5s ease-in-out 3750ms infinite; }
  /* build: one stroke from the LOWER lip (path pos 50 = 50deg), sweeping
     bottom -> far side -> top, completing at the upper lip. Single-ended only. */
  @keyframes cic-buildC{
    0%{ stroke-dasharray:0 360; stroke-dashoffset:-50; opacity:0; }
    4%{ opacity:1; }
    100%{ stroke-dasharray:260 100; stroke-dashoffset:-50; opacity:1; } }
  @keyframes cic-sitdown{
    0%{ transform:translate(0,-6px); }
    62%{ transform:translate(0,1px) scale(1.1,.86); }
    100%{ transform:translate(0,0) scale(1,1); } }
  @keyframes cic-breath{ 0%,100%{ opacity:1; } 50%{ opacity:.76; } }
  @media (prefers-reduced-motion: reduce){
    .arriving.play .arriving-ring, .arriving.play .arriving-seat{ animation:none; }
    .arriving .arriving-ring{ stroke-dasharray:260 100; stroke-dashoffset:-50; opacity:1; }
    .arriving .arriving-seat{ transform:translate(0,0); } }
</style>
<span class="arriving play">
  <svg width="220" height="220" viewBox="0 0 100 100" role="img"
    aria-label="A single red dot waits alone; a table is drawn around toward it, the doorway completing last; the dot sits down and breathes">
    <circle class="arriving-ring" cx="50" cy="50" r="31" pathLength="360"/>
    <circle class="arriving-seat" cx="88.5" cy="50" r="6.5"/>
  </svg>
</span>
