<title>Table &amp; Chair — companion illustration motion V1.0</title>
<!-- Church in Conversation - companion-illustration motion, IMPLEMENTATION REFERENCE.
     Mark, 2026-07-18: "the only thing i would like to add to the chair is the same
     concept of motion, the chair being pulled in."
     THE SEQUENCE: the table first (the record, already there) - then the chair is
     PULLED UP from off-right, decelerating, a small settle at the decided gap.
     Once, then stillness.
     BINDING RULES:
     - the pull stops at the decided 5.5-unit gap: the chair is pulled OUT for the
       guest, never tucked under the table (the gap is the meaning - spec:
       CiC_Brand_Mark_TableChair_V0_1.md)
     - the chair does not breathe: in the logo the madder element is the guest
       (alive); here it is the invitation (furniture, still)
     - one motion, once; never replays unbidden; never pulses or bounces
     - prefers-reduced-motion gets the completed still illustration
     - never plays adjacent to the logo's motion in one view (the adjacency guard
       extends to motion: two table-stories at once read as two brands) -->
<style>
  :root{ --parchment:#F7F3EB; --iron-gall:#2A2521; --madder:#A13E2B; }
  @media (prefers-color-scheme: dark){
    :root{ --parchment:#221B13; --iron-gall:#EDE5D6; --madder:#CB6E52; } }
  :root[data-theme="dark"]{ --parchment:#221B13; --iron-gall:#EDE5D6; --madder:#CB6E52; }
  :root[data-theme="light"]{ --parchment:#F7F3EB; --iron-gall:#2A2521; --madder:#A13E2B; }
  body{ background:var(--parchment); margin:0; min-height:100vh; display:grid;
    place-items:center; font-family:Georgia,serif; color:var(--iron-gall);}
  .wrap{ text-align:center;}
  .row{ display:flex; gap:2.5rem; align-items:flex-end; justify-content:center;}
  svg{ display:block; overflow:hidden;}
  .tc-table{ stroke:var(--iron-gall); stroke-width:2.8; stroke-linecap:round; fill:none;}
  .tc-chair{ stroke:var(--madder); stroke-width:2.8; stroke-linecap:round; fill:none;}
  .tc.play .tc-chair{ animation:cic-pullup 950ms cubic-bezier(.2,.7,.25,1) 450ms both;}
  /* pulled up from off-right; momentum carries a hair past, settles at the gap */
  @keyframes cic-pullup{
    0%{ transform:translateX(15px); }
    88%{ transform:translateX(-0.8px); }
    100%{ transform:translateX(0); } }
  @media (prefers-reduced-motion: reduce){
    .tc.play .tc-chair{ animation:none; } }
  button{ font-family:system-ui,sans-serif; font-size:.8rem; margin-top:1.4rem;
    background:none; border:1px solid var(--iron-gall); color:var(--iron-gall);
    border-radius:6px; padding:.4rem 1rem; cursor:pointer; opacity:.75;}
  .cap{ font-family:system-ui,sans-serif; font-size:.68rem; letter-spacing:.08em;
    opacity:.6; margin-top:.4rem;}
</style>
<div class="wrap">
  <div class="row">
    <div><span id="m1" class="tc play" style="display:inline-block">
      <svg width="192" height="192" viewBox="0 0 32 32" role="img"
        aria-label="A table stands; a chair is pulled up from the right and settles, left deliberately pulled out">
        <g class="tc-table">
          <path d="M3.5 13 h12"/><path d="M6 13 v12"/><path d="M13.5 13 v12"/>
        </g>
        <g class="tc-chair">
          <path d="M27 8 v17"/><path d="M27 17 h-6"/><path d="M21.5 17 v8"/>
        </g>
      </svg></span>
      <div class="cap">192</div></div>
    <div><span class="tc play" style="display:inline-block">
      <svg width="48" height="48" viewBox="0 0 32 32">
        <g class="tc-table"><path d="M3.5 13 h12"/><path d="M6 13 v12"/><path d="M13.5 13 v12"/></g>
        <g class="tc-chair"><path d="M27 8 v17"/><path d="M27 17 h-6"/><path d="M21.5 17 v8"/></g>
      </svg></span>
      <div class="cap">48</div></div>
  </div>
  <button onclick="document.querySelectorAll('.tc').forEach(el=>{el.classList.remove('play');void el.offsetWidth;el.classList.add('play');})">Replay</button>
</div>
