  - id: m9-inertness-proof
    gate: inertness
    layer: M9
    note: >
      The M9 mirror of inertness-proof above: every check in
      engine/m9/confinement.py's CHECKS must (a) fire on at least one
      defect above and (b) pass clean on the unmutated fixture. A check
      that never fires is inert and engine/m9/selftest.py must report that
      as its own failure, the same contract engine/m1/selftest.py already
