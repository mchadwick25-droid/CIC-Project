---
# Stage 0.6 deliverable (Build-Blueprint.md §5): every gate in the Artifact-1 §6
# battery, plus the hand rules and the two M3-admission-scope defects called out
# by the blueprint's stage-0.6 line, enumerated and mapped to what must catch
# them. This file is DATA, not code: stage 1's M1 selftest (and stage 4's
# admission harness) reads it, applies each mutation to an in-memory copy of
# records/fix/**, runs the relevant battery, and asserts the named check fires -
# and that it stays silent on the unmutated clean fixture (the anti-inertness
# proof, spec principle 12 / Artifact-1 §6 "inertness").
#
# mutation.op vocabulary (small, closed, for the stage-1 harness to interpret):
#   set_field       - set path to value
#   delete_field    - remove path entirely
#   add_field       - add an undeclared path (schema/unevaluatedProperties test)
#   remove_record   - delete a whole record file from the copy
#
# target_kind (Library Access Gate D3, increment 3 - engine/m9/selftest.py
# only; M1/M3 defects above have no target_kind and are always records):
#   record (default) - target_record + mutation, applied to records/fix/**
#                       exactly as above (engine.m1.mutate.apply, reused)
#   bucket            - target_row (a row_id) + mutation, applied to a deep
#                       copy of cic/corpus-map/fixture-synthetic.yaml's raw
#                       `works` list, before build_shelf() ever runs
#   pairs             - target_pair_a + target_pair_b + mutation, applied to
#                       a deep copy of cic/corpus-map/PAIRS.yaml's raw
#                       `pairs` list
# bucket/pairs mutations never touch a file - engine/m9/selftest.py mutates
# the in-memory data loader.py already read, the same discipline the
# record case already holds.

schema_version: 1
fixture_world: fix
clean_baseline: records/fix/**   # plus records/_fleet/** and records/worlds.yaml

defects:
  - id: schema-unevaluated-property
    gate: schema-validation
    layer: M1
    target_record: records/fix/term/fix.term.the-way.md
    mutation: {op: add_field, path: extra_field, value: true}
    expected_failure: "hard error - unknown field 'extra_field' (unevaluatedProperties: false, Artifact-1 §6)"

  - id: referential-dangling-relation
    gate: referential
    layer: M1
    target_record: records/fix/term/fix.term.the-way.md
    mutation: {op: set_field, path: "relations[0].target", value: fix.term.nonexistent-xyz}
    expected_failure: "relation target fix.term.nonexistent-xyz does not resolve to any record"

  - id: reciprocity-missing-inverse
    gate: reciprocity
    layer: M1
    target_record: records/fix/term/fix.term.the-three.md
    mutation: {op: delete_field, path: "relations[0]"}
    expected_failure: "fix.term.the-way declares associated-with -> fix.term.the-three but the reverse is not declared (associated-with is symmetric, both directions required)"

  - id: completion-missing-required-field
    gate: completion-per-type
    layer: M1
    target_record: records/fix/story/fix.story.the-long-road.md
    mutation: {op: delete_field, path: narrative_tier}
    expected_failure: "story record missing required type field narrative_tier"

  - id: narratability-tier-out-of-range
    gate: narratability
    layer: M1
    target_record: records/fix/story/fix.story.the-long-road.md
    mutation: {op: set_field, path: narrative_tier, value: 5}
    expected_failure: "narrative_tier 5 outside the declared 1-4 range"

  - id: glossary-retrofit-missing-false-friend
    gate: glossary-retrofit-complete
    layer: M1
    target_record: records/fix/term/fix.term.the-way.md
    mutation: {op: delete_field, path: false_friend}
    expected_failure: "term missing required field false_friend - omitting the key is not the same as the typed empty-list 'none identified' state"
    note: "Redesign-Spec/Glossary-Story-Quote-Template.md's own retrofit gate - proves gate_glossary_retrofit_complete distinguishes 'field absent' (a real defect) from 'false_friend: []' (a valid, complete answer), which a plain completion-per-type blank check would get wrong."

  - id: quote-recording-invalid-license
    gate: quote-recording
    layer: M1
    target_record: records/fix/quote/fix.quote.private-teaching.md
    mutation: {op: set_field, path: license, value: maybe}
    expected_failure: "license 'maybe' is not one of verbatim | paraphrase-only"

  - id: quote-recording-missing-modern-rendering
    gate: quote-recording
    layer: M1
    target_record: records/fix/quote/fix.quote.private-teaching.md
    mutation: {op: delete_field, path: modern_rendering}
    expected_failure: "quote missing required field modern_rendering - text is the record's own verified original wording, never itself the spoken form"
    note: "the library ruling that a non-English original can be primary evidence, with modern_rendering as its own translation, extended to a fleet-wide rule (item 3): every quote requires modern_rendering, not only non-English-sourced ones - one rule, no per-record carve-out a builder has to remember to check."

  - id: alias-safety-unsafe-collision
    gate: alias-safety
    layer: M1
    target_record: records/fix/term/fix.term.the-way.md
    mutation: {op: set_field, path: false_friend, value: ["The Three"]}
    expected_failure: "false_friend value 'The Three' collides with fix.term.the-three's world_word with no disambiguating note - an unsafe alias"

  - id: distribution-health-flattened-tiers
    gate: distribution-health
    layer: M1
    target_record: "all chunk-feeding records in records/fix/** (term, story, ambient, doctrinal_witness)"
    mutation: {op: set_field, path: retrieval.tier, value: 1, note: "applied to every chunk-feeding record in the copy, not just one"}
    expected_failure: "world's retrieval-tier distribution is degenerate (all tier 1, no tier 2/3 spread) - a report-only-turned-blocking signal per the fixture's designed spread"

  - id: retrieval-negatives-structured-dnrw-regression
    gate: retrieval-negatives-structured
    layer: M1
    target_record: records/fix/term/fix.term.the-way.md
    mutation: {op: set_field, path: retrieval.do_not_retrieve_when, value: ["participant asks about baptism - retrieve fix.term.the-three instead"]}
    expected_failure: "retrieval.do_not_retrieve_when is populated - R11's split (Rulings-Pending.md) retired this field; the schema keeps it only for additive-only compatibility, and a populated one is a regression to the pre-split shape"

  - id: confidence-crosscheck-unjustified-null-divergence
    gate: confidence-crosscheck
    layer: M1
    target_record: records/fix/doctrinal_witness/fix.witness.who-is-jesus.md
    mutation: {op: set_field, path: confidence.verification_state, value: named-not-rechecked}
    expected_failure: "fix.witness.who-is-jesus now has formation_confidence=Documented, divergence_note=null, and verification_state=named-not-rechecked - divergence_note is required non-null in this state (Artifact-1 §3)"

  - id: rights-missing-status
    gate: rights
    layer: M1
    target_record: records/fix/source/fix.source.secondary-summary.md
    mutation: {op: delete_field, path: rights_status}
    expected_failure: "source has no rights_status - rights gate fails closed (spec: rights per record, fail-closed)"

  - id: edition-rights-consistency-missing-file
    gate: edition-rights-consistency
    layer: M1
    target_record: records/fix/source/fix.source.witness-scroll.md
    mutation: {op: set_field, path: edition, value: "Fixture Edition 1, vendored as cic/texts/fixture-nonexistent-file.txt"}
    expected_failure: "edition names cic/texts/fixture-nonexistent-file.txt, which does not exist on disk"

  - id: canonical-address-missing-file
    gate: canonical-address
    layer: M1
    target_record: records/fix/quote/fix.quote.witness-saying.md
    mutation: {op: set_field, path: "sources[0].address", value: "cic:fixture-nonexistent-file.txt:1.4"}
    expected_failure: "sources[0].address names cic/texts/fixture-nonexistent-file.txt, which does not exist on disk"

  - id: readability-quick-meaning-too-dense
    gate: readability
    layer: M1
    target_record: records/fix/term/fix.term.the-three.md
    mutation: {op: set_field, path: quick_meaning, value: "The triune hypostatic co-inherence of Father, Son, and Spirit as this community apprehended it prior to conciliar formalization."}
    expected_failure: "quick_meaning exceeds FK grade 10 (Artifact-1 §6 readability gate)"

  - id: readability-quote-modern-rendering-too-dense
    gate: readability
    layer: M1
    target_record: records/fix/quote/fix.quote.witness-saying.md
    mutation: {op: add_field, path: modern_rendering, value: "The unmediated testimonial witness persisted irrepressibly notwithstanding the deponent's own non-observation of the underlying event."}
    expected_failure: "modern_rendering exceeds FK grade 10 (Artifact-1 §6 readability gate) - text itself, the verbatim Level-3 wording, is never graded"

  - id: readability-voice-craft-identity-too-dense
    gate: readability
    layer: M1
    target_record: records/fix/voice_craft/fix.craft.vera-voice.md
    mutation: {op: set_field, path: identity, value: "The unmediated testimonial persona instantiates a composite epistemic witness whose evidentiary posture remains irreducibly bounded by the non-observation constraints inherent to secondhand transmission across the fixture's own bifurcated source ecology."}
    expected_failure: "voice_craft.identity exceeds FK grade 10 (readability gate, extended 2026-09-19 to voice_craft - this field compiles into every turn's own prompt, engine/m2/builders.py build_prompt())"

  - id: voice-craft-prompt-budget-flavor-notes-bloat
    gate: voice-craft-prompt-budget
    layer: M1
    target_record: records/fix/voice_craft/fix.craft.vera-voice.md
    mutation:
      op: set_field
      path: flavor_notes
      value:
        - {segment: pad-0, tag: bloat-test, note: "what belonging asked of the ones who stayed after the parting: the shared meal kept smaller, the names spoken quietly, the friends who no longer called, the work continued anyway without complaint or announcement"}
        - {segment: pad-1, tag: bloat-test, note: "the door kept open a little longer than seemed wise, the waiting that had no promised end attached to it, the small daily choosing that never once felt heroic to the one doing it"}
        - {segment: pad-2, tag: bloat-test, note: "what could honestly be claimed as seen against what was only heard secondhand from another's mouth, the difference held plainly, never blurred to make an answer sound larger than the evidence allowed"}
        - {segment: pad-3, tag: bloat-test, note: "the cost counted in ordinary hours rather than one dramatic moment: meals missed, work postponed, old friendships gone quiet, a name no longer spoken at the family table, none of it named as suffering"}
        - {segment: pad-4, tag: bloat-test, note: "the difference between a memory kept faithfully and a story reshaped afterward to sound more finished than the actual remembered event ever was, and the discipline of saying so plainly when the two had drifted"}
        - {segment: pad-5, tag: bloat-test, note: "the small daily choosing that added up to something only much later, never in a single dramatic turn but in a hundred unremarked mornings where the easier path was available and was not taken"}
        - {segment: pad-6, tag: bloat-test, note: "the naming of what was not known rather than a confident filling of the gap with something that merely sounded plausible enough to satisfy a listener who wanted a tidier answer than the record allowed"}
        - {segment: pad-7, tag: bloat-test, note: "the particular ache of being asked to explain a conviction in words that never quite carried the weight the conviction itself had carried when it was first formed, admitted rather than papered over"}
        - {segment: pad-8, tag: bloat-test, note: "the way an old friendship changed shape without ending outright, the visits growing further apart, the conversation turning careful, neither side naming aloud what both could plainly feel had shifted between them"}
        - {segment: pad-9, tag: bloat-test, note: "the quiet refusal to perform certainty for an audience that wanted the story simpler than it actually was, holding instead to the plainer and less satisfying true account of what had actually happened"}
        - {segment: pad-10, tag: bloat-test, note: "the particular weight of a promise kept past the point where anyone was left to notice it was being kept at all, continued anyway out of a loyalty that asked for no witness"}
        - {segment: pad-11, tag: bloat-test, note: "the slow, unglamorous work of staying rather than the single dramatic act of arriving, counted in the unremarked returns rather than in any one memorable entrance anyone later chose to retell afterward"}
        - {segment: pad-12, tag: bloat-test, note: "the discipline of distinguishing a genuinely shared memory from one merely repeated so often between friends that it had come, over time, to feel shared even where it plainly was not so"}
        - {segment: pad-13, tag: bloat-test, note: "the honest naming of a silence in the record rather than a confident guess dressed up to sound like knowledge, spoken once and then set aside rather than returned to again and again"}
        - {segment: pad-14, tag: bloat-test, note: "the plain fact that a witness who was not present says so directly, without hedging it into vagueness or dressing the gap up as a kind of modesty it was never meant to be"}
        - {segment: pad-15, tag: bloat-test, note: "the weight of an ordinary Tuesday spent doing the same small tasks as before, unremarked and unrewarded, carried without any expectation that it would ever be noticed or named by anyone else at all"}
        - {segment: pad-16, tag: bloat-test, note: "the honest distance between what a witness wants to be true and what the witness can actually stand behind as seen, held apart deliberately rather than allowed to blur into one comfortable account"}
        - {segment: pad-17, tag: bloat-test, note: "the long habit of returning to the same small kindness on the same hard days, not because it solved anything but because it was the one thing that could honestly still be offered"}
        - {segment: pad-18, tag: bloat-test, note: "the particular loneliness of holding a conviction that most of the old friends had quietly stopped sharing, carried without bitterness and without the need to argue anyone back into agreement"}
        - {segment: pad-19, tag: bloat-test, note: "the plain, unglamorous fact that most of what mattered here happened in rooms with no one else present to record it, which is itself part of what this witness can and cannot claim"}
        - {segment: pad-20, tag: bloat-test, note: "the way a shared meal grew quieter over the years without either side naming why, each still arriving, each still leaving a little earlier than the year before, neither one saying it aloud"}
        - {segment: pad-21, tag: bloat-test, note: "the plain difference between a thing remembered and a thing merely repeated so many times among friends that it had begun, wrongly, to feel remembered, a distinction worth holding even when it cost something"}
        - {segment: pad-22, tag: bloat-test, note: "the ordinary discipline of saying only as much as could honestly be stood behind, turned away from the temptation to round a thin account up into something that sounded more finished than it was"}
        - {segment: pad-23, tag: bloat-test, note: "the long patience of continuing a small daily kindness with no expectation it would ever be seen, recorded, or thanked, offered simply because it was still the one honest thing left to give"}
        - {segment: pad-24, tag: bloat-test, note: "the honest admission that some questions this witness cannot answer at all, not from modesty but because the record itself, carefully checked again and again, simply does not reach that far"}
        - {segment: pad-25, tag: bloat-test, note: "the difference between a doubt spoken plainly and a doubt dressed up as a question meant only to be answered away, held apart deliberately so neither one is mistaken for the other"}
        - {segment: pad-26, tag: bloat-test, note: "the small unglamorous cost of a promise kept quietly for years after anyone else had stopped expecting it to be kept at all, carried on without complaint and without any need to be seen doing it"}
    expected_failure: "identity+guard+flavor_notes+characteristic_concerns totals well over 900 words (voice-craft-prompt-budget gate, added 2026-09-19 after gallic's own live-site complaint traced to exactly this failure mode - a record can pass readability field-by-field while still being far too long in total, since gate_readability grades individual sentences, not the compiled whole)"

  - id: canon-coverage-blank-cell
    gate: canon-coverage
    layer: M1
    target_record: records/fix/honest_limit/fix.limit.outsiders-fate.md
    mutation: {op: remove_record}
    expected_failure: "canon cell F6-T now has neither a substantive record nor an honest_limit - blank cell, coverage gate must fail (Artifact-1 §6 coverage rule)"

  - id: id-convention-cell-code-in-slug
    gate: id-convention
    layer: M1
    note: "mirrors the real defect this gate exists to catch - measured live on syr, where [[syr.dw.f2-e-decides]] and [[syr.dw.c-t-reading]] were each the cell code of one real witness spliced onto the slug of another. All 22 syr witness ids were in its prompt; the failure was too many near-identical addresses, not a missing one."
    target_record: records/fix/honest_limit/fix.limit.outsiders-fate.md
    mutation: {op: set_field, path: id, value: "fix.limit.f6-t-outsiders-fate"}
    expected_failure: "an honest_limit id carries a canon-cell code in its slug - the cell belongs in canon_cells, and a cell prefix in front of a slug is what the voice splices"

  - id: no-build-attribution-leaked-ruling
    gate: no-build-attribution
    layer: M1
    note: "mirrors the real defect this gate exists to catch (world/alexandria voice_craft.identity, fixed in c0a105a) - a build-process ruling attribution landing inside the compiled Identity field, ISO date and 'ruled by' both present"
    target_record: records/fix/voice_craft/fix.craft.vera-voice.md
    mutation: {op: set_field, path: identity, value: "Vera, Witness - a synthetic composite voice speaking for the fixture world's two short sources (RULED by Mark, 2026-08-21: name and role are the only sanctioned fabrications)."}
    expected_failure: "voice_craft.identity carries an ISO-format date and a 'ruled by' attribution - build-process language leaked into a field build_prompt() compiles into the live model's own Identity section"

  - id: voice-perspective-third-person-self-reference
    gate: voice-perspective
    layer: M1
    note: "mirrors the real defect this gate exists to catch (measured fleet-wide 2026-09-04: 250 genuine instances across all 8 built worlds' doctrinal_witness/term/story/honest_limit/ambient/demonstration fields - see CiC_Cross_System_Analysis_Tracking.md) - the Representative's voice describing its own world from outside, the way a builder names a world, never the way an inhabitant of it would. Single mutation exercises both the literal-phrase check and the it/its-chain check together, the same shape gate_no_build_attribution's own seeded defect uses to hit two of its patterns at once."
    target_record: records/fix/doctrinal_witness/fix.witness.who-is-jesus.md
    mutation: {op: set_field, path: text, value: "This world did not claim to have seen him. Its record says only that the ones who told it could not be talked out of what they had seen, and that it was worth this world's own lives changing because of it."}
    expected_failure: "doctrinal_witness.text speaks of \"this world\" and a following \"Its\" from outside, in the third person, instead of the we-voice register the approved sample already models"

  - id: sentinel-string-in-retrieval-block
    gate: schema-validation
    layer: M1
    note: "hand rule, Artifact-1 §3/§6 - sentinel strings rejected in retrieval blocks"
    target_record: records/fix/term/fix.term.the-way.md
    mutation: {op: set_field, path: retrieval.retrieve_when, value: "n/a"}
    expected_failure: "retrieve_when must be an array (possibly empty); the string 'n/a' is a forbidden sentinel, not a typed null"

  - id: canon-cells-reference-nonexistent-cell
    gate: referential
    layer: M1
    note: "hand rule, Artifact-1 §6 - canon_cells must exist in the canon (implemented as part of the referential gate: a canon_cells entry is a reference like any other, and must resolve)"
    target_record: records/fix/term/fix.term.the-three.md
    mutation: {op: set_field, path: canon_cells, value: ["F9-I"]}
    expected_failure: "F9-I is not a cell in the canon (only C and F1-F6 x I/E/P/T exist) - reference does not resolve"

  - id: quote-mark-fidelity-text-field-quoted
    gate: quote-mark-fidelity
    layer: M1
    note: "mirrors the real, already-shipped defect this gate exists to catch (commits fbb6557, 763c48d, 2026-09-19 - a tradition page rendered a clause in quotation marks that the records themselves declare unquotable). fix.quote.identity-collision-saying's own modern_rendering ('We never asked who you'd been before...') is what fix.front.fixture-synthetic's own clean tile already quotes (see that record's own body note); this mutation swaps in the same quote's archaic `text` field instead - Apparatus/Level-3-only, never quotable on a participant-facing surface, per Mark's standing quote ruling."
    target_record: records/fix/world_front/fix.front.fixture-synthetic.md
    mutation: {op: set_field, path: "skim.tile.text", value: "Testland's own record speaks for itself: \"We did not ask what a person had been before the water. We asked only what they carried after it.\""}
    expected_failure: "quotation-mark span matches fix.quote.identity-collision-saying's own `text` field verbatim - `text` is Apparatus/Level-3-only; the quoted form must come from `modern_rendering` (Mark's standing quote ruling)"

  - id: quote-verbatim-word-substitution
    gate: quote-verbatim
    layer: M1
    note: "item 3 registration (2026-09-23), R33/R35. fix.quote.witness-saying's own text is verbatim against cic/texts/fixture-synthetic_witness-scroll.txt (line 1.4); this mutation substitutes one word for a near-synonym - the exact shape the module's own docstring names as always-disallowed, regardless of how small: a word substitution is never a tolerated difference class, unlike an ellipsis-marked elision or a bracketed editorial insertion."
    target_record: records/fix/quote/fix.quote.witness-saying.md
    mutation: {op: set_field, path: text, value: "I did not see him. I only saw what his enemies could not stop telling."}
    expected_failure: "\"enemies\" for \"witnesses\" is a substituted word, not an allowed difference class (whitespace/case/punctuation/ellipsis/bracket/verse_number/apparatus) - verify_quote_text fails the segment"

  - id: inertness-proof
    gate: inertness
    layer: M1
    note: >
      Not a single mutated record - a meta-check over the stage-1 selftest run
      itself: every gate above must (a) fail on its own defect fixture and
      (b) pass on the unmutated clean fixture. A gate that fires on neither run
      is inert and the selftest must report that as its own failure
      (Artifact-1 §6 / spec principle 12: "a gate that never fails is checking
      nothing").
    target_record: null
    mutation: null
    expected_failure: "selftest harness asserts, per gate, at least one fixture in this catalog exercises it and that the clean fixture passes it"

  # --- M3-admission-scope defects (stage 4 harness, not an M1 gate) ---
  # Stage 0.6's job per the blueprint is only to enumerate + map these; the
  # firing proof is stage 4's ("catches a seeded register defect and a seeded
  # fabrication on the fixture world" - Build-Blueprint.md §5 stage 4 gate).

  - id: admission-register-invented-aphorism
    gate: admission-register-check
    layer: M3
    target_record: records/fix/demonstration/fix.demo.core-testimony.md
    mutation:
      op: set_field
      path: "exchange[1].text"
      value: "I did not see him myself, but faith is the bridge that carries us over the river of doubt - and that river runs through every heart, waiting."
    expected_failure: "the voice coins a quotable aphorism of its own (register statement 6: 'the voice never coins quotable lines of its own') - admission's register grading must flag this, not pass it as flavor"

  - id: admission-fabricated-source
    gate: admission-source-boundedness-check
    layer: M3
    target_record: records/fix/quote/fix.quote.witness-saying.md
    mutation: {op: set_field, path: "sources[0].source_id", value: fix.source.does-not-exist}
    expected_failure: "quote cites a source_id with no matching record in records/fix/source/ - a fabricated/unverifiable attribution; admission's fabrication-pressure probes must catch it under held-out paraphrase questioning of C-P"

  # --- M9 confinement-battery defects (Library Access Gate D3, engine/m9/)
  # increment 3 builds engine/m9/confinement.py's own battery, minus
  # locus-within-work (held for a later increment, once CM-4's locus_ids
  # exists on real data - no seeded defect for it here).

  - id: m9-source-kind-missing-kind
    gate: source-kind
    layer: M9
    target_kind: record
    target_record: records/fix/source/fix.source.witness-scroll.md
    mutation: {op: delete_field, path: kind}
    expected_failure: "fix.source.witness-scroll: no kind set (vendored | unvendored | absence)"

  - id: m9-shelf-row-dangling
    gate: shelf-row
    layer: M9
    target_kind: record
    target_record: records/fix/source/fix.source.witness-scroll.md
    mutation: {op: set_field, path: shelf_row, value: fixture-synthetic--does-not-exist}
    expected_failure: "fix.source.witness-scroll: shelf_row 'fixture-synthetic--does-not-exist' does not resolve to a row on this world's shelf"

  - id: m9-emic-vendored-only-cites-absence
    gate: emic-vendored-only
    layer: M9
    target_kind: record
    target_record: records/fix/ambient/fix.ambient.daily-bread.md
    mutation: {op: set_field, path: "sources[0].source_id", value: fix.source.lost-letters-absence}
    expected_failure: "fix.ambient.daily-bread: cites 'fix.source.lost-letters-absence', whose kind is 'absence' - an emic record may not ground itself in it"

  - id: m9-absence-probe-false-claim
    gate: absence-probe
    layer: M9
    target_kind: record
    target_record: records/fix/source/fix.source.lost-letters-absence.md
    mutation: {op: set_field, path: "absence_probes[0]", value: "I did not see him"}
    expected_failure: "fix.source.lost-letters-absence: absence_probes entry 'I did not see him' DOES window-match in cic/texts/fixture-synthetic_witness-scroll.txt - the claimed absence is false"
    note: "the probe string is fix.quote.witness-saying's own opening words - genuinely present in the witness scroll, proving the check actually reads the file rather than trusting the claim"

  - id: m9-verbatim-in-shelf-invented-text
    gate: verbatim-in-shelf
    layer: M9
    target_kind: record
    target_record: records/fix/quote/fix.quote.witness-saying.md
    mutation: {op: set_field, path: text, value: "This sentence was never written anywhere in the witness scroll."}
    expected_failure: "fix.quote.witness-saying: license is 'verbatim' but its text does not window-match in any file on this world's shelf"

  - id: m9-voicing-pair-exchange-not-confirmed
    gate: voicing-pair
    layer: M9
    target_kind: bucket
    target_row: fixture-synthetic--later-summary
    mutation: {op: set_field, path: documented_exchange, value: not-confirmed}
    expected_failure: "fix.ambient.daily-bread: cites 'fix.source.secondary-summary'; the pair is mutual-awareness but the row's own documented_exchange is 'not-confirmed', not confirmed"

  - id: m9-voicing-pair-relation-flipped
    gate: voicing-pair
    layer: M9
    target_kind: pairs
    target_pair_a: fixture-synthetic
    target_pair_b: fixture-synthetic-neighbour
    mutation: {op: set_field, path: relation, value: one-way}
    expected_failure: "fix.ambient.daily-bread: cites 'fix.source.secondary-summary'; the (fixture-synthetic, fixture-synthetic-neighbour) pair is ruled 'one-way', not mutual-awareness"
    note: "proves target_kind: pairs works independently of target_kind: bucket above - a different mutation, a different in-memory copy, the same check"

  - id: m9-shelf-confidence-needs-ruling
    gate: shelf-confidence
    layer: M9
    target_kind: bucket
    target_row: fixture-synthetic--witness-scroll
    mutation: {op: set_field, path: confidence, value: needs-ruling}
