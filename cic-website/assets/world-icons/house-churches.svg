       (70-200 CE, Antioch / Asia Minor / Rome - leaning Antioch & Asia Minor, the Greek East, more
       than Rome). Dress is Greek East: a HIMATION drawn up over the head (the veil) over a CHITON
       (undyed-linen tunic) - not the distinctly Roman palla/stola. Grounded: covered head (1 Cor 11,
       Corinth/Greek East; Chloe in 1 Cor 1:11), muted wool, no ornament (1 Tim 2:9, 1 Pet 3:3),
       the shared cup (agape); veil/modesty grounded in this world's own sources (1 Cor 11; Chloe in
       1 Cor 1:11), cup confirmed. Skin #D8B184, a warm Anatolian olive, grounds her complexion in her
       actual Greek-East setting (Antioch / Asia Minor) rather than a Roman/pale default. Complexion is
       inference (record silent), traced to the documented setting; the demographic-reference artifact
