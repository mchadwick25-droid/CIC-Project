<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A conversation — Church in Conversation</title>
<meta name="robots" content="noindex">
<meta name="description" content="Talk with a voice from early Christian history, built from that tradition's own surviving writings.">
<meta property="og:title" content="A conversation — Church in Conversation">
<meta property="og:description" content="Talk with a voice from early Christian history, built from that tradition&#x27;s own surviving writings.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://churchinconversation.com/talk.html">
<meta property="og:image" content="https://churchinconversation.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Three figures from different centuries of Christian history talk around a wooden table with a scroll and books.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  --parchment:#F6F6F2; --vellum:#FFFFFF;
  --ink:#2A2521;
  --ink-faded:#6C6257;
  --madder:#A13E2B;
  --rule:rgba(241,233,221,.16);
  --ground:#17130F; --surface:#1E1913;
  --text:#F1E9DD;
  --muted:#B8AEA1;
  --action:#E08C74;
  --sans:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}*{box-sizing:border-box}
html,body{height:100%}
/* flex column, not a fixed-height guess for .frame-wrap -- a hardcoded
   calc(100vh - <bar> - <feature-bar>) here made the same mistake
   atlas-v3.html's scope-note positioning already had to be fixed for
   once: the bars' real rendered height (font/line-height/padding, or
   wrapping on a narrow screen) doesn't match a guessed pixel constant,
   so the iframe below overflowed the viewport instead of filling it
   exactly. flex:1 fills whatever's actually left, no measuring needed. */
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}
a{color:var(--action)}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:.9rem;padding:.6rem 1rem;border-bottom:1px solid var(--rule);background:var(--surface)}
.bar a{display:inline-flex;align-items:center;min-height:36px;font-size:.9rem;font-weight:600;text-decoration:none}
.bar a:hover,.bar a:focus-visible{text-decoration:underline}
.wordmark{color:var(--muted);font-size:.85rem;margin-left:auto}
.feature-bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem 1rem;border-bottom:1px solid var(--rule);background:var(--surface)}
.feature-btn{font-size:.8rem;font-weight:700;color:var(--text);text-decoration:none;padding:.4rem .9rem;
  border:1px solid var(--rule);border-radius:999px;min-height:34px;display:inline-flex;align-items:center}
.feature-btn:hover,.feature-btn:focus-visible,.feature-btn[aria-current="page"]{border-color:var(--action);color:var(--action)}
.frame-wrap{flex:1 1 auto;min-height:0}
iframe{display:block;width:100%;height:100%;border:0}
.js-note{padding:2rem 1.25rem;max-width:34rem;margin:0 auto;text-align:center;font-family:var(--sans);color:var(--muted)}
</style>
</head>
<body>

<div class="bar">
  <a id="back-link" href="index.html#who">← Back</a>
  <span class="wordmark">Church <em>in</em> Conversation</span>
</div>
<div class="feature-bar" aria-label="Main features">
  <a class="feature-btn" href="atlas-v3.html">Church Family Tree</a>
  <a class="feature-btn" id="feature-interview" href="index.html#who">Conversation with One</a>
  <a class="feature-btn" id="feature-table" href="table.html">Build a Table</a>
</div>

<div class="frame-wrap">
  <noscript><p class="js-note">This page needs JavaScript to open the conversation.</p></noscript>
  <iframe id="talk-frame" title="Conversation" allow="clipboard-write"></iframe>
</div>

<script>
(function(){
"use strict";
var params = new URLSearchParams(window.location.search);
var worlds = params.get('worlds');
var mode = params.get('mode') || 'interview';
var from = params.get('from');

var currentBtn = document.getElementById(mode === 'table' ? 'feature-table' : 'feature-interview');
if (currentBtn) { currentBtn.setAttribute('aria-current', 'page'); }

if (from) {
  document.getElementById('back-link').setAttribute('href', from);
}

var isLocal = ['localhost','127.0.0.1'].indexOf(window.location.hostname) !== -1;
var APP = isLocal ? 'http://localhost:5173' : 'https://cic-engine.onrender.com';

var target = new URL(APP + '/');
if (worlds) { target.searchParams.set('worlds', worlds); }
target.searchParams.set('mode', mode);
if (window.location.hash.indexOf('#q=') === 0) { target.hash = window.location.hash.slice(1); }

var frame = document.getElementById('talk-frame');
frame.src = target.toString();

// The embedded app's own "Leave for now"/"Begin again" posts this message
// instead of navigating itself when inside an iframe, and #back-link
// is already this page's own real, styled answer to "where does leaving
// go." ev.source restricts to
// exactly our own iframe - the only page that ever loads inside it is the
// one this script just pointed at target above.
window.addEventListener('message', function(ev) {
  if (ev.source !== frame.contentWindow) return;
  if (!ev.data || ev.data.type !== 'cic:leave') return;
  window.location.href = document.getElementById('back-link').getAttribute('href');
});
})();
</script>

</body>
</html>
