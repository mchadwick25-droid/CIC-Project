<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Narration sound test 2</title>
<style>
body{font:16px/1.4 system-ui,sans-serif;margin:0;padding:14px;background:#faf8f4;color:#222}
h1{font-size:1.3rem;margin:.2rem 0 .4rem;color:#a00}
.row{display:flex;gap:.4rem;margin:.45rem 0;align-items:stretch}
.row button.run{flex:1;font:inherit;padding:.7rem;border:1px solid #888;border-radius:8px;background:#fff;text-align:left}
.row button.run small{display:block;color:#555}
.row button.res{width:4.2rem;font:inherit;border:1px solid #888;border-radius:8px;background:#fff}
button#stop{display:block;width:100%;font:inherit;padding:.8rem;margin:.4rem 0;border:1px solid #888;border-radius:8px;background:#eee}
#log{white-space:pre-wrap;font:11px/1.3 ui-monospace,monospace;background:#fff;border:2px solid #a00;border-radius:8px;padding:8px;height:11rem;overflow:auto}
.note{color:#444;font-size:.92rem}
#stage audio{width:100%}
.slide{transform:translateX(100%);transition:transform .25s}
.slide.in{transform:none}
</style></head><body>
<h1>NARRATION SOUND TEST 2</h1>
<p class="note">For each test: tap Run, listen about 3 seconds, then tap Heard or Silent. Then STOP ALL and the next test.</p>
<div id="log"></div>
<button id="stop">STOP ALL</button>
<div id="rows"></div>
<div id="stage"></div>
<script>
const FILE='audio/stories/perpetua-and-felicity.mp3';
const logEl=document.getElementById('log'),stage=document.getElementById('stage'),t0=performance.now();
const say=s=>{logEl.textContent+=((performance.now()-t0)/1000).toFixed(1).padStart(5)+'s '+s+'\n';logEl.scrollTop=logEl.scrollHeight;};
const fresh=()=>FILE+'?v='+Math.random().toString(36).slice(2);
say('page loaded '+new Date().toISOString());say(navigator.userAgent);
let live=[];
function track(name,a){let n=0;const id=setInterval(()=>{n++;say(name+' t='+a.currentTime.toFixed(1)+' paused='+a.paused+' ready='+a.readyState+' rate='+a.playbackRate);if(n>=4)clearInterval(id);},800);live.push({a,id});}
function html(inner){stage.innerHTML=inner;return stage.querySelector('audio');}
const SRC=()=>'<audio controls preload="none"><source src="'+fresh()+'" type="audio/mpeg"></audio>';
const tests=[
 ['P1','Page audio with a source tag, play right away','how the map did it',()=>{const a=html(SRC());return a;}],
 ['P2','Page audio with src attribute, play right away','',()=>{stage.innerHTML='<audio controls preload="none" src="'+fresh()+'"></audio>';return stage.querySelector('audio');}],
 ['P3','Source tag, and pause three other audio players on play','the map pauses the others',()=>{const a=html('<audio controls preload="none"><source src="'+fresh()+'" type="audio/mpeg"></audio><audio controls preload="none"><source src="'+fresh()+'" type="audio/mpeg"></audio><audio controls preload="none"><source src="'+fresh()+'" type="audio/mpeg"></audio>');
   const all=[...stage.querySelectorAll('audio')];const me=all[0];stage.addEventListener('play',ev=>{all.forEach(x=>{if(x!==ev.target)x.pause();});},true);return me;}],
 ['P4','Source tag, inside a hidden area opened just before play','the map panel starts hidden',()=>{stage.innerHTML='<div id="box" inert>'+SRC()+'</div>';const box=document.getElementById('box');box.removeAttribute('inert');return box.querySelector('audio');}],
 ['P5','Source tag, speed set before and during play','the speed buttons',()=>{const a=html(SRC());a.defaultPlaybackRate=1;a.playbackRate=1;a.preservesPitch=true;a.addEventListener('play',()=>{a.playbackRate=1;a.defaultPlaybackRate=1;});return a;}],
 ['P6','Source tag, in a panel that slides in','',()=>{stage.innerHTML='<div class="slide" id="sl">'+SRC()+'</div>';const sl=document.getElementById('sl');requestAnimationFrame(()=>sl.classList.add('in'));return sl.querySelector('audio');}],
 ['P7','Source tag, extra controls added just before play','',()=>{const a=html(SRC());const d=document.createElement('div');d.textContent='Start narration automatically';stage.insertBefore(d,a);return a;}],
 ['P8','Detached new Audio()','this worked last time',()=>new Audio(fresh())],
];
const rows=document.getElementById('rows');
tests.forEach(([id,title,sub,make])=>{
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<button class="run">'+id+'. '+title+(sub?'<small>'+sub+'</small>':'')+'</button><button class="res" data-r="heard">Heard</button><button class="res" data-r="silent">Silent</button>';
  r.querySelector('.run').onclick=()=>{say('--- '+id+' ---');const a=make();['playing','pause','error','ratechange'].forEach(e=>a.addEventListener(e,()=>say(id+' event '+e)));track(id,a);const p=a.play();if(p&&p.then)p.then(()=>say(id+' play() ok'),e=>say(id+' play() rejected '+e.name));};
  r.querySelectorAll('.res').forEach(b=>b.onclick=()=>say('RESULT '+id+' '+b.dataset.r.toUpperCase()));
  rows.appendChild(r);
});
document.getElementById('stop').onclick=()=>{live.forEach(r=>{r.a.pause();clearInterval(r.id);});document.querySelectorAll('audio').forEach(a=>a.pause());say('--- stopped ---');};
</script></body></html>
