<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Narration sound test</title>
<style>
body{font:16px/1.4 system-ui,sans-serif;margin:0;padding:14px;background:#faf8f4;color:#222}
h1{font-size:1.3rem;margin:.2rem 0 .4rem;color:#a00}
button{display:block;width:100%;font:inherit;padding:.85rem;margin:.4rem 0;border:1px solid #888;border-radius:8px;background:#fff;text-align:left}
button small{display:block;color:#555}
#log{white-space:pre-wrap;font:11px/1.3 ui-monospace,monospace;background:#fff;border:2px solid #a00;border-radius:8px;padding:8px;height:12rem;overflow:auto}
.note{color:#444;font-size:.92rem}
audio{width:100%}
</style></head><body>
<h1>NARRATION SOUND TEST</h1>
<p class="note">Volume up. Tap ONE test, listen about 3 seconds, say to yourself heard or silent, tap Stop, then the next. The red box shows what the phone is doing.</p>
<div id="log"></div>
<button id="stop" style="background:#eee">STOP ALL</button>
<button id="t1">1. Short beep (a tiny sound, no narration)<small>checks the phone's audio output</small></button>
<button id="t2">2. Short beep, other method<small>checks Safari's audio engine</small></button>
<button id="t3">3. Narration: tap, then play<small>how a card starts today</small></button>
<button id="t4">4. Narration: fully downloaded first<small>wait for "ready" in the red box before tapping</small></button>
<button id="t5">5. Narration: load, then play</button>
<p class="note">6. Narration with the native player: press its play button yourself.</p>
<audio id="g6" controls preload="none"></audio>
<script>
const FILE='audio/stories/perpetua-and-felicity.mp3';
const logEl=document.getElementById('log');
const t0=performance.now();
const say=s=>{logEl.textContent+=((performance.now()-t0)/1000).toFixed(1).padStart(5)+'s '+s+'\n';logEl.scrollTop=logEl.scrollHeight;};
const fresh=()=>FILE+'?v='+Math.random().toString(36).slice(2);
say('page loaded '+new Date().toISOString());
say(navigator.userAgent);
say('audioSession: '+(navigator.audioSession?navigator.audioSession.type:'not supported')+' | userActivation: '+(navigator.userActivation?'yes':'no')+' | mp3: '+document.createElement('audio').canPlayType('audio/mpeg'));
function wavBlob(){
  const rate=8000,n=rate*1,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.round(Math.sin(2*Math.PI*440*i/rate)*12000),true);
  return new Blob([buf],{type:'audio/wav'});
}
let live=[];
function watch(name,a){
  ['loadstart','loadedmetadata','canplay','playing','pause','waiting','stalled','error'].forEach(e=>a.addEventListener(e,()=>say(name+' event '+e+(e==='error'&&a.error?' code '+a.error.code:''))));
  let n=0;const id=setInterval(()=>{n++;
    say(name+' t='+a.currentTime.toFixed(1)+' paused='+a.paused+' ready='+a.readyState+' net='+a.networkState+' muted='+a.muted+' vol='+a.volume+' decoded='+(a.webkitAudioDecodedByteCount===undefined?'n/a':a.webkitAudioDecodedByteCount));
    if(n>=6)clearInterval(id);},700);
  live.push({a,id});
}
function go(name,a,pre){
  say('--- '+name+' ---');watch(name,a);if(pre)pre();
  const p=a.play();if(p&&p.then)p.then(()=>say(name+' play() ok'),e=>say(name+' play() rejected: '+e.name));
}
document.getElementById('t1').onclick=()=>go('1 beep',new Audio(URL.createObjectURL(wavBlob())));
document.getElementById('t2').onclick=()=>{say('--- 2 beep (Web Audio) ---');try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();say('2 context state '+c.state);const o=c.createOscillator(),g=c.createGain();g.gain.value=.3;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();say('2 stopped')},1500);c.resume&&c.resume().then(()=>say('2 context '+c.state));}catch(e){say('2 error '+e.message)}};
let blobUrl=null;
fetch(fresh()).then(r=>r.blob()).then(b=>{blobUrl=URL.createObjectURL(b);say('4 ready (downloaded '+b.size+' bytes)');}).catch(e=>say('4 download failed '+e.message));
document.getElementById('t3').onclick=()=>go('3 narration',new Audio(fresh()));
document.getElementById('t4').onclick=()=>{if(!blobUrl){say('4 not ready yet');return;}go('4 downloaded',new Audio(blobUrl));};
document.getElementById('t5').onclick=()=>{const a=new Audio(fresh());go('5 load+play',a,()=>a.load());};
const g=document.getElementById('g6');g.src=fresh();watch('6 native',g);
document.getElementById('stop').onclick=()=>{live.forEach(r=>{r.a.pause();clearInterval(r.id);});document.querySelectorAll('audio').forEach(a=>a.pause());say('--- stopped ---');};
</script></body></html>
