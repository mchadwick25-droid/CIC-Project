  <!-- CiC world icon (V0.1 DRAFT, 2026-07-18) - Mar Yausep, covenant-teacher (malpana of the qyama),
       SYRIAC CHRISTIANITY (Edessa-Nisibis). ERA 2 (sits on the Era-2 ground #EDDEB9 light / #221A0E dark;
       the figure style is the same round-dome family template as Era 1). Supersedes the old pre-template
       V0.6 (old viewBox/teal bust). Verified against the world's own construction docs.
       ROLE (DOCUMENTED): a covenant-teacher being formed toward the Ihidaya (the "Single One") - explicitly
       NOT a bishop ("never a bishop's standing conferred by the laying on of hands") and NOT a desert monk
       (town-resident bnay qyama). So: no mitre, no episcopal insignia, no desert cowl, no cross.
       OBJECT (DOCUMENTED, identity-constitutive): the ONE harmonized Gospel (Diatessaron / Ewangeliyon
       da-Mhallete) - "the Gospel given you whole, one story rather than four kept apart... undivided." Drawn
       as a single closed Gospel book. CAVEAT: the record is SILENT on its physical form (codex vs scroll) -
       the emblem asserts "the one Gospel," NOT a binding. Rejected as unattested: lyre/instrument, cross,
       Rabbula-style illumination (586 CE, out of window), vow-token; and NO anti-Jewish/supersessionist motif.
       APPEARANCE = SILENT (garments, the old "girdle", beard, hair, complexion all absent from the record).
       Kept emblematic, INFERENCE flagged: muted-terracotta mantle, dark hair + dark beard (a younger
       town-teacher, vs Papnoute's grey desert beard), Levantine olive skin (#B58A5A - Option 3, Mark; deeper
       than Theon's Alexandrian tone, not as weathered as Papnoute's desert). World manifest
       colour is amber (#eab06b) - garment tint provisional pending role-pigment/era-tint. NOT LOCKED. -->
