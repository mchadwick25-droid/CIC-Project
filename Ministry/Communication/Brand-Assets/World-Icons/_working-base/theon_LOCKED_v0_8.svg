  <!-- CiC world icon (V0.8 DRAFT, 2026-07-18) - Theon, catechetical teacher (didaskalos).
       V0.8 (Mark): DRAPE REMOVED for now - back to plain white mantle + face + low scroll. (The himation
       swathe work is preserved in _working-base / prior versions if we revisit it.)
       ALEXANDRIA CATECHETICAL SCHOOL. Era 1 template (round dome silhouette + bbox x18-102, y30-150 as
       Chloe & Papnoute). V0.7 (Mark): the drape was reading as a flat blue RECTANGLE, not cloth - redrawn
       as an actual HIMATION swathe: a fold going OVER the shoulder, curved (not straight) edges that widen
       toward the hip, and interior fold-lines so it reads as draped fabric. Scroll sits low (V0.6) like the
       family's objects (Chloe's cup / Papnoute's jug).
       The drape is the FOLD OF THE CLASSICAL HIMATION / PALLIUM (everyday teacher's mantle) - deliberately
       NOT a liturgical vestment (epitrachelion / phelonion / orarion are later 4th-c.+ priestly garments,
       anachronistic for this 2nd-3rd-c. TEACHING world). Plain, no embroidery.
       GROUNDING: OBJECT = OPENED SCROLL held OUTWARD as a SHARED text (DOCUMENTED: "the scroll was
       opened... the passage turned to the light"; gravity C1, Scripture-as-door).
       APPEARANCE = SILENT and guarded; kept emblematic. INFERENCE, flagged: white robe + plain muted
       himation drape, short grey hair fringe, clean-shaven, medium-Mediterranean skin (#CDA478; grounded
       only in the DOCUMENTED cosmopolitan Alexandria/Egypt setting). Colours provisional pending era-tint. -->
