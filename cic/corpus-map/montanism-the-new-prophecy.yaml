  note: 'Same work, context row (per brief §11a): Eusebius describes these movements from
    outside and later, and for each of them the History is real evidence, not a passing mention.
    Books II-V are the principal external frame for the post-apostolic church and preserve
    otherwise-lost fragments (Papias, Hegesippus, the Antonine martyr acts). Book VI is the
    fullest ancient account of Origen and the catechetical school; V-VII cover Pantaenus,
    Clement and Dionysius. Book V.14-19 preserves the anti-Montanist dossier (the Anonymous,
    Apollonius) on which that Contested-Evidentiary entry largely rests. Books VI.43-45 and
    VII preserve Cornelius'' and Dionysius'' letters on Novatian - primary evidence for novatianism.
    Movements he merely mentions are deliberately not assigned.

    Also assigned to roman-church-third-century: Cornelius was bishop of Rome 251-253, squarely
    inside this world''s own window, and his letters preserved here are primary Roman-church
    material, not merely external testimony to novatianism. Surfaced by a source-research
    pass on Roman Church Third Century''s (I.33) sourcing gaps.

    '
  source_file: npnf201_eusebius-church-history-life-of-constantine.xml
- row_id: anf05_hippolytus-cyprian-caius-novatian--the-refutation-of-all-heresies-philosophumena
  work: The Refutation of All Heresies (Philosophumena)
  author: hippolytus
  locus: div2 3.3 - Books I, IV-X (II-III lost)
  role: context
  confidence: assigned
  note: 'The corpus''s most systematic heresiological source. Coverage derived by grep: Valentinus/Valentinians
    x96, Basilides x54, Marcion x32, Noetus x24, Elchasaites x28, Montanists x15, Ebionites
    x12. Assigned to the entries it describes and argues against, per the brief''s ruling
    that the doctrinal-floor and contested entries are valid targets; built worlds may draw
    on it for those entries only as register: etic. Book IX on Callistus (x96) is also a prime
    inside source for early 3rd-c. Roman church politics - covered by the separate needs-ruling
    row.

    '
  source_file: anf05_hippolytus-cyprian-caius-novatian.xml
