    this text falls outside this world''s own temporal window - it is the later Unity generation''s
    own voice, but not this world''s own tradition voice. role: context, not tradition: useful
    here as a comparison/ continuation reference (how the movement''s own discipline developed
    after this world''s own close), not as a floor-test or binding source. Its own proper
    tradition placement belongs to whichever Doc_02 eventually builds czech-churches-last-century.

    '
  source_file: unity-of-the-brethren_church-constitution_seifferth1866.txt
