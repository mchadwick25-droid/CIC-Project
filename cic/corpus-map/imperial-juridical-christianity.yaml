- row_id: philostorgius_ecclesiastical-history_walford1855--ecclesiastical-history-surviving-only-as-photius-epitome-3
  work: Ecclesiastical History (surviving only as Photius' Epitome)
  author: philostorgius
  locus: whole file - esp. Books IV-V (Rimini/Seleucia 359, Constantinople 360, the depositions
