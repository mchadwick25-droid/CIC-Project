- work: The Tome of St. Leo (Letter XXVIII)
  author: leo
  locus: div2 11.7 — The Tome of St. Leo
  role: tradition
  confidence: assigned
  note: 'Split out of the Chalcedon acts as the work a reader would name; the same text is
    also carried inside npnf212''s Letters of Leo (Letter XXVIII) - two vendored carriers,
    one work. Its rejection by the miaphysite tradition is covered by the Chalcedon context
    row above.

    '
  source_file: npnf214_seven-ecumenical-councils.xml
- work: The Nicene Creed
  author: nicene-creed
  locus: div1 11
  role: tradition
  confidence: assigned
  note: 'The conciliar creed of 325 (with the 381 form) — the central document of the imperial-juridical
    entry. Alexandria''s stake in it (the Athanasian defense) is noted for reviewers but the
    creed itself is filed with the councils.

    '
  source_file: anf07_lactantius-apostolic-constitutions-didache-liturgies.xml
- work: The Pilate Cycle (letters, reports and legends of Pilate)
  author: pilate-cycle
  locus: div2 7.18-7.24
  role: tradition
  confidence: needs-ruling
  note: 'Grouped as one body: Letter of Pontius Pilate; Report of Pilate (two forms); The
    Giving Up of Pilate; The Death of Pilate; The Narrative of Joseph; The Avenging of the
    Saviour. Christian compositions under Roman official personae, late antique to medieval;
    same era-guess placement and the same doubt as the Gospel of Nicodemus they travel with.

    '
  source_file: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac.xml
- work: The Ecclesiastical History of Socrates Scholasticus
  author: socrates
  locus: div1 2 — Books I-VII, 305-439
  role: tradition
  confidence: assigned
  note: 'Constantinopolitan continuation of Eusebius, written inside the Theodosian establishment
    and organized by imperial reigns - Socrates states that the church''s fortunes and the
    empire''s are intertwined, which is the ijc world''s own thesis. His own entry: the census
    has no Constantinopolitan-lay-historian bucket, and ijc (Rome, Constantinople, Milan,
    312-451) is where he stands.

    '
  source_file: npnf202_socrates-sozomen-ecclesiastical-histories.xml
- work: The Ecclesiastical History of Sozomen
  author: sozomen
  locus: div1 3 — Books I-IX, 324-425, with the Address to Theodosius II (div2 3.5)
  role: tradition
  confidence: assigned
  note: 'A lawyer at Constantinople writing under and for Theodosius II (the dedicatory Address
    is in this volume); church history framed by courts, laws and emperors. As with Socrates,
    ijc is his own entry''s nearest home in the census.

    '
  source_file: npnf202_socrates-sozomen-ecclesiastical-histories.xml
- work: The Sacred History (Chronica)
  author: sulpiciusseverus
  locus: div2 2.6 — The Sacred History of Sulpitius Severus
  role: tradition
  confidence: assigned
  note: 'World chronicle to c. 400 whose second book carries the fullest near-contemporary
    narrative of the Priscillianist affair - the trial and execution at Trier under Maximus,
    the first death sentence for heresy carried out by a Christian emperor. Church-and-state
    material squarely inside the built ijc world''s window.

    '
  source_file: npnf211_sulpitius-severus-vincent-lerins-cassian.xml
- work: Memorial (Relatio) of Symmachus, Prefect of the City
  author: symmachus
  locus: div2 5.1 and 5.3 — Memorial of Symmachus
  role: context
  confidence: assigned
  note: 'The pagan prefect''s plea for the restoration of the Altar of Victory - a non-Christian
    state paper, textbook role:context under brief §11a: the view of the imperial church from
    outside, printed here because Ambrose''s Epistle XVIII answers it point by point. Author
    ruled above.

    '
  source_file: npnf210_ambrose-select-works-letters.xml
- work: The Canons of the Synod of Antioch in Encaeniis
  author: synod-of-antioch-in-encaeniis
  locus: div2 8.6 — The Synod of Antioch in Encaeniis
  role: tradition
  confidence: provisional
  note: '341, the Dedication council: canons on episcopal and synodal order, received into
    the ecumenical corpus despite the council''s ambiguous place in the Arian struggle. Same
    church-law placement as Ancyra.

    '
  source_file: npnf214_seven-ecumenical-councils.xml
- work: The Canons of the Synod of Laodicea
  author: synod-of-laodicea
  locus: div2 8.7 — Synod of Laodicea
  role: tradition
  confidence: provisional
  note: '4th-c Phrygian canons on order, worship and (canons 59-60) the list of books to be
    read in church. Same church-law placement as Ancyra.

    '
  source_file: npnf214_seven-ecumenical-councils.xml
- work: The Ecclesiastical History of Theodoret
  author: theodoret
  locus: div2 3.8 — esp. Books I-II (Arian controversy), V (Ambrose and Theodosius)
  role: context
  confidence: assigned
  note: 'Same work, context row. The History''s arc is the Arian controversy from Nicaea to
    its defeat, preserving documents of the Arian/homoian side described from outside. Book
    V carries the Ambrose-Theodosius penance narrative and numerous imperial letters and edicts
    - evidence for ijc from an eastern observer. His Syriac notices (Jacob of Nisibis, Ephraim)
    were considered and not assigned: they are brief, and his real Syrian-monk source (Historia
    Religiosa) is not in this volume.

    '
