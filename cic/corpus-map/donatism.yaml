  note: 'Augustine''s sermon to the congregation of Caesarea in Mauretania in 418, given with
    the Donatist bishop Emeritus present, to persuade him to become Catholic (the editor''s
    Praefatio). It gives this world a pastoral sermon in the middle of the dispute, on the
    Maximianist schism inside Donatism (the Gesta cum Emerito say it dealt with the Maximianists
    only). The editor remarks that by style alone one would hardly take it for Augustine''s
    and still prints it as his own. One late manuscript, which the editor calls of little
    value and which he shares with the Gesta cum Emerito, so the text is less secure than
    the others here. No English translation is vendored. PRIMARY ORIGINAL per cic/texts/INTAKE.md:
    Petschenig''s critical text (CSEL 53, Vienna, 1910). The scan is raw, uncorrected OCR
    of a dense critical edition with the apparatus interleaved (the file''s own header and
    registry notes say so; about 88 to 90 percent of its word forms match the vocabulary of
    the clean TEI files, against 93 to 97 percent for those). So this row is primary for authorship
    and content, and a second witness for exact wording: each quote is checked against the
    printed page or a clean witness before it is used, and the English a Representative speaks
    is rendered from the verified Latin.

    '
  source_file: augustini_scripta-contra-donatistas-pars-i-iii_petschenig1908-1910.txt
