    source: 'NPNF 1 Prolegomena ''The Writings of St. Augustin'' (npnf101_augustine-confessions-letters.xml,
      id iv.4, Schaff''s list of Augustine''s works): Contra Gaudentium, the last anti-Donatist
      work (420)'
    formation_confidence: Widely Accepted
  note: 'Augustine''s reply, about 420, to Gaudentius, the Donatist bishop of Thamugadi, who
    threatened to burn himself and his congregation in their church rather than yield to the
    tribune Dulcitius. Book I answers his two letters sentence by sentence, quoting them;
    book II answers his reply. Gaudentius''s words survive quoted inside it: embedded voice,
    the work itself is Augustine''s. One manuscript survives, with a large gap in book I (chapters
    20 to 36). No English translation is vendored. PRIMARY ORIGINAL per cic/texts/INTAKE.md:
    Petschenig''s critical text (CSEL 53, Vienna, 1910). The scan is raw, uncorrected OCR
    of a dense critical edition with the apparatus interleaved (the file''s own header and
    registry notes say so; about 88 to 90 percent of its word forms match the vocabulary of
    the clean TEI files, against 93 to 97 percent for those). So this row is primary for authorship
    and content, and a second witness for exact wording: each quote is checked against the
    printed page or a clean witness before it is used, and the English a Representative speaks
    is rendered from the verified Latin.

    '
