    source: 'NPNF 1 Prolegomena ''The Writings of St. Augustin'' (npnf101_augustine-confessions-letters.xml,
      id iv.4, Schaff''s list of Augustine''s works): Ad Catholicos epistola contra Donatistas
      (402)'
    formation_confidence: Widely Accepted
  note: 'A pastoral letter to Catholic congregations on where the true church is, taught from
    the law, the prophets, the psalms, the gospel and the apostles; the editor takes it as
    an appendix to book II of the reply to Petilian. Older editions title it ''De unitate
    ecclesiae''. No English translation is vendored, so this is new primary content for both
    entries. Authorship: the Maurists doubted that it is Augustine''s; Petschenig answers
    their arguments in his Praefatio and finds nothing against it, and notes that Augustine''s
    Retractationes do not mention it. Assigned on the editor''s judgment, and the doubt is
    recorded here so a later quote record carries it. PRIMARY ORIGINAL per cic/texts/INTAKE.md:
    Petschenig''s critical text (CSEL 52, Vienna, 1909). The scan is raw, uncorrected OCR
    of a dense critical edition with the apparatus interleaved (the file''s own header and
    registry notes say so; about 88 to 90 percent of its word forms match the vocabulary of
    the clean TEI files, against 93 to 97 percent for those). So this row is primary for authorship
    and content, and a second witness for exact wording: each quote is checked against the
    printed page or a clean witness before it is used, and the English a Representative speaks
    is rendered from the verified Latin.

    '
