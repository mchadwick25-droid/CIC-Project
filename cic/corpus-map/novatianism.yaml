  language: eng
  note: 'Dionysius the Great, pupil of Origen and head of the catechetical school before becoming
    bishop - squarely Alexandrian tradition. The epistle fragments are also a principal contemporary
    witness to the Novatianist crisis (his letter to Novatian himself is here, with correspondence
    about the schism and the rebaptism controversy - grep: Novatian x7), and to the Nepos
    chiliast dispute in the Egyptian countryside.

    '
