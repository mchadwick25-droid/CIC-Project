authors_ruled:
  maclean-browne:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the authors yet. The title page in the OCR
      reads "by Arthur John Maclean, M.A., Dean of Argyll and the Isles, and William Henry Browne, LL.M."
      (file lines 30-45); the host catalogue names both. One slug for the joint work, on the pattern of the
      joint-editor slugs already in use. A mechanical index-coverage gap, not an attribution dispute.

assignments:
