    work: "The Catholicos of the East and his People (Maclean and Browne, 1892): the East Syrian Christians of Kurdistan and Persia and the sixteenth-century division into the Uniat Chaldean Church and the Nestorians"
    author: maclean-browne
    locus: "the division 'in the sixteenth century' into the body that joined Rome, 'known as the Uniat Chaldean Church', and the rest, at file lines 809-830; the names Chaldean, Nestorian, Syrian and Assyrian discussed to about 980; the Catholicos and the hereditary succession in the chapters on the clergy"
    atlas_ids:
      - church-of-the-east-schism-of-1552
    role: context
    confidence: provisional
    note: >
      Two Anglican missionaries state the division of 1552 in a paragraph and describe the Shimun
      line's church as it stood in 1886-91. A reception witness for the schism, weak for this
      entry's events and strong for what the mountain church became. Read at the lines cited.
      Clean OCR.
