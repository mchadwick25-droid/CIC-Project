# Vendored for the Huguenots (Atlas VI.6) by the Era VII library session,
# 2026-10-16. A bounded extract (one creed, French and English) from
# Schaff's Creeds of Christendom vol. III, 1877 printing; the existing
# schaff_second-helvetic-confession-heidelberg-catechism_1919.txt is a
# different extract from the same volume's 1919 printing.
source_file: schaff_gallican-confession-fra-eng_1877.txt

authors_ruled:
  french-reformed-synods:
    kind: metadata-omission
    evidence: >
      Not CCEL-derived markup (a plain-text archive.org OCR extract). The
      Confession is the corporate act of the first national synod of the
      Reformed Churches of France (Paris, May 1559), reaffirmed at La
      Rochelle 1571; Schaff's own headnote in the file says it was
      "prepared by Calvin and his pupil, De Chandieu, revised and approved
      by a synod at Paris, 1559". The same corporate slug is used for the
      Quick Synodicon rows.

assignments:
  - row_id: schaff_gallican-confession-fra-eng_1877--confessio-fidei-gallicana-the-french-confession-of-faith
    work: "Confessio Fidei Gallicana. The French Confession of Faith, A.D. 1559 (French text in modern spelling with Emily O. Butler's English translation)"
    author: french-reformed-synods
    locus: "whole file: Schaff's headnote from line 14, the Preface and forty Articles following, French and English alternating"
    atlas_ids:
      - the-huguenots
    role: tradition
    confidence: assigned
    note: >
      The world's own confession of faith in a clean nineteenth-century
      printing, French and English side by side: the French is the primary
      wording (modern spelling, from the Toulouse 1864 edition per Schaff),
      the English a published cross-check. Quotable once checked against
      the page image. Quick's 1692 English is the older version.

  - row_id: schaff_gallican-confession-fra-eng_1877--confessio-fidei-gallicana-the-french-confession-of-faith-2
