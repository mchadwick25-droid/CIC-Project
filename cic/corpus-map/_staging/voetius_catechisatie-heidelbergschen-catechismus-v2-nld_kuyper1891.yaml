    note: >
      Gisbertus Voetius (1589-1676), Utrecht professor and the census's named Nadere
      Reformatie theologian, teaching the Heidelberg Catechism by question and answer; taken
      down and printed by Poudroyen in 1662, so the text sits at the late edge of the window
      (Voetius' Utrecht ministry began 1634). Dutch original, primary voice, clean OCR, ready
      to quote once verified. No public-domain English translation exists; Kuyper's 1891
      introduction is editorial.
