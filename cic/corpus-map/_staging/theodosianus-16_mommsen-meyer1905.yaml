source_file: theodosianus-16_mommsen-meyer1905.txt

authors_ruled:
  theodosian-code:
    kind: anonymous
    evidence: >
      Imperial legislation compiled by an appointed commission under
      Theodosius II (438 CE) from earlier rescripts of multiple emperors —
      a collective legislative-compilation entity, not a work with a single
      author; Mommsen and Meyer are its modern editors, not its authors.

assignments:
  - work: "Theodosiani Libri XVI (Book 16, critical Latin text)"
    author: theodosian-code
    locus: "Book 16"
    atlas_ids:
      - donatism
    role: context
    confidence: assigned
    note: >
      Mommsen-Meyer's standard critical edition (1905) of the actual
      imperial legislation naming and regulating the Donatists directly —
      the authoritative Latin text behind Boyd's English study (staged
      separately). Context: imperial legislation describing/regulating the
      movement from outside, same footing as the Council acts and
      Appendix of Documents already mapped for this entry.

  - work: "Theodosiani Libri XVI (Book 16, critical Latin text)"
    author: theodosian-code
    locus: "as above"
    atlas_ids:
      - imperial-juridical-christianity
    role: tradition
    confidence: provisional
    note: >
      Same dual-assignment logic already applied to the Optatus Appendix of
      Documents for this pair of entries: imperial legislation on the
      church is imperial-juridical-christianity's own subject matter, so
      tradition rather than context there. Provisional pending that
      entry's own confirmation, the same caveat the Appendix entry already
      carries.

  - work: "The imperial communion law of 381 (CTh 16.1.3, 30 July 381), naming Helladius, Otreius, Gregory of Nyssa, and Amphilochius"
    author: theodosian-code
    locus: "Book 16, Title 1, Law 3"
    atlas_ids:
      - cappadocian-nicene-pastoral-monastic-tradition
    role: context
    confidence: assigned
    note: >
      Closes a specific, named gap: Source Registry row 79 and Doc_02
      (councils-and-canons paragraph) both cite this exact law as the
      381 ecological break's authority-change evidence (Doc_01 SS4a) —
      naming, among the East's touchstone bishops, Helladius of Caesarea,
      Otreius of Melitene, Gregory of Nyssa in the Pontic diocese, and
      Amphilochius of Iconium in the Asian diocese — but row 79 and the
      companion record (records/cappadocian/source/cappadocian.source.
      imperial-communion-law-of-381.md) both record the Mommsen-Meyer
      Latin text as "public domain but not acquired into cic/texts/ this
      session." That text is exactly what this file now is. Context, not
      tradition: this is imperial legislation acting on the world from
      outside, the same footing row 73's CTh 13.3.5 (Julian's school
      law) already gets in this same document as "external-force
      evidence," not this world's own voice. Assigned rather than
      provisional because row 79 already treats the law's existence,
      date, and named bishops as settled (citation_specificity B,
      formation_confidence Widely Accepted, evidentiary_weight
      load-bearing in the companion record) — vendoring the text does
      not newly unsettle any of that, it only removes the "not
      acquired" caveat. The specific bishops named remain independently
      attested via Van Dam (row 95) and the secondary literature per
      Doc_02, not resting solely on this text; that caveat in row 79
      and the record stands unchanged by this entry.

  - work: "The general school law of June 362 (CTh 13.3.5)"
    author: theodosian-code
    locus: "Book 13, Title 3, Law 5 (\"Magistros studiorum doctoresque excellere oportet moribus primum, deinde facundia...\")"
    atlas_ids:
      - cappadocian-nicene-pastoral-monastic-tradition
    role: context
    confidence: assigned
    note: >
      Closes the same kind of gap as the CTh 16.1.3 entry above, found
      while verifying that one: this vendored file is not Book 16 alone
      despite its own staging note above — it is the full "Theodosiani
      Libri XVI" (confirmed by LIBER headers running Primus through
      Decimus Sextus), and Book 13's Title 3 Law 5 is present in full,
      textually confirmed against Source Registry row 73's own citation
      ("Magistros studiorum doctoresque excellere oportet moribus
      primum, deinde facundia", dated in the file "362 Iun. 17", i.e.
      17 June 362, matching row 73's "general school law of June 362"
      exactly). Row 73 and its companion record
      (records/cappadocian/source/cappadocian.source.codex-
      theodosianus-13-3-5-school-law.md) both record this same "public
      domain... but not acquired into cic/texts/ this session"
      staleness. Context, not tradition, per row 73's own reasoning
      ("Julian's school legislation as external-force evidence," Doc_01
      SS4/Doc_02 SS2) and per this same document's existing CTh
      16.1.3/13.3.5 role assignments elsewhere. Assigned, not
      provisional, on the same basis as the 16.1.3 entry above: row 73
      already treats the law's date, text, and non-naming of Christians
      as settled; vendoring only removes the acquisition caveat. Row
      72's Rescript on Christian Teachers (Ep. 36) remains the separate,
      already-vendored measure that does the actual discriminatory work
      — this entry does not merge the two, per row 73's and Doc_02's own
      explicit warning against treating them as one document.
