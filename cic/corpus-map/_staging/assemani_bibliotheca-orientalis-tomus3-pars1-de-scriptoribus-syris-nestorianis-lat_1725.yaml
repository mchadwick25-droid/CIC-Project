authors_ruled:
  assemani:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The title page in the OCR
      reads "Joseph Simonius Assemanus ... Bibliotheca Orientalis Clementino-Vaticana ... Tomi Tertii Pars
      Prima, De Scriptoribus Syris Nestorianis" (file lines about 130-145); the same slug is used by the
      vendored part 2 (1728). A mechanical index-coverage gap, not an attribution dispute.

