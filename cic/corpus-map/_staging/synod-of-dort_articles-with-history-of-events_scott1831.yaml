    role: context
    confidence: provisional
    note: >
      The Synod seated delegates from Geneva, Switzerland, the Palatinate and other Reformed
      churches, and its Canons restate the Genevan doctrine of predestination against the
      Remonstrants. Placed on that continuity with the Reformed Cities tradition; the volume also
      carries a Harmony of Confessions (from line 7915) that includes the Helvetic Confession
      among others.
