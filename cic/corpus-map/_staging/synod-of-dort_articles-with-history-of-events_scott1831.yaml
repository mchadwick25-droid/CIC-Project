  - row_id: synod-of-dort_articles-with-history-of-events_scott1831--the-articles-of-the-synod-of-dort-and-its-rejection-of-3
    work: "The Articles of the Synod of Dort and its Rejection of Errors (the Canons of Dort), English from the Latin (Scott, 1831)"
    author: synod-of-dort
    locus: "lines 4966-7915"
    atlas_ids:
