    note: >
      An 18th-century Western editor's collection of Lucaris's letters with his Confession,
      the acts of the Synod of Jerusalem and long remarks: an outside frame, not the Greek
      church's voice. The editor is not named on the title page. French, Latin and Italian in
      parallel columns in places; long s read as f. Second witness.
  - row_id: lucaris_lettres-anecdotes-fra_amsterdam1718--lettres-anecdotes-de-cyrille-lucar-et-sa-confession-de-foi-2
    work: Lettres anecdotes de Cyrille Lucar ... et sa confession de foi, avec des remarques (Amsterdam,
      1718)
    author: lucaris
    locus: 'table of contents at file lines 55-80: the first letter (page 1, file line 903) is addressed
      to the Republic of Geneva and its pastors, doctors and professors; the second to Diodati, professor
      of theology at Geneva; further letters to Archbishop Abbot of Canterbury, to Leger (Reformed pastor
      at Galata) and to Uytenbogaert (pastor at The Hague)'
    atlas_ids:
    - the-reformed-cities-zurich-and-geneva
    role: context
    confidence: assigned
    note: 'Verified
      against the file''s own table of contents: these are Lucaris''s own letters to the Genevan authorities
      and to Diodati at Geneva, so they document the Orthodox patriarch''s contact with the Reformed city
      directly. Context, not the Reformed cities'' voice: the writer is the Patriarch. The volume was edited
      in 1718 with hostile remarks by a Roman Catholic-leaning editor; the remarks are 18th-century polemic,
      not evidence.'

