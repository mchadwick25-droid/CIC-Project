source_file: sarsa-dengel_historia-regis-sarsa-dengel-gez-fra_conti-rossini1907.txt
authors_ruled:
  zenahu-la-galla:
    kind: anonymous
    evidence: >-
      Neither this volume nor Schleicher's 1893 edition (file zenahu-la-galla_geschichte-der-galla-deu_schleicher1893.txt)
      names the monk who wrote the history: Schleicher's title page reads 'Bericht eines abessinischen
      Moenches' (an Abyssinian monk's report) and the host catalogue lists the work's own title, Zenahu
      la-Galla. The usual attribution to Abba Bahrey is supplied by the project brief and the secondary
      literature, not by either edition, so the work is held as anonymous here.
assignments:
- row_id: >-
    sarsa-dengel_historia-regis-sarsa-dengel-gez-fra_conti-rossini1907--royal-chronicle-of-sarsa-dengel-malak-sa
  work: Royal chronicle of Sarsa Dengel (Malak Sagad), Ge'ez text and French translation
  author: sarsa-dengel
  locus: >-
    Textus (Ge'ez, OCR noise) from file line 85; Versio title page at 9516, Praefatio at 9554, French
