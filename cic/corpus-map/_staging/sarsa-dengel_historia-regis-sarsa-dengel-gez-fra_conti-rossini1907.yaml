  atlas_ids:
  - ethiopian-christianity-gragn-to-fasilides
  role: tradition
  confidence: assigned
  note: >-
    The Ethiopian royal chronicle of the reign that followed the Gragn wars, written at the court. The
    Ethiopian inside voice the census names. Usable in French (the Ge'ez text is not recovered by the
    OCR and is an image-check job). No public-domain English was found. The chronicle's first reading
    belongs to the world's builders; the editor's preface (file line 9554) says the chronicle is the fourth
    part of a collection of reigns beginning with Lebna Dengel.
