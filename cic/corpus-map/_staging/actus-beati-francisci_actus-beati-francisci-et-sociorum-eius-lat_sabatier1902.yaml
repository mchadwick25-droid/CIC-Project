  actus-beati-francisci:
    kind: anonymous
    evidence: >-
      The Actus beati Francisci et sociorum eius is an anonymous Latin compilation. The English introduction to
      the Fioretti vendored beside it attributes it to Ugolino of Monte Giorgio. The ruling here is anonymous.
