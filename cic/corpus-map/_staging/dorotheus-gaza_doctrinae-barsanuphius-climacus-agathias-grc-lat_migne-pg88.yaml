authors_ruled:
  barsanuphius-and-john:
    kind: metadata-omission
    evidence: >
      The volume prints, after Dorotheus's Doctrinae, "Ejusdem abbatis Dorothei ad magnum
      senem sanctum Barsanuphium, et ad ejus discipulum abbatem Joannem" questions with
      their replies; the replies are the two Old Men's own words and the host record names
      neither.
    from_file: dorotheus-gaza_doctrinae-barsanuphius-climacus-agathias-grc-lat_migne-pg88.txt
  john-climacus:
    kind: metadata-omission
    evidence: >
      Running head "S. JOANNIS CLIMACI" over the Scala Paradisi section; the host record
      names no author.
    from_file: dorotheus-gaza_doctrinae-barsanuphius-climacus-agathias-grc-lat_migne-pg88.txt
  agathias:
    kind: metadata-omission
    evidence: >
      The Historiae of Agathias Scholasticus are printed in this volume (the host's own
      description lists Agathias); no creator field on the item.
    from_file: dorotheus-gaza_doctrinae-barsanuphius-climacus-agathias-grc-lat_migne-pg88.txt
  john-the-faster:
    kind: metadata-omission
    evidence: >
      John IV the Faster, patriarch of Constantinople (582-595), is named in the host's own
      contents description and in the volume's running heads.
    from_file: dorotheus-gaza_doctrinae-barsanuphius-climacus-agathias-grc-lat_migne-pg88.txt

assignments:
  - row_id: dorotheus-gaza_doctrinae-barsanuphius-climacus-agathias-grc-lat_migne-pg88--dorotheus-doctrinae
    work: "Dorotheus of Gaza, Doctrinae diversae (Instructions) and Letters"
    author: dorotheus-gaza
    locus: "the section under the running head 'S. DOROTHEI ABBATIS' (Migne cols. 1611-1838)"
    atlas_ids:
      - chalcedonian-monasticism-judean-desert-and-gaza
    role: tradition
    confidence: assigned
    note: >
      Dorotheus's own instructions to his monks at Gaza, the one body of Gaza monastic
      teaching that survives complete. SECOND WITNESS ONLY: the Latin column is readable,
      the Greek is not recovered. No public-domain English exists (recorded as a gap in the
      world's dossier).

  - row_id: dorotheus-gaza_doctrinae-barsanuphius-climacus-agathias-grc-lat_migne-pg88--barsanuphius-john-answers
