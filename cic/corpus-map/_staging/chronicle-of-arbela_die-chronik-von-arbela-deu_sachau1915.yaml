    role: tradition
    confidence: provisional
    note: >
      Shared-Events Era 2 batch (worker C). AUTHENTICITY CONTESTED: an uncertain witness
      that can never carry a claim alone; any use must say so. If genuine, the Persian
      church's own local history of Adiabene; if not, a modern composition. The German is
      cleanly recovered; Mingana's Syriac edition was not vendored (its French column is
      not recovered by the OCR).
