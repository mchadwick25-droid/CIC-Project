  note: 'The fullest Puritan self-account of the 1630s to 1660: a godly upbringing under ''incompetent
    clergy'', the Kidderminster ministry, the army chaplaincy, and the self-review Baxter wrote in old
    age about the man he had been. Inside the Puritan world''s window and the voice the lead asked for.
    Needs-ruling because the first-pass dossier left which world owns Baxter (this one or English Old
    Dissent) as a portfolio question. Primary voice in the editor''s abridgement, clean OCR, ready to
    quote once verified against this file. Ruled by the project lead, October 2026 (Era VII placements):
    a text from before the world''s window that the world argued from is antecedent to it; a text from
    after the window is context here and tradition for the later entry.'
