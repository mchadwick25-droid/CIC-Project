  - row_id: wesley-c_hymns-methodists_1780--a-collection-of-hymns-for-the-use-of-the-people-called-2
    work: "A Collection of Hymns, for the Use of the People Called Methodists -
      the hymns themselves (Charles Wesley, principal author)"
    author: wesley-charles
    locus: "the body of the 525 numbered hymns, beginning after the Preface
      (line 258) and running to roughly line 33700; confirmed present:
      'Christ, whose glory fills the skies' (indexed at line 33733, in this
      file's own closing Index of First Lines - its own body-text locus not
      individually isolated this pass)"
    atlas_ids:
      - the-methodist-revival
    role: tradition
    confidence: provisional
    note: >
      Verified as genuinely present in this specific 1780 Collection (not
      assumed from later, better-known Methodist hymnals); exact body-text
      line loci for individual hymns are Doc_03+ scope, not exhaustively
      isolated here. Long-s normalized throughout this file (see
      REGISTRY.yaml); a handful of stray OCR thorn/eth-shaped glyphs left
      untouched and disclosed rather than guessed at. This Collection
      includes John Wesley's own English translations of German
      (Moravian/Lutheran) hymns alongside Charles Wesley's own original
      English compositions - this file is not a purely English-original
      witness throughout; specific translated hymns are not individually
      isolated this pass.
