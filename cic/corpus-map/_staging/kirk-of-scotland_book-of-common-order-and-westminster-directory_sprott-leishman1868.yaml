    note: >
      The Kirk's own service book from 1564 to 1645: the prayers the
      congregation heard every Sunday, the form of public repentance the
      kirk sessions used, and the order for the Lord's Supper. Primary
      liturgical voice, ready to quote with one caveat: Sprott modernised the
      spelling, so the sixteenth-century orthography is not in this file. OCR
      sampled clean.
