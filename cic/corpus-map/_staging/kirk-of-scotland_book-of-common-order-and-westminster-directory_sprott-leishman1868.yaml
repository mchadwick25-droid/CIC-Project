    author: kirk-of-scotland
    locus: "Sprott's Introduction from file line 501 (with the 1564 title page transcribed at 2876); the Book's own text from the Calendar and Fairs tables, 'THE CONFESSION' (of the Christian Faith, section III) at 3862, the orders of election, discipline, excommunication and public repentance, visitation of the sick, burial, the Order of Public Worship with its prayers, Baptism, 'THE LORD'S SUPPER' at 9419, Marriage, and the treatise of fasting, to the Notes at 15636 (edition pages 1-255)"
