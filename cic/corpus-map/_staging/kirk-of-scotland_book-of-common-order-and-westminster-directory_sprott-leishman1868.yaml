    note: >
      This liturgy was first made in Geneva (1556) for the English exiles whom
      Knox served, with Calvin's approval, before Scotland adopted it. Placed
      on that origin; the file carries the 1564 Scottish text, not the Geneva
      print, so the Reformed Cities world should treat it as a derived
      witness.
  - row_id: kirk-of-scotland_book-of-common-order-and-westminster-directory_sprott-leishman1868--westminster-directory-1645
    work: "A Directory for the Public Worship of God, agreed upon by the Assembly of Divines at Westminster (1645), with the Scottish Act of Assembly adopting it"
    author: kirk-of-scotland
    locus: "Leishman's Introduction from file line 16712; the Directory's own Preface at 17923 (edition page 289) and its sections (assembling of the congregation, public reading, prayer, preaching, the sacraments with 'THE LORD'S SUPPER' at 18877, 'OF MARRIAGE' at 19064, visitation of the sick, burial, fasting, thanksgiving, singing of psalms); 'APPENDIX TO THE DIRECTORY' at 19589; Notes from 19592"
    atlas_ids:
      - the-scottish-reformation-and-kirk
      - puritanism
      - the-english-reformation-and-elizabethan-settleme
    role: tradition
    confidence: provisional
    note: >
      The Westminster Assembly's replacement for the Book of Common Prayer,
      drafted with the Scottish commissioners and adopted by the Kirk in 1645
      and by the English Parliament. For Puritanism it is the movement's own
      liturgical settlement; for the Scottish Kirk it is the book that
      displaced the Book of Common Order; for the English Reformation world it
      is the end of the Prayer Book's first life. The Directory's text was not
      read for this pass beyond its contents, so each placement is
      provisional.
