assignments:
  - work: "Synaxaristes of the Twelve Months, volume 1 (September to February), Greek"
    author: nikodemos-hagiorite
    locus: "whole volume; the prologue at file line 70, the September entries from line 3016"
    atlas_ids:
      - orthodoxy-under-the-ottomans-parish-millet-and-n
    role: tradition
    confidence: provisional
    note: >
      Lives of the saints and feast-day accounts in Greek, arranged by month. The text is
      Nikodemos's revision of an older Greek Synaxarion, in an 1868 edition reprinted about
      1900. Nikodemos wrote after this world's window closes (1749-1809 against a window of
      1453-1650); this edition is a late witness to practice and law, so its place here is a
      provisional shelf assignment for the world's builders to confirm. Second witness only:
      the Greek OCR is heavily garbled in accents and vowels.
