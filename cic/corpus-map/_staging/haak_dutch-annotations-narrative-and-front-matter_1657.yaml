    work: "Haak's Narrative of the Statenvertaling: how the Synod of Dort and the States General made the Dutch Bible of 1637, with the ordinance prefixed to The Dutch Annotations (1657)"
    author: haak
    locus: "whole file (a front-matter extract); the Narrative from about file line 290, the Synod's resolution and its choice of interpreters around lines 364-440, the petition to the States General at 470, the order of 8 November 1625 at 512, the interpreters' names from 519"
    atlas_ids:
      - dutch-further-reformation-and-refuge-culture
    role: tradition
    confidence: assigned
    note: >
      The nearest English account of the Dutch church's own Bible, the Statenvertaling of 1637,
      whose Dutch preface is on no reachable host as text: Haak reports the Synod of Dort's
      resolution, the States General's commission, the six interpreters by name and the method of
      the work, and the Synod's annotations are the church's own reading of Scripture that the
      precisianist pulpit preached from. Tradition because the documents reported are the church's
      own acts; Haak's prose is a contemporary English intermediary. SECOND WITNESS for exact
      wording (microfilm OCR, f for long s, about 0.74); verify against the page image. The
      annotated Bible text itself is not vendored (13 MB on the host).
