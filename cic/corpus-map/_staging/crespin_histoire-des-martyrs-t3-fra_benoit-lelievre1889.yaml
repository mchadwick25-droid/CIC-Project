    note: >
      A Genevan martyrologist's account of the Calabrian Waldensians'
      destruction, an outside Reformed voice on that world's people.
      Placed on the notices found by search; not read in full against
      that world's own sources. Tome 1 of this edition (not vendored)
      carries the Merindol and Cabrieres material of 1545.

