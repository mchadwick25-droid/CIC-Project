    work: "Histoire des martyrs persecutez et mis a mort pour la verite de l'Evangile (1619 recension), Tome troisieme, Livres VIII-XII"
    author: crespin
    locus: "Livre VIII from file line 206, IX from 61943, X from 100385, XI from 114065, XII from 125454; Index historique from 140143; the editors' Avertissement (editorial, 1889) precedes Livre VIII"
    atlas_ids:
      - the-huguenots
    role: tradition
    confidence: assigned
    note: >
      The Reformed martyrology in its own French, in the volume covering
      1559 onward: letters and confessions of the condemned set in
      Crespin's and Goulart's partisan frame, the genre the census names.
      Second witness for exact wording because the OCR substitutes f for
      the old long s; readable, and the editors' notes date each notice.
      No public-domain English translation of Crespin exists. Tomes 1-2
      (to 1559) are not vendored.

