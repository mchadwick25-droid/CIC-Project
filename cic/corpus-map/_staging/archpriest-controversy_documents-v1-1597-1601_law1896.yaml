    author: archpriest-controversy
    locus: "group V, DEALINGS WITH THE GOVERNMENT, at the end of the volume (running head from about file line 10566); Law's Introduction from 229"
    atlas_ids:
      - recusant-english-catholicism
    role: context
    confidence: provisional
    note: >
      Bancroft's and the Council's use of the quarrel, and the Appellants'
