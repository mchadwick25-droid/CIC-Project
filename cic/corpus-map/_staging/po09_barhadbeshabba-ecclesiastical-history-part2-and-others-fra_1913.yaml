  note: 'Shared-Events Era 2 batch (Ephesus 431). The Church of the East''s own account, written about
    600, of "the pious Mar Nestorius" and "the impious Cyril" and of what was done at Ephesus: reception
    from the losing side, a century and a half after the event, and the source of the Syriac Nestorius
    legend. French recovered; Syriac not recovered in this OCR. The other four fascicles of the volume
    (Esther, Acta Pilati, Testament in Galilee, Ethiopian Synaxarium) are not assigned.'
