    note: >
      The Settlement enforced: the 1559 Injunctions (the table in the chancel, the
      Bible and Paraphrases, the licensing of preachers, the register of
      recusants), the bishops' articles of inquiry year by year. The questions put
      to churchwardens are the clearest window on what was expected of an
      ordinary parish. Primary institutional voice, ready to quote once verified
      against this file; Latin in places.

