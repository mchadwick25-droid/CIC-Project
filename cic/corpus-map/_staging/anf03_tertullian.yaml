- row_id: anf03_tertullian--the-passion-of-the-holy-martyrs-perpetua-and-felicitas
  work: The Passion of the Holy Martyrs Perpetua and Felicitas
  author: passion_of_perpetua
  locus: div2 6.6 under div1 'Ethical.' (printed as an Appendix)
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: assigned
  note: 'Carthage, 203 - inside this candidate''s own window and city, transmitted with his
    corpus, and the volume''s editor thinks him its editor but not author. Its New Prophecy
    affinities are long argued. A first-person martyr diary by a woman is precious enough
    that the shelving deserves care: this assignment favors the Carthage/Tertullian''s-corpus
    reading (inside window and city, transmitted with Tertullian''s corpus and edited by him
    on the volume''s own reading) over montanism-the-new-prophecy. The affinity claim is real
    scholarship, not a shelving convenience - adding montanism-the-new-prophecy alongside this
    id remains worth considering. tertullian-s-voice itself is merged into latin-apologists,
    so this assignment resolves there rather than to a separate entry; the underlying choice
    (Carthage/Tertullian''s corpus over the New Prophecy reading) is unaffected.'
