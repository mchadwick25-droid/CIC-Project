- row_id: anf03_tertullian--against-all-heresies-spurious-appendix
  work: Against All Heresies (spurious appendix)
  author: pseudo_tertullian
  locus: div2 5.11 under div1 'Anti-Marcion.' (marked apparatus in STRUCTURE.md)
  atlas_ids:
  - valentinian-and-other-gnostic-christianities
  - marcion-marcionism
  role: context
  confidence: assigned
  note: 'An ancient heresy catalogue, not 19th-century editorial matter, though STRUCTURE.md''s
    apparatus marker caught it via its "Appendix" title - flagged rather than silently skipped.
    The volume''s own editor calls it spurious (see the pseudonymity note above). Its notices
    cover many more movements than these two entries. This follows one principle rather than
    a case-by-case call - nine works across six entries raise the same question, whether a
    spurious corpus files under the attributed name at all. IT DOES, AND IT ALSO FILES AS
    WHAT IT IS. Brief 6.2 says derive from the markup rather than re-attribute from outside
    knowledge, so the transmitted-author shelf stands: that is how the corpus presents it and
    how a reader will look for it. And apocryphal-and-pseudepigraphal-literature is added,
    because a work circulating under a name that is not its author''s is a pseudepigraphon
    by definition. The two together say the whole truth - where it sits, and what it is -
    without re-attributing anything. Detaching the spurious corpora from their attributed
    authors instead is a possible alternative shelving choice.'
