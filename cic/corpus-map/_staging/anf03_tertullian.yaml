# anf03's three div1 headings - Apologetic., Anti-Marcion., Ethical. - are the
# editors' thematic parts, not works. The works are the div2 level below them,
# and that is what is assigned here. DC.Creator names tertullian; the two
# rulings below cover the appendix pieces the volume itself does not give him.
source_file: anf03_tertullian.xml
authors_ruled:
  pseudo_tertullian:
    kind: pseudonymous
    evidence: 'div2 5.11 "Appendix: Against All Heresies." The volume''s own editorial note
      at its head calls it "this spurious treatise" and regrets not "relegating it to the
      collection of spurious Tertulliana" - the file itself withholds it from Tertullian.

      '
  passion_of_perpetua:
    kind: anonymous
    evidence: 'div2 6.6 "The Passion of the Holy Martyrs Perpetua and Felicitas", printed
      as an Appendix. The volume''s introductory notice: "I think Tertullian was the editor
      of the story, not its author." The core is Perpetua''s own first-person prison account
      inside an unnamed editor''s frame; treated as a work-entity per brief §6.4.

      '
