authors_ruled:
  howard:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The title page in the OCR
      is garbled but the host catalogue gives Howard, George Broadley, and the 1869 Philipos volume (vendored)
      names him on its title page as "author of The Christians of S. Thomas and their Liturgies". A mechanical
      index-coverage gap, not an attribution dispute.

assignments:
