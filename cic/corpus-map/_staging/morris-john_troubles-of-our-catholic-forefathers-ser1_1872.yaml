    note: >
      Filed under the editor's slug, the convention this corpus uses for a compiler's
      volume (foxe, barlow). The papers are inside narratives in their own writers' words,
      each prefaced by Morris's introduction naming the manuscript: Lady Babthorpe's
      Recollections and the Tregian, Babthorpe, Southcote and Tichborne papers are the
      household record the census asks for (women and families running the church in
      private houses); the Margaret Clement and St Monica's papers are the exiled English
      nuns' own chronicle. Morris modernised the spelling (his preface, file line about
      104). Grouped in one row this pass; paper-by-paper quotability is Doc_03 scope.
