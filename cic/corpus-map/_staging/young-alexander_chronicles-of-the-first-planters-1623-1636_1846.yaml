    author: white-john-dorchester
    locus: "CHAPTER I from file line 271 and CHAPTER II to about 984"
    atlas_ids:
      - puritanism
    role: context
    confidence: provisional
    note: >
      John White of Dorchester, the English promoter of the colony, arguing the
