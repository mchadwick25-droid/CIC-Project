      - latin-pastoral-congregational-christianity
    role: tradition
    confidence: assigned
    note: >
      Augustine's reply, about 420, to Gaudentius, the Donatist bishop of Thamugadi, who threatened
      to burn himself and his congregation in their church rather than yield to the tribune
      Dulcitius. Book I answers his two letters sentence by sentence, quoting them; book II answers
      his reply. Gaudentius's words survive quoted inside it: embedded voice, the work itself is
      Augustine's. One manuscript survives, with a large gap in book I (chapters 20 to 36). No
      English translation is vendored. PRIMARY ORIGINAL per cic/texts/INTAKE.md: Petschenig's
      critical text (CSEL 53, Vienna, 1910). The scan is raw, uncorrected OCR of a dense critical
