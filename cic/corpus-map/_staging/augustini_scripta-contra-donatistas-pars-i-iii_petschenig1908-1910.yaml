    role: tradition
    confidence: assigned
    note: >
      Augustine's address, soon after the 411 conference, to the Donatist laity, warning them not to
      be led on by their bishops. It answers the charge that the judge Marcellinus had been bribed,
      and argues that the Donatist bishops had themselves brought scripture testimonies against
      their own side. The editor keeps the title 'Contra partem Donati post gesta' and notes that
      the Retractationes (II 66) word it differently. Five manuscripts, all French, from one old
      exemplar with gaps. No English translation is vendored. PRIMARY ORIGINAL per
