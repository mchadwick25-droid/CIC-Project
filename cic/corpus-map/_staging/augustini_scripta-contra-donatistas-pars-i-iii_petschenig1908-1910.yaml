# Petschenig's critical Latin edition of Augustine's Scripta contra Donatistas: CSEL 51 (Pars I),
# CSEL 52 (Pars II) and CSEL 53 (Pars III), bound in one file. The file's work headings, by file
# line: Psalmus 1257, Contra epistulam Parmeniani 2089, De baptismo 8477 (Pars I); Contra litteras
# Petiliani 24752, Epistula ad catholicos 36701, Contra Cresconium 41781 (Pars II); De unico
# baptismo 60952, Breviculus collationis 62773, Contra partem Donati post gesta 66511, Sermo ad
# Caesariensis 71499, Gesta cum Emerito 72784, Contra Gaudentium 73265, and the Appendix 78734 with
# the Sermo de Rusticiano 78744 and the Libellus adversus Fulgentium 78988 (Pars III). The six works
# assigned below are the ones with a row in this file.
#
# Four of the six are also assigned to latin-pastoral-congregational-christianity as a second
# `tradition` row. De Baptismo and De Unico Baptismo contra Petilianum are the Latin original of
# works that bucket already holds in English (npnf104's "On Baptism, Against the Donatists" and
# "Answer to the Letters of Petilian"). Contra Cresconium and Contra Epistulam Parmeniani have no
# English translation vendored anywhere, so they are new primary Augustine content for that bucket.
# Psalmus contra Partem Donati and Contra (Adversus) Fulgentium Donatistam stay in donatism only.
source_file: augustini_scripta-contra-donatistas-pars-i-iii_petschenig1908-1910.txt

assignments:
  - work: "Psalmus contra Partem Donati"
    author: augustine
    locus: "Pars I (CSEL 51); file line 1257 (heading 'PSALMUS', followed by 'CONTRA PARTEM DONATI' at 1258)"
    atlas_ids:
      - donatism
    role: tradition
    confidence: assigned
    note: >
      Augustine's own abecedarian song against the Donatists, written for
      ordinary Catholic congregations to sing/recite — his most directly
      popular-register anti-Donatist composition, no English translation
      vendored elsewhere in this corpus. Tradition per this entry's own
      standing rule for Augustine's anti-Donatist corpus: preserves and
      answers Donatist argument directly, the nearest thing to a documented
      exchange this entry has.

  - work: "Contra Epistulam Parmeniani (libri tres)"
