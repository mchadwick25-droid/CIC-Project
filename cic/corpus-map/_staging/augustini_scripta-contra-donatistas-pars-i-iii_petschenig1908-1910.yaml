    role: tradition
    confidence: assigned
    note: >
      No English translation vendored anywhere in this corpus — primary
      content, not a second witness. Augustine's reply to the Donatist
      grammarian Cresconius, who had himself answered Contra Epistulam
      Parmeniani; a documented three-way exchange (Parmenian to Tyconius/
