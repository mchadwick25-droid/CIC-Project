    role: tradition
    confidence: assigned
    note: >
      Augustine's sermon to the congregation of Caesarea in Mauretania in 418, given with the
      Donatist bishop Emeritus present, to persuade him to become Catholic (the editor's Praefatio).
      It gives this world a pastoral sermon in the middle of the dispute, on the Maximianist schism
      inside Donatism (the Gesta cum Emerito say it dealt with the Maximianists only). The editor
      remarks that by style alone one would hardly take it for Augustine's and still prints it as
      his own. One late manuscript, which the editor calls of little value and which he shares with
      the Gesta cum Emerito, so the text is less secure than the others here. No English translation
      is vendored. PRIMARY ORIGINAL per cic/texts/INTAKE.md: Petschenig's critical text (CSEL 53,
