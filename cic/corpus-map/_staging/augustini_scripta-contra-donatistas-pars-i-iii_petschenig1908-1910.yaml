    note: >
      The record of the 418 debate at Caesarea in Mauretania between Augustine and the Donatist
      bishop Emeritus, before the bishops of the province and the congregation, with Augustine's own
      introduction. The editor cites the Retractationes (II 77) for it, and notes that its opening
      words differ between the Retractationes and the manuscript, which he follows; the one late
      manuscript is the same as for the Sermo. It gives this world a face-to-face exchange with a
      Donatist bishop, as far as the Catholic side reports it. No English translation is vendored.
      PRIMARY ORIGINAL per cic/texts/INTAKE.md: Petschenig's critical text (CSEL 53, Vienna, 1910).
