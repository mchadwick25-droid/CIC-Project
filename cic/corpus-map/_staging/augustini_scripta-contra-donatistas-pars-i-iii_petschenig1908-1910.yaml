    role: tradition
    confidence: assigned
    note: >
      A pastoral letter to Catholic congregations on where the true church is, taught from the law,
      the prophets, the psalms, the gospel and the apostles; the editor takes it as an appendix to
      book II of the reply to Petilian. Older editions title it 'De unitate ecclesiae'. No English
      translation is vendored, so this is new primary content for both entries. Authorship: the
      Maurists doubted that it is Augustine's; Petschenig answers their arguments in his Praefatio
      and finds nothing against it, and notes that Augustine's Retractationes do not mention it.
      Assigned on the editor's judgment, and the doubt is recorded here so a later quote record
      carries it. PRIMARY ORIGINAL per cic/texts/INTAKE.md: Petschenig's critical text (CSEL 52,
