# Petschenig's critical Latin edition of Augustine's Scripta contra Donatistas: CSEL 51 (Pars I),
# CSEL 52 (Pars II) and CSEL 53 (Pars III), bound in one file. The file's work headings, by file
# line: Psalmus 1254, Contra epistulam Parmeniani 2086, De baptismo 8474 (Pars I); Contra litteras
# Petiliani 24749, Epistula ad catholicos 36698, Contra Cresconium 41778 (Pars II); De unico
# baptismo 60949, Breviculus collationis 62770, Contra partem Donati post gesta 66508, Sermo ad
# Caesariensis 71496, Gesta cum Emerito 72781, Contra Gaudentium 73262, and the Appendix 78731 with
# the Sermo de Rusticiano 78741 and the Libellus adversus Fulgentium 78985 (Pars III). The works
# assigned below are the ones with a row in this file; the Sermo de Rusticiano, which the editor
# prints as spurious, has no row.
#
# Four of the six assignments below are double-placed to
# latin-pastoral-congregational-christianity (lpc) as a second `tradition`
# row, a cross-world placement decided by the project lead
# (Build/worlds/_cross-world/LIBRARY-DECISION-LOG.md),
# following the same-work-different-language pairing pattern lpc's own
# dossier identified
# (latin-pastoral-congregational-christianity_Source_Readiness_Dossier.md
# §2) and already uses for Cyprian/Hartel and six other Augustine works.
# De Baptismo and De Unico Baptismo contra Petilianum are the Latin
# original of works lpc
# already vendors in English as tradition/assigned (npnf104's "On Baptism,
# Against the Donatists" and "Answer to the Letters of Petilian"); Contra
# Cresconium and Contra Epistulam Parmeniani have no English translation
# vendored anywhere and are genuine new primary Augustine content for lpc,
# not presently reachable from this world's own bucket in any other form.
# Psalmus contra Partem Donati and Contra (Adversus) Fulgentium Donatistam
# are not part of this double-placement (not named in the dossier's own
# §2 reasoning) and stay donatism-only.
