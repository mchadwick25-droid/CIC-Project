  - work: "Contra Cresconium (libri quattuor)"
    author: augustine
    locus: "Pars II (CSEL 52); file line 41781 (heading 'CONTRA CRESCONIVM GRAMMATICVM ET DONATISTAM LIBRI IIII')"
    atlas_ids:
      - donatism
