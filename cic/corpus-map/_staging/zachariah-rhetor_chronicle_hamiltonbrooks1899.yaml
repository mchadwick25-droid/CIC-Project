  - row_id: zachariah-rhetor_chronicle_hamiltonbrooks1899--the-syriac-chronicle-known-as-that-of-zachariah-of-mitylene
    work: "The Syriac Chronicle known as that of Zachariah of Mitylene"
    author: pseudo-zachariah-rhetor
    locus: "whole compilation (Books I-XII as received; Books III-VI corrected to own-voice, see note)"
    atlas_ids:
      - syriac-orthodox-west-syriac-christianity
    role: tradition
    confidence: provisional
    note: >
      A composite work, not one author's own voice throughout - corrected
      from this file's own Revision 1, which had the compilation's own
      internal voice backwards. Books III-VI derive from Zacharias
      Scholasticus of Gaza, a companion and defender of Severus of Antioch
      (see authors_ruled evidence above) - own-voice, sympathetic
      testimony from within the anti-Chalcedonian camp, not opponent-voice
      as Revision 1 stated. Books I-II and VII-XII were assembled and
      continued by an anonymous compiler c. 569, not yet individually
      assessed for own-voice/opponent-voice status. `role: tradition` at
      `confidence: provisional` for the WHOLE work still overstates what
      is known before a book-by-book pass completes the continuator
      material's own assessment - Books III-VI alone could reasonably be
      `assigned`, but the continuator books remain genuinely unassessed.
      Own-voice/opponent-voice tagging book-by-book, not a single
      whole-work role, remains Doc_02's own task for the continuator
      material specifically.
