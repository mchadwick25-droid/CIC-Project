source_file: zachariah-rhetor_chronicle_hamiltonbrooks1899.txt
authors_ruled:
  pseudo-zachariah-rhetor:
    kind: pseudonymous
    evidence: >
      The received Chronicle is a composite. Per the vendored 1899
      edition's own introduction (lines 255-370, verified against the
      file): Books III-VI derive
      from Zacharias Scholasticus of Gaza, who studied law together with
      Severus of Antioch at Alexandria and Berytus, wrote his own
      Ecclesiastical History (covering 450-491) between 491 and 518, and
      also wrote a separate Life of Severus defending him - real
      documentary evidence that Zacharias was Severus's own companion and
      supporter, not a Chalcedonian outside witness, when he wrote this
      material. The same introduction states he was made bishop of
      Mitylene only "at a later time, conforming perhaps to the
      Chalcedonian faith" - i.e., any conformity to Chalcedon, if it
      happened at all, postdates the History itself and is presented by
      the 1899 edition's own introduction as uncertain ("perhaps"), not as
      settled fact. Books I-II and VII-XII were assembled and continued by
      a separate, anonymous compiler writing c. 569, who used Zacharias'
      own material (among other sources) without being Zacharias himself.
      Modern scholarship (Greatrex, Phenix & Horn, The Chronicle of
      Pseudo-Zachariah Rhetor, Translated Texts for Historians 55,
      Liverpool University Press, 2011 - not vendored here, still in
      copyright) names the whole compilation "Pseudo-Zachariah Rhetor" on
      this same compiler/source distinction.

      Revision 1 of this file additionally claimed the 1899 edition
      "predates" the modern authorship analysis and simply attributes the
      whole work to Zachariah. This is also corrected: the 1899
      introduction itself already draws the compiler/Zachariah distinction
      directly ("the name of Zachariah was wrongly attached" to the whole
      work "by later writers," per Land's own 1870 analysis, which the
      1899 edition cites and follows) - the 1899 edition's own title
      follows the manuscript tradition's conventional label while its own
      introduction already explains why that label is imprecise. The 2011
      TTH edition sharpens and formalizes the same distinction the 1899
      edition's own introduction already draws; it does not originate it.

assignments:
  - row_id: zachariah-rhetor_chronicle_hamiltonbrooks1899--the-syriac-chronicle-known-as-that-of-zachariah-of-mitylene
    work: "The Syriac Chronicle known as that of Zachariah of Mitylene"
    author: pseudo-zachariah-rhetor
    locus: "whole compilation (Books I-XII as received; Books III-VI corrected to own-voice, see note)"
    atlas_ids:
      - syriac-orthodox-west-syriac-christianity
    role: tradition
    confidence: provisional
    note: >
      A composite work, not one author's own voice throughout - corrected
      from this file's own Revision 1, which had the compilation's own
      internal voice backwards. Books III-VI derive from Zacharias
      Scholasticus of Gaza, a companion and defender of Severus of Antioch
      (see authors_ruled evidence above) - own-voice, sympathetic
      testimony from within the anti-Chalcedonian camp, not opponent-voice
      as Revision 1 stated. Books I-II and VII-XII were assembled and
      continued by an anonymous compiler c. 569, not yet individually
      assessed for own-voice/opponent-voice status. `role: tradition` at
      `confidence: provisional` for the WHOLE work still overstates what
      is known before a book-by-book pass completes the continuator
      material's own assessment - Books III-VI alone could reasonably be
      `assigned`, but the continuator books remain genuinely unassessed.
      Own-voice/opponent-voice tagging book-by-book, not a single
      whole-work role, remains Doc_02's own task for the continuator
      material specifically.

