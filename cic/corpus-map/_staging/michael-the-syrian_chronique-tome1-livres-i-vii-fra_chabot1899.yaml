authors_ruled:
  michael-the-syrian:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md (generated from CCEL XML markup
      only) has not seen the author. Michael the Syrian (Michael Rabo, 1126-1199), Syriac
      Orthodox patriarch of Antioch, is a real, well-attested author; the title page names
      him (file lines 58-68: 'Chronique de Michel le Syrien, patriarche jacobite d'Antioche
      (1166-1199) ... traduite en français par J.-B. Chabot, tome premier, Paris 1899').
      The same slug was ruled this batch for tome II.

