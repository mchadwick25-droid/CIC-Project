    author: michael-the-syrian
    locus: "Nicaea chapter at file line 55601; Tyre and the hand of Arsenius at 57275; Sirmium and Seleucia at 58036; Sardica at 58048 and 58056; Milan at 58136; Rimini at 58206 and 58212"
    atlas_ids:
      - imperial-juridical-christianity
    role: context
    confidence: provisional
    note: >
      Twelfth-century Syriac Orthodox memory of the Constantinian-dynasty councils,
      compiled from Socrates, Theodoret and lost Syriac sources: how a later non-
      Chalcedonian tradition remembered the imperial church's councils. Context, and a
      reception witness only, never evidence of the events.
  - row_id: michael-the-syrian_chronique-tome1-livres-i-vii-fra_chabot1899--chronique-book-vii-syriac-renaissance-chronicle-french
