    note: >
      A Syriac Orthodox patriarch's world chronicle from the creation to the sons of
      Constantine, in French translation (the Syriac is in Chabot's tome IV, not held).
      The West Syriac tradition's own historical self-account; English translation does
      not exist in the public domain, so this French is the readable witness. Reception
      source for every fourth-century event it tells.
