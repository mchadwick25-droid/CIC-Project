assignments:
  - work: "The Journal of the Rev. John Wesley, A.M. (Curnock edition), Vol. I"
    author: wesley-john
    locus: "Wesley's own retrospective account of 24 May 1738 (the
      Aldersgate 'heart strangely warmed' entry), lines 26503-27091 -
      his own numbered paragraphs 1-18+ of a single continuous
      retrospective, interrupted mid-account by Curnock's own footnote
      apparatus (lines 26948-27069); the quotation itself (paragraph 14
      of Wesley's own numbering) sits at lines 27070-27074, immediately
      after that footnote break"
    atlas_ids:
      - the-methodist-revival
    role: tradition
    confidence: assigned
    note: >
      The movement's own founding moment in Wesley's own words, in the
      standard scholarly Curnock edition. Volume I only is vendored (birth
      through Wesley's own resolution on Wednesday 7 June 1738 to travel to
      Germany, line 27667, running through embarkation the following week,
      line 27863 - Wesley's own later 1738 visit to Herrnhut is NOT in this
      volume); Volumes II-VIII, covering the movement's own working decades,
      are not yet acquired.

  - work: "The Journal of the Rev. John Wesley, A.M. (Curnock edition), Vol. I
      -- Curnock's own Editorial Introduction"
    author: curnock-nehemiah
    locus: "Curnock's own editorial introduction discussing Wesley's
      'evangelical conversion,' lines ~1745-1770 of the vendored file"
    atlas_ids:
      - the-methodist-revival
    role: context
    confidence: assigned
    note: >
      Editorial (Curnock's own voice, not Wesley's) - useful as
      context/orientation for Doc_02, never citable as Wesley's own words.
