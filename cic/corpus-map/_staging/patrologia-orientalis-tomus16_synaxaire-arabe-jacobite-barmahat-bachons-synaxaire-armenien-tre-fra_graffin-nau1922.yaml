      The Coptic Church's own liturgical calendar of saints, compiled in Arabic in the
      Middle Ages: the tradition's own voice about its past. Only the French translation is
      recovered in this OCR; the Arabic column is not, so this is a readable witness, not
      the original text. Reception source for the fourth-century saints it commemorates.
