authors_ruled:
  copto-arabic-synaxarium:
    kind: anonymous
    evidence: >
      Basset prints 'Le Synaxaire arabe jacobite (rédaction copte)' as an anonymous medieval
      compilation of the Coptic Church (heading at file line 10402); its own preface names
      compilers of parts (Michael of Malij and other fathers, file line 10470) but no
      single author.
  ter-israel:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md (generated from CCEL XML markup
      only) has not seen the author. The Armenian Synaxarion is printed under the name of
      Ter Israel (thirteenth century) by its editor G. Bayan ('Le Synaxaire arménien de Ter
      Israël, IV: mois de Tré', file lines 61 and 93-96), the traditional compiler the
      edition itself credits.

