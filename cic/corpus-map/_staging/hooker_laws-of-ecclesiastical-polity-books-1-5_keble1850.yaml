    evidence: >
      Izaak Walton is named on the file's own title page ("WITH AN ACCOUNT OF HIS
      LIFE AND DEATH, BY ISAAC WALTON") and the Life carries his own dedication to
      Bishop Morley and his preface. The file-name prefix is hooker because the
      volume is Hooker's works; Walton's Life inside it is a separate work by a
