  note: 'The one substantial document from inside the Bosnian Church: the testament of a gost (a senior
    churchman) and counsellor of Duke Stephen, made in 1466, printed for the first time in 1911 with the
    editor''s commentary. Truhelka stresses the cross at the head of the text and the opening ''Va ime
    oca i sina i svetago duha. Amen.'' The testament''s own text is in Bosnian Cyrillic and the OCR of
    it is unusable, so the wording must be read from the plates or page images; the Croatian commentary
    is readable and is scholarship, not Radin''s voice. Partial extract (the article only). No English
    translation found.'
