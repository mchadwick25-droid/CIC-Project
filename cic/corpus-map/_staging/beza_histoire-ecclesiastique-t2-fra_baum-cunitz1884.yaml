    author: beza
    locus: "the reprinted 1580 half-title at file line 148; LIVRE VI from line 158 (the massacre of Vassy and the rising of Paris, March 1562), LIVRE VII from 21400, LIVRE VIII from 35640, LIVRE IX from 44540 to the end (about line 50340); editors' footnotes at the foot of each page"
