    note: >
      The French Reformed churches' own narrative of the first war of religion, compiled church by
      church from the reports the churches sent to Geneva and published anonymously in 1580 under
      Beza's name (the attribution is the editors' and the catalogue's). The continuation of the
      vendored Tome 1, which ends in 1561; this tome and Tome 3 carry the churches through Vassy,
      the Edict of January, the taking of the towns and the war to 1563. Second witness for exact
      wording (f for long s in the OCR of the 1580 text). No public-domain English translation
      exists.
