  - row_id: church-of-england_liturgical-services-elizabeth-1559_clay1847--the-book-of-common-prayer-1559-with-the-litany-and-the-ordinal
    work: "The Book of Common Prayer (1559), with the Litany and Suffrages (1559) and the Form and Manner of making Bishops, Priests and Deacons (1559)"
    author: church-of-england
    locus: "Litany from file line 1593 (heading 'THE LITANY AND SUFFRAGES'); the 1559 Prayer Book follows, its own table of contents at line 2660; the Ordinal's 'The form of ordering Priests' at line 17772; the Latin Liber Precum Publicarum (1560) occupies the middle of the file (Latin running text at the 50 per cent sample, about line 22559)"
    atlas_ids:
      - the-english-reformation-and-elizabethan-settleme
    role: tradition
    confidence: assigned
    note: >
      The Elizabethan Settlement's own book, the text every parish in England was
      bound to from 1559 to 1645, in the Parker Society's modernised-spelling text
      with Clay's variants. Primary voice, ready to quote once verified against this
      file. The Latin Liber Precum of 1560 (for the universities) is a Latin primary
      beside it.

