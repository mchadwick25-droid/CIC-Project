    work: "Occasional Forms of Prayer and Thanksgiving issued in the reign of Elizabeth, 1560-1602 (plague fasts, the Armada prayers of 1588, Accession Day and others)"
    author: church-of-england
    locus: "the last third of the file; the edition's list of the forms is in the contents (lines 103 to 215); the 1588 forms are listed at contents lines 198 to 201; 'An order for morning prayer, to be vsed the 17. of Nouember' (Accession Day) at line 37319"
    atlas_ids:
      - the-english-reformation-and-elizabethan-settleme
    role: tradition
    confidence: assigned
    note: >
      The prayers ordered for plague, dearth, war and thanksgiving, the state
      church speaking to ordinary parishes in a crisis year. Primary voice, ready to
      quote once verified against this file; these forms are printed in their
      original spelling, unlike the Prayer Book above.

