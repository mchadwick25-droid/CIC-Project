  note: >
    The 1702 Halle printing of Comenius's history and Ratio Disciplinae of the old Unity is the
    book Zinzendorf read in 1727 and from which Herrnhut took its 'Statutes' and understood itself
    as the old Unity renewed; the renewed church's own founding documents argue from this text.
    Latin; OCR of this scan is weak (see the file's own note), so a second witness until a cleaner
    scan is vendored.
