  note: 'The Unity''s account of its own history, order and discipline from its last bishop, in Latin,
    printed long after the window. It is the Unity''s later self-account, so it gives the Unity''s own
    picture of its origins at second hand and not its voice of the years to 1517. Second witness for now,
    not quotable: a 1702 print with the long s read as f throughout and many word-level misreads (word-form
    coverage against a clean Latin vocabulary 0.42). A cleaner scan of Comenius''s own text (1649-1660
    manuscripts) would serve as the quotable witness.'
