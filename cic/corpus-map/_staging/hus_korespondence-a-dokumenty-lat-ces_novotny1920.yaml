  note: The critical edition of Hus's letters and the documents about them, in the Latin and Czech of
    the originals, with Novotný's Czech introduction and footnotes. It prints Hus's letters in their original
    languages, as a second critical text beside the letters in Palacký's Documenta. The vendored Workman
    and Pope Letters is an English rendering of Hus's letters. Primary original evidence for the movement,
    quotable once each wording is checked against the page image. The Latin letters read legibly; the
    OCR scatters the edition's footnote marks and superscript digits through the lines, so quotations
    need the printed page.
