source_file: consett_collection-of-tracts-on-peter-the-great-v2_1729.txt
authors_ruled:
  prokopovich:
    kind: metadata-omission
    evidence: The contents name 'A Funeral Oration by the Arch-Bishop of Novogrod, then Arch-Bishop of
      Pleskow and Narva' and 'A Panegyrical Oration in the Praise of Peter the Great, by the same Arch-Bishop'
      (file lines about 30-50 of the contents); those are the sees Feofan Prokopovich held. The host names
      no author.
  consett:
    kind: metadata-omission
    evidence: The title page reads 'by Tho. Consett, Late Chaplain to the British Factory in Russia'.
