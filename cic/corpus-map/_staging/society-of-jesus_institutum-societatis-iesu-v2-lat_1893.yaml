  note: 'The Society''s own collected Latin text of the Examen, the Constitutions with the Declarations,
    and the decrees of the general congregations. The Latin Constitutions and Declarations are printed
    here in a clean scan, which serves as the clean witness beside the garbled 1606 print; the decrees
    run from 1558 on. Society-authored and corporate; no single writer. Primary original evidence for
    the movement, and the cleanest Latin scan in this group: modern typeset Latin with marginal rubrics,
    clean apart from occasional letter-level misreads and line-end hyphens read as a stray sign. Word-form
    coverage against a clean Latin vocabulary is 0.88, the same range as the machine-corrected TEI files.
    Quote after checking the page image.'
