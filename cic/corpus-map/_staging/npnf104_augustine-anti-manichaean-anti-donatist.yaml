source_file: npnf104_augustine-anti-manichaean-anti-donatist.xml

# No authors_ruled: DC.Creator names `augustine`. The two div1 headings are
# editorial groupings of distinct works — split per the granularity rule.
# Skipped as apparatus: Title Pages, Editor's Preface, Contents, the two
# Introductory Essays (editorial), the Prefaces, Subject Indexes, Indexes.
#
# Pattern note for the reviewer: every anti-Manichaean work goes BOTH to
# latin-pastoral-congregational-christianity (Augustine's own entry, as his
# work) AND to manichaeism (the doctrinal-floor entry it argues against, per
# brief §4, which names these writings as its example); likewise the
# anti-Donatist works to donatism. `role: tradition` throughout because Mark's
# context ruling defines context by non-Christian outsiders (pagan critics,
# civil historians, imperial law); Augustine is the tradition speaking, and
# the etic-register rule already keeps his voice from ever being served as
# the opponent's own.

assignments:
  - work: "On the Morals of the Catholic Church"
    author: augustine
    locus: "div2 4.4 — On the Morals of the Catholic Church"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      First half of the paired De Moribus (388), answering the Manichaean
      charge against Catholic ethics. Positive exposition of Catholic morals,
      but written as anti-Manichaean polemic and grouped so by CCEL — dual
      assignment with its companion below.

  - work: "On the Morals of the Manichaeans"
    author: augustine
    locus: "div2 4.5 — On the Morals of the Manichæans"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      Second half of De Moribus: a detailed, hostile description of Manichaean
      ethics — the three seals, the elect and auditors — from a former
      auditor. One of the principal Latin sources on Manichaean practice.

  - work: "On Two Souls, Against the Manichaeans"
    author: augustine
    locus: "div2 4.6 — On Two Souls, Against the Manichæans"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      Refutation (c. 391) of the Manichaean doctrine of two souls; states the
      doctrine in order to refute it.

  - work: "Acts or Disputation Against Fortunatus the Manichaean"
    author: augustine
    locus: "div2 4.7 — Acts or Disputation Against Fortunatus the Manichæan"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      Transcript of the public debate at Hippo (392). Unusual in that it
      records Fortunatus' own words at length — as close to a Manichaean
      voice as this volume comes, though preserved by the winning side; a
      builder using it for the manichaeism entry should know the frame is
      Augustine's.

  - work: "Against the Epistle of Manichaeus, Called Fundamental"
    author: augustine
    locus: "div2 4.8 — Against the Epistle of Manichæus, Called Fundamental"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      Refutation (397) that quotes Mani's Fundamental Epistle verbatim as it
      goes — a primary Manichaean text surviving in Latin only through this
      work's quotations.

  - work: "Reply to Faustus the Manichaean (Contra Faustum)"
    author: augustine
    locus: "div2 4.9 — Reply to Faustus the Manichæan (33 books, ~176k words)"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      The largest anti-Manichaean work (c. 400), and the most valuable text in
      this volume for the manichaeism entry: each book opens by reproducing
      Faustus' Capitula in his own words before answering, so the fullest
      surviving statement of Manichaean biblical criticism is preserved inside
      Augustine's refutation.

  - work: "Concerning the Nature of Good, Against the Manichaeans"
    author: augustine
    locus: "div2 4.10 — Concerning the Nature of Good, Against the Manichæans"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - manichaeism
    role: tradition
    confidence: assigned
    note: >
      Late (c. 404) statement of evil as privation against Manichaean dualism;
      quotes from Mani's Thesaurus and Fundamental Epistle.

  - work: "On Baptism, Against the Donatists"
    author: augustine
    locus: "div2 5.4 — On Baptism, Against the Donatists (7 books)"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - donatism
    role: tradition
    confidence: assigned
    note: >
      The central treatise (c. 400) on the validity of schismatic baptism.
      Also a major conduit for Cyprian: it argues through the acts of
      Cyprian's baptismal councils at length, and Cyprian's Carthage belongs
      to this same Latin pastoral entry — one bucket carries both sides of
      that inheritance.

  - work: "Answer to the Letters of Petilian, the Donatist"
    author: augustine
    locus: "div2 5.5 — Answer to the Letters of Petilian (3 books, ~102k words)"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - donatism
    role: tradition
    confidence: assigned
    note: >
      Book-by-book reply that quotes Petilian of Constantine's letters
      clause by clause — the most extensive surviving Donatist voice in the
      vendored corpus, preserved inside its refutation. For the donatism
      entry this is the nearest thing to primary Donatist text on hand.

  - work: "The Correction of the Donatists (De Correctione Donatistarum, Letter 185)"
    author: augustine
    locus: "div2 5.6 — The Correction of the Donatists"
    atlas_ids:
      - latin-pastoral-congregational-christianity
      - donatism
    role: tradition
    confidence: assigned
    note: >
      Letter-treatise (c. 417) to the tribune Boniface justifying the
      imperial laws against the Donatists after the events at Carthage —
      the classic defense of state correction of schism ("compel them to
      come in"). Also assigned to imperial-juridical-christianity below.

  - work: "The Correction of the Donatists (De Correctione Donatistarum, Letter 185)"
    author: augustine
    locus: "div2 5.6 — The Correction of the Donatists"
    atlas_ids:
      - imperial-juridical-christianity
    role: tradition
    confidence: provisional
    note: >
      Direct evidence for the ijc world's core question — the church's use of
      imperial law — written to an imperial officer to justify coercive
      legislation. Provisional because Augustine stands outside the
      Rome-Constantinople-Milan orbit; a reviewer may prefer ijc to reach
      this through the laws themselves rather than their North African
      advocate.
