- work: On Baptism, Against the Donatists
  author: augustine
  locus: div2 5.4 — On Baptism, Against the Donatists (7 books)
  atlas_ids:
  - latin-pastoral-congregational-christianity
  - donatism
  role: tradition
  confidence: assigned
  note: 'The central treatise (c. 400) on the validity of schismatic baptism. Also a major
    conduit for Cyprian: it argues through the acts of Cyprian''s baptismal councils at length,
    and Cyprian''s Carthage belongs to this same Latin pastoral entry — one bucket carries
    both sides of that inheritance.

    '
- work: Answer to the Letters of Petilian, the Donatist
  author: augustine
  locus: div2 5.5 — Answer to the Letters of Petilian (3 books, ~102k words)
  atlas_ids:
  - latin-pastoral-congregational-christianity
  - donatism
  role: tradition
  confidence: assigned
  note: 'Book-by-book reply that quotes Petilian of Constantine''s letters clause by clause
    — the most extensive surviving Donatist voice in the vendored corpus, preserved inside
    its refutation. For the donatism entry this is the nearest thing to primary Donatist text
    on hand.

    '
- work: The Correction of the Donatists (De Correctione Donatistarum, Letter 185)
  author: augustine
  locus: div2 5.6 — The Correction of the Donatists
  atlas_ids:
  - latin-pastoral-congregational-christianity
  - donatism
  role: tradition
  confidence: assigned
  note: 'Letter-treatise (c. 417) to the tribune Boniface justifying the imperial laws against
    the Donatists after the events at Carthage — the classic defense of state correction of
    schism ("compel them to come in"). Also assigned to imperial-juridical-christianity below.

    '
- work: The Correction of the Donatists (De Correctione Donatistarum, Letter 185)
  author: augustine
  locus: div2 5.6 — The Correction of the Donatists
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: provisional
  note: 'Direct evidence for the ijc world''s core question — the church''s use of imperial
    law — written to an imperial officer to justify coercive legislation. Provisional because
    Augustine stands outside the Rome-Constantinople-Milan orbit; whether ijc should instead
    reach this through the laws themselves, rather than through their North African advocate,
    remains an open question.

    '
