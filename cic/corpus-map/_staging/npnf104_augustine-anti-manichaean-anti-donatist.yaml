- work: Reply to Faustus the Manichaean (Contra Faustum)
  author: augustine
  locus: div2 4.9 — Reply to Faustus the Manichæan (33 books, ~176k words)
  atlas_ids:
  - latin-pastoral-congregational-christianity
  role: tradition
  confidence: assigned
  note: 'The largest anti-Manichaean work (c. 400), and the most valuable text in this volume
    for the manichaeism entry: each book opens by reproducing Faustus'' Capitula in his own
    words before answering, so the fullest surviving statement of Manichaean biblical criticism
    is preserved inside Augustine''s refutation.

    '
