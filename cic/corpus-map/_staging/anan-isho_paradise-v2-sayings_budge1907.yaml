  note: 'CUSTODY, NOT VOICE, which is what this role was defined for. The sayings are Egyptian
    and their voices belong to desert-monasticism. This corpus exists in the form the world can
    read because a seventh-century monk of Beth ''Abhe gathered the Syriac versions into one
    book, and because East Syriac scribes went on copying it. The work originates outside this
    entry and this entry''s people are why we still have it - the boundary the role carries.
    Budge translated ''Anan-Isho''s recension, so the English every later reader uses descends
    from that Syriac act of collection rather than from the Greek tradition.

