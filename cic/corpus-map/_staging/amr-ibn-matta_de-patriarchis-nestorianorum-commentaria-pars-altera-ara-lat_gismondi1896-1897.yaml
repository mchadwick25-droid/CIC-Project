authors_ruled:
  amr-ibn-matta:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The
      work is named for Amr ibn Matta of Tirhan (fourteenth century), whose text Gismondi
      prints together with the recension of Sliba ibn Yuhanna of Mosul, marking Sliba's
      additions in brackets (Gismondi's preface, file lines 6388 to 6400). Ruled under
      Amr's name as the primary author, with Sliba named here. A mechanical index-coverage
      gap, not an attribution dispute.

