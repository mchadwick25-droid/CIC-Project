  role: context
  confidence: assigned
  note: >-
    Jerome Lobo, a Jesuit who lived in Ethiopia from 1624 and left after the expulsion of 1634 (the file's
    own dates), writes of the country, its church and its customs. Eyewitness outside voice from the Susenyos
    years. Johnson translated from Le Grand's French, not from Lobo's Portuguese, and the file says Le
    Grand's book was reduced to a fifth, so this is a second-hand English rendering. Clean Gutenberg text.
