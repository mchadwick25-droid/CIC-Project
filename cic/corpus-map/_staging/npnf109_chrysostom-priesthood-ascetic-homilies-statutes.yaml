- work: Homily on the Paralytic Let Down Through the Roof
  author: chrysostom
  locus: div1 12 — Homily on the Paralytic; 'Concerning the Equality of the Divine Father
    and the Son'
  atlas_ids:
  - antiochene-exegetical-christianity-chrysostom-ce
  role: tradition
  confidence: assigned
  note: 'The Antiochene home id is safe. The volume''s own notes
    say this homily proves the equality of Father and Son against the Anomoeans (editorial
    note at xii, and index entry ''Anomoeans, heresy of''). The Anomoeans/Eunomians are not
    strictly Homoians. anomoean-eunomian-christianity is now on the census for exactly the
    party the volume''s own index calls ''Anomoeans, heresy of'', and is the second id here.'
