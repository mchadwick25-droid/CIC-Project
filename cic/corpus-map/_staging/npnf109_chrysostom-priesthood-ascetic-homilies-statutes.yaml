  atlas_ids:
  - antiochene-exegetical-christianity-chrysostom-ce
  - imperial-juridical-christianity
  role: tradition
  confidence: assigned
  note: 'Twenty-one homilies, one coherent body: the city awaiting the emperor''s judgment
    after the overthrow of the imperial statues. Antiochene entry as its author''s own preaching;
