# Worker file: npnf109 (Chrysostom - treatises, occasional homilies, letters, Statues)
# The one volume in the Chrysostom set holding genuinely distinct works; split accordingly.
# Skipped as apparatus: title pages (1), preface (2), Prolegomena (3, editorial biography),
# indexes (20, 21), and every per-work title page / editorial introduction.
source_file: npnf109_chrysostom-priesthood-ascetic-homilies-statutes.xml
authors_ruled:
  innocent_rome:
    kind: metadata-omission
    evidence: 'div2 titles "To the Beloved Brother John, Innocent." (id xviii.v) and "Innocent,
      Bishop, to Presbyters and Deacons, and to All the Clergy and People of the Church of
      Constantinople... Greeting." (id xviii.vi) are letters written by Innocent, embedded
      in the correspondence section; npnf109 DC.Creator sub="Author" lists only chrysostom.

      '
