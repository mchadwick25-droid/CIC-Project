authors_ruled:
  lithos-1644:
    kind: pseudonymous
    evidence: The Lithos was published under the name Euzebi Pimin; the edition's index (file line 25551)
      calls 'Пиминъ Евсевій' the pseudonym of the compilers of the Lithos, and the study (file line 2947)
      says the same. Treated as a work-entity under its own title.
  golubev:
    kind: metadata-omission
    evidence: The introductory study is signed 'С. Голубевъ' at file line 5996 with the date 15 November
      1893; the file name carries the series title.
