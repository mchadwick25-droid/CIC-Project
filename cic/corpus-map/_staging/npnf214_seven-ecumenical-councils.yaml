      volume.

      '
  synod-of-antioch-in-encaeniis:
    kind: anonymous
    evidence: 'div2 title "The Synod of Antioch in Encaeniis." under div1 8; no DC.Creator
      in the volume.

      '
  synod-of-laodicea:
    kind: anonymous
    evidence: 'div2 title "Synod of Laodicea." under div1 8; no DC.Creator in the volume.

      '
  council-of-constantinople-381:
    kind: anonymous
    evidence: 'div1 title "The Second Ecumenical Council: The First Council of Constantinople.";
      no DC.Creator in the volume.

      '
  council-of-ephesus-431:
    kind: anonymous
