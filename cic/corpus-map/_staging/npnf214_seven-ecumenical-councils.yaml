    character. ijc is kept - these functioned as church law in the imperial-era East, which is
    what this entry is.'
- row_id: npnf214_seven-ecumenical-councils--the-canonical-epistles-of-the-fathers-received-by-trullo
  work: The Canonical Epistles of the Fathers received by Trullo Canon II
  author: canonical-epistles-fathers
  locus: div2 17.5-17.32 — Dionysius of Alexandria, Peter of Alexandria, Gregory Thaumaturgus,
    Athanasius, Basil (the canonical epistles to Amphilochius), Gregory of Nyssa, Gregory
    Nazianzen, Amphilochius, Timothy, Theophilus and Cyril of Alexandria, Gennadius of Constantinople
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: assigned
  note: 'A canon-law collection whose parts are individually attributed - most to authors with
    existing slugs (basil, athanasius, gregory_thau, dionysius_gr, peter_alexandria, gregory_naz).
    This row holds the collection-entity itself: the received Eastern canon-law corpus on
    imperial-juridical-christianity. The per-father rows below carry the individual authors to
    their own home entries - Basil, Nyssa and Nazianzen to the cappadocian entry, the
    Alexandrian canonists toward alexandria-catechetical and the Cyrilline entry, and so on -
    derived from the volume''s own div2 sections rather than from the list in Trullo canon 2.
    The collection is 32 sections, 16,936 words; sections 3-4 are the Apostolical Canons,
    already a separate work, so the per-father split covers 17.5-17.32.

    NB the volume''s theophilus and gennadius are of Alexandria and Constantinople - not the
    AUTHORS.md slugs theophilus (Antioch) and gennadius (Marseilles); the per-father rows do
    not reuse those slugs.

    The split does not duplicate the reception fact: this row stays as the received Eastern
    canon-law corpus, one row for what the East received, rather than the roughly ten additional
    rows a full per-father split of 17k words would otherwise cost. The per-father rows carry
    only their authors'' home entries - one row for what the East received, twelve for who
    wrote it.'
