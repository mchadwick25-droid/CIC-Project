# Worker: npnf210-214 group, 2026-08-26.
# Conciliar acts are collective, anonymous, and first-class (brief §6.4).
# npnf214 carries NO DC.Creator metadata at all - the div titles are the only
# signal, hence the ruled work-entities below.
#
# Skipped as apparatus: Percival's preface, General Introduction (div1 3),
# Bibliographical Introduction (div1 4), the note on Eastern editions (div1 5),
# the Excursus on Roman Law (div1 6), every per-council title page, historical
# introduction, excursus and introductory note, and the indexes (div1 18).
# What is assigned is the councils' own documents: creeds, canons, definitions,
# synodal and appended letters, and extracts from the acts.
source_file: npnf214_seven-ecumenical-councils.xml
authors_ruled:
  council-of-nicaea-325:
    kind: anonymous
    evidence: 'div1 title "The First Ecumenical Council: The First Council of Nice."; npnf214
      has no DC.Creator metadata (AUTHORS.md: none). Conciliar acts are a collective work-entity
      per brief §6.4.

      '
  council-of-ancyra:
    kind: anonymous
    evidence: 'div2 title "The Council of Ancyra." under div1 8 (provincial synods received
      by the ecumenical councils); no DC.Creator in the volume.

      '
  council-of-neocaesarea:
    kind: anonymous
    evidence: 'div2 title "The Council of Neocaesarea." under div1 8; no DC.Creator in the
      volume.

      '
  council-of-gangra:
    kind: anonymous
