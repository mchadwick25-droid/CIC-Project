    from_file: calecas_opera-omnia-pg152-grc-lat_migne1866.txt
  patriarchate-of-constantinople-register-1310-1372:
    kind: anonymous
    evidence: >-
      Tomus CLII prints, from col. 1033, the 'Diplomata, Synodicae constitutiones, Epistolae' of the patriarchs
      John Glykys, Esaias, John Calecas, Isidore, Callistus and Philotheos, 1310-1372 (running heads from file line
      81575); a series of patriarchal acts, no single author.
    from_file: calecas_opera-omnia-pg152-grc-lat_migne1866.txt
