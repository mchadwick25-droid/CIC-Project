- row_id: teresa-of-avila_book-of-foundations_mason1909--foundations-carmelites
  work: The Book of the Foundations, the passages on the mitigated Rule, the Calced provincials and Mount
    Carmel
  author: teresa-of-avila
  locus: the dealings with the Fathers General and provincials of the mitigated Rule through the file
  atlas_ids:
