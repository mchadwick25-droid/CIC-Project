assignments:
- row_id: teresa-of-avila_book-of-foundations_mason1909--foundations
  work: The Book of the Foundations (Libro de las fundaciones), translated by Sister Agnes Mason, 1909
  author: teresa-of-avila
  locus: whole file; prologue at line 596; first foundation chapter at line 739; the dealings with the
    Bishop of Avila, Don Alvaro de Mendoza, around lines 999 and 4754; Seville (61 hits) and Burgos (60
    hits)
  atlas_ids:
  - carmelite-reform-and-spanish-mystics
  role: tradition
  confidence: assigned
  note: Teresa's own narrative of the reform's spread, house by house, from Valladolid and Medina del
    Campo to Burgos, with the quarrels with provincials of the mitigated Rule and her dealings with Father
    Gracian. The nearest thing in the corpus to a chronicle of the reform by its founder. Primary first-person
    voice in English; ready to quote once each quote is verified against the page image.
- row_id: teresa-of-avila_book-of-foundations_mason1909--foundations-tridentine
  work: The Book of the Foundations, the chapters naming the Council of Trent and the bishops who enforced
    enclosure
  author: teresa-of-avila
  locus: Teresa's own reference to the Council of Trent sanctioning endowments at line 5528; Trent in
    Mason's notes at lines 7051, 7102, 8951
  atlas_ids:
  - the-tridentine-church
  role: context
  confidence: provisional
  note: At line 5528 Teresa reports her confessor telling her that, since the Council had sanctioned endowments,
    she should found a convent with revenues; Mason's notes cite the Council on enclosure and licence.
    Placed on those passages and word counts, not read through, so provisional.
