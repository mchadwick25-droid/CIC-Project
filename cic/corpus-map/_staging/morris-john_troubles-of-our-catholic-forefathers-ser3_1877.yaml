    role: context
    confidence: provisional
    note: >
      A contemporary opponent's catalogue of the Settlement's penal machinery as applied;
      placed on window and place, for the Settlement's Doc_02 to accept or set aside.
  - row_id: morris-john_troubles-of-our-catholic-forefathers-ser3_1877--yorkshire-recusants-relation
    work: "A Yorkshire Recusant's Relation (searches, examinations, prisons, arraignments and executions, by an unnamed Yorkshire Catholic)"
    author: yorkshire-recusant
    locus: "heading at file line 3266 to the third paper at line 5013"
    atlas_ids:
      - recusant-english-catholicism
    role: tradition
    confidence: assigned
