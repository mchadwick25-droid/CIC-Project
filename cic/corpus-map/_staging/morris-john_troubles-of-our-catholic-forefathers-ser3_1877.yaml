      Morris's spelling.
  - row_id: morris-john_troubles-of-our-catholic-forefathers-ser3_1877--notes-by-a-prisoner-in-ousebridge-kidcote
    work: "Notes by a Prisoner in Ousebridge Kidcote (with Morris's note on those who died in the York and Hull prisons)"
    author: ousebridge-kidcote-prisoner
    locus: "heading at file line 10657; the notes themselves from about line 14233 to the fifth paper at 15722"
    atlas_ids:
