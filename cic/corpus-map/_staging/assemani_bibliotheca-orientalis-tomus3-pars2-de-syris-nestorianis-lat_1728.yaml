    work: "Bibliotheca Orientalis III.2, the dissertation De Syris Nestorianis: the election of Sulaka, his profession and proclamation at Rome, his death, and the line of Abdisho IV"
    author: assemani
    locus: "the dissertation's account of the patriarchal line from the hereditary succession at file lines about 11990-12070; Abdisho's profession quoted at about line 42232; Sulaka's profession of faith cited at about lines 18698, 19857, 21801 and 25242; Caput VIII (the conversions of the Nestorians) from line 27477"
    atlas_ids:
      - church-of-the-east-schism-of-1552
    role: context
    confidence: assigned
    note: >
      The fullest early documentary account from the Roman side, by a Maronite priest of the Vatican Library
      working from Chaldean manuscripts and Roman archives (the census: "documented from the Roman side").
      Gives the 1551 election at Mosul by three bishops and many clergy against the hereditary heir, the
      journey to Rome, the profession of faith, the return, the death at Amid in 1555 at the instigation of
      the rival, and the confirmation of Abdisho in 1562. The dates in this OCR are garbled; the 1725 volume's
      list (not vendored) reads clearer. Latin; the English of this story in the corpus is Geddes (1694), via
      Hough. Second witness for exact wording: long s read as f throughout.
