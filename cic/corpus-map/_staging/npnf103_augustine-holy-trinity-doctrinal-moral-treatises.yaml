    '
- row_id: npnf103_augustine-holy-trinity-doctrinal-moral-treatises--against-lying-contra-mendacium-2
  work: Against Lying (Contra Mendacium)
  author: augustine
  locus: div2 5.6 — Against Lying
  atlas_ids:
  - priscillianist-asceticism
  role: tradition
  confidence: provisional
  note: 'One of the few vendored texts that describes Priscillianist practice at all (their
    alleged doctrine that lying to conceal the faith is permissible; 41 Priscillian* mentions
    in the volume). Hostile outside description by a Catholic opponent — a future Priscillianist
    world could use it only as etic material, but the entry has almost nothing else, so it
    should be findable here. Provisional because the treatise''s subject is lying, not the
    movement.

    '
- row_id: npnf103_augustine-holy-trinity-doctrinal-moral-treatises--of-the-work-of-monks-de-opere-monachorum
