- row_id: npnf103_augustine-holy-trinity-doctrinal-moral-treatises--on-the-profit-of-believing-de-utilitate-credendi
  work: On the Profit of Believing (De Utilitate Credendi)
  author: augustine
  locus: div2 4.6 — On the Profit of Believing
  atlas_ids:
  - latin-pastoral-congregational-christianity
  role: tradition
  confidence: assigned
  note: 'Shelved by NPNF among the doctrinal treatises but written (391) to Honoratus, the
    friend Augustine had himself led into Manichaeism, against the Manichaean promise of reason
    without authority — Augustine''s own catalogue counts it among the anti-Manichaean works,
    so it goes to both his entry and the entry it argues against.

    '
- row_id: npnf103_augustine-holy-trinity-doctrinal-moral-treatises--on-the-profit-of-believing-de-utilitate-credendi-2
  work: On the Profit of Believing (De Utilitate Credendi)
  author: augustine
  locus: div2 4.6 — On the Profit of Believing
  atlas_ids:
  - manichaeism
  role: context
  confidence: assigned
  note: 'Shelved by NPNF among the doctrinal treatises but written (391) to Honoratus, the
    friend Augustine had himself led into Manichaeism, against the Manichaean promise of reason
    without authority — Augustine''s own catalogue counts it among the anti-Manichaean works,
    so it goes to both his entry and the entry it argues against.

    Role normalised to `context` for the doctrinal-floor entry: this work describes that movement
    from outside rather than speaking as it, and the brief allows a built world to draw on
    floor material only as `register: etic`.'
