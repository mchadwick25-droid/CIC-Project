assignments:
- row_id: npnf103_augustine-holy-trinity-doctrinal-moral-treatises--on-the-holy-trinity-de-trinitate
  work: On the Holy Trinity (De Trinitate)
  author: augustine
  locus: div2 4.1 — On the Holy Trinity
  atlas_ids:
  - latin-pastoral-congregational-christianity
  role: tradition
  confidence: assigned
  note: 'The mature Latin statement of Nicene trinitarian theology, written over two decades
    at Hippo. Stays in Augustine''s own entry; it argues against Arian readings in places
    but is not aimed at the Homoian church the doctrinal-floor entry names, so it is not assigned
    there.

    '
