    - anglo-saxon-christianity
    - byzantine-imperial-church-justinianic
    role: context
    confidence: assigned
    note: 'CONTEXT row: four entries
      that are not Gregory''s. The letters are evidence ABOUT these worlds from outside them: monastic discipline
      in Italy and Sicily, the letters to Brunichild and the Frankish court, Book VI and Book XI''s Responsa
      launching and steering the mission to Kent, and the quarrel with Maurice and John the Faster over
      the title ''ecumenical patriarch''. Leaving them as `tradition` would have made Gregory a voice of
      four traditions he was writing to.

      '

