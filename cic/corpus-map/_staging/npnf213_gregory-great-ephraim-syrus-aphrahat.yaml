  - work: "Select Demonstrations of Aphrahat"
    author: aphrahat
    locus: "div2 3.9 — Aphrahat: Select Demonstrations"
    atlas_ids:
      - syriac-edessa-nisibis
      - persian-church-of-the-east-early
    role: tradition
    confidence: assigned
    note: >
      The Persian Sage, writing 337-345 inside the Persian empire under
      Shapur II - earliest major witness of Syriac Christianity, assigned
      both to the built Syriac world and to the early Persian Church of the
      East entry whose ground he writes from. A different selection
      (Demonstrations 2 and 7, Hallock) is a standalone volume held by
      another worker; the two files' selections overlap in author but not in
      staging ownership.
