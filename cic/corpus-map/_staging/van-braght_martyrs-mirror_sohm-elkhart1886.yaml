  note: 'Thieleman J. van Braght''s martyr book of 1660 in Joseph F. Sohm''s English, the Elkhart printing of 1886. It embeds named documents in English: the articles against Michael Sattler and his sentence (file lines 57865 to 58113) and the testament of Anna of Rotterdam to her son (from file line 62960).'
- row_id: van-braght_martyrs-mirror_sohm-elkhart1886--the-bloody-theatre-or-martyrs-mirror-the-hus-and-taborite-sections
  work: 'The Bloody Theatre, or Martyrs Mirror of the Defenseless Christians, the Hus and Taborite sections'
  author: van-braght
  locus: 'file lines 46672-46947, from the entry ''A. D. 1415. — At this time John Huss lived'' and the sections on the Taborites (lines 46823-46874)'
  atlas_ids:
