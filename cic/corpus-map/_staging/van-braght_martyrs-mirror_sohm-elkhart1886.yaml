  role: context
  confidence: provisional
  language: eng
  date: {start: 1659, end: 1660, source: "van Braght's Invocation dated 'Dort, July the 23d, 1659' (file line 345) and the title leaf: 'from the Edition of 1660'", formation_confidence: Documented}
  note: 'A Dutch Mennonite martyrologist''s 1660 account, in the English of 1886, of Hus and of the Taborites (it calls them Waldenses). It reaches this world at three removes and from an Anabaptist point of view, and it includes a ''confession of the Taborites, drawn up A. D. 1431'' whose own source is not vendored. Not Hussite voice; a witness to how a later movement read them.'
- row_id: van-braght_martyrs-mirror_sohm-elkhart1886--the-taborite-sections-and-the-adamites-passage
  work: 'Van Braght, Martyrs Mirror (Sohm, 1886): the Taborite sections and the Adamites passage'
  author: van-braght
  locus: 'file lines 46823-46874 (the Taborites), 46910 (the confession of 1431) and 40812 (the Adamites named)'
  atlas_ids:
  - taborite-radicalism
  - inquisition-record-sects-adamites-and-kin
  role: context
  confidence: provisional
  language: eng
  note: 'A 1660 Anabaptist reading of the Taborites, with what it calls a confession of the Taborites drawn up in 1431 (file line 46910; its source is not vendored) and a passage that names Adamites among the names given to dissenters (file line 40812). Three removes from any Taborite text; a witness to how a later movement read them.'
- row_id: van-braght_martyrs-mirror_sohm-elkhart1886--martyrs-mirror-tauler-cited-as-a-witness-against-the-church
  work: 'Martyrs Mirror: Tauler cited as a witness against the church of his day'
  author: van-braght
  locus: 'file lines 45270-45306, under ''SAME YEAR AS ABOVE, A. D. 1400''; Tauler named again at 46273'
  atlas_ids:
  - rhineland-mysticism-and-the-friends-of-god
  role: context
  confidence: provisional
  language: eng
  note: 'Under the year 1400 the compiler quotes Tauler on blind prelates, says he never urged one man to hurt another, and praises him (file lines 45270 to 45306; Tauler is named again at 46273). The Mennonite martyr book thus claims him.'
