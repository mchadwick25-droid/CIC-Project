- row_id: theiner_vetera-monumenta-poloniae-lithuaniae-v3-lat_1863--the-union-of-brest-documents-1595-1596
  work: 'The Union of Brest documents, 1595-1596: the Ruthenian bishops'' articles, their professions
    of faith, the bull Magnus Dominus et laudabilis (Clement VIII) and the acts of the Synod of Brest
    (contemporary Latin versions)'
  author: theiner
  locus: articles 'Articuli quorum cautionem petimus a dominis Romanis' about file line 21175; Hypatius
    Pociey's profession of faith about 21496; the bull 'Magnus Dominus et laudabilis' about 21655; the
    Synod of Brest acts (Nr. CXCV) about 23336; the Argumenta (summaries) at about 1255
  atlas_ids:
  - the-union-of-brest-and-ruthenian-greek-catholic-
  role: tradition
  confidence: assigned
  note: 'The union''s own founding instruments: the conditions the Ruthenian bishops asked of Rome (1595),
    their professions of faith at Rome, the pope''s bull and the synod decree of October 1596. Latin versions
    made at the time from the Ruthenian and Polish originals, which the volume does not print (the Argumenta
    say the originals are omitted). Primary voice, ready to quote once verified against the scan. Latin
    only; no public-domain English found (the one English item on the host is a machine translation).'
