  note: 'The papal side of the same instruments: Clement VIII''s bull and letters as an act of the Tridentine
    papacy toward the Eastern church. Placed on the document type, not on a reading of the whole volume;
    the Tridentine world may want only the bull. Latin only.'
- row_id: theiner_vetera-monumenta-poloniae-lithuaniae-v3-lat_1863--papal-and-royal-letters-on-the-ruthenian-church-1596-1696
  work: Papal, royal and nuncial letters on the Ruthenian church after Brest, 1596-1696 (Latin and Italian)
  author: theiner
  locus: after the Synod of Brest (about line 23336) to the end of the volume; the Argumenta list the
