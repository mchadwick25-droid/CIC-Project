    note: >
      The Täuferakten volume for the duchy of Württemberg: ducal mandates,
      visitation and interrogation reports, the prisoners' own confessions
      and answers, and lists of Täufer, 1521/1527 to 1641, in German.
      Primary voice for the court-testimony genre the census names, read
      with the caution the census itself gives (testimony under
      interrogation is coerced speech, and the authorities' regesta are
      the hostile frame around it). Clean Antiqua OCR, sampled at five
      points; ready to quote once each passage is verified against the
      page images. No public-domain English translation exists. The scan
      reproduces the 1971 Johnson Reprint of the 1930 Leipzig edition;
      the rights basis is the 1930 publication date.

