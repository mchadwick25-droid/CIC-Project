    language: por-lat
    date: {formation_confidence: unknown, checked: "file header and Beccari's Latin preface (1907 imprint dates the edition only); the preface does not give a composition date for the books"}
    note: >
      The Ethiopian mission in the Society's own historian's words, from the patriarch's arrival
      to the expulsion. Placed on window and subject without reading the whole volume; role
      tradition because the author is a Jesuit narrating a Jesuit mission, for the Jesuit world's
      builders to confirm, as the Paez and Mendes rows already are.
