    note: >
      An outside witness in English: the English pilot William Adams writing from Japan in
      the years the prohibition tightened (1611-1617), and an Elizabethan description of Japan
      drawn from Jesuit reports. Hostile to the Jesuits and Protestant in sympathy; useful
      for the Japan strand's setting and for how the church looked to a trader, not a
      convert voice. Rundall's notes quote Charlevoix in French. Clean OCR.
