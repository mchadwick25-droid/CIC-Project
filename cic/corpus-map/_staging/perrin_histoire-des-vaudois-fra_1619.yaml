  - row_id: perrin_histoire-des-vaudois-fra_1619--histoire-des-vaudois-premiere-partie
    work: "Histoire des Vaudois (1619), Part I: origin, belief and persecutions of the Waldenses, with the 1532 articles of the ministers"
    author: perrin
    locus: "front matter and table of all three parts from line 19; Part I from 'CHAPITRE I' at line 1177; the 1532 articles (numbered I-XVII) around line 12113; the file ends with the 1545 massacre of Cabrières and Mérindol in Provence"
    atlas_ids:
      - the-waldensian-reformed-union
    role: tradition
    confidence: assigned
    note: >
      Jean Paul Perrin, Reformed pastor at Nyons in Dauphiné, wrote at the
      commission of the synod of the valleys from their own papers, and
      dedicated the book to Lesdiguières. Written inside the window (1619) by
      a pastor of the union's own churches. This scan holds Part I only; Parts
      II and III are in the English compilation
      perrin_history-ancient-christians-valleys-alps_1847.txt, which also
      carries Part I in English. The OCR renders long s as f: second witness
      for wording until a cleaner scan is vendored.
