    role: tradition
    confidence: provisional
    note: >
      An Urmia-born author's own English history of his church, with the Shimun-line patriarch lists the
      Roman sources lack. It gives the schism in a few paragraphs, with its own numbering (Shimon VIII is the
      Sulaka of Rome) and one point of conflict with the Roman accounts that a build should read. Provisional
      because the book is a late community historiography that repeats older tradition without citing sources,
      and the schism passage is short.
