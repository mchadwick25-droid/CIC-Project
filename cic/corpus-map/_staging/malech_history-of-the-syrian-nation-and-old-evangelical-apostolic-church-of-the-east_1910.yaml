    author: malech
    locus: "chapter XXXI from file line 16600 (the patriarchs of 1503-1617; the schism at about 16637-16670); chapter XXXII from 16773 (the patriarchal tables to 1903 and the move to Kudshanes)"
    atlas_ids:
