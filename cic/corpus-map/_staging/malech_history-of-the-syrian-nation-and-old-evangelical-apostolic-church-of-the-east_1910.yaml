authors_ruled:
  malech:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The title page (file lines
      about 246-248) reads "By Prof. George David Malech of Urmia, Persia", edited after his death by his son
      Nestorius George Malech; the host catalogue gives 1837-1909. A mechanical index-coverage gap, not an
      attribution dispute.

