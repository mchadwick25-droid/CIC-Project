  atlas_ids:
  - chalcedonian-monasticism-judean-desert-and-gaza
  role: context
  confidence: provisional
  note: 'The anti-Chalcedonian monks of Gaza on Juvenal''s acceptance of the council and on the Chalcedonian
    Palestinian establishment: the contemporary opponent''s view of this entry. Context.'
