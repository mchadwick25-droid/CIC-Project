  note: 'Hostile, Prague-side chronicler of Tábor (about 270 mentions of Tábor/Táborští) and of the Adamites
    of 1421. Goll''s editorial note near file line 1669-1674 says the text carries, after the Adamites''
    articles, further inserted articles: ''Articuli de Pikardis'', ''Articuli hereticorum Waldensium et
    decardorum'' and ''Articuli sacerdotum hereticorum et Pikardicorum'' (the second and third on Táborites
    and Brethren). Already assigned to the Hussite entry as tradition (provisional). Tier: same time-place.
    Not read through by this pass.'
