  note: 'The official Moscow chronicle of the Troubles compiled under Patriarch Filaret''s circle in the
    1630s, from the Nikon Chronicle manuscripts: the founding of the patriarchate (1589), Patriarch Job,
    Hermogenes''s resistance in 1611, the Trinity siege, the 1613 election and the Michael-Filaret years.
    The chronicle voice the census names and the first pass lacked. Readable OCR, yat misread; quote after
    a page-image check. The 1853 Obolensky print of the same chronicle is on the host, not vendored.'
