    note: >
      The movement's own central inside voice: Avvakum Petrov's autobiography,
      written from his earthen prison at Pustozersk c. 1673, the first sustained
      autobiography in the Russian language. English translation, verbatim-ready
      in segments (the OCR carries stray marks and page-break running heads
      inside sentences; see Doc_02 section 7). PRIMARY source for this world's
      own Doc_02.
