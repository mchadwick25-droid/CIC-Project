  note: 'The Society''s own school documents from 1540 to 1586, in the languages they were written in.
    It gives the drafts and rules behind the Ratio Studiorum, whose final text is in Institutum Societatis
    Iesu, Vol. 3. Primary original evidence for the movement, quotable once each wording is checked against
    the page image: the scan is legible with occasional letter-level misreads. Word-form coverage against
    a clean Latin vocabulary is 0.77; the Spanish, Italian and Portuguese passages and the notes lower
    it, so the figure is a comparison across files and not a measure of accuracy.'
