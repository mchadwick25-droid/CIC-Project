    note: >
      A hostile contemporary account of Origen's teaching, written about 375 by the man who
      then carried the case against Origen to Jerusalem (393) and Constantinople (402). The view
      from outside the Alexandrian tradition, in the original Greek; context, not its voice.
      Greek and German both recovered in the OCR; ready to quote once verified against the scan.
  - row_id: epiphanius_panarion-haer-34-64-gcs-bd2-grc_holl1922--panarion-heresies-34-64-gcs-31-greek-2
    work: "Panarion, heresies 34-64 (GCS 31, Holl 1922), Greek"
    author: epiphanius
    locus: "whole volume"
    atlas_ids:
      - palestinian-ascetic-monasticism-early
    role: context
    confidence: provisional
    note: >
      Epiphanius founded a monastery near Eleutheropolis in Palestine before his Cypriot
      episcopate, and his campaign against Origen ran through the Palestinian monasteries of
      Jerome and Rufinus. Placed as context for that world; whether it is better read as the
      world's own voice is a build-thread call, named here and not decided.
