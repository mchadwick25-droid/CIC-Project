    note: 'Epiphanius on the New Prophecy, with sayings of Montanus and Maximilla quoted as he knew them (48.4, 48.10-13). He dates its rise to about the nineteenth year of Antoninus Pius (48.1.2), which disagrees with the Chronicle''s eleventh year of Marcus; the start is told as two old datings. The Greek original; no English of the Panarion is held. Context: hostile. Check every quotation against the page images.'
