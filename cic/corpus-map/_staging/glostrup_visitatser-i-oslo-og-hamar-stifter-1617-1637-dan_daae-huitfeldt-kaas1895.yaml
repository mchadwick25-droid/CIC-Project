    note: >
      The Norwegian church's own record of itself a century into the Reformation: a bishop's
      parish-by-parish visitations under the Church Ordinance, noting ministers, schools,
      churches, catechising and discipline, in his own Danish. The ordinary voice the census
      promises (visitation records) for the Norwegian half of Denmark-Norway, which the first pass
      found only as a lead. Readable OCR, primary in the original; quotable, and renderable by
      Opus, once each passage is verified against the page image. The editors' introduction (1895)
      is secondary.
