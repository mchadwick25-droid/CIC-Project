  note: >-
    A church officer (great ecclesiarch) of the Greek delegation who signed, then repudiated the union. An insider
    and hostile voice, written after the council. Placed on window and region; the book was sampled at three points,
    not read through. Whether a memoir by a signatory who turned against the union counts as the church's voice
    or as context is for the lead. A primary voice, ready to quote once checked verbatim against the scan; Greek
    and Latin are read from the same OCR, and a quote record must be verified against the page image. No public-domain
    English translation of this work is vendored (see the dossier, section 4).
