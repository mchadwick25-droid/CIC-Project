  confidence: assigned
  note: 'The founding Life of the movement''s founder and the Praise its Epiphanius wrote, in the Slavonic
    of the sixteenth-century Menaion. The census says Epiphanius''s own Life survives only through Pachomius''s
    reworking; the Life here names Pachomius as its writer (line 5033) and the Praise is assigned in its
    heading to Epiphanius. Primary voice, ready to quote once checked against the page images; the OCR
    is Slavonic with systematic letter substitutions, so cite by wording and file line. No public-domain
    English translation: Mouravieff''s narrative (vendored) retells it, and Zenkovsky''s abridged English
    is in copyright.'
