  work: 'Great Menaion of Metropolitan Macarius, September 25: the Life of Saint Sergius of Radonezh (Pachomius''s
    redaction) and the Praise of Sergius ascribed to Epiphanius'
  author: macarius-metropolitan
  locus: the Life from file line 1363 to 12158 (printed columns 1408-1562); the Praise 'сотворено ...
    священноинокомъ Епифанемъ' from 12159 to about 13358 (columns 1563-1580)
  atlas_ids:
