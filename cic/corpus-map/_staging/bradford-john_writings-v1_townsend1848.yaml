  - row_id: bradford-john_writings-v1_townsend1848--bradford-s-prison-letters-farewells-and-his-examinations-and-conferenc
    work: "Bradford's prison letters, farewells, and his Examinations and conferences of 1555"
    author: bradford-john
    locus: "from about file line 23623 (letters and farewells) and the Examinations from about 25066 to the end of the volume"
    atlas_ids:
      - the-english-reformation-and-elizabethan-settleme
    role: tradition
    confidence: assigned
    note: >
      A Marian martyr's own record of his hearings before Gardiner and the
      commissioners and of his conferences with Bonner's chaplains and the Spanish
      friars, beside the farewells he wrote to Lancashire, Cambridge and London.
      Bradford's own account, not Foxe's frame; Foxe printed much of it, and this
      is the Parker Society text from the earliest printings. Primary voice, clean
      OCR.
