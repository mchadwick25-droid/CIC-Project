  - row_id: council-of-trent_canons-and-decrees_waterworth1848--session-xxv-on-regulars-and-nuns
    work: Canons and Decrees of the Council of Trent, Session XXV, Decree on Regulars and Nuns (property,
      revenues, enclosure of nuns)
    author: council-of-trent
    locus: Session XXV from line 21861; "ON REGULARS AND NUNS" at line 22049; chapter II on property at
      line 22099; the chapter permitting real property at about line 22140; chapter V on the enclosure of
      nuns at line 22208
    atlas_ids:
    - carmelite-reform-and-spanish-mystics
    role: antecedent
    confidence: provisional
    note: The vendored Teresa texts argue from this decree by name. In the Foundations (teresa-of-avila_book-of-foundations_lewis1913.txt)
      she reports that the Council allowed convents to hold revenues and founds with an endowment on that
      ground (lines 7135-7140 and 11413), a hermit group is swept into the orders by the Council (line 10025),
