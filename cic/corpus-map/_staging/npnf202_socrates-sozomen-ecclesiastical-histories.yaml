    language: eng
    note: >
      Same work, context row. Sozomen is the most monastically interested of
      the continuators: I.12-14, III.14 and VI.28-34 are extended accounts of
      Egyptian (and Palestinian/Syrian) monasticism naming Antony, Pachomius
      and the Nitrian fathers - outside evidence desert's ecology needs. Books
      II.9-14 preserve the martyrs of Persia under Shapur II, among the best
      Greek evidence for the early Persian church. III.16 is an independent
      notice of Ephraim and Syriac letters. Books I-IV narrate the
      Arian/homoian ascendancy; Book VIII is a book-length account of
      Chrysostom. Each id above rests on sustained treatment, not mention.

