      central dissent on church authority. Drawn from the full
      33-volume Wyclif Society Latin series on archive.org (only vol. 2,
      the already-vendored Buddensieg Polemical Works, had been checked
      before this file). Per the Library's non-English-primary-evidence
      rule (Build/worlds/_cross-world/LIBRARY-DECISION-LOG.md), this
      Latin text is primary evidence directly, verified against the
      vendored file, since it is primary to the movement regardless of
      language; the scan is clean, not flagged as garbled under the
      Library's own OCR-quality rule.
