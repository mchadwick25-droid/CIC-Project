    note: >
      The 1884 English translation of Giussano's Life (Rome, 1610), Books I-IV: Borromeo's birth to 1578, including the Milan plague of 1576. Giussano was an Oblate of St. Ambrose who served under Borromeo and wrote at the Oblates' request; a hagiographic Life by an insider, written for the canonisation, not a neutral record. Primary for this world's own memory of its founder; the Italian original is giussano_vita-di-s-carlo-borromeo-ita_1855.txt. OCR clean; quotable once verified.
