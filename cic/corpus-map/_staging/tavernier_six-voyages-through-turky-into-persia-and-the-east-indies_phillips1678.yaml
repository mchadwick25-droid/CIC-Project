    note: >
      A foreign traveller's account of the Armenian deportation and of the Armenian quarter
      and church at Isfahan, from the Persian road he travelled before 1670. An outside
      witness, not the church's voice. The passages cited were read; the rest of the book
      (the Persian road, India, the Seraglio, the Caspian description) was not read for
      this entry. The OCR reads long s as f throughout, with broken words: second witness
      for exact wording; check every quotation against the page image. No translation of
      the French original is needed (this is the 1678 English); the translator's name is
      the host catalogue's, not read off the page.
