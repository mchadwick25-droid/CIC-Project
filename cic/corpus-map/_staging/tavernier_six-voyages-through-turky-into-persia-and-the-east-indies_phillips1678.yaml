    locus: "the deportation of Julfa and the founding of New Julfa (file lines 2767-2789); the ruin of old Julfa and the merchant Cogia Nazar (lines 2983-3009); the Armenian bazaar at Isfahan (line 13633); the chapter on the religion and ceremonies of the Armenians (contents line 1134, chapter heading about line 14987)"
