    note: >
      Borromeo's own preached voice: seventeen sermons to the Angeliche nuns of S. Paolo, written down after hearing them by Angelica Agata Sfondrati, in the 1902 Milan re-edition. Caveat on wording: the 1902 preface says the spelling was lightly modernised and some obsolete phrases altered, and the appendix's three discourses are the editors' own translation from Possevino's Latin, not Borromeo's words. For exact wording the first printing is Sermoni familiari (Padua: Comino, 1720), archive.org bub_gb_At9JPge9gbkC, not yet vendored because its OCR reads the long s as f. Legible OCR with a cluster of garbled lines around the 70 % point.

