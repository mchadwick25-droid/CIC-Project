    note: >
      A Dutch Mennonite martyrologist's 1660 account, in the 1886
      English edition, of Hus and of the Taborites (it calls them
      Waldenses). It reaches this world at three removes and from an
      Anabaptist point of view, and it includes a "Taborite confession
      of 1431" whose own source is not vendored. Not Hussite voice;
      a witness to how a later movement read them.
