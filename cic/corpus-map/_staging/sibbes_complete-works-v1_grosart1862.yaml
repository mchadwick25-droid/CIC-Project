    locus: "from THE SOUL'S CONFLICT WITH ITSELF at file line 15021 to THE SAINT'S SAFETY IN EVIL TIMES at line 25865"
    atlas_ids:
      - puritanism
    role: tradition
    confidence: assigned
    note: >
      Sermons on Psalm xlii. 11 about the believer's inward disquiet and
      the way back to trust; the pastoral counterpart to the diaries'
      self-examination. Primary voice; OCR clean.
