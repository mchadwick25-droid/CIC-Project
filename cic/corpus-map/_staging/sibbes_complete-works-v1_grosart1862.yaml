  - row_id: sibbes_complete-works-v1_grosart1862--the-bruised-reed-and-smoking-flax
    work: "The Bruised Reed and Smoking Flax (1630), with A Description of Christ"
    author: sibbes
    locus: "A DESCRIPTION OF CHRIST from file line 8229; THE BRUISED REED AND SMOKING FLAX from line 10057 (epistle dedicatory and address To the Christian Reader, then the sermons in two parts) to THE SOUL'S CONFLICT at line 15021; Grosart's notes follow each work"
    atlas_ids:
      - puritanism
    role: tradition
    confidence: assigned
    note: >
      Sibbes's best-known work, the sermons on Matthew xii. 20 that
      Baxter said first turned his heart: Christ's gentleness with weak
      and bruised believers, the characteristic affective divinity of the
      Cambridge Puritan preachers. Primary voice in Grosart's clean
      text; ready to quote once verified against the scan.
  - row_id: sibbes_complete-works-v1_grosart1862--the-soul-s-conflict-with-itself
