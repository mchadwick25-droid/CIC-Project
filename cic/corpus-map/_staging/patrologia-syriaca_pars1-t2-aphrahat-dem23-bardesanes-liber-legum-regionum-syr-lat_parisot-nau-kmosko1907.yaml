    work: The Book of the Laws of Countries (Liber legum regionum), Syriac with Nau's Latin
    author: patrologia-syriaca
    locus: from OCR line 49589 (add 12); the dialogue with Avida from about 49660
    atlas_ids:
    - bardaisanite-current
    role: tradition
    confidence: assigned
    note: 'The dialogue on fate and freedom written down by Bardaisan''s pupil Philip: the movement''s one
      surviving work, here in the Syriac with Nau''s Latin translation (1907). The Syriac OCR is garbage;
      Nau''s Latin is a modern translation, quotable as that, beside Cureton''s English already held in
      anf08.'
  - row_id: patrologia-syriaca_pars1-t2-aphrahat-dem23-bardesanes-liber-legum-regionum-syr-lat_parisot-nau-kmosko1907--testimonia-de-bardesane-nau
    work: Nau, Scriptorum testimonia de Bardesanis vita, scriptis, doctrina (ancient witnesses on Bardaisan)
    author: patrologia-syriaca
    locus: Praefatio, Caput I, from OCR line 46586 (add 12)
    atlas_ids:
    - bardaisanite-current
    role: context
    confidence: assigned
    note: 'Nau''s gathering of the ancient witnesses on Bardaisan (Julius Africanus, Porphyry, Eusebius,
      Epiphanius, Ephrem, Theodoret, Moses of Khoren, later Syriac writers), quoted in Latin or their own
      Greek. A finding aid to the old sources; each witness is quoted from its own held edition where the
      Library has one. Context: it describes the movement from outside, so a built world draws on it only
      as register: etic.'
