  - row_id: admonition-to-parliament_puritan-manifestoes_frere-douglas1907--an-admonition-to-the-parliament-1572
    work: "An Admonition to the Parliament (1572), with its address To the Reader and the annexed View of Popish Abuses yet remaining in the English Church"
    author: admonition-to-parliament
    locus: "from TO THE READER at file line 1553; running heads AN ADMONITION TO THE PARLIAMENT from line 1867; the View of Popish Abuses follows within the same reprint, ending before AN EXHORTATION TO THE BYSHOPS at line 4203"
    atlas_ids:
      - puritanism
    role: tradition
    confidence: assigned
    note: >
      The founding manifesto of the Elizabethan Puritan movement, in the
      1572 spelling: the demand for a preaching ministry, discipline by
      elders, and the removal of 'popish abuses' from the Prayer Book.
      The editors attribute it to John Field and Thomas Wilcox, who were
      imprisoned for it; the slug is the work's own name because the
      tract was issued anonymously. Primary voice; OCR clean.
