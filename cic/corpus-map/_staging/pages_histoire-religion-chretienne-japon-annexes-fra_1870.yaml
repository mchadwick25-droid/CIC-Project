    note: >
      The nearest thing in the corpus to the Kirishitan converts' own voice: letters of
      Japanese Christians under the prohibition, printed by Pages in his own French
      translation from the Jesuit and mendicant originals. A translated witness, two steps
      from the Japanese: quote with that disclosed, and prefer the originals when a build
      can reach them. French OCR legible with letter-level misreads.
