    note: >
      The missionary pen's record of the persecution years: Jesuit, Franciscan, Dominican
      and Augustinian letters and relations, the bishop of Japan's letters to the king of
      Spain, and papal briefs, compiled for the 1867 beatification of the 205 martyrs.
      Pages's narrative volume (premiere partie, 1869) is not vendored. The Spanish and
      Portuguese extracts near the end have noisier OCR than the French.
