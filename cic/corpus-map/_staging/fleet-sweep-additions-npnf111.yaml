  author: chrysostom
  locus: Homily XXIII at file line 53993 - "Let every soul be subject unto the higher powers", and
    the distinction between authority as such and any particular ruler
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: assigned
  note: 'The proof text the whole church-and-empire question stands on, read by a bishop in front of
    a congregation. Chrysostom raises the obvious objection himself - "is every ruler then elected by
    God?" - and answers "This I do not say": what is divinely willed is that there be rule at all,
    not who holds it. That distinction is what lets a bishop obey an emperor and refuse him in the
    same year.

    PREACHED AT ANTIOCH IN THE 390s, before Constantinople, in a city that had recently rioted
    against imperial statues. Not the same setting as the Eutropius homily the same world holds at
    npnf109, and the two must not be run together.

    THE VOLUME''S OWN EDITOR OBJECTS in a bracketed note straight after the distinction, calling it
    philosophy rather than exposition - a nineteenth-century Protestant editor, not evidence about
    the fourth century.

    '
