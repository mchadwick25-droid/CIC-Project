  note: 'The staging for this file puts it on the Latin papal church only. In the window of this world
    it carries the Maronite matter: ''Mandatum patriarchae Maronitarum'' in the contents (file line 851);
    the orator of the Maronite patriarch''s obedience (63569, 63581); ''EPISTOLA PATRIARCHAE MARONITARUM''
    at 98303 and ''LITERA MARONITARUM AD LEONEM X'' at 98365, where ''Petrus patriarcha'' writes to Leo
    X; and the election of the patriarch and his oath at 98633 to 98979. Read at the letter''s opening.
    The one place a Maronite patriarch speaks in the window, in Latin. Long s read as f.'
