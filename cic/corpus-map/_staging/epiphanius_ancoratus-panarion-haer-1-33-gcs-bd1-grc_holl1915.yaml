  note: 'Epiphanius on the Nazoraeans and Ebionites, with his quotations from their Gospel. The old source for the current''s places and for its start after the fall of Jerusalem; it names no end year. The Greek original; no English of the Panarion is held. Context: hostile, late fourth century. Holl''s Greek is fair; check every quotation against the page images.'
