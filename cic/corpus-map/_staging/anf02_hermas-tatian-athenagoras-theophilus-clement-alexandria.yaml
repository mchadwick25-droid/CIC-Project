  language: eng
  note: 'Tatian sits awkwardly across two entries: a pupil of Justin writing in Rome (pahc''s
    window and region), later returned east and claimed as a forefather by the Syriac tradition,
    which the syr world already reaches through his Diatessaron in anf09. The row is `assigned`: the Address is inside this entry''s window on every dating read (c. 150-172, Contested); his later Encratite turn is reported by Irenaeus (Adv. haer. I.28.1) and is a disclosure duty, not a reason to hold the row provisional. greek-apologists-second-century
    holds this work alongside pahc, for the era''s outward-facing writing; pahc is kept because
    the era and church-world are genuinely its.'
