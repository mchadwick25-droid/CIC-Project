  atlas_ids:
  - valentinian-and-other-gnostic-christianities
  role: context
  confidence: provisional
  note: 'The Stromata quotes and describes Valentinus, Basilides, Isidore and Carpocrates
    at length (27 ''Valentin'' and 35 ''Basilides'' hits in the file) - much of what survives
    of these teachers survives here. Context, not tradition: Clement describes them from outside.
    Provisional because the material is dispersed through eight books; locus-level extracts
    would sharpen this entry. The file''s 30 ''Marcion'' hits could also ground a marcion-marcionism
    context assignment; that question is still open.

