authors_ruled:
  hermas:
    kind: pseudonymous
    evidence: 'div1 2 title "THE PASTOR OF HERMAS"; anf02 DC.Creator lists athenagoras, clement_alex,
      tatian, theophilus and no author for this section. The work presents itself as the visions
      of Hermas of Rome; the name is the narrator''s, supplied by the text itself rather than
      by CCEL''s metadata.

      '
