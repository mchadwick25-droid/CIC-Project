# The Oration of Constantine is a distinct work by a different author bundled
# inside div1 4. CCEL's DC.Creator for this volume names only `eusebius`.
source_file: npnf201_eusebius-church-history-life-of-constantine.xml
authors_ruled:
  constantine:
    kind: metadata-omission
    evidence: 'div2 4.7 heading reads "The Oration of the Emperor Constantine, which he addressed
      ''to the assembly of the saints''"; npnf201 DC.Creator lists only eusebius. The volume''s
      own Special Prolegomena discusses (and accepts with qualification) the attribution,
      so the assignment below is provisional.

      '
assignments:
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-church-history-of-eusebius-historia-ecclesiastica
  work: The Church History of Eusebius (Historia Ecclesiastica)
  author: eusebius
  locus: div1 3 — The Church History of Eusebius (Books I-X)
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: assigned
  note: 'Eusebius is the first historian and theological architect of the Constantinian settlement;
    Books VIII-X narrate persecution, victory and the Constantinian peace from inside the
    new imperial church and close with the panegyric at Tyre. The census has no entry for
    Caesarean or Palestinian Christianity as such, so ijc is his own entry''s nearest equivalent -
    a limitation worth stating on record.

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-church-history-of-eusebius-historia-ecclesiastica-2
  work: The Church History of Eusebius (Historia Ecclesiastica)
  author: eusebius
  locus: div1 3 — Books II-VII in particular
  atlas_ids:
  - post-apostolic-house-church
  - alexandria-catechetical
  - montanism-the-new-prophecy
  - novatianism
  - roman-church-third-century
  role: context
  confidence: assigned
  note: 'Same work, context row (per brief §11a): Eusebius describes these movements
    from outside and later, and for each of them the History is real evidence, not a passing
    mention. Books II-V are the principal external frame for the post-apostolic church and
    preserve otherwise-lost fragments (Papias, Hegesippus, the Antonine martyr acts). Book
    VI is the fullest ancient account of Origen and the catechetical school; V-VII cover Pantaenus,
    Clement and Dionysius. Book V.14-19 preserves the anti-Montanist dossier (the Anonymous,
    Apollonius) on which that Contested-Evidentiary entry largely rests. Books VI.43-45 and
    VII preserve Cornelius'' and Dionysius'' letters on Novatian - primary evidence for novatianism.
    Movements he merely mentions are deliberately not assigned.

    Also assigned to roman-church-third-century: Cornelius was bishop of Rome 251-253, squarely
    inside this world''s own window, and his letters preserved here are primary Roman-church
    material, not merely external testimony to novatianism. Surfaced by a source-research
    pass on Roman Church Third Century''s (I.33) sourcing gaps.

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-church-history-of-eusebius-historia-ecclesiastica-3
  work: The Church History of Eusebius (Historia Ecclesiastica)
  author: eusebius
  locus: div1 3 — I.13 (the Abgar narrative), IV.29 (Tatian and the Diatessaron), IV.30 (Bardesanes the
    Syrian)
  atlas_ids:
  - syriac-edessa-nisibis
  role: context
  confidence: assigned
  note: 'Three Syriac-relevant notices verified directly against the file: I.13 (lines 9450-9683) reproduces
    the Abgar-Jesus correspondence and Thaddeus narrative at length, which Eusebius took as genuine from
    the Edessa archives - the earliest datable witness to the legend''s existence and age, never evidence
    for its content (this world does not accept the correspondence as genuine, per Doc_01 SS2 - a risk
    screen already carried on syr.source.eusebius-historia-ecclesiastica, not a defect in the citation
    itself). IV.30 (line 9461) attests Bardesanes the Syrian Gnostic''s standing at the Edessene court -
    per Doc_01 SS5.1 the most comparatively reliable ancient witness to him, being early and free of local
    rivalry. Context, not tradition: Eusebius writes from Caesarea, outside Edessa/Nisibis, describing this
    world''s own figures and legend from a distance.

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-church-history-of-eusebius-historia-ecclesiastica-4
  work: The Church History of Eusebius (Historia Ecclesiastica)
  author: eusebius
  locus: 'div1 3 — Book VII, chapters 27-29 (Paul of Samosata''s heresy, the bishops assembled
    against him, and Malchion''s disputation); ch. 30''s own extracts from the synodal
    epistle overlap the anf06 Malchion translation already assigned here (see note)'
  atlas_ids:
  - antiochene-church-third-century
  role: context
  confidence: assigned
  note: 'This world''s only other row (anf06''s "Epistle of Malchion") is the whole of its corpus
    - the thinnest bucket the map holds. Checked directly whether Eusebius adds anything beyond
    a duplicate of that letter: he does. Verified at the file: ch. 30 (lines 42003-42027) does
    quote extracts of the same synodal epistle anf06 translates in full - anf06''s own translator''s
    note confirms this explicitly ("of which we have extracts in Eusebius," citing HE vii.30), so
    that portion is not counted as a second witness. But chs. 27-29 (lines 41753-41985) are
    Eusebius''s own distinct narrative, not extracted from the letter: his own dating discussion
    and chronology of Paul''s episcopate and deposition (ch. 27), the roll of bishops present
    including Firmilianus of Cappadocian Caesarea and the brothers Gregory (Thaumaturgus) and
    Athenodorus of Pontus (ch. 28), and his own account of how "Malchion especially drew him out
    of his hiding-place and refuted him" (ch. 29, lines 41977-41978) in a stenographically-recorded
    disputation "which we know is still extant" (line 41982-41983). This is a genuine second, independent voice - Eusebius
    writing from Caesarea within living memory of the events (Church History substantially
    complete by the 290s-320s) - not merely the same letter restated.

    `role: context`, not `tradition`: an outside near-contemporary historian''s narrative frame
    around this world''s own primary document, not itself Antiochene voice. Not previously
    cross-linked here; npnf201''s existing context row for post-apostolic-house-church/alexandria-catechetical/montanism-the-new-prophecy/novatianism/roman-church-third-century
    (above) explicitly covers "Books II-VII in particular" but Paul of Samosata is not named
    among the movements it lists.

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-church-history-of-eusebius-historia-ecclesiastica-book
  work: The Church History of Eusebius (Historia Ecclesiastica), Book VIII.13 and IX.6 (the
    martyrdom of Lucian of Antioch)
  author: eusebius
  locus: 'Book VIII, ch. 13.2 (line 44730) and Book IX, ch. 6.3 (line 48001) - Eusebius''s
    own notices of the martyrdom of Lucian of Antioch, presbyter and Biblical text-critic,
    at Nicomedia under Maximinus, c. 311-312'
  atlas_ids:
  - antiochene-church-third-century
  role: context
  confidence: assigned
  note: 'This world''s census entry names Lucian of Antioch as one of its five voices ("biblical
    text-critic and martyr in 312, whose pupils, Arius among them, called themselves
    Lucianists") and cites exactly these two loci (Eusebius VIII.13.2 and IX.6.3) as his primary
    attestation, but neither had been corpus-mapped before this pass. Verified directly: VIII.13.2
    (line 44730) names "Lucian... a presbyter of that parish [Antioch], whose entire life was
    most excellent," martyred at Nicomedia; IX.6.3 (line 48001) gives the fuller account - "a
    presbyter of the parish at Antioch, and a most excellent man in every respect... brought to
    the city of Nicomedia... after delivering before the ruler an apology for the doctrine which
    he professed, was committed to prison and put to death." Book IX''s own endnote cross-references
    Jerome''s De Viris Illustribus ch. 77 for the same figure - see the separate npnf203 entry
    added the same pass. `role: context`: Eusebius reports Lucian''s martyrdom and reputation as
    an outside near-contemporary historian, not Lucian''s own surviving voice (his own works do
    not survive in any PD English translation - see the dossier''s own §5 floor-question note,
    which this does not resolve, only corroborate the figure''s historicity).

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--martyrs-of-palestine
  work: Martyrs of Palestine
  author: eusebius
  locus: div2 3.14 — Martyrs of Palestine (between Books VIII and IX)
  atlas_ids:
  - palestinian-church-pre-constantinian
  role: context
  confidence: assigned
  note: 'Eyewitness record of the Diocletianic persecution in Palestine, 303-311. A reader
    names it as its own work, so it is listed apart from the History. The doubt: the census
    has no entry for the pre-Constantinian Palestinian church, and no era-1 entry covers the
    Great Persecution. This persecution immediately precedes and explains ijc''s own settlement.
    palestinian-church-pre-constantinian (era 1, c. 185-312) holds it directly. Works flagged
    in THREE separate piles turned out to be this one hole - Alexandria was standing in for it
    on the strength of correspondence with Origen, who himself moved to Caesarea around 231.'
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-life-of-constantine-vita-constantini
  work: The Life of Constantine (Vita Constantini)
  author: eusebius
  locus: div2 4.6 — The Life of Constantine, Books I-IV
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: assigned
  note: 'The charter narrative of imperial Christianity: Constantine as God-favored ruler,
    Nicaea as imperial council, the emperor as ''bishop of those outside.'' Bears directly
    on the built ijc world; primary evidence for its whole self-understanding.

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-oration-of-constantine-to-the-assembly-of-the-saints
  work: The Oration of Constantine to the Assembly of the Saints
  author: constantine
  locus: div2 4.7 — The Oration of Constantine
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: provisional
  note: 'The emperor speaking as a Christian theologian - if genuine, the most direct first-person
    evidence of imperial Christianity in the corpus. Provisional because the authorship ruling
    above rests on the volume''s own discussion, which records genuine scholarly dispute about
    authenticity.

    '
- row_id: npnf201_eusebius-church-history-life-of-constantine--the-oration-of-eusebius-in-praise-of-constantine-de-laudibus
  work: The Oration of Eusebius (In Praise of Constantine, De Laudibus Constantini)
  author: eusebius
  locus: div2 4.8 — The Oration of Eusebius
  atlas_ids:
  - imperial-juridical-christianity
  role: tradition
  confidence: assigned
  note: 'The tricennial oration of 336 - the classic articulation of imperial political theology
    (one God, one Logos, one emperor, one empire). Core ijc material.

    '
