authors_ruled:
  synodal-censures-of-lucaris:
    kind: anonymous
    evidence: >
      The title page calls these 'gemina ejusdem Confessionis Censura Synodalis' promulgated
      by two Patriarchs of Constantinople, Cyril of Berrhoea and Parthenius: synodal acts
      under two patriarchs' names, not the personal work of one author, so the slug names the
      work.
    from_file: lucaris_confessio-and-synodal-censures-lat_1645.txt

