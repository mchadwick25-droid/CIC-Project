    work: "Confessio Christianae fidei (Latin), Cyril Lucaris"
    author: lucaris
    locus: "the Confession of Faith from about file line 367 to 2360; publisher's prefaces at lines 39-150"
    atlas_ids:
      - orthodoxy-under-the-ottomans-parish-millet-and-n
    role: tradition
    confidence: assigned
    note: >
      Lucaris's Latin Confession as printed with its censures, following the Geneva edition of
      1633. Latin only in this OCR: the Greek columns are not recovered, and long s is read as
      f throughout, so second witness and not quotable without a page-image check. Its
      authorship and its relation to the Eastern Church are contested.
