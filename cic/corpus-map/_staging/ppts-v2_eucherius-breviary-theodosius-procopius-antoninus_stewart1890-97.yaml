    locus: "the Antoninus part (last title page in the volume)"
    atlas_ids:
      - jerusalem-liturgical-pilgrimage-christianity
      - chalcedonian-monasticism-judean-desert-and-gaza
    role: context
    confidence: assigned
    note: >
      The fullest 6th-century pilgrim narrative: Gaza and its holy men, the Jordan lauras,
      Sinai, the shrines of Jerusalem, in a layman's own words c. 570. Outside witness; the
      author is a North Italian pilgrim, not a Palestinian monk.

