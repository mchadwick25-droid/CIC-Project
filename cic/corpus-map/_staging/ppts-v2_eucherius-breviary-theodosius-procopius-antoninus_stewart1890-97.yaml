authors_ruled:
  theodosius-pilgrim:
    kind: metadata-omission
    evidence: >
      The part's own title page reads "Theodosius (circ. 530 A.D.) on the Topography of the
      Holy Land"; the host record names only the Society.
    from_file: ppts-v2_eucherius-breviary-theodosius-procopius-antoninus_stewart1890-97.txt
  antoninus-piacenza:
    kind: pseudonymous
    evidence: >
      The part's title page reads "Of the Holy Places visited by Antoninus Martyr"; the work
      is the anonymous Piacenza pilgrim's itinerary transmitted under the martyr's name, as
      Stewart's own introduction states.
    from_file: ppts-v2_eucherius-breviary-theodosius-procopius-antoninus_stewart1890-97.txt
  breviarius-de-hierosolyma:
    kind: anonymous
    evidence: >
      "The Breviary or Short Description of Jerusalem (circ. A.D. 530)" names no author in
      the volume or in the tradition.
    from_file: ppts-v2_eucherius-breviary-theodosius-procopius-antoninus_stewart1890-97.txt

