  note: 'The Society''s own collected Latin text of the papal bulls and briefs for the Society, the perpetual
    calendar and the compendium of privileges. The 1540 and 1550 charters and the later bulls are printed
    here in the Society''s own text. Society-authored and corporate; no single writer. Primary original
    evidence for the movement, and the cleanest Latin scan in this group: modern typeset Latin with marginal
    rubrics, clean apart from occasional letter-level misreads and line-end hyphens read as a stray sign.
    Word-form coverage against a clean Latin vocabulary is 0.86, the same range as the machine-corrected
    TEI files. Quote after checking the page image.'
