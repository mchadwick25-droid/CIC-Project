      names this work as relevant. The correct text volume (Voluminis I Pars
      Posterior, archive.org item theodosianilibr01sirmgoog) is vendored on
      the Donatism branch as cic/texts/theodosianus-16_mommsen-meyer1905.txt,
      and this assignment is that bucket's own listing of the work. Boyd's
      1905 translation of the ecclesiastical edicts remains a valid
      corroborating secondary source alongside it. Whether it belongs there
