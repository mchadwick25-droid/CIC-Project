# The Codex Theodosianus (Imperatori Theodosiani Codex), full 16-book Latin
# text, transcribed at The Latin Library and vendored for the
# Latin Pastoral-Congregational Christianity world-build (Source_Registry.md
# row 88; row 44 is the reference-only, higher-confidence OTA/Mommsen-Meyer
# edition of the same work, not vendored — CC BY-NC-SA licensed). No English
# translation of this text is vendored anywhere in this corpus; unlike an
# original-language "second witness" alongside an existing English source
# (see cic/texts/INTAKE.md's Nestle 1904 case), this is the ONLY vendored
# witness to this work's content at all.
source_file: codex-theodosianus_latinlibrary.txt

authors_ruled:
  theodosian-code-compilers:
    kind: anonymous
    evidence: >
      A compiled imperial law code spanning Constantine (312) through
      Theodosius II (437), issued in Theodosius II's own name (438) but
      authored, in the sense a corpus-map author field means, by no single
      person — each constitution is its own emperor's own act, redacted
      into one code by the compiling commission Theodosius II convened
      (Nov. Theod. 1, itself not part of this vendored file). "The Roman
      imperial chancery" is the same collective/anonymous-act treatment
      already used for the one other legal-compilation author-entity this
      corpus map has ruled on (a Julianic school law, Cappadocian's own
      cappadocian.source.codex-theodosianus-13-3-5-school-law.md record,
      independently — that record cites the same work by content, not this
      vendored file, and needed no ruling here).

assignments:
  - row_id: codex-theodosianus_latinlibrary--codex-theodosianus-imperatori-theodosiani-codex-full-text
    work: "Codex Theodosianus (Imperatori Theodosiani Codex), full text, all 16 books"
    author: theodosian-code-compilers
    locus: "whole text; not divided by book/title in this entry — see the file's own CTh.<book>.<title>.<law> headings for addressing a specific constitution"
    atlas_ids:
      - latin-pastoral-congregational-christianity
    role: context
    confidence: provisional
    note: >
      The imperial legal apparatus this tradition's own pastoral life operated
      under, not this tradition's own voice. Source_Registry.md row 44 names
      the specific reason this world holds it: the underlying statute behind
      the Theodosian-law fine Augustine's own Letter 185 SS25 cites (already
      role: tradition here, npnf101). Not currently drawn on directly for a
      specific claim. The provision behind that fine reference is identified,
      though not against THIS file. Letter 185 SS25 describes a law of
      Theodosius I fining heretical clergy ten pounds of GOLD; that is CTh
      XVI.5.21 (392 Iun. 15), "denis libris auri viritim," read directly in
      the Mommsen-Meyer 1905 edition vendored on the sibling Donatism branch.
      It is NOT CTh XVI.5.52 (412), the graduated Donatist fine schedule
      whose circumcellion clause is assessed in silver — that equation was
      considered and ruled out. Whether this Latin Library file's own text
      of XVI.5.21 matches has not been checked, so this entry stays
      provisional; the identification rests on the Mommsen-Meyer file.

