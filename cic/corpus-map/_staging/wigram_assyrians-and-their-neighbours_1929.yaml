authors_ruled:
  wigram:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The author is named on the
      title page (file line 46: "THE REV. W. A. WIGRAM") and the host catalogue gives William Ainger Wigram,
      1872-1953. A mechanical index-coverage gap, not an attribution dispute.

