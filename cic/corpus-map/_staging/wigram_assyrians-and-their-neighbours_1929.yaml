    work: "The Assyrians and their Neighbours (1929), chapter VII, Tamerlane and the Coming of the Ottoman: the hereditary patriarchate and the schism of the sixteenth century"
    author: wigram
    locus: "chapter VII contents at file line 349; text from 6529; the schism of Shimun Dinkha and Sulaka at lines about 7340-7500"
    atlas_ids:
      - church-of-the-east-schism-of-1552
    role: context
    confidence: assigned
    note: >
      The clearest English narrative of the schism in the corpus: the "natar kursya" hereditary succession, why
      the dissenters wanted a canonical election, how Sulaka's submission at Rome began the two lines, and the
      Roman permissions given to him. Anglican mission-head, 1929, writing for English readers; a reception
      witness and finding aid, never evidence of the events. Read at the lines given.
