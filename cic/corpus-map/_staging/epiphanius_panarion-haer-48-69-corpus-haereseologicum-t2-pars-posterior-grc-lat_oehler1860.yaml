    role: tradition
    confidence: provisional
    note: >
      Epiphanius founded and led a monastery near Eleutheropolis in Palestine (c. 335-367)
      before his Cypriot episcopate, and the Panarion is the one great literary work of that
      early Palestinian monastic milieu; placed here as its voice, provisionally. NEEDS A
      CHECK by the corpus-assignment thread against how the Holl volume (haer. 34-64,
      vendored this batch) was placed, so the two Epiphanius files are placed alike.
