    author: epiphanius
    locus: "from file line 45163"
    atlas_ids:
      - homoian-arian-christianity
    role: context
    confidence: provisional
    note: >
      A hostile contemporary heresiologist's account of Arius and his followers, preserving
      Arius's own letters inside the refutation (embedded voice, so the containing work
      stays Epiphanius's). Context for the Homoian world.
  - row_id: epiphanius_panarion-haer-48-69-corpus-haereseologicum-t2-pars-posterior-grc-lat_oehler1860--panarion-heresies-48-69-greek-and-latin
