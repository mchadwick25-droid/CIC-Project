    work: "Panarion, heresies 68 (Melitians) and 69 (Arians), Greek with Petavius's Latin (Oehler 1860)"
    author: epiphanius
    locus: "heresy 68 from file line 43599 (Greek) and 43646 (running head); heresy 69 from 45163; Arius's letters quoted at 45445-45580"
    atlas_ids:
      - alexandria-catechetical
    role: context
    confidence: provisional
    note: >
      The fullest ancient account of the Melitian schism of Egypt (whose bishops accused
      Athanasius at Tyre in 335) and a near-contemporary account of Arius's career, written
      374-377 by a Nicene heresiologist outside Egypt. The view from outside the
      Alexandrian tradition, in the original Greek; context, not its voice. Greek recovered
      with Google-OCR errors: verify against the page image before quoting.
