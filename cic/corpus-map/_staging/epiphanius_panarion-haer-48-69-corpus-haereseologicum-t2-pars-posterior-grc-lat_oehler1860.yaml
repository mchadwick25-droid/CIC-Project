authors_ruled:
  epiphanius:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md (generated from CCEL XML markup
      only) has not seen the author. Epiphanius of Salamis (c. 315-403) is a real,
      well-attested author; the title page names him and the work (file lines 29-36:
      'Corporis haereseologici tomus secundus continens S. Epiphanii episcopi
      Constantiensis Panariorum librum primum et secundum, edidit Franciscus Oehler,
      Berolini MDCCCLX'). The same slug was ruled this batch for the Holl volume.

