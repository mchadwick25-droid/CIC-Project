  note: 'The Jesuit account of Ricci''s China mission, in the Latin Trigault published in 1615 from Ricci''s
    own commentaries. Trigault edited and reordered Ricci''s text, so it is the mission''s printed public
    voice and not a copy of Ricci''s own Italian. Second witness for now, not yet quotable: the scan is
    a 1615 print with the long s read as f, the ae ligature read as x, and many word spaces lost (for
    example infummo, fruftatim). Word-form coverage against a clean Latin vocabulary is 0.49, well below
    the other files in this group. A quotation needs the page image, and this 1615 printing is the only
    Latin printing of the work found.'
