    note: >
      The earliest known diary by an Englishwoman: a godly Yorkshire
      gentlewoman's daily record of private prayer, sermon repetition,
      reading, household work and conscience, 1599-1605, in her own
      spelling. Primary voice, ready to quote once verified against the
      scan; the OCR is clean. The census names this diary as a
      first-tier source for the world.
  - row_id: hoby_diary-1599-1605_meads1930--diary-of-lady-margaret-hoby-1599-1605-2
