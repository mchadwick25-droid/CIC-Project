    atlas_ids:
      - the-english-reformation-and-elizabethan-settleme
    role: context
    confidence: provisional
    note: >
      A conforming parishioner's record of Elizabethan church life as
      lived (sermons, the lecture, public prayers, the sacrament) in the
      years of the settlement. Placed on window and place; the diary was
      read for its Puritan devotional practice, not for its view of the
      establishment, so the fit for this entry is provisional.
