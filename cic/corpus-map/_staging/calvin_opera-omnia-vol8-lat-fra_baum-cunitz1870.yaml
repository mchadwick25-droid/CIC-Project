    note: >
      The hostile institutional record the census names: Calvin's reply to
      Servetus after the burning, and the trial papers (Servetus's answers
      were given on trial for his life, a coercive setting). The Latin
      and French of the Strasbourg editors' Corpus Reformatorum volume 8;
      readable OCR with a systematic v-for-y and C-for-O substitution,
      so quote after checking the page image. No public-domain English
      translation of the Defensio; Rilliet 1846 (Tweedie) is the English
      route to the trial (rilliet_calvin-and-servetus_tweedie1846.txt).
