authors_ruled:
  mari-ibn-sulayman:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The
      author is real and named: Mari ibn Sulayman (twelfth century), whose Kitab al-Majdal
      carries the section on the patriarchs of the East that Gismondi edits ("Maris Ibn
      Salomonis", file line 16163). Gismondi is editor and translator. A mechanical
      index-coverage gap, not an attribution dispute.

