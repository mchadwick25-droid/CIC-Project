    note: >
      Filed under `barlow`, the vendored file's own compiler/printer slug
      (the same convention this corpus already uses for a secondary
      compiler's framing - e.g. `boero` for the Life of Peter Favre) -
      not a claim that Barlow authored the bulls themselves. What the
      row actually carries is Pius V's own bull Regnans in Excelsis
      (1570, excommunicating and deposing Elizabeth I) and Paul III's
      bull against Henry VIII, printed in English and Latin, word for
      word, inside Barlow's hostile Anglican polemic (1681). role:
      tradition rather than context because the bull text itself is
      reproduced verbatim - the papacy's own binding act, not a
      paraphrase or narrative about it - even though the surrounding
      frame is hostile. Narrow (two short bulls) but genuine primary-
      source window. Vendored 2026-09-25 as part of a pre-Doc_02
      source-acquisition pass for the-tridentine-church, per this
      world's own Source Readiness Dossier §3.
