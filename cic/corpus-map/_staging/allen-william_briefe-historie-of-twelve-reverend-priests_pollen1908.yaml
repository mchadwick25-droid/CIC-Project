    note: >
      The first account of Campion's death, by the secular priest who ran the seminary and
      had sent him: an ally's account from outside the Society, not the Society's own
      voice. Walpole's verses on Campion (by a future Jesuit, then a layman) are printed
      here. Placed as context on that reading.
