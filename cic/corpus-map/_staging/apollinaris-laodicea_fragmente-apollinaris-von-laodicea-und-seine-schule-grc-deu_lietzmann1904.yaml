authors_ruled:
  apollinaris-laodicea:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md (generated from CCEL XML markup only)
      has not seen the author. Apollinaris of Laodicea (c. 310-c. 390) is a real, well-attested
      author; his surviving Greek texts and fragments are what Lietzmann's 1904 edition
      collects (title page, file line 173; 'Schriften des Apollinaris', file line 6688). Kept
      distinct from the existing slug claudius-apollinaris (Claudius Apollinaris of Hierapolis,
      second century), a different person.

