# Fulfils the lead recorded in
# desert.search.pachomian-rule-schodde-1885, which the earlier search
# had wrongly marked not_found because it asked only for pre-1929
# printed PD translations and then failed to look in the periodical
# literature.
source_file: pachomius_rules-ethiopic_schodde1885.txt
authors_ruled:
  schodde:
    kind: metadata-omission
    evidence: 'The file is plain text and carries no markup to hold a creator, so the extractor
      has nothing to match. The author is not in doubt: the translation is signed "GEORGE H.
      SCHODDE." on its last line, and the article appeared over his name in The Presbyterian
      Review, vol. 6 (1885), pp. 679-689. The slug is used ONLY for the 1885 introduction -
      Schodde''s own editorial apparatus, assigned as `context`. It is never used for the Rule
      text he translated.

      '
  ethiopic_homily_on_the_ten_associations:
    kind: anonymous
    evidence: 'Part III of the Ethiopic collection, pp. 685-689, carried under Pachomius'' name in
      the manuscripts but not his. Schodde: "The third is probably the most remarkable part, and of
      it no copy in any other language is known to exist... The third part is really no collection
      of rules at all, but only a kind of symbolical homily on the character and duty of the
      monastic brethren. The fact that in it so much is spoken of false members shows that at the
      time of its composition the institution had already commenced to degenerate, and Dillmann''s
      opinion concerning its age is probably correct." Anonymous, late, and Ethiopic-only; treated
      as a work-entity rather than assigned to Pachomius.

      '
assignments:
- work: The Rules of Pachomius, Part I (the angel's ordinance)
  author: pachomius
  locus: pp. 681-683; "In the name of the holy Trinity. The ordinance which the angel of the Lord
    commanded to Abba Pachomius"
  atlas_ids:
  - desert-monasticism
  role: tradition
  confidence: assigned
  note: 'THE FIRST QUOTABLE PACHOMIAN LEGISLATION IN THIS CORPUS. Until now this world held the
    Pachomian foundation only through reports of it - Palladius, Sozomen, Cassian - and twelve
    records leaned on a source that could be consulted but never quoted. Schodde translates the
    Ethiopic, which he says "is, as we have seen, the same as the Greek form, which reaches up
    almost to the days of Pachomius himself, and if not verbatim from his pen, are yet authentic
    enough for all practical purposes". Quote it as Pachomian-foundation legislation in the
    Ethiopic recension, never as Pachomius'' own words.

    The angel and the iron tablet are inside the rule document
    itself, not merely in Palladius'' and Sozomen''s framing of it.

    '
- work: The Rules of Pachomius, Part II (the second word of the holy Pachomius)
  author: pachomius
  locus: pp. 683-685; "In the name of the Father and of the Son and of the Holy Ghost. An ordinance
    and command of the holy Abba Pachomius"
  atlas_ids:
  - desert-monasticism
  role: tradition
  confidence: assigned
  note: 'Pachomian-tradition legislation of uncertain date, and it must be cited as that rather
    than as Part I''s peer. Schodde places its Greek in an unprinted Florentine MS and its Latin in
    the Acta Sanctorum. This is the practical horarium - the ell of distance between walking
    brethren, the ban on conversing in the bakery, the two undergarments and the shaggy cloak, the
    novice kept in the vestibule until he has learnt the prayer of the Gospel. It also carries the
    women''s house: Pachomius'' sister, the dwelling a mile across the river, one hundred and
    eighty women against three hundred and forty men, and the command that neither see the other''s
    face nor hear the other''s voice.

    '
- work: The Rules of Pachomius, Part III (the symbolical homily on the ten associations)
  author: ethiopic_homily_on_the_ten_associations
  locus: pp. 685-689; "And again a third ordinance"; the five evil associations (hyenas, dogs,
    wolves, shakals, goats) and the five good (sheep, doves, turtle-doves, bees, deer)
  atlas_ids:
  - desert-monasticism
  role: tradition
  confidence: assigned
  note: 'MAY NOT BE ATTRIBUTED TO PACHOMIUS, and the anonymous work-entity slug says so. Schodde calls it
    "really no collection of rules at all, but only a kind of symbolical homily on the character
    and duty of the monastic brethren", knows no copy in any other language, and dates it late with
    Dillmann on the evidence that it dwells at length on false members. Its value is exactly that:
    it is a coenobitic house looking at its own decay from the inside, in the only language that
    preserved it. Cite it as the late Ethiopic homily, never as Pachomian legislation.

    '
- work: Schodde's introduction to the Rules (1885)
  author: schodde
  locus: pp. 679-681, including Sozomen's summary in Valesius' Latin and the Acta Sanctorum notice
  atlas_ids:
  - desert-monasticism
  role: context
  confidence: assigned
  note: 'Nineteenth-century editorial apparatus, not an ancient source, and marked `context` for
    that reason. Its use is that it states the relationship between the recensions - the 194-article
    Latin Regula in Holste, Gazaeus'' 128-article rearrangement, Dillmann''s Ethiopic, the shorter
    list in Palladius and Sozomen - which is how this world can say what it is quoting instead of
    calling it "the Rule of Pachomius" flatly. Schodde also disposes of the Jerome attribution on
    internal evidence: Orsiesius and Theodorus, Pachomius'' own pupils, are named in the Latin as
    having aided the composition.

    '
