    note: >
      A Chalcedonian outsider's account of Dioscorus, Alexandria's
      deposed miaphysite patriarch (confirmed present, raw-scan line
      ~1723) - Evagrius (b. c. 536) is a later historian writing decades
      after Dioscorus's 451 deposition, not a contemporary. Per README's
      own definition, "the view from outside: a pagan critic, a civil
      historian, or a contemporary opponent," not this entry's own
      voice.
