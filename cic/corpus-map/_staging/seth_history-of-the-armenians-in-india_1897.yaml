    work: "History of the Armenians in India from the Earliest Times to the Present Day (1897)"
    author: seth
    locus: "the chapters headed 'Devastation of Julfa in Armenia' (file line 2250) and 'Founding of New Julfa in Persia' (about line 2289), and the merchant settlements that follow"
    atlas_ids:
      - armenian-christianity-new-julfa
    role: context
    confidence: assigned
    note: >
      A history of the Armenian merchants and churches of India by an Armenian born at New
      Julfa (the book says so), writing in English in 1897. A late secondary account, not a
      source from the period: it tells the 1604-05 deportation and the founding of New
      Julfa from tradition and reports Armenian tombstone inscriptions. The two chapters
      above were read; the rest of the book was sampled at five points. Use it for the
      diaspora network that the New Julfa merchants built, and check every date against a
      period source.
