    work: "The Nestorians and their Rituals, volume I (Badger, 1852), chapter XI: the history of the Nestorian patriarchate, the hereditary succession, the election of Sulaka and his murder"
    author: badger
    locus: "chapter XI from file line 7313; the schism at about 7780-7920 (Sulaka 'earnestly desired by' one party at 7780, the bishops at Mosul electing Sulaka at 7899, the Turks incited to his murder at 7914); index entry 'Sulaka, proposed and consecrated patriarch' at 26240"
    atlas_ids:
      - church-of-the-east-schism-of-1552
    role: context
    confidence: assigned
    note: >
      An Anglican missionary who lived among the Nestorians in 1842-44 retells the schism from
      Mosheim, Gibbon, the Roman accounts and a Mutran Hanna autobiography of 1778, and calls
      the Roman accounts contradictory. A reception witness and finding aid for 1552, three
      centuries after; a direct witness for the mountain church of the 1840s. Read at the lines
      cited. Clean OCR.
