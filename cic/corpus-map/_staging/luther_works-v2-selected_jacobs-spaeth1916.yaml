  - work: "A Prelude on the Babylonian Captivity of the Church (incl. the
      sections on the sacraments of the Bread, Baptism, Penance, and Extreme
      Unction)"
    author: luther
    locus: "lines ~6323-11013"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 treatise, the fullest statement of Luther's own sacramental
      theology in this corpus - reduces the seven medieval sacraments to
      two/three and argues each from Scripture directly. The single most
      load-bearing doctrinal text in either volume for this world's own
      Eucharistic and sacramental register.

  - work: "A Treatise on Christian Liberty, with a Letter to Pope Leo X"
    author: luther
    locus: "lines ~11013-13100"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 treatise, the third of the great Reformation treatises - the
      "simul justus et peccator" freedom/bondage paradox stated in Luther's
      own words, with the (by-then largely rhetorical) covering letter to
      Leo X.

  - work: "A Brief Explanation of the Ten Commandments, the Creed, and the
      Lord's Prayer"
    author: luther
    locus: "lines ~13133-14403"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 catechetical treatise (the _Kurze Form_), a direct precursor to
      the 1529 Small Catechism (vendored separately, luther_small-
      catechism_smith1994.txt) - the same three-part structure a decade
      earlier and in Luther's own more discursive, pre-catechism voice.

  - work: "The Eight Wittenberg Sermons"
    author: luther
    locus: "lines ~14403-end"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1522, preached on Luther's own return to Wittenberg from the Wartburg
      to check the Karlstadt-led unrest - Luther's own spoken, pastoral
