    note: >
      Pierre Gilles, pastor of La Tour, wrote the valleys' own history at the
      synod's request and printed it at Geneva in 1644; this is the 1881
      Pignerol re-edition. Tome I runs from the origins to the 1580s, so the
      union of 1532, the Olivetan Bible, the wars of 1560-61 and the first
      Reformed generation are in this volume. Primary voice in French, OCR
      clean; ready to quote once each quote is verified against the page
      image. No public-domain English translation exists.
