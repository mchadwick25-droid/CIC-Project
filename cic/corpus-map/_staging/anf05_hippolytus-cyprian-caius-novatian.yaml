  note: 'The central documentary corpus of mid-3rd-c. North African church life: the Decian
    persecution, the lapsed, schism, plague, rebaptism. Assigned as one body per the letters-corpus
    granularity rule. Also assigned to novatianism: the correspondence with and about Cornelius,
    Novatian and the confessors (c. 250-253) is a principal external witness to that schism,
    including letters from the Roman side. Note: the corpus embeds letters by others (Cornelius,
    the Roman clergy, Firmilian of Caesarea, the confessors) under Cyprian''s name - CCEL
    attributes the whole body to cyprian.

    '
- row_id: anf05_hippolytus-cyprian-caius-novatian--the-epistles-of-cyprian-2
  work: The Epistles of Cyprian
  author: cyprian
  locus: div2 4.4
  atlas_ids:
  - donatism
  role: antecedent
  confidence: assigned
  note: 'FLAG, not assertion (per group instruction): the Donatists claimed Cyprian - his
    rebaptism practice and purity-of-clergy ecclesiology - as their charter authority, and
    Augustine''s anti-Donatist works argue with Cyprian''s letters at length. `role: antecedent`,
    a third relation in the corpus-map schema for exactly this: Cyprian is not a Donatist,
    so `tradition` would be false; he died fifty years before the schism, so `context` - describing
    a movement from outside - would be false too. He is the authority both sides argued FROM.
    The rule the antecedent role carries: an antecedent assignment requires that the entry''s
    own vendored sources argue from the text. Measured here rather than asserted - Augustine''s
    On Baptism, Against the Donatists names Cyprian 306 times, Agrippinus 28, in 92,000 words.'
