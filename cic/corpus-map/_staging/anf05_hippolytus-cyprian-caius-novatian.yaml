- work: The Epistles of Cyprian
  author: cyprian
  locus: div2 4.4
  atlas_ids:
  - donatism
  role: antecedent
  confidence: assigned
  note: 'FLAG, not assertion (per group instruction): the Donatists claimed Cyprian - his
    rebaptism practice and purity-of-clergy ecclesiology - as their charter authority, and
    Augustine''s anti-Donatist works argue with Cyprian''s letters at length. Whether the
    Cyprianic corpus files as antecedent tradition for donatism needs Mark''s ruling. Ruled
    2026-08-26: `role: antecedent`, a third relation added to the corpus-map schema for exactly
    this. Cyprian is not a Donatist, so `tradition` was false; he died fifty years before
    the schism, so `context` - describing a movement from outside - was false too. He is the
    authority both sides argued FROM. The rule the new role carries: an antecedent assignment
    requires that the entry''s own vendored sources argue from the text. Measured here rather
    than asserted - Augustine''s On Baptism, Against the Donatists names Cyprian 306 times,
    Agrippinus 28, in 92,000 words.'
