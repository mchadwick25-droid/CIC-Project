  role: tradition
  confidence: assigned
  note: 'STRUCTURE.md marks this div2 apparatus, but the content is ancient pseudo-Hippolytean
    material (editor''s own title says dubious and spurious), kept rather than dropped. Needs
    a ruling on the shelf (no Hippolytus home) - points to the census entry added for this
    movement in the meantime. On whether a spurious corpus files under the attributed name:
    it does, and it also files as what it is - one of nine works across six entries asking
    the same underlying question, resolved under a single principle rather than one by one.
    Brief 6.2 says derive from the markup rather than re-attribute from outside knowledge,
    so the transmitted-author shelf stands: that is how the corpus presents it and how a reader
    will look for it. And apocryphal-and-pseudepigraphal-literature is added, because a work
    circulating under a name that is not its author''s is a pseudepigraphon by definition.
    The two together say the whole truth - where it sits, and what it is - without re-attributing
    anything. The spurious corpora could instead be detached from their attributed authors
    in a future pass, if that reading is preferred.'
