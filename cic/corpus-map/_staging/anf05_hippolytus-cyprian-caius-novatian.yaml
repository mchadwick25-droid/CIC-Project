    in this file and in npnf214/anf06: third-century, a century before this entry''s 360-380s
    census range, and no census entry for 3rd-c. Cappadocia/Pontus itself. Split out from the
    shared Epistles-of-Cyprian row, following the same npnf214 per-father split precedent used
    elsewhere in this file: one work by one author, distinguishable from its shared-corpus
    row, is worth a row of its own rather than an added atlas_id, since the shared Epistles-of-Cyprian
    row is `confidence: assigned` and this assignment is not. Doc_02 §1.6 cites this letter
    under both numberings ("Epistle 74 in the ANF/older numbering, Epistle 75 in the modern
    CSEL/Hartel numbering; cite both forms") - both carried in `work:` above so a reader searching
    either number finds this row.'
