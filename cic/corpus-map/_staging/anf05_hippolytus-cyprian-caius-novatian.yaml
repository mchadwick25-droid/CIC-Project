  role: antecedent
  confidence: assigned
  note: 'FLAG: the 256 rebaptism council was the Donatists'' standing proof that African tradition
    required rebaptism of those baptized outside the church. Same antecedent-tradition question
    as the Epistles. `role: antecedent`, a third relation in the corpus-map schema for exactly
    this. Cyprian is not a Donatist, so `tradition` would be false; he died fifty years before
    the schism, so `context` - describing a movement from outside - would be false too. He
    is the authority both sides argued FROM. The rule the antecedent role carries: an antecedent
    assignment requires that the entry''s own vendored sources argue from the text. Measured
    here rather than asserted - Augustine''s On Baptism, Against the Donatists names Cyprian
    306 times, Agrippinus 28, in 92,000 words.'
