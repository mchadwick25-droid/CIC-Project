- row_id: anf05_hippolytus-cyprian-caius-novatian--on-the-lapsed-de-lapsis-2
  work: On the Lapsed (De Lapsis)
  author: cyprian
  locus: div3 under 4.5 - Treatise III
  atlas_ids:
  - donatism
  role: antecedent
  confidence: assigned
  note: 'FLAG as with the Epistles: the lapsed/traditor problem is exactly the question Donatism
    reopened after the Diocletianic persecution. `role: antecedent`, a third relation in the
    corpus-map schema for exactly this. Cyprian is not a Donatist, so `tradition` would be
    false; he died fifty years before the schism, so `context` - describing a movement from
    outside - would be false too. He is the authority both sides argued FROM. The rule the
    antecedent role carries: an antecedent assignment requires that the entry''s own vendored
    sources argue from the text. Measured here rather than asserted - Augustine''s On Baptism,
    Against the Donatists names Cyprian 306 times, Agrippinus 28, in 92,000 words.'
