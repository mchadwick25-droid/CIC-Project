  note: 'Roman presbyter, fl. c. 200-220. The Dialogue disputes Proclus, leader of a Montanist
    party - hence the montanism assignment (argued-against entry). ANF also prints the Muratorian
    Canon here though its authorship is editorial conjecture, and the anti-Artemon fragment
    targets adoptionist Monarchianism, which has no census entry. Shelf shares the Hippolytus
    problem (Rome just after pahc''s 200 CE line) - provisional. Caius is a Roman presbyter
    of exactly these decades, and roman-church-third-century holds them.'
