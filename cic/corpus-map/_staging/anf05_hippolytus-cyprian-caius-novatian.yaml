  note: 'Pseudo-Cyprianic body, kept under cyprian because that is how CCEL transmits it.
    Two pieces (On the Public Shows, and the chastity treatise) are widely attributed to Novatian
    in modern scholarship, which is why novatianism appears here. On whether the attribution
    question should move them: this is one of nine works across six entries asking the same
    underlying question, whether a spurious corpus files under the attributed name at all -
    resolved under a single principle rather than one by one. IT DOES, AND IT ALSO FILES AS
    WHAT IT IS. Brief 6.2 says derive from the markup rather than re-attribute from outside
    knowledge, so the transmitted-author shelf stands: that is how the corpus presents it
    and how a reader will look for it. And apocryphal-and-pseudepigraphal-literature is added,
    because a work circulating under a name that is not its author''s is a pseudepigraphon
    by definition. The two together say the whole truth - where it sits, and what it is -
    without re-attributing anything. The spurious corpora could instead be detached from their
    attributed authors in a future pass, if that reading is preferred.'
