# CCEL DC.Creator for this volume: caius, cyprian, hippolytus, novatian. ANF
# div1s are author sections: 3 Hippolytus, 4 Cyprian, 5 Caius, 6 Novatian,
# 7 Appendix.
#
# HIPPOLYTUS HAS NO CENSUS HOME. He is Rome, c. 170-236; the nearest entry,
# post-apostolic-house-church, ends at 200 CE. Every "own tradition" row for
# Hippolytus below is therefore needs-ruling against that shelf. His
# heresiological assignments (Refutation) are solid regardless.
#
# Skipped as apparatus: title pages, preface, introductory notices,
# elucidations, indexes; also div2 3.5 "Appendix to the Works of Hippolytus.
# Containing Dubious and Spurious Pieces" is NOT skipped (see its row) since
# its content is ancient pseudo-Hippolytea, not editorial matter. div2 7.2
# "Acts and Records of the Famous Controversy" (269 words) IS skipped - it is
# an editorial headnote to the appendix, not a text.
#
# The two anonymous treatises in div1 7 are ancient 3rd-c. texts despite the
# div1 being marked apparatus; each carries an authors_ruled entry below.
source_file: anf05_hippolytus-cyprian-caius-novatian.xml
authors_ruled:
  pontius:
    kind: metadata-omission
    evidence: 'div2 4.3 title "The Life and Passion of Cyprian, Bishop and Martyr. By Pontius
      the Deacon."; anf05 DC.Creator lists only caius, cyprian, hippolytus, novatian.

      '
  anonymous-against-novatian:
    kind: anonymous
    evidence: 'div2 7.3 title "Anonymous Treatise Against the Heretic Novatian"; no DC.Creator
      attribution. A 3rd-c. work transmitted namelessly (sometimes conjecturally given to
      Sixtus II in the editorial notice) - a work entity, not a person.

      '
  anonymous-on-rebaptism:
    kind: anonymous
    evidence: 'div2 7.4 title "Anonymous Treatise on Re-baptism"; no DC.Creator attribution.
      Transmitted namelessly among Cyprian''s works.

      '
