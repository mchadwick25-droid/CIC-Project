# Worker staging file - npnf209 (Hilary of Poitiers + John of Damascus, NPNF
# second series vol. 9). STRUCTURE.md quirk worth noting: all of
# Hilary's actual works sit NESTED under div1 2, which is titled "*Title
# Page*" and flagged (apparatus) - so the volume shows ~94,956 words of text
# against ~309,685 of "apparatus", but div2 2.4 (De Synodis), 2.5 (De
# Trinitate) and 2.6 (Homilies on Psalms) are real works, not editorial
# matter. Only the true apparatus is skipped: prefaces, the ~75,265-word
# Introduction (div2 2.3), indexes.
# The two authors are three centuries apart: Hilary is the fourth-century
# Latin anti-Arian voice (Era 2); John of Damascus (d. c. 749) belongs to
# Era 4 entries, not to any entry his volume-mates share.
source_file: npnf209_hilary-poitiers-john-damascus.xml
assignments:
- row_id: npnf209_hilary-poitiers-john-damascus--de-trinitate-on-the-trinity
  work: De Trinitate (On the Trinity)
  author: hilary_poit
  locus: div2 2.5 (~190,221 words, twelve books), nested under the apparatus-flagged div1
    2
  atlas_ids:
  - gallic-nicene-episcopate
  role: tradition
  confidence: assigned
  note: 'Hilary''s home was the doubt, not the work: the census has NO entry of its own for
    fourth-century Gallic Nicene Christianity (Merovingian Gaul begins c. 480), so the Latin
    anti-Arian voice of the West had no author-entry to belong to. gallic-nicene-episcopate
    now holds him. The homoian-arian-christianity assignment is the firm half besides - this
    is the major Latin work written against the Arian ascendancy and belongs in that entry''s
    material. imperial-juridical was considered as a best-guess home too: Hilary''s career
    was made by imperial church politics (exiled by Constantius, restored under Julian), but
    Gaul is outside that entry''s stated region.'
