- row_id: npnf209_hilary-poitiers-john-damascus--an-exact-exposition-of-the-orthodox-faith-de-fide-orthodoxa
  work: An Exact Exposition of the Orthodox Faith (De Fide Orthodoxa)
  author: damascus
  locus: 'div1 3 (~94,912 words): Prologue at div2 3.3, the Exposition at 3.4'
  atlas_ids:
  - melkite-arabic-christianity
  role: tradition
  confidence: provisional
  note: 'Three centuries later than everything else in this worker group: John (d. c. 749)
    wrote at Mar Saba in Palestine under the caliphate, which is exactly the Era 4 melkite-arabic-christianity
    entry (c. 700-1009, Palestine/Syria) - a valid Pre-Survey Candidate. Provisional because
    byzantine-imperial-church-heraclian-iconoclast could be argued for instead or as well: the
    work became the doctrinal summa of Byzantine orthodoxy, but John lived and wrote outside
    the empire, so the Melkite entry is where the man and the writing actually sit.

    '
