    unchanged.'
- row_id: npnf209_hilary-poitiers-john-damascus--de-synodis-on-the-councils
  work: De Synodis (On the Councils)
  author: hilary_poit
  locus: div2 2.4 (~25,840 words), nested under the apparatus-flagged div1 2
  atlas_ids:
  - gallic-nicene-episcopate
  role: tradition
  confidence: assigned
  note: 'Written to the Gallic bishops to explain the eastern creeds before Ariminum/Seleucia
    - a direct primary account of the Homoian conciliar creeds, so the homoian assignment
    is firm, and the conciliar-imperial subject matter makes imperial-juridical a real second
    home. Same home question as De Trinitate: gallic-nicene-episcopate now holds Hilary''s
    own Gallic church. The homoian half of the assignment stands alongside it.'
