  - row_id: olavus-petri_samlade-skrifter-v2-swe_hesselman1915--een-handbock-paa-swensko-1529
    work: "Een handbock påå Swensko (the Swedish Manual of 1529: baptism, marriage, churching, visitation of the sick, burial)"
    author: olavus-petri
    locus: "contents entry at line 96; the text with the running head 'EEN HANDBOCK PÅÅ SWENSKO' from about line 15448 (pp. 314 ff. of the volume)"
    atlas_ids:
      - scandinavian-reformation-kingdoms
    role: tradition
    confidence: assigned
    note: >
      The first Swedish-language church manual, published at Stockholm on 28
      April 1529 (per the introduction to O. V. Anderson's English
      translation, which is not vendored). The ritual of ordinary parish life
      in the vernacular. Primary voice, OCR clean. No public-domain English
      translation was found: the English translation by O. V. Anderson, Rock
      Island, Augustana Book Concern, is recorded in the dossier as a lead
      whose date cannot be shown to be 1930 or earlier.
