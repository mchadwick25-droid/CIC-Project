    note: >
      The movement's own confession, the Polish Brethren's catechism in
      question and answer, in the 1818 English of Thomas Rees. Rees's own
      footnote says he translated the quarto Latin of 1680, the revision
      by Schlichting, not the 1609 original (Latin of 1609 vendored in
