    note: >
      A first-century Jewish writer's account of Jesus and of the death of James of Jerusalem, in Whiston's English. A Jewish voice from outside the church, context not tradition voice. Whiston's own notes and three dissertations are bound in, and some of the Testimonium wording is Whiston's reading; check against a critical edition before quoting.
