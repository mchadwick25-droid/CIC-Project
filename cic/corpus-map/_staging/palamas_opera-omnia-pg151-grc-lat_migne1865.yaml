  akindynos:
    kind: metadata-omission
    evidence: >-
      The title page of tomus CLI names Gregorius Acindynus; running heads 'GREGORII ACINDYNI' from file line 26522;
      the file's leading slug is palamas.
    from_file: palamas_opera-omnia-pg151-grc-lat_migne1865.txt
  barlaam:
    kind: metadata-omission
