assignments:
- work: The Catechetical Lectures (Procatechesis, Catecheses I-XVIII, Mystagogic Catecheses
    I-V)
  author: cyril_jer
  locus: 'div1 2 (~202,666 words): Procatechesis at div2 2.4, the eighteen pre-baptismal lectures
    at 2.5-2.22, the five lectures on the Mysteries at 2.23-2.27. One catechetical course,
    assigned as one work.

    '
  atlas_ids:
  - jerusalem-liturgical-pilgrimage-christianity
  role: tradition
  confidence: assigned
  note: 'The corpus''s best witness to fourth-century Jerusalem liturgy and initiation - delivered
    in the Church of the Holy Sepulchre to candidates for baptism, with the Mystagogic lectures
    describing the rites of baptism, chrism and eucharist as practiced there. This is the
    Jerusalem entry''s founding corpus; not one of these lectures is cited anywhere in the
    fleet today (audit F-25).

    '
- work: Select Orations of Saint Gregory Nazianzen
  author: gregory_naz
  locus: 'div1 3 (~235,530 words) - one body of about two dozen orations (div2 3.3-3.27),
    assigned as one work; the Five Theological Orations within it are additionally listed
    as their own entry below.

    '
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: tradition
  confidence: assigned
  note: 'Includes Oration 2 on the priesthood (3.4), the panegyrics on Caesarius, Gorgonia
    and his father, On the Great Athanasius (3.11), the festal orations, and the Funeral Oration
    on Basil (3.26). The family orations on Gorgonia and Nonna are among the corpus''s few
    extended portraits of women - the gap every world names.

    '
- work: The Five Theological Orations (Orations 27-31)
  author: gregory_naz
  locus: div2 3.13-3.17, with the editor's introduction at 3.12
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: tradition
  confidence: provisional
  note: 'Split out from the Select Orations because these five, preached against the Eunomians
    at Constantinople, are what a reader names as a work, and they carry the anti-Arian assignment.
    The doubt is the same as for Nyssa''s Against Eunomius: the opponents are Eunomian Anomoeans,
    and the census''s only Arian bucket is named for the Homoian party. Assigned there as
    nearest entry; Mark may want to strike or rebucket.

    '
