    work: "The Acts and Monuments of John Foxe, Vol. VIII (Cattley/Townsend edition): 1556-1558, Cranmer's process and burning, the Colchester, Guernsey and Sussex martyrs, the last burnings and Elizabeth's accession"
    author: foxe
    locus: "whole volume; the contents table from file line 75; Cranmer's life and examinations open the volume, his letters from line 7585 ('LETTERS OF DR. THOMAS CRANMER, ARCHBISHOP OF ...'); 'LETTERS OF WILLIAM TYMS' from line 9459; 'THE STORY OF THREE GUERNSEY WOMEN' from line 18851; 'THE STORY OF RICHARD WOODMAN, MARTYR' from line 26876; 'THE LADY ELIZABETH IN QUEEN MARY'S DAYS' from line 48413; appendix and index follow"
    atlas_ids:
      - the-english-reformation-and-elizabethan-settleme
    role: tradition
    confidence: assigned
    note: >
      Continues Vol. VII: Cranmer's recantations and his last words at Oxford as
      Foxe reports them; then the examinations of ordinary believers before Bonner
      (Tyms the curate, Rose Allin, the Colchester six, Richard Woodman the
      ironmaker with his long self-recorded examinations, the blind and lame
      martyrs), the Guernsey burning, and Foxe's account of Elizabeth under Mary.
      Same two-voice caution as Vol. VII: Foxe's frame is this world's voice; the
      examinations are documentary at one remove. Ready to quote once verified
      against this file.

