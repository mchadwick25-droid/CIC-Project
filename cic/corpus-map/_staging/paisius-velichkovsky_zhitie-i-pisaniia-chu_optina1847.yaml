source_file: paisius-velichkovsky_zhitie-i-pisaniia-chu_optina1847.txt
authors_ruled:
  mitrofan-schemamonk:
    kind: metadata-omission
    evidence: 'The Neamt brotherhood''s foreword before the Life (about raw scan lines 760-830) says the
      brethren asked the schemamonk Mitrofan to write the Life, then compiled the printed text from all
      versions holding chiefly to his. The host names only Paisius.

      '
  basil-of-poiana-marului:
    kind: metadata-omission
    evidence: 'The title page names the prefaces as written by the Elder Vasilii Polianomerul''skii, Paisius''s
      friend; section II is headed ''Pisaniia startsa skhimonakha Vasiliia, spostnika i druga blazhennago
      ottsa Paisiia'' (about raw scan line 3967).

      '
  optina-pustyn:
    kind: anonymous
    evidence: 'The title page reads ''Izdanie Kozel''skoi Vvedenskoi Optinoi Pustyni''; the opening ''Predislovie
      ot russkago izdatelia'' (raw scan line 45) is unsigned.

      '
