source_file: amelineau_histoire-de-saint-pakhome-annales-guimet-17_leroux1889.txt
authors_ruled:
  bohairic_life_of_pachomius:
    kind: anonymous
    evidence: >-
      The Vatican Coptic codex 69 text printed from OCR line 4877 carries no author in the volume; Amélineau calls it the Life of Pakhôme in the "memphitic" (Bohairic) dialect, and the Greek Life of Pachomius in the Acta Sanctorum names only an anonymous monk "of about the same age" (aetate suppar). A work, not a person.
  life_of_theodorus_disciple_of_pachomius:
    kind: anonymous
    evidence: >-
      Amélineau titles the section "Vie de Théodore, disciple de Pakhôme" (about OCR line 14793) and prints no author for it.
  arabic_life_of_pachomius:
    kind: anonymous
    evidence: >-
      The section from about OCR line 20362 is headed "Texte arabe et traduction", "Vie de Pakhôme", and prints no author; it closes "Et ce livre béni est fini, lequel est la vie du père saint Pakhôme" (about OCR line 38690).
  amelineau:
    kind: metadata-omission
    evidence: >-
      The file is plain text with no markup to hold a creator. The editor and translator is named on the title page of the volume (Annales du Musée Guimet, tome XVII, 1889): E. Amélineau. The slug is used only for his introduction, assigned as context.
