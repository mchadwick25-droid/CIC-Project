  atlas_ids:
  - the-kyiv-mohyla-orthodox-revival
  role: tradition
  confidence: provisional
  note: 'The Vilnius brotherhood''s defence of the hierarchy that Patriarch Theophanes restored in 1620,
    and its 1632 pleas at the election diet: the Orthodox case in Polish, with the Uniate reply (Sowita
    wina) between them. Second witness only: the OCR read the Latin type as Cyrillic look-alikes. Provisional
    because the texts could not be sampled as text.'
