source_file: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877.txt

authors_ruled:
  bar-hebraeus:
    kind: metadata-omission
    evidence: >
      This is this corpus's first plain-text-vendored (non-CCEL) named author,
      so cic/texts/AUTHORS.md - which is generated only from CCEL-XML files'
      own <DC.Creator> markup - has no way to have seen it yet. The author is
      real, well-attested, and not anonymous or pseudonymous: Bar Hebraeus
      (Gregory Abu'l-Faraj, 1226-1286), author of the Chronicon Ecclesiasticum
      (Abbeloos-Lamy edition, Louvain 1872-1877). This is a mechanical
      index-coverage gap, not an attribution dispute.

assignments:
  - work: Chronicon Ecclesiasticum, Volume III (the Eastern Church / Nestorian Catholicoi section)
    author: bar-hebraeus
    locus: "Sectio II (npnf-style locus not applicable - vendored as its own file), the Nestorian
      Catholicoi entries for Papa bar Aggai through Simeon bar Sabbae's martyrdom (file lines
      ~1670-2250)"
    atlas_ids:
      - syriac-edessa-nisibis
    role: tradition
    confidence: assigned
    note: 'This world''s own Persian episcopal-succession dating problem (Doc_02 SS11) previously
      rested only on Fiey''s modern secondary reconstruction of the Chronicle of Seert/Bar
      Hebraeus tradition, with no directly vendored primary text. Verified findable and public
      domain (Abbeloos-Lamy, Louvain 1872-1877, archive.org) and vendored. Latin translation of a
      Syriac original - a second-witness, original-language-adjacent source, never primary
      evidence for a Representative on its own (this project''s evidence language is English).
      Does NOT resolve the Simeon bar Sabbae dating dispute (341 vs. c. 344) - that rests on
      modern external argument (regnal-year/astronomical reasoning) the chronicle itself cannot
      adjudicate; it does let syr.contested.papa-primacy cite the actual primary succession list
      directly rather than only a secondary encyclopedia. Volumes I-II (Western/Antiochene
      Patriarchs) not vendored - out of this world''s own scope.'
