source_file: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877.txt

authors_ruled:
  bar-hebraeus:
    kind: metadata-omission
    evidence: >
      This is this corpus's first plain-text-vendored (non-CCEL) named author,
      so cic/texts/AUTHORS.md - which is generated only from CCEL-XML files'
      own <DC.Creator> markup - has no way to have seen it yet. The author is
      real, well-attested, and not anonymous or pseudonymous: Bar Hebraeus
      (Gregory Abu'l-Faraj, 1226-1286), author of the Chronicon Ecclesiasticum
      (Abbeloos-Lamy edition, Louvain 1872-1877). This is a mechanical
      index-coverage gap, not an attribution dispute.

assignments:
  - row_id: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877--chronicon-ecclesiasticum-volume-iii-the-eastern-church
    work: Chronicon Ecclesiasticum, Volume III (the Eastern Church / Nestorian Catholicoi section)
    author: bar-hebraeus
    locus: "Sectio II (npnf-style locus not applicable - vendored as its own file), the Nestorian
      Catholicoi entries for Papa bar Aggai through Simeon bar Sabbae's martyrdom (file lines
      ~1670-2250)"
    atlas_ids:
      - syriac-edessa-nisibis
    role: tradition
    confidence: assigned
    note: 'This world''s own Persian episcopal-succession dating problem (Doc_02 SS11) previously
      rested only on Fiey''s modern secondary reconstruction of the Chronicle of Seert/Bar
      Hebraeus tradition, with no directly vendored primary text. Verified findable and public
      domain (Abbeloos-Lamy, Louvain 1872-1877, archive.org) and vendored. Latin translation of a
      Syriac original - a second-witness, original-language-adjacent source, never primary
      evidence for a Representative on its own (this project''s evidence language is English).
      Does NOT resolve the Simeon bar Sabbae dating dispute (341 vs. c. 344) - that rests on
      modern external argument (regnal-year/astronomical reasoning) the chronicle itself cannot
      adjudicate; it does let syr.contested.papa-primacy cite the actual primary succession list
      directly rather than only a secondary encyclopedia. Volumes I-II (Western/Antiochene
      Patriarchs) not vendored - out of this world''s own scope.'

  - row_id: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877--lamy-appendix-series-patriarcharum-chaldaeorum-from-sulaka
    work: 'Lamy''s appendix to Bar Hebraeus, Chronicon Ecclesiasticum III: ''Series patriarcharum Chaldaeorum
      S. Sedi unitorum et recentiorum Nestorianorum'', from Sulaka (1551-1555) to the nineteenth century'
    author: barhebraeus
    locus: section III of the appendix, 'Series patriarcharum Chaldaeorum', from file line 29300; Joannes
      Sulaka at 29309; Abdisho IV, Simeon Denha, the later Eliases and Josephs after it, to Joseph Audo
      and the 1830s-1860s at about 29530-29600; Simeon VIII Barmama and the hereditary line at about 29196
    atlas_ids:
    - church-of-the-east-schism-of-1552
    role: context
    confidence: assigned
    note: 'The 1877 Latin appendix by Lamy lists the two lines after 1552 side by side, with the dates of
      each profession of faith sent to Rome, citing Assemani, Badger, Guriel, d''Avril and Martin. This
      is the succession-list evidence the census calls the thin base of the entry, already in the corpus.
      The appendix dates Sulaka''s proclamation 9 April 1552 where Assemani''s 1725 list reads 1553; the
      page images settle it. Read at the lines given. Second witness for exact wording where the OCR is
      rough.

      '
  - row_id: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877--lamy-appendix-series-catholicorum-nestorianorum-continuata
    work: 'Lamy''s appendix to Bar Hebraeus, Chronicon Ecclesiasticum III: ''Series catholicorum Nestorianorum
      continuata'', from Timotheus II (1318) to Simeon VII (d. 1551)'
    author: barhebraeus
    locus: section II of the appendix from file line 29078; Timotheus II at 29168; Simeon VI and VII, the
      bishops sent to India, Sinai and the islands by Simeon, and the death of Simeon VII in 1551 at about
      29180-29196
    atlas_ids:
    - church-of-the-east-timur-to-hakkari
    role: context
    confidence: provisional
    note: 'The same appendix carries the Nestorian catholicoi from 1318 to 1551, the window of the earlier
      entry, with the Indian and Chinese bishops Simeon sent out. Placed on the section heading and the
      lines read.

      '
  - row_id: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877--lamy-appendix-series-patriarcharum-chaldaeorum-nineteenth-century
    work: 'Lamy''s appendix to Bar Hebraeus, Chronicon Ecclesiasticum III: the Chaldean patriarchs of Amid
      and Mosul, Joseph I to Joseph Audo, to about 1865'
    author: barhebraeus
    locus: section III of the appendix, the Josephs of Amid and the line of Mosul, file lines about 29480-29600
      (Josephus I at about 29483; Josephus V at 29505; the creation of the patriarch in 1830 and Audo after
      it)
    atlas_ids:
    - church-of-the-east-chaldean-consolidation
    role: context
    confidence: provisional
    note: 'The appendix''s later entries run the Chaldean line down to the Mosul patriarch Joseph Audo (1847)
      and the 1860s, the consolidation the later entry treats. Placed on the lines read for the sixteenth-century
      entry; the nineteenth-century lines were not read through.

      '
  - row_id: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877--lamy-s-appendix-series-catholicorum-nestorianorum-continuata
    work: 'Lamy''s appendix, Series catholicorum Nestorianorum continuata: the bishops ordained in 1504
      for India'
    author: barhebraeus
    locus: whole volume
    atlas_ids:
    - st-thomas-christians-1300-1517
    role: context
    confidence: assigned
    note: The appendix reports the three bishops ordained in 1504 and sent to India, the Dabek islands and
      China, and the dates of Simeon's death (1503) and Elias's patriarchate (1504) (shelf file lines 29186
      to 29196, in a two-column passage the OCR interleaves). A modern editor's list, not Bar Hebraeus;
      read at those lines.
  - row_id: barhebraeus_chronicon-ecclesiasticum-vol3-lat_abbeloos-lamy1877--barhebraeus-chronicon-ecclesiasticum-iii-lamy-s-note-on-the
    work: 'Barhebraeus, Chronicon ecclesiasticum III: Lamy''s note on the orthodoxy of the Maronites'
    author: barhebraeus
    locus: whole volume
    atlas_ids:
    - maronite-christianity-era-6
    role: context
    confidence: provisional
    note: 'Tier: out-of-window (the chronicle is thirteenth-century; the note is the editor''s, 1877). The
      index entry ''Maronitae an semper fuerint orthodoxi, 404'' is at file line 32675 and Lamy''s addendum
      on the orthodoxy of the Maronites, citing Debs''s book against Joseph David, at 34767 to 34780. The
      Syriac Orthodox side of the argument about the church''s early history that the census calls its floor
