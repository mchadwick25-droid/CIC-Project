- row_id: >-
    castanhoso_portuguese-expedition-to-abyssinia_whiteway1902--castanhoso-s-narrative-of-the-portuguese
  work: >-
    Castanhoso's narrative of the Portuguese expedition to Abyssinia, 1541-1543 (English, Whiteway)
  author: castanhoso
  locus: >-
    Castanhoso, chapter I from file line 6439 (the heading at 6353), through chapter XXVI at 10369; Whiteway's
    introduction from 759 and bibliography at 6313
  atlas_ids:
  - ethiopian-christianity-gragn-to-fasilides
  role: context
  confidence: assigned
  note: >-
    Eyewitness narrative by a Portuguese soldier of the expedition that helped Ethiopia against Ahmad
    Gragn's invasion (the Wayna Daga campaign), first published at Lisbon in 1564. Outside witness: a
    Portuguese Catholic describes the Ethiopian court and church from the field. English translation only;
    the Portuguese is not in the file. Primary voice of the Portuguese side, ready to quote once verified
    against the scan; the OCR was sampled clean.
