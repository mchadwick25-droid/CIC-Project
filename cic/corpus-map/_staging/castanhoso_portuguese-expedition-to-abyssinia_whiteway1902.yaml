authors_ruled:
  bermudez:
    kind: metadata-omission
    evidence: >-
      The file's creator line names Castanhoso as first author. Bermudez's short account is a separate
      work inside the volume, headed 'BERMUDEZ.' (file lines 11572, 336 in the table of contents, and
      66 on the title page 'THE SHORT ACCOUNT OF BERMUDEZ'). The author is not in doubt; the file-name
      prefix cannot hold him.
  correa:
    kind: metadata-omission
    evidence: >-
      The title page (file line 66-68) reads 'AND CERTAIN EXTRACTS FROM CORREA'. The extracts are a separate
      section with running heads 'EXTRACTS FROM CORREA' (file lines 17013, 17029). The author is not in
      doubt; the file-name prefix cannot hold him.
