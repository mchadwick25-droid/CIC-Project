# Worker staging file - npnf208 (Basil: Letters and Select Works, NPNF second
# series vol. 8). The volume holds exactly three works at div1 level: De
# Spiritu Sancto (7), the Hexaemeron (8), and the Letters (9). Its div2 level
# under div1 9 is 405 individual letters - a granularity trap; the letters are
# one body of work, not 405 assignments. Basil's ascetic works (the Rules,
# Moralia) are NOT in this volume and are not assigned from it. Apparatus
# skipped: title pages, genealogical/chronological tables, Prolegomena (div1
# 6, ~61,720 words), indexes (div1 10).
source_file: npnf208_basil-letters-select-works.xml
