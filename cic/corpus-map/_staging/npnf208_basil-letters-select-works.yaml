- work: The Letters
  author: basil
  locus: 'div1 9 (~205,788 words) - the corpus of Basil''s letters, 405 div2 sections (9.2-9.357,
    several holding grouped letters). ONE body of work, deliberately not 405 assignments:
    assigning per letter would be the granularity bug the brief warns against.

    '
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: tradition
  confidence: assigned
  note: 'Includes the canonical letters, the dogmatic letters, letters of spiritual counsel
    and the ascetic letters - the monastic claim is covered by the Cappadocian entry''s own
    name (Pastoral-MONASTIC). Caution for builders: the body prints correspondence RECEIVED
    as well as sent, including letters from the pagan rhetor Libanius (eleven "Basil to Libanius"
    exchanges near the end, div2 ~9.335-9.354) and from the emperor Julian - those individual
    letters are outside voices of exactly the kind Mark''s context ruling covers, embedded
    inside a tradition work; check the sender before quoting any letter as Basil''s own voice.

    '
