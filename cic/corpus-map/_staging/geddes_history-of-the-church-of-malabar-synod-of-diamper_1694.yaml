  atlas_ids:
  - st-thomas-christians-under-portuguese-pressure-d
  role: tradition
  confidence: assigned
  note: >-
    The Synod's decrees in Geddes's English ('done out of Portugueze'); Hough 1839 judges the translation
    literal and checked it against Raulin's Latin. Primary for what Rome ordered and what it condemned
    in the Syriac church, a hostile hand on the community's practice. Second witness for exact wording:
    OCR is readable but carries f-for-long-s and broken words.
