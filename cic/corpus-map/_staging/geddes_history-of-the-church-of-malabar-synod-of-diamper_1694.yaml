source_file: geddes_history-of-the-church-of-malabar-synod-of-diamper_1694.txt
authors_ruled:
  synod-of-diamper:
    kind: anonymous
    evidence: 'The acts and decrees are the corporate work of the diocesan Synod of Diamper (1599) convened
      by Aleixo de Menezes; the translations carry the translator''s name (Geddes, Raulin) but no individual
      author of the decrees themselves. Geddes''s title page: ''Done out of Portugueze into English'';
      Raulin''s: ''nunc primum e Lusitano in Latinum versa''.'
    from_file: geddes_history-of-the-church-of-malabar-synod-of-diamper_1694.txt
assignments:
- row_id: geddes_history-of-the-church-of-malabar-synod-of-diamper_1694--the-acts-and-decrees-of-the-synod-of-diamper-1599-english
  work: The Acts and Decrees of the Synod of Diamper (1599), English
  author: synod-of-diamper
  locus: profession of faith from file line 9602; Actions III-IX under 'The Acts and Decrees' running
    heads from about line 10725 (Action III) and 16245 (Action V) to the end of the Decrees
  atlas_ids:
  - st-thomas-christians-under-portuguese-pressure-d
  role: tradition
  confidence: assigned
  note: >-
    The Synod's decrees in Geddes's English ('done out of Portugueze'); Hough 1839 judges the translation
    literal and checked it against Raulin's Latin. Primary for what Rome ordered and what it condemned
    in the Syriac church, a hostile hand on the community's practice. Second witness for exact wording:
    OCR is readable but carries f-for-long-s and broken words.
