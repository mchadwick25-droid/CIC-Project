source_file: npnf107_augustine-homilies-john-soliloquies.xml

# CCEL DC.Creator: `augustine`; NPNF div1s are works. No authors_ruled needed.
# Skipped as editorial apparatus: title page, Preface (div1 1-2), indexes (div1 6).

assignments:
  - work: "Tractates on the Gospel of John (In Evangelium Ioannis tractatus)"
    author: augustine
    locus: "div1 3 — Lectures or Tractates on the Gospel According to St. John; 124 tractates (~412,000 words) assigned as one body per the granularity rule, not one work per tractate"
    atlas_ids:
      - latin-pastoral-congregational-christianity
    role: tradition
    confidence: assigned
    note: >
      Homilies on John preached at Hippo, c. 406-420s. The earlier tractates
      carry an anti-Donatist undercurrent from the years of that controversy,
      but the English text names the Donatists only a handful of times, so no
      donatism id is claimed; the dedicated anti-Donatist works are in
      npnf104.

  - work: "Ten Homilies on the First Epistle of John (In epistulam Ioannis ad Parthos tractatus)"
    author: augustine
    locus: "div1 4 — Ten Homilies on the First Epistle of John; the ten-homily series assigned as one body"
    atlas_ids:
      - latin-pastoral-congregational-christianity
    role: tradition
    confidence: assigned
    note: >
      Preached Easter week c. 407, on love and the unity of the church.
      Congregational preaching of the Latin pastoral entry.

  - work: "Soliloquies (Soliloquia)"
    author: augustine
    locus: "div1 5 — Two Books of Soliloquies"
    atlas_ids:
      - latin-pastoral-congregational-christianity
    role: tradition
    confidence: provisional
    note: >
      Written 386-387 at Cassiciacum near Milan, before baptism and long
      before ordination — a philosophical dialogue, not pastoral work from
      Hippo. Held in Augustine's own entry for want of a better home; whether
      the Cassiciacum period should also touch ambrosian-milan-standalone,
      which is Ambrose's entry, not Augustine's, remains an open question —
      not asserted here.
