- work: Pamphilus' Defence of Origen (Rufinus' translation) with Rufinus' Epilogue (De Adulteratione
    Librorum Origenis)
  author: rufinus
  locus: div2 5.5-5.6
  atlas_ids:
  - alexandria-catechetical
  - hieronymian-ascetic-literary
  role: context
  confidence: provisional
  note: 'Pamphilus'' defence of Origen''s orthodoxy in Rufinus'' Latin (397), with Rufinus''
    own treatise on the corruption of Origen''s works. Context for alexandria (a defence of
    its greatest teacher from outside the school) and for hal (this translation ignited the
    Jerome-Rufinus war that dominates the hal world''s later years). Provisional on authorship:
    the underlying work is Pamphilus'' (a slug exists via anf06), but npnf203''s own metadata
    credits rufinus, whose corpus this section is.

    '
- work: Rufinus' Apology in Defence of Himself (Apologia ad Anastasium)
  author: rufinus
  locus: div2 5.9
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: provisional
  note: 'Rufinus'' short self-defence to Anastasius of Rome (400). Provisional on role: Rufinus
    was a member of the same Roman ascetic-literary circle the hal world is built on (Melania''s
    circle, Jerome''s former friend), so tradition is arguable; if Mark reads hal strictly
    as Jerome''s own voice, this becomes context.

    '
- work: Letter of Anastasius to John of Jerusalem concerning Rufinus
  author: anastasius_rome
  locus: div2 5.10
  atlas_ids:
  - hieronymian-ascetic-literary
  - alexandria-catechetical
  role: context
  confidence: provisional
  note: 'Rome''s judgment in the Origenist controversy (401): a papal letter surrounding the
    Jerome-Rufinus quarrel and condemning Origen''s translated teaching. Context for both
    entries the controversy touches. Author ruled above from the section''s own title.

    '
- work: The Apology of Rufinus (Against Jerome, to Apronianus)
  author: rufinus
  locus: div2 5.11 — two books
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: provisional
  note: 'Rufinus'' full-length answer to Jerome (401) - first-rank primary evidence for the
    hal world''s central quarrel, from its other participant. Same role doubt as his Apology
    to Anastasius: tradition if hal includes its own antagonist-insiders, context if it is
    strictly Hieronymian. Also plainly evidence about the Latin fight over Origen''s legacy;
    see the context row on Jerome''s Apology below, which covers the same ground for alexandria.

    '
- work: Jerome's Apology for Himself Against the Books of Rufinus
  author: jerome
  locus: div2 5.12 — three books
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: assigned
  note: 'Jerome''s counter-apology (401-402), among the most personally revealing of his works.
    Core hal material; the rest of Jerome is in npnf206.

    '
- work: Jerome's Apology for Himself Against the Books of Rufinus
  author: jerome
  locus: div2 5.12
  atlas_ids:
  - alexandria-catechetical
  role: context
  confidence: assigned
  note: 'Same work, context row: with Rufinus'' Apology it is the fullest documentation of
    how Origen''s legacy was fought over in the Latin West - evidence about the Alexandrian
    tradition''s reception, from outside it.

    '
- work: A Commentary on the Apostles' Creed (Rufinus)
  author: rufinus
  locus: div2 5.13
  atlas_ids:
  - aquileian-christianity
  role: tradition
  confidence: assigned
  note: 'Rufinus'' catechetical exposition of the baptismal creed of Aquileia (c. 404).
    aquileian-christianity (I.41) was minted for it: the content has
    nothing to do with the Jerome quarrel, and hieronymian-ascetic-literary is a controversy while this
    is a catechesis. It is also the earliest evidence that the Western churches did not all say the same
    words at the font: Rufinus expounds his own church''s creed and notes where Rome''s differs.


    '
- work: Rufinus' Translation Prefaces and Perorations (Recognitions of Clement; Origen on
    Psalms 36-38; Origen on Romans)
  author: rufinus
  locus: div2 5.14, 5.17-5.19 (the prefaces STRUCTURE.md marks as apparatus are skipped)
  atlas_ids:
  - alexandria-catechetical
  role: context
  confidence: provisional
  note: 'Grouped as one small body: Rufinus'' own prefaces to his translations, documenting
    how and why Origen and the Clementine literature were carried into Latin. Context for
    alexandria as transmission evidence. Provisional because these are paratexts; they may
    be worth dropping to sub-work-level instead.

    '
- work: Gennadius, Lives of Illustrious Men (continuation)
  author: gennadius
  locus: 'div2 4.4, chapters XIX (Sulpitius Severus), LXII (Cassianus/Cassian), LXIV (Eucherius
    of Lyons), LXV (Vincentius of Lerins), LXX (Hilary of Arles), LXXXV (Prosper of Aquitaine),
    LXXXVI (Faustus of Riez)'
  atlas_ids:
  - gallic-monastic-ascetic-christianity
  role: context
  confidence: assigned
  note: 'Independent, near-contemporary corroboration for seven of this world''s own figures, all
    in one continuation-of-Jerome chapter set: Sulpitius Severus, Cassian, Eucherius, Vincentius,
    Hilary of Arles, Prosper, and Faustus. Verified directly against the file, chapter by chapter:
    ch. XIX opens "Severus the presbyter... surnamed Sulpitius"; ch. LXII "Cassianus, Scythian by
    race... a presbyter at Marseilles, founded two monasteries"; ch. LXIV "Eucherius, bishop of the
    church at Lyons"; ch. LXV "Vincentius, the Gaul, presbyter in the Monastery on the Island of
    Lerins"; ch. LXX "Hilary, bishop of the church at Arles"; ch. LXXXV "Prosper of Aquitania";
    ch. LXXXVI "Faustus the bishop" (title) - all seven chapter titles and contents confirmed at
    their own loci, matching this world''s own source record (gallic.source.gennadius-de-viris-
    illustribus, Source Registry row 30) exactly.

    `role: context`, not `tradition`: that same record states Gennadius was "writing c. 495, just
    after this world''s own working ceiling" (c. 360-450) and calls the material "Corroborating
    rather than load-bearing: this world''s Representative draws on the IN-WINDOW facts Gennadius
    attests, never on Gennadius''s own post-window words as this world''s own voice." A second,
    distinct editorial layer sits in the same file - Richardson''s own bracketed dating endnotes to
    these same chapters (gallic.source.richardson-gennadius-endnotes, Source Registry row 42), used
    by this world for dating attributions but kept deliberately distinct from Gennadius''s own
    ancient text per that world''s own Doc_02 SS0 discipline - not assigned as a separate row here
    since it is modern apparatus, not itself vendored ancient text.

    '
