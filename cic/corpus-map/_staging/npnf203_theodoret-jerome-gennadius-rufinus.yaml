# NOTE FOR REVIEW: Jerome appears in this volume (Lives of Illustrious Men,
# div2 4.3; Apology Against Rufinus, div2 5.12) AND fills npnf206, which is
# another worker's volume. Only what is physically in npnf203 is assigned here.
source_file: npnf203_theodoret-jerome-gennadius-rufinus.xml
authors_ruled:
  theodoret:
    kind: metadata-omission
    evidence: 'div1 3 title "The Ecclesiastical History, Dialogues, and Letters of Theodoret.";
      npnf203 DC.Creator itself lists theodoret. The omission is only the automated div1-to-creator
      binding (AUTHORS.md lists this div1 as unattributed because the truncated title did
      not match a slug); the file''s own title and metadata both carry the name.

      '
  anastasius_rome:
    kind: metadata-omission
    evidence: 'div2 5.10 title "The Letter of Anastasius, Bishop of the Church of Rome to
      John Bishop of Jerusalem Concerning the Character of Rufinus."; npnf203 DC.Creator lists
      gennadius, jerome, rufinus, theodoret and no Anastasius.

      '
assignments:
- work: The Ecclesiastical History of Theodoret
  author: theodoret
  locus: div2 3.8 — The Ecclesiastical History of Theodoret (323-428)
  atlas_ids:
  - antiochene-exegetical-christianity-chrysostom-ce
  role: tradition
  confidence: provisional
  note: 'Theodoret of Cyrrhus is the heir and last major voice of the Antiochene school; the
    census entry is ''Chrysostom-centered'' and dated c. 350-430, and Theodoret (d. c. 457,
    History written c. 449) sits at its edge. Provisional for exactly that fit question -
    no better own-entry exists for him in the census.

    '
- work: The Ecclesiastical History of Theodoret
  author: theodoret
  locus: div2 3.8 — esp. Books I-II (Arian controversy), V (Ambrose and Theodosius)
  atlas_ids:
  - homoian-arian-christianity
  - imperial-juridical-christianity
  - ambrosian-milan-standalone
  role: context
  confidence: assigned
  note: 'Same work, context row. The History''s arc is the Arian controversy from Nicaea to
    its defeat, preserving documents of the Arian/homoian side described from outside. Book
    V carries the Ambrose-Theodosius penance narrative and numerous imperial letters and edicts
    - evidence for ijc from an eastern observer. His Syriac notices (Jacob of Nisibis, Ephraim)
    were considered and not assigned: they are brief, and his real Syrian-monk source (Historia
    Religiosa) is not in this volume.

    Also assigned to ambrosian-milan-standalone: Book V''s Ambrose-Theodosius penance narrative
    is a near-contemporary (c. 449) external account of Ambrose''s own single most famous act,
    a second voice this Confessions-and-NPNF210-only world otherwise lacks entirely. Surfaced
    through a source-research pass on Ambrosian Milan''s (I.16) sourcing gaps.

    '
- work: The Ecclesiastical History of Theodoret
  author: theodoret
  locus: div2 3.8 — II.26 (the siege of Nisibis and 'the apostolic conversation' of Bishop Jacobus), IV.26
    (Of Didymus of Alexandria and Ephraim the Syrian)
  atlas_ids:
  - syriac-edessa-nisibis
  role: context
  confidence: assigned
  note: 'Two Syriac-relevant loci verified directly against the file: II.26 (line 11049) is the chapter
    "Of the siege of the city of Nisibis, and the apostolic conversation of Bishop Jacobus" - the church''s
    own remembered story of the 350 siege (Jacob''s prayer, the gnat plague), which places Jacob alive at
    that siege, one pole of the open 338-vs-350 death-year conflict this world already tracks (world_core
    caution 10). IV.26 (line 15044) states "at Edessa flourished the admirable Ephraim" - an independent
    5th-century witness to Ephrem''s standing, verified verbatim. Context, not tradition: Theodoret writes
    a century after the events, hagiographically shaping the Nisibis narrative (syr.source.theodoret-historia-ecclesiastica).

    '
- work: Dialogues (Eranistes)
  author: theodoret
  locus: div2 3.9 — The 'Eranistes' or 'Polymorphus'
  atlas_ids:
  - antiochene-exegetical-christianity-chrysostom-ce
  role: tradition
  confidence: assigned
  note: 'The mature statement of Antiochene two-nature Christology in dialogue form (c. 447),
    with its florilegia of patristic proof-texts.

    '
- work: Dialogues (Eranistes)
  author: theodoret
  locus: div2 3.9
  atlas_ids:
  - cyrilline-miaphysite-egyptian-tradition
  role: context
  confidence: provisional
  note: 'Same work, context row: the Eranistes argues against the one-nature theology whose
    tradition that census entry names, so it is material about that entry from outside, per
    the doctrinal-floor pattern. Provisional because its immediate target is Eutychianism
    before 451, not Cyril''s own teaching, and because two Cyrilline entries exist (era-2
    ''tradition'', era-3 ''christianity''); the era-2 entry was chosen as the one covering
    the controversy''s own years.

    '
- work: The Anathemas of Cyril with the Counter-statements of Theodoret
  author: theodoret
  locus: div2 3.6-3.7 — The Anathemas of Cyril in Opposition to Nestorius; Counter-statements
    of Theodoret
  atlas_ids:
  - antiochene-exegetical-christianity-chrysostom-ce
  - cyrilline-miaphysite-egyptian-tradition
  role: tradition
  confidence: provisional
  note: 'A paired document from the Nestorian controversy (430-431): Cyril''s Twelve Anathemas
    quoted in full with Theodoret''s replies. Tradition for both sides at once - the counter-statements
    are Antiochene, the embedded anathemas are the Cyrilline tradition''s own words. Provisional
    because Cyril is not a slug anywhere in the corpus and the pairing is the editor''s arrangement;
    filed under theodoret, whose counter-statements frame the text as printed.

    '
- work: Letters of the Blessed Theodoret
  author: theodoret
  locus: div2 3.10 — Letters of the Blessed Theodoret, Bishop of Cyprus [sic; Cyrus]
  atlas_ids:
  - antiochene-exegetical-christianity-chrysostom-ce
  role: tradition
  confidence: assigned
  note: 'The correspondence (181 letters here) of the last Antiochene: pastoral administration,
    the Eutychian controversy, appeals to Leo and to court officials. Also dense incidental
    evidence for imperial-church politics of the 440s; ijc may claim it at review, not asserted
    here.

    '
- work: The Ecclesiastical History of Theodoret, Book IV, Chapter XVI ("Of the holy Basilius,
    Bishop of Caesarea, and the measures taken against him by Valens and the prefect Modestus")
  author: theodoret
  locus: div2 3.8 — Book IV, Chapter XVI (id iv.viii.iv.xvi, file line 14072)
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: context
  confidence: assigned
  note: 'Found by cappadocian.source.church-historians-socrates-sozomen-theodoret (kind: vendored),
    whose own verification_state was `named-not-rechecked` for its Theodoret material specifically.
    That review is done here, and turned up more than the record itself named: this exact chapter
    is Theodoret''s full narrative of the confrontation between Basil the Great and the emperor
    Valens at Caesarea in Cappadocia, read directly at the cited locus - "Valens... set out for
    the Cappadocian Caesarea... at that time the see of the great Basil, a light of the world.
    Now he had sent the prefect before him with orders either to persuade Basil to embrace the
    communion of Eudoxius, or, in the event of his refusal, to punish him by exile." A near-contemporary
    (Theodoret wrote c. 449) external narrative of this world''s single most famous standoff -
    genuinely load-bearing corroboration, not a passing mention. `role: context`: an outside
    Antiochene historian''s account, not Cappadocian material in its own voice - the same restraint
    the record itself states ("secondary narrative sources, never this world''s own voice").

    '
- work: Jerome, Lives of Illustrious Men (De Viris Illustribus) - entries on Basil, Gregory
    Nazianzen, Gregory of Nyssa, and Amphilochius
  author: jerome
  locus: div2 4.3 — Chapters CXVI (Basil, id v.iii.cxviii), CXVII (Gregory Nazianzen, id v.iii.cxix),
    CXXVIII (Gregory of Nyssa, id v.iii.cxxx), and CXXXV (Amphilochius, id v.iii.cxxxvi)
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: context
  confidence: assigned
  note: 'Found by cappadocian.source.jerome-de-viris-illustribus (kind: vendored), whose own
    verification_state was `named-not-rechecked` - "file present since 2026-08-15, not re-verified
    this session against the specific entries Doc_02 cites." That review is done here. The record''s
    own framing ("the earliest external catalogue of what circulated under Basil, both Gregorys,
    and Amphilochius'' names") is confirmed directly: all four named figures have their own DVI
    chapters, independently located and read - ch. CXVI on "Basil... bishop of Caesarea in Cappadocia,
    the city formerly called Mazaca"; ch. CXVII on "Gregory... bishop of Nazianzen, a most eloquent
    man, and my instructor in the Scriptures" (Jerome''s own personal testimony, not secondhand);
    ch. CXXVIII on "Gregory... bishop of Nyssa, the brother of Basil of Caesarea"; ch. CXXXV on
    "Amphilochius... bishop of Iconium". The record''s own carried-forward correction was also
    independently checked and confirmed accurate: DVI''s separate ch. LXXXV ("Eustathius the
    bishop") is genuinely about Eustathius of Antioch, not Eustathius of Sebaste - the chapter''s
    own translator''s note flags exactly this confusion risk directly in the text, so citing
    ch. LXXXV for this world''s own Eustathius (of Sebaste) would be a real misattribution; not
    assigned here for that reason. `role: context`: an external, near-contemporary literary
    catalogue entry about these figures, not their own voice, though ch. CXVII''s "my instructor"
    line is itself a first-person datum about Jerome''s relationship to Gregory Nazianzen worth
    keeping visible at review.

    '
- work: Lives of Illustrious Men (De Viris Illustribus)
  author: jerome
  locus: div2 4.3 — Jerome. Lives of Illustrious Men.
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: assigned
  note: 'Jerome''s catalogue of 135 Christian authors (392, Bethlehem) - the charter of his
    literary self-positioning, ending with himself. Belongs to the built hal world. The rest
    of Jerome is in npnf206 (another worker''s volume); only this and the Apology Against
    Rufinus below are in npnf203.

    '
- work: Lives of Illustrious Men (De Viris Illustribus)
  author: jerome
  locus: div2 4.3 — the 'Bardesanes the heresiarch' and 'Ephrem the deacon' chapters
  atlas_ids:
  - syriac-edessa-nisibis
  role: context
  confidence: assigned
  note: 'Same catalogue, context row for its two Syriac-relevant chapters, verified directly against
    the file (line 41542): Jerome states Ephrem "became so distinguished that his writings are repeated
    publicly in some churches, after the reading of the Scriptures" - independent late-4th-century attestation
    of his diaconate and reputation. The Bardesanes chapter transmits the heresiological framing Jerome
    received, read with the same screen. Context, not tradition: Jerome writes at one remove (he read
    Ephrem in Greek translation), outside the Edessa/Nisibis tradition itself (syr.source.jerome-de-viris).

    '
- work: Lives of Illustrious Men (De Viris Illustribus), ch. "Antonius the monk" (file line
    41173)
  author: jerome
  locus: div2 4.3, Chapter LXXXVIII "Antonius the monk"
  atlas_ids:
  - desert-monasticism
  role: context
  confidence: assigned
  note: 'Found by desert.source.jerome-de-viris (kind: vendored; no corpus-map assignment given
    at intake time). Independently re-verified directly against the vendored file at the record''s
    own cited locus: line 41173 opens "Antonius the monk...sent seven letters in Coptic to
    various monasteries, letters truly apostolic in idea and language, and which have been
    translated into Greek" - confirms the record''s claim that Jerome independently attests
    seven circulating Antonian letters, cited by desert.contested.antony-literacy as one leg
    of Rubenson''s authenticity case. `role: context`, not `tradition`: this is an external
    literary cataloguer''s biographical notice ABOUT desert monasticism''s own tradition (used
    as corroborating attestation), not the tradition''s own voice. The same volume''s Origenist-controversy
    material is explicitly flagged by the source record as out of this world''s own horizon
    and is not assigned here.

    '
- work: Lives of Illustrious Men (De Viris Illustribus), ch. LXXVII "Lucianus the presbyter"
    (file line 40990)
  author: jerome
  locus: div2 5.3, Chapter LXXVII "Lucianus the presbyter"
  atlas_ids:
  - antiochene-church-third-century
  role: context
  confidence: assigned
  note: 'This world''s census entry names Lucian of Antioch as one of its five voices and cites
    exactly this locus (Jerome, De Viris Illustribus ch. 77) as his attestation, but it had not
    been corpus-mapped before this pass. Verified directly at line 40990-41001: "Lucianus...a
    man of great talent, presbyter of the church at Antioch, was so diligent in the study of the
    Scriptures, that even now certain copies of the Scriptures bear the name of Lucian. Works of
    his, On faith, and short Epistles to various people are extant. He was put to death at
    Nicomedia for his confession of Christ in the persecution of Maximinus." A third, independent
    near-contemporary notice of the same figure alongside Eusebius''s two (VIII.13.2, IX.6.3,
    also added this same pass to npnf201) - confirms the Scriptural-revision reputation and the
    circulation of his own now-lost works ("On faith," letters), neither of which Eusebius
    mentions. `role: context`: an outside cataloguer''s biographical notice, not Lucian''s own
    surviving voice - none of the works Jerome names here survive in translation (see the
    dossier''s own §5 floor-question note, which this does not resolve).

    '
- work: Gennadius, Lives of Illustrious Men (continuation), ch. "Pachomius the presbyter-monk"
