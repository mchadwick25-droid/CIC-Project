    '
- work: Gennadius, Lives of Illustrious Men (continuation)
  author: gennadius
  locus: div2 4.4 — Gennadius. Lives of Illustrious Men.
  atlas_ids:
  - merovingian-gallic-christianity
  role: tradition
  confidence: assigned
  note: 'Gennadius of Marseilles (late 5th c.) continuing Jerome''s catalogue. He has no
    obvious census home at first glance - merovingian-gallic-christianity (c. 480-620) seems
    to start as he ends - but Gennadius died c. 496, which is INSIDE that window rather than
    before it: the overlap is real and he falls in it. Assigned there as his home, with
    hieronymian-ascetic-literary kept as context: the direct continuation of Jerome''s literary
    project, not membership of his circle.'
