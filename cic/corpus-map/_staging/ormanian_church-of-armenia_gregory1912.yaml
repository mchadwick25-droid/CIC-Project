  - row_id: ormanian_church-of-armenia_gregory1912--church-of-armenia
    work: "The Church of Armenia (Ormanian; Gregory's English translation, 1912): chapters XV-XVI"
    author: ormanian
    locus: "chapter XV 'The Return to Etchmiadzin' (file line 3913), the sixteenth-century patriarchs under Persian rule, the 1512 printing and the Amsterdam Bible of 1666 (lines about 4084-4134); chapter XVI 'The Patriarchate of Constantinople' (line 4122)"
    atlas_ids:
      - armenian-christianity-new-julfa
    role: context
    confidence: assigned
    note: >
      An overview by a former Armenian patriarch of Constantinople, translated into English
      in 1912. It gives the see's return to Etchmiadzin (1441), the disorder of the sixteenth
      century under Persian khans, the start of Armenian printing and the 1666 Amsterdam
      Bible. It does not tell the deportation of 1604-05 or New Julfa. A twentieth-century
      synthesis, not a source from the period; he writes as a Constantinople churchman, so
      his judgement of Etchmiadzin is not neutral. Clean OCR; passages read at the lines
      cited.
