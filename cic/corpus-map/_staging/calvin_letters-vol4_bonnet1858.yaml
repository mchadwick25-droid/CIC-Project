  - row_id: calvin_letters-vol4_bonnet1858--letters-of-john-calvin-compiled-from-the-original
    work: "Letters of John Calvin, Compiled from the Original Manuscripts
      and Edited with Historical Notes, Vol. IV"
    author: calvin
    locus: "whole file - Vol. IV"
    atlas_ids:
      - the-reformed-cities-zurich-and-geneva
    role: tradition
    confidence: assigned
    note: >
      Continues Calvin's correspondence into his later years - this
      volume's own cumulative index (which references entries across all
      four volumes by Roman-numeral volume number) confirms it is the
      set's final volume, closing with "THE END" - same set and vendoring
      basis as Vols. I-II. Translator differs from those volumes: this
      volume's own title page names Marcus Robert Gilchrist as translator,
      where Vols. I-II name no individual translator - see this file's
      own intake header.

  - row_id: calvin_letters-vol4_bonnet1858--letters-of-john-calvin-compiled-from-the-original-2
    work: Letters of John Calvin, Vol. IV, DC 'To the Pastors of Zurich', Geneva 14 July 1561, a collection
      in favour of the Evangelical Churches of Piedmont, and the surrounding letters on the valleys' war
      of 1560-61
    author: calvin
    locus: DC 'To the Pastors of Zurich' at line 9512; Bonnet's index entries for Piedmont and the Waldenses
      from line 20468
    atlas_ids:
    - the-waldensian-reformed-union
    role: context
    confidence: assigned
    note: 'Calvin writing for the brethren ''from the valley of Angrogne'' after the 1560-61 war, admitting
      Geneva had dissuaded them from taking up arms. Note that DLXVII ''To the Waldenses'' (line 5506) is
      to the Bohemian Brethren, per Bonnet''s own footnote, and is not a Piedmont letter.

      '

  - row_id: calvin_letters-vol4_bonnet1858--letters-of-john-calvin-compiled-from-the-original-3
    work: 'Letters of John Calvin, Vol. IV: the letters to John Knox (DXLIX, 1559; DXC, 1561) and the 1559
      letter on Knox''s First Blast'
    author: calvin
    locus: letter DXLIX 'To John Knox' at file line 3494 (answers on ecclesiastical questions from Scotland,
      1559); letter DXC 'To John Knox' at 8545 (on the progress of the Reformation in Scotland, 1561); the
      letter on Knox's pamphlet against the government of women from about 2288 (Calvin's own account of
      his conversation with Knox); Bonnet's note at 8579 on the lost Knox-Calvin correspondence
    atlas_ids:
