    role: tradition
    confidence: needs-ruling
    note: >
      The only surviving life of Benedict. Whether Gregory's Book II is tradition for the
      Benedictine entry (as for the Gregorian one) is a double-placement the Gregorian
      dossier named as unsettled; needs-ruling.

