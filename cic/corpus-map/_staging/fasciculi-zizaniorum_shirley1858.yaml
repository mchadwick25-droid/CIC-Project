    note: >
      Anonymous 15th-c. hostile compilation, ed. Shirley (1858). Contains
      the Latin text of the Twelve Conclusions of the Lollards (1395)
      under the heading "Conclusiones Lollardorum porrectae pleno
      parliamento," plus the heresies extracted from Purvey's own
      heretical book and his confession/recantation, and William
      Sautre's own articles and examination record - an independent
      Latin leg of the hostile-trial-record gap this world's source
      ecology otherwise leaves unfilled. Per the Library's
      non-English-primary-evidence rule
      (Build/worlds/_cross-world/LIBRARY-DECISION-LOG.md), this Latin
      text is primary evidence directly, verified against the vendored
      file, since it is primary to the movement regardless of language;
      the scan is clean, not flagged as garbled under the Library's own
      OCR-quality rule.
