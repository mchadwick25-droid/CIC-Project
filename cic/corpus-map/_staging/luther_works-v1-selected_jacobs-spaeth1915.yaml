assignments:
  - work: "The Ninety-Five Theses (Disputation on the Power and Efficacy of
      Indulgences), with the Letter to Archbishop Albrecht of Mainz"
    author: luther
    locus: "Letter to the Archbishop Albrecht of Mainz through the Disputation
      itself (lines ~990-1957 of the vendored file)"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      The founding document of the Reformation, 31 October 1517 - Luther's
      own ninety-five theses against indulgence sales, with the covering
      letter that actually launched the controversy.

  - work: "A Treatise on the Holy Sacrament of Baptism"
    author: luther
    locus: "lines ~1957-2856"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1519 sacramental treatise, an early statement of Luther's own baptismal
      theology predating the Small Catechism by a decade.

  - work: "A Discussion of Confession"
    author: luther
    locus: "lines ~2856-3994"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 treatise on confession and absolution, part of Luther's own
      running argument against the sacramental system he was breaking from.

  - work: "The Fourteen of Consolation, for Such as Labor and Are Heavy Laden"
    author: luther
    locus: "lines ~3994-6239"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 devotional treatise, written for the ailing Elector Frederick the
      Wise - Luther's own pastoral, comfort-facing voice, distinct in
      register from the polemical works in this same volume.

  - work: "A Treatise on Good Works"
    author: luther
    locus: "lines ~6239-10629"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 treatise on the Ten Commandments and the relationship of faith to
      works - one of Luther's own three great 1520 treatises alongside the
      Nobility and Babylonian Captivity (both in the companion Vol. II file).

  - work: "A Treatise on the New Testament, That Is the Holy Mass"
    author: luther
    locus: "lines ~10629-12211"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 treatise reinterpreting the Mass as testament/promise rather than
      sacrifice - directly upstream of the eucharistic argument the Babylonian
      Captivity (Vol. II) develops at length.

  - work: "To the Papacy at Rome, an Answer to the Celebrated Romanist at
      Leipzig"
    author: luther
    locus: "lines ~12211-end"
    atlas_ids:
      - lutheran-wittenberg-and-its-congregations
    role: tradition
    confidence: assigned
    note: >
      1520 polemical response to Augustin von Alveld - sharper anti-papal
      register than the volume's more constructive treatises, useful for the
      full range of Luther's own period voice.
