# anf01 is the corpus's hardest attribution case: DC.Creator names only
# `irenaeus`, while the div1 sections carry seven more authors. Brief §6.2
# records the failure mode (everything handed to Irenaeus); these rulings
# recover the attributions from the volume's own section headers.
source_file: anf01_apostolic-fathers-justin-irenaeus.xml
authors_ruled:
  clement_rome:
    kind: metadata-omission
    evidence: 'div1 2 title "CLEMENT OF ROME" over "First Epistle to the Corinthians"; anf01
      DC.Creator names only irenaeus. Same slug CCEL itself uses in anf08''s DC.Creator, so
      no new identity is minted.

      '
  mathetes:
    kind: metadata-omission
    evidence: 'div1 3 title "MATHETES" over "Epistle to Diognetus"; anf01 DC.Creator names
      only irenaeus. "Mathetes" is the volume''s own designation for the epistle''s unnamed
      author (Greek for "a disciple").

      '
  polycarp:
    kind: metadata-omission
    evidence: 'div1 4 title "POLYCARP" over "Epistle to the Philippians"; anf01 DC.Creator
      names only irenaeus.

      '
  ignatius:
    kind: metadata-omission
    evidence: 'div1 5 title "IGNATIUS" over the epistles in shorter, longer and Syriac recensions;
      anf01 DC.Creator names only irenaeus.

      '
  pseudo_ignatius:
    kind: pseudonymous
    evidence: 'The volume''s own apparatus at div2 5.13, "Introductory Note to the Spurious
      Epistles of Ignatius", marks div2 5.14-5.23 as spurious - the file itself withholds
      them from Ignatius.

      '
  barnabas:
    kind: metadata-omission
    evidence: 'div1 6 title "BARNABAS" over "The Epistle of Barnabas"; anf01 DC.Creator names
      only irenaeus.

      '
  papias:
    kind: metadata-omission
    evidence: 'div1 7 title "PAPIAS" over "Fragments"; anf01 DC.Creator names only irenaeus.

      '
  justin_martyr:
    kind: metadata-omission
    evidence: 'div1 8 title "JUSTIN MARTYR" over the apologies, the Dialogue and the shorter
      pieces; anf01 DC.Creator names only irenaeus.

      '
  martyrdom_of_polycarp:
    kind: anonymous
    evidence: 'div2 4.4 "The Martyrdom of Polycarp" is a third-person account sent by the
      church of Smyrna about Polycarp''s death, not a work by him; treated as a work-entity
      per brief §6.4.

      '
  martyrdom_of_ignatius:
    kind: anonymous
    evidence: 'div2 5.25 "The Martyrdom of Ignatius" is an anonymous third-person acta about
      Ignatius, not a work by him; work-entity per brief §6.4.

      '
  martyrdom_of_justin:
    kind: anonymous
    evidence: 'div2 8.11 "The Martyrdom of Justin Martyr" is an anonymous third-person acta
      of Justin and his companions, not a work by him; work-entity per brief §6.4.

      '
assignments:
- work: First Epistle to the Corinthians (1 Clement)
  author: clement_rome
  locus: div2 2.2 under div1 'CLEMENT OF ROME'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: assigned
  note: 'Rome, c. 96 - squarely in the entry''s window and region. The pahc world already
    cites this volume for it (pahc.source.first-clement).

    '
- work: Epistle to Diognetus
  author: mathetes
  locus: div2 3.2 under div1 'MATHETES'
  atlas_ids:
  - post-apostolic-house-church
  - greek-apologists-second-century
  role: tradition
  confidence: assigned
  note: 'Anonymous apology of uncertain date and place (2nd-3rd c.). The census has no entry
    for the Greek apologists as such; placed with the era-1 mainstream entry the volume''s
    other works belong to. Doubt is the date - some put it after the entry''s 200 CE close.
    2026-08-26: greek-apologists-second-century added alongside - the entry the corpus assignment
    showed was missing, for the era''s outward-facing writing. pahc is kept: the era and church-world
    really are its.'
- work: Epistle to the Philippians (Polycarp)
  author: polycarp
  locus: div2 4.2 under div1 'POLYCARP'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: assigned
  note: 'Smyrna, early 2nd c. Already cited by pahc.source.polycarp-philippians.

    '
- work: The Martyrdom of Polycarp
  author: martyrdom_of_polycarp
  locus: div2 4.4 under div1 'POLYCARP'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: assigned
  note: 'Encyclical of the church of Smyrna on Polycarp''s death (c. 155-160), filed as an
    anonymous work-entity rather than under Polycarp. Already cited by pahc.source.martyrdom-polycarp.

    '
- work: Epistles of Ignatius (seven epistles; shorter, longer and Syriac recensions)
  author: ignatius
  locus: div2 5.2-5.8 (Greek recensions), 5.10-5.12 (Syriac versions) under div1 'IGNATIUS'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: assigned
  note: 'One coherent body presented in parallel recensions of the same seven letters, assigned
    as one work per the granularity rule. Antioch/Asia Minor, c. 107. Already cited by pahc.source.ignatius-letters.

    '
- work: Spurious Epistles of Ignatius
  author: pseudo_ignatius
  locus: div2 5.14-5.23 under div1 'IGNATIUS'
  atlas_ids:
  - post-apostolic-house-church
  - apocryphal-and-pseudepigraphal-literature
  role: tradition
  confidence: assigned
  note: 'Later pseudepigrapha (the volume''s own intro at 5.13 calls them spurious, generally
    dated 4th c.). Best guess is the entry whose figure they impersonate, but a 4th-century
    forgery sitting as `tradition` in a 70-200 CE entry is exactly the kind of call Mark should
    make, not me. Resolved 2026-08-26: this is the pseudepigrapha case exactly - a 4th-century
    forgery in a first-century figure''s name - and apocryphal-and-pseudepigraphal-literature
    was added to hold that class. pahc is kept because the figure they impersonate is its.'
- work: The Martyrdom of Ignatius
  author: martyrdom_of_ignatius
  locus: div2 5.25 under div1 'IGNATIUS'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: provisional
  note: 'Later anonymous acta of disputed date. Placed with the tradition of its subject;
    doubt is its date, which may fall well after the entry''s window.

    '
- work: The Epistle of Barnabas
  author: barnabas
  locus: div2 6.2 under div1 'BARNABAS'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: assigned
  note: 'c. 70-135, general church. Already cited by pahc.source.barnabas. An Alexandrian
    provenance is often argued; alexandria-catechetical''s window opens c. 150, so it is not
    added here - a reviewer may want to.

    '
- work: Fragments of Papias
