- work: Against Heresies (Books I-V)
  author: irenaeus
  locus: div2 9.2-9.4, 9.6-9.7 under div1 'IRENAEUS'
  atlas_ids:
  - post-apostolic-house-church
  role: tradition
  confidence: assigned
  note: 'Irenaeus of Lyons, c. 180, disciple of Polycarp and heir of the Asia Minor churches.
    Already cited by pahc.source.irenaeus-adversus-haereses. Its heresiological face is carried
    by separate context entries below; one work legitimately serves both (§6.1).

    '
- work: Against Heresies (Books I-V)
  author: irenaeus
  locus: div2 9.2-9.4, 9.6-9.7 under div1 'IRENAEUS'
  atlas_ids:
  - valentinian-and-other-gnostic-christianities
  - marcion-marcionism
  role: context
  confidence: assigned
  note: 'The corpus''s principal heresiological witness to both entries: Book I is the fullest
    surviving description of Valentinian systems, and Marcion is treated directly (I.27, III
    passim; 59 ''Marcion'' hits in the file). role: context because Irenaeus describes these
    movements from outside rather than speaking as one - a built world may draw this only
