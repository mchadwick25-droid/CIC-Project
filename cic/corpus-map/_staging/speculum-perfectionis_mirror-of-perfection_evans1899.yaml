  speculum-perfectionis:
    kind: anonymous
    evidence: >-
      The Speculum perfectionis is an anonymous compilation of recollections of Francis. The title page of this
      English translation attributes it to Brother Leo, which is Sabatier's attribution and contested. The ruling
      here is anonymous.
