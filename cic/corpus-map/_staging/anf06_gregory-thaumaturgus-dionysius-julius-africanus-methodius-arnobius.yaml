# The most fragmentary volume in the corpus: seventeen DC.Creator slugs, many
# represented only by fragments. Word counts from STRUCTURE.md guided which
# sections are substantive.
#
# JULIUS AFRICANUS ATTRIBUTION CHECKED (per group instruction): this is NOT a
# CCEL metadata omission. anf06's own header carries
# <DC.Creator scheme="ccel" sub="Author">juliusafricanus</DC.Creator>, and the
# div1 "Julius Africanus." is his section. AUTHORS.md lists the div1 as
# unattributed only because corpus_authors.py's title-to-slug matcher could not
# map "Julius Africanus." to the unseparated slug "juliusafricanus". The slug
# is in AUTHORS.md, so it is used directly; no authors_ruled entry is needed.
#
# RECURRING SHELF PROBLEMS in this volume, all flagged needs-ruling rather
# than forced:
#   - 3rd-c. Pontus (Gregory Thaumaturgus): no census entry; the Cappadocian
#     entry (c. 360-380s) venerates him as its forerunner and is used as the
#     shelf.
#   - 3rd-c. Palestine (Julius Africanus): no census entry; shelved with
#     alexandria-catechetical on the strength of the Origen connection.
#   - 3rd-c. Antioch (Malchion / Paul of Samosata): no census entry; the
#     Antiochene entry is Chrysostom-centered, c. 350-430.
#   - Pre-Nicene Anatolian asceticism (Methodius): no census entry.
#
# Skipped as apparatus: title pages, introductory notices/notes, elucidations,
# the two editor notes in the Dionysius and Peter sections, general notes, and
# the indexes.
