    through ATHANASIUS quoting him in post-Nicene anti-Arian polemic (De Decretis 25; Ep. 4
    ad Serapionem 11), which carries its own selection screen. He is also a disciple of Origen
    (ANF6, from Photius), so he cannot lift the Origen SYSTEMIC screen.

