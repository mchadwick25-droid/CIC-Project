- work: Canonical Epistle
  author: gregory_thau
  locus: div3 under 3.3 'Acknowledged Writings'
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: tradition
  confidence: provisional
  note: 'Added 2026-09-09. A second row rather than an extra atlas_id on the row above, matching
    the shape this file already uses for The Oration and Panegyric Addressed to Origen: the two
    assignments carry different confidences and a single row cannot. Provisional for the same
