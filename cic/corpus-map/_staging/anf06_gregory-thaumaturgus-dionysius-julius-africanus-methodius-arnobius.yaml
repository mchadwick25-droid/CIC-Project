assignments:
- work: The Oration and Panegyric Addressed to Origen
  author: gregory_thau
  locus: div3 under 3.3 'Acknowledged Writings'
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'A student''s firsthand account of Origen''s school and teaching method - the best
    inside evidence of the catechetical tradition''s pedagogy that exists (delivered at Caesarea,
    but the school is Origen''s). Pairs with Origen''s Letter to Gregory in anf04.

    '
- work: The Oration and Panegyric Addressed to Origen
  author: gregory_thau
  locus: div3 under 3.3 'Acknowledged Writings'
  atlas_ids:
  - cappadocian-nicene-pastoral-monastic-tradition
  role: tradition
  confidence: provisional
  note: 'Gregory Thaumaturgus is the Cappadocian tradition''s venerated forerunner - Basil''s
    family Christianity descends from his Pontic mission, and Gregory of Nyssa wrote his Life.
    Assigned there as inherited tradition; provisional because he predates the entry''s 360-380s
    range by a century.

    '
