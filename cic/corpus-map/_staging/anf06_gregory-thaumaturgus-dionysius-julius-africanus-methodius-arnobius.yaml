- row_id: anf06_gregory-thaumaturgus-dionysius-julius-africanus-methodius-arnobius--oration-concerning-simeon-and-anna
  work: Oration Concerning Simeon and Anna
  author: methodius
  locus: div2 11.8
  atlas_ids:
  - anatolian-church-third-century
  - apocryphal-and-pseudepigraphal-literature
  role: tradition
  confidence: assigned
  note: 'Festal oration for the Meeting in the Temple, widely regarded as later than Methodius
    (the feast''s development postdates him). Shelved with his section, in anatolian-church-third-century,
    with apocryphal-and-pseudepigraphal-literature alongside for the pseudonymous character.
    Worth noting for whoever revisits it: the Sectional Confession is widely held an Apollinarian
    production, and apollinarian-christianity now exists to receive it if the bundle is ever
    split. On whether a spurious corpus files under the attributed name at all: this is one
    of nine works across six entries asking the same underlying question, resolved under a
    single principle rather than one by one. IT DOES, AND IT ALSO FILES AS WHAT IT IS. Brief
    6.2 says derive from the markup rather than re-attribute from outside knowledge, so the
    transmitted-author shelf stands: that is how the corpus presents it and how a reader will
    look for it. And apocryphal-and-pseudepigraphal-literature is added, because a work circulating
    under a name that is not its author''s is a pseudepigraphon by definition. The two together
    say the whole truth - where it sits, and what it is - without re-attributing anything.
    The spurious corpora could instead be detached from their attributed authors in a future
    pass, if that reading is preferred.'
