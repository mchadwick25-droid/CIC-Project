    holds the volume''s two other Thaumaturgus works; this one was the gap. Kept alongside the
    anatolian-church-third-century row, not moved - non-exclusive by default per the corpus-map
    README.
'
- work: Dubious or Spurious Writings of Gregory Thaumaturgus (Sectional Confession of Faith;
    On the Trinity; Twelve Topics on the Faith; On the Subject of the Soul; Four Homilies;
    On All the Saints; On the Gospel According to Matthew)
  author: gregory_thau
  locus: div2 3.4 - assigned as one body
  atlas_ids:
  - anatolian-church-third-century
  - apocryphal-and-pseudepigraphal-literature
  role: tradition
  confidence: assigned
  note: 'CCEL''s own heading marks the body dubious or spurious; several pieces are much later
    (the Sectional Confession is widely held an Apollinarian production). Needs a ruling on
    whether a spurious corpus files under the attributed name at all. Re-pointed 2026-08-26
    to anatolian-church-third-century, with apocryphal-and-pseudepigraphal-literature alongside
    for the pseudonymous character. STILL `needs-ruling`: whether a spurious corpus files
    under the attributed name at all is an attribution ruling no new entry answers. The Sectional
    Confession is widely held an Apollinarian production, and apollinarian-christianity now
    exists to receive it if the bundle is ever split. RULED 2026-08-26, under a principle
    rather than one by one - nine works across six entries were asking the same question,
    whether a spurious corpus files under the attributed name at all. IT DOES, AND IT ALSO
    FILES AS WHAT IT IS. Brief 6.2 says derive from the markup rather than re-attribute from
    outside knowledge, so the transmitted-author shelf stands: that is how the corpus presents
    it and how a reader will look for it. And apocryphal-and-pseudepigraphal-literature is
    added, because a work circulating under a name that is not its author''s is a pseudepigraphon
    by definition. The two together say the whole truth - where it sits, and what it is -
    without re-attributing anything. Mark can reverse this in one pass if he wants the spurious
    corpora detached from their attributed authors instead.'
- work: Extant Fragments of Dionysius of Alexandria (works and epistles)
