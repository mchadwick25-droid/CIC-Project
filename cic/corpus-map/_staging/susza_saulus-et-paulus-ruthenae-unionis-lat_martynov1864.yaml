  note: A Uniate bishop's life of the man who wrote the Orthodox Threnos (1610) and then joined the union,
    first printed in the seventeenth century (the title page names the author as Susza) and here in the
    1864 edition 'emendatior et auctior'. The editor's additions are not separated in this file, so quotes
    need the page images and a check against the earlier edition. Union-side advocacy; Latin only; primary
    for how the union told Smotryc'kyj's turn.
