assignments:
  - row_id: scher_notice-manuscrits-syriaques-patriarcat-chaldeen-mossoul-fra_1907--colophons-of-the-sixteenth-century
    work: "Notice sur les manuscrits syriaques du Patriarcat chaldéen de Mossoul (Scher, 1907): the colophons of 1521 to 1588"
    author: scher
    locus: "Cod. 80 (1550, Rabban Hormezd, 'Mar Siméon patr. et Mar Elia héritier du siège') at file lines 1278-1279; the Nomocanon note of 1564 at Amid 'du temps de Mar Abdisô' patr.' at 1072; the note on the death of Mar Abdisho (1570) at 1044; Gazarta 1578 at 884; Abnâyé 1588 at 412; the 1567 copy with the patriarch's name effaced at 1750; the 1521 copy at Ahtous at about 1199"
    atlas_ids:
      - church-of-the-east-schism-of-1552
    role: tradition
    confidence: provisional
    note: >
      Dated colophons from the Chaldean patriarchate's library at Mosul, summarised in French by the 1902
      visitor. They name the patriarch of the day in the years around the schism (the heir to the see in 1550,
      Abdisho in 1564 at Amid, Elia in 1578 and 1588). These are the "colophons" the census names as the thin
      base of the entry, from the manuscripts themselves. The catalogue does not say which line each patriarch
      belongs to, so which colophon belongs to which side is for the build to settle; hence provisional. OCR
      clean; ready to quote once each quote is checked against the page image.
