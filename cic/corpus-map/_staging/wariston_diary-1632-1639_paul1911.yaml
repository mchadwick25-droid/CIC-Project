    note: >
      The first-person conscience the census asks for: a young lawyer's
      night-long prayers and self-examination after his wife's death, then
      the diary of the man who drafted the National Covenant, kept day by day
      through the Prayer Book riots, the signing in Greyfriars, and the
      Glasgow Assembly. Phonetic Scots spelling kept by the editor. Primary
      voice, ready to quote once checked against the page image; OCR sampled
      clean. The 1639 diary and the 1650-1654 diary are separate Scottish
      History Society volumes (1896 and later), verified leads, not vendored.
