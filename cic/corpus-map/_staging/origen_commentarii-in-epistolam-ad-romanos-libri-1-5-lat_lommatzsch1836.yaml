    note: >
      ORIGINAL-LANGUAGE WITNESS (Latin, with Lommatzsch's Latin notes), the
      only rights-clean text of this work; the English translations are in
      copyright. The Latin is Rufinus's translation, which his own preface
      (npnf203) says abridged a Greek commentary of fifteen volumes into ten
      books, so it is Origen as Rufinus gave him, not Origen verbatim. Any
      record that cites it must say so and must render the English itself,
      labelled as a rendering. Origen's own work, so tradition for the world
      whose catechetical school he led.

