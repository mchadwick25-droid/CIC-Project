    note: >
      The Swedish Reformation's leading preacher and writer in his own
      sixteenth-century Swedish, edited in 1914 with Westman's introductions.
      Includes the replies to the Catholic clergy of 1527 and the tracts of
      1528 that set out the evangelical teaching before the Diet of Vasteras
      settled the church's property. Primary voice, OCR clean in the sampled
      pages; ready to quote once each quote is verified against the page image.
      No public-domain English translation of these tracts was found.
