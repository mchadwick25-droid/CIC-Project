  - work: "Lausiac History"
    author: palladius
    locus: "Chapters XLVIII-LIV: Elpidius, Sisinnius, Gaddanas, Elias, Sabas,
      Abramius, and the Elder Melania"
    atlas_ids:
      - palestinian-ascetic-monasticism-early
    role: tradition
    confidence: provisional
    note: >
      Surfaced during the source-readiness dossier pass on I.34,
      not by a build thread's own search - added directly
      per this candidate's own dossier §2 and the Ambrosian-Milan/Theodoret
      precedent for a dossier-found cross-link. Checked directly against
      the vendored text, not assumed from a title or a summary: Ch. XLVIII
      (Elpidius) is set "in the caves of the Amorites round about Jericho,"
      with Palladius himself an eyewitness participant ("I too lived with
      him") for twenty-five years; Ch. XLIX (Sisinnius) is his direct
      disciple; Ch. L (Gaddanas) names its subject directly, "an old
      Palestinian... in the region round the Jordan... region round the
      Dead Sea"; Ch. LI (Elias) is stated to dwell "in the same parts";
      Ch. LII (Sabas) is "a native of Jericho... the ascetics of the
      Jordan"; Ch. LIII (Abramius) sits in the same unbroken block with no
      contrary region marker; Ch. LIV (the Elder Melania) closes with her
      founding "a monastery in Jerusalem." Seven consecutive chapters, not
      a stray mention, and squarely inside this candidate's own region
      (Gaza, the Judean desert, Sinai road) and window (c. 330-450) -
      Palladius wrote c. 419-420 describing decades he lived through.
      `role: tradition` on the same footing as this candidate's existing
      Jerome entries (participant-observer material, not later external
      commentary); `provisional` because whether Doc_02's own gravity work
      treats an Egypt-centered author's testimony about neighboring
      Judean-desert monks as this movement's own voice, on the same
      footing as Jerome's Hilarion and Malchus, is a judgement this
      dossier pass is not positioned to make on its own.

