    atlas_ids:
      - alexandria-catechetical
    role: context
    confidence: assigned
    note: >
      Verified directly against the vendored file (line 211): "Among
      these was Didymus the blind author. I met him four times in all,
      visiting him at intervals during a period of ten years... He was
      blind, having lost his sight at the age of four, so he told me,
