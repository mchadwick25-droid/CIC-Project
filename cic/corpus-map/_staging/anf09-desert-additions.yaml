  note: 'ROLE IS `antecedent`: Caesarea, c. 245, before this world begins, and nobody here is shown
    reading it. Its use is comparative and is worth the row. Origen works Matthew 18:15 at length -
    whether correction applies to all sins or only grave ones, whether a man who sins greatly is a
    brother at all - and then objects to his own conclusion, that expelling a man after three
    censures for reviling or over-drinking "would seem to be very harsh". Set that beside Abba
    Moses arriving at the council with a leaking jug and refusing to judge at all. Two ends of one
    tradition on one problem; this world had only the desert end.

    BOOK XV IS NOT IN THIS VOLUME. Origen on Matthew 19:12 and the eunuchs for the kingdom - the
    passage a world about celibacy would most want - is absent, and no record may reach for it.

    '
