    work: "The Apology of the Church of England (Apologia Ecclesiae Anglicanae, 1562), Lady Anne Bacon's translation of 1564"
    author: jewel
    locus: "Morley's introduction from file line 68; the Apology from line 149 ('PART I.') through 'PART VI.' at line 2712 and 'THE RECAPITULATION OF THE APOLOGY' at line 3556; the Project Gutenberg licence follows from about line 3697"
    atlas_ids:
      - the-english-reformation-and-elizabethan-settleme
    role: tradition
    confidence: assigned
    note: >
      The Elizabethan church's official self-defence to Europe, in the English
      that was chained in parish churches beside the Bible: its argument is that
      the English church has left the Roman errors and returned to the apostles
      and the old catholic fathers. Primary voice, a
      clean transcription (not OCR), ready to quote once verified against this
      file. Translation only; the Latin original is not vendored, so a quote is
      Lady Bacon's English, not Jewel's Latin.

