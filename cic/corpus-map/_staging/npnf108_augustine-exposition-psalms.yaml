    note: >
      Preached and dictated expositions spanning c. 392-420, most delivered
      to congregations at Hippo and Carthage. Per brief section 6.5 what is
      assigned is Augustine's exegesis, which is his work; the Psalter itself
      is not in the corpus. Anti-Donatist polemic surfaces in a number of
      expositions (a few dozen mentions across 695k words) but is diffuse,
      so no donatism id is claimed for the body.
