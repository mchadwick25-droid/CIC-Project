    note: >
      The archbishop's history of the years in which James VI restored bishops:
      the episcopal party's own voice on the Aberdeen Assembly, the banishment of
      the Melvilles, the Perth Articles. Needs-ruling on role: the first-pass
      dossier called Spottiswood the outside witness (context), but he was primate
      of the Church of Scotland and this is the Kirk's own voice in its episcopal
      phase, exactly as the first pass placed the Rescinded Acts of 1606-1618 as
      tradition. Whether the world's Representative speaks for the Kirk that
      included its bishops, or for the presbyterian Kirk that rescinded them, is
      for Doc_01 and Doc_04. Primary voice either way, clean OCR, ready to quote
      once verified against this file; the editors' notes are not his words.
