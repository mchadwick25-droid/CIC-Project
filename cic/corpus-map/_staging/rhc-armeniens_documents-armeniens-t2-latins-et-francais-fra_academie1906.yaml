  note: 'The last years of the Cilician kingdom as Latin and French writers record them: Dardel was Levon
    V''s confessor and secretary and his chronicle runs to mid-1384; the Responsio answers Latin charges
    of error against the Armenians; Hayton''s Flor (1307) carries the crusade and Mongol policy of the
    Cilician court. The Armenian church speaks only through these intermediaries. Read at the headings;
    the texts themselves were sampled.'
