# Worker notes, 2026-08-26.
#
# CCEL DC.Creator for this volume: commodian, felix, origen, tertullian. ANF
# div1s are author sections: 3 Tertullian Part Fourth, 4 Minucius Felix,
# 5 Commodianus, 6 Origen. The unattributed div1 "Introductory Notice." in
# AUTHORS.md is the editors' notice (718 words) - apparatus, skipped.
#
# Montanist-phase calls for the Tertullian treatises are DERIVED from the text,
# not asserted: per-treatise counts of Paraclete / New Prophecy / Psychics /
# Montanus were grepped. On Monogamy (17 Paraclete, 12 Psychics), On Fasting
# (7/13), On Modesty (4/5) are unambiguous; On the Veiling of Virgins (4
# Paraclete) and Exhortation to Chastity (cites "the holy prophetess Prisca")
# are marked provisional; De Fuga shows no direct marker (only "Comforter" x2),
# so its montanism assignment is provisional on external dating.
#
# Skipped as apparatus: title pages, introductory notices, the 6.3 "Prefatory
# Notice" (635 words, translator's), and the indexes.
#
# Rufinus' Prologue (6.4) is kept: it is the ancient translator's own preface,
# a primary document of the Origenist controversy, not 19th-c. editorial matter.
source_file: anf04_tertullian4-minucius-felix-commodian-origen1-2.xml
assignments:
- work: On the Pallium (De Pallio)
  author: tertullian
  locus: div2 3.2 - On the Pallium
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: assigned
  note: 'Short personal apologia for adopting the philosopher''s cloak; Carthage. No Montanist
    markers in the text.

    '
- work: On the Apparel of Women (De Cultu Feminarum)
  author: tertullian
  locus: div2 3.3 - On the Apparel of Women
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: assigned
  note: 'Disciplinary treatise on dress and adornment; no New Prophecy markers in the text.

    '
- work: On the Veiling of Virgins (De Virginibus Velandis)
  author: tertullian
  locus: div2 3.4 - On the Veiling of Virgins
  atlas_ids:
  - latin-apologists
  - montanism-the-new-prophecy
  role: tradition
  confidence: provisional
  note: 'Appeals to the Paraclete four times as authority for stricter discipline; commonly
    dated to Tertullian''s New Prophecy period. The montanism assignment rests on those internal
    appeals - provisional because the work never names the movement.

    '
- work: To His Wife (Ad Uxorem)
  author: tertullian
  locus: div2 3.5 - To His Wife
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: assigned
  note: 'Two books to his wife on remarriage; earlier, pre-Montanist discipline. No New Prophecy
    markers in the text.

    '
- work: On Exhortation to Chastity (De Exhortatione Castitatis)
  author: tertullian
  locus: div2 3.6 - On Exhortation to Chastity
  atlas_ids:
  - latin-apologists
  - montanism-the-new-prophecy
  role: tradition
  confidence: provisional
  note: 'Cites an oracle of "the holy prophetess Prisca" as authority - a direct New Prophecy
    citation, and one of the few surviving fragments of the movement''s own words. Provisional
    because the treatise is transitional rather than openly sectarian.

    '
- work: On Monogamy (De Monogamia)
  author: tertullian
  locus: div2 3.7 - On Monogamy
  atlas_ids:
  - latin-apologists
  - montanism-the-new-prophecy
  role: tradition
  confidence: assigned
  note: 'Openly New Prophecy: 17 appeals to the Paraclete, opponents named "Psychics" 12 times.
    Tertullian speaking as a Montanist adherent - tradition for montanism, not description
    of it.

    '
- work: On Modesty (De Pudicitia)
  author: tertullian
  locus: div2 3.8 - On Modesty
  atlas_ids:
  - latin-apologists
  - montanism-the-new-prophecy
  role: tradition
  confidence: assigned
  note: 'Montanist-period attack on the bishop''s edict admitting adulterers to penance ("Psychics"
    x5, Paraclete x4). Also a key early witness to the developing penitential discipline the
    Cyprianic and Donatist disputes later fought over - noted here, not assigned there.

    '
- work: On Fasting, in Opposition to the Psychics (De Jejunio)
  author: tertullian
  locus: div2 3.9 - On Fasting
  atlas_ids:
  - latin-apologists
  - montanism-the-new-prophecy
  role: tradition
  confidence: assigned
  note: 'Defense of the New Prophecy''s fasting discipline against the "Psychics" (x13); names
    Montanus. Among the most explicitly Montanist works in the corpus.

    '
- work: De Fuga in Persecutione (Flight in Persecution)
  author: tertullian
  locus: div2 3.10 - De Fuga in Persecutione
  atlas_ids:
  - latin-apologists
  - montanism-the-new-prophecy
  role: tradition
  confidence: provisional
  note: 'Forbids flight in persecution on the Spirit''s authority ("Comforter" x2); no explicit
    Paraclete/Psychici vocabulary in this translation, so the montanism assignment rests on
    the rigorist position and standard dating rather than internal markers - hence provisional.

    '
- work: Appendix of poems ascribed to Tertullian (Strains of Jonah, Sodom, Genesis, the Judgment;
    Five Books in Reply to Marcion)
  author: tertullian
  locus: div2 3.11 - Appendix (five verse pieces, div3s)
  atlas_ids:
  - latin-apologists
  - apocryphal-and-pseudepigraphal-literature
  role: tradition
  confidence: assigned
  note: 'STRUCTURE.md marks this div2 as apparatus, but the content is ancient pseudo-Tertullianic
    Latin verse, not 19th-c. editorial matter - kept rather than dropped. The "Five Books
    in Reply to Marcion" (Carmen adversus Marcionitas) belongs with the anti-Marcionite material.
    Needs a ruling on whether spurious verse files under tertullian at all, and where non-Marcion
    pieces belong. RULED 2026-08-26, under a principle rather than one by one - nine works
    across six entries were asking the same question, whether a spurious corpus files under
    the attributed name at all. IT DOES, AND IT ALSO FILES AS WHAT IT IS. Brief 6.2 says derive
    from the markup rather than re-attribute from outside knowledge, so the transmitted-author
    shelf stands: that is how the corpus presents it and how a reader will look for it. And
    apocryphal-and-pseudepigraphal-literature is added, because a work circulating under a
    name that is not its author''s is a pseudepigraphon by definition. The two together say
    the whole truth - where it sits, and what it is - without re-attributing anything. Mark
    can reverse this in one pass if he wants the spurious corpora detached from their attributed
    authors instead.'
