- row_id: anf04_tertullian4-minucius-felix-commodian-origen1-2--the-octavius-of-minucius-felix
  work: The Octavius of Minucius Felix
  author: felix
  locus: div2 4.3 - The Octavius of Minucius Felix
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: assigned
  note: 'Earliest surviving Latin apologetic dialogue (Rome/Ostia, late 2nd-3rd c.). latin-apologists
    (I.43) was minted for this gap, on the I.35 precedent - the Greek apologists had
    been registered on the same reasoning and the Latin case had simply never been made. Note kept for
    later use: the first half, Caecilius'' speech, is one of the fullest surviving statements of the pagan
    case against Christians - strong context value even though the work itself is Christian.


    '
  locus_ids:
  - div2:iv.iii
  - div3:iv.iii.i..iv.iii.xlii (42 divisions)
  language: eng
  date:
    start: 160
    end: 250
    source: 'Monceaux 1901 I; Harnack 1904 (not written in the second century; possibly under Alexander Severus, more probably between Maximinus Thrax and Decius); Schanz-Hosius-Krueger 1922 (declines to choose); ANF04 notices (Coxe c. 205-230; Wallis gives both conditionals); window as first recorded: c. 160-192 or c. 200-250; no single date can be given; Two poles. Pole A lies before Tertullian''s Apology and outside the window; pole B lies after it and inside the window.'
    formation_confidence: Contested
