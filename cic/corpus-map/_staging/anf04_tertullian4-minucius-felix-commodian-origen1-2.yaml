- work: The Octavius of Minucius Felix
  author: felix
  locus: div2 4.3 - The Octavius of Minucius Felix
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: assigned
  note: 'Earliest surviving Latin apologetic dialogue (Rome/Ostia, late 2nd-3rd c.). RULED 2026-08-27:
    latin-apologists (I.43) was minted for this gap, on the I.35 precedent - the Greek apologists had
    been registered on the same reasoning and the Latin case had simply never been made. Note kept for
    later use: the first half, Caecilius'' speech, is one of the fullest surviving statements of the pagan
    case against Christians - strong context value even though the work itself is Christian.


    '
- work: The Instructions of Commodianus (Instructiones)
  author: commodian
  locus: div2 5.2 - The Instructions of Commodianus
  atlas_ids:
  - latin-apologists
  role: tradition
  confidence: provisional
  note: 'Latin Christian acrostic verse instruction, moved to latin-apologists 2026-08-27 with the rest
    of the Latin apologetic body. PROVISIONAL, NOT ASSIGNED, and the reason is the date rather than the
    shelf: proposals run from the 3rd century to the 5th, and only the early ones put him inside this
    entry''s window. The entry is right if the usual 3rd-c. North African dating holds and wrong if the
    5th-c. Gallic one does. Nothing in the corpus settles it.


    '
- work: De Principiis (On First Principles)
  author: origen
  locus: div2 6.5 - Origen De Principiis
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'Origen''s systematic work, the charter text of the Alexandrian Christian-Platonist
    tradition. Vendored text is chiefly Rufinus'' Latin translation with Greek fragments in
    parallel where they survive.

    '
- work: Prologue of Rufinus (to De Principiis)
  author: rufinus
  locus: div2 6.4 - Prologue of Rufinus
  atlas_ids:
  - alexandria-catechetical
  - hieronymian-ascetic-literary
  role: tradition
  confidence: provisional
  note: 'The ancient translator''s own preface, in which Rufinus defends his smoothing of
    De Principiis and cites Jerome''s earlier admiration of Origen - a primary document of
    the Origenist controversy between them. Assigned to Alexandria as part of the De Principiis
    transmission and to the Hieronymian entry whose central quarrel it ignited.

    '
- work: A Letter to Origen from Africanus About the History of Susanna
  author: juliusafricanus
  locus: div2 6.6
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: provisional
  note: 'Africanus'' critical letter questioning the authenticity of Susanna, which opens
    the exchange answered in div2 6.7. Kept with the Origen correspondence it belongs to;
    Julius Africanus himself (3rd-c. Palestinian scholar) has no census home - see his anf06
    section.

    '
- work: A Letter from Origen to Africanus
  author: origen
  locus: div2 6.7
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'Origen''s reply defending the church''s Greek Old Testament - a prime document of
    Alexandrian textual scholarship.

    '
- work: A Letter from Origen to Gregory
  author: origen
  locus: div2 6.8
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'To Gregory Thaumaturgus, urging him to turn Greek learning to Scripture ("spoiling
    the Egyptians"). Pairs with Gregory''s Panegyric to Origen in anf06 - the two sides of
    the same teacher-student relationship.

    '
- work: Origen Against Celsus (Contra Celsum)
  author: origen
  locus: div2 6.9 - Origen Against Celsus (8 books, ~255k words)
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'Origen''s own work, tradition for his entry. FLAG for Mark per brief S11a: Celsus''
    True Word survives only in the extensive quotations Origen answers here, and those quotations
    are the corpus''s fullest pagan critique of 2nd-c. Christianity - exactly the "how Christians
    were seen from outside" material the context ruling covers. If a role: context assignment
    is wanted for the embedded Celsus material (and for which entry it surrounds - the Christianity
    Celsus attacked c. 177 predates Alexandria''s floruit), that needs a ruling; it is not
    claimed here because the vendored work is Origen''s.

    '
