  - work: "The Orthodox Confession of the Catholic and Apostolic Eastern Church (Confessio Orthodoxa), English version"
    author: mogila
    locus: "Part I (Faith) from file line 472, Part II (Hope) from 4036, Part III (Charity) from 5444; Robertson's notice (line 107) and Overbeck's preface (line 145) are editorial"
    atlas_ids:
      - orthodoxy-under-the-ottomans-parish-millet-and-n
    role: tradition
    confidence: assigned
    note: >
      Peter Mogila's catechism-confession (1640), approved by the Synod of Jassy and the four
      Patriarchs and reaffirmed at Jerusalem in 1672, in an English version first published
      1762 and lightly modernised by Overbeck's own account. English translation only; the
      Greek and Latin text is in Kimmel 1850. Primary for the Orthodox Confession's doctrine
      as an English rendering, second witness for exact wording (the translation is not from
      the Greek in front of us, and it has been edited).
