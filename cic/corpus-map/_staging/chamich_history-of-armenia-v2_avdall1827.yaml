    work: "History of Armenia (Chamich; Avdall's English translation, 1827), volume II, Part VII: the Persian conquest, the expatriation and New Julfa"
    author: chamich
    locus: "Part VII chapters VI-IX and after: the pontificates of David V, Melchizedek and Srapion (about file line 16240), the invasion by Shah Abas (line 16342), the expatriation (chapters VIII-IX), the founding of New Julpha (line 16905), the later catholicoi and the churches of Julpha (lines 17005-17690)"
    atlas_ids:
      - armenian-christianity-new-julfa
    role: context
    confidence: assigned
    note: >
      The English translation of an eighteenth-century Armenian priest-historian's account of
      the Persian conquest and the expatriation, with the catholicoi of Etchmiadzin by name.
      A late secondary history from native sources, not a voice from the period, but the
      only English-language Armenian-church narrative of the window in clean enough OCR to
      read. The invasion chapter and the New Julpha passage were read; the rest was
      sampled. The OCR carries errors in names; check each quotation against the page
      image. The English is Avdall's rendering, not the Armenian original.
