  note: 'The nearest public-domain witness to the canonisation process of 1604-1610 that the census names:
    a summary drawn, by its title, from the authentic processes, by the Rota judge deputed for the cause,
    printed at Rome in the canonisation year. Not the process itself, which is unprinted. Legible OCR with
    the long s read as f and noise on the preliminaries; quote only after checking the page image.'
