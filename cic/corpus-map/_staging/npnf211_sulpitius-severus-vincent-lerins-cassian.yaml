- work: On the Life of St. Martin
  author: sulpiciusseverus
  locus: div2 2.2 — On the Life of St. Martin
  atlas_ids:
  - gallic-monastic-ascetic-christianity
  role: tradition
  confidence: assigned
  note: 'The Western counterpart of the Vita Antonii - hagiography as monastic evidence, written
    c. 397 in Aquitaine while Martin still lived. The doubt is structural: the census has
    no Gallic entry before merovingian-gallic-christianity (c. 480-620), which the Martin
    cult founds but which this work antedates by nearly a century. Mark to rule whether pre-Merovingian
    Gaul (Martin, Sulpitius, Lerins, Cassian''s Marseilles) files forward into that entry
    or needs an entry of its own. Re-pointed 2026-08-26: the Gallic gap this flagged is closed
    - gallic-monastic-ascetic-christianity (era 2, c. 360-450) was added to the census on
    record, and this work now names it rather than the Merovingian entry it antedates.'
