authors_ruled:
  sulpiciusseverus:
    kind: metadata-omission
    evidence: 'div1 title "The Works of Sulpitius Severus."; npnf211 DC.Creator already lists
      `sulpiciusseverus` alongside cassian and vincent_lerins - the author extractor simply
      failed to match this div1 title to the slug, which is why AUTHORS.md records the section
