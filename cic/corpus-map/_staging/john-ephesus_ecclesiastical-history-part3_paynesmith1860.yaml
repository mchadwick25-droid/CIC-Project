    note: >
      John of Ephesus's own chronicle (a distinct genre from his Lives
      of the Eastern Saints, already assigned to this same atlas entry
      from the PO17-19 fascicules), running to 585 CE. This is the real
      Payne Smith 1860 English translation, at archive.org identifier
      ecclesiasticalhi00johnuoft, confirmed via its own preface and its
      own account of Cureton's 1853 Syriac-only publication. A
      different identifier, thirdpartofeccl00john1860, is sometimes
      cited for this work but is actually Cureton's 1853 Syriac-only
      critical edition (confirmed unusable here by its own garbled
      non-Latin-script OCR) - do not use it for this work without
      re-verifying it first.
