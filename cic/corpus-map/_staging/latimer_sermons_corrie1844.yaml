    note: >
      The most quoted preaching voice of the English Reformation, plain, comic and
      fierce: the Plough sermon on the preacher's work and the devil's diligence,
      the court sermons against covetousness and the enclosing landlords, the
      homely Lincolnshire sermons for country congregations. Primary voice, ready to
      quote once verified against this file; Corrie's footnotes give the 1549 and
      1562 printings' variants.
