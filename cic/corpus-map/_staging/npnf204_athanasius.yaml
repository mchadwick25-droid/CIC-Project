# Worked example: two real works, both already vendored and already
# cited by the worlds they are assigned to. Nothing here is invented.
# One staging file per source volume; a worker owns its file and no
# other, which is why parallel assignment cannot race. The rest of the
# volume's works are assigned below the seeded Vita Antonii entry,
# which is unchanged. The 86,682-word Prolegomena (div1 5), all
# per-work Introductions, Excursus and indexes are nineteenth-century
# apparatus and are skipped.
source_file: npnf204_athanasius-select-works-letters.xml
authors_ruled:
  historia_acephala:
    kind: anonymous
    evidence: 'div3 title "The Historia Acephala" under div1 25 "Letters of Athanasius with
      Two Ancient Chronicles of His Life"; the section''s own introduction describes it as
      one of "two almost contemporary chronicles" transmitted anonymously with the letter
      collection. npnf204 DC.Creator lists only athanasius, and the chronicle is about him,
      not by him.

      '
assignments:
- row_id: npnf204_athanasius--vita-antonii-life-of-antony
  work: Vita Antonii (Life of Antony)
  author: athanasius
  locus: div1 'Life of Antony'
  atlas_ids:
  - desert-monasticism
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'The single most influential text about the desert world, written from outside it
    by a bishop who was not a desert participant. Assigned to desert as primary evidence AND
    to Alexandria as its author''s own work - assignment is not exclusive, and an exclusive
    partition would strip desert of its evidential base. 43 desert records already cite it.

    '
- row_id: npnf204_athanasius--against-the-heathen-contra-gentes
  work: Against the Heathen (Contra Gentes)
  author: athanasius
  locus: div1 6 — Contra Gentes
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'First half of the early apologetic diptych: refutation of paganism and ascent of
    the soul to knowledge of God through the Logos - Alexandrian Christian-Platonism in full
    voice.

    '
- row_id: npnf204_athanasius--on-the-incarnation-of-the-word-de-incarnatione
  work: On the Incarnation of the Word (De Incarnatione)
  author: athanasius
  locus: div1 7 — On the Incarnation of the Word
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: assigned
  note: 'Second half of the diptych and the classic statement of Alexandrian incarnational
    theology. Brief §3 marks imperial-juridical-christianity as ''arguably'' a second home;
    not asserted here - the work predates the Constantinian entanglement of the later corpus.

    '
- row_id: npnf204_athanasius--deposition-of-arius-depositio-arii-with-alexander-s
  work: Deposition of Arius (Depositio Arii, with Alexander's Encyclical)
  author: athanasius
  locus: div1 8 — Deposition of Arius
  atlas_ids:
  - alexandria-catechetical
  role: tradition
  confidence: provisional
  note: 'One of the earliest documents of the Arian controversy (Alexandria, 320/321). Formally
    Alexander of Alexandria''s act; the volume''s own introduction argues (with Newman) that
    Athanasius, then Alexander''s secretary, drafted the Encyclical, and CCEL''s metadata
    credits only athanasius - hence the attribution, held provisional. Assigned also to the
    homoian doctrinal-floor entry as founding documentary evidence about the Arian party from
    its opponents.

    '
