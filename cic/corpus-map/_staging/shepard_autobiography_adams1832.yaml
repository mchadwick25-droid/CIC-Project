    note: >
      The Cambridge, Massachusetts minister's own account of his
      conversion at Emmanuel College, his silencing by Laud, his flight
      and the crossing of 1635, printed in his spelling from the
      manuscript. The census names Shepard's conversion-narrative
      material as a first-tier source; this is his own narrative, not
      the congregation's relations (those, in the McGiffert and
      Selement-Woolley editions, are in copyright; see the dossier).
      Primary voice; OCR clean.
