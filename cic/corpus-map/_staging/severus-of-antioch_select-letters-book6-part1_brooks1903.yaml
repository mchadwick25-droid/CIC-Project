    note: >
      Severus of Antioch (c. 459-538), patriarch of Antioch 512-518 and
      the movement's foremost theologian, in his own words - real
      administrative and pastoral correspondence from a working patriarch
      and, after his 518 deposition, an exile writing to sustain a
      scattered communion. This is only the Sixth Book of his letters
      (123 letters survive of it); it is not his complete correspondence
      - see REGISTRY.yaml for what else exists and is not yet vendored.
