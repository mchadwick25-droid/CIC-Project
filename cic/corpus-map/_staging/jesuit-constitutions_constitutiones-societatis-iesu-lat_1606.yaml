    evidence: >
      The Constitutions were principally drafted by Ignatius of Loyola,
      but this printed edition's own title page presents the text as the
      Society's own corporate governing document, approved and issued by
      the order as a body (confirmed by Popes Paul III, Julius III, and
      Paul IV per the title page's own "Institutum... confirmatum"
      language) rather than as an individually authored work under
      Ignatius's own name. Used here as a collective-body slug, the same
      footing this file's own `authors_ruled` convention gives an
