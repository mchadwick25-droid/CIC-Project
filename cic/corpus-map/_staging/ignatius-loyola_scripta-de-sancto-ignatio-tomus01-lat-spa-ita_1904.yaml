  note: 'The earliest text of Ignatius''s Autobiography as Goncalves da Camara wrote it down from Ignatius''s
    own telling, in the Spanish and Italian of the manuscript, in a critical edition. It is the original
    for the vendored O''Conor English translation. The volume also holds Goncalves da Camara''s Memoriale,
    Lainez''s letter on Ignatius and Ribadeneira''s writings on him, which are the Society''s early accounts
    of its founder, not his own voice. The Latin of Codretto is not in this volume. Primary original evidence
    for the movement, quotable once each wording is checked against the page image: the scan is legible
    with occasional letter-level misreads. Word-form coverage against a clean Latin vocabulary is 0.59;
    the Spanish, Italian and Portuguese passages and the notes lower it, so the figure is a comparison
    across files and not a measure of accuracy.'
