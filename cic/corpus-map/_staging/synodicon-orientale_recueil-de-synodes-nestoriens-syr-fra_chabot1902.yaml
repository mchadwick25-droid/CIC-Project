source_file: synodicon-orientale_recueil-de-synodes-nestoriens-syr-fra_chabot1902.txt

authors_ruled:
  synodicon-orientale:
    kind: anonymous
    evidence: >
      The acts of the synods of the Church of the East, compiled as a collection in the
      ninth century; no individual author. Chabot is editor and translator (title page,
      file line 766), not the work's author. Same ruling shape as the council texts in
      the Mansi staging files.

assignments:
