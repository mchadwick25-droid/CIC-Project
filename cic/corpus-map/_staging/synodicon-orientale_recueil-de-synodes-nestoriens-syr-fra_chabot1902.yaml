    work: "Synodicon Orientale: the synods of Isaac (410), Yahbalaha (420) and Dadisho (424), Syriac text and French translation"
    author: synodicon-orientale
    locus: "Syriac from file line 1883 (synod of Isaac opens 1883, closes 3150; Yahbalaha 3173; Dadisho about 3497); French: synod of Isaac 16074-17925, Yahbalaha 17934, Dadisho 18551-19431"
    atlas_ids:
      - persian-church-of-the-east-early
    role: tradition
    confidence: provisional
    note: >
      Shared-Events Era 2 batch (worker C). Primary original-language voice: the Persian
      church's own synodal acts, with the Nicene creed as received (16819), the censure of
