    note: >
      Theodore Beza's own direct voice - a commentary/paraphrase on the
      Book of Job, opening with his own dedicatory epistle to Queen
      Elizabeth I, in a 1589 English translation (translator not named on
      this edition's own title page). A partial closure of Manifest G4:
      does not itself supply Beza's own letters or the Tabula
      praedestinationis (1555), which remain unacquired. This edition's
      OCR consistently misreads the period's long s as "f" (e.g.
      "faluation" for "salvation") - a disclosed artifact of this specific
      scan, not corrected in the vendored file per this corpus's standing
      practice for raw OCR.

