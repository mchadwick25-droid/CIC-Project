  note: 'Derived from the volume''s own markup rather
    than from a reading list: each letter is a div3 carrying n= and type="Letter", 168 of
    them, and the sub-corpora are cut by ADDRESSEE where the title names one (the Jerome
    exchange, exactly) and by keyword count where it does not, taking the natural break in
    the distribution rather than a chosen threshold. The four parts partition the 168 with
    no overlap. This part is exact: every letter whose title names Jerome, in both directions.
    `tradition` for BOTH entries deliberately - the exchange contains Jerome''s own letters,
    which are the Hieronymian world''s voice, and Augustine''s, which are the Latin pastoral
    world''s. A two-sided correspondence has voice on both sides. It is also the largest single
    thing in this volume after the Confessions.'
