- work: The Confessions
  author: augustine
  locus: div1 6 — The Confessions, esp. Books III-V
  atlas_ids:
  - manichaeism
  role: context
  confidence: provisional
  note: 'Books III-V are a firsthand account of nine years as a Manichaean auditor — testimony
    about the movement''s teachers (Faustus by name), cosmology and appeal that the doctrinal-floor
    entry has from almost no other Latin source. Provisional because it is testimony embedded
    in a Catholic conversion narrative, not a treatise about the movement; npnf104''s dedicated
    refutations could carry this bucket alone instead.

    Role normalised to `context` for the doctrinal-floor entry: this work describes that movement
    from outside rather than speaking as it, and the brief allows a built world to draw on
    floor material only as `register: etic`.'
- work: The Confessions
  author: augustine
  locus: div1 6 — The Confessions, esp. Books V-IX
  atlas_ids:
  - ambrosian-milan-standalone
  role: tradition
  confidence: provisional
  note: 'Books V-IX are the fullest surviving participant narrative of Ambrose''s Milan: his
    preaching, his silent reading, the basilica crisis, the finding of Gervasius and Protasius,
    Augustine''s baptism there in 387. Provisional because the evidence is concentrated in
    these books rather than the work''s center of gravity; included so the Milan entry does
    not lose its best eyewitness while npnf210 carries only Ambrose''s own side.

    '
- author: augustine
  work: 'Letters of St. Augustin: the Augustine-Jerome correspondence'
  atlas_ids:
  - hieronymian-ascetic-literary
  - latin-pastoral-congregational-christianity
  role: tradition
  confidence: assigned
  locus: div3 letters XXVIII, XXXIX, XL, LXVII, LXVIII, LXXI, LXXII, LXXIII, LXXV, LXXXI,
    LXXXII, CXXIII, CLXVI, CLXVII, CLXXII, CXCV, CCII (17 letters, ~52,892 words)
  note: 'Derived from the volume''s own markup rather
    than from a reading list: each letter is a div3 carrying n= and type="Letter", 168 of
    them, and the sub-corpora are cut by ADDRESSEE where the title names one (the Jerome
    exchange, exactly) and by keyword count where it does not, taking the natural break in
    the distribution rather than a chosen threshold. The four parts partition the 168 with
    no overlap. This part is exact: every letter whose title names Jerome, in both directions.
    `tradition` for BOTH entries deliberately - the exchange contains Jerome''s own letters,
    which are the Hieronymian world''s voice, and Augustine''s, which are the Latin pastoral
    world''s. A two-sided correspondence has voice on both sides. It is also the largest single
    thing in this volume after the Confessions.'
