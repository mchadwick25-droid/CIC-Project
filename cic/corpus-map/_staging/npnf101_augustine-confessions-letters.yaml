  atlas_ids:
  - pelagianism
  role: context
  confidence: assigned
  locus: div3 letters CXLVI, CXCI (2 letters, ~1,182 words)
  note: 'Derived from the volume''s own markup rather
    than from a reading list: each letter is a div3 carrying n= and type="Letter", 168 of
    them, and the sub-corpora are cut by ADDRESSEE where the title names one (the Jerome
    exchange, exactly) and by keyword count where it does not, taking the natural break in
    the distribution rather than a chosen threshold. The four parts partition the 168 with
    no overlap. One extraction bug was caught and fixed before any of this was written: the
    last letter''s span ran to end-of-file and swallowed the indexes, reading CCLXIX as 15,011
    words when it is 238. It had put a Pelagian sub-corpus of 16,193 words on the map that
    does not exist. WITH THAT FIXED THIS SUB-CORPUS IS ALMOST NOTHING: two letters, 1,182
    words - Letter CXLVI to Pelagius himself (204 words, cordial, before the controversy)
    and Letter CXCI to Sixtus. The original note assumed ''anti-Pelagian letters'' formed
    a real body inside this volume; measured, they do not. The substance is in npnf105, which
    is where the anti-Pelagian treatises are and where pelagianism draws 15 works from. Recorded
    because an absence someone expected is worth as much as a presence.'
- row_id: npnf101_augustine-confessions-letters--the-confessions-4
  work: The Confessions
  author: augustine
  locus: div1 6 — The Confessions, Book IX ch. 7 ONLY
  atlas_ids:
  - imperial-juridical-christianity
  role: context
  confidence: assigned
  note: 'Deliberately narrow, per this world''s own source record (ijc.source.augustine-confessions):
    only Book 9 ch. 7 is licensed - Augustine''s eyewitness account, as a young Milan rhetoric
    professor, of the 386 basilica standoff: the congregation''s vigil, the introduction of
    antiphonal hymn-singing "after the manner of the Eastern Church," and the finding of Gervasius
    and Protasius. Verified directly against the file: "after the manner of the Eastern Church,
    hymns and psalms should be sung" (line 13771), matching this world''s own quote record
    (ijc.quote.hymns-and-psalms-should-be-sung) verbatim.

    `role: context`, not `tradition`, per that source record''s own explicit Boundary Check ruling
    (legacy Registry rows 8/26): "Augustine''s formation, theology, and the rest of the Confessions
    belong to the Latin Pastoral-Congregational world... do not extend this license." This one
    passage is Native to ijc only as independent eyewitness corroboration of Ambrose''s own conduct
    in the standoff - "the only such corroboration this world''s record has for any of Ambrose''s
    own claims about his own confrontations" - not as a claim on the rest of the work.

    '
