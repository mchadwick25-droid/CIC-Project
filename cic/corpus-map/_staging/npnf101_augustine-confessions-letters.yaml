    CLXXIII (11 letters, ~54,523 words)
  note: 'Derived from the volume''s own markup rather
    than from a reading list: each letter is a div3 carrying n= and type="Letter", 168 of
    them, and the sub-corpora are cut by ADDRESSEE where the title names one (the Jerome
    exchange, exactly) and by keyword count where it does not, taking the natural break in
    the distribution rather than a chosen threshold. The four parts partition the 168 with
    no overlap. Cut at eight or more occurrences of the Donatist vocabulary (Donatist, Donatus,
    Circumcellion, Petilian, Emeritus, rebaptism), which is where the distribution breaks
    - the next letters down carry five and read as asides - plus Letter LXXVI, whose title
    addresses the Donatists as a body. Letter XCIII to Vincentius is the largest at 18,595
    words and carries 31 of the hits on its own. `context`, not `tradition`: Augustine is
    the Catholic opponent, per the role normalisation already applied to his anti-Donatist
    treatises.'
- author: augustine
  work: 'Letters of St. Augustin: the Pelagian correspondence'
  atlas_ids:
  - pelagianism
  role: context
  confidence: assigned
  locus: div3 letters CXLVI, CXCI (2 letters, ~1,182 words)
  note: 'Derived from the volume''s own markup rather
    than from a reading list: each letter is a div3 carrying n= and type="Letter", 168 of
    them, and the sub-corpora are cut by ADDRESSEE where the title names one (the Jerome
    exchange, exactly) and by keyword count where it does not, taking the natural break in
    the distribution rather than a chosen threshold. The four parts partition the 168 with
    no overlap. One extraction bug was caught and fixed before any of this was written: the
    last letter''s span ran to end-of-file and swallowed the indexes, reading CCLXIX as 15,011
    words when it is 238. It had put a Pelagian sub-corpus of 16,193 words on the map that
    does not exist. WITH THAT FIXED THIS SUB-CORPUS IS ALMOST NOTHING: two letters, 1,182
    words - Letter CXLVI to Pelagius himself (204 words, cordial, before the controversy)
    and Letter CXCI to Sixtus. The original note assumed ''anti-Pelagian letters'' formed
    a real body inside this volume; measured, they do not. The substance is in npnf105, which
    is where the anti-Pelagian treatises are and where pelagianism draws 15 works from. Recorded
    because an absence someone expected is worth as much as a presence.'
