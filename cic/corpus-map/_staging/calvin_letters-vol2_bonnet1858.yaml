    role: context
    confidence: assigned
    note: 'Geneva''s advice to the Edwardian Reformation in its own words: Calvin urging Somerset to a complete
      reformation by preaching and the correction of abuses (October 1548), pressing Cranmer for an assembly
      of the learned of all the Reformed churches (July 1552), and exhorting the young king to persevere
      (January 1551), as the edition''s own summaries describe each letter. The outside Reformed voice the
      English church listened to and did not simply follow. Context; same time, different region.

      '

