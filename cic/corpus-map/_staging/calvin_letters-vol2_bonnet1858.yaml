  - row_id: calvin_letters-vol2_bonnet1858--letters-to-somerset-edward-vi-and-cranmer-1548-1552
    work: 'Letters of John Calvin, Vol. II: the letters to the Protector Somerset (CCXXIX, CCLVII), to Edward
      VI (CCLXXIV) and to Archbishop Cranmer (CCXCVIII, CCCXIV), 1548-1552'
    author: calvin
    locus: CCXXIX at file line 8702; CCLVII at 12073; CCLXXIV at 14012; CCXCVIII at 16620; CCCXIV at 18559
    atlas_ids:
