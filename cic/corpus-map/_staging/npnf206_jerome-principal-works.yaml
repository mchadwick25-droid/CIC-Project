# Worker staging file - npnf206 (Jerome: Letters and Select Works, NPNF second
# series vol. 6). Jerome also fills npnf203 (Rufinus/Theodoret volume section -
# another worker's file); only what is IN THIS FILE is assigned here.
# Apparatus skipped: title pages, translator's preface, Prolegomena to Jerome
# (div1 4, ~20,844 words), indexes (div1 8).
source_file: npnf206_jerome-principal-works.xml
assignments:
- work: The Letters of St. Jerome
  author: jerome
  locus: 'div1 5 - one body of 150 letters (div2 5.1-5.150, ~288,634 words), assigned as one
    work, not 150 assignments. Letters XXII and CVIII are additionally listed as their own
    entries below.

    '
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: assigned
  note: 'The core of the built hieronymian world''s corpus. The collection prints correspondence
    RECEIVED as well as sent - letters from Damasus, Epiphanius, Theophilus of Alexandria,
    Augustine, Pope Innocent, Rufinus, Procopius are interleaved under the same div1 - so
    the body is a correspondence corpus around Jerome, not solely his pen; a builder quoting
    from it should check the individual letter''s sender.

    '
- work: Letter XXII (To Eustochium, on virginity)
  author: jerome
  locus: div2 5.22 - 'To Eustochium', n=XXII, ~18,609 words
  atlas_ids:
  - hieronymian-ascetic-literary
  - desert-monasticism
  role: tradition
  confidence: assigned
  note: 'The brief''s own worked case (section 3) of one work belonging to two entries: Jerome''s
    programmatic letter on virginity is hieronymian tradition, and its ascetic sections -
    including his account of his own desert years and of the three kinds of Egyptian monks
    - are Latin witness for desert-monasticism. Split out from the Letters body so the double
    home is on record.

    '
- work: Letter CVIII (To Eustochium - Epitaph of Paula)
  author: jerome
  locus: div2 5.108 - 'To Eustochium', n=CVIII, ~16,944 words
  atlas_ids:
  - hieronymian-ascetic-literary
  - jerusalem-liturgical-pilgrimage-christianity
  role: tradition
  confidence: assigned
  note: 'The memoir of Paula: the file''s own preface to the letter says Jerome "relates the
    story of Paula in detail," her conversion and ascetic life. Its long narrative of her
    pilgrimage through the Holy Land places it also in the Jerusalem liturgical-pilgrimage
    entry, and it is one of the corpus''s fullest accounts of a woman''s life - the gap every
    world names. Split out from the Letters body for the second home.

    '
- work: 'Letters VII-X (to Chromatius, Jovinus, and Eusebius; to Niceas; to Chrysogonus;
    to Paul of Concordia)'
  author: jerome
  locus: div2 5.7-5.10 - 'To Chromatius, Jovinus, and Eusebius' (n=VII, ~1,732 words), 'To
    Niceas' (n=VIII, ~415 words), 'To Chrysogonus' (n=IX, ~350 words), 'To Paul' (n=X, ~1,012
    words); ~3,509 words total
  atlas_ids:
  - hieronymian-ascetic-literary
  - aquileian-christianity
  role: tradition
  confidence: assigned
  note: 'Jerome''s early letters to the Aquileian ascetic circle he belonged to before leaving
    for the East c. 373 - addressed to Chromatius (the future bishop of Aquileia), the sub-deacon
    Niceas, the monk Chrysogonus, and an old man of nearby Concordia. Split out from the Letters
    body for the second home: this church''s own vendored corpus otherwise runs to one work
    (Rufinus'' Commentary on the Apostles'' Creed), and these four short letters are primary-voice
    correspondence naming Aquileian and Concordian figures by name and role, not about the
    church from outside it. Surfaced by a source-research pass on Aquileian Christianity''s
    (I.41) sourcing gaps, 2026-09-13.

    '
- work: The Life of Paulus the First Hermit
  author: jerome
  locus: div2 6.1 (~3,900 words)
  atlas_ids:
  - hieronymian-ascetic-literary
  - desert-monasticism
  role: tradition
  confidence: assigned
  note: 'Jerome''s Egyptian-desert hagiography, written in deliberate rivalry with the Vita
    Antonii. Desert evidence written from outside the desert, like the Vita itself.

    '
- work: The Life of S. Hilarion
  author: jerome
  locus: div2 6.2 (~11,619 words)
  atlas_ids:
  - hieronymian-ascetic-literary
  - palestinian-ascetic-monasticism-early
  role: tradition
  confidence: assigned
  note: Hilarion carries Antony's pattern to Palestine, so the subject is monasticism outside
    the desert entry's stated region (Egypt, Nile Valley). No census entry covers fourth-century
    Palestinian monasticism (the Judean-desert/Gaza entry begins c. 450), so desert-monasticism
    is the nearest bucket; flagged rather than silently stretched. Re-pointed 2026-08-26 to
    the census entry added on record for this movement.
- work: The Life of Malchus, the Captive Monk
  author: jerome
  locus: div2 6.3 (~3,513 words)
  atlas_ids:
  - hieronymian-ascetic-literary
  - palestinian-ascetic-monasticism-early
  role: tradition
  confidence: assigned
  note: 'Same doubt as the Hilarion: Syrian setting, monastic subject, and no census entry
    for fourth-century Syrian monasticism outside the Edessa/ Nisibis entry (which this is
    not). Desert-monasticism as nearest monastic bucket, flagged. Re-pointed 2026-08-26 to
    the census entry added on record for this movement.'
- work: The Dialogue Against the Luciferians
  author: jerome
  locus: div2 6.4 (~16,292 words)
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: provisional
  note: 'Argues how the church should receive clergy and laity baptized under the Arian (Homoian)
    ascendancy after Ariminum - so it is also material about Homoian Arianism and its aftermath,
    assigned to that excluded entry per the doctrinal-floor rule. Provisional because the
    Luciferians themselves (a Nicene rigorist schism) have no census entry and the Homoian
    id carries only half the argument.

    '
- work: The Dialogue Against the Luciferians
  author: jerome
  locus: div2 6.4 (~16,292 words)
  atlas_ids:
  - homoian-arian-christianity
  role: context
  confidence: provisional
  note: 'Argues how the church should receive clergy and laity baptized under the Arian (Homoian)
    ascendancy after Ariminum - so it is also material about Homoian Arianism and its aftermath,
    assigned to that excluded entry per the doctrinal-floor rule. Provisional because the
    Luciferians themselves (a Nicene rigorist schism) have no census entry and the Homoian
    id carries only half the argument.

    Role normalised to `context` for the doctrinal-floor entry: this work describes that movement
    from outside rather than speaking as it, and the brief allows a built world to draw on
    floor material only as `register: etic`.'
