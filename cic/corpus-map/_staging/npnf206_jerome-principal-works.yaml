- work: Prefaces (to Jerome's early works, the Vulgate Old Testament, and the Commentaries)
  author: jerome
  locus: 'div1 7 (~18,466 words): 7.2 prefaces to the early works, 7.3 prefaces to the Vulgate
    OT books, 7.4 prefaces to the commentaries - one body of short prefaces, assigned together.

    '
  atlas_ids:
  - hieronymian-ascetic-literary
  role: tradition
  confidence: assigned
  note: 'The hieronymian world is built on Jerome''s translation work (brief 11a), and these
    prefaces are this volume''s direct witness to it - his own statements of method, canon
    and audience. Editorially collected, but every preface is Jerome''s text, not apparatus.

    '
