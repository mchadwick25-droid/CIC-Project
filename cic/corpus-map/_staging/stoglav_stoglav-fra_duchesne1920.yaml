    note: 'Tier: same time-place (Muscovy; the 1551 council looks back on this period). Duchesne''s introduction
      names Joseph Volotski as founder of the Volokolamsk house and Nil Sorski as the best-known partisan
      of the other side, and says they stood face to face at the council of 1503 (file lines 1146 to 1180);
      The council''s own roll of the saints, at lines 2494 to 2497, names the great Sergius of Radonezh
      and Cyril of Beloozero beside Antony and Theodosius of the Caves. Read at those lines. The OCR is
      damaged in places.'
