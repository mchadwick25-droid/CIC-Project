    role: tradition
    confidence: provisional
    note: >
      Constantine's letters on the Donatist case, a proconsular relatio, and
      imperially ordered church trials are primary documents of imperial
      and juridical Christianity itself - here the empire acting on the
      church is the entry's own subject matter, so tradition rather than
      context. Provisional because whether official acta count as ijc's
      "own voice" is a judgment Mark may want to make; if not, flip to
      context.
