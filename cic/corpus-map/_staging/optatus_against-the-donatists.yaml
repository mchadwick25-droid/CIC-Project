# The file holds Optatus' seven books AND the documentary appendix
# (Appendices I-XVI): the ancient anti-Donatist dossier of official acts and
# imperial letters transmitted with his work. The dossier is not Optatus'
# composition and is assigned separately below. The translator's omitted
# "hundred noteworthy sayings" (pp. 311-320, noted in-file as omitted) and
# Vassall-Phillips' 1917 introductions are apparatus.
source_file: optatus_against-the-donatists.txt

authors_ruled:
  anti-donatist-dossier:
    kind: anonymous
    evidence: >
      The volume's DC.Creator names only `optatus`, but Appendices I-XVI are
      official documents naming their own origins in their headings: "ACTA
      PURGATIONIS FELICIS EPISCOPI AUTUMNITANI", "GESTA APUD ZENOPHILUM",
      "CONSTANTINUS AUGUSTUS AELAFIO", "EPISTOLA CONCILII ARELATENSIS AD
      SILVESTRUM PAPAM, A.D. 314", "ACTA CONCILII CIRTENSIS. A.D. 305",
      "RELATIO ANULINI PROCONSULIS AD IMPERATOREM. A.D. 313", several
      further epistolae Constantini. A collective work-entity per brief
      6.4, not an author.

