  - row_id: optatus_against-the-donatists--against-the-donatists-de-schismate-donatistarum-books-i-vii-2
    work: "Against the Donatists (De Schismate Donatistarum, Books I-VII)"
    author: optatus
    locus: "as above"
    atlas_ids:
      - donatism
    role: context
    confidence: assigned
    note: >
      The primary anti-Donatist source outside Augustine, and the fullest
      surviving account of the schism's origins. Context for the donatism
      entry: Optatus describes the Donatists rather than speaking as one -
      "my brother Parmenian" notwithstanding, this is the view from the
      other side, usable for Donatism only etically. Assigned twice with
      different roles, deliberately (worker brief invited exactly this).

  - row_id: optatus_against-the-donatists--appendix-of-documents-the-anti-donatist-dossier-appendices-i
    work: "Appendix of Documents (the Anti-Donatist Dossier, Appendices I-XVI)"
    author: anti-donatist-dossier
    locus: >
      headings "APPENDIX I." through "APPENDIX XVI.": Acta Purgationis
      Felicis (314), Gesta apud Zenophilum (320), Constantine's letters,
      the Council of Arles' letter to Pope Silvester (314), Acts of the
      Council of Cirta (305), Anulinus' relatio (313)
    atlas_ids:
      - donatism
    role: context
    confidence: assigned
    note: >
      The contemporary legal-documentary record of the schism: court acts,
      council acts, and imperial correspondence, 305-c. 330, transmitted
      with Optatus and cited by him ("in the Appendix to these books I have
      subjoined... these documents"). Assigned as one documentary body per
      the granularity rule. Context, not tradition: officials and emperors
      describing and adjudicating the parties, not either side's own voice.

  - row_id: optatus_against-the-donatists--appendix-of-documents-the-anti-donatist-dossier-appendices-i-2
    work: "Appendix of Documents (the Anti-Donatist Dossier, Appendices I-XVI)"
    author: anti-donatist-dossier
    locus: "as above"
    atlas_ids:
