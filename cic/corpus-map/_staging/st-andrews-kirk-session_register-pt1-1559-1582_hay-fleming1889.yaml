    work: "Register of the Minister, Elders, and Deacons of the Christian Congregation of St Andrews, Part First: 1559-1582 (kirk session and superintendent's court)"
    author: st-andrews-kirk-session
    locus: "Hay Fleming's Preface from file line 73 (edition pages v-lxxxiv); the register from the first entry at line 3108 ('The xxvij day of October, 1559', Robert Roger's public repentance for adultery) to the entries of May-July 1582 ending about line 30160; Scottish History Society report and member list after 30164"
