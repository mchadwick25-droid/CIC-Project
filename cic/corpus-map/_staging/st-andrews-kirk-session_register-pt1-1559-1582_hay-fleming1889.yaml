    note: >
      The earliest and fullest surviving kirk session register: public
      repentance, fornication and adultery cases, slander between
      neighbours, Sabbath breach, the recantations of the old clergy, the
      superintendent's court for Fife, and the session's ordinances. The
      day-to-day discipline the census calls denser than Geneva's, in the
      clerk's own Scots with Latin headings. Primary voice, ready to quote
      once checked against the page image; the editor's marginal rubrics are
      OCR'd at line ends and must be stripped from any quotation. Hay
      Fleming's Preface is editorial.
