  - row_id: zakaria_memoires-historiques-sur-les-sofis-fra_brosset1876--histoire-d-aghovanie-par-le-catholicos-hasan-dchalaliants
    work: "Histoire d'Aghovanie, par le catholicos Hasan Dchalaliants (Brosset's French translation)"
    author: hasan-dchalaliants
    locus: "file lines about 10683-12150; the author's notice, which dates his installation as catholicos of Aghovanie to 1701-02, opens it"
    atlas_ids:
      - church-of-caucasian-albania
    role: context
    confidence: provisional
    note: >
      An eighteenth-century catholicos of the Albanian see, writing the history of his own
      church; Brosset calls it interesting for Georgia at the start of the eighteenth
      century. The Albanian window is 451-705, so this is late memory of the church, not its
      voice. Not read beyond the notice.
