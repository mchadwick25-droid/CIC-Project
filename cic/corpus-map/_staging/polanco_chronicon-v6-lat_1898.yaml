  note: 'Polanco''s year-by-year chronicle of the Society, 1556, in Latin with the editors'' notes. It
    is the Society''s own account of its houses, colleges and missions, written by Ignatius''s secretary,
    and covers other years than the vendored Tomus 5 (polanco_chronicon-v1-lat_1894.txt, 1555). Primary original evidence for the movement, quotable
    once each wording is checked against the page image: the scan is legible with occasional letter-level
    misreads. Word-form coverage against a clean Latin vocabulary is 0.81; the Spanish, Italian and Portuguese
    passages and the notes lower it, so the figure is a comparison across files and not a measure of accuracy.'
