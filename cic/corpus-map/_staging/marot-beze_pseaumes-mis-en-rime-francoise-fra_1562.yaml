authors_ruled:
  marot-beze:
    kind: metadata-omission
    evidence: >
      Not CCEL-derived markup - a plain-text archive.org extract of the
      1562 title page, which credits both versifiers jointly ("par
      Clement Marot, & Theodore de Beze"): Marot completed roughly the
      first third of the Psalms before his death in 1544, and Beze
      completed the remainder for this 1562 collection - a genuine joint
      production spanning two authors' own distinct work, not a single
      author's text with a minor contributor.
    from_file: marot-beze_pseaumes-mis-en-rime-francoise-fra_1562.txt

