    note: >
      426/427, addressed to Hadrumetum (North Africa), not to Gaul — the
      doubt is whether the gallic-monastic-ascetic-christianity id should
      stand on addressee grounds alone; latin-pastoral-congregational-christianity
      is not in doubt. Assigned here provisionally because this is the
      treatise whose circulation provoked the Gallic monks' own pastoral
      objections (reported to Augustine by Prosper of Aquitaine and a
      correspondent named Hilary) that div1 21's two treatises directly
      answer — the opponent side of that world's own Gravity Discovery
      (Doc_04) needs this as the provoking text, not only the two replies.
      This covers the Gallic monastic-ascetic entry (era 2, c. 360-450).
      This Hilary's identity is Contested, not Hilary of Arles — this
      world's own vendored Commonitory introduction (npnf211) places
      Hilary of Arles among the Massilian party being reported on, not
      among the reporters, and npnf105's own apparatus proposes "Hilary
      of Sicily" as its own best identification (see
      gallic_Doc02_Source_Ecology.md §1.4).

