  note: ORIGINAL-LANGUAGE WITNESS (Greek and Latin, Lommatzsch's Maurist text), the only rights-clean
    text of these commentaries; the English translations are in copyright. Where the Greek is lost the
    Latin is a translation of unknown hand or, for the Luke homilies, Jerome's, per the file's own notes.
    Any record citing it must say which, and render the English itself, labelled as a rendering. Origen's
    own work, tradition for the world whose catechetical school he led; the same assignment as the Philocalia
    and De Oratione. The design thread also proposed desert, cappadocian and hal as context; those placements
    are held for Mark.
