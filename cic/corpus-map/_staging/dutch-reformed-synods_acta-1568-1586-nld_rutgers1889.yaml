    note: >
      The founding synods of the Dutch Reformed church, held first in exile (Wezel, Emden) and
      then in the liberated provinces: church order, discipline, catechism, the Belgic
      Confession adopted, letters from the exile churches in England and Germany. The
      institutional voice of the refuge becoming a national church, all inside the window.
      Dutch (some Latin) original, clean OCR, primary voice ready to quote once verified;
      Rutgers' 1889 introductions are editorial. No English translation exists.
