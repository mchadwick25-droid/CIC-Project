    author: dutch-reformed-synods
    locus: "'Inhoud' at line 334; Wezel articles from line 562; Emden acts ('Acta ofte Handelinghen') from line 2912; Dordrecht 1574 from line 5713; Dordrecht 1578 from line 10658; Middelburg 1581 from line 15764; 's-Gravenhage 1586 from line 22366; Rutgers' introductions and the appended letters are marked as such in the 'Inhoud'"
    atlas_ids:
