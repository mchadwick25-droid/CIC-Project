  clovis-letter-to-bishops:
    kind: anonymous
    evidence: >
      The Capitularia volume prints Clovis's letter to the bishops (507-511) as a royal
      document; ruled a royal letter with no separate author.
    from_file: capitulatio-de-partibus-saxoniae_pertz1881.txt
  capitulatio-partibus-saxoniae:
    kind: anonymous
    evidence: >
      A royal capitulary issued in Charlemagne's name by his chancery,
      not a personally authored work - even its own MGH editors dispute
      its exact date and place of issue. A work, not a person.
    from_file: capitulatio-de-partibus-saxoniae_pertz1881.txt

