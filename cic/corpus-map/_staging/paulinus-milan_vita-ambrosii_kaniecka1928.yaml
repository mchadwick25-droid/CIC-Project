    world''s own story, neither previously cited by any world''s build: Chapter III (line 3199)
    is Paulinus''s own account of the "voice of a child" crying "Ambrose Bishop" that turned the
    Arian-Catholic election riot into unanimous acclamation - the founding legend of Ambrose''s
    episcopate, in his own household''s telling. Chapters IV-V (lines 3516-3654) narrate the 386
    Portian Basilica standoff (Justina''s soldiers sent to besiege the church, then won over to guard
    it instead) and the discovery of the martyrs Gervasius and Protasius in the basilica now called
    "Ambrosiana" - the same events this corpus-map already carries as a context row from Theodoret''s
    Ecclesiastical History (npnf203, Book V), but told here by an eyewitness insider rather than an
    outside historian writing two generations later. `role: context`, not `tradition`: hagiography
    written some fifteen to twenty years after Ambrose''s death, openly meant to edify, with legendary
    material (the child''s voice, miracle cures at the martyrs'' tomb) not marked off from documented
    events inside the text itself - the same discipline ijc''s own record already applies to this
    file (Tier 3, attributed tradition, nothing quoted verbatim). The infancy bee-swarm legend
    (Chapter II) stays an ijc-only row; nothing here duplicates that assignment.

