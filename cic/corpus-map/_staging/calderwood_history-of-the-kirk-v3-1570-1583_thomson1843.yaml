    work: "The History of the Kirk of Scotland, Vol. III: the years 1570-1583 (the Assemblies under the Regents and the young King, the Leith agreement, the struggle over bishops, the Ruthven raid), with the documents Calderwood transcribed"
    author: calderwood
    locus: "from the 1570 Assembly (file line about 1509, running head '1570. OF THE KIRK OF SCOTLAND.') to the end of 1583 (running heads '1583.' from about 32308); the conference upon the policy from about 17280, the policy presented to the King from about 18783"
    atlas_ids:
