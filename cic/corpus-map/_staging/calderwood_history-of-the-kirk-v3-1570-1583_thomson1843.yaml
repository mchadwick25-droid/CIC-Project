    role: tradition
    confidence: assigned
    note: >
      The presbyterian Kirk's own historian, writing in the 1620s from the
      Assembly registers, Knox and the papers of the ministers: the fullest
      narrative of the Melvillian turn, in Scots, with the Assembly acts, the
      ministers' protests and the King's letters embedded. His framing is partisan
      against the bishops and must be read as his; the embedded documents are
      quotable as his transcripts. Primary voice, clean OCR, ready to quote once
      verified against this file.
