  role: tradition
  confidence: assigned
  note: 'The acts of the two Cilician Armenian councils held to unite the church with Rome, in Latin:
    the catholicos Gregory and King Levon at Sis in 1307, and Adana in 1316. The Armenian church''s own
    council record in the form Rome kept it. Ormanian (vendored) says the catholicos died before the synod
    of 1307 met, so the acts and the later history disagree; mark the claim contested in Doc_02. Read
    at the opening of the Sis acts. Second witness for exact wording (long s read as f).'
