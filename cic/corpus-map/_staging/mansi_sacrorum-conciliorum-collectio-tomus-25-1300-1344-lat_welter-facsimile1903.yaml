  author: mansi
  locus: '''ACTA CONCILII SISENSIS ARMENI'' at file line 12653; ''EPISTOLA GREGORII SISENSIS'' 13480;
    ''ACTA CONCILII ADANENSIS'' 61813'
  atlas_ids:
