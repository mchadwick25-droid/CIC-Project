    confidence: provisional
    note: >
      Custody, not voice: an Englishwoman's translation (Anne Prowse, first printed 1590)
      dedicated to the Countess of Warwick, carrying a Dutch Reformed treatise into
      Elizabethan godly reading. Placed on the translation history alone.
