    note: >
      Taffin wrote in French and served French-speaking Reformed congregations, but in the
      Netherlands, not France. Placed as an outside-but-adjacent French Reformed voice on the
      entry's language and window; not read for French matter.
  - row_id: taffin_markes-of-the-children-of-god_prowse1599--of-the-markes-of-the-children-of-god-3
    work: "Of the Markes of the Children of God (Prowse, 1599)"
