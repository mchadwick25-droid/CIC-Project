- row_id: theopistus_histoire-de-dioscore-journal-asiatique-1903-fra_nau1903--histoire-de-dioscore-miaphysite
  work: Theopistus, History of Dioscorus (Syriac version of a Coptic anti-Chalcedonian history), French
    with Syriac (Nau, Journal asiatique X.1, 1903)
  author: theopistus
  locus: the article from file line 162; Dioscorus's stories of Chalcedon told at Gangra from 388; Nau
    on the Coptic Panegyric of Macarius of Tkow at 739
  atlas_ids:
  - cyrilline-miaphysite-egyptian-christianity
  role: tradition
  confidence: provisional
  note: Shared-Events Era 2 batch (Chalcedon 451). The Egyptian non-Chalcedonian tradition's own legend-history
    of its deposed patriarch, in which the exiled Dioscorus tells Chalcedon from his side, with miracles
    and polemic; written after the event. A reception and legend witness, never evidence of the sessions.
    French recovered; Syriac not recovered. The rest of the journal volume is unrelated and not assigned.
