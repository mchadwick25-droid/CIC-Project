  role: context
  confidence: provisional
  note: Placed on window and subject only (the volume covers the pontificates of Borromeo's uncle Pius
    IV and of Pius V, Gregory XIII and Sixtus V, 1559-1591); not read for Milan-specific matter.

- row_id: bullarium-romanum_magnum-bullarium-tomus2-pius-iv-to-innocent-ix-lat_cherubini--gregory-xiii-discalced-carmelites
  work: 'Gregory XIII, constitution for the Discalced Carmelites of Spain (incipit as OCR''d: "Ia confidcratione
    Romanum decet Pontificem"), with the compiler''s note naming Teresa as foundress'
  author: bullarium-romanum
  locus: compiler's note on the two Carmelite congregations at lines 125190-125230 (naming "Teresia Hispana"
    as foundress at line 125223); the constitution from line 125228 (King Philip, the Discalced, the history
    from Innocent IV and Eugenius IV, the foundations of 1565, the separate province) to about line 125600;
    running heads give the year 1580 at lines 125411 and 125674
  atlas_ids:
  - carmelite-reform-and-spanish-mystics
  role: context
  confidence: assigned
  note: 'The papal act that recognised the Discalced as a body distinct from the mitigated friars: Rome
    speaking, in Latin, about the reform from outside it. Read at the loci given; the text is a long-s
    OCR of the Cherubini Bullarium and its running-head year reads 1590 at one place and 1580 at others,
    so confirm the date against the page image before citing. The same volume holds further Carmelite
    material (for example lines 113540-113667, on the order''s property) not read here.'
