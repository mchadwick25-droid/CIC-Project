    role: tradition
    confidence: provisional
    note: >
      A Jacobite Syrian priest of Cottayam in 1869 stating his church's faith and its dispute
      with Mar Athanasius Matthew: the Malankara church's own voice in its own window. Placed
      on date and author; not read for that entry.
