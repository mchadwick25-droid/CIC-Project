    VIII 14903, IX 16860; the Bishop of Cochin''s letter and the Synod''s reply from 18817'
  atlas_ids:
  - st-thomas-christians-under-portuguese-pressure-d
  role: tradition
  confidence: assigned
  note: >-
    The Synod's decrees rendered into Latin from the Portuguese archetype of Gouvea (Coimbra 1606), with
    Raulin's notes. Primary Latin witness to the acts; the English is in Geddes 1694 and Hough 1839. Second
    witness for exact wording: OCR is rough (many broken words).
