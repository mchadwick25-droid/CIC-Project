source_file: raulin_historia-ecclesiae-malabaricae-cum-diamperitana-synodo-lat_1745.txt
authors_ruled:
  synod-of-diamper:
    kind: anonymous
    evidence: 'The acts and decrees are the corporate work of the diocesan Synod of Diamper (1599) convened
      by Aleixo de Menezes; the translations carry the translator''s name (Geddes, Raulin) but no individual
      author of the decrees themselves. Geddes''s title page: ''Done out of Portugueze into English'';
      Raulin''s: ''nunc primum e Lusitano in Latinum versa''.'
    from_file: raulin_historia-ecclesiae-malabaricae-cum-diamperitana-synodo-lat_1745.txt
  liturgy-of-malabar:
    kind: anonymous
    evidence: The Malabar Mass is the East-Syriac rite as used by the St. Thomas Christians and revised
      at Diamper; no author is claimed (see the Neale staging file's own ruling).
    from_file: raulin_historia-ecclesiae-malabaricae-cum-diamperitana-synodo-lat_1745.txt
