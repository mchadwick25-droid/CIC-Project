  - work: "Pedalion (the Rudder): the holy and divine canons with the commentary of Agapios and Nikodemos, Greek"
    author: nikodemos-hagiorite
    locus: "title page at file lines 102-125, the publisher's address to Orthodox Christians at 227; canon texts and commentary follow (for example Canon 85 at line 43851)"
    atlas_ids:
      - orthodoxy-under-the-ottomans-parish-millet-and-n
    role: tradition
    confidence: provisional
    note: >
      The standard Greek book of canon law, compiled by Agapios and Nikodemos and first
      printed at Leipzig in 1800; this is the 1886 Athens edition. Nikodemos wrote after this
      world's window closes (1749-1809 against a window of 1453-1650); this edition is a late
      witness to practice and law, so its place here is a provisional shelf assignment for the
      world's builders to confirm. Second witness for exact Greek wording (accents imperfect);
      the running text is readable.
