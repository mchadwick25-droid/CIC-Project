authors_ruled:
  boyer:
    kind: metadata-omission
    evidence: >
      The volume's own preface to its Part III (file lines 17058-17083) says
      the History of the Vaudois is 'given from Boyer' with additions from
      Henri Arnaud, and the host catalogue names only Perrin; the author of
      Part III is Pierre Boyer, The History of the Vaudois (London, 1692),
      supplied here from the volume's own statement.
    from_file: perrin_history-ancient-christians-valleys-alps_1847.txt

