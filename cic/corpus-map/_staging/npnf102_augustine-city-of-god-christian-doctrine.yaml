    role: tradition
    confidence: provisional
    note: >
      Occasioned by the sack of Rome in 410; the tradition's central statement
      on empire, providence, Rome's history and the two cities — the exact
      questions the ijc world lives inside (Book V on Constantine and
      Theodosius, Book XIX on earthly peace and the commonwealth). Provisional
      because Augustine is a North African pastor, not a participant in the
      Rome-Constantinople-Milan imperial church; it is evidence for ijc's
      themes rather than a work from inside it.

