  note: Hus's own letters in the Latin and Czech he wrote, the earliest account of the Constance trial
    by Petr of Mladoňovice (the Relatio), and the documents of the Bohemian disputes before and during
    the council. It answers the request for the Latin and Czech originals of the letters and for the Relatio.
    Palacký's Latin prefaces and notes are the editor's, not Hus's. Primary original evidence for the
    movement, quotable once each wording is checked against the page image. The Latin reads well (word-form
    coverage against a clean Latin vocabulary 0.80). The Czech letters keep Palacký's 1869 orthography
    (w for v) and the OCR drops or misplaces some diacritics (for example pfepustí for přepustí), so check
    every Czech quotation against the scan.
