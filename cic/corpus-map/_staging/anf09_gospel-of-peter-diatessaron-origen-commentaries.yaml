  confidence: assigned
  note: '2nd-century passion gospel in use at Rhossus in Antioch''s orbit — pahc''s era and
    region — but Serapion of Antioch condemned its docetic use (his letter is in anf08 div2
    10.13, cross-referenced there). It is not Scripture in the sense brief
    6.5 excludes, so it is assigned rather than dropped. apocryphal-and-pseudepigraphal-literature
