# Anonymous-and-collective group.
# Apparatus (title pages, preface, per-work Introductions where marked,
# indexes) is skipped. The "Synoptical Table" under the Gospel of Peter
# (div2 3.3) is the editor's comparison apparatus, not a source, and gets no
# assignment.
source_file: anf09_gospel-of-peter-diatessaron-origen-commentaries.xml
authors_ruled:
  gospel-of-peter:
    kind: pseudonymous
    evidence: 'div1 3 "The Gospel of Peter": first-person narrative in Peter''s name; the
      volume''s own Introduction quotes Serapion of Antioch''s letter to Rhossus (via Eusebius
      HE vi.12) condemning its use and noting its docetic tendency. anf09 DC.Creator lists
      only origen and tatian.

      '
  apocalypse-of-peter:
    kind: pseudonymous
    evidence: 'div1 5: vision narrative in Peter''s name; early (Muratorian fragment and Clement
      of Alexandria attest it, per the Introduction).

      '
  apocalypse-of-paul:
    kind: pseudonymous
    evidence: 'div1 6 "The Vision of Paul": first-person apocalypse in Paul''s name with the
      Tarsus-discovery frame. Same work as anf08 div2 7.40 "Revelation of Paul"; one slug
      covers both volumes (the merge deduplicates rulings).

      '
  apocalypse-of-the-virgin:
    kind: anonymous
    evidence: 'div1 7: a vision granted to the Mother of God, narrated anonymously; no authorial
      claim.

      '
  apocalypse-of-sedrach:
    kind: anonymous
    evidence: 'div1 8: anonymous apocalypse in which Sedrach is the seer, not the claimed
      author.'
  testament-of-abraham:
    kind: anonymous
    evidence: 'div1 9: third-person narrative about Abraham; a Jewish pseudepigraphon in Christian
      transmission, claiming no author.

      '
  acts-of-xanthippe-and-polyxena:
    kind: anonymous
    evidence: 'div1 10 (''Life and Conduct of the Holy Women...''): no authorial claim.'
  narrative-of-zosimus:
    kind: anonymous
    evidence: 'div1 11: the narrative concerning the Blessed Ones (Rechabites) framed around
      Zosimus; transmitted without an author.

      '
  second-clement:
    kind: pseudonymous
    evidence: 'div2 12.6 "The Second Epistle of Clement" with its own Introductory Notice
      treating it as an early homily under Clement''s name, not his. Duplicate of the ruling
      staged in anf07 (same slug, deliberately).

      '
  aristides:
    kind: metadata-omission
    evidence: 'div1 13 "The Apology of Aristides the Philosopher" names the author (Athens,
      under Hadrian per the Introduction); anf09 DC.Creator omits him.

      '
  passion-of-scillitan-martyrs:
    kind: anonymous
    evidence: 'div1 14: Latin court acta of the martyrs of Scilli (Carthage, 180 CE); no author
      — the slug names the work-entity.

      '
