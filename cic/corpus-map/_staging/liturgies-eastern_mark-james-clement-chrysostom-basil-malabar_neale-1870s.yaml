    work: "Liturgy of S. Basil (Byzantine form)"
    author: liturgy-of-st-basil
    locus: "file lines 7358-7820 (the Basil section, pp. 129-139 in the printed pagination)"
    atlas_ids:
      - cappadocian-nicene-pastoral-monastic-tradition
    role: context
    confidence: assigned
    note: >
      The download queue row that prompted this vendoring. English text of the rite that
      tradition attributes to Basil of Caesarea. `role: context`, not `tradition`: the
      Byzantine form is a later redaction, so the words are not shown to be Basil's own;
      a Representative may point to it as the liturgy that carries his name, never quote it
      as his voice. Read with the vendored ascetic works for what Basil himself wrote.
  - row_id: liturgies-eastern_mark-james-clement-chrysostom-basil-malabar_neale-1870s--liturgy-of-s-john-chrysostom-byzantine-form
    work: "Liturgy of S. John Chrysostom (Byzantine form)"
    author: liturgy-of-st-john-chrysostom
    locus: "file lines about 5500-7300 (the Chrysostom section; page header 'SAINT CHRYSOSTOM' runs from line 5821 to 7242)"
    atlas_ids:
      - antiochene-exegetical-christianity-chrysostom-ce
    role: context
    confidence: assigned
    note: >
      The rite attributed to John Chrysostom, in Neale's English. Context only: the surviving
      Byzantine text is a later redaction and cannot be shown to be his. His own sermons and
      treatises are the tradition's voice.
  - row_id: liturgies-eastern_mark-james-clement-chrysostom-basil-malabar_neale-1870s--liturgy-of-s-james
