    note: >
      Neale's English of the Jerusalem rite. Same work as the James liturgy in the vendored
      ANF volume 7 (a different translator and text tradition); this is a second witness for
      comparison. Attribution to James is traditional.
  - row_id: liturgies-eastern_mark-james-clement-chrysostom-basil-malabar_neale-1870s--liturgy-of-s-mark
    work: "Liturgy of S. Mark"
    author: liturgy-of-st-mark
