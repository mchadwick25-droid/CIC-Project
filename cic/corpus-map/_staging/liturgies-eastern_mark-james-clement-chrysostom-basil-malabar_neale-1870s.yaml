    role: context
    confidence: needs-ruling
    note: >
      The Clementine liturgy is Book VIII of the Apostolic Constitutions, a late 4th-century
      Syrian compilation; the Antiochene third-century entry is the nearest match by place,
      but the work is later than that entry's window and has not been ruled on.
  - row_id: liturgies-eastern_mark-james-clement-chrysostom-basil-malabar_neale-1870s--liturgy-of-malabar-east-syriac-rite-of-the-st-thomas
