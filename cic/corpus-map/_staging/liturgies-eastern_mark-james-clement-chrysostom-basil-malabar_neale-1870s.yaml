    role: context
    confidence: needs-ruling
    note: >
      The Alexandrian rite in Neale's English. Placed with the Egyptian entry on the guess
      that the Greek Liturgy of Mark belongs to Alexandria's church, but the rite's date
      (its written form is later than the era that entry covers) has not been checked against
      that entry's window, so it is flagged, not forced.
  - row_id: liturgies-eastern_mark-james-clement-chrysostom-basil-malabar_neale-1870s--liturgy-of-s-clement
