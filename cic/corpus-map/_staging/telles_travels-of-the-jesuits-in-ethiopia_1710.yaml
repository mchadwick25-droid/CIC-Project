  note: >-
    English account of the Jesuit mission in Ethiopia, credited on its title page to Balthazar Tellez
    (the host's other scan credits the underlying history to Manuel de Almeida). The Jesuit side of the
    Susenyos story told for an English reader of 1710; not an Ethiopian voice. An English-language report
    on the Jesuit mission, to be read beside Paez and Mendes in the Rerum Aethiopicarum volumes. The BIM
    scan is readable; the long s was normalised.
