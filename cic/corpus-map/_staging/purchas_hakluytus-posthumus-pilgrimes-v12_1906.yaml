    note: >
      The English a build can quote for the China strand's Jesuit narrative: Purchas's 1625
      rendering of Trigault, abridged and with Purchas's own Protestant asides, beside the
      Latin already vendored (trigault_de-christiana-expeditione-apud-sinas-lat_1615.txt,
      itself a second witness). Pantoja's letter is a missionary's first-hand account of
      Peking. Mission voice, not convert voice. Chap. V also covers Xavier in Japan. Clean
      OCR with marginal notes run into line ends.
