  note: >-
    A Palaiologan archbishop of Thessalonica writing for clergy and people on how the liturgy and sacraments are
    done. A church voice inside the window; placed from the elenchus and headings, and the Dialogue was sampled.
    A primary voice, ready to quote once checked verbatim against the scan; Greek and Latin are read from the same
    OCR, and a quote record must be verified against the page image. No public-domain English translation of this
    work is vendored (see the dossier, section 4).
