source_file: palamas_opera-omnia-pg150-grc-lat_migne1865.txt
authors_ruled:
  gregory-sinai:
    kind: metadata-omission
    evidence: >-
      The title page of tomus CL names 'Gregorii Sinaitae' among the authors added to Palamas, and the volume prints
      his ascetic chapters and short tracts (running head 'GREGORII SINAITAE' at file line 60957, 'CAPITA PER ACROSTICHIDEM'
      from 69298); the file's leading slug is palamas.
    from_file: palamas_opera-omnia-pg150-grc-lat_migne1865.txt
  synod-of-constantinople-1341-1351:
    kind: anonymous
    evidence: >-
      Tomus CL prints the Hagioritic Tome 'pro Hesychastis' (running head 'HAGIORITICUS TOMUS' at file line 68672)
      and tomus CLI prints the three synodal tomes (TOMUS SYNODICUS I at CLI file line 14261); synodal texts, no
      single author.
    from_file: palamas_opera-omnia-pg150-grc-lat_migne1865.txt
  greek-opinions-on-palamas:
    kind: anonymous
    evidence: >-
      Tomus CL prints, under the heading 'De Gregorio Palama' (file line 53921), a gathering of documents by several
      hands for and against Palamas: Akindynos's iambs, Andrew of Kolossai's dialogue, the condemnation tome and
      others; a compilation, no single author.
    from_file: palamas_opera-omnia-pg150-grc-lat_migne1865.txt
