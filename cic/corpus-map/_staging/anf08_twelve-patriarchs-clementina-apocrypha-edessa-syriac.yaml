- row_id: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac--ambrose-a-memorial-hypomnemata-addressed-to-the-greeks
  work: 'Ambrose: a memorial (hypomnemata) addressed to the Greeks'
  author: ambrose-hypomnemata
  locus: div2 9.18
  atlas_ids:
  - greek-apologists-second-century
  role: context
  confidence: provisional
  note: 'this work leaves the Greek Apologists'' own roster. Public-domain scholarship reads it as a
    Syriac reworking of the pseudo-Justin Discourse, a 3rd-century Greek revision at earliest
    (Harnack 1897), not Origen''s patron Ambrose, and so outside this entry''s window (124-200)
    and inside syriac-edessa-nisibis''s. It stays here only as context, which also keeps its
    Syriac transmission row homed (every transmitted work needs its voice assigned somewhere).
    Syriac form of a Greek apology (parallel to the pseudo-Justin Discourse to the Greeks,
    per the volume''s endnote). It is Christian apologetic, not Edessene as such; syr marks
    only where the Syriac transmission preserved it. This is Greek apologetic that survives
    only in Syriac - the volume''s own headnote says the original was Greek, because the
    Syriac mistranslates it in places, and pairs it with the pseudo-Justin Discourse to the
    Greeks. So greek-apologists-second-century is where the argument belongs, and
    syriac-edessa-nisibis is kept, which is how it reached us. `provisional` because the
    APOLOGIST half is a date question - the entry''s window is 124-200 and this piece is
    undated - not because the Syriac half is in doubt.'
- row_id: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac--ambrose-a-memorial-hypomnemata-addressed-to-the-greeks-2
  work: 'Ambrose: a memorial (hypomnemata) addressed to the Greeks'
