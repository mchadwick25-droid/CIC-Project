authors_ruled:
  excerpts-of-theodotus:
    kind: pseudonymous
    evidence: 'div2 4.3, titled "Excerpts of Theodotus" and DC.Creator-listed under theodotus,
      but the vendored text is actually the Eclogae Propheticae, not the genuine Excerpta ex
      Theodoto (records/alx audit, alx.source.excerpts-of-theodotus.md) - a full-text scan found
      zero occurrences of Pleroma/Sophia/Achamoth/Demiurge/aeon/Ogdoad, and the ANF editor''s own
      headnote disowns the Clement/Theodotus attribution ("corrupt or forged documents, for which
      Clement''s name has been borrowed"), guessing an unknown Montanist compiler instead.
      Classified pseudonymous rather than reused as `theodotus`, which would keep asserting the
      disproven attribution.

      '
  testaments-twelve-patriarchs:
    kind: pseudonymous
    evidence: 'div1 3 "The Testaments of the Twelve Patriarchs": twelve first-person deathbed
      testaments in the patriarchs'' names. anf08 DC.Creator lists only clement_rome and theodotus,
      neither for this section.

      '
  two-epistles-on-virginity:
    kind: pseudonymous
    evidence: 'div1 5; the section''s Introductory Notice heads it "Attributed to Clement
      of Rome", groups it with the "Pseudo-Clementina", and argues no spurious writing under
      Clement''s name is earlier — attributed to Clement, not his.

      '
  pseudo-clement:
    kind: pseudonymous
    evidence: 'div1 6 is titled "Pseudo-Clementine Literature" in the volume''s own markup.
      CCEL''s DC.Creator carries clement_rome for the volume, but the volume itself rules
      the attribution pseudonymous in its section title and Introductory Notice.

      '
