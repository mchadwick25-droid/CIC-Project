- row_id: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac--fragment-of-maximus-of-jerusalem
  work: Fragment of Maximus of Jerusalem
  author: maximus-of-jerusalem
  locus: div2 10.9
  atlas_ids:
  - palestinian-church-pre-constantinian
  role: tradition
  confidence: needs-ruling
  note: 'Bishop of Jerusalem, A.D. 185-196 per the notice, On the Origin of Evil. No 2nd-century
    Jerusalem entry exists (the Jerusalem entry begins 325); pahc was a stand-in for it.
    palestinian-church-pre-constantinian (era 1, c. 185-312) fills that hole - the same hole
    behind several other works in this volume that had been standing in on Alexandria, on the
    strength of correspondence with Origen, who himself moved to Caesarea around 231. Still
    `needs-ruling`: the attribution of this large fragment is itself disputed (it circulates
    with Methodius'' material, per the notice), and that doubt is untouched by the new entry.'
