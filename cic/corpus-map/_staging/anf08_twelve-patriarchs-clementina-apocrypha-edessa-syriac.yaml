  confidence: provisional
  locus_ids: [ix.xviii, ix.xviii/notes]
  language: eng
  note: 'Syriac form of a Greek apology (parallel to the pseudo-Justin Discourse to the Greeks,
    per the volume''s endnote). It is Christian apologetic, not Edessene as such; syr marks
    only where the Syriac transmission preserved it. This is Greek apologetic that survives
    only in Syriac - the volume''s own headnote says the original was Greek, because the
    Syriac mistranslates it in places, and pairs it with the pseudo-Justin Discourse to the
    Greeks. So greek-apologists-second-century is where the argument belongs, and
    syriac-edessa-nisibis is kept, which is how it reached us. `provisional` because the
    APOLOGIST half is a date question - the entry''s window is 124-200 and this piece is
    undated - not because the Syriac half is in doubt. The `transmission` role - the fourth
    relation - marks CUSTODY: this tradition preserved a work that is not its own voice. The
    volume''s own headnote says the original was Greek, because the Syriac mistranslates it
    in places. Syriac scribes are why it exists at all; the argument in it is not theirs.'
