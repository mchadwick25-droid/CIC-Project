  note: 'Mid-2nd-century Marian infancy gospel, enormously influential; within pahc''s era
    though its provenance (Syria? Egypt?) is unknown. The census has no bucket of its own for
    popular apocryphal literature as a class — a recurring problem in this volume, noted once
