    atlas_ids:
      - the-reformed-cities-zurich-and-geneva
    role: context
    confidence: provisional
    note: >
      The daughter church's confession, drafted on a Genevan model (Schaff's
      headnote credits Calvin and Chandieu); Beza presided at the synod of
      La Rochelle 1571 that reaffirmed it (Quick, near line 5339). Placed on
      that relation, not read against the Reformed Cities' own sources.

