# Vendored for the Huguenots (Atlas VI.6) by the Era VII library session,
# 2026-10-16, per that world's Source Readiness Dossier. The scan holds
# both volumes of Quick's 1692 Synodicon; the OCR is readable but
# letter-noisy (see the file's own intake header).
source_file: quick_synodicon-in-gallia-reformata_1692.txt

authors_ruled:
  french-reformed-synods:
    kind: metadata-omission
    evidence: >
      Not CCEL-derived markup (a plain-text archive.org OCR extract), so
      no automatic author slug exists. The Confession of Faith, the
      Discipline and the synod acts in this volume are corporate acts of
      the national synods of the Reformed Churches of France (Paris 1559
      to Loudun 1659), translated by John Quick from manuscript acts;
      Quick is the compiler, not the author of those acts. A corporate
      slug on the pattern of council-of-trent and synod-of-dort.

assignments:
  - row_id: quick_synodicon-in-gallia-reformata_1692--the-confession-of-faith-of-the-reformed-churches-of-france
    work: "The Confession of Faith, held and professed by the Reformed Churches of France (1559), English version"
    author: french-reformed-synods
    locus: "heading at file line 1009, running to the Discipline heading at line 1775"
    atlas_ids:
      - the-huguenots
    role: tradition
    confidence: assigned
    note: >
      The Gallican Confession in Quick's 1692 English, the older of the two
      English versions. Primary voice for this world's doctrine; quotable
      only after a check against the page image, because the OCR is
      letter-noisy (long s normalised, other misreads left). The French
      text in modern spelling, with a second English version, is in
      schaff_gallican-confession-fra-eng_1877.txt.

  - row_id: quick_synodicon-in-gallia-reformata_1692--the-discipline-of-the-reformed-churches-of-france
    work: "The Discipline of the Reformed Churches of France (the Discipline ecclesiastique, with the synods' observations), English version"
    author: french-reformed-synods
    locus: "heading at file line 1775, running to the First National Synod heading at line 13432"
    atlas_ids:
      - the-huguenots
    role: tradition
    confidence: assigned
    note: >
      The church order the French synods adopted in 1559 and amended
      synod by synod, printed by Quick with the observations of later
      synods under each canon. Primary voice for this world's authority
      structure (consistory, colloquy, provincial and national synod).
      The French original is not vendored; Aymon's 1710 Tous les synodes
      nationaux (archive.org touslessynodesna01gl, 02gl) holds it.

  - row_id: quick_synodicon-in-gallia-reformata_1692--acts-of-the-national-synods-of-the-reformed-churches-of-france
    work: "The Acts, Decisions, Decrees and Canons of the National Synods of the Reformed Churches of France, Paris 1559 to Loudun 1659 (Vol. I and Vol. II)"
    author: french-reformed-synods
    locus: "First National Synod heading at file line 13432 to the end of the file; Vol. I ends at line 51881, Vol. II begins at line 51882, its second part at line 71894"
    atlas_ids:
      - the-huguenots
    role: tradition
    confidence: assigned
    note: >
      The national church's own record of itself across the whole window:
      deputies, moderators, censures, cases of conscience, letters, and
      the running amendment of the Discipline. Primary voice; the OCR is
      letter-noisy and the synod headings are often garbled, so quotations
      need the page image.

  - row_id: quick_synodicon-in-gallia-reformata_1692--quick-s-history-of-the-rise-growth-perfection-and-decay
    work: "A most faithful and impartial history of the rise, growth, perfection and decay of the Reformation in that kingdom, with its fatal catastrophe upon the Revocation of the Edict of Nantes (Quick's own introductory history, 1692)"
    author: quick
    locus: "from the dedication near file line 312 to the Confession heading at line 1009"
    atlas_ids:
      - the-huguenots
    role: context
    confidence: assigned
    note: >
      An English nonconformist minister's sympathetic retrospective
      (1692), written from outside the French churches after their
      dissolution. Context, not the world's own voice, though it quotes
      the synods it introduces.

  - row_id: quick_synodicon-in-gallia-reformata_1692--the-confession-of-faith-of-the-reformed-churches-of-france-2
    work: "The Confession of Faith, held and professed by the Reformed Churches of France (1559), English version"
