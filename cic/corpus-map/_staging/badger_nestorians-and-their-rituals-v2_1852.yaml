    work: "The Nestorians and their Rituals, volume II (Badger, 1852): the creed, doctrine, sacraments, liturgies, ordination, marriage and burial rites of the Church of the East, translated from Syriac manuscripts, with synodal documents"
    author: badger
    locus: "the forty chapters listed at file lines 187-462; the synod of Mar Timotheus of 1317 and the election of a patriarch at about 6774-8767"
    atlas_ids:
      - church-of-the-east-schism-of-1552
    role: context
    confidence: provisional
    note: >
      The church's own rituals and canons in an 1852 English translation from the Shimun line's
      manuscripts: the rite both lines shared in the sixteenth century, and the election canons
      Wigram says the dissenters of 1552 invoked. A witness to the texts, not to the events;
      which of these rites were in force in 1552 is for a build to argue from the manuscripts'
      dates. Placed on content without a close read. Clean OCR.
