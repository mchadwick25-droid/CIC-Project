authors_ruled:
  badger:
    kind: metadata-omission
    evidence: >
      Plain-text vendored file, so cic/texts/AUTHORS.md has not seen the author yet. The title page in the OCR
      reads "The Nestorians and their Rituals ... by the Rev. George Percy Badger ... Vol. II" (file lines
      40-100); the host catalogue gives Badger, George Percy, 1815-1888. A mechanical index-coverage gap, not
      an attribution dispute.

