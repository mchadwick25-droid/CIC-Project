  atlas_ids:
  - russian-church-nikon-to-holy-synod
  role: context
  confidence: provisional
  note: A Kyiv history that the Russian state reprinted at St Petersburg in 1762, so evidence of the Kyivan
    revival's reach into Russian church and state history after 1652. Placed on that reprint, not on a
    reading of the text for the Nikon controversy.
