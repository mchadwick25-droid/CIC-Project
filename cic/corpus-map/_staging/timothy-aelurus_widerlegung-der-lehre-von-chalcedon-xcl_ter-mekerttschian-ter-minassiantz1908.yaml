  note: 'Shared-Events Era 2 batch (Chalcedon 451). The anti-Chalcedonian patriarch of Alexandria''s own
    refutation of the council and the Tome, written in exile in the 460s: the dissenting side of Chalcedon
    in its own words, the non-Chalcedonian Egyptian tradition''s first great theological statement. Primary
    original-language voice, in the Armenian translation that alone preserves it; verify against the page
    image before quoting. DELIBERATELY NOT the existing slug timothy_alexandria, which is Timothy I of
    Alexandria (d. 385), author of the Canonical Answers.'
