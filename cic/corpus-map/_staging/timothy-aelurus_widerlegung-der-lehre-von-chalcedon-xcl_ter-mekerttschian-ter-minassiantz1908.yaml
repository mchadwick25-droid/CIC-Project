  note: 'Custody, and more: the Greek is lost and the work survives only in the Armenian translation made
    and kept by a church that rejected Chalcedon on the same grounds. Recorded as transmission (the voice
    is Alexandrian, assigned above); whether the Armenian entry should also hold it as tradition, as a
    text it adopted, is a call for that entry''s builder.'
