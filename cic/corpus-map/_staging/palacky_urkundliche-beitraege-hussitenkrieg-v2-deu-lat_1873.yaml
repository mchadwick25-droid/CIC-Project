  note: 'The wars'' own documents for 1429-1436, in Latin, Czech and German, from many hands (Hussite,
    Taborite, Catholic and royal). The Latin includes replies about the four articles, for example Bishop
    Fernandus''s response to the four articles in volume 1. The German headings are Palacký''s; the documents
    are printed in the original languages. Primary original documents, quotable once each is checked against
    the page image: the Latin and German read legibly (word-form coverage against a clean Latin vocabulary
    0.54, lowered by the German and Czech), with occasional letter-level misreads. Documents are by many
    writers and are not one voice; the editor''s German summaries are Palacký''s.'
