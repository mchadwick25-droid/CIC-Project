    note: >
      The complete Wycliffite Bible, ed. Forshall & Madden (1850) - the
      translation project's own collective product, filed under the
      collective-body slug `wycliffite-bible` rather than an individual
      name, since the Earlier and Later Versions are the work of a group
      of translators over time, not Wyclif's own personal composition.
      Around 250 manuscripts of this translation survive, more than of
      any other Middle English text (per this world's own census entry).
      Confirms this world's own Source Readiness Dossier §3 lead is
      genuinely accessible, not just bibliographically real. A very
      large file; word-count not yet extracted.
