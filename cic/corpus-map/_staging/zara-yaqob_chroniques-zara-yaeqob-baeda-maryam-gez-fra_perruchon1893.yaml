  role: tradition
  confidence: assigned
  note: Royal chronicle of the reign that conceded the Saturday Sabbath and persecuted Estifanos's monks.
    The Ge'ez OCR is unusable, so this is a second witness for the Ge'ez wording. The French introduction,
    notes and the appendix of translated extracts are readable. No full French translation is in the volume;
    no public-domain English translation exists (the only English version, Huntingford 1965, is for Amda
    Seyon and in copyright).
