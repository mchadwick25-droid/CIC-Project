  work: Chronicles of Zar'a Ya'eqob and Ba'eda Maryam (Ge'ez text with French introduction and appendix)
  author: zara-yaqob
  locus: Introduction from file line 451; Ge'ez chronicle of Zar'a Ya'eqob from about line 2867; Ba'eda
