    evidence: Mansi tom. 5 prints the acts of the Antiochene bishops' rival assembly at Ephesus under
      the heading "CONCILIABULUM EPHESINUM" (file line 46711; index 325); a council text, no single author.
  synodicon-adversus-tragoediam-irenaei:
    kind: anonymous
    evidence: Mansi tom. 5 prints the Latin dossier "SYNODICON ADVERSUS TRAGOEDIAM IRENAEI" (heading at
      file line 72980; its manuscript source noted at 73060); a sixth-century anonymous compilation built
      around Irenaeus of Tyre's lost Tragoedia, no single author.
