    ecology needs. Books II.9-14 preserve the martyrs of Persia under Shapur II, among the
    best Greek evidence for the early Persian church. III.16 is an independent notice of Ephraim
    and Syriac letters. Books I-IV narrate the Arian/homoian ascendancy; Book VIII is a book-length
    account of Chrysostom. Each id above rests on sustained treatment, not mention.

    '
