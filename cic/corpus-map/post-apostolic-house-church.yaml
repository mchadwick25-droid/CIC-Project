- row_id: suetonius_lives-of-the-twelve-caesars_thomson-forester1909--the-lives-of-the-twelve-caesars
  work: The Lives of the Twelve Caesars
  author: suetonius
  locus: Life of Claudius 25.4 (the 'Chrestus' expulsion notice, c. 49 CE) and Life of Nero
    16.2 (Christians punished, listed among public-order measures)
  role: context
  confidence: assigned
  note: 'Verified directly against the vendored file, matching pahc''s own source record word
    for word: Claudius 25.4 (line 10640) - "He banished from Rome all the Jews, who were continually
    making disturbances at the instigation of one Chrestus"; Nero 16.2 (line 11613) - "He
    likewise inflicted punishments on the Christians, a sort of people who held a new and
    impious superstition." Also confirmed directly: the fire-to-Christians link this world''s
    own records have always treated as Inferential-Thin appears only in this edition''s own
    1909 editorial footnote to ch. 39 (line 20772), never inside Suetonius''s own ch. 16 text
    - a caution the vendored file itself now carries evidence for, rather than one taken on
    faith from secondary description. Context, not tradition: this is external Roman-imperial
    evidence used to corroborate the world''s own "state pressure" gravity/force (pahc.gravity.state-pressure,
    pahc.force.state-pressure), not the house-church movement''s own voice. Both cited passages
    exist in two independently fetched and cross-checked digitizations of the identical 1909
    Bohn printing (Project Gutenberg #6400, vendored; archive.org livesoftwelvecae0000suet_o9f1,
    cross-checked) - see pahc.source.suetonius-lives and pahc.search.suetonius-english-pd
    for the full acquisition history.

    '
  source_file: suetonius_lives-of-the-twelve-caesars_thomson-forester1909.txt
- row_id: tacitus_annals-15-44_church-brodribb1876--the-annals-book-15-chapter-44-the-great-fire-and-nero-s
  work: The Annals, Book 15, chapter 44 (the Great Fire and Nero's punishment of the Christians)
  author: tacitus
  locus: Book 15, ch. 44 entire; about 375 words
  role: context
  confidence: assigned
  note: 'ROLE IS `context`, NOT `tradition`, and deliberately so. Tacitus is a hostile outside
    witness writing c. 116 about events of 64; he is not a voice of the tradition and must
    never be compiled as one. What he supplies is the earliest datable non-Christian notice
    of the group in Rome, and the earliest outside notice that its founder was executed by
    a Roman governor.

    TWO LIMITS RIDE WITH IT. The Medicean MS reads "chrestianos", corrected by a later hand
    to "christianos", and this English prints "Christians" with no note - so nothing here
    can carry a claim about what Romans called this group. And the passage''s authenticity
    (not seriously disputed) is a different question from whether a discrete, fire-linked
    persecution of Christians as a named group happened in 64 (live, non-fringe: Shaw against
    Jones). Vendoring settles the first only.

    '
  source_file: tacitus_annals-15-44_church-brodribb1876.txt
