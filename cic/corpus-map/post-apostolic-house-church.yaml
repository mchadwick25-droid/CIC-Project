- work: The Annals, Book 15, chapter 44 (the Great Fire and Nero's punishment of the Christians)
  author: tacitus
  locus: Book 15, ch. 44 entire; about 375 words
  role: context
  confidence: assigned
  note: 'ROLE IS `context`, NOT `tradition`, and deliberately so. Tacitus is a hostile outside
    witness writing c. 116 about events of 64; he is not a voice of the tradition and must
    never be compiled as one. What he supplies is the earliest datable non-Christian notice
    of the group in Rome, and the earliest outside notice that its founder was executed by
    a Roman governor.

    TWO LIMITS RIDE WITH IT. The Medicean MS reads "chrestianos", corrected by a later hand
    to "christianos", and this English prints "Christians" with no note - so nothing here
    can carry a claim about what Romans called this group. And the passage''s authenticity
    (not seriously disputed) is a different question from whether a discrete, fire-linked
    persecution of Christians as a named group happened in 64 (live, non-fringe: Shaw against
    Jones). Vendoring settles the first only.

    '
  source_file: tacitus_annals-15-44_church-brodribb1876.txt
