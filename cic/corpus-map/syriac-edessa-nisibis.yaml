    rather than minting a second slug. Bardaisan's later condemnation is a fact about him
    the syr world already carries; the work is still Edessene tradition, not outside context.
    bardaisanite-current is added alongside, since the party this work argues with now has
    an entry of its own.
  source_file: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac.xml
- row_id: fleet-sweep-additions-npnf208--the-hexaemeron-homily-ii-on-genesis-1-2
  work: The Hexaemeron, Homily II (on Genesis 1:2)
  author: basil
  locus: the passage crediting an unnamed Syrian with the reading of Genesis 1:2, at file
    line 16729, with the NPNF's own endnote on his identity
  locus_ids:
