  - viii.iii/line12639
  - viii.iii/line12681
  - viii.iii/line12714
  - viii.iii/line12743
  - viii.iii/line12774
  - viii.iii/line12799
  - viii.iii/line12874
  role: context
  confidence: assigned
  language: eng
  note: 'ROLE IS `context`: a Cappadocian bishop is not a voice of this Atlas entry. Its value
    is that he defers, in public, to a Syriac speaker on the sense of a Hebrew verb, on the
    ground that Syriac stands nearer the Hebrew than Greek does - an outsider stating this
    tradition''s own linguistic self-understanding with no stake in flattering it.

    HE NAMES NOBODY, and the volume''s own Victorian apparatus disagrees with itself: Tillemont
    reads Eusebius of Samosata, the Benedictine editors prefer Ephrem Syrus, and modern scholarship
    (per syr.story.basil-legend) says Eusebius of Emesa. Three candidates, no name in the
    text. The passage may be used for what Basil says; never to identify the man.

    '
  source_file: npnf208_basil-letters-select-works.xml
- row_id: chronicle-of-edessa_cowper--the-chronicle-of-edessa
  work: The Chronicle of Edessa
  author: chronicle-of-edessa
  locus: whole work (single-work volume, ~7,960 words; Cowper's JSL translation)
  role: context
  confidence: assigned
  note: 'Civil annalistic record of Edessa - kings, floods, bishops, buildings - from 132
    BC to AD 540, drawn from the city archives. It documents the 201 flood damaging "the temple
    of the church of the Christians" (the earliest dated church building on record) and Bardaisan''s
    birth in 154. Ecology, not theology: the outside sources add an ecology level this world
    needs, but for context, not theology, so it carries role: context on the world it surrounds.
    Christian-authored, but annalistic and civil rather than a voice of the world''s tradition,
    and composed c. 540s, outside the world''s 200-410 frame.

    '
  source_file: chronicle-of-edessa_cowper.txt
