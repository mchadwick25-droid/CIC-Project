    the chapter "Of the siege of the city of Nisibis, and the apostolic conversation of Bishop
    Jacobus" - the church''s own remembered story of the 350 siege (Jacob''s prayer, the gnat
    plague), which places Jacob alive at that siege, one pole of the open 338-vs-350 death-year
    conflict this world already tracks (world_core caution 10). IV.26 (line 15044) states
    "at Edessa flourished the admirable Ephraim" - an independent 5th-century witness to Ephrem''s
    standing, verified verbatim. Context, not tradition: Theodoret writes a century after
    the events, hagiographically shaping the Nisibis narrative (syr.source.theodoret-historia-ecclesiastica).

