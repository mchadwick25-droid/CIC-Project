    window and region), later returned east and claimed as a forefather by the Syriac tradition,
    which the syr world already reaches through his Diatessaron in anf09. Provisional because
    he was also later branded an Encratite; where his voice ultimately sits between the two
    traditions is still an open question needing a ruling. greek-apologists-second-century
    holds this work alongside pahc, for the era''s outward-facing writing; pahc is kept because
    the era and church-world are genuinely its.'
  source_file: anf02_hermas-tatian-athenagoras-theophilus-clement-alexandria.xml
