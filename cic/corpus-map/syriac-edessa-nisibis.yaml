  author: ambrose-hypomnemata
  locus: div2 9.18
  locus_ids:
  - ix.xviii
  - ix.xviii/notes
  role: transmission
  confidence: provisional
  language: eng
  note: 'Syriac form of a Greek apology (parallel to the pseudo-Justin Discourse to the Greeks,
    per the volume''s endnote). It is Christian apologetic, not Edessene as such; syr marks
    only where the Syriac transmission preserved it. This is Greek apologetic that survives
    only in Syriac - the volume''s own headnote says the original was Greek, because the Syriac
    mistranslates it in places, and pairs it with the pseudo-Justin Discourse to the Greeks.
    So greek-apologists-second-century is where the argument belongs, and syriac-edessa-nisibis
    is kept, which is how it reached us. `provisional` because the APOLOGIST half is a date
    question - the entry''s window is 124-200 and this piece is undated - not because the
    Syriac half is in doubt. The `transmission` role - the fourth relation - marks CUSTODY:
    this tradition preserved a work that is not its own voice. The volume''s own headnote
    says the original was Greek, because the Syriac mistranslates it in places. Syriac scribes
    are why it exists at all; the argument in it is not theirs.'
  source_file: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac.xml
- row_id: anan-isho_paradise-v2-sayings_budge1907--the-paradise-of-the-holy-fathers-volume-ii-the-sayings-of-2
  work: The Paradise of the Holy Fathers, Volume II - the Sayings of the Fathers of Egypt
  author: anan-isho
  locus: the recension itself, as a Syriac act of collection and preservation
  role: transmission
  confidence: assigned
  note: 'CUSTODY, NOT VOICE, which is what this role was defined for. The sayings are Egyptian
    and their voices belong to desert-monasticism. This corpus exists in the form the world
    can read because a seventh-century monk of Beth ''Abhe gathered the Syriac versions into
    one book, and because East Syriac scribes went on copying it. The work originates outside
    this entry and this entry''s people are why we still have it - the boundary the role carries.
    Budge translated ''Anan-Isho''s recension, so the English every later reader uses descends
    from that Syriac act of collection rather than from the Greek tradition.

    '
  source_file: anan-isho_paradise-v2-sayings_budge1907.txt
