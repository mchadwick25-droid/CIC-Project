- row_id: palladius_lausiac-history--lausiac-history-4
  work: Lausiac History
  author: palladius
  locus: 'Chapter XL: Ephraim'
  role: context
  confidence: assigned
  note: 'Verified directly against the vendored file (line 471): "You must have heard particulars
    about Ephraim, the deacon of the Church of Edessa..." followed by the famine-relief narrative
    (Ephrem raises money, partitions the porticoes, sets up 300 beds, and nurses Edessa''s
    famine-stricken before his death). Registered mid-ecology when figure work needed the
    earliest witness to this tradition: Palladius (writing c. 420, within living memory of
    Ephrem''s death) and Sozomen III.16 carry the same famine-relief story independently enough
    to corroborate its age, and Palladius directly attests the "deacon of the Church of Edessa"
    title (syr.source.palladius- lausiac-history). Context: a devotionally-shaped outsider
    witness, not Ephrem''s own voice. Cross-build note carried from that record: the same
    vendored file serves the Alexandria and Desert worlds too; only this Ephraim chapter is
    licensed material for syr.

    '
  source_file: palladius_lausiac-history_clarke1918.txt
- row_id: fleet-sweep-additions-budge-v1--the-paradise-of-palladius-book-i-ch-lviij-of-the-blessed-man
  work: The Paradise of Palladius, Book I, ch. lviij (Of the Blessed Man Ephraim)
  author: palladius
  locus: Chapter lviij - the angelic roll, the famine relief, and the vine growing from his
    tongue
  locus_ids:
  - line1289
  - line1293
  - line1295
  role: tradition
  confidence: assigned
  language: eng
  note: 'A SYRIAC WORLD READING ITS OWN FOUNDING POET IN A SYRIAC RECENSION. The divergences
    from the Greek fall exactly where that matters: TWO VISIONS the Greek line does not carry
    at all (the angels finding no saint fit to hold the roll except Ephraim; the vine from
    his tongue filling the heavens while the birds eat and the clusters only grow), and a
    famine exchange whose crucial line reads "O man, we know that thou art God" where the
    Greek reads "a man of God".

    Registered ALONGSIDE the Clarke translation the entry already holds, never in place of
    it.

    '
  source_file: palladius_paradise-v1-syriac_budge1907.txt
