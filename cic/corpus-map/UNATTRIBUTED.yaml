  pseudo-zachariah-rhetor:
    kind: pseudonymous
    evidence: 'The received Chronicle is a composite. Per the vendored 1899 edition''s own
      introduction (lines 255-370, verified against the file): Books III-VI derive from Zacharias
      Scholasticus of Gaza, who studied law together with Severus of Antioch at Alexandria
      and Berytus, wrote his own Ecclesiastical History (covering 450-491) between 491 and
      518, and also wrote a separate Life of Severus defending him - real documentary evidence
      that Zacharias was Severus''s own companion and supporter, not a Chalcedonian outside
      witness, when he wrote this material. The same introduction states he was made bishop
      of Mitylene only "at a later time, conforming perhaps to the Chalcedonian faith" - i.e.,
      any conformity to Chalcedon, if it happened at all, postdates the History itself and
      is presented by the 1899 edition''s own introduction as uncertain ("perhaps"), not as
      settled fact. Books I-II and VII-XII were assembled and continued by a separate, anonymous
      compiler writing c. 569, who used Zacharias'' own material (among other sources) without
      being Zacharias himself. Modern scholarship (Greatrex, Phenix & Horn, The Chronicle
      of Pseudo-Zachariah Rhetor, Translated Texts for Historians 55, Liverpool University
      Press, 2011 - not vendored here, still in copyright) names the whole compilation "Pseudo-Zachariah
      Rhetor" on this same compiler/source distinction.

      Revision 1 of this file additionally claimed the 1899 edition "predates" the modern
      authorship analysis and simply attributes the whole work to Zachariah. This is also
      corrected: the 1899 introduction itself already draws the compiler/Zachariah distinction
      directly ("the name of Zachariah was wrongly attached" to the whole work "by later writers,"
      per Land''s own 1870 analysis, which the 1899 edition cites and follows) - the 1899
      edition''s own title follows the manuscript tradition''s conventional label while its
      own introduction already explains why that label is imprecise. The 2011 TTH edition
      sharpens and formalizes the same distinction the 1899 edition''s own introduction already
      draws; it does not originate it.

      '
    from_file: zachariah-rhetor_chronicle_hamiltonbrooks1899.txt
  pseudo_ignatius:
    kind: pseudonymous
    evidence: 'The volume''s own apparatus at div2 5.13, "Introductory Note to the Spurious
