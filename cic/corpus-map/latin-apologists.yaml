- work: Appendix of poems ascribed to Tertullian (Strains of Jonah, Sodom, Genesis, the Judgment;
    Five Books in Reply to Marcion)
  author: tertullian
  locus: div2 3.11 - Appendix (five verse pieces, div3s)
  role: tradition
  confidence: assigned
  note: 'STRUCTURE.md marks this div2 as apparatus, but the content is ancient pseudo-Tertullianic
    Latin verse, not 19th-c. editorial matter - kept rather than dropped. The "Five Books
    in Reply to Marcion" (Carmen adversus Marcionitas) belongs with the anti-Marcionite material.
    Whether spurious verse files under tertullian at all, and where non-Marcion pieces belong,
    comes down to one principle: nine works across six entries ask the same question, whether
    a spurious corpus files under the attributed name at all. It does, and it also files as
    what it is. Brief 6.2 says derive from the markup rather than re-attribute from outside
    knowledge, so the transmitted-author shelf stands: that is how the corpus presents it
    and how a reader will look for it. apocryphal-and-pseudepigraphal-literature is added,
    because a work circulating under a name that is not its author''s is a pseudepigraphon
    by definition. The two together say the whole truth - where it sits, and what it is -
    without re-attributing anything. This can be reversed in one pass if the spurious corpora
    should be detached from their attributed authors instead.'
