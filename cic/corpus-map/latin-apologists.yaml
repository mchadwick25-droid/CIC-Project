  locus: div2 3.2 — The Divine Institutes
  role: tradition
  confidence: assigned
  note: 'Lactantius lives in `latin-apologists` (I.43): written c. 303-311 under the Great
    Persecution by a rhetor teaching at Nicomedia, who afterwards tutored Constantine''s son
    at Trier. Jerome makes him Arnobius'' pupil at Sicca, and Arnobius is in this entry; the
    Institutes are the fullest Latin defence anyone wrote, and most of the work predates 312.

    This splits the author by work, which is what `per work` means. Lactantius'' apologetic
    corpus is here; *Of the Manner in Which the Persecutors Died* is not. That is the Athanasius
    case the schema names - the Vita Antonii is desert''s and Against the Arians is Alexandria''s,
    one author, two entries, split by work.

    '
  source_file: anf07_lactantius-apostolic-constitutions-didache-liturgies.xml
