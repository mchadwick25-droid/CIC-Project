      garbled in the OCR; Beck''s abridged text, Antiqua and readable) and two English, both of which render
      Zwingli''s hostile Latin translation rather than the German. Any quote record should say which expression
      it rests on, and the English should be checked against the German on the page images. The translator
      credit for the 1901 volume follows its own preface (file lines 49-51 and 109-110): the Latin pieces
      by Henry Preble and George W. Gilmore, the Zurich German pieces by Lawrence A. McLouth.

      '

