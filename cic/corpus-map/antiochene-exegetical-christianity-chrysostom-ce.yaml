  note: The Latin collection of the Antiochene party's correspondence of 431-435 (Theodoret,
    John of Antioch, Alexander of Hierapolis, Irenaeus), the fullest record of the dissent
    and the reunion from the dissenters' own letters. Antiochene voice in a later Latin compilation.
