- row_id: palladius_lausiac-history--lausiac-history-6
  work: Lausiac History
  author: palladius
  locus: 'Chapter LVI (Olympias, file lines 547-549); Chapter XLI (Holy Women: the deaconess
    Sabaniana, aunt of John the bishop of Constantinople, file line 477); Chapter XXXV (Palladius
    "embroiled in the disturbance connected with the blessed John", file line 427); Chapter
    LXI (Palladius''s journey to Rome "because of the blessed bishop John", file line 583)

    '
  role: context
  confidence: provisional
  note: 'Placed for the Antiochene Exegetical Christianity world''s Source Ecology (Doc_02
    section 6), which draws on it for one question: whether Olympias, the deaconess to whom
    much of Chrysostom''s exile correspondence is addressed, is attested by a second author.
    Read directly against the vendored file: Chapter LVI praises her and names her descent;
    Chapter XLI names Sabaniana. The same text shows Palladius is not independent of Chrysostom''s
    circle: Chapter XXXV says he was "embroiled in the disturbance connected with the blessed
    John", and Chapter LXI says he went to Rome "because of the blessed bishop John". `role:
    context`, because he is a partisan of Chrysostom writing about a figure in his circle,
    not an Antiochene voice; `provisional`, because only these four chapters bear on this
    world. The same file stays with the desert, Palestinian, Alexandrian, Edessan and Hieronymian
    assignments above.

    '
  source_file: palladius_lausiac-history_clarke1918.txt
