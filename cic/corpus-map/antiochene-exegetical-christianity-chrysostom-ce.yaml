- row_id: npnf202_socrates-sozomen-ecclesiastical-histories--the-ecclesiastical-history-of-socrates-scholasticus-2
  work: The Ecclesiastical History of Socrates Scholasticus
  author: socrates
  locus: div1 2 — esp. Books I-IV (Arian controversy), IV.23 (Egyptian monks), VI (Chrysostom),
    Novatianist notices throughout
  role: context
  confidence: assigned
  note: 'Same work, context row: movements Socrates describes without belonging to them, each
    with real evidentiary weight. Books I-IV document the Arian/homoian councils and quote
    their creeds (largely via Sabinus'' lost synodical collection) - doctrinal-floor entry,
    described from outside. Socrates is the single richest ancient source for the Novatianists
    (their Constantinopolitan bishops, laws against them, his unusual sympathy - some ancients
    thought him one). Book IV.23-24 is a long account of the Egyptian monks with excerpts
    of Evagrius. Book VI is a primary narrative of Chrysostom''s episcopate and fall. Movements
    merely mentioned are not assigned.

    '
  source_file: npnf202_socrates-sozomen-ecclesiastical-histories.xml
