  role: tradition
  confidence: assigned
  language: eng
  note: 'Alexandrian teacher of the later third century (fl. c. 260); the Hypotyposes fragments,
    Origenian in cast. Whether he headed the catechetical school after Dionysius is an inference,
    not documented fact - ANF6''s notice says only that he is titled exegetes and that "Dodwell
    and others are of opinion" this means the school''s presidency. Two things matter for
    use: he is ABSENT FROM EUSEBIUS entirely (ANF6: "we have no account by either Eusebius
    or Jerome"), so the Eusebius HIGH-risk screen does not apply to him; but all three fragments
    reach us through ATHANASIUS quoting him in post-Nicene anti-Arian polemic (De Decretis
    25; Ep. 4 ad Serapionem 11), which carries its own selection screen. He is also a disciple
    of Origen (ANF6, from Photius), so he cannot lift the Origen SYSTEMIC screen.

    '
  source_file: anf06_gregory-thaumaturgus-dionysius-julius-africanus-methodius-arnobius.xml
