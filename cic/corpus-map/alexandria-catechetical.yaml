  note: 'Peter''s fourteen penitential canons (306) on receiving the lapsed of the Diocletianic
    persecution - the Alexandrian counterpart to Cyprian''s De Lapsis, and the immediate background
    of the Melitian schism (no census entry; noted). The printed text interleaves the 12th-c.
    Byzantine canonists'' commentaries - later material riding inside the section, worth knowing
    for extraction.

    '
