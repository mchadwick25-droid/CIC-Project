  language: eng
  note: 'Despite its title, this vendored text is the Eclogae Propheticae (Selections from
    the Prophetic Scriptures), NOT the genuine Excerpta ex Theodoto (records/alx audit, alx.source.excerpts-of-theodotus.md).
    It carries no Valentinian technical vocabulary (a full-text scan found zero occurrences
    of Pleroma/Sophia/Achamoth/Demiurge/aeon/Ogdoad, and "Theodotus" only in the editorial
    title), and the ANF editor''s own headnote disowns the Clement attribution ("corrupt or
    forged documents, for which Clement''s name has been borrowed"), guessing an unknown Montanist
    compiler instead. It is NOT a Valentinian voice and must not be cited as one; the genuine
    Excerpta ex Theodoto is not vendored anywhere in this corpus.

    '
  source_file: anf08_twelve-patriarchs-clementina-apocrypha-edessa-syriac.xml
