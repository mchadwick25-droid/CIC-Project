  role: tradition
  confidence: assigned
  language: eng
  note: 'Alexandrian presbyter and teacher, called "Origen the younger" by Jerome; fragments
    of his teaching. He is not documented head of the catechetical school - this world''s
    own vendored Eusebius contradicts that reading: HE VII.32 places ACHILLAS over the school,
    and NPNF''s editor concludes Photius'' contrary report "is false and rests upon a combination
    of the accounts of Eusebius and Jerome." Note also how thin this is: one four-line quotation
    preserved in Jerome''s Ep. ad Pammachium, plus a hostile Photius summary (Bibl. cod. 119).

