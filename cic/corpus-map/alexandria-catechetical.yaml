  note: 'Verified directly against the vendored file (line 211): "Among these was Didymus
    the blind author. I met him four times in all, visiting him at intervals during a period
    of ten years... He was blind, having lost his sight at the age of four, so he told me,
    and he had never learned to read nor gone to school." An outsider-visitor''s eyewitness
    vignette (Palladius wrote c. 419-420, at the horizon''s edge) used in alx ONLY for this
    personally-witnessed Alexandria-adjacent material, never for received desert accounts,
    which stay this candidate''s own cross-build attribution question (alx.source.palladius-lausiac-
    history). Context, not tradition: an outsider''s late testimony about the man, not the
    catechetical tradition''s own texts.

    '
