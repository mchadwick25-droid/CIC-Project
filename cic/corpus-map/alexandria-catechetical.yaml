  note: 'Doctrinal fragments of Peter, bishop of Alexandria (300-311) and martyr. He is not
    documented as head of the catechetical school - nothing in the vendored material attests
    that: the whole anf06 div1 ix division nowhere links Peter to the school, and both its
    introductory notices call him bishop, martyr, and a diligent student of Scripture only.
    The school-headship tradition descends from Philip of Side, which is not vendored here.
    Fragment VI ("Of the Soul and Body") is his demonstration against the pre-existence of
    souls - pre-Nicene Alexandrian episcopal boundary-drawing against Origen - but reaches
    us via the Sacra Parallela, a 7th-8th c. florilegium.

    '
