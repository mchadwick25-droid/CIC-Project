  note: 'John''s own contemporary account of Justinian- and Justin II-era persecution of the
    Miaphysite party from the persecuted side, and the only substantial surviving portion
    of his three-part Ecclesiastical History (Parts I-II survive only in excerpts preserved
    by others). A primary administrative/political-history counterpart to the Lives'' more
    personal, biographical register.

    Directly verified against the file (lines 11905-12080): Book III.36-38, John''s own commissioned
    mission (542 CE, under Justinian) to the still-largely pagan hill country of Asia, Caria,
    Lydia and Phrygia. Confirms: the mountain temple at Derira near Tralles converted into
    the chief of four new monasteries; twenty-four new churches built in Tralles'' territory;
    imperial funding from Justinian; a jurisdiction dispute with the bishop of Tralles resolved
    in John''s favor by the emperor directly. This is the same John who elsewhere in this
    world''s sources (Lives, ch. 49) is himself a persecuted Miaphysite bishop - the double
    position the census''s own second documented story names directly.

    The Preface (p. vii, lines 210-224) states the mission''s own headline number - "in the
    space of four years he baptized no less than seventy thousand persons" - and directs the
    reader to "the 230th and following pages" (i.e., this same III.36 passage) for John''s
    own fuller account. This build confirmed the narrative at that locus but did not find
    the number "seventy thousand" restated within III.36-38 itself as checked; it is the 1860
    editor''s own summary of John''s count, not yet independently pinned to an exact sentence
    in John''s own narrative voice within this volume. Treat as editorially-attested pending
    a closer pass (it may sit in II.44, which does not survive in this volume, or later in
    III past the stretch checked here).

