    Directly verified against the file, not assumed from a summary: ch. 49, "The Forty-Ninth
    History, of the Blessed James the Bishop and Brave and Valiant Combatant" (line 26185),
    is the portrait of Jacob Baradaeus - Brooks'' translation renders his name "James," not
    "Jacob," a naming variance any record citing him should carry forward. The chapter confirms:
    his origin at Thella and training at the monastery of "Psiltha"/"Fsiltha" (OCR-uncertain
    vowel; matches the modern scholarly "Pesilta"); c. 15 years'' quiet residence at Constantinople
    under the believing queen''s (Theodora''s) protection before consecration; joint consecration
    with a second bishop, Theodore, for "Hirtha of the Saracens" (the Ghassanid capital),
    confirming the Ghassanid-Arab federate connection; and, in the footnote at line 26301,
    the direct etymology of his nickname: "Prom [From] this attire he got the nickname ''Burd''ava''
    or ''Burd''ana'' (the man of the patchwork garment)" - confirming "Baradaeus" derives
    from a real, attested patchwork/felt garment, cut by James himself from "one thick and
    ugly cloak of withes" for both clothing and covering. The census''s own pre-drafted story
    ("The Bishop in the Horse-Blanket") calls this garment a "horse-blanket"/"horse-cloth"
    - that specific image is not what this passage itself says (it describes a cut cloak,
