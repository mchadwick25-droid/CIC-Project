    formation_confidence: Widely Accepted
  note: 'Augustine''s summary of the three-day Conference of Carthage of 411, held on the
    emperor Honorius''s order between Catholic and Donatist bishops, cut down from the very
    long acts and numbered to match their parts. It gives this world the Catholic side''s
    own short account of the conference at which the Donatist bishops were judged defeated.
    No English translation is vendored. The editor writes that no manuscript has been found
    since the Amerbach edition, so the text rests on the printed editions. PRIMARY ORIGINAL
    per cic/texts/INTAKE.md: Petschenig''s critical text (CSEL 53, Vienna, 1910). The scan
    is raw, uncorrected OCR of a dense critical edition with the apparatus interleaved (the
    file''s own header and registry notes say so; about 88 to 90 percent of its word forms
    match the vocabulary of the clean TEI files, against 93 to 97 percent for those). So this
    row is primary for authorship and content, and a second witness for exact wording: each
    quote is checked against the printed page or a clean witness before it is used, and the
    English a Representative speaks is rendered from the verified Latin.

    '
