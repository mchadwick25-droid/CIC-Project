  note: '428/429, to Prosper and a correspondent named Hilary, against the objections of the
    Gallic monks. NPNF prints two distinct treatises under one div1; this is the first. Split
    per the granularity rule for headings holding several distinct works. Directly addressed
    to Prosper of Aquitaine and Hilary, this is the opponent''s-side documentation of the
    Gallic monastic-ascetic entry''s own controversy over grace and predestination (era 2,
    c. 360-450). This Hilary''s identity is Contested, not "Hilary of Arles" — see the identity
    note on the Rebuke and Grace row above; npnf105''s own apparatus favors "Hilary of Sicily,"
    a genuine rival to this world''s own preferred Gallic-lay-monk reading (Doc_01 §10), not
    a confirmation of it.

    '
