  author: augustine
  locus: Pars III (CSEL 53); file line 71496 (heading 'SERMO' at 71494, 'AD CAESARIENSIS ECCLESIAE
    PLEBEM.' at 71496)
  locus_ids:
  - sermo-ad-caesariensis-ecclesiae-plebem
  - sermo-ad-caesariensis-ecclesiae-plebem/sectio1
