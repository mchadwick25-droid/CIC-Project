  note: 'PRIMARY ORIGINAL per cic/texts/INTAKE.md: Morin''s first edition (Kempten and Munich,
    1917), in a readable OCR scan of a microfilm copy (0.83 to 0.88 of word forms found in
    a vocabulary test against the clean TEI Augustine files, against 0.93 to 0.96 for the
