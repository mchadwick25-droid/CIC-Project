    formation_confidence: Widely Accepted
  note: 'Augustine''s reply to the Donatist bishop Petilian of Cirta, whose letters on baptism
    and the true church accused the Catholics of being traitors and persecutors. Book I is
    Augustine''s short letter to Catholics answering the first part of Petilian''s letter,
    book II answers the whole letter point by point, and book III answers Petilian''s angry
    second letter (the editor''s Praefatio). The Latin original of \"Answer to the Letters
    of Petilian\" in the vendored npnf104, so a cross-check on that English. Petilian''s own
    words survive quoted inside Augustine''s replies: embedded voice, the work itself is Augustine''s.
    PRIMARY ORIGINAL per cic/texts/INTAKE.md: Petschenig''s critical text (CSEL 52, Vienna,
    1909). The scan is raw, uncorrected OCR of a dense critical edition with the apparatus
    interleaved (the file''s own header and registry notes say so; about 88 to 90 percent
    of its word forms match the vocabulary of the clean TEI files, against 93 to 97 percent
    for those). So this row is primary for authorship and content, and a second witness for
    exact wording: each quote is checked against the printed page or a clean witness before
    it is used, and the English a Representative speaks is rendered from the verified Latin.

    '
