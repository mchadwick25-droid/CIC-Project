- row_id: pl11-zeno-optatus-collatio-carthaginiensis_migne--gesta-collationis-carthaginiensis-acts-of-the-411-conference
  work: Gesta Collationis Carthaginiensis (Acts of the 411 Conference of Carthage)
  author: collatio-carthaginiensis
  locus: the Collatio cluster, from col. 759 on
  role: context
  confidence: provisional
  language: lat
  date:
    start: 411
    end: 411
    source: 'mansi_sacrorum-conciliorum-collectio-tomus-4 header: Gesta collationis Carthaginensis
      of 411'
    formation_confidence: Widely Accepted
  note: 'The official acts of the imperially-convened 411 conference between Catholic and
    Donatist bishops — the single largest documentary record of the two sides in direct confrontation,
    previously entirely absent from this corpus in any language. Marked context (an official
    proceeding record, not either side''s own composed voice) consistent with how this entry
    already treats the Optatus appendix and Council acts; provisional because the Donatist
    bishops'' own recorded speech inside these acts may deserve separate tradition-role consideration.
    Also assigned to latin-pastoral-congregational-christianity (Source_Registry.md row 65,
    which resolves that row''s own flagged cross-world resource question): Augustine speaks
    in his own words in at least fourteen numbered acts of these proceedings, a live primary-voice
    route this world''s own Registry names but does not yet use.

    '
  source_file: pl11-zeno-optatus-collatio-carthaginiensis_migne.txt
