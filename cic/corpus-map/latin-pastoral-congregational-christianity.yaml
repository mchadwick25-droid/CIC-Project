    The four parts partition the 168 with no overlap. This part is exact: every letter whose
    title names Jerome, in both directions. `tradition` for BOTH entries deliberately - the
    exchange contains Jerome''s own letters, which are the Hieronymian world''s voice, and
    Augustine''s, which are the Latin pastoral world''s. A two-sided correspondence has voice
