  note: 'The record of the 418 debate at Caesarea in Mauretania between Augustine and the
    Donatist bishop Emeritus, before the bishops of the province and the congregation, with
    Augustine''s own introduction. The editor cites the Retractationes (II 77) for it, and
    notes that its opening words differ between the Retractationes and the manuscript, which
    he follows; the one late manuscript is the same as for the Sermo. It gives this world
    a face-to-face exchange with a Donatist bishop, as far as the Catholic side reports it.
    No English translation is vendored. PRIMARY ORIGINAL per cic/texts/INTAKE.md: Petschenig''s
    critical text (CSEL 53, Vienna, 1910). The scan is raw, uncorrected OCR of a dense critical
    edition with the apparatus interleaved (the file''s own header and registry notes say
    so; about 88 to 90 percent of its word forms match the vocabulary of the clean TEI files,
    against 93 to 97 percent for those). So this row is primary for authorship and content,
    and a second witness for exact wording: each quote is checked against the printed page
    or a clean witness before it is used, and the English a Representative speaks is rendered
    from the verified Latin.

    '
  source_file: augustini_scripta-contra-donatistas-pars-i-iii_petschenig1908-1910.txt
