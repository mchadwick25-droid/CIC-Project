- id: groen-ongeloof-en-revolutie.p3
  subject: On the Revolution and its remedy
  where: Lecture XI, point g
  lines: [10547, 10562]
  printed_page: p. 260
  original: >-
    g. Ongeloof is het beginsel , het geneesmiddel hgt dus in hel geloof. — Er is geen reden voor moedeloosheid,
    zoolang het proefhoudend geneesmiddel niet beproefd is en bij de hand ligt. Men verbreke den revolutionairen
    cirkel; men bekeere zich tot God, wiens waarheid alleen tegen de kracht van den leugen bestand is.
    Zoo iemand deze gewigtigste les der historie meer voor gemoedelijke verzuchting dan voor raad- geving
    der staatkunde houdt, hij vergeet dat het vermogen van het evangelie om orde en vrijheid en welvaart
    te bewer- ken, door de wereldhistorie gestaafd is. Hij bedenke dat al wat den mensch nuttig en heilrijk
    is, door de vreeze Gods bevorderd, door de verloochening Gods tegengewerkt wordt. Hij bedenke vooral
    dat de revolutionaire theorie ontvouwing der ongeloofskiem was, en dat de giftige plant, door geloofs-
    verzaking gekweekt, in de atmosfeer van geloofsherleving verkwijnt en verstikt.
  page_image:
    host_item: ongeloofenrevolu00groe
    url: https://archive.org/download/ongeloofenrevolu00groe/page/n285.jpg
