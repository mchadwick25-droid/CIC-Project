  rendering: >-
    The Reformation could not have been the cause of the Revolution, because it started from an opposite
    principle. It started from objective unity of faith, not from the variety of subjective opinions.
    It started from the infallibility of Revelation, not from the supremacy of reason. It started from
    the sovereignty of God, not from the sovereignty of man. The Reformation put an end to the confusion
    of the Middle Ages and protected against the domination of unbelief. Through the lessening and near
    disappearance of its influence, Europe became ripe for the Revolution. There is only one means of
    life and revival, for the peoples too: the Word of Life. Let us recognise in the blessed working of
    the Reformation the fulfilment of the prophecy: “My Word will do what pleases Me, and it will prosper
    in what I send it for.”
  second_rendering: >-
    The Reformation cannot have been the cause of the Revolution, because it started from an opposite
    principle. It started from objective unity of faith, not from the variety of subjective opinions.
    It started from the infallibility of Revelation, not from the supremacy of the intellect. It started
    from the sovereignty of God, not from the sovereignty of man. The Reformation put an end to the confusion
    of the Middle Ages and gave protection against the domination of unbelief. Through the lessening and
    near disappearance of its influence, Europe became ripe for the Upheaval. There is only one means
    of life and revival, for the nations as well: the Word of Life. Let us recognise in the beneficial
    working of the Reformation the fulfilment of the prophecy: "My Word will do what pleases Me, and it
    will succeed in that for which I send it."
  uncertain:
  - original: de oppermagt des verstands
    first: the supremacy of reason
    second: the supremacy of the intellect
    note: >-
      Set against Revelation, verstand is human reason claiming the last word. Groen writes verstand,
      not rede.
  - original: de heilvolle werking der Reformatie
    first: the Reformation’s work of blessing
    second: the beneficial working of the Reformation
    note: >-
      The first keeps the religious weight of heil but turns werking (working, effect) into “work”. The
      second keeps werking but flattens heil. The rendering has “blessed working”.
