  original: >-
    Thans zijn wij aan den aanvant»- der ontwikkeling van mijne lioordgedaclite ; namelijk dat de oorzaak
    der Revolutie in het ongeloof ligt. Met al haar verscheidenheden van theoretische en prakli- kale
    rigtingen en gedaanten , is de Revolutie gevolg, toepassing, ontplooijing van het ongeloof. Door theoretisch
    en praktikaal ongeloof werd de filozofie en de revolutie der IB^ eeuw gevormd. Eene geheele reeks
    van dwaalbegrippen en gruwelen moest volgen op een reeks van syllogismen, toen eenmaal het on- geloof
