  rendering: >-
    Unbelief is the principle, so the remedy lies *in faith*. There is no reason to lose heart as long
    as the proven remedy has not been tried and lies at hand. Let people break the revolutionary circle.
    Let them turn to God, whose truth alone can stand against the power of the lie. Someone may take this
    weightiest lesson of history more for a pious sigh than for political counsel. If so, he forgets that
    world history has confirmed the gospel’s power to bring about order and freedom and prosperity. Let
    him consider that everything useful and full of blessing for man is furthered by the fear of God and
    hindered by the denial of God. Let him consider above all that the revolutionary theory was the unfolding
    of the seed of unbelief. Above all let him consider that the poisonous plant, grown by the forsaking
    of faith, withers and suffocates in the atmosphere of a revival of faith.
  second_rendering: >-
    Unbelief is the principle, so the remedy lies in faith. There is no reason to lose heart as long as
    the proven remedy has not been tried and lies at hand. Let the revolutionary circle be broken. Let
    people turn to God, whose truth alone can stand against the power of the lie. Someone may take this
    weightiest lesson of history more for a pious sigh than for political counsel. He forgets that world
    history has confirmed the power of the gospel to bring about order and freedom and prosperity. Let
    him consider that everything useful and wholesome for man is furthered by the fear of God and thwarted
    by the denial of God. Let him consider above all that the revolutionary theory was the unfolding of
    the seed of unbelief. Let him consider that the poisonous plant, grown by the abandonment of faith,
    withers and suffocates in the atmosphere of a revival of faith.
  uncertain:
  - original: nuttig en heilrijk
    first: useful and full of blessing
    second: useful and wholesome
    note: >-
      Heilrijk is built on heil (salvation, well-being, blessing). “Wholesome” keeps only the well-being.
