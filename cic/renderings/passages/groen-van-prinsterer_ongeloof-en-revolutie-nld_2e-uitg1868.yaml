  rendering: >-
    We are now at the start of setting out my main thought: namely, that the cause of the Revolution lies
    in *unbelief*.

    With all its varieties of theoretical and practical tendencies and forms, the Revolution is the consequence,
    the application, the unfolding of unbelief. Theoretical and practical unbelief formed the philosophy
    and the revolution of the eighteenth century. A whole series of false ideas and atrocities *had* to
    follow upon a series of syllogisms, once unbelief had the upper hand.
  second_rendering: >-
    We now stand at the beginning of the development of my main thought: namely, that the cause of the
    Revolution lies in unbelief.

    With all its varieties of theoretical and practical tendencies and forms, the Revolution is the consequence,
    the application, the unfolding of unbelief. The philosophy and the revolution of the eighteenth century
    were formed by theoretical and practical unbelief. A whole series of false ideas and atrocities had
    to follow upon a series of syllogisms, once unbelief had the upper hand.
