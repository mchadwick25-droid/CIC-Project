- unit: Lecture XV
  title_as_printed: BESLUIT
  lines: [16488, 17157]
  label: Signs of the times; the Netherlands since 1780
  covers: >-
    Groen begins his second topic, the signs of the times, and says he offers no prophecy, only the main
    features already visible. He lists four: the strength of conservative ideas, the radical principle's
    advance, the Roman church's activity, and the revival of Christian faith. He fears new outbreaks of
    Communism and Socialism, which could lead to every kind of terror and despotism. He warns that, through
    a union of Jesuit and Jacobin opinions, ultramontanism could perhaps one day become the state's civil
    religion. Of three possible futures he thinks it most likely that the present is a pause before an
    unequalled struggle between light and darkness. On his third topic, the Netherlands, he denies that
    foreign force alone led the Dutch astray, and blames their own abandonment of the faith. He says the
    constitution of 1815 foretold the revolution of 1830, and that the nation shared the king's guilt.
    He ends by calling the Dutch conservative system since then the Revolution continued, a 'revolutionary
    autocracy'.
  notable_footnotes: >-
    A long later note at 16492-16609, belonging to the section before, calls popular sovereignty under
    the name of nationality the root of present international law. A note at 16644-16691 and 16719-16728
    treats Socialism as the Revolution's economics, quoting Tocqueville, Chalmers and v. Ketteler. A note
    at 16767-16769, 16778-16818 and 16830-16839 says the Papacy is not the Antichrist, and that a state-run
    church is more dangerous than ultramontanism. A note at 16932-16942 and 16960-16988 gives predictions
    of coming despotism; one at 17085-17098 quotes Bilderdijk on the union with Belgium.
  scan_note: >-
    In 16488-16616 the main prose stands only at 16489-16491, 16517-16519, 16568-16573 and 16612-16616.
    A year at 16994 cannot be read, and the year in v. Ketteler's title cannot be trusted.
