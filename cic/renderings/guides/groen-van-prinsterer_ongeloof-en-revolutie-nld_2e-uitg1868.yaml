- unit: Title page and Note on the second edition
  title_as_printed: ONGELOOF EN REVOLUTIE.
  lines: [13, 69]
  label: Title page and second-edition note
  covers: >-
    A digitizer's notice, the half title and the title page come first. The title page calls the book
    a series of historical lectures and gives the author, Amsterdam, the publisher and 1868. A short signed
    note for the second edition follows, dated July 1868. Groen says the book had barely appeared when
    the Revolution of 1848 broke over Frankrijk and Europa. He says the text is almost unchanged, while
    the notes now draw on his later writings and twenty revolutionary years. He says his Christian-historical
    or anti-revolutionary conviction has grown stronger. He claims modern society, for all its merits,
    now serves the theory of unbelief and is drawn ever further toward denying the living God.
  scan_note: >-
    The scan garbles much of the title page, and the printer's line at 45 cannot be read. Line 48, the
    opening of the note, is garbled, and line 51 prints the year 1848 wrongly.
