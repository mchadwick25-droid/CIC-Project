- unit: Lecture VII
  title_as_printed: HERVORMING.
  lines: [5858, 6333]
  label: The charge against the Reformation answered
  covers: >-
    Groen asks whether the Reformation caused the Revolution. Almost all truly Roman-minded Catholics
    blame it for raising the sovereignty of reason, he says; liberals praise it as the start of free inquiry.
    He grants that the charge stands if the Reformation rests on free inquiry, but he calls that premise
    false. He says the Reformation preaches a freedom grounded in submission to God's Word and to every
    authority derived from God. Its doctrine, drawn from the Bible, is not revolutionary, he argues: it
    teaches man's corruption, humble service and a citizenship in heaven. Turning to its working, he asks
    for impartial study, because he fears Rome's slander often makes well-meaning Protestants doubt. He
    says people overlook the obedience and patience of the Reformers, and he takes Luther as his example.
    He blames the wars on force used by the Roman church with worldly power, and argues the Reformation
    put out the Peasants' War (Boerenkrijg).
  notable_footnotes: >-
    A note at 6040-6042, running on at 6074-6081, rejects a view held even by believing Protestants. The
    view is that Protestantism stands for liberty and Rome for authority. The note quotes Le parti antirév.
    and Luthardt.
  scan_note: >-
    The length of the persecution at 6292 is garbled, so do not rely on a number. An author's name at
    6272 cannot be read. The title at 5884 is garbled, and at 6235 both the author's name and the title
    are garbled.
