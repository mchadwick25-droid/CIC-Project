- unit: Lecture VIII
  title_as_printed: ONGELOOF.
  lines: [7310, 7738]
  label: 'Sovereign Reason: from deism to hatred'
  covers: >-
    Groen sets out to show that the Revolution is systematic unbelief, in religion and in politics together.
    He says eighteenth-century philosophy began from the sovereignty of Reason and ended in denial of
    God and materialism. Reason became the test of revelation, he argues, so each Christian doctrine was
    explained away. He says giving up the gospel leads first to a 'Christian deism', and that nobody can
    rest there. He cites Pascal, de la Mennais and Bossuet for the view that deism is disguised atheism.
    He argues that morality cannot stand without faith in God, because duty then rests only on self-interest.
    Many want to stop halfway, he says, but those who go furthest win, because they follow the accepted
    principle. He calls hatred of the gospel the mark of the Revolution, and then announces the turn to
    state law.
  notable_footnotes: >-
    A long note at 7494-7503 quotes Vinet against a morality independent of religion. A note at 7585-7586,
    running on at 7617-7626, cites Grondwetherz. en Eensgezindheid: where there is no faith in the living
    God, socialists, communists and atheists are right. A long note at 7680-7717 says unbelief turns into
    a religion of humanity, with its own state religion.
  scan_note: >-
    At 7591 one word in the list of English writers cannot be read with certainty. The Bible references
    at 7542-7543 are partly garbled, and Renan's name at 7545 is printed as 'Kenan'.
