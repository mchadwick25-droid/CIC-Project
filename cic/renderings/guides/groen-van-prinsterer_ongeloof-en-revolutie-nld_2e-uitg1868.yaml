- unit: Lecture IV
  title_as_printed: HISTORISCHE STAATSVORMEN
  lines: [3564, 3800]
  label: Value of the old forms; reform possible
  covers: >-
    Groen appeals against the revolutionary verdict on the European form of state. He compares it first
    with earlier forms, then with the hopes of ancient thinkers. Of the Asian monarchies he grants that
    critics exaggerate, yet he ranks the European forms higher, under the influence of Christian principles.
    He admires the energy of the ancient republics in trade and war, but finds them torn by parties and
    ending in tyranny. He argues that Europe joined respect for right and freedom to a firm single authority,
    which the ancients had wished for. A throne built on popular sovereignty, he says, needs despotism,
    while in England a firm throne has sheltered freedom. He concludes that faults in the forms of state
    did not cause the Revolution and that reform would have been possible. He grants that the old Dutch
    constitution had decayed, yet holds that improvement was possible there too on the historic foundations.
  notable_footnotes: >-
    A bracketed note at 3733-3736 says Dutch history with the House of Orange shows a monarchy imbued
    with a republican spirit from its origin. The note at 3761-3777 gives Burke's reproach to the French
    in English.
  scan_note: >-
    Groen's concluding paragraph opens at 3721-3726, is broken by footnotes, and continues at 3739. The
    text mark for the Cicero note at 3690-3692 is lost at line 3678. The bracketed note at 3733-3736 has
    no mark.
