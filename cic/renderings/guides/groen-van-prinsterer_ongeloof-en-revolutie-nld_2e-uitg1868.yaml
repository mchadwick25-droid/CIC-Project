- unit: Lecture II
  title_as_printed: DE WETENSCHAP TEGEN DE REVOLUTIE.
  lines: [1073, 1406]
  label: Witnesses from Scripture, history and earlier ages
  covers: >-
    Groen says most of his countrymen do not share his principles, which sometimes brings a feeling of
    isolation. He wants to show that thoughtful learning in all ages testifies against the revolution's
    constitutional law. He calls the Bible the book of books in the anti-revolutionary library, though
    he does not seek an encyclopedia in it. He grants that the revolutionary theories appealed to history,
    seemingly with reason, but says newly known sources now refute them. He appeals to the ancients, naming
    Aristoteles, Plato and Cicero, and compares the revolutionary theory only to the Sophists. One-sided
    study of antiquity did harm, he grants, but he calls it republican harm, not revolutionary. Apart
    from Descartes and some English scholars, he says, hardly any light of learning before the revolution
    honoured such ideas. He holds that the eighteenth-century theories were unheard of before, so the
    age stands alone in world history.
  notable_footnotes: >-
    A note at 1344-1346 belongs to the Sophists passage. His phrase 'corrupters of state and people' may
    be too sharp beside Grote's judgment, he says. The scepticism of Protagoras and others, he adds, is
    beyond doubt.
  scan_note: >-
    The author's name in the footnote at 1223-1224 is garbled; it is probably Renan, but this is not certain.
    The article number at line 1174 cannot be confirmed from the scan.
