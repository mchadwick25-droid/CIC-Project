- unit: Lecture X
  title_as_printed: DE REVOLUTIE-LEER IN STRIJD MET NATUUR EN REGT.
  lines: [9422, 10101]
  label: The absolute state and five charges
  covers: >-
    Groen says one thread runs through every period: the absolutism of the revolutionary state. Its defenders,
    he says, answer that the system is a set of guarantees, since all power comes from the people. Groen
    replies that this assumes man is good by nature and that clever forms can force bad wills into harmony.
    In practice, he says, popular sovereignty falls to whichever faction rises above the people. He then
    brings five charges, a to e; the first is that this absolutism destroys individual liberty by right.
    Through long quotations from Dumont he argues that the Declaration of 1789 takes back each right as
    it grants it. He adds that political liberty ends in minority rule, that this power has no limits,
    and that it conflicts with national interests. Last, he says only a return to the sovereignty of God
    can end it, and he closes with Bible passages.
  notable_footnotes: >-
    A long note at 9500-9520 says the danger of the age lies in this idea of the state, and quotes Albert
    de Broglie and Renan. A note at 9861-9864 grants that political liberty is still needed to protect
    civil rights. Notes at 9968-9970 and 9972-9981, running on at 9999-10006, set the nation, grown from
    its own history, against the liberal state made by the lawgiver. A bracketed note at 10095-10099 says
    true freedom begins with submission to the laws on which state and society depend.
  scan_note: >-
    The French passage at 9655-9707 mixes articles of the Declaration with Dumont's comment. The year
    in the footnote at 9596 cannot be read. The letter of point b prints as 'h.' at 9846, and that of
    point c as 'r.' at 9907.
