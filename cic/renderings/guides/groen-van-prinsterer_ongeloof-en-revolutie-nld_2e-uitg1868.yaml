- unit: Lecture I
  title_as_printed: INLEIDING.
  lines: [465, 675]
  label: The subject chosen and its terms defined
  covers: >-
    Groen states his subject: since the revolution ideas arose, events have their cause in the natural
    growth of those ideas. He chose it after looking at what has happened in the Netherlands since 1795.
    He describes decline in trade, in political forms, in social order and in agreement about religion
    and law. Forms of government, circumstances and persons do not explain this, he argues; the cause
    lies in the ruling ideas. By Revolution he means the overturning of thought and attitude across Christendom,
    not one change of rulers or only the storm in France. By revolution ideas he means liberty and equality,
    popular sovereignty, social contract and remaking society by agreement. He argues that strict application
    leads to absurdities and atrocities, while moderation that keeps the principle ends in wavering and
    arbitrary rule. Only the anti-revolutionary ground, where right rests on God's law, allows a real
    fight, he says.
  scan_note: >-
    The French quotation at 600-605 gets its author only in the note at 620. The note for line 674, a
    German sentence signed Stahl, is printed at 699-700 in the next section. The year and page in the
    footnote at 659-662 are not certain.
