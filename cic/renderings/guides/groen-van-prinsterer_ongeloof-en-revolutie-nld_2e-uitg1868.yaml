- unit: Lecture XIII
  title_as_printed: SCHRIKBEWIND.
  lines: [14022, 14442]
  label: Robespierre as Rousseau's pupil; the lesson
  covers: >-
    Under point d Groen shows the kinship of philosophy and practice in Rousseau and Robespierre, whom
    he calls Rousseau's pupil and copy. He sets Rousseau's sovereign people beside the constitution of
    1793, and Rousseau's civil religion beside the feast of the Supreme Being. He says the aim of Robespierre's
    dictatorship was to realise Rousseau's ideal, which explains his three sets of enemies. Robespierre
    fell, he says, to worse men than himself, in some measure as a victim for a first return to less barbarous
    rule. Groen then draws the lesson of 1789 to 1794, and calls it idle to say the Revolution came only
    from anger at abuses. He calls the charge that Luther fathered Voltaire and Marat slander, because
    Luther submitted to Holy Scripture, not to reason. He lays the heaviest blame on those who shook faith
    in Revelation. He names falling away from Christ as the cause of the Revolution, and confession of
    the one Saviour as the remedy.
  notable_footnotes: >-
    A long note at 14065-14075 quotes Laboulaye: the Contrat Social holds the theory of the revolution.
    Notes at 14266-14280 and 14305-14319 say Robespierre would go no further than Rousseau, quote Nodier
    and Croker, and see a prelude to Bonaparte. The closing footnote at 14379-14440 says later praise
    of the Terror prepared a new outbreak, and quotes Stahl at length on Robespierre and democracy.
  scan_note: >-
    The year at 14184 is garbled, and the year of the outbreak at 14380 prints as '1818'. The lecture
    ends in a long footnote, 14379-14440.
