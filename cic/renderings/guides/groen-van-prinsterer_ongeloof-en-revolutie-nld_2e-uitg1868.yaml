- unit: Lecture XV
  title_as_printed: BESLUIT
  lines: [16190, 16487]
  label: The law of nations under the Revolution
  covers: >-
    Groen opens with four topics: the law of nations, the signs of the times, the fatherland in the revolutionary
    era, and personal calling. He argues that the new law of nations rests on revolutionary principles,
    so no treaty or acquired right is safe and superior force decides. From the revolutionary point of
    view, he says, the conduct of the Convention and of Napoleon was lawful and matched the theory. He
    argues that the other powers, England excepted, were not anti-revolutionary up to 1813, and so made
    the Revolution more terrible. He says they approved its principle, fought only its excesses, and treated
    the revolutionary government as France itself, not as a faction. Half of Europe's subjection to French
    force he blames largely on the same errors; coalitions failed through self-interest, and Britain's
    leaders alone saw the danger. From 1815 to 1830, he says, the governments based the law of nations
    on moderate liberal ideas, and traded nations like goods. After the July revolution, he says, they
    hurried to recognise the new power, and gave up the Dutch people's rights to rebel Belgium.
  notable_footnotes: >-
    Notes at 16294-16308 with 16337-16340, and at 16342-16351, quote Burke, who fought France as a faction
    and not as a state. The first also names v. Gentz and Mallet du Pan, and quotes Thorbecke. A note
    at 16378-16389 says Pitt too understood the harm of Jacobinism under any form of state. A note at
    16424-16430 and 16463-16469 calls the French rule of non-intervention after 1830 a play on words,
    and quotes Stahl and Guizot.
  scan_note: >-
    Lines 16195-16201 are badly garbled, though the four topics can be made out. The English in the Burke
    and Pitt notes is full of OCR faults.
