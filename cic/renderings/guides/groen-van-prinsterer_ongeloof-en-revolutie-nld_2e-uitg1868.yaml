- unit: Lecture VII
  title_as_printed: HERVORMING.
  lines: [6334, 6935]
  label: 'Two theses: faith checked unbelief, then faded'
  covers: >-
    Groen stops defending and states two theses. First, he says, the Reformation checked revolutionary
    unbelief in the sixteenth century. Second, that unbelief won in the eighteenth century only because
    the spirit of the Reformation grew faint. Roman Catholic writers, he says, picture a quiet Europe
    into which the Reformation threw unbelief; Groen answers that the opposite is true. He says Rome's
    own state law carried the seed of unbelief, but adds that he does not blame Rome alone. He grants
    that a century of religious war followed, yet holds that the Reformation blessed Europe until evangelical
    faith grew faint. He explains how its influence was lost among Roman Catholics, and says Protestants
    are not cleared: their faith almost dissolved into polemics. He concludes that the Reformation could
    not cause the Revolution, because it started from God's sovereignty, not man's.
  notable_footnotes: >-
    A note at 6731-6742 describes Groen's own protest to the Synod and sets out what he has defended since
    1837. A note that starts at 6744-6749 and runs on at 6777-6790 quotes Stahl on church discipline:
    firm in principle, mild in practice. A note at 6825-6830 quotes Stahl on the period of rigid orthodoxy
    in the Lutheran church. A short note at 6387-6390 gives the Roman Catholic view, from De la Mennais,
    that Groen rejects.
  scan_note: >-
    Line 6355, where the two theses begin, is rough; the restatement at 6843-6846 is clear. In the note
    at 6731-6738 the title and the years are garbled.
