- unit: Lecture II
  title_as_printed: DE WETENSCHAP TEGEN DE REVOLUTIE.
  lines: [1407, 1922]
  label: Modern witnesses from Burke to Bilderdijk
  covers: >-
    Groen turns to the time when the Revolution triumphed. He says the truth always had confessors, but
    the champions of the new wisdom shouted them down and kept their writings unknown. In England contradiction
    had the upper hand; he thanks Pitt and Burke above others, and lists four of Burke's writings to reread.
    He names von Gentz as Germany's leading writer on practical politics, though not Burke's equal. He
    praises de Bonald and le Maistre, though they confused the church with Rome, and claims the right
    to learn from Catholic and liberal writers. He is no unconditional admirer of von Haller, yet says
    perhaps no one did more against false doctrines in constitutional law. Haller saw, he says, that modern
    theory wrongly assumes the State arose by human agreement. For Haller it is a natural product that
    recognises only God above it. He calls himself Bilderdijk's pupil but rejects his exclusive view of
    monarchy, and closes by claiming independence from every teacher but one.
  notable_footnotes: >-
    A note at 1539-1549 reports an exchange between Pitt and Burke in autumn 1791; a bracketed addition
    gives Macaulay's remark on Pitt's debt to Burke. A note at 1580-1591 gives Mackintosh's tribute to
    Burke. Among the footnotes at 1742-1761, the last (1751-1761) quotes von Haller in French. He calls
    states the highest degree of natural society. The theory of an original social contract, he says,
    comes from denying this. The note at 1877-1881 quotes a first-person statement from 'Aan de Kiezers'.
    The writer denies that he ever held kingship the only lawful form, or belonged to Bilderdijk's school.
  scan_note: >-
    The years of the Wochenblatt at line 1641 and the years in the footnote at 1710-1712 cannot be read
    with certainty. Lines 1555-1559 and 1723-1726 are badly garbled.
