- unit: Lecture VIII
  title_as_printed: ONGELOOF.
  lines: [6936, 7309]
  label: Main thesis; verdict on the eighteenth century
  covers: >-
    Groen opens the main argument of the book: the cause of the Revolution lies in unbelief. He denies
    that this is fatalism, since the moral world has laws and yet each person stays responsible. Logic,
    he says, will show that atheism and radicalism are results of the principle and not abuses of it.
    He grants that the eighteenth century had energy, a real wish for improvement and good reasons to
    want reform. But he calls its principle radically false: the sovereignty of man, independent of the
    sovereignty of God. He argues that the century went backward: it kept ideas grown on Christian soil
    but threw away the principles behind them. He rejects the favourable final verdicts of Guizot and
    Cousin on that century. He says its writers and rulers carry much responsibility, yet were also instruments
    of the spirit of the age.
  notable_footnotes: >-
    A long note at 7001-7010, running on at 7047-7050, quotes Guizot on the 'physiology' of history to
    explain Groen's method. A note at 7159-7172 quotes Ancillon on the difference between freedom and
    independence of mind. A note at 7214-7219 gives a later verdict by Guizot on the century that Groen
    calls better.
  scan_note: The century at 6948 is garbled in the scan; later lines confirm it is the eighteenth.
