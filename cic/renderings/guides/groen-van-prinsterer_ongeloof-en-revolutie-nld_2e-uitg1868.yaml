- unit: Lecture III
  title_as_printed: ANTI-REVOLUTIONAIRE BEGINSELS
  lines: [1923, 2472]
  label: Historic rights, self-rule and divine right
  covers: >-
    Groen opens the negative half of his argument: the Revolution did not come from faults in the old
    public law. He sketches the old view of the state as God's institution, with each authority limited
    to its own sphere of rights. He lists four charges against the old principles. To the first he answers
    that historic rights grew slowly out of the principle of law, though he grants countless wrongs were
    done. To the second he answers that each household, corporation and estate ruled its own affairs,
    and that these limits check an all-powerful state. He then defends the divine right of government,
    which he says is widely mocked, under three heads: caricature, nature and effects. He finds its meaning
    in Scripture, limits it to lawful power, and says it belongs to every form of government, republics
    included. He says the subject obeys for God's sake, which does not exclude firm refusal and brave
    resistance within limits.
  notable_footnotes: >-
    A bracketed note at 2180-2185 quotes Tocqueville: administrative centralisation came from the old
    regime. Groen replies that in European law it was a degeneration, which the Revolution took over as
    a principle. A long note at 2291-2307 quotes Von Gerlach: Paul does not bid us obey an unlawful power
    as ordained by God. Von Gerlach adds that testing a power's lawfulness is often not everyone's duty,
    and unlawful rule can grow lawful. A long note at 2416-2430 quotes Bossuet: kings bear a divine mark,
    yet die as men and owe God a greater account.
  scan_note: >-
    The footnote to line 2471, with Groen's bracketed note on Droit divin against the contrat social,
    is printed at 2498-2505 in the next section. Page tops are garbled throughout, and the numbers of
    points 2 and 4 are mangled.
