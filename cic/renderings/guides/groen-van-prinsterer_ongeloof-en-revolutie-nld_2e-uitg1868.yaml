- unit: Lecture XIV
  title_as_printed: OVERZIGT. 1794—1845.
  lines: [15138, 15521]
  label: 'Restoration, 1815 to 1830: the false principle kept'
  covers: >-
    Under point 2 Groen says the fall of Napoleon brought back the revolutionary doctrine, mistaken for
    love of freedom. He calls the years of liberation a striking moment, not unfit for a Christian and
    national politics, but does not presume to draw its lines. The first condition, he says, was to renounce
    the revolutionary principle and submit to a higher law, and that condition was missing. He argues
    that the Restoration continued the Revolution under a monarchical name, as mild liberalism on the
    road of 1789. He calls the representative system a caricature of the old estates and of Groot-Brittanje,
    with a balance of powers bound to break. A lawful king on revolutionary ground, he says, becomes either
    an autocrat or a slave and victim; the struggle went against Karel X in 1830. He lists the usual charges
    against the Bourbons and says none has enough ground. He thinks one may assume that Karel X was in
    earnest about keeping the charter, while most of his opponents were insincere.
  notable_footnotes: >-
    A very long note at 15149-15216, belonging to the section before, explains the Empire from the radical
    doctrine and warns against blaming the person alone. A note at 15250-15260 speaks of a Christian awakening
    (Réveil) and quotes Luthardt on Duitschland in 1813. Notes at 15297-15343 call the Restoration the
    continuation of the Revolution. A note at 15385-15391 and 15423-15428 calls the ancien régime a ghost.
    A note at 15494-15504 quotes Guizot and St. Marc-Girardin in praise of Villèle.
  scan_note: >-
    In 15138-15292 Groen's own prose stands only at 15138-15141, 15173-15177, 15224-15243 and 15267-15291;
    the rest is footnotes. The years at 15438 ('1845') and 15484 ('1780') look like OCR faults; check
    the print.
