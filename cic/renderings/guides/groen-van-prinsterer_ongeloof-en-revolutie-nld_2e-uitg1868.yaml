- unit: Preface
  lines: [70, 157]
  label: Purpose of the lectures; why unrevised
  covers: >-
    Groen says he gave these lectures in the winter of 1845-1846 to a few friends in his own study. He
    calls them an attempt to prove from history that unbelief and revolution are linked by nature and
    necessity. He argues that the direction now ruling constitutional law and learning, though not unopposed,
    came from rejecting the Gospel. That direction moves, he says, by lawful inference toward complete
    atheism and radicalism. He gives the manuscript almost unchanged. He first meant to revise it at length,
    but decided that neither the subject nor the times allow delay. A struggle over history and constitutional
    law is going on in his own country, and he will not withdraw from it. In the hour of danger, he says,
    weapons are for use and not for polishing.
  scan_note: >-
    No heading is printed for the preface in this file; it simply begins at line 70. Lines 70-73 are rough
    and lines 94-96 cannot be read with certainty.
