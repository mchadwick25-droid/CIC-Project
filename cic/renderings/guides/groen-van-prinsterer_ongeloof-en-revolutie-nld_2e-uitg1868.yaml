- unit: Lecture XIV
  title_as_printed: OVERZIGT. 1794—1845.
  lines: [15522, 16189]
  label: 'After 1830: July government; return to the Gospel'
  covers: >-
    Under point 3 Groen grants that most drivers of 1830 acted in good faith, still believing that liberal
    ideas produce freedom. He says the old clash returned at once as Mouvement and Résistance, and the
    frightened middle class moved to chain the monster again. He claims the promise of 1830 ended in arbitrary
    rule and the crushing of all opposition under Lodewijk Filips. He argues that the rulers had no right
    to be shocked at revolt, since their own principle made revolt a duty. He is convinced that Lodewijk-Filips,
    Guizot and Thiers did not act from bad faith, though he calls their turnabout blameworthy in itself.
    He warns that France's outward prosperity is paid for too dearly with rights and freedoms, and that
    liberalism's last fruit is lost love for freedom. He suspects that freedom never comes without renouncing
    the revolutionary principle and returning to the Gospel. He ends by saying that only faith in the
    Son of the living God can overcome the Revolution.
  notable_footnotes: >-
    A long note at 15537-15551, 15564-15595 and 15619-15636 says the Restoration is now judged more fairly,
    and faults Guizot on the crisis of 1829-1830. A note at 15667-15726 and 15759-15764 sets Renan against
    Guizot on the change of dynasty; Groen there calls coups normal on liberal state law. A very long
    note at 15954-15970, 15977-16016, 16024-16063 and 16092-16099 treats the fall of the July government
    in 1848. Groen doubts that the narrow franchise caused it. A note at 16119-16130 records Guizot's
