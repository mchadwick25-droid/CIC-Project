- unit: Lecture XIV
  title_as_printed: OVERZIGT. 1794—1845.
  lines: [14443, 15137]
  label: Reaction after 1794, peaking under Napoleon
  covers: >-
    Groen says he can only sketch the years from 1794 to his own time, and names three stages. Under point
    1 he says the moderates who took power after the Terror kept the revolutionary theory and drew their
    middle line by mere choice. Such a government, he says, was weak for lack of principle and had to
    lean on force. He goes through the Convention and the Directoire, praises some of their work, and
    says 18 fructidor showed a despotism upheld by soldiers. He grants that Napoleon's person explains
    part of his story, but ties him to the Revolution's course as Robespierre's counterpart on the line
    of reaction. He says Napoleon could not have restored the old order, and that his refusal of liberal-constitutional
    advice rested on experience and sense. He argues that one-man rule was the unavoidable result of the
    doctrine, so those who approve the doctrine may not blame Napoleon's tyranny. He grants Napoleon's
    boundless ambition, but says constant war was the condition of life of his rule and so led to his
    fall.
  notable_footnotes: >-
    A long note at 14780-14797 and 14819-14841 quotes Tocqueville, Stahl and Molé on why France welcomed
    Bonaparte. Stahl there calls his power rightful within the republic, until he sought a hereditary
    empire built on the Revolution. Notes at 14910-14928 and 14960-14964 praise Fiévée's notes to Napoleon,
    and say Napoleon drew his power from the Revolution he tamed. A note at 14997-15005 shows that Napoleon
    also used divine right, in a catechism for Roman Catholics. A long note at 15035-15046 and 15073-15085
    quotes Guizot on Napoleon as power in person, and then Fiévée. A very long note at 15149-15216 is
    printed in the next section's lines. It explains the Empire from the radical doctrine and warns against
    blaming the person alone.
  scan_note: >-
    The heading's end year prints as '4845' at 14447; the detailed guide reads it as 1845. Line 14717
    is too garbled to read in full, and 14889 garbles a name read as Monk. The date line under the heading
    reads 1794—1845 on the page image (printed p. 360); the scanned text at line 14447 prints “4845”.
