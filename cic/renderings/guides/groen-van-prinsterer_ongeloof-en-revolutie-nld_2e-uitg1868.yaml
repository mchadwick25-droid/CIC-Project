- unit: Lecture XIII
  title_as_printed: SCHRIKBEWIND.
  lines: [13353, 14021]
  label: Belief in the theory; conduct by its standard
  covers: >-
    Under point b Groen finds the secret of the leaders' strength in sincere belief in the revolutionary
    theory. He denies that Robespierre was a hypocrite, and says each event brought the Revolution nearer
    to his position of full political equality. He describes the doctrine they served, and says their
    fanaticism rested on reasoning and matched the general way of thinking. Under point c he argues that
    their conduct was a faithful use of revolutionary ideas and, by that rule, praiseworthy. He says their
    doctrines, rightly called anarchic, had been proclaimed with general approval from the start, and
    their rule used the Revolution's own means. He follows the plea of necessity through: by the firmness
    of a few, he says, revolutionary France was saved in the crisis after 31 May. He says he is no eulogist
    of these men; his own view is that the Terror defended France as a tiger defends its den. Whoever
    loves the theory, he holds, must own its deeds; by that rule Robespierre, moved by policy not hatred,
    seems a 'martyr of equality'.
  notable_footnotes: >-
    A long German note from the Berliner Politisches Wochenblatt, at 13407-13419 with more at 13452-13454,
    says Robespierre's unshaken belief set him above his opponents. A note at 13678-13686 quotes Laboulaye
    on fanatics as both hangmen and martyrs.
  scan_note: >-
    The year of the crisis at 13842 is garbled. Footnote 13995 is garbled, so the author of the French
    at 13965-13976 is uncertain; line 13538 is largely unreadable.
