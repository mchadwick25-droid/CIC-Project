- unit: Lecture XI
  title_as_printed: EERSTE TIJDPERK. VOORBEREIDING.
  lines: [10565, 10934]
  label: Periods dated; historians; Europe's princes prepared it
  covers: >-
    Groen passes to the historical survey and keeps his five periods, now with dates. He warns against
    seeing the Revolution as a French national illness; he blames a faction and a school, not the French
    nation. Most writers on the French Revolution, he says, take their standpoint from the revolutionary
    theories. He praises the form of Thiers and Mignet, but says they plead for the Revolution and twist
    the other side's case. He values Alison and Schlosser, but says Alison confuses the Revolution too
    much with a quarrel over democracy, and Schlosser does not know the gospel. On the preparation in
    Europe he is brief: he says nearly all Europe was ripe for revolution. Nearly all the princes believed
    in the new philosophy, he says, partly because it offered them more power. He sketches reformers in
    power from Pombal to Jozef II, and concludes that princes almost everywhere led the movement before
    1789.
  notable_footnotes: >-
    A long note at 10587-10601 quotes Renan, who calls the Revolution peculiar to France; Groen calls
    this more witty than true. A long note at 10628-10646 quotes a Quarterly Review article on Thiers,
    which Groen gives to J. W. Croker. A long note at 10679-10691, running on at 10718-10721, lists works
    that appeared since 1847. A note at 10912-10920 quotes von Sybel on Jozef II and adds that the princes
    were not alone to blame: they stood for their age.
  scan_note: >-
    The period dates at 10567-10569 are badly printed; only 'to 1789' and '1830-1845' can be read with
    certainty. The Russian empress is described at 10859-10861 but not named there.
