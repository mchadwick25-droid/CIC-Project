- unit: Lecture XV
  title_as_printed: BESLUIT
  lines: [17158, 17831]
  label: The Christian's calling; thesis restated
  covers: >-
    Groen's fourth topic is the Christian's calling, under three heads: the need for improvement, the
    powerlessness of revolutionary ideas, and the strength of Christian principles. He calls the state
    of the fatherland sad, with a centralising government limited in law in many ways and in fact in none.
    He argues that moderate liberalism cannot bring improvement, though he honours the good will of liberals
    who want a radical revision of the constitution. He gives the Hervormde Kerk and the schools as signs
    of a dulled sense of justice. Faithful church members, he says, may as a rule meet for worship only
    by leaving their church, and the right to private schools is denied. By 'restoration' he does not
    mean outdated forms or a sudden overturning, but Christian constitutional law fitted to the circumstances.
    He does not think the moment favourable and promises no easy triumph, but says stating principles
    is itself action. He restates his thesis: the Revolution follows from the revolutionary doctrine,
    and that doctrine from the rejection of the Gospel.
  notable_footnotes: >-
    A later note at 17200-17209 and 17232-17242 says these pages also allude to a proposal for constitutional
    revision that had just been rejected. A note at 17475 and 17502-17513 quotes Groen's words to Thorbecke
    in the Chamber in 1862 on their fight for freedom of education. A long later note at 17635-17636,
    17641-17684 and 17698-17725 looks back on his effort to rouse an anti-revolutionary party, and rebukes
    Christians' passivity.
  scan_note: >-
    The date of a decree in footnote 17435-17436 cannot be read with certainty, and the years at 17620
    and 17633 print with faults. Several Bible sayings near the end have no references.
