- unit: Lecture XI
  title_as_printed: EERSTE TIJDPERK. VOORBEREIDING.
  lines: [10102, 10564]
  label: Thesis and seven features of the Revolution
  covers: >-
    Groen states his standpoint as that of the Christian, for whom wisdom begins with submission to Revelation.
    His thesis is that the history of the last sixty years was the fruit and unfolding of systematic unbelief.
    Before the story of the five periods he lists seven main lines, a to g, that show in each of them.
    He says the Revolution is unlike earlier upheavals, such as the Dutch revolt, North America and the
    English revolutions. He calls it a European revolution; its course differed by country, and even England
    stands at its doorway. He says the doctrine turns law into mere convention, and that the theory has
    never been carried out because it cannot be. Jacobinism, Bonapartism and Constitutionalism are, he
    says, one tree; some men who served every regime were, now and then, faithful to one theory. He says
    nobody ever fought the essence of the Revolution, and that the cure for unbelief lies in faith.
  notable_footnotes: >-
    Notes fill most of 10168-10215: Groen quotes Burke at length and calls the revolution of 1688 in more
    than one way a restoration. A note at 10404-10407 says constitutional monarchy has nothing in common
    with this constitutionalism. A note at 10409-10410, running on at 10441-10450, quotes a Berlin weekly:
    republicanism, constitutionalism and imperialism rest on the same principles.
  scan_note: >-
    The letter of point c prints as 'e.' at 10264. The year at 10180 cannot be read, and the one at 10298
    prints as '18-40'. It is not sure which reference at 10526-10528 belongs to the Talleyrand passage
    at 10494-10503.
