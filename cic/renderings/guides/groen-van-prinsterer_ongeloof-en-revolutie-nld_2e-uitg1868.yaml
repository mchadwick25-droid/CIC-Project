- unit: Lecture VI
  title_as_printed: VERBASTERING VAN HET STAATSREGT.
  lines: [4652, 5459]
  label: 'Decay of constitutional law: state as association'
  covers: >-
    Groen says he will now describe the revolutionary theory like a biography, and sets out four points.
    His first point is that the rise of the revolutionary principle is bound up with the decay of constitutional
    law. He says the European kingdoms were patrimonial monarchies, limited but real, yet theory turned
    every state into a 'res publica'. He names the causes: admiration for the ancient republics, the Latin
    language, Roman law, political science, and city republics and corporations. He states the core error:
    that every state, monarchies included, must be seen as an association. Groen does not deny that a
    state can be an association; he objects that monarchy was reasoned away. He finds the error even in
    De Groot, whom he praises highly, and in Locke. He says it runs in two directions, shown by Hobbes
    and Sidney, and that it had a great effect on the earlier revolutions.
  notable_footnotes: >-
    A note at 5105-5112 gives von Haller on Grotius. A note at 5220-5227 concerns Fénélon and Massillon.
    Bracketed notes at 4906-4915 quote Tocqueville.
  scan_note: >-
    The year of the first English revolution at line 5432 cannot be read. The Latin terms at 4841-4850
    and 4921 are partly garbled. The note for line 5458 is printed at 5491-5492 in the next section.
