- unit: Lecture III
  title_as_printed: ANTI-REVOLUTIONAIRE BEGINSELS
  lines: [2473, 2902]
  label: Union of Church and State defended
  covers: >-
    Groen takes the fourth point, the union of Church and State. He argues that the sovereign, as God's
    deputy, must confess and serve God, and that the Church must not withdraw from the state. He grants
    that union with a false religion does grave harm, and blames the error, not the principle. He praises
    Vinet as a believer and writer but rejects his general verdict against the union. Groen himself rejects
    the union as it exists in the revolutionary state, where he says it puts the Church in chains. He
    says Vinet starts from a false, radical idea of the state, and too often blames principles for faults
    of practice. He admits governments have too often misused their power over the Church, but concludes
    that abuses are possible, not necessary. After witnesses from church history, he concludes that these
    principles did not cause the Revolution and remain pillars of freedom, law and order.
  notable_footnotes: >-
    A bracketed note at 2498-2505 says the only choice is the Droit divin or the contrat social. A long
    note at 2810-2822 quotes Trigland: the highest authority in the church is Christ's alone. A long bracketed
    note at 2824-2833 and 2851-2861 asks for distinction and joint counsel of Church and State, not separation.
    The Gentz note at 2863-2875 and 2893-2900 carries Cicero's Latin.
  scan_note: >-
    The note at 2498-2505 belongs to line 2471 in the section before. Several years and one preacher's
    name in the footnotes at 2573-2580 and 2786-2788 cannot be confirmed from the scan. Line 2591 seems
    to have lost a date. Words seem lost between 2588 and 2590, where a sentence starts mid-way.
