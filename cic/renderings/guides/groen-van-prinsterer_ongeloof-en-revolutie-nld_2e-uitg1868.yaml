- unit: Lecture VI
  title_as_printed: VERBASTERING VAN HET STAATSREGT.
  lines: [5460, 5857]
  label: Systematic unbelief; Calvinism cleared of republicanism
  covers: >-
    Groen asks whether the Revolution itself follows from the decayed constitutional law. Others say it
    only completes what the earlier revolutions began, and Groen doubts this. He says the form is the
    same, but another principle now drives it: before a political error, now a social one, with religion
    renounced. He calls the Revolution the fruit of a time of falling away and of systematic unbelief.
    Critics say he follows Von Haller and overlooks Genève's democratic church principle; he calls its
    church order aristocratic, or rather theocratic. He partly blames Calvinist scholars for republican
    writing, but traces the error to their circumstances, not their faith. He states that Calvinist teaching
    never led to republicanism and appeals to the conduct of Calvinist leaders. He says the republican
    phrases of the Acte van Afzwering did not come from Calvinism.
  notable_footnotes: >-
    A long note at 5529-5533 and 5554-5581 praises Renan's account of the political error but says he
    misses the Revolution's atheistic drift. A note at 5609-5619 grants that a wrong idea of the Church
    helped spread republicanism. It quotes Von Haller, who Groen says misjudges the principle of the Reformatie.
    A long bracketed note at 5795-5855 compares Groen's view with Stahl's and finds at most a shade of
    difference.
  scan_note: >-
    The note at 5491-5492 belongs to line 5458 in the section before. Lines 5539-5548 are rough, and two
    cited titles (5581, 5789) are badly garbled.
