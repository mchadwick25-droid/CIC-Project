- unit: Lecture X
  title_as_printed: DE REVOLUTIE-LEER IN STRIJD MET NATUUR EN REGT.
  lines: [8726, 8931]
  label: The theory meets resistance; outcome in religion
  covers: >-
    Groen says the revolutionary theory cannot run freely, because it fights nature, history, conscience
    and existing rights. So it meets a reaction that bends its course, he says. He asks what shape the
    applied doctrine of unbelief will take in real life. He announces a word on religion first, and then
    a longer treatment of constitutional law. On religion, he says faith in reason's infallibility spreads
    only once living faith in God has declined. Then all revealed truth is driven out step by step. The
    human heart then either stops caring about truth, or flees into superstition and invented gods. He
    names mysticism, pantheism and Saint-Simonism as examples, and says only God can rescue.
  notable_footnotes: >-
    The notes at 8899-8909 name Lichtenberg as the 'shrewd man' whose saying Groen gives in Dutch at 8876-8882,
    and quote one sentence of Bautain.
  scan_note: >-
    Lines 8761, 8797 and 8873-8875 are badly garbled, and line 8732 opens with a garbled word ('Vrijen').
