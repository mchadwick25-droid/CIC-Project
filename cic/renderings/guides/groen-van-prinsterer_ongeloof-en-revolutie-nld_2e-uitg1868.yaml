- unit: Lecture V
  title_as_printed: MISBRUIKEN
  lines: [3801, 4286]
  label: Abuses misdescribed, exaggerated and already easing
  covers: >-
    Groen asks whether abuses had made reform of the old states impossible; he holds they were only a
    secondary cause of the Revolution. He admits the sins of earlier generations, but argues that the
    usual picture is often false and the anger largely artificial. He argues that people mistook old rights
    for abuses: nobles, clergy and princes held them as property, not as public offices. He says royal
    power was limited in law and in fact, though he grants the charge of tyranny against Lodewijk XIV
    is partly true. He goes through mainmorte, the Taille, the Corvee and the Bastille, and says each
    was exaggerated or misdescribed. For the Netherlands he sets van der Capellen's outcry over the Overijssel
    drostendiensten against their small real cost. He argues that the abuses weighed less in the eighteenth
    century than before, and cites Necker and Burke on the wealth of France. He regrets that Dutch power
    had narrowed to a few city regents, yet suspects the abuses were smaller than later claimed.
  notable_footnotes: >-
    A bracketed note at 4018-4024 grants that Lodewijk XIV's edicts taught that the State stayed owner
    of the land, and quotes Tocqueville. A bracketed note at 4199-4207 quotes Tocqueville on men of letters
    and on the yoke felt most where it was lightest. Notes at 4209-4215 and 4236-4242 give Necker in German,
    and 4244-4259 gives Burke in English.
  scan_note: >-
    The writer quoted at 4029-4036 is unnamed; the footnote giving his work, at 4058-4061, has a garbled
    German title. Line 3963 seems to have lost a king's numeral. Lines 3835, 3912-3913, 3950, 3989-3991,
    4064-4066 and the page-top line 4220 are badly garbled.
