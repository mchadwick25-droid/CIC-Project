- unit: Lecture XII
  title_as_printed: TWEEDE TIJDPERK. ONTWIKKELING (1789—1794).
  lines: [12585, 12913]
  label: The means used, and why attackers won
  covers: >-
    Groen argues that there was no excess in the means either, since each followed from the principle.
    He names three means: an all-powerful central authority, the shutting out of opponents, and freedom
    from every tie, even the Revolution's own laws. He says the doctrine knows no measure but need, and
    calls this a worse Jesuitism than any other. This, he says, is how the Revolution's men justified
    the king's death, the outlawing of the Girondins and the prison killings of September 1792. He says
    each attack on the government succeeded because the attacker was consistent, while those who resisted
    felt a kind of bad conscience. He denies that the nation was guilty of the crimes, and points to the
    narrow vote that condemned Lodewijk XVI. He grants that the Revolution went further than anyone first
    meant, and turns this into his strongest proof: principles won, not men's will. He closes by keeping
    the Terror for separate treatment, as the last act of one tragedy.
  notable_footnotes: >-
    A German note from Von Sybel at 12837-12845 says the revolutionaries of 1792 were only a minority
    of the nation. A footnote at 12904-12911 dates the start of the Terror from the defeat of the Girondins.
  scan_note: >-
    The long French passage at 12629-12664 has no source note, and the pairing of note marks for the French
    at 12743-12781 is not fully clear.
