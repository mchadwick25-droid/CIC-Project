- unit: Lecture XI
  title_as_printed: EERSTE TIJDPERK. VOORBEREIDING.
  lines: [10935, 11506]
  label: 'France: the Revolution inevitable before 1789'
  covers: >-
    Groen says the French revolution was long prepared. Many grant this, he says, but they mean a healthy
    reform that only later went astray; he says this twists history, perhaps unknowingly. Against the
    claim that Lodewijk XVI resisted the people's wishes, he says no one was a more willing pathbreaker
    of the Revolution. He reads the instructions (cahiers) of 1789, which others praise, as demanding
    a revolutionary monarchy. Ancillon lists things that could have prevented the Revolution; Groen holds
    it was inevitable, but rejects fatalism, since guilt remains. He answers other remedies too: he accepts
    the rule of timely concessions in general, but says it could not work in 1789. The false ideas already
    ruled, he says, so the events of 1789 only brought out what was done in thought. He says the Revolution
    was foretold, and ends with Mignet's saying that the Staten-generaal proclaimed a revolution already
    made.
  notable_footnotes: >-
    In a long note at 11139-11153 Groen denies that the cahiers show no trace of Rousseau, and calls them
    the programme of the new society. A note at 11398-11399, running on at 11413-11425, answers two more
    'if only' claims, on Turgot in 1775 and the hertog van Brunswijk in 1792. A note at 11070-11078 quotes
    Schlosser in German, with an aside by Groen in Dutch.
  scan_note: >-
    The day of the month before 'Aug. 1789' at 11392 is lost. In 11337-11346 the scan prints 'b' for 'h'
    throughout, and heavy footnotes break Groen's sentence at 11412, which continues at 11444.
