- unit: Lecture XIII
  title_as_printed: SCHRIKBEWIND.
  lines: [12914, 13352]
  label: Terror no exception; its leaders' character
  covers: >-
    Groen opens the lecture on the Terror, from the fall of the Girondins to the fall of Robespierre.
    He sets out to show that it was no exceptional time, but the furthest practical unfolding of a false
    principle. He says each ruling party since 1789 was a shade of the same party, and the general welfare
    had been everyone's rule. He argues that violence rose steadily before the Terror, and that outrage
    should begin at the first milestone, not the last. People call the terrorists moral monsters, which
    acquits the theory; Groen grants that some were villains and that fear made many others cruel. He
    denies that this holds for Danton, Marat, St. Just and Robespierre, and sets out four points, a to
    d. Under point a he denies that malice or greed was their main motive, and finds firm conviction in
    Marat and St. Just. He finds Robespierre sober, incorruptible, a deist, cowardly in danger and without
    great gifts, and asks how he reached such power.
  scan_note: >-
    The lecture numeral at 12914 prints 'xrii.' for XIII. The sum of Robespierre's estate at 13304 is
    garbled, and line 13065 prints a year as '179.i'. Croker's note at 13336-13339 continues at 13369-13372,
    in the next section.
