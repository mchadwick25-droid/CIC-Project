- unit: Lecture I
  title_as_printed: INLEIDING.
  lines: [676, 1072]
  label: Use of the subject; plan of the lectures
  covers: >-
    Groen says the subject touches the heart of the disputes in religion and politics. He calls the revolution
    ideas the application of unbelief to constitutional law, in a fight to the death with the Gospel.
    As Dutchmen, he says, his hearers must know the root and branches of the evil before they try to reform.
    As a Christian he confesses that one thing is needful, and says telling this history is a way of preaching
    the Gospel. He argues that faith still needs knowledge, and names godly men who greeted the start
    of the French revolution as a golden age. He says the Revolution is, in the opposite sense, what the
    Reformation was for Christendom: revolt against God in place of submission. His plan has a negative
    part, denying that old principles, forms and abuses explain the revolutionary condition, and a positive
    part from doctrine and history. He closes by pointing to hopeful signs, among them a return to Gospel
    truth like the reviving of dry bones.
  notable_footnotes: >-
    A French note at 966-974 sets the Revolution against the Reformation; it cites the Archives de la
    Maison d'Orange-Nassau and names no author.
  scan_note: >-
    The note at 699-700 belongs to line 674 in the section before. The French quotation at 992-1007 gets
    its author, Guizot, only in the note at 1015. The number of the fourth head at line 946 is garbled.
