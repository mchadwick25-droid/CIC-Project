- unit: Lecture V
  title_as_printed: MISBRUIKEN
  lines: [4287, 4651]
  label: Not the oppressed; the root is theory
  covers: >-
    Groen argues that even greater abuses would not have produced the Revolution. He says it did not begin
    with the oppressed: in the Netherlands the Regents began it, and in France the Estates. He turns to
    a work whose author he does not know and first shows the writer's foresight in 1828. That writer explains
    the Revolution by the weakness of nobility and clergy, which left the King almost alone against the
    people. Groen agrees in part, but objects that the older state had other supports as well. He then
    asks whether the old law of nations held a cause, and concludes that it gave none. He sums up: neither
    the old principles, nor the forms of state, nor the abuses produced the Revolution; its root is theoretical.
    He grants abuses might cause an upheaval where reforming wisdom failed, but 'a revolution' is not
    'the Revolution'.
  notable_footnotes: >-
    A long note at 4363-4377 quotes Wachsmuth: France was not poor, and peoples do not rise against old
    institutions without an impulse of the mind. A bracketed note at 4525-4531 cites Tocqueville on centralisation.
    A long German note at 4590-4613 gives von Gentz's remark that in three centuries no independent state
    was destroyed by force.
  scan_note: >-
    The title of the anonymous work in the footnote at 4379 is garbled; only a word like 'Réformes', 'Leipzig'
    and a year beginning 182 can be read. The first date of the pair at line 4435 is garbled.
