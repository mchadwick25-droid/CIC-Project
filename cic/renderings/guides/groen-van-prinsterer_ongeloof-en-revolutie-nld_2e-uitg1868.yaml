- unit: Lecture IV
  title_as_printed: HISTORISCHE STAATSVORMEN
  lines: [2903, 3563]
  label: Nature of the old tempered monarchy
  covers: >-
    Groen asks whether the old forms were so faulty that a revolution was needed, a view he says many
    take as settled. He states that the European state was a tempered monarchy, whose prince owned the
    sovereignty by inheritance. He asks his hearers not to apply this to the state of his own day, which
    rests on another ground. He calls the authority absolute but bound by higher ordinances, and defends
    'L'Etat, c'est moi' as exact for a real monarchy. He rejects the common view that the kingdoms began
    as popular governments, and gives samples of the superficial history behind it. Against such writers
    he sets real scholars of the sources, such as the Benedictines, Moreau, Guizot and Kluit. He says
    it was tempered because the prince could not act against the rights of the estates: all bodies independent
    of him. The assemblies of the estates, he says, were an extraordinary measure and a bulwark against
    a ruler's greed.
  notable_footnotes: >-
    Three short notes at 3295-3305 belong together. The first gives the Latin phrase on law made 'by consent
    of the people'. The second shows the passage concerns a town court case. The third says the Gazette
    de France has long made play with this phrase.
  scan_note: >-
    The mark for the footnote at 3051-3052 is lost, so its place in the text cannot be confirmed. The
    century of the ordinance at line 3269 is garbled. Page tops are garbled throughout.
