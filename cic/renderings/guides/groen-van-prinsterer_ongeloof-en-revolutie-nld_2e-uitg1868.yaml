- unit: Lecture IX
  title_as_printed: ONGELOOF. (vervolg.)
  lines: [8400, 8725]
  label: Consistent extremists against the moderates
  covers: >-
    Groen says the strongest weapon against the Revolution is to show that the so-called Ultras are right
    against the moderates. He means that, on the premises both share, the first are consistent and the
    second are not. His first example is Montesquieu and Rousseau: he says Rousseau only completed what
    Montesquieu began. His second is the Illuminaten, whom he presents as a natural growth of revolutionary
    soil, without giving them too much weight. He calls their doctrine senseless and horrible, yet an
    understandable reaction against the state of Hobbes and Rousseau. His third is the conspiracy of Babeuf
    of 1796, which aimed to abolish private property. Groen argues that if authority and right are conventional,
    property is no exception. He sums up that the principle leaves only radicalism or despotism, but says
    theory never runs free of nature and God's ordinances.
  notable_footnotes: >-
    Two long notes stand at 8669-8671, running on at 8688-8698, and at 8700-8715. The first quotes Stahl:
    the Revolution makes man's will, not God's world order, the source of right. It also quotes Guizot
    (1848), who calls the social reformers' ideas anti-Christian. The other grants, with Stahl, that consistent
    error is worse than half measures, but says the half-hearted pave the way.
  scan_note: >-
    The long French quotation on the Illuminaten at 8501-8528 carries no author's name. The French passages
    at 8566-8606 are presented as from Buonarotti's book, but not attributed one by one.
