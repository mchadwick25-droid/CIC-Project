- unit: Lecture X
  title_as_printed: DE REVOLUTIE-LEER IN STRIJD MET NATUUR EN REGT.
  lines: [8932, 9421]
  label: Five periods of the Revolution in politics
  covers: >-
    Groen says the revolutionary principle must pass through fixed periods, each a struggle against God's
    ordinances. In the first, Preparation, the theory wins minds; in the second, Development, it seeks
    power in practice. In that second period, he says, the struggle comes from the revolutionaries themselves,
    as 'movement' against 'resistance'. The party of movement wins for a long time, he says, and the result
    is anarchy, dictatorship, terror and persecution of religion. In the third period, Reaction, moderates
    keep the doctrine but halt it; on revolutionary ground, Groen says, order costs freedom. He admits
    he draws this picture from Napoleon's tyranny, but calls it no accident. In the fourth period, he
    says, statesmen blame only the application and try again with caution, in a restless 'juste-milieu'.
    In the fifth, enthusiasm cools into materialism and a wish to keep the status quo; he names it hopeless
    resignation.
  notable_footnotes: >-
    A long bracketed note at 9196-9216, running on at 9241-9255, sets a Christian, anti-revolutionary
    reaction apart from counter-revolution. A note at 9257-9259, running on at 9287-9290, quotes Guizot
    on the English seventeenth century.
  scan_note: >-
    Lines 9400-9402 are partly garbled and one phrase cannot be made out. The Rousseau quotation at 9237-9270
    is broken by footnote text at 9241-9259. The author's name in the footnote at 8982 is garbled and
    is taken as Dumont.
