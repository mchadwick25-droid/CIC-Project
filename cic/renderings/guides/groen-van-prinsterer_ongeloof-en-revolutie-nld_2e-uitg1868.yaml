- unit: Lecture XII
  title_as_printed: TWEEDE TIJDPERK. ONTWIKKELING (1789—1794).
  lines: [11507, 12232]
  label: 'First point: the accidents blamed for 1793'
  covers: >-
    Groen opens the second period, 1789 to 1794, and says its events match what he derived from the revolutionary
    principle. Many still argue that the Revolution was sound in 1789 and went wrong through accidents
    and resistance; Groen sets out to refute them. His first point is that these accidents largely came
    from the doctrine itself and had less influence than people say. A Dutch journal article blames the
    king's double-dealing, the stubborn nobles and clergy, and the foreign princes; Groen answers each
    charge. He denies that Lodewijk XVI was double-faced, grants that he lacked force, and says the doctrine
    itself made princes weak. He admits nobles and clergy helped the false ideas to rise, but argues the
    privileged orders began the Revolution themselves. He says the powers fought in self-defence, the
    revolutionaries themselves wanted the war, and the moderates emigrated because their party was already
    powerless. He also rejects other excuses: Mirabeau's early death, the Constituent Assembly barring
    its members from the next assembly, and royalist plots at home.
  notable_footnotes: >-
    A long note at 11543-11578, ending at 11611-11618, takes St. Marc-Girardin's essay on Mirabeau as
    the example of the view Groen attacks. A note at 11848-11859 quotes Tocqueville's praise of the French
    clergy. Groen adds that persecution of Protestants ended only shortly before the Revolution, and not
    through the clergy's charity. A note at 12016-12017 and 12038-12051 says people confused fatherland
    with government, and quotes Mallet du Pan. A German note from von Sybel at 12053-12056 and 12076-12095
    says the French Revolution, not Germany, began the war of 1792.
  scan_note: >-
    Footnotes often stand some lines after the text they belong to and break into later paragraphs. Several
    French titles are garbled (11543-11545), and a year in footnote 12215 prints as '1700'.
