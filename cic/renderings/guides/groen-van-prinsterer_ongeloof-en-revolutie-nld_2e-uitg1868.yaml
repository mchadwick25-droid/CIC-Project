- unit: Preface
  lines: [158, 464]
  label: Recent events and books; two watchwords
  covers: >-
    Groen says events and writings since he finished have confirmed his view. He points to Switzerland,
    which he says shows in practice the Church melting into the revolutionary State. He will not judge
    the calling of the United Diet, but rejoices that the King of Prussia confessed his intent to serve
    the Lord. He says a German book of dialogues on State and Church shows liberals, radicals, socialists,
    doctrinaires and conservatives all setting aside God's law. He says Louis Blanc's history shows a
    consistent revolutionary finding his teaching in Rousseau and his ideal in finishing the terrorists'
    task. He praises the style of Lamartine's work on the Girondins, yet treats its author as a gifted
    man led astray. He restates his main thought, that one becomes either a Christian or a Jacobin and
    radical. He ends with two watchwords, 'It is written!' and 'It has happened!', which stand for Scripture
    and History.
  notable_footnotes: >-
    A note at 206-215 gives Stahl on Friedrich-Wilhelm IV. The Lamartine notes at 312-315, 333-337 and
    339-349 quote him on reason and on the Revolution as 'a volcano of truths'. The last adds Groen's
    own comment and runs on at 373-383, where it cites da Costa's verse on 'Robespierre's doctrine in
    Lamartine's language'.
  scan_note: >-
    Line 158 is garbled; it gives 'April' but prints no year. The years of several cited books (217-218,
    248, 310) are not readable with certainty.
