- unit: Lecture IX
  title_as_printed: ONGELOOF. (vervolg.)
  lines: [7739, 8399]
  label: Rousseau's contract state and its reach
  covers: >-
    Groen follows unbelief into state law: the same step, he says, leads from free thought to free action.
    He argues that without God's sovereignty nothing grounds authority, rank or duty, and the state falls
    into isolated individuals. He finds the source of liberalism in the denial of the droit divin. On
    the revolutionary principle, he says, only a social contract can join free and equal people; he calls
    this the main error. He draws propositions from the Contrat Social of Rousseau: the law is the people's
    will, and nothing limits that will. Groen calls this complete absolutism, but says Rousseau's reasoning
    is sound from its starting point. He agrees that freedom is submission to law, but only if the law
    rests on the highest lawgiver. He says the doctrine also loosens family ties, and that its state cannot
    tolerate the living gospel.
  notable_footnotes: >-
    A long note at 7962-7972 quotes Stahl and Renan on Rousseau as the writer who completed the system
    of the Revolution. A long note at 7999-8015 says 'republic' here means the people's sovereignty, not
    a form of state, and quotes Guizot, Stahl and Vinet on democracy. A long note on Cicero at 8207-8217
    runs on at 8248-8252. A long note at 8360-8371 quotes Gervinus (1848) for a plan in Duitschland of
    a national church that sets doctrine aside.
  scan_note: >-
    The long French quotation at 7880-7916 is attributed to de la Mennais only by the note at 7933. The
    French at 8053-8063 and 8277-8279 carries no author's name.
