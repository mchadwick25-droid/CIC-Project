- unit: Lecture XII
  title_as_printed: TWEEDE TIJDPERK. ONTWIKKELING (1789—1794).
  lines: [12233, 12584]
  label: 'Second point: five events follow the doctrine'
  covers: >-
    Groen states his second point: from 1789 to 1794 the Revolution was the false philosophy put into
    practice. He says it met no resistance worth the name, in the sense his opponents mean, and never
    left its track. He tells readers to choose: condemn the doctrine by its results, or approve those
    results. He then takes five events as proof, starting with the merging of the orders into one sovereign
    assembly. He grants that seeing the whole nation in the Third Estate is wrong, yet says the act was
    rightful by the ideas then general. He calls the constitution of 1791 wretched work, but a truer copy
    of the theory than any English import. He argues that the Republic was only one step further, since
    the constitution had already stripped the king of power. He says that on revolutionary reasoning the
    king's death sentence and the fall of the Girondins were consistent; he sees no deviation in them.
  notable_footnotes: >-
    A note at 12252-12253 and 12284-12291 quotes Burke: the men of 1789 and 1790 met little or no opposition.
    A note at 12442-12450 quotes Stahl: the constitution of 1791 in essence carried out Rousseau's doctrine.
    Notes at 12527-12536, 12560-12561 and 12563-12582 say Lamartine idealised the Girondins, and quote
    Croker and Von Sybel against them.
  scan_note: >-
    The end year at 12233 is garbled, the French at 12242-12243 prints 'révolution de 1795', and heading
    b at 12378 prints the year as '1701'. A French title in footnote 12372 cannot be read.
