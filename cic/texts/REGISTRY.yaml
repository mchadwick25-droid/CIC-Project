    significant open acquisition item named in this world's own Doc_01 (Sec8 item 2) and
    Open_Gaps_Tracking.md (item 3) - the actual documented Zurich/Geneva doctrinal bridge
    this world's own Strand Determination rests on. Fetched directly (curl, raw bytes) from
