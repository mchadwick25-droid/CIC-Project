- filename: ammianus-marcellinus_roman-history_yonge1862.txt
  supplied_by: Claude (fleet cross-world research thread found and verified the edition on
    archive.org; the ijc thread fetched, normalized, and vendored it)
  date_added: '2026-09-13'
  notes: >-
    Ammianus Marcellinus, Res Gestae (Roman History), trans. Charles Duke Yonge (Bohn's
    Standard Library, 1862) - closes ijc.source.ammianus-marcellinus's own 'fails closed
    for quotation' state (see ijc.search.ammianus-english). Book XXVII.3.12-13, the 366
    Damasus/Ursinus election riot at the Basilica of Sicininus with its 137-dead casualty
    figure, was previously reachable in this build only at second hand, via npnf202's own
    editorial endnote quoting Ammianus rather than Ammianus's own prose. Found on the
    Internet Archive (identifier romanhistoryofam00ammiiala, not access-restricted) and
