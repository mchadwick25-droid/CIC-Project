- filename: ammianus-marcellinus_roman-history_yonge1862.txt
  supplied_by: Claude (fleet cross-world research thread found and verified the edition on
    archive.org; the ijc thread fetched, normalized, and vendored it)
  date_added: '2026-09-13'
  notes: >-
    Ammianus Marcellinus, Res Gestae (Roman History), trans. Charles Duke Yonge (Bohn's
    Standard Library, 1862) - closes ijc.source.ammianus-marcellinus's own 'fails closed
    for quotation' state (see ijc.search.ammianus-english). Book XXVII.3.12-13, the 366
    Damasus/Ursinus election riot at the Basilica of Sicininus with its 137-dead casualty
    figure, was previously reachable in this build only at second hand, via npnf202's own
    editorial endnote quoting Ammianus rather than Ammianus's own prose. Found on the
    Internet Archive (identifier romanhistoryofam00ammiiala, not access-restricted) and
    fetched directly this session, on the same basis as the Paulinus entry immediately
    above. Raw djvu OCR text, same whitespace-only normalization applied, no wording
    changed. Book XXVII.3.12-13 verified directly against this file and now carries its
    own verbatim quote record, ijc.quote.ammianus-sicininus-massacre.
  apparatus:
    - name: endnote-num-glued-after-period
      pattern: '(?<=[a-zA-Z]\.)\d{1,2}(?=\s)'
      evidence: >-
        This edition's own recurring footnote convention, not one sentence's: a bare 1-2
        digit endnote number glued directly to a sentence-ending period with no space,
        confirmed at over fifty real breaks throughout the file, restarting from 1 every
        few pages (a numbering-per-page convention) - "running at will through all the
        elements.1", "the district of the Canini.2", "those alps were called the Penine
        Alps.3", "the Tricorii.1", "he plundered openly.1", "as with the testudo.1", and
        (the record this convention was first found for) "found in the Basilica of
        Sicininus, which is a Christian church.1\nAnd the populace". Never a bare digit
        elsewhere: this edition spells its own real casualty count as words ("one hundred
        and thirty-seven dead bodies"), never as digits, and the lookbehind requires a
        letter immediately before the period - never matching a numbered heading like
        "10. Publius" (digit before the period, not a letter).
