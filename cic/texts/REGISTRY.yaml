    own legislation (Doc_02 sec 1.1, sec 8). Confirmed COMPLETE per its own table of contents
    - not just the two Rules, but the full Ascetica: the scholarly Introduction, the Praevia
    Institutio Ascetica, the Sermo de Renuntiatione Saeculi, the Sermo de Ascetica Disciplina,
    De Iudicio Dei, De Fide, the MORALIA, THE LONGER RULES (Regulae Fusius Tractatae), and
    THE SHORTER RULES (Regulae Brevius Tractatae). This is the GREAT Asketikon; the earlier,
    non-Greek SMALL Asketikon (Rufinus' Latin, Syriac) remains unfilled and has no known open
    English translation. RIGHTS: 1925 publication date clears this registry's own pre-1929
    rule; independently confirmed by the scan's own trailing library catalog card (preserved
    at the file's end), which gives author, translator, publisher, and date verbatim. Clarke
    also translated this project's already-vendored palladius_lausiac-history_clarke1918.txt,
    and (per this book's own back-cover listing) 'The Life of St. Macrina' - a separate, still-needed
    acquisition for this world.
  apparatus:
    - name: footnote-glyph-registered-mark
      pattern: '®'
      evidence: >-
        '"' There is a time for everything." ® But for prayer and psalmody' - the docx-to-text
        extraction of this scan's own footnote-reference mark surfaced as a bare registered-
        trademark glyph. Never real prose content in a 1925 English translation of Basil -
        safe as a general symbol strip within this one file, the same tier as the fleet-wide
        soft-hyphen class (an unambiguous character, not a shape that could coincide with
        real quoted text).
    - name: footnote-glyph-guillemet
      pattern: '»'
      evidence: >-
        Same sentence, a few words on - "for prayer and psalmody, as for many other things, »"
        - a second footnote-reference mark from the same extraction, rendered as a right
        guillemet. Same reasoning as footnote-glyph-registered-mark.
    - name: lone-column-continuation-letter
      pattern: '(?<=\n\n)[B-E](?=[ \t])'
      evidence: >-
        This edition's own recurring convention, not one instance: after a Migne column
        number is printed once (see unbracketed-column-locator below - "382A" a few lines
        before the case that first surfaced this), later sub-sections of the SAME column are
        printed as a bare capital letter alone on its own line, the column number not
        repeated - confirmed at 231 real occurrences of a lone B/C/D/E starting its own
        paragraph throughout this one file (e.g. "among their number \n\nD are those who
        fill", "while we move our hands in work with \n\nE the tongue if it is possible",
        "aid if they have to toil, but let us rejoice that \n\nE they will be glorified",
        "the conflict of renunciation to no purpose, \n\nB since thou hast given thyself").
        Restricted to B-E, never A or I: those two letters are real English
        words that legitimately open a paragraph on their own ("\n\nA busy man who
        promises...", "\n\nI began to work on the notes...", 23 and 42 such real cases
        respectively, confirmed by reading the file) and must never be stripped; no
        genuine one-letter English word is ever "B", "C", "D", or "E".
    - name: unbracketed-column-locator
      pattern: '\b\d{3,4}[A-Z]\b'
      evidence: >-
        "commands us to labour and work with our hands that which is 382A" and dozens more
        across this file (213D, 218E, 317D, 318D, 323D, 323E, 327A, 337B, 360B, 368D, 415E,
        430A, 431A, 506B...) - this edition's own Migne column-reference convention, the same
        shape the fleet-wide bracket-locator class already strips elsewhere, but printed here
        without brackets. Safe as a general per-edition pattern (not anchored to one instance)
        because the shape - 3-4 digits immediately followed by one capital letter, word-
        bounded - is specific enough that no real quoted quantity in this file takes it.
