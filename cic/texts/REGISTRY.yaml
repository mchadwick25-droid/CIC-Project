- filename: basil_ascetic-works-longer-shorter-rules_clarke1925.txt
  supplied_by: Mark
  date_added: '2026-08-30'
  notes: >-
    Basil of Caesarea, 'The Ascetic Works of Saint Basil', trans. W. K. L. Clarke, D.D.
    (SPCK/Macmillan, 1925, Translations of Christian Literature Ser. I - corrected here,
    independent review Round 25's own C1, from an earlier draft whose own line fold rendered
    this as "SPCK / Macmillan" with inserted spaces, inconsistent with the same publisher pair's
    own unbroken citation at this file's macarius_fifty-spiritual-homilies_mason1921.txt entry
    below) - supplied as a DOCX attachment
    (a scan of the School of Theology at Claremont / USC Library copy), converted mechanically
