    metadata field on this item; RIGHTS: public domain by date, an 1844 publication. Raw
    djvu OCR text; runs of 2+ spaces collapsed to one throughout, no wording changed. This
    is a BOUNDED EXTRACT (pp. 195-244 of the printed volume) covering the Consensus proper
    (Calvin's prefatory letter, the Zurich pastors' reply, the 26 Heads of Agreement, and
    Calvin's own appended exposition) - not the volume's other contents (an earlier Short
