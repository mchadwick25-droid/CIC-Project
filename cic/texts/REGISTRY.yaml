    only \par marks a break. Fixed and re-run, then verified by locating a broken token intact.
    That mattered here more than usual: a vendored text exists to have quotations LOCATED
    in it, and one with words split mid-token would have failed silently at exactly that job.
    Structural integrity confirmed: both volumes present in the one file, with the five Discourses
    to Hypatius and Vol. II's 'Of Domnus', Against Marcion I-III, Against Bardaisan, On Virginity
