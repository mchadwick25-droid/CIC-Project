    would not load the file, so the conversion used a purpose-written RTF reader. Its first
    output shattered words across lines ('Teache/r/s', 'long p/eriod') because it emitted
    the source file's own line-wrapping; in RTF a bare CR/LF is insignificant whitespace and
    only \par marks a break. Fixed and re-run, then verified by locating a broken token intact.
    That mattered here more than usual: a vendored text exists to have quotations LOCATED
    in it, and one with words split mid-token would have failed silently at exactly that job.
    Structural integrity confirmed: both volumes present in the one file, with the five Discourses
    to Hypatius and Vol. II's 'Of Domnus', Against Marcion I-III, Against Bardaisan, On Virginity
    and Against Mani all located by their own section headings. A bibliographic header (title/creator/rights,
    matching the Palladius convention) was prepended - the RTF carried none. This is the acquisition
    that reverses srcSYR007's paraphrase-only determination of 2026-08-18, by the route that
    determination itself named.
