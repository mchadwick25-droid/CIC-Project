- filename: webbe_world-english-bible-british-edition.xml
  supplied_by: Claude (at Mark's direction)
  date_added: '2026-08-19'
  notes: >-
    THE FIRST BIBLE IN THIS CORPUS, and it is here for one narrow job: the SPOKEN layer of
    a quote record whose figure is quoting scripture. Mark's two-layer wording ruling (2026-08-19)
    gives each quote a historical wording and a plain modern one; where the father is quoting
    scripture, the modern layer may not carry this build's own paraphrase of a verse, so it
    needs a modern translation that is genuinely free. Three records were held pending this
    file: halq003 (Matt 6:21), ijcq010 (Ps 116:15), pahcq005 (Deut 6:5, Lev 19:18, Matt 22:37/39).
    NOTE WHAT THIS DOES NOT CHANGE: the Bible remains outside the six worlds' EVIDENCE base
    by design - these worlds are post-apostolic and are reconstructed from what they themselves
    wrote. This file is a wording source for verses a father already quotes, never a source
    of evidence about a world. WHICH EDITION AND WHY. The British Edition (WEBBE), not the
    main WEB, because the main edition renders the divine name 'Yahweh' and the British and
    Messianic editions render it 'LORD' - Mark chose LORD, and Ps 116:15 is one of the three
    held verses, so the difference was live rather than theoretical. The cost is British spelling
    ('neighbour' in Lev 19:18 and Matt 22:39), which is the trade the only LORD-rendering
    non-Messianic edition carries. PROVENANCE. ebible.org is blocked by this sandbox's egress
    policy - the same condition this module's own WHY records for every patristic host, and
    the reason the corpus is vendored at all - so the file came through the seven1m/open-bibles
    mirror of eBible.org's USFX distribution. It authenticates itself rather than resting
    on the mirror: it names itself the World English Bible British Edition, references eBible.org's
    usfx.xsd schema, and carries the WEB preface's own public-domain declaration, which is
    what rights_declared() reads. A bibliographic header was prepended for the same reason
    as Palladius and the Doctrine of Addai - the distribution carries no 'Rights:' line of
    its own and its prose declaration sits far past the 100-line read window - but written
    as an XML COMMENT rather than plain text, so the file stays valid XML for ElementTree.
