    says.' That resolves the caveat on the imperial scrub's finding 4: those creeds were previously
    reachable only through npnf204 (Athanasius's De Synodis), and srcIJC24 excludes the Athanasius
    corpus beyond the single Julius quotation. Hilary is an independent Latin transmitter
    of the same texts, so the exclusion does not apply and no owner decision is needed to
    use them. Vendored for future reference; no quote or source record cites it yet.
- filename: webbe_world-english-bible-british-edition.xml
  supplied_by: Claude (at Mark's direction)
  date_added: '2026-08-19'
  notes: >-
    THE FIRST BIBLE IN THIS CORPUS, and it is here for one narrow job: the SPOKEN layer of
    a quote record whose figure is quoting scripture. Mark's two-layer wording ruling (2026-08-19)
    gives each quote a historical wording and a plain modern one; where the father is quoting
    scripture, the modern layer may not carry this build's own paraphrase of a verse, so it
    needs a modern translation that is genuinely free. Three records were held pending this
    file: halq003 (Matt 6:21), ijcq010 (Ps 116:15), pahcq005 (Deut 6:5, Lev 19:18, Matt 22:37/39).
    NOTE WHAT THIS DOES NOT CHANGE: the Bible remains outside the six worlds' EVIDENCE base
    by design - these worlds are post-apostolic and are reconstructed from what they themselves
    wrote. This file is a wording source for verses a father already quotes, never a source
    of evidence about a world. WHICH EDITION AND WHY. The British Edition (WEBBE), not the
    main WEB, because the main edition renders the divine name 'Yahweh' and the British and
    Messianic editions render it 'LORD' - Mark chose LORD, and Ps 116:15 is one of the three
    held verses, so the difference was live rather than theoretical. The cost is British spelling
    ('neighbour' in Lev 19:18 and Matt 22:39), which is the trade the only LORD-rendering
    non-Messianic edition carries. PROVENANCE. ebible.org is blocked by this sandbox's egress
    policy - the same condition this module's own WHY records for every patristic host, and
    the reason the corpus is vendored at all - so the file came through the seven1m/open-bibles
    mirror of eBible.org's USFX distribution. It authenticates itself rather than resting
    on the mirror: it names itself the World English Bible British Edition, references eBible.org's
    usfx.xsd schema, and carries the WEB preface's own public-domain declaration, which is
    what rights_declared() reads. A bibliographic header was prepended for the same reason
    as Palladius and the Doctrine of Addai - the distribution carries no 'Rights:' line of
    its own and its prose declaration sits far past the 100-line read window - but written
    as an XML COMMENT rather than plain text, so the file stays valid XML for ElementTree.
- filename: morison_st-basil-and-his-rule_1912.txt
  supplied_by: Mark
  date_added: '2026-08-30'
  notes: >-
    E. F. Morison, 'St. Basil and His Rule: A Study in Early Monasticism' (Oxford: Henry Frowde,
    1912), The S. Deiniol's Series III - supplied as a DOCX attachment (a Google Books scan
    of the University of California copy), converted mechanically via zip/XML text extraction
    (paragraph boundaries from </w:p> splits, entities unescaped) - no content passed through
    model-generated output. Identified while cross-checking the Nicene-Cappadocian world's
    Source Acquisition Manifest against this registry: Mark supplied it in response to that
    manifest's ask for Clarke's 1925 Ascetic Works translation, but it is a DIFFERENT work
    - not a substitute, a related find. THIS IS MORISON'S OWN SECONDARY STUDY of Basil's Rule
    (14 thematic chapters: Introductory/Historical, the Retreat in Pontus, Basil's Ascetic
    Writings, the Inspiration of the Monastic Life, the Practice of Asceticism, the Community
    Life, Obedience and Discipline, the Monk at Prayer, the Monk at Work, Vocation and Vows,
    Women/Children/and Slaves, Food and Clothing, Hospitality and Charity, Conclusion), NOT
    a translation of the complete Longer and Shorter Rules - Clarke's 1925 translation remains
    a separate, still-needed acquisition for the Q&A-form primary text itself. It does carry
    two genuine primary-source excerpts in its own right: Appendix A is a translated excerpt
    of Basil's own Introduction/Proem to the Longer Rules (continuous first-person primary
    text, not commentary); Appendix B is the analogous Introduction to the Shorter Rules.
    Appendix C covers the Synod of Gangra's decrees - likely redundant with the canons already
    in npnf214_seven-ecumenical-councils.xml, not independently checked against it. RIGHTS:
    1912 publication date clears this registry's own 'to ~1929' rule independent of the Google
    Books scan's own public-domain declaration, present in the original scan but stripped
    along with the UC library return-slip boilerplate before vendoring; the bibliographic
    header prepended to the file records both bases. The chapter on 'Women, Children, and
    Slaves' (ch. XI) is likely directly useful for the Cappadocian build's Article 20 against-the-grain
    evidence work, not yet drawn on.
