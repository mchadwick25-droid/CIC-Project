- filename: jesuit-relations_thwaites-v01-fra-eng_1896-1901.txt
  supplied_by: >-
    Claude library/source-research thread (Library acquisition worker), fetched directly from
    archive.org
  date_added: '2026-09-30'
  notes: >-
    Jesuit Relations and Allied Documents (Thwaites, Cleveland, 1896-1901), volume 1 of 73,
    Acadia, 1610-1613. Internet Archive item jesuits01jesuuoft, a scan of the original Burrows
    printing. Original French (with some Latin and Italian) beside Thwaites's English translation.
    Primary original voice of the Society's missionaries in New France: the French pages are the
    Jesuits' own text, and the English pages are a public-domain translation useful as a
    cross-check. Scan quality: the French reads legibly with occasional letter-level misreads; the
    printed long s is read as f throughout the French (for example befoins, paffer), which the
    quote gate does not normalise, and accents are sometimes lost. A check over all 35 volumes
    (English-word coverage and stray-symbol rate) shows no garbled outlier, and the French was
    read at sampled points in volumes 5 and 32. Check any quotation against the page image before
    it is used. Volumes 1-35 are the in-window volumes; the volumes 36-73 are listed in the
    download queue.
