# cic/texts/REGISTRY.yaml — what CANNOT be read off a vendored file itself
#
# WHY THIS EXISTS, AND WHY IT MOVED HERE (2026-09-02, Mark's sign-off). This
# data used to live as a 750-line Python tuple (`ENTRIES`) inside
# cic/engine/texts_registry.py. Moving it to YAML changes nothing about what
# it means or how it's checked — cic/engine/texts_registry.py still reads it,
# still validates it against what's actually sitting in cic/texts/, still
# generates cic/texts/README.md from it — but it stops requiring Python to
# read or write: the download queue, a future Zotero export, the Atlas feed,
# or Mark by hand can all work with this file directly, the same reason
# cic/corpus-map/WORKS.yaml and AUTHOR-IDS.yaml are YAML and not Python.
#
# WHAT BELONGS HERE. Only what a vendored file's own header can't say and
# scanning records/ can't compute: when it arrived, who supplied it, and
# free-form notes — the editorial content that used to live only in a
# hand-maintained README before this registry existed (e.g. "this volume's
# own Julius is Africanus, not Rome"). Everything else — the file's own
# stated rights line, its title, which records actually cite it — is read
# fresh off the real file and the real records/ tree every run by
# cic/engine/texts_registry.py, never trusted from a claim written here.
# See that module's own docstring for the full verified-not-asserted case.
#
# HAND-MAINTAINED, APPEND-ONLY, NO-REWRITE-HISTORY — same discipline as
# WORKS.yaml and cic/corpus-map's own bucket files. A note that was true
# when written (a "~1929" date-rule reference, a translator note later
# refined) stays as written; it is a historical record of what was known
# then, not something later sessions silently correct. `notes` is optional
# per entry — omit it rather than writing an empty string.
#
# SCHEMA, per entry:
#   filename:      the file's own name under cic/texts/ (not a path — this
#                  directory is intentionally flat, see that directory's own
#                  README for why)
#   supplied_by:   who actually supplied the file (a person's name, or the
#                  transcriber/site it was vendored from)
#   date_added:    ISO date this entry was added to the registry
#   notes:         free-form, optional — anything about this specific file's
#                  provenance, conversion, or caveats that isn't recoverable
#                  by reading the file or scanning records/
#   apparatus:     optional, and rare — a CLOSED list of this edition's own
#                  footnote/column-marker CONVENTIONS that the quote-verbatim
#                  gate (engine/m1/quote_verbatim.py) strips before matching,
#                  because this one vendored file's own typesetting inlines
#                  them with no wrapper the gate's fleet-wide `apparatus`
#                  class already recognizes (soft hyphen, tilde-digit,
#                  pipe-page, bracketed locator). Never a per-record field,
#                  and never a per-QUOTE pattern either — R33 (2026-09-23,
#                  Mark, on this file's own first draft, which anchored five
#                  entries to one quote's exact wording each): "we should be
#                  setting principles we will have a 100 worlds and cant
#                  tell the representitive what to say for every quote."
#                  An entry describes the EDITION's own convention, evidenced
#                  against the real file, and applies to every quote citing
#                  it - never a shape written to fit one quote's own words.
#                  Three kinds:
#                    kind: regex (the default, omit the key) - a plain
#                      Python regex naming a real, recurring, self-
#                      contained marker shape (a symbol that is never real
#                      prose, a locator glued to its own wrapper, a bare
#                      letter from a closed, non-word set) - never a bare
#                      unwrapped digit, which no shape can safely tell apart
#                      from a real digit quantity without more structure
#                      (this registry's own history: Palladius and Ammianus
#                      both quote real digit quantities as content - "some
#                      300 monks", "some 400 monks" - so "any bare digit" is
#                      never a safe edition-wide regex).
#                    kind: endnote-sequence - for a bare digit run with no
#                      wrapper of its own, when the edition's own numbered
#                      endnotes section (real entries, "N. ...", found at
#                      `notes_start_pattern`) gives independent, structural
#                      proof that a given digit is that edition's own next
#                      footnote number, not content: the gate walks the
#                      running text once, tracking the next expected
#                      endnote number from that real list, and strips a
#                      bare digit token only when it exactly equals that
#                      expected number - never any bare digit on its own.
#                      "300 monks" survives untouched unless 300 is
#                      genuinely the very next endnote in the sequence at
#                      that point, which the real notes list, read fresh
#                      every run, decides - never guessed.
#                    kind: letterform (Mark's OCR/normalization ruling,
#                      2026-09-25) - this ONE edition's own OCR misreading
#                      of an archaic letterform (e.g. a scan rendering
#                      thorn as `])` or `]?`), matched and REPLACED with
#                      `replacement`, never just dropped. Never a global
#                      rule: engine.m1.quote_verbatim.
#                      normalize_archaic_letterforms already handles long
#                      s/thorn/eth fleet-wide as real typesetting
#                      equivalences; this kind exists only for a specific
#                      scan's own OCR error, verified against that
#                      edition's own page image before being added -
#                      never guessed from the OCR text alone.
#                  Fields, per entry:
#                    name:               short, descriptive, unique within
#                                        this file
#                    kind:               "regex" (default), "endnote-
#                                        sequence", or "letterform"
#                    pattern:            (kind: regex or letterform) a
#                                        Python regex (re.search) matched
#                                        against the RAW vendored text
#                                        before any other stripping
#                    replacement:        (kind: letterform only) the real
#                                        letterform the matched OCR span
#                                        stands for - the match is REPLACED
#                                        with this, never dropped. (kind:
#                                        regex matches are always dropped -
#                                        replaced with "" - and never use
#                                        this field.)
#                    notes_start_pattern: (kind: endnote-sequence only) a
#                                        Python regex (re.MULTILINE,
#                                        re.search), quoting the real first
#                                        line of this edition's own numbered
#                                        endnotes section verbatim - text
#                                        before its match is "running text"
#                                        to walk; text from its match
#                                        onward is parsed for the real
#                                        ordered endnote numbers
#                    evidence:           the real break(s) this convention
#                                        was traced to - quoted directly
#                                        from the vendored file, never a
#                                        generalization from a description
#                                        of it, and never just the one quote
#                                        record that first surfaced it
#
# Validated by cic/engine/texts_registry.py:
#   python cic/engine/texts_registry.py                 # report
#   python cic/engine/texts_registry.py --write-readme   # regenerate cic/texts/README.md

- filename: anf01_apostolic-fathers-justin-irenaeus.xml
  supplied_by: Mark
  date_added: '2026-08-15'
  notes: >-
    CCEL's native ThML source, SWAPPED IN 2026-08-15 for the plain-text rendering that originally
    carried this id - same volume, same rights basis, verified byte-identical on all four
    passages already committed as quote records (pahcq001-004) before the swap. Structurally
    better for this build's own purposes: shorter/longer/Syriac recensions are addressable
    by id (e.g. v.v.iv-p1 vs v.v.iv-p4 for Romans 4), and footnotes are their own <note> elements
    rather than interleaved apparatus text - both real friction points hand-transcribing the
    plain text had already hit. Extracting text correctly requires walking element trees properly,
    not naive regex: a lazy `<p>...</p>` match truncates early against nested <note><p class="endnote">...</p></note>
    structures, and a node's own skip-tag status must not be applied to its `tail` text -
    both mistakes were made and caught live during this swap, on the Smyrnaeans and Martyrdom-of-Polycarp
    passages respectively, before anything was recommitted.
