# CiC canonical operational-parameters file (Pass 1 SS3.9; blueprint S1.4).
# One canonical home for every number restated inline across documents and
# code. Every entry carries its governing-source citation; a value with no
# source is a defect, not a guess (S1.4's R check). Governing documents gain
# POINTERS to this file in Phase 6 (S5.5/S6.1, wording per Mark) - no
# governing document was edited by S1.4. Runtime code does not read this
# file yet; S4.4a is the named first runtime consumer (F9), S6.4 the second.
#
# Entry shape: value(s) + source (where the number is authoritatively set
# today: a governing document, verified code location, or Pass 1's verified
# decomposition) + notes where the number needs context.

schema_version: 1
file_status: canonical-from-S1.4; consumers wired later (F9)

parameters:
  table_size_ceiling:
    design_value: 5  # RETIRED 2026-08-01, see status note below - kept for history, no longer live
    current_phase_value: 3  # now the permanent ceiling, not a phase-1 placeholder
    source:
      design_value: >-
        L3D-Encounter-Methodology/CiC_L3D_The_Table_Design_Document_V2.3.docx -
        "The ceiling is five worlds at any one Table" (verified in the document
        text, 2026-07-26; stated there as a design commitment, not a technical
        limit).
      current_phase_value: >-
        old-tree app/main.py start_session - request.world_ids[:3],
        comment "Cap at 3 worlds max (Prototype/Phase 1 scope - cost and
        complexity)" (verified in code, 2026-07-26).
    notes: >-
      Pass 1 SS3.9: "one number in one place with per-phase overrides -
      resolving three live values across current governance documents."
    status: >-
      RETIRED 2026-08-01 (Mark's decision, cost-driven): the design_value of 5
      is no longer a live target awaiting a later raise. 3 is now the
      permanent table-size ceiling. The design_value field and its source
      citation are kept for history, not deleted, per this file's own
      never-in-place-edit convention for settled inputs - the retirement is
      the new fact, not an erasure of the old one. See
      old-tree Ministry Operations/Standing/CiC_System_Hub_Decision_Log.md, 2026-08-01.

  turn_floor_multi_world:
    value: 2
    source: >-
      old-tree app/main.py - MIN_MULTI_WORLD_TURNS = 2 (local constant
      inside send_message_stream; verified 2026-07-26). Lowered from 3 per the
      Fable conversational-engagement analysis (comment at the definition).
    notes: >-
      Per-round floor. Its retirement to a per-conversation contract is M3
      (Pass 1 SS12.7), implemented at S4.4b only after Mark decides. S4.4a
      makes the runtime read this entry instead of the hardcoded constant (F9).

  prefix_budget_per_world:
    value: 12000
    source: >-
      S5.3 (blueprint Touches: "old-tree:parameters.yaml (per-world prefix
      budget)") - the always-present cached-prefix ceiling per world, in
      estimated tokens (chars/4). Desert measured post-R7 at ~5.8k
      assembled + ~2.2k capsule = ~8k against this 12k ceiling
      (2026-07-27); the ceiling is the eviction trigger: under pressure,
      segments yield in eviction_priority order (demonstrations first,
      per the SS5.1 manifest).
    notes: >-
      Consumed by the assembly view's manifest (reported) - a hard
      runtime enforcer lands with S6.2's per-world builds when worlds
      with larger lexicons (Alexandria) migrate.

  turn_ceiling_multi_world:
    value: 6
    source: >-
      old-tree app/main.py - MAX_MULTI_WORLD_TURNS = 6 (same block;
      "cost/latency backstop only - not a target"; verified 2026-07-26).

  conversation_turn_cap:
    value: 20
    source: >-
      old-tree app/message_cap.py - CONVERSATION_TURN_CAP = 20
      (verified 2026-07-26; counts representative turns, so a 3-world table
      reaches it in ~8 participant turns - measured live in B-COST C4, see
      baselines/cost_baseline_2026-07_run_notes.md).

  token_budget_primary_turn:
    value: 1200
    source: >-
      old-tree app/graph/nodes.py - PRIMARY_TURN_MAX_TOKENS = 1200
      (verified 2026-07-26; raised from 550 per Mark's own call 2026-07-24/25,
      per the constant's comment - ceiling against runaway turns, not a
      length target).

  token_budget_reactive_turn:
    value: 900
    source: >-
      old-tree app/graph/nodes.py - REACTIVE_TURN_MAX_TOKENS = 900
      (verified 2026-07-26).

  token_budget_classifier:
    value: 60
    source: >-
      old-tree app/graph/nodes.py - CLASSIFIER_MAX_TOKENS = 60
      (verified 2026-07-26; single-word/short-line classifier responses).

  reading_floor:
    flesch_kincaid_grade_band: [8, 10]
    flesch_reading_ease_min: 60
    source: >-
      L3C-Representative-Methodology/CiC_L3C_Representative_Construction_
      Framework_V3.2.docx, Part Five - "a Flesch-Kincaid grade band of roughly
      8 to 10 and a Flesch Reading Ease of 60 or above ... this standard is
      independent of vocabulary" (verified in the document text, 2026-07-26).
    notes: >-
      Pass 1 SS5.6: Article 30 itself carries no number; the numeric floor
      lives in RCF V3.2 Part Five / Final Assembly 5c, and this file is now
      the canonical number both documents will point at (Phase 6). Sentence
      structure only, never vocabulary. Instrument: S1.3's readability gate.

  drift_signal_count_emitted:
    value: 20
    source: >-
      S4.3 declared the 17 of Pass 1 SS3.9's decomposition (10 monitor signals
      + anachronism alias + over_settling + 5 table-level checks); S4.7 added
      misattribution, manufactured_resolution, and closing_synthesis and
      promoted cross_world_vocabulary to table_discourse - 20 emitted types,
      one ordering (gates/S4.7_grounding_table_checks.md).
    notes: >-
      Verification: state.py's DriftSignal.signal_type Literal declares exactly
      these 20 (counted, S5.5). Stale 17 caught by the S5.5 pointer pre-check
      (FLAG-016, resolved by Mark 2026-07-27 with the Facilitator Governance
      V3.6 pointer wording - the M decision this entry's currency rides with).
      Facilitator Governance's own six-plus-five taxonomy is teaching
      structure, not this count; where they differ, this file is current.

  tier1_short_circuit_rank:
    value: 2
    source: >-
      old-tree app/rag/batch_evaluate.py - TIER1_SHORT_CIRCUIT_RANK = 2
      (verified 2026-07-26). A Tier-1 candidate ranking in the top 2 semantic
      matches retrieves without an LLM vote.
    notes: >-
      B-RETR (S1.2) measured this short-circuit bypassing Do-Not-Retrieve-When
      wherever force_llm_vote is unset - context for S3.x, not a defect in the
      constant itself.

  retrieval_k_lexicon:
    value: 3
    source: "old-tree app/rag/retriever.py - LexiconRetriever.retrieve(k=3) default (verified 2026-07-26); candidate pool = k*2."

  retrieval_k_story:
    value: 2
    source: "old-tree app/rag/story_retriever.py - StoryRetriever.retrieve(k=2) default (verified 2026-07-26); candidate pool = k*2."

  cost_thresholds:
    value: TBD-pending-baseline
    baseline: old-tree Ministry Technology/Pass2/baselines/cost_baseline_2026-07.md
    source: >-
      Pass 1 SS11-D: thresholds are set once, from real baselines, at the
      S6.6 decision - setting numbers today would be the fabricated-baseline
      risk SS10 exists to avoid. B-COST (committed 2026-07-26) is the baseline
      they will be set from: $0.165/participant-turn average standard-rate,
      single-world $0.080-0.140, three-world ~$0.38 uncapped.

# SS10's metric records: the scorecard as data. gate_status values:
#   definitional-gate  - settable now, definitionally (SS11-D)
#   TBD-pending-baseline - named now, threshold set at S6.6 from baselines
#   observational      - tracked, never gates a freeze by itself
metrics:
  - name: field_completion_rate
    definition: "% of required fields populated, per record type per world (requiredness per Pass 1 SS11-A)"
    instrument: S1.3 wrs_gates field-completion gate
    baseline: n/a (definitional)
    gate_status: definitional-gate (100% on required fields; Pass 1 SS11-D)
  - name: referential_integrity_violations
    definition: "count of record references that do not resolve"
    instrument: S1.3 wrs_gates referential-integrity gate
    baseline: n/a (definitional)
    gate_status: definitional-gate (0; Pass 1 SS11-D)
  - name: reciprocity_violations
    definition: "count of directional relations (relations[]/field_relations[]/interaction[]/connections[]) lacking their reciprocal"
    instrument: S1.3 wrs_gates reciprocity gate
    baseline: n/a (definitional)
    gate_status: definitional-gate (0; Pass 1 SS11-D)
  - name: do_not_retrieve_when_violations
    definition: "count of golden-set must_not IDs appearing in the final retrieved set"
    instrument: retrieval_eval/run_eval.py (S1.2)
    baseline: old-tree Ministry Technology/Pass2/baselines/retrieval_baseline.json (B-RETR, 2026-07-26)
    gate_status: definitional-gate (0 on the golden set; Pass 1 SS11-D; standing retrieval regression rule, blueprint SS1)
  - name: retrieval_pass_at_k
    definition: "per-category Pass@k / recall@k / MRR on the six-category golden sets"
    instrument: retrieval_eval/run_eval.py (S1.2)
    baseline: old-tree Ministry Technology/Pass2/baselines/retrieval_baseline.json (B-RETR, 2026-07-26)
    gate_status: TBD-pending-baseline (floor set at S6.6)
  - name: held_position_rate
    definition: "challenged claim supported by the record -> position held, from inside the world (rate over challenge events)"
    instrument: S4.6 repair-classifier challenge events against contested_claim records; first computed in the S4.6 pushback battery
    baseline: none yet (first computed at S4.6)
    gate_status: TBD-pending-baseline
  - name: concession_rate
    definition: "challenged claim unsupported by the record -> plain concession (rate over challenge events); never merged with held_position_rate"
    instrument: same as held_position_rate
    baseline: none yet (first computed at S4.6)
    gate_status: TBD-pending-baseline
  - name: parroting_overlap
    definition: "n-gram overlap between prompt material and spoken turns (Pass 1 SS5.3)"
    instrument: old-tree:metrics/parroting.py (built at S1.3 per F7; run at S5.1)
    baseline: >-
      B-PARROT, COMMITTED 2026-07-27 (S5.1):
      old-tree Ministry Technology/Pass2/baselines/B-PARROT.json (+ the sampled
      turns beside it, re-derivable per session-contract rule 2). n=6,
      seed s51, 20 turns/world where available (hieronymian and
      imperial-juridical at n=1 - honestly thin until their worlds see
      more live turns). prompt_only means 0.0008-0.0091 across worlds,
      worst single turn 0.0952; the S5.3 tolerance band (F3) computes
      from these stds. Probe category: old-tree:probes/parroting.yaml.
    gate_status: TBD-pending-baseline (ceiling adopted at S6.6 from B-PARROT; R7 tolerance per F3 until then)
  - name: voice_continuity_regression
    definition: "blind-graded probe-parity between prompt versions (Pass 1 SS5.2), two independent trials"
    instrument: probe-parity protocol (V7.4 Validation Protocol Rigor)
    baseline: per-world at first regeneration (S2.8, S5.2)
    gate_status: definitional-gate (same voice - no regression without a filed flag)
  - name: groundedness_fabrication_rate
    definition: "fabrication-adjudicator verdicts as a rate over sampled turns, split intrinsic/extrinsic (AIS-style attributability)"
    instrument: S4.3's split FABRICATED verdicts, observable via the S4.2 event log
    baseline: none yet (observable after S4.2/S4.3)
    gate_status: observational
  - name: one_round_clear_rate
    definition: "% of record batches clearing content review in one round (build-quality ledger)"
    instrument: Phase 2/6 batch review artifacts
    baseline: accumulates from S2.2 onward
    gate_status: observational
  - name: self_certification_recurrence
    definition: "count of self-certified review dismissals (the metric with a demonstrated historical failure rate)"
    instrument: review artifacts audit (CO-020/CO-022 discipline)
    baseline: six-world defect ledger (historical)
    gate_status: observational (target 0)
  - name: machine_gate_failure_count
    definition: "gate failures at first run - a health indicator; a gate that never fails is checking nothing"
    instrument: S1.3 wrs_gates run reports
    baseline: accumulates from S1.3
    gate_status: observational
  - name: cost_per_turn
    definition: "real per-turn/per-conversation spend at true rates; cache-read fraction; calls-per-turn by model tier"
    instrument: scripts/cost_baseline_runner.py over usage logs (S1.1a instrumentation)
    baseline: old-tree Ministry Technology/Pass2/baselines/cost_baseline_2026-07.md (B-COST, 2026-07-26)
    gate_status: TBD-pending-baseline (deltas tracked at S3.4/S4.4/S5.2/S5.3; verdict at S6.6)
