    census_id: "hieronymian-ascetic-literary"   # cic-website/data/world-census.json entry id (atlasId "I.9") - the census entry's own id field is what the Atlas deep link sends (per the alx verification of atlas-v3.html's data-aid wiring); matches this world's world_id independently
    package:
      manifest_hash: "sha256:1439f5443ee53ac3f3cd9a8c8d6ee6ec594c60ea76da9ec829004c480d2daac1"
      location: "packages/hal/2026-08-27T14-00-23Z"   # recompiled 2026-08-27: UNOPENED-VOLUME SWEEP. Twelve volumes, nine of them further volumes of an author this world already opens. THREE OPENED. npnf102 for City of God XVIII.42-44: this world's Augustine had been the letters alone, which is the argument while it was live, and this is the verdict delivered years later for the whole church - he grants Jerome all three languages, grants the Jews call his work faithful, grants the Seventy erred in many places, and rules against him anyway because the seventy were prophets too. Declared tension-with hebraica-veritas, not illustrating it. origen_philocalia for the CONTROL ON RUFINUS: this world's rupture turns on whether Rufinus softened De Principiis and the Greek is lost except where the anthology preserves it. Budge's Syriac Paradise for the second recension of this world's one hostile witness, which charges something different - the Greek says Jerome had a disastrous TEMPER and has Posidonius PREDICTING Paula will die first; the Syriac says ENVY AND EVIL-EYEDNESS and reports she departed 'before her time' to escape it. And the Syriac has no Paula in its women's chapters at all. DECLINED with reasons include npnf201 as a pure HOMONYM - the match is 'Eusebius' inside this world's own spelling of Jerome's full name. hal 155 -> 161 records.
    thinness_statement: "Richest in Jerome's own letters, translation prefaces, and the remembered lives of the Roman women who sustained the work; thinner on the women's own words (none survive), ordinary monastery residents, and daily-life detail beyond one letter."
    living_tradition_flag: true   # PROVISIONAL, set toward disclosure (spec principle 6): the living-tradition determination is Mark's per-world touchpoint and has not been made for this world under the new spec. Substance: this is a bounded historical reconstruction of one specific 382-420 network, not today's church of any name - but Jerome, the Vulgate, and Latin monasticism are all claimed inheritances of living traditions (Roman Catholic above all), so until Mark rules, the doorway should carry the distinction rather than omit it. Flipping to false is Mark's call, not the build thread's.
