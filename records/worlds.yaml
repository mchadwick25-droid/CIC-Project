    world_id: fixture-synthetic
    display_name: "Fixture World (synthetic)"
    time_window: {start: 100, end: 100}
    place: "Testland (synthetic, no real geography)"
    representative: {name: Vera, role_label: Witness}
    state: built
    census_id: null
    package:
      manifest_hash: "sha256:7bfd5e711f12f20b745305d7cbd85f4063323a7a9acb0015fa80998acfbb4928"
      location: "packages/fix/2026-09-04T16-41-58Z"
    thinness_statement: "Synthetic by design: substantive on 5 of Canon v1's 28 cells, honest-limited on the rest, on purpose, to exercise both coverage-gate routes."
    living_tradition_flag: false
  alx:
    kind: formation
    world_id: alexandria-catechetical
    display_name: "Alexandrian Christianity"
    time_window: {start: 150, end: 400}
    place: "Alexandria and Egypt"
    doorway_place: "Alexandria and Egypt"
    doorway_description: >-
      Alexandria was the Roman world's great city of learning. Its church made
      teaching the heart of the faith. New believers were formed by years of
      staged instruction before baptism. Teachers like Clement and Origen read
      Scripture in layers: the plain story, and the deeper meaning inside it.
      They were confident that Greek learning could serve Christ rather than
      threaten him. In this world, faith grows the way understanding grows - by
      study, questions, and a teacher's patient guidance.
    card_name: "Alexandrian Christianity"
    representative: {name: Theon, role_label: "Catechetical Teacher"}
    state: admitted
    census_id: "alexandria-catechetical"
    package:
      manifest_hash: "sha256:708d240fa5820099e054be11db8b4769e5b38d8a022493a2d213e78f743e916f"
      location: "packages/alx/2026-09-09T23-12-35Z"
    thinness_statement: "Richest in teaching, argument, and the theology of formation; thinner on women's own words, ordinary believers, and rural Coptic Egypt."
    living_tradition_flag: true
  desert:
    kind: formation
    world_id: desert-monasticism
    display_name: "Desert Monasticism"
    time_window: {start: 320, end: 430}
    place: "Egyptian and Palestinian desert monasticism - Nitria, Kellia, Scetis (Strand C, semi-anchoritic), Pispir/the inner mountain (Strand A, anchoritic), Tabennesi and the Pachomian federation (Strand B, cenobitic)"
    doorway_place: "The Egyptian desert - Nitria, Kellia, Scetis, and the monasteries of the Nile valley"
    doorway_description: >-
      In the 300s, thousands of men and women left Egypt's villages for the
      desert. They believed that becoming like Christ meant leaving ordinary
      life behind. Some lived alone, following Antony's example. Some lived in
      large communities under Pachomius's written rule. Many settled in loose
      clusters of cells around a shared church. What bound them together was the
      daily fight against tempting thoughts, work done with their own hands, and
      elders trusted because their lives had been tested. Above every other
      virtue they honored discernment: the skill of judging how much any one
      person can bear.
    card_name: "Desert Fathers and Mothers"
    representative: {name: Papnoute, role_label: "Abba (Elder)"}
    state: admitted
    census_id: "desert-monasticism"
    package:
      manifest_hash: "sha256:9a79a0a3208631344881e77709e066df3341b8cc7e361c7004f6eb8f18ca4cf4"
      location: "packages/desert/2026-09-09T03-17-52Z"
    thinness_statement: "Richest in the Apophthegmata's own elder-and-disciple sayings tradition and Antony's own Vita; thinner on ordinary participants outside the collected-sayings tradition, on the Pachomian federation's own interior life beyond its founding, and on women's own voices (a small number of amma sayings, not a fuller corpus)."
    living_tradition_flag: true
  pahc:
    kind: formation
    world_id: post-apostolic-house-church
    display_name: "Post-Apostolic Household-Church Christianity"
    time_window: {start: 70, end: 200}
    place: "Antioch/Syria, Asia Minor, Rome"
    doorway_place: "Antioch, the cities of Asia Minor, and Rome"
    doorway_description: >-
      After the apostles died, the church lived in ordinary houses.
      Greek-speaking believers gathered around household tables in Antioch, in
      the cities of Asia Minor, and in Rome. Letters held these scattered
      communities together. A bishop under guard wrote ahead to the churches on
      his road to execution. Rome wrote at length to settle a quarrel in
      Corinth. There were no church buildings yet, no finished New Testament,
      no safety in the law. There were only communities working out, generation
      by generation, what it meant to stay one church across an empire.
    card_name: "The Scattered Households"
    representative: {name: Chloe, role_label: "Household Leader"}
    state: admitted
    census_id: "post-apostolic-house-church"
    package:
      manifest_hash: "sha256:ae504b13b2ce19ddc0949bc8be1010132d172ddf4203d9d335b551c2a1d79800"
      location: "packages/pahc/2026-09-10T09-40-33Z"
    thinness_statement: "Richest in letters, church order, and worship practice; thinner on women's own words, enslaved members, the non-literate majority, and any material remains."
    living_tradition_flag: true
  hal:
    kind: formation
    world_id: hieronymian-ascetic-literary
    display_name: "Hieronymian Ascetic-Literary Christianity"
    time_window: {start: 382, end: 420}
    place: "Bethlehem and Rome"
    doorway_place: "Bethlehem and Rome"
    doorway_description: >-
      In the year 382 the scholar Jerome came to Rome. There he met a circle of
      noblewomen who had already traded wealth and status for lives of prayer
      and study. Their partnership moved to Bethlehem: his learning, their
      leadership and money. Paula and her daughter Eustochium built monasteries
      and a guesthouse for pilgrims. Jerome translated the Bible into Latin from
      the Hebrew it was first written in. Letters across the sea held the world
      together. It ends when the Bethlehem generation dies out, around the year
      420.
    card_name: "The Bethlehem Circle"
    representative: {name: Albina, role_label: "Widow of the Household"}
    state: admitted
    census_id: "hieronymian-ascetic-literary"
    package:
      manifest_hash: "sha256:88dffc65eb5ea4321d5fc9de7c6125fbaefb2346df6f99ce76314faeeb5dacc8"
      location: "packages/hal/2026-09-09T23-14-42Z"
    thinness_statement: "Richest in Jerome's own letters, translation prefaces, and the remembered lives of the Roman women who sustained the work; thinner on the women's own words (none survive), ordinary monastery residents, and daily-life detail beyond one letter."
    living_tradition_flag: true
  syr:
    kind: formation
    world_id: syriac-edessa-nisibis
    display_name: "Syriac Christianity (Edessa/Nisibis)"
    time_window: {start: 200, end: 410}
    place: "The Syriac-speaking ecology across the Roman-Persian Mesopotamian frontier (Edessa, Nisibis, Persian Adiabene)"
    doorway_place: "Edessa, Nisibis, and the border country between Rome and Persia"
    doorway_description: >-
      This is the church that sang its teaching. Its people spoke Syriac, a
      sister language of the Aramaic Jesus spoke. They lived in the border
      cities between the Roman and Persian empires. Their great teachers,
      Ephrem and Aphrahat, taught the faith through hymns and plain teaching
      pieces, not learned treatises. At the community's heart stood the
      covenant: men and women vowed to celibacy and service, who stayed inside
      the ordinary congregation instead of leaving for a monastery. The story
      opens with the first trace of a church in Edessa, a building lost to
      flood in the year 201. It closes in 410, when the church inside Persia
      took on a formal structure and this world's own way of life gave way to
      something more official.
    card_name: "Syriac Christianity"
    representative: {name: "Mar Yausep", role_label: "Teacher of the Covenant Order"}
    state: admitted
    census_id: "syriac-edessa-nisibis"
    package:
      manifest_hash: "sha256:eecd2703568c7dd77696feac78cc5b26e94dbb96cb2c379a8bd746e5e9d61df4"
      location: "packages/syr/2026-09-10T00-12-57Z"
    thinness_statement: "Richest in hymns, doctrinal teaching, and covenant asceticism (Ephrem, Aphrahat); thinner on ordinary believers, women's own words, and the years after Ephrem's death."
    living_tradition_flag: true
  ijc:
    kind: formation
    world_id: imperial-juridical
    display_name: "Imperial and Juridical Christianity"
    time_window: {start: 312, end: 451}
    place: "Rome, Constantinople, Milan"
    doorway_place: "Rome, Constantinople, and Milan"
    doorway_description: >-
      In 312 the emperor Constantine took the church under his protection, and
      everything changed. Bishops who had met in secret now gathered in councils
      an emperor convened. The church gained legal standing, wealth, and a seat
      near Roman power. It also had to decide what that nearness should cost.
      This is the world of the great councils and their canons - the church's
      written rulings. It is the world of Ambrose of Milan facing down emperors,
      and of Rome's bishops building their claim to speak for the whole church.
      It closes at the Council of Chalcedon in 451.
    card_name: "Church and Empire"
    representative: {name: Marius, role_label: "Deacon of the Letters"}
    state: admitted
    census_id: "imperial-juridical-christianity"
    package:
      manifest_hash: "sha256:0073a22c17559bc5d0cd639e77a264c0613c3610d6cfbc6b653faea10967fcca"
      location: "packages/ijc/2026-09-10T00-31-01Z"
    thinness_statement: "Richest in councils, canons, letters, and the contest over who holds final authority in the church; thinner on ordinary believers' daily lives, women's own words, and the defeated Homoian side's own voice."
    living_tradition_flag: true
  cappadocian:
    kind: formation
    world_id: cappadocian-trinitarian
    display_name: "Cappadocian Christianity"
    time_window: {start: 325, end: 394}
    place: "Cappadocia and Pontus"
    doorway_place: "Cappadocia and Pontus"
    doorway_description: >-
      In the fourth century, the churches of Cappadocia and Pontus fought to
      defend the faith declared at Nicaea - one God, three who truly are.
      Basil of Caesarea, his friend Gregory of Nazianzus, and his brother
      Gregory of Nyssa became this world's most remembered voices, but the
      faith they defended was lived by a whole people: households and
      congregations, and communities newly ordered into a common life built
      around a door kept open for the poor. The same exactness that shaped
      the church's confession also shaped its care - a famine-born complex
      outside Caesarea fed, housed, and nursed the destitute and the sick.
      The story runs from the years after the last persecutions to the
      deaths of this founding generation, under emperors who alternately
      protected and opposed the Nicene faith. It closes with that faith's
      own vindication, and more than a decade spent living inside the
      victory.
    card_name: "The Cappadocian Churches"
    representative: {name: Chilo, role_label: "Elder of the Brotherhoods"}
    census_id: "cappadocian-nicene-pastoral-monastic-tradition"
    thinness_statement: "Richest in the letters, orations, and treatises of Basil, Gregory of Nazianzus, and Gregory of Nyssa; thinner on women's own words (none survive in their own hand), the plateau's non-elite and non-Greek-speaking faithful, the enslaved (never heard in their own voice despite one preacher's own sharp protest against the institution), and the defeated parties (Eustathius, the Homoian church, the Eunomian movement) who survive almost only inside their opponents' polemic."
    living_tradition_flag: true
    state: admitted
    package:
      manifest_hash: "sha256:68a2bac341da5e873cc197543cc72935be8189baee971c2b2d91c89ad23d75c9"
      location: "packages/cappadocian/2026-09-10T00-10-21Z"
  gallic:
    kind: formation
    world_id: gallic-monastic-ascetic-christianity
    display_name: "Gallic Monastic-Ascetic Christianity"
    time_window: {start: 360, end: 450}
    place: "Gaul - the Loire valley around Tours, and the island of Lerins and the city of Marseilles on the Mediterranean coast"
    doorway_place: "The Loire valley and the Mediterranean coast of Gaul"
    doorway_description: >-
      This is the church of the ascetic bishop and the received wisdom of
      Egypt, carried west. In the Loire valley, a soldier who left the army
      gathered followers in the woods and became a bishop who never stopped
      living like a monk. Two generations later, on an island off the
      Mediterranean coast and in the city of Marseilles, monks who had lived
      among the fathers of Egypt built communities that trained abbots and
      bishops for the churches of southern Gaul. One of them adapted the
      customs of the Egyptian desert for a colder climate and a different
      church. Another wrote a rule for telling the true faith from every
      novelty. Through both households ran one argument, never fully
      settled: how much of a monk's progress is God's own gift, and how much
      is his own effort. The story closes around the year 450, before that
      argument hardened into fixed positions on either side.
    card_name: "The Monk-Bishops of Gaul"
    representative: {name: Renatus, role_label: Bishop}
    state: admitted
    census_id: "gallic-monastic-ascetic-christianity"
    thinness_statement: "Richest in the ascetic bishop's own hagiography and the received teaching of the Egyptian fathers as Cassian carried it west; thinner on the island's own daily customs, women's own words (none survive), and the sexual-discipline material a later editor removed from the one edition this build can read."
    living_tradition_flag: true
    package:
      manifest_hash: "sha256:9f7211822ac9771b1b22175d492675973d954a36f15f297daec54d9f06b6c8f8"
      location: "packages/gallic/2026-09-14T15-25-13Z"
  don:
    kind: formation
    world_id: donatism
    display_name: "Donatism"
    time_window: {start: 311, end: 439}
    place: "Roman North Africa - Carthage, Numidia, Africa Proconsularis, Byzacena, Mauretania"
    doorway_place: "Carthage and the towns of Numidia"
    doorway_description: >-
      In 311 or 312, a bishop of Carthage accused of surrendering the
      scriptures under persecution was consecrated anyway - and a rival
      was consecrated beside him because of it, not in his place. From
      that day the same see held two bishops at once, two parallel
      hierarchies contesting town after town across Roman North Africa,
      each holding its own basilicas and its own unbroken line of
      ordination. This is the rigorist alternative communion that grew
      from that refusal: not a doctrinal heresy - its confession is
      standard North African Latin Trinitarian and Christological
      orthodoxy - but a communion built on one unyielding conviction,
      that a tainted hand cannot give what it claims to give, lived out
      through rebaptism, the martyrs' graves read aloud once a year, and
      a refusal of the Christian emperor's own standing to judge the
      church. It closes in 439, when a Vandal army took Carthage and
      removed the Roman state this whole refusal was defined against.
    card_name: "The Church of the Martyrs"
    representative: {name: Fidelis, role_label: "Bishop of the Unbroken Line"}
    census_id: "donatism"
    thinness_statement: "Richest in the purity doctrine and its rebaptism consequence, the legal and institutional shape of the schism, the conciliar and imperial documentary record, and the martyr narratives; nearly the whole textual record passes through the hands of Catholic opponents (Optatus, Augustine) before reaching us, its central evidentiary problem. Thinner to silent on ordinary believers' own interior life, women's own words (one named laywoman, preserved only inside a hostile narrative explaining the schism, and a second never named at all), Numidian basilica archaeology (no site report survives anywhere in this world's own source ecology), speculative theology beyond Tyconius's single case, and any Donatist-authored institutional record of the external forces pressing on this communion."
    living_tradition_flag: false
    state: built
    package:
      manifest_hash: "sha256:c5af663331a6310bd681020ad3dc9e7845f86bce84807aa253a8220c1146b999"
      location: "packages/don/2026-09-14T22-40-34Z"
