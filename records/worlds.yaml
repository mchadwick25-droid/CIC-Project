  cappadocian:
    kind: formation
    # RENAMED 2026-08-31 (full alignment, Mark's own direction: "the name
    # should reflect the world and christian tradition, not an old naming
    # convention... what is the right name... fix it right"). world_id was
    # nicene-cappadocian, display_name was "Nicene-Cappadocian Christianity"
