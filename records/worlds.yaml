      manifest_hash: "sha256:a342a17afdb6d00f49f6a028eafa5d4a88170dcd8633c37bf317a69ae2051c26"
      location: "packages/desert/2026-08-27T14-14-33Z"   # recompiled 2026-08-27 (eleventh pass): A RETRIEVAL MEASUREMENT, not new material. The turn pipeline reaches a record by matching a question to one or two canon cells and then drawing from that cell's coverage, so a record is only ever as reachable as its canon_cells and its retrieval.retrieve_when hints make it. MEASURED FLEET-WIDE: 125 quote records across six worlds, and NOT ONE carries a retrieve_when hint - every story has one. Quotes therefore contribute nothing to which cell a question reaches and surface only when their cell happens to be picked. Three desert quotes were hinted as a test (origen-on-the-sinning-brother, god-is-not-a-body, monks-like-hyenas) and two dead questions came back: 'how did you decide whether to correct a brother who had sinned' went from 2 records, both wrong, to 13 including Origen on Matthew 18; 'what was the argument about Origen actually about' went from 1 wrong record to 13 including God-is-not-a-body. THE FIRST MEASUREMENT WAS CONTAMINATED - the hints reused the probe's own wording - so it was rerun on eight held-out questions phrased differently, where three that had reached almost nothing (0-4 records, no cell match at all) now reach a full ground. ONE CELL CORRECTED on the evidence: monks-like-hyenas carried F3-I alone and belongs first in F6-I ('was there anything about your own community that troubled you?'). TWO LIMITS STAND AND ARE NOT FIXED HERE: 'is there anything Pachomius himself actually put in writing' still reaches six records of scriptural-engagement material and none of the Rule, because retrieval keys on cell vocabulary and not on named entities; and 'how much did they own' reaches nothing at all, falling under the two-word minimum for a cell match. desert 158 records, unchanged.
    thinness_statement: "Richest in the Apophthegmata's own elder-and-disciple sayings tradition and Antony's own Vita; thinner on ordinary participants outside the collected-sayings tradition, on the Pachomian federation's own interior life beyond its founding, and on women's own voices (a small number of amma sayings, not a fuller corpus)."
    living_tradition_flag: true   # set as a plain factual matter, per Doc_09c SS4's own words: "Desert Monasticism's direct historical descendants (Coptic Orthodox monasticism, and more broadly the Eastern and Western monastic traditions descending in part from this world via Cassian's transmission)... constitute a living tradition" - NOT a prior-framework confirmed determination in itself, but the living-tradition-differentiation review Doc_09c SS4 named as a required, unperformed freeze-eligibility gate distinct from this underlying factual claim HAS NOW BEEN PERFORMED and closed clean (2026-08-22): every compiled-facing field checked directly for present-day/living-tradition conflation, zero genuine instances, cross-checked independently by two parties - see Doc_09c SS4's own addendum and World-Builds/Desert-Monasticism/CiC_W3_Living_Tradition_Differentiation_Review.md for the full method and result, and DECISION-LOG.md for the disposition. The doorway still carries the living-tradition distinction regardless (fail toward disclosure) - this closure is about whether the compiled content itself conflates past and present, not about removing the flag. External Scholarly Review (Doc_09c SS4's other named freeze-eligibility gate) remains open and unperformed, unaffected by this closure.
