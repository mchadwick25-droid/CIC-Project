    place: "Rome, Constantinople, Milan"
    representative: {name: Marius, role_label: "Deacon of the Letters"}   # sanctioned fabrications (spec principle 14) - carried from Mark's own prior-framework decisions, both on the verifiable record: name Marius chosen by Mark directly 2026-07-20 (World-Builds/Imperial-Juridical-Christianity/Open_Gaps_Tracking.md item 13, overriding the build's "Marcus" recommendation for his own stated reason); participant-facing title "Apocrisiarius - Deacon of the Letters" chosen by Mark 2026-07-22 (same log, item 15). CONFIRMED by Mark, 2026-08-22, in session, at step 5 (spec 4.3): checked against this build's full content canon (142 answer-canon records, three independent Opus adversarial reviews plus two further confirmation passes, 13/13 M1 gates green throughout) and found to hold without qualification - not reopened as a fresh decision, carried forward as the standing pre-rebuild identity, the same way world/syr's own Mar Yausep confirmation is expected to carry forward. See records/ijc/voice_craft/ijc.voice.craft.md and BUILD-LOG.md for the full disposition.
    state: built             # step 6 compile done 2026-08-22: determinism-check byte-identical, package built, stub-loader verified - mechanical gates-green transition only (Artifact-1 SS2), same semantics as alx/fix's own built state; NOT admitted or open - step 7 (admission, live-model) and Mark's touchpoints still pending
    census_id: "imperial-juridical-christianity"   # cic-website/data/world-census.json entry id (era 2, atlasId "I.6", shortName "Church & Empire" - the participant-facing card name Mark chose 2026-07-20, Open_Gaps item 12); verified against the census file directly, same id-field convention the alx entry documents
    package:
      manifest_hash: "sha256:9b4fd0fd98c881f8ff25161aa24577a283b48e999ef2de27b77ab1ffa54410a5"
      location: "packages/ijc/2026-08-27T14-00-23Z"   # recompiled 2026-08-27: UNOPENED-VOLUME SWEEP. Thirteen volumes, TWELVE ANSWERED WITHOUT OPENING A FILE - ten were further volumes of Augustine and Chrysostom, both already open elsewhere, and two were Basil and Gregory Nazianzen named together inside a negative-sweep clause about slaves being ordained. ONE OPENED, and it was the one that mattered most: npnf111, Chrysostom's Homily XXIII on Romans 13:1. Every claim this world makes stands on that verse and this world held no patristic reading of it. Chrysostom raises the objection himself - 'is every ruler then elected by God?' - and answers 'This I do not say': what is divinely willed is that there be rule at all, not who holds it. That is what lets a bishop obey an emperor and refuse him in the same year. The quote is declared against BOTH church-state-alliance and episcopal-independence because it is the alliance's best argument and the independence's escape clause in one paragraph. ijc 166 -> 169 records.
    thinness_statement: "Richest in councils, canons, letters, and the contest over who holds final authority in the church; thinner on ordinary believers' daily lives, women's own words, and the defeated Homoian side's own voice."
    living_tradition_flag: true   # NOT yet a determination - Living Tradition Status is PENDING Mark's own confirmation (Doc_01 SS1; Constitution Art. 29). Set true meanwhile so the doorway carries the living-tradition distinction (fail toward disclosure, same direction the alx entry documents): this world's Strand A content runs directly into the present-day papacy's own claimed lineage, Strand B's into Eastern Orthodoxy's self-understanding.
