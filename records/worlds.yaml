    kind: formation
    world_id: syriac-edessa-nisibis
    display_name: "Syriac Christianity (Edessa/Nisibis)"
    time_window: {start: 200, end: 410}
    place: "The Syriac-speaking ecology across the Roman-Persian Mesopotamian frontier (Edessa, Nisibis, Persian Adiabene)"
    representative: {name: Yausep, role_label: Mar}   # sanctioned fabrications (spec principle 14) - name and role CONFIRMED by Mark under the new spec, in chat, 2026-08-22, carrying forward the prior-framework decision (Representative_Identity_Preliminary_Decision.md + Phase Two Formation Calibration, 2026-07-07/08: name Yausep; role revised Malpana->Deacon->Mar by Mark's own rulings). Step 5a's full identity-emergence write-up (rationale derived from the completed records) is still owed when the voice build begins; this confirmation settles the name/role themselves, not that remaining paperwork
    state: built             # step 6 compile done 2026-08-22: determinism-check byte-identical, package built, stub-loader verified - mechanical gates-green transition only (Artifact-1 SS2), same semantics as alx/fix's own built state; NOT admitted or open - step 7 (admission, live-model) and Mark's touchpoints still pending
    census_id: "syriac-edessa-nisibis"   # cic-website/data/world-census.json entry id (era 1, atlasId "I.7") - same deep-link field the alx entry verified (data-aid = census id); matches this world's own world_id independently
    package:
      manifest_hash: "sha256:921bb641f1361c2a4176b3b87be51fc56436746798a51f7bd71dc92039adec24"
      location: "packages/syr/2026-08-27T14-00-25Z"   # recompiled 2026-08-27: UNOPENED-VOLUME SWEEP. Eight volumes, TWO OPENED. npnf208 for Basil's Hexaemeron II: he says his best reading of Genesis 1:2 is not his own but 'that of a Syrian', a man 'as ignorant in the wisdom of this world as he was versed in the knowledge of the Truth', because the Syriac word stands nearer the Hebrew than the Greek does. A Greek bishop deferring in public to a Syriac speaker, on this world's own linguistic self-understanding, with no stake in flattering it - and he NAMES NOBODY, which is why a legend could grow in the gap. The volume's own apparatus disagrees with itself (Tillemont: Eusebius of Samosata; the Benedictines: Ephrem Syrus) and this world's own record says a third man, Eusebius of Emesa. Three candidates, no name in the text. Budge's Syriac Paradise for ch. lviij, this world's founding poet in its own language's recension: TWO VISIONS the Greek line does not carry (the angels finding no saint fit to hold the roll except Ephraim; the vine from his tongue filling the heavens while the birds eat and the clusters only grow) and a famine exchange reading 'O man, we know that thou art God' where the Greek reads 'a man of God'. TWO DECLINATIONS REST ON NEGATIVE SEARCHES INSIDE THE FILES: anf06 carries no Bardaisan, Bardesanes or Abgar, so the Julius Africanus notice this world would want is not in it; npnf214 carries no Jacob or James of Nisibis and does not print the subscription lists. Both belong on a fetch list rather than in a ruling. syr 163 -> 169 records.
    thinness_statement: "Richest in hymns, doctrinal teaching, and covenant asceticism (Ephrem, Aphrahat); thinner on ordinary believers, women's own words, and the years after Ephrem's death."
    living_tradition_flag: true   # prior-framework confirmation by Mark (2026-07-11, Living Tradition Status CONFIRMED: the Syriac churches - Church of the East, Syriac Orthodox, Eastern Catholic heirs - are living heirs); carried forward with re-confirmation under the new spec flagged as pending - the doorway carries the living-tradition distinction meanwhile (fail toward disclosure)
