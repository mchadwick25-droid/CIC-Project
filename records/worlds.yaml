      location: "packages/alx/2026-08-27T14-00-22Z"   # recompiled 2026-08-27: UNOPENED-VOLUME SWEEP. Four volumes on cross_world's second-hand-source list, the shortest in the fleet, and three were the observer measuring an attribution rather than a gap - Basil and Gregory Nazianzen appear here only as the traditional compilers of the Philocalia this world already opens, and Jerome is already open at npnf203 for De Viris, the only Jerome this world uses. ONE OPENED: the SYRIAC LIFE OF ANTONY at the head of Budge's Paradise vol. 1. This world's most widely travelled book, in one of the places it travelled to - about 14,800 words against roughly 32,000 in the Greek at npnf204, which this world also holds. The abridgement IS the evidence: what another tradition kept and what it did not think it needed. Registered `corroborating`, never as a correction to the Greek. alx 178 -> 180 records.
