    package:
      manifest_hash: "sha256:dbd7d0c59c991f2d2fe95cb2979b812c3c157c04b0563b4c9c4c265ed350123f"
      location: "packages/pahc/2026-08-27T14-00-24Z"   # recompiled 2026-08-27: UNOPENED-VOLUME SWEEP. Nine volumes and the cleanest list in the fleet, because seven were declined on this world's own window, which ends at 200 - including anf04, the hard case, whose Tertullian treatises on household order, marriage, penance and flight look exactly like this world's subjects and are c. 206-220. One HOMONYM: npnf202 matched Socrates the Athenian philosopher in Justin's list of those who lived by reason, not Socrates Scholasticus. ONE ADMITTED DESPITE THE WINDOW, and it CORRECTED THIS WORLD: npnf204 for Athanasius's Festal Letter of 367, because pahc.force.selective-canonization said Athanasius EXCLUDED Hermas and this world had never opened the letter. He does not. He names a second class of books 'not indeed included in the Canon, but appointed by the Fathers to be read by those who newly join us' and puts the Shepherd AND the Teaching of the Apostles in it - both of this world's nearly-lost texts, moved together, from the church's reading to the catechumens'. A demotion, not an expulsion, and a better account of how they thinned. The force record's description and manifestation are corrected in place. pahc 137 -> 140 records.
