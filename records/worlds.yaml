  alx:
    kind: formation
    world_id: alexandria-catechetical
    display_name: "Alexandrian Christianity"
    time_window: {start: 150, end: 400}
    place: "Alexandria and Egypt"
    # doorway_place: the participant-facing subtitle line, one per formation world
    # (uniform key set, cross_world-enforced). Here it matches `place` - the
    # split only earns different values where the model-facing locator is a
    # build catalogue (desert) or restates the horizon (syr); `place` itself is
    # MODEL-FACING (it compiles into the voice capsule's "Place:" line).
    doorway_place: "Alexandria and Egypt"
    # doorway_description: the participant-facing doorway paragraph, REGISTRY-OWNED
    # (Mark's direction 2026-08-28: "simple modern english that introduces scholor
    # terms when approptiate" - the doorway had been reusing the world_core's
    # model-facing `horizon` verbatim, which restated the place line and read like
    # an abstract). Served registry-first by engine/api/wiring.list_worlds, same
    # pattern as card_name; `horizon` itself is untouched and still feeds the
    # voice's own prompt. Fleet-wide field, one per formation world.
    doorway_description: >-
      Alexandria was the Roman world's great city of learning. Its church made
      teaching the heart of the faith. New believers were formed by years of
      staged instruction before baptism. Teachers like Clement and Origen read
      Scripture in layers: the plain story, and the deeper meaning inside it.
      They were confident that Greek learning could serve Christ rather than
      threaten him. In this world, faith grows the way understanding grows - by
      study, questions, and a teacher's patient guidance.
    card_name: "Alexandrian Christianity"   # BOTH name registers, Mark's ruling 2026-08-28: card_name is the friendly participant-facing name ("the right picture in their mind") used on cards and the Atlas; display_name stays the scholarly name ("to show rigor"). The registry owns both; the census derives (cross_world checks it).
    representative: {name: Theon, role_label: "Catechetical Teacher"}   # sanctioned fabrications (spec principle 14) - RULED by Mark, 2026-08-21, in session ("for the name and role: Theon / Catechetical Teacher")
    state: admitted         # Step 7 complete - ADMITTED by Mark, 2026-08-28, in session ("yes i admit all six worlds"). The mechanical certificate: the fleet-parity battery of the same day - 28/28 sealed probes under the corrected admission instrument (engine.m4.turn.apply_net, grading byte-for-byte what a participant receives; report engine/m3/reports/live-admission-report-fleet-parity-2026-08-28.json). The read: Mark's own, made through the day's session rather than as a ceremony - he read every flagged and failing answer this fleet produced (alx's register line and his statement-6 ruling; desert's corrected witness and re-run; pahc's Bagnall disclosure and hal's letters-not-stones answer, and both fixes; syr's advisories), plus three full live Table conversations. The freeze: the pinned manifest_hash above IS the frozen artifact. NOT yet open: CIC_ENFORCE_ADMISSION stays "0" until Mark's doors-open flip; this transition is what makes that flip safe.
    census_id: "alexandria-catechetical"   # cic-website/data/world-census.json entry id (era 1, atlasId "I.2") - verified against the running Atlas frontend, not guessed from the spec's own illustrative "IX.12"-style example: atlas-v3.html's "Interview <rep>" button sends data-aid="${m.id}" (the census entry's id field), not atlasId, so this is the value the real deep link actually needs. Matches this world's own world_id independently.
    package:
      manifest_hash: "sha256:5ad84fb51cc464e1a3f759222b6b63b54831746867de2d2330b44421e0387227"
      location: "packages/alx/2026-08-29T21-29-45Z"   # REGISTER TRANSLATION recompile 2026-08-29 (Mark: "approved, recompile and run the probe", after his ruling that the spoken prose had regressed to "old english criptic speak" - target register is his side-by-side After column): ijc's 20 cryptic spoken fields translated to plain modern English at the record layer (translation not summary; all sourced claims and reviewed wording preserved); 5 ijc quotes given modern_rendering (spoken form; original at Level 3); alx's one spoken 'our window' build-vocab leak fixed. No prompt changes - the ban-list config was deliberately not installed (no-fix-on-fix). Prior pin (THE REVERT recompile 2026-08-29 (Mark: "take it back to when it was working... make sure there are not other things that are forced saying"): fleet_voice restored to fleet-parity + ONLY the pronoun frame clause; register_hold, story_quote_reach, and the citation-address addendum are gone; the Table exact-sentence prescription is gone (wiring). pahc additionally: the Trinity aside trimmed from jesus-as-god witness + demo (out-of-window vocabulary; the Facilitator owns the time-bridge). Source breadth is now the evidence layer's job (_diverse_take). Batteries run against THIS pin.: packages/alx/2026-08-29T10-26-51Z)
    thinness_statement: "Richest in teaching, argument, and the theology of formation; thinner on women's own words, ordinary believers, and rural Coptic Egypt."
    living_tradition_flag: true   # prior-framework confirmation by Mark (2026-07-17): Coptic Orthodox Church primary heir; carried forward with re-confirmation under the new spec flagged as pending - the doorway carries the living-tradition distinction meanwhile (fail toward disclosure)
  desert:
    kind: formation
    world_id: desert-monasticism
    display_name: "Desert Monasticism"
    time_window: {start: 320, end: 430}
    place: "Egyptian and Palestinian desert monasticism - Nitria, Kellia, Scetis (Strand C, semi-anchoritic), Pispir/the inner mountain (Strand A, anchoritic), Tabennesi and the Pachomian federation (Strand B, cenobitic)"
    # doorway_place: the participant-facing subtitle line (Mark's plain-English
    # doorway direction, 2026-08-28). `place` above stays untouched because it is
    # MODEL-FACING: it compiles into the voice capsule's own "Place:" line (proven
    # by diffing a trial recompile), so rewriting it would change the voice's
    # prompt - the strand catalogue is exactly the precision the model should
    # keep. Served registry-first by engine/api/wiring.list_worlds.
    doorway_place: "The Egyptian desert - Nitria, Kellia, Scetis, and the monasteries of the Nile valley"
    doorway_description: >-
      In the 300s, thousands of men and women left Egypt's villages for the
      desert. They believed that becoming like Christ meant leaving ordinary
      life behind. Some lived alone, following Antony's example. Some lived in
      large communities under Pachomius's written rule. Many settled in loose
      clusters of cells around a shared church. What bound them together was the
      daily fight against tempting thoughts, work done with their own hands, and
      elders trusted because their lives had been tested. Above every other
      virtue they honored discernment: the skill of judging how much any one
      person can bear.
    card_name: "Desert Fathers and Mothers"
    representative: {name: Papnoute, role_label: "Abba (Elder)"}   # sanctioned fabrications (spec principle 14) - name and role CONFIRMED by Mark, in chat, 2026-08-22, carrying forward the prior-framework decision (World-Builds/Desert-Monasticism/CiC_W3_Representative_Identity_Preliminary_Decision.md: Papnoute, Abba/Elder, drawn from Strand C's own richest cross-strand-attested material, with the binding "whole-world representation" instruction that the Representative speak for Strands A, B, and C together). Role rendered here as "Abba (Elder)" to preserve the prior decision's own stated reasoning for Abba specifically (this world's own native, popularly-recognized address term) alongside the plain-English gloss Mark's own confirming message used. This confirmation checked the identity against this build's own completed content canon (Steps 2-4, Doc_08) and found it holds on every axis the prior decision named, with one further axis (whole-world representation, exercised by the demonstration set specifically) found only partially exercised and named honestly rather than certified - see records/desert/voice_craft/desert.voice.craft.md's own trailing confirmation note for the full check, including one newly-found cost (three distinct historical men named Paphnutius appear in this build's own source/force apparatus, never in compiled-facing content) carried forward alongside the prior decision's own already-named external cost.
    state: admitted         # Step 7 complete - ADMITTED by Mark, 2026-08-28, in session ("yes i admit all six worlds"). The mechanical certificate: the fleet-parity battery of the same day - 28/28 sealed probes under the corrected admission instrument (engine.m4.turn.apply_net, grading byte-for-byte what a participant receives; report engine/m3/reports/live-admission-report-fleet-parity-2026-08-28.json). The read: Mark's own, made through the day's session rather than as a ceremony - he read every flagged and failing answer this fleet produced (alx's register line and his statement-6 ruling; desert's corrected witness and re-run; pahc's Bagnall disclosure and hal's letters-not-stones answer, and both fixes; syr's advisories), plus three full live Table conversations. The freeze: the pinned manifest_hash above IS the frozen artifact. NOT yet open: CIC_ENFORCE_ADMISSION stays "0" until Mark's doors-open flip; this transition is what makes that flip safe.
    census_id: "desert-monasticism"   # cic-website/data/world-census.json entry id (era 2, atlasId "I.3", shortName "The Desert") - verified against the census file directly, same id-field convention the alx entry documents, and matches this world's own world_id independently. Set 2026-08-26 by the cross-system consistency audit: this was the ONE formation world carrying null here, and null is not "no Atlas entry" for a world the census lists as Built & Live - it is a deep link that can never match. cic-website/index.html sends `?worlds=${w.id}` and atlas-v3.html sends `data-aid="${m.id}"`, both the census entry's own id; cic-poc/frontend's App.tsx matches that against this field (findWorldByCensusId), so with null here every "Launch an Interview with Papnoute" click landed a participant on the world list instead of Papnoute's doorway, while the other five went straight through.
    package:
      manifest_hash: "sha256:c64e7a0d91324b219802f6d2a607500823a6ab500b07f3c412fc6bbd22984275"
      location: "packages/desert/2026-08-29T10-26-52Z"   # THE REVERT recompile 2026-08-29 (Mark: "take it back to when it was working... make sure there are not other things that are forced saying"): fleet_voice restored to fleet-parity + ONLY the pronoun frame clause; register_hold, story_quote_reach, and the citation-address addendum are gone; the Table exact-sentence prescription is gone (wiring). pahc additionally: the Trinity aside trimmed from jesus-as-god witness + demo (out-of-window vocabulary; the Facilitator owns the time-bridge). Source breadth is now the evidence layer's job (_diverse_take). Batteries run against THIS pin.
    thinness_statement: "Richest in the Apophthegmata's own elder-and-disciple sayings tradition and Antony's own Vita; thinner on ordinary participants outside the collected-sayings tradition, on the Pachomian federation's own interior life beyond its founding, and on women's own voices (a small number of amma sayings, not a fuller corpus)."
    living_tradition_flag: true   # set as a plain factual matter, per Doc_09c SS4's own words: "Desert Monasticism's direct historical descendants (Coptic Orthodox monasticism, and more broadly the Eastern and Western monastic traditions descending in part from this world via Cassian's transmission)... constitute a living tradition" - NOT a prior-framework confirmed determination in itself, but the living-tradition-differentiation review Doc_09c SS4 named as a required, unperformed freeze-eligibility gate distinct from this underlying factual claim HAS NOW BEEN PERFORMED and closed clean (2026-08-22): every compiled-facing field checked directly for present-day/living-tradition conflation, zero genuine instances, cross-checked independently by two parties - see Doc_09c SS4's own addendum and World-Builds/Desert-Monasticism/CiC_W3_Living_Tradition_Differentiation_Review.md for the full method and result, and DECISION-LOG.md for the disposition. The doorway still carries the living-tradition distinction regardless (fail toward disclosure) - this closure is about whether the compiled content itself conflates past and present, not about removing the flag. External Scholarly Review (Doc_09c SS4's other named freeze-eligibility gate) remains open and unperformed, unaffected by this closure.
  pahc:
    kind: formation
    world_id: post-apostolic-house-church
    display_name: "Post-Apostolic House-Church Christianity"
    time_window: {start: 70, end: 200}
    place: "Antioch/Syria, Asia Minor, Rome"
    doorway_place: "Antioch, the cities of Asia Minor, and Rome"
    doorway_description: >-
      After the apostles died, the church lived in ordinary houses.
      Greek-speaking believers gathered around household tables in Antioch, in
      the cities of Asia Minor, and in Rome. Letters held these scattered
      communities together. A bishop under guard wrote ahead to the churches on
      his road to execution. Rome wrote at length to settle a quarrel in
      Corinth. There were no church buildings yet, no finished New Testament,
      no safety in the law. There were only communities working out, generation
      by generation, what it meant to stay one church across an empire.
    card_name: "The House-Churches"
    representative: {name: Chloe, role_label: "Household Leader"}   # step 5a deliverable (Mark's per-world touchpoint, spec SS4.3); re-confirmed directly with the project lead against the new-regime records (records/pahc/voice_craft/pahc.craft.chloe-voice.md) at Step 11, not carried forward unexamined from the prior-framework build
    state: admitted         # Step 7 complete - ADMITTED by Mark, 2026-08-28, in session ("yes i admit all six worlds"). The mechanical certificate: the fleet-parity battery of the same day - 28/28 sealed probes under the corrected admission instrument (engine.m4.turn.apply_net, grading byte-for-byte what a participant receives; report engine/m3/reports/live-admission-report-fleet-parity-2026-08-28.json). The read: Mark's own, made through the day's session rather than as a ceremony - he read every flagged and failing answer this fleet produced (alx's register line and his statement-6 ruling; desert's corrected witness and re-run; pahc's Bagnall disclosure and hal's letters-not-stones answer, and both fixes; syr's advisories), plus three full live Table conversations. The freeze: the pinned manifest_hash above IS the frozen artifact. NOT yet open: CIC_ENFORCE_ADMISSION stays "0" until Mark's doors-open flip; this transition is what makes that flip safe.
    census_id: "post-apostolic-house-church"   # cic-website/data/world-census.json entry id (era 1, atlasId "I.1") - the census entry's own id field, the value the Atlas deep link sends (same convention verified for alx)
    package:
      manifest_hash: "sha256:36889af53f8010fe168a194d975aa57c3e66b329ee86f51311033a75b53ac148"
      location: "packages/pahc/2026-08-29T10-26-53Z"   # THE REVERT recompile 2026-08-29 (Mark: "take it back to when it was working... make sure there are not other things that are forced saying"): fleet_voice restored to fleet-parity + ONLY the pronoun frame clause; register_hold, story_quote_reach, and the citation-address addendum are gone; the Table exact-sentence prescription is gone (wiring). pahc additionally: the Trinity aside trimmed from jesus-as-god witness + demo (out-of-window vocabulary; the Facilitator owns the time-bridge). Source breadth is now the evidence layer's job (_diverse_take). Batteries run against THIS pin.
    thinness_statement: "Richest in letters, church order, and worship practice; thinner on women's own words, enslaved members, the non-literate majority, and any material remains."
    living_tradition_flag: true   # prior-framework determination confirmed by Mark (2026-07-31): universal descent - every later church looks back to rooms like these - with a strict non-identity discipline (this is a bounded historical reconstruction, not any present-day church's self-account). Carried forward with re-confirmation under the new spec pending; the doorway carries the distinction meanwhile (fail toward disclosure).
  hal:
    kind: formation
    world_id: hieronymian-ascetic-literary
    display_name: "Hieronymian Ascetic-Literary Christianity"
    time_window: {start: 382, end: 420}
    place: "Bethlehem and Rome"
    doorway_place: "Bethlehem and Rome"
    doorway_description: >-
      In the year 382 the scholar Jerome came to Rome. There he met a circle of
      noblewomen who had already traded wealth and status for lives of prayer
      and study. Their partnership moved to Bethlehem: his learning, their
      leadership and money. Paula and her daughter Eustochium built monasteries
      and a guesthouse for pilgrims. Jerome translated the Bible into Latin from
      the Hebrew it was first written in. Letters across the sea held the world
      together. It ends when the Bethlehem generation dies out, around the year
      420.
    card_name: "The Bethlehem Circle"
    representative: {name: Albina, role_label: "Widow of the Household"}   # Mark's ruling (2026-08-22), step-5a touchpoint (Build-Blueprint SS4): a voice of the Bethlehem circle speaking as a widow of the household - formed by renunciation and by the scholarly labor of testing Scripture's Latin words against the Hebrew they were first given in, carrying this circle's whole life, from Rome to Bethlehem. Deliberately not one of this corpus's documented named figures (Marcella, Paula, Eustochium, Fabiola, et al.) - a sanctioned Representative voice per spec principle 14, kept distinct from their own verified quotes/stories. Supersedes the prior framework's preliminary decision (hal_Representative_Identity_Preliminary_Decision.md), which was NOT carried into the new spec. Voice build (voice_craft + demonstration) drafted and adversarially reviewed on this branch; compile (step 6) not yet attempted.
    state: admitted         # Step 7 complete - ADMITTED by Mark, 2026-08-28, in session ("yes i admit all six worlds"). The mechanical certificate: the fleet-parity battery of the same day - 28/28 sealed probes under the corrected admission instrument (engine.m4.turn.apply_net, grading byte-for-byte what a participant receives; report engine/m3/reports/live-admission-report-fleet-parity-2026-08-28.json). The read: Mark's own, made through the day's session rather than as a ceremony - he read every flagged and failing answer this fleet produced (alx's register line and his statement-6 ruling; desert's corrected witness and re-run; pahc's Bagnall disclosure and hal's letters-not-stones answer, and both fixes; syr's advisories), plus three full live Table conversations. The freeze: the pinned manifest_hash above IS the frozen artifact. NOT yet open: CIC_ENFORCE_ADMISSION stays "0" until Mark's doors-open flip; this transition is what makes that flip safe.
    census_id: "hieronymian-ascetic-literary"   # cic-website/data/world-census.json entry id (atlasId "I.9") - the census entry's own id field is what the Atlas deep link sends (per the alx verification of atlas-v3.html's data-aid wiring); matches this world's world_id independently
    package:
      manifest_hash: "sha256:1bdc2ce686273596925ce2ac6bcefa3b667821af657ecaf1dd1d40da99e7bf21"
      location: "packages/hal/2026-08-29T10-26-53Z"   # THE REVERT recompile 2026-08-29 (Mark: "take it back to when it was working... make sure there are not other things that are forced saying"): fleet_voice restored to fleet-parity + ONLY the pronoun frame clause; register_hold, story_quote_reach, and the citation-address addendum are gone; the Table exact-sentence prescription is gone (wiring). pahc additionally: the Trinity aside trimmed from jesus-as-god witness + demo (out-of-window vocabulary; the Facilitator owns the time-bridge). Source breadth is now the evidence layer's job (_diverse_take). Batteries run against THIS pin.
    thinness_statement: "Richest in Jerome's own letters, translation prefaces, and the remembered lives of the Roman women who sustained the work; thinner on the women's own words (none survive), ordinary monastery residents, and daily-life detail beyond one letter."
    living_tradition_flag: true   # PROVISIONAL, set toward disclosure (spec principle 6): the living-tradition determination is Mark's per-world touchpoint and has not been made for this world under the new spec. Substance: this is a bounded historical reconstruction of one specific 382-420 network, not today's church of any name - but Jerome, the Vulgate, and Latin monasticism are all claimed inheritances of living traditions (Roman Catholic above all), so until Mark rules, the doorway should carry the distinction rather than omit it. Flipping to false is Mark's call, not the build thread's.
  syr:
    kind: formation
    world_id: syriac-edessa-nisibis
    display_name: "Syriac Christianity (Edessa/Nisibis)"
    time_window: {start: 200, end: 410}
    place: "The Syriac-speaking ecology across the Roman-Persian Mesopotamian frontier (Edessa, Nisibis, Persian Adiabene)"
    # doorway_place: the participant-facing subtitle line (Mark's own screen read,
    # 2026-08-28, flagged this arrival card: "restated or to accedemic" - the old
    # subtitle duplicated the horizon's opening phrase word for word). `place`
    # above stays untouched because it is MODEL-FACING: it compiles into the voice
    # capsule's own "Place:" line (proven by diffing a trial recompile), so
    # rewriting it would change the voice's prompt. Served registry-first by
    # engine/api/wiring.list_worlds.
    doorway_place: "Edessa, Nisibis, and the border country between Rome and Persia"
    doorway_description: >-
      This is the church that sang its teaching. Its people spoke Syriac, a
      sister language of the Aramaic Jesus spoke. They lived in the border
      cities between the Roman and Persian empires. Their great teachers,
      Ephrem and Aphrahat, taught the faith through hymns and plain teaching
      pieces, not learned treatises. At the community's heart stood the
      covenant: men and women vowed to celibacy and service, who stayed inside
      the ordinary congregation instead of leaving for a monastery. The story
      opens with the first trace of a church in Edessa, a building lost to
      flood in the year 201. It closes in 410, when the church inside Persia
      took on a formal structure and this world's own way of life gave way to
      something more official.
    card_name: "Syriac Christianity"
    representative: {name: "Mar Yausep", role_label: "Teacher of the Covenant Order"}   # RULED by Mark, 2026-08-28, in session ("yes i like mar yousep, role teacher of the convenant order"), closing the foundation audit's identity finding: the prior value carried the honorific alone in the role slot (name Yausep, role_label Mar), which made the Facilitator's door sentence ungrammatical ("Yausep, Mar of Syriac Christianity") and split one person across two names between the Atlas card ("Mar Yausep") and the room. The census already carried today's ruling's values; the registry now owns them (registry wins, Mark 2026-08-28). Prior history preserved: sanctioned fabrications (spec principle 14) - name and role CONFIRMED by Mark under the new spec, in chat, 2026-08-22, carrying forward the prior-framework decision (Representative_Identity_Preliminary_Decision.md + Phase Two Formation Calibration, 2026-07-07/08: name Yausep; role revised Malpana->Deacon->Mar by Mark's own rulings). Step 5a's full identity-emergence write-up (rationale derived from the completed records) is still owed when the voice build begins; this confirmation settles the name/role themselves, not that remaining paperwork
    state: admitted         # Step 7 complete - ADMITTED by Mark, 2026-08-28, in session ("yes i admit all six worlds"). The mechanical certificate: the fleet-parity battery of the same day - 28/28 sealed probes under the corrected admission instrument (engine.m4.turn.apply_net, grading byte-for-byte what a participant receives; report engine/m3/reports/live-admission-report-fleet-parity-2026-08-28.json). The read: Mark's own, made through the day's session rather than as a ceremony - he read every flagged and failing answer this fleet produced (alx's register line and his statement-6 ruling; desert's corrected witness and re-run; pahc's Bagnall disclosure and hal's letters-not-stones answer, and both fixes; syr's advisories), plus three full live Table conversations. The freeze: the pinned manifest_hash above IS the frozen artifact. NOT yet open: CIC_ENFORCE_ADMISSION stays "0" until Mark's doors-open flip; this transition is what makes that flip safe.
    census_id: "syriac-edessa-nisibis"   # cic-website/data/world-census.json entry id (era 1, atlasId "I.7") - same deep-link field the alx entry verified (data-aid = census id); matches this world's own world_id independently
    package:
      manifest_hash: "sha256:52837fe81a83dd66c0eb04a99825d21b1f748db0d3e399654c65960cf7c2f17e"
      location: "packages/syr/2026-08-29T22-04-24Z"   # REGISTER TRANSLATION recompile 2026-08-29 (Mark: "go", the syr pass of the fleet register ruling): 8 dw spoken texts translated to plain modern English at the record layer (fragment chains and inversions out; all sourced claims and reviewed constraints kept; "after the window closed" build-vocab leak fixed); 18 archaic quotes given modern_rendering (two added after the live probe spoke their originals) (spoken form; original at Level 3). Demo-tag census verified identical against a baseline build. Prior pin (ritual-sequence compile: packages/syr/2026-08-29T11-13-39Z).
    thinness_statement: "Richest in hymns, doctrinal teaching, and covenant asceticism (Ephrem, Aphrahat); thinner on ordinary believers, women's own words, and the years after Ephrem's death."
    living_tradition_flag: true   # prior-framework confirmation by Mark (2026-07-11, Living Tradition Status CONFIRMED: the Syriac churches - Church of the East, Syriac Orthodox, Eastern Catholic heirs - are living heirs); carried forward with re-confirmation under the new spec flagged as pending - the doorway carries the living-tradition distinction meanwhile (fail toward disclosure)
  ijc:
    kind: formation
    world_id: imperial-juridical
    display_name: "Imperial and Juridical Christianity"
    time_window: {start: 312, end: 451}
    place: "Rome, Constantinople, Milan"
    doorway_place: "Rome, Constantinople, and Milan"
    doorway_description: >-
      In 312 the emperor Constantine took the church under his protection, and
      everything changed. Bishops who had met in secret now gathered in councils
      an emperor convened. The church gained legal standing, wealth, and a seat
      near Roman power. It also had to decide what that nearness should cost.
      This is the world of the great councils and their canons - the church's
      written rulings. It is the world of Ambrose of Milan facing down emperors,
      and of Rome's bishops building their claim to speak for the whole church.
