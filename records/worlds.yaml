    # draft (Doc_01) without being weighed against the fleet's own naming
    # convention. New world_id cappadocian-trinitarian: region + this
    # world's own defining theological character (Doc_01's own recurring
    # gravitational questions are the Eunomian and Pneumatomachian
    # contests, both Trinitarian), deliberately not reusing "Nicene" (the
    # word Mark flagged) or reaching for "Fathers"/"settlement," both of
    # which this build's own content (voice_craft, the Facilitation
    # Brief's card_name reasoning, cappadocian.contested.settlement-historiography)
    # already treats as reductive framings to avoid. New display_name
    # "Cappadocian Christianity" matches the fleet's own dominant "[X]
    # Christianity" convention (Alexandrian/Hieronymian Ascetic-Literary/
    # Imperial and Juridical/Post-Apostolic House-Church) exactly - the
    # temporal/geographic bounding Doc_01's own Label Test worked out
    # (c. 325-394; Cappadocia/Pontus/Armenia Minor, not the wider
    # pro-Nicene movement and not the later Byzantine province) lives in
    # time_window/horizon/doorway copy, the same way every sibling world
    # already handles this identical tension - none of them fold a date
    # range into their own display name either. Full detail:
    # CAPPADOCIAN_BUILD_LEDGER.md's own rename section.
    world_id: cappadocian-trinitarian
    display_name: "Cappadocian Christianity"
    time_window: {start: 325, end: 394}
    place: "Cappadocia and Pontus"
    doorway_place: "Cappadocia and Pontus"
    doorway_description: >-
      In the fourth century, the churches of Cappadocia and Pontus fought to
      defend the faith declared at Nicaea - one God, three who truly are.
      Basil of Caesarea, his friend Gregory of Nazianzus, and his brother
      Gregory of Nyssa became this world's most remembered voices, but the
      faith they defended was lived by a whole people: households and
      congregations, and communities newly ordered into a common life built
      around a door kept open for the poor. The same exactness that shaped
      the church's confession also shaped its care - a famine-born complex
      outside Caesarea fed, housed, and nursed the destitute and the sick.
      The story runs from the years after the last persecutions to the
      deaths of this founding generation, under emperors who alternately
      protected and opposed the Nicene faith. It closes with that faith's
      own vindication, and more than a decade spent living inside the
      victory.
