    time_window: {start: 100, end: 100}
    place: "Testland (synthetic, no real geography)"
    representative: {name: Vera, role_label: Witness}   # sanctioned fabrications (spec principle 14)
    state: built            # gates green (stage 1) + a compiled package (stage 2); never advances past built - not a real world, never admitted or open
    census_id: null        # not an Atlas entry - synthetic only
    package:
      manifest_hash: "sha256:767835bf37b8d75525f1c004c27807a95460c267d49712f6d6a64f74a8ae130e"
      location: "packages/fix/2026-08-29T10-26-51Z"   # THE REVERT recompile 2026-08-29 (Mark: "take it back to when it was working... make sure there are not other things that are forced saying"): fleet_voice restored to fleet-parity + ONLY the pronoun frame clause; register_hold, story_quote_reach, and the citation-address addendum are gone; the Table exact-sentence prescription is gone (wiring). pahc additionally: the Trinity aside trimmed from jesus-as-god witness + demo (out-of-window vocabulary; the Facilitator owns the time-bridge). Source breadth is now the evidence layer's job (_diverse_take). Batteries run against THIS pin.
