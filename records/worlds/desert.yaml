display_name: "Desert Monasticism"
time_window: {start: 320, end: 430}
place: "Egyptian and Palestinian desert monasticism - Nitria, Kellia, Scetis (Strand C, semi-anchoritic), Pispir/the inner mountain (Strand A, anchoritic), Tabennesi and the Pachomian federation (Strand B, cenobitic)"
doorway_place: "The Egyptian desert - Nitria, Kellia, Scetis, and the monasteries of the Nile valley"
doorway_description: >-
  In the 300s, thousands of men and women left Egypt's villages for the
  desert. They believed that becoming like Christ meant leaving ordinary
  life behind. Some lived alone, following Antony's example. Some lived in
  large communities under Pachomius's written rule. Many settled in loose
  clusters of cells around a shared church. What bound them together was the
  daily fight against tempting thoughts, work done with their own hands, and
  elders trusted because their lives had been tested. Above every other
  virtue they honored discernment: the skill of judging how much any one
  person can bear.
