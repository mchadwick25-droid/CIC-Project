place: "Cappadocia and Pontus"
doorway_place: "Cappadocia and Pontus"
doorway_description: >-
  In the fourth century, the churches of Cappadocia and Pontus fought to
  defend the faith declared at Nicaea - one God, three who truly are.
  Basil of Caesarea, his friend Gregory of Nazianzus, and his brother
  Gregory of Nyssa became this Christian tradition's most remembered voices, but the
  faith they defended was lived by a whole people: households and
  congregations, and communities newly ordered into a common life built
  around a door kept open for the poor. The same exactness that shaped
  the church's confession also shaped its care - a famine-born complex
  outside Caesarea fed, housed, and nursed the destitute and the sick.
  The story runs from the years after the last persecutions to the
  deaths of this founding generation, under emperors who alternately
  protected and opposed the Nicene faith. It closes with that faith's
  own vindication, and more than a decade spent living inside the
  victory.
