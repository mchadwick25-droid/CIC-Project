thinness_statement: "Richest in confessional and doctrinal content: Calvin's Institutes and Catechism, Zwingli's own founding statements and later writings, the Consensus Tigurinus, the Second Helvetic Confession - all directly vendored and verified. Thin to silent on ordinary lived practice and daily texture: no surviving account of what an ordinary Sunday service, a Consistory summons, or an ordinary citizen's own experience of either Reformation actually felt like - a genre asymmetry between richly vendored doctrinal content and almost entirely absent daily-practice content, not a gap filled with invention. No Tier 2, 3, or 4 story material survives or is built - this Christian tradition's own confessional core actively refuses the devotional genre hagiography belongs to, and the absence is evidence the refusal worked, not a missing source. Three of this tradition's own most consequential documented events - the Marburg Colloquy (1529), the Bolsec controversy (1551), and the Perrinist crisis (1555) - have no vendored primary narrative source comparable to this tradition's own three built stories. Geneva's own specific institutional detail (the Consistory's weekly case-by-case operation) remains Confidence E pending the Ecclesiastical Ordinances' own acquisition; Calvin's own vendored corpus runs roughly four times Zwingli's, a disclosed Author-Gravity concentration distinct from the genre asymmetry above."
