place: "Zurich and Geneva, in the Swiss Confederacy"
doorway_place: "Zurich's Grossmunster and Geneva's own Consistory"
doorway_description: >-
  On 1 January 1519, Huldrych Zwingli, newly appointed Leutpriester at
  Zurich's Grossmunster, began preaching straight through the Gospel of
  Matthew rather than following the fixed lectionary - the first act of a
  reform that tested every inherited practice against Scripture and kept
  only what the text would warrant. The First and Second Zurich
  Disputations (1523) carried that testing into public, civic argument
  before the whole city; Zwingli died in battle at the Second War of
  Kappel in 1531, and his successor Heinrich Bullinger held Zurich's own
  pastorate for four decades after him. Geneva's own reform opened
  separately - its 1526 alliance with Bern, its 1536 break from Savoy -
  and was joined that same year by John Calvin, whose ministry, once
  consolidated under the 1541 Ecclesiastical Ordinances, built a
  Consistory of pastors and lay elders to hold the whole city's ordinary
  conduct to account. Zwingli and Calvin never met; their ministries did
  not overlap. What formally bridges the two cities is the Consensus
  Tigurinus (1549), a jointly negotiated statement on the Lord's Supper -
  evidence of two reforms arriving independently at language neither could
  disown, not of any earlier contact between their founders. The window's
  close at 1650 is the census's own administrative continues-cap for a
  still-living tradition, not a historical rupture: this pattern continues
  unbroken into the Scottish Kirk, the Huguenots, the Dutch Reformed, and
  English Puritanism.
