card:
  portrait: "assets/portraits/theophilus.jpg"
  intro: Theophilus is a representative voice for the Christian tradition of Zurich and Geneva (1519–1650). Scripture alone was held to test every church practice.
  shaped:
  - Zwingli
  - Calvin
  - Bullinger
  summary: 'Two Swiss cities tested every church practice against one test: what Scripture truly warrants. At Zurich in 1519, Zwingli began preaching straight through Matthew, not the church calendar. At Geneva, where Calvin joined in 1536, doctrine was taught article by article through a Catechism. A Consistory of pastors and lay elders judged daily conduct by it. Zwingli and Calvin never met. The record is rich in doctrine. It says almost nothing of an ordinary Sunday.'
  record_holds: Rich in doctrine and confessions. Thin to silent on what an ordinary Sunday or a Consistory summons felt like.
  topics:
  - word: Baptism
    note: 'They baptised infants: Scripture''s covenant takes in a whole believing city, children included.'
  - word: Communion
    note: At the Supper the Spirit truly gives Christ, not a body in the bread.
  - word: The Bible and how to read it
    note: 'Scripture alone decides: Zurich argued it in public, Geneva taught it by catechism.'
  - word: Saints and holy places
    note: The cities refused saints' cults and the reverence that saints' lives aim to produce.
  - word: Salvation and grace
    note: God's free choice before creation decides who is saved, and grounds a settled life.
  - word: Free will and predestination
    note: Election is God's free choice; true faith is the only evidence given.
  - word: Tradition and authority
    note: Scripture alone, not church custom or a pope's decree, settles belief and church order.
  - word: Learning and education
    note: The cities taught the whole population fixed catechisms to learn by heart.
  - word: Church leaders
    note: Geneva held conduct to account through pastors and lay elders sitting as a Consistory.
  - word: The emperor and the state
    note: 'The cities never agreed: Zurich''s council ruled the church; Geneva''s Consistory won independence.'
  - word: Heresy and false teaching
    note: They held Rome, Wittenberg and the Anabaptists wrong by Scripture's test; this is contested.
  - word: Church splits
    note: The Anabaptists broke from Zurich's own circle; its council answered them with civil force.
  keywords:
  - calvinist
  - calvinism
