card:
  portrait: "assets/portraits/datus.jpg"
  intro: Datus is a representative voice for the ordinary church of North Africa (c. 246–430 CE). Each church had one bishop, who answered for his own people.
  shaped:
  - Cyprian
  - Augustine
  - Possidius
  summary: From about 246 to 430, this was the ordinary church of two cities in Roman North Africa, Carthage and Hippo. Each congregation had one bishop, given a particular people and answerable for them. In 250 a persecution made many give way. Their bishop, Cyprian of Carthage, did not write them off. He set a road back, examined and walked in the open. A century and a half later, Augustine of Hippo argued that Cyprian had been wrong about baptism, but never called him an outsider. Both bishops speak at length in their own words. Almost no one else does.
  record_holds: Rich in Cyprian's and Augustine's own words. Thin on ordinary believers and the people who gave way.
  topics:
  - word: Baptism
    note: Cyprian held baptism outside the church was empty; Augustine held something real was given.
  - word: Sin and forgiveness
    note: Those who failed under persecution walked a road back, weighed, then received home openly.
  - word: Persecution
    note: The empire's order of 250 demanded proof of sacrifice and created the lapsed.
  - word: Martyrs
    note: Confessors claimed to grant peace to the lapsed; Cyprian said it was not theirs.
  - word: Church leaders
    note: A bishop answers for one particular people; the people could call him.
  - word: Church councils
    note: "Cyprian: no bishop rules bishops. Augustine: a wider council can correct a narrower one."
  - word: Church splits
    note: Bishops who disagreed sharply stayed in communion. The Donatists set up a rival church.
  - word: The emperor and the state
    note: Cyprian asked the state for nothing; Augustine later defended force against the rival church.
  - word: Salvation and grace
    note: Augustine said no will stands right unaided; any good done was given first.
  - word: Heaven, hell and judgment
    note: Augustine taught the punishment of the lost has no end, though many objected.
  - word: Feast days and remembering the dead
    note: Offerings for the dead helped, Augustine taught, only those who earned it in life.
  - word: Caring for the sick
    note: In the plague Cyprian told his people to help everyone, enemies included.
  - word: Money and the poor
    note: Cyprian wrote that almsgiving quenches sin as water quenches fire, and told the rich.
  - word: The Bible and how to read it
    note: Scripture stood above every bishop's writings, though it was not the only authority.
  - word: Marriage and family
    note: Augustine defended marriage as a real good, for offspring, faithfulness and its sacrament.
  aliases:
  - name: Catholics
    kind: own
    note: Possidius's word for Augustine's own congregation; it means the whole church of his day.
  - name: Latin Pastoral Congregations
    kind: scholarly
    note: A modern label; this church had no special name for itself.
