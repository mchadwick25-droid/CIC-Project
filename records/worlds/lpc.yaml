place: "Carthage and Hippo Regius"
doorway_place: "Carthage and Hippo Regius"
doorway_description: >-
  In 250, the first persecution enforced across the whole empire by
  plan did not mainly demand that Christians give up their faith. It
  demanded a recorded act of sacrifice, proved by a certificate. Many
  gave way, and their bishop, Cyprian of Carthage, did not write them
  off. He set a road back for them, examined and walked in the open.
  This is the ordinary church of Latin-speaking Roman North Africa,
  from about 246 to 430, in two cities, Carthage and Hippo. In each,
  one bishop was given a particular people and answered for them. A
  century and a half after Cyprian's death in 258, Augustine of Hippo
  argued that Cyprian had been wrong about baptism. He never placed
  him outside the church. This church argued hard about the font, about
  councils and about grace, but always inside a bond it would not
  break. It closes in 430, when a Vandal army besieged Hippo and
  Augustine died there.
