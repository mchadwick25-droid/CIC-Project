place: "Carthage and Hippo Regius, in Latin-speaking Roman North Africa (Africa Proconsularis and Numidia)"
doorway_place: "Carthage and Hippo Regius"
doorway_description: >-
  Two bishops hold this world together, a century and a half apart. Cyprian
  led Carthage through persecution, plague and schism, and Augustine served
  Hippo as a working pastor. Their people chose them, and neither man had
  asked for the office. A bishop here answered by name for one congregation,
  and he felt its failures as his own wound. When believers gave way under
  persecution, the church built a public road back that was walked in
  stages. When bishops disagreed, even over baptism, they argued hard and
  still kept communion. Between the two men lie about 130 years with no
  bishop's voice to his own people that can be dated and placed.
