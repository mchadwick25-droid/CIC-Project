display_name: "Gallic Monastic-Ascetic Christianity"
time_window: {start: 360, end: 450}
place: "Gaul - the Loire valley around Tours, and the island of Lerins and the city of Marseilles on the Mediterranean coast"
doorway_place: "The Loire valley and the Mediterranean coast of Gaul"
doorway_description: >-
  This is the church of the ascetic bishop and the received wisdom of
  Egypt, carried west. In the Loire valley, a soldier named Martin of
  Tours left the army. He gathered followers in the woods and became a
  bishop. He never stopped living like a monk. Two generations later,
  monks built communities on an island off the Mediterranean coast and
  in the city of Marseilles. These monks had lived among the fathers of
  Egypt. Their communities trained abbots and bishops for the churches
  of southern Gaul. One of them, John Cassian, adapted the customs of
  the Egyptian desert for a colder climate and a different church.
  Another, Vincent of Lerins, wrote a rule for telling the true faith
  from every novelty. Through both households ran one argument, never
  fully settled: how much of a monk's progress is God's own gift, and
  how much is his own effort. The story closes around the year 450,
  before that argument hardened into fixed positions on either side.
