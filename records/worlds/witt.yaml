doorway_place: "Wittenberg, in Electoral Saxony, and the German territorial churches that followed it"
doorway_description: >-
  In 1517 an Augustinian friar and professor at the young university of
  Wittenberg sent theses against the sale of indulgences to his
  archbishop, and a movement began that argued Scripture's own authority
  against an intervening hierarchy, and a person's own standing before
  God as a gift received by faith, not earned by works. Princes and city
  councils, not bishops, carried the reform into their own territories,
  advised by Wittenberg's own theology faculty rather than ruled by a
  separate church government. Its most fully specified instrument was
  the household catechism: three parts recited at rising, at table, and
  at night, examined weekly by a father or a schoolmaster, until a
  conscience the commandments had terrified was made sure by a promise
  spoken from outside it. German hymns were sung inside a Mass that was
  kept, not abolished. The story runs from the Ninety-Five Theses
  through a confession signed before the emperor at Augsburg in 1530, to
  a fuller confessional book gathered by 1580 - though the movement's
  own founder had been dead some three decades by then.
