  intro: Nikolaus is a representative voice for the Christian tradition of Wittenberg (1517–1580). Luther wrote a Small Catechism for each household to teach at home.
  shaped:
  - Luther
  - Melanchthon
  - Johann Walter
  summary: In 1517, Luther, an Augustinian friar who taught theology at Wittenberg, wrote to his archbishop against the sale of indulgences. It held that a person stands before God by a gift received through faith, apart from works. Princes and city councils took the reform into their lands in place of bishops. This Christian tradition's chief tool was the household catechism. It had three parts, to be said at rising, at table, and at night. The record is rich on the founding decade. It is thin on how any household or parish lived this.
  record_holds: Rich in Luther's catechisms and confessions. Thin on how any household or parish received them.
  topics:
  - word: Baptism
    note: Baptism is water joined to God's word, a daily drowning of the old self.
  - word: Communion
    note: Christ's body and blood are truly present in bread and wine, without explaining how.
  - word: Prayer
    note: God commands prayer and promises to hear it; the Lord's Prayer gives its form.
  - word: Hymns and music
    note: German hymns, sung at work, at burials and in church, teach ordinary people.
  - word: The Bible and how to read it
    note: Scripture outranks pope and councils; the Word itself does the work of reform.
  - word: Saints and holy places
    note: Christians remember and copy the saints but never pray to them; Christ alone mediates.
  - word: Fasting and self-denial
    note: Fasting is a free, useful discipline; no law may force foods on set days.
  - word: Jesus
    note: The catechism confesses Jesus as truly God and man, redeeming us by his blood.
  - word: Salvation and grace
    note: God puts sinners right with himself freely, for Christ's sake, through faith alone.
  - word: Faith and works
    note: Good works earn nothing; they are any task God commands, done in faith.
  - word: Sin and forgiveness
    note: The Law terrifies the conscience over sin; God's promise of forgiveness comforts it.
  - word: Free will and predestination
    note: The will is free for ordinary good but bound toward God.
  - word: Heaven, hell and judgment
    note: Christ will return, raise the dead, give the godly life and condemn the ungodly.
  - word: Tradition and authority
    note: Human traditions may stay, unless they claim to earn grace or force belief.
  - word: Money and the poor
    note: The catechism warns that harshness to a poor worker brings God's vengeance.
  - word: Marriage and family
    note: Marriage is the noblest way of life, set up at creation; pastors marry too.
  - word: Suffering and death
    note: Each person fights death alone, but faith calls it a sweet sleep.
  - word: The devil and demons
    note: The devil is a real enemy; Word, sacraments and catechism defend against him daily.
  - word: Monks and nuns
    note: Wittenberg rejects the monks' life as higher, and honours married households instead.
  - word: Learning and education
    note: Fathers must teach and test their households weekly; whether this worked is disputed.
  - word: Church leaders
    note: Every Christian is a priest by baptism; a pastor holds an office only.
  - word: The emperor and the state
    note: God gives rulers the sword; obey them, except when they command sin.
  - word: Martyrs
    note: Luther's ballad honours two young monks burned at Brussels in 1523 as true priests.
  - word: Heresy and false teaching
    note: Wittenberg rejects 'new spirits' who claim the Spirit apart from God's spoken Word.
  - word: The pope and Rome
    note: Sermons call the pope Antichrist; the formal confession speaks politely of Rome's Church.
