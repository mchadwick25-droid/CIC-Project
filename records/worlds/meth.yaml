display_name: "The Methodist Revival"
time_window: {start: 1738, end: 1815}
place: "Britain, then America"
doorway_place: "Aldersgate Street, London, and the open-air preaching grounds at Kingswood and Moorfields"
doorway_description: >-
  On the evening of 24 May 1738, at a religious society's meeting in
  Aldersgate Street, London, John Wesley - an Oxford-trained Church of
  England priest whose own mission to Georgia had ended in failure -
  listened to a reading of Luther's preface to Romans and felt, in his own
  words recorded that night, his heart "strangely warmed": he "felt I did
  trust in Christ, Christ alone for salvation," with an assurance he had
  long sought and not had. Shut out of most parish pulpits within a year, Wesley followed
  George Whitefield into open-air preaching - first at Kingswood's coal pits
  outside Bristol, then at Moorfields and Kennington Common - preaching
  assurance and present holiness to crowds no church building could hold.
  What made the revival endure past a single wave of preaching was Wesley's
  own organizing habit: converts divided into weekly "classes" of about a
  dozen, each required to give an honest, spoken account of their own soul's
  condition; lay preachers licensed to ride circuits; an annual Conference
  from 1744. His brother Charles set the same theology to thousands of
  singable hymns, so that people who could not read a treatise sang one
  instead. Wesley insisted to the end of his life that he had never left the
  Church of England; within a few years of his death in 1791 the connexion
  he built became a separate church anyway, on both sides of the Atlantic.
