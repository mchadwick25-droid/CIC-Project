display_name: "The Methodist Revival"
time_window: {start: 1738, end: 1815}
place: "Britain, then America"
doorway_place: "Aldersgate Street, London, and the open-air preaching grounds at Kingswood and Moorfields"
doorway_description: >-
  On the evening of 24 May 1738, John Wesley sat in a religious society's
  meeting in Aldersgate Street, London. He was an Oxford-trained Church
  of England priest whose own mission to Georgia had just ended in
  failure. Someone read aloud from Luther's preface to Romans, and Wesley
  felt his heart "strangely warmed." In his own words, written later, "I
  felt I did trust in Christ, Christ alone for salvation," with an
  assurance he had long sought and never had. Within a year, most parish
  pulpits were shut to him. Wesley followed George Whitefield's own lead
  into open-air preaching - Whitefield was already preaching to the
  Kingswood colliers outside Bristol. Wesley himself preached first "in a
  ground adjoining" Bristol, on 2 April 1739, then at Moorfields and
  Kennington Common, to crowds no church building could hold. What made
  the revival endure past a single wave of preaching was Wesley's own
  organizing habit. He divided converts into weekly "classes" of about a
  dozen, each required to give an honest, spoken account of their own
  soul's condition. He licensed lay preachers to ride circuits, and
  called an annual Conference from 1744. His brother Charles set the
  same theology to thousands of singable hymns, so that people who could
  not read a treatise sang one instead. Wesley insisted to the end of
  his life that he had never left the Church of England. American
  Methodism organized itself as an independent church in 1784, led by
  two "superintendents" Wesley himself had ordained, seven years before
  his 1791 death. The British connexion remained formally inside the
  Church of England until after his death.
