place: "Antioch/Syria, Asia Minor, Rome"
doorway_place: "Antioch, the cities of Asia Minor, and Rome"
doorway_description: >-
  After the apostles died, the church lived in households.
  Greek-speaking believers gathered around household tables in Antioch, in
  the cities of Asia Minor, and in Rome. Letters held these scattered
  communities together. Ignatius, a bishop under guard, wrote ahead to the
  churches on his road to execution. Clement of Rome wrote at length to
  settle a quarrel in Corinth. These churches had no buildings of their own
  yet and no finished New Testament, and the law did not protect them. In
  these years they were still settling who should lead, and how scattered
  households could stay one church by letter.
