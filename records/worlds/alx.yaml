display_name: "Alexandrian Christianity"
time_window: {start: 150, end: 400}
place: "Alexandria and Egypt"
doorway_place: "Alexandria and Egypt"
doorway_description: >-
  Alexandria was the Roman world's great city of learning. Its church made
  teaching the heart of the faith. New believers were formed by years of
  staged instruction before baptism. Teachers like Clement and Origen read
  Scripture in layers: the plain story, and the deeper meaning inside it.
  They were confident that Greek learning could serve Christ rather than
  threaten him. In this Christian tradition, faith grows the way understanding grows - by
  study, questions, and a teacher's patient guidance.
