thinness_statement: "PROVISIONAL, Step 0-2 level only - not yet tested against a completed Doc_04/gravity pass. Richest in one insider historian's own testimony (John of Ephesus, both his Lives of the Eastern Saints and his Ecclesiastical History, which together carry persecution narrative, personal portraiture, and internal-controversy material) and two native doctrinal voices (Severus of Antioch's Select Letters and Philoxenus of Mabbug's own Creed, Confession of Faith, and anti-Nestorian polemic); thinner on ordinary lay believers' own words and, specifically, on any woman's own first-person voice - women appear as subjects of substantial third-person narrative (whole chapters devoted to named women ascetics in the Lives of the Eastern Saints), not only as patrons reported on by others, but not as attested speakers in their own words in anything vendored so far."
