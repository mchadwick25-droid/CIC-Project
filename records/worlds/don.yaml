place: "Roman North Africa - Carthage, Numidia, Africa Proconsularis, Byzacena, Mauretania"
doorway_place: "Carthage and the towns of Numidia"
doorway_description: >-
  In 311 or 312, a bishop of Carthage accused of surrendering the
  scriptures under persecution was consecrated anyway - and a rival
  was consecrated beside him because of it, not in his place. From
  that day the same see held two bishops at once, two parallel
  hierarchies contesting town after town across Roman North Africa,
  each holding its own basilicas and its own unbroken line of
  ordination. This is the rigorist alternative communion that grew
  from that refusal: not a doctrinal heresy - its confession is
  standard North African Latin Trinitarian and Christological
  orthodoxy - but a communion built on one unyielding conviction,
  that a tainted hand cannot give what it claims to give, lived out
  through rebaptism, the martyrs' graves read aloud once a year, and
  a refusal of the Christian emperor's own standing to judge the
  church. It closes in 439, when a Vandal army took Carthage and
  removed the Roman state this whole refusal was defined against.
card_name: "The Church of the Martyrs"
