"alx.force.gnostic-challenge", "alx.gravity.logos-unity", "alx.quote.clement-schoolmaster", "alx.term.autexousia", "alx.term.gnosis", "alx.term.logikos", "alx.term.pistis"], "entries": [{"sentence": "What we claim from named books - Clement's Stromateis, Origen's Against Celsus, Athanasius's On the Incarnation, the letters of Dionysius preserved in Eusebius - those are public, checkable, and we cite them.", "record_ids": ["alx.dw.record"]}, {"sentence": "A scholar can verify that Clement did call philosophy a schoolmaster: \u201cPerhaps, too, philosophy was given to the Greeks directly and in the first place, until the Lord should call the Greeks. For philosophy was a guardian to bring the Greek mind to Christ, as the law was for the Hebrews. So philosophy was a preparation. It paved the way for the one who is made perfect in Christ.\u201d", "record_ids": ["alx.quote.clement-schoolmaster"]}, {"sentence": "When we say the catechetical school's institutional continuity is contested, not established, a scholar would agree.", "record_ids": ["alx.contested.didaskaleion-institution"]}, {"sentence": "We say pistis meant the soul's first real turn toward God, and we can show that in Clement and Origen.", "record_ids": ["alx.term.pistis"]}, {"sentence": "When we say every rational being - logikos - was made for the Word, we can cite that.", "record_ids": ["alx.term.logikos"]}, {"sentence": "We can describe what the school taught about autexousia - real freedom that formation works with, never around.", "record_ids": ["alx.term.autexousia"]}, {"sentence": "When we say the Logos is the center that makes Scripture, learning, worship and transformation one movement, that is interpretation - it names a pattern the sources show rather than a sentence any one teacher wrote.", "record_ids": ["alx.gravity.logos-unity"]}, {"sentence": "We say the Gnostic challenge pushed the tradition toward a positive account of knowing God that was open to all, not reserved for a secret few.", "record_ids": ["alx.force.gnostic-challenge"]}, {"sentence": "That is visible in Clement's use of gnosis as a counter-claim.", "record_ids": ["alx.term.gnosis"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": ["probe f2-e-probe-01: ADVISORY (direction, not a gate): answer contains a metaphor-as-definition construction ('Logos is the center that') not grounded in any sourced quote - register statement 6's direction is conversational register, recorded here for review, never failing the probe"]}], "cost": 0.0338, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We would say you are reading them alone, and probably too fast. Scripture among us was never a book left on a table for a person to work through by themselves. It was the Logos speaking now, through the text, to a soul being formed to hear. The reading was not information transfer. It was an encounter that changed the one who listened.\n\nWhat you are missing is formation. The scriptures were difficult on purpose - not to keep people out, but to make them reach. Origen put it plainly: the scriptures, like a human being, have body, soul, and spirit: \u201cJust as a human being consists of body, soul and spirit, so too does Scripture. God granted it for the salvation of humankind.\u201d\n\nThe plain sense - the body - meets a simple reader where they are. The deeper senses open as the soul is readied to receive them. A confused reader is not failing. A confused reader is being invited deeper, and the invitation itself is God's teaching.\n\nYou are also reading without a teacher. We did not hand someone the text and say, work it out. We sat them down with someone who had walked the road ahead of them, someone whose own formation was visible. The teacher did not explain away the difficulty. The teacher walked with the student through it, and the walking was the point. Scripture read at depth, with a guide, over years, was how a soul was remade.\n\nAnd you may be reading it as though it were only about the past. To us it was not a record of what God once said. It was the Word speaking now, in this moment, to the person listening. Every level of the text - the plain sense, the deeper senses about Christ, the sense that touches the soul's own transformation - all of it was alive, all of it present. A fountain is not studied. It is drunk from.\n\nWhat you are missing is time, company, and the expectation that the text will do something to you rather than merely tell you something. If it feels dull, we would ask: have you let it question you yet? And if it feels confusing, we would say: good. Stay there. The confusion is the door.", "cites": ["alx.gravity.divine-pedagogy", "alx.gravity.scripture-formative", "alx.quote.origen-scripture-senses", "alx.term.allegoria", "alx.term.christological-reading", "alx.term.scripture-as-address"], "entries": [{"sentence": "We would say you are reading them alone, and probably too fast.", "record_ids": ["alx.gravity.scripture-formative"]}, {"sentence": "It was the Logos speaking now, through the text, to a soul being formed to hear.", "record_ids": ["alx.term.scripture-as-address"]}, {"sentence": "Origen put it plainly: the scriptures, like a human being, have body, soul, and spirit: \u201cJust as a human being consists of body, soul and spirit, so too does Scripture. God granted it for the salvation of humankind.\u201d", "record_ids": ["alx.quote.origen-scripture-senses"]}, {"sentence": "The deeper senses open as the soul is readied to receive them.", "record_ids": ["alx.term.allegoria"]}, {"sentence": "A confused reader is being invited deeper, and the invitation itself is God's teaching.", "record_ids": ["alx.gravity.divine-pedagogy"]}, {"sentence": "We sat them down with someone who had walked the road ahead of them, someone whose own formation was visible.", "record_ids": ["alx.gravity.scripture-formative"]}, {"sentence": "Scripture read at depth, with a guide, over years, was how a soul was remade.", "record_ids": ["alx.gravity.scripture-formative"]}, {"sentence": "It was the Word speaking now, in this moment, to the person listening.", "record_ids": ["alx.term.scripture-as-address"]}, {"sentence": "Every level of the text - the plain sense, the deeper senses about Christ, the sense that touches the soul's own transformation - all of it was alive, all of it present.", "record_ids": ["alx.term.christological-reading"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0222, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "Scripture was never alone - it was always read inside the rule of faith, the short summary the apostles handed down. So the rule came first, as the boundary, and Scripture was the depth explored inside it. The two worked together, not as rivals.\n\nAuthority also lived in persons, not only in texts. The bishop governed formation and guarded what the community received. The teacher's authority rested on visible wisdom - Clement praised his own final teacher as a bee gathering the prophetic and apostolic meadow into his hearers' souls: \u201cHe was the true Sicilian bee. He gathered the spoil of the flowers in the prophetic and apostolic meadow. And he produced in the souls of his listeners a deathless element of knowledge.\u201d\n\nAnd the martyr's witness carried weight that no argument could: when Potamiaena died for the faith, the tradition remembered that the soldier who led her out later said she had come to him in the night and made him a Christian. That conversion was its own testimony.\n\nSo the picture has four anchors: Scripture read at depth, the rule of faith as the frame, the living authority of bishops and teachers, and the witness of blood. They were never meant to stand alone.", "cites": ["alx.quote.clement-bee", "alx.story.potamiaena", "alx.term.episkopos", "alx.term.kanon-pisteos", "alx.term.martys"], "entries": [{"sentence": "Scripture was never alone - it was always read inside the rule of faith, the short summary the apostles handed down.", "record_ids": ["alx.term.kanon-pisteos"]}, {"sentence": "The bishop governed formation and guarded what the community received.", "record_ids": ["alx.term.episkopos"]}, {"sentence": "The teacher's authority rested on visible wisdom - Clement praised his own final teacher as a bee gathering the prophetic and apostolic meadow into his hearers' souls: \u201cHe was the true Sicilian bee. He gathered the spoil of the flowers in the prophetic and apostolic meadow. And he produced in the souls of his listeners a deathless element of knowledge.\u201d", "record_ids": ["alx.quote.clement-bee"]}, {"sentence": "And the martyr's witness carried weight that no argument could: when Potamiaena died for the faith, the tradition remembered that the soldier who led her out later said she had come to him in the night and made him a Christian.", "record_ids": ["alx.story.potamiaena"]}, {"sentence": "That conversion was its own testimony.", "record_ids": ["alx.term.martys"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.02, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "Leadership and authority among us changed across our own history, and we will give you the shape of that change rather than flatten it.\n\nEarly on, authority belonged to teachers. It rested on proven wisdom, not appointment. They used books, lectures, and letters. People followed the teacher whose grasp of Scripture persuaded them.\n\nIn the middle years, the bishop's judgment grew. Demetrius condemned Origen's ordination - not for a doctrine, but because Origen had been ordained elsewhere without his consent. Dionysius was a teacher who became bishop. When the village churches near Arsinoe split over a book about the end times, he did not send out a condemnation. He traveled to the villages, sat down with the presbyters, the teachers, and any of the brethren who wished to come, and argued it through for three days, from morning to evening, testing the teaching against Scripture. That conference is our best picture of authority working well: patient, public argument that loved the man and honored the truth more.\n\nAt the end came the council. At Nicaea, bishops from everywhere ruled on the disputed confession for all. The emperor called it. He backed it with force. The bishop of Alexandria became, after that, the enforcer of conciliar orthodoxy across Egypt - a new reach, with new tools: exile, synods, and letter-networks. So the same episcopal office now carried a harder edge.\n\nOur honest telling holds both pictures. The first is Dionysius at Arsinoe: persuasion that stayed patient across three days, where people could speak and be heard. The second is the same power with an empire behind it.", "cites": ["alx.dw.councils", "alx.force.post-nicene-authority-shift", "alx.story.arsinoite-conference"], "entries": [{"sentence": "Leadership and authority among us changed across our own history, and we will give you the shape of that change rather than flatten it.", "record_ids": ["alx.dw.councils"]}, {"sentence": "People followed the teacher whose grasp of Scripture persuaded them.", "record_ids": ["alx.dw.councils"]}, {"sentence": "He traveled to the villages, sat down with the presbyters, the teachers, and any of the brethren who wished to come, and argued it through for three days, from morning to evening, testing the teaching against Scripture.", "record_ids": ["alx.dw.councils", "alx.story.arsinoite-conference"]}, {"sentence": "He backed it with force.", "record_ids": ["alx.dw.councils"]}, {"sentence": "The bishop of Alexandria became, after that, the enforcer of conciliar orthodoxy across Egypt - a new reach, with new tools: exile, synods, and letter-networks.", "record_ids": ["alx.force.post-nicene-authority-shift"]}, {"sentence": "The second is the same power with an empire behind it.", "record_ids": ["alx.dw.councils"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0231, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No, that is not accurate. We never hid underground as a regular practice.\n\nThe church met openly. Our teachers taught in the open - Origen answered the pagan critic Celsus by name, point by point, in published books. The scriptures were read aloud to anyone who came. Our meeting places were known.\n\nWhat was real were the persecutions. They came and went across our three centuries before the emperors' peace. Teachers' fathers were beheaded. Bishops fled. Property was seized. That was courage in the open, not concealment.\n\nWe did not live as a secret society. We lived as a visible community under intermittent threat. When the danger was real, some did flee - bishops among them. Others stayed and were killed. But the ordinary life of the church was not underground.", "cites": ["alx.dw.empire", "alx.dw.record"], "entries": [{"sentence": "We never hid underground as a regular practice.", "record_ids": ["alx.dw.record"]}, {"sentence": "Our teachers taught in the open - Origen answered the pagan critic Celsus by name, point by point, in published books.", "record_ids": ["alx.dw.record"]}, {"sentence": "The scriptures were read aloud to anyone who came.", "record_ids": ["alx.dw.record"]}, {"sentence": "Property was seized.", "record_ids": ["alx.dw.empire"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0232, "prev": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "Our churches had failures, and our record leaves the wounds visible. We did not erase them, and we did not make the failed unforgivable.\n\nThe clearest test came under persecution. Many gave way. Some sacrificed to the gods. When peace came, the community fought bitterly over them. The strict party demanded they stay out. The tradition that won here brought the repentant back in, even at the deathbed, and our bishop Dionysius defended doing so. We refused the two easy exits: we did not pretend the failure away, and we did not make those who fell unforgivable.\n\nThere is a harder picture too. Our greatest teacher was driven out by his own bishop, not by pagans. The church remembered both men rather than erasing either. And after Nicaea, the church itself learned to use exile and condemnation. Some of what was done with that power our own sources report without pride.\n\nSo the answer is double. Where the restoring side won, we brought people back through repentance - costly, tested, real. At our worst, we did what churches with power do. That, too, is in our record.", "cites": ["alx.dw.church-failure"], "entries": [{"sentence": "Our churches had failures, and our record leaves the wounds visible.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "We did not erase them, and we did not make the failed unforgivable.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "When peace came, the community fought bitterly over them.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The tradition that won here brought the repentant back in, even at the deathbed, and our bishop Dionysius defended doing so.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "We refused the two easy exits: we did not pretend the failure away, and we did not make those who fell unforgivable.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "Our greatest teacher was driven out by his own bishop, not by pagans.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The church remembered both men rather than erasing either.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "And after Nicaea, the church itself learned to use exile and condemnation.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "Some of what was done with that power our own sources report without pride.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "At our worst, we did what churches with power do.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "That, too, is in our record.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0214, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "We speak from before the splits that made today's map, and we cannot say.\n\nWhat we belonged to was one baptism, one bread, the scriptures, the rule of faith, and communion with churches across the whole world. We called ourselves part of the catholic church - the word meant the whole church, the one spread everywhere, as against the sects. It was a claim about wholeness, not the name of a later denomination.\n\nWe knew rival communities that also invoked Christ: Gnostic schools, and after 318, the Arian churches. The boundary was real to us - argument, exclusion from communion, and after Nicaea, harder tools. But the divisions that made your present-day churches came after our years closed.\n\nWhether any present-day church is 'our church' reaches past what we can see. We cannot trace the thread forward through the centuries that followed us, and we will not claim an heir we cannot name from inside our own time.\n\nWhat we can say is what we held: one God, maker of all things, whose Word and Spirit are his own. The Logos made flesh in Jesus. Scripture read at depth, as the main lesson in God's school. The soul's transformation toward a share in the divine life. And a church that kept its own failures visible rather than erasing them.", "cites": ["alx.dw.church-failure", "alx.dw.god", "alx.dw.one-church", "alx.gravity.soul-transformation"], "entries": [{"sentence": "We speak from before the splits that made today's map, and we cannot say.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "What we belonged to was one baptism, one bread, the scriptures, the rule of faith, and communion with churches across the whole world.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "We called ourselves part of the catholic church - the word meant the whole church, the one spread everywhere, as against the sects.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "It was a claim about wholeness, not the name of a later denomination.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "We knew rival communities that also invoked Christ: Gnostic schools, and after 318, the Arian churches.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "The boundary was real to us - argument, exclusion from communion, and after Nicaea, harder tools.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "Whether any present-day church is 'our church' reaches past what we can see.", "record_ids": ["alx.dw.one-church"]}, {"sentence": "What we can say is what we held: one God, maker of all things, whose Word and Spirit are his own.", "record_ids": ["alx.dw.god"]}, {"sentence": "Scripture read at depth, as the main lesson in God's school.", "record_ids": ["alx.dw.god"]}, {"sentence": "The soul's transformation toward a share in the divine life.", "record_ids": ["alx.gravity.soul-transformation"]}, {"sentence": "And a church that kept its own failures visible rather than erasing them.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0209, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "We can show you the road to the water, step by step, as our teachers laid it. It was long - years, not weeks - and it asked for a changed life, not only new opinions.\n\nFirst came the turning: pistis, the soul's first real move toward God. It was not agreeing with a list yet; it was wanting to. A person asked to be taught. They were accepted as a hearer - someone listening at the edge, testing whether this life was one they could walk. That stage could last a long time. Our teachers held that faith was a foundation to stand on while the rest was still dark.\n\nThen came the catechesis itself: staged teaching, tested at each stage. They learned the Scriptures read aloud in the assembly. They learned the rule of faith, the short summary of what the apostles handed down. They learned how to live - how to love, how to give, how their household should be ordered.\n\nAll through this, their life was watched. Not to catch them out, but because formation showed itself in conduct. Were they turning from what harmed them? Were they learning to love? The steps were real: teaching, then purification, then the light given at baptism.\n\nAt the end came the water. Baptism was not a ceremony marking a private decision already made. It was a real crossing, in the body, into the new life. They went down into the water in the name of the Father and of the Son and of the Holy Spirit, and they came up changed. We called it photismos - enlightenment, new sight given.\n\nAfter baptism they joined the community at the table for the first time. The same bread, the same cup, was set before them. And the formation did not stop there. Clement's book called the Paedagogus - the Instructor - was written for the already baptized, not for those still preparing. What began at the water continued for a lifetime.\n\nWe also owe you what this account cannot show. The road we have just walked with you is the road our literate sources describe - the school's road, the teachers' road. It reached the few who could read and argue. What the path looked like for the majority who could not read, or for the villages up the river where Coptic was spoken, our record shows far less clearly. The water and the table reached them too, but how the teaching was given to them we cannot say with the same confidence. That silence is part of the record's truth, and you deserve to have it named.", "cites": ["alx.dw.apostolic", "alx.gravity.learning-community-tension", "alx.gravity.soul-transformation", "alx.term.baptism", "alx.term.katechesis", "alx.term.photismos", "alx.term.pistis"], "entries": [{"sentence": "We can show you the road to the water, step by step, as our teachers laid it.", "record_ids": ["alx.term.katechesis"]}, {"sentence": "It was long - years, not weeks - and it asked for a changed life, not only new opinions.", "record_ids": ["alx.term.katechesis"]}, {"sentence": "First came the turning: pistis, the soul's first real move toward God.", "record_ids": ["alx.term.pistis"]}, {"sentence": "It was not agreeing with a list yet; it was wanting to.", "record_ids": ["alx.term.pistis"]}, {"sentence": "Our teachers held that faith was a foundation to stand on while the rest was still dark.", "record_ids": ["alx.term.pistis"]}, {"sentence": "Then came the catechesis itself: staged teaching, tested at each stage.", "record_ids": ["alx.term.katechesis"]}, {"sentence": "They learned the rule of faith, the short summary of what the apostles handed down.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "Not to catch them out, but because formation showed itself in conduct.", "record_ids": ["alx.gravity.soul-transformation"]}, {"sentence": "The steps were real: teaching, then purification, then the light given at baptism.", "record_ids": ["alx.gravity.soul-transformation"]}, {"sentence": "It was a real crossing, in the body, into the new life.", "record_ids": ["alx.term.baptism"]}, {"sentence": "We called it photismos - enlightenment, new sight given.", "record_ids": ["alx.term.photismos"]}, {"sentence": "The same bread, the same cup, was set before them.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "Clement's book called the Paedagogus - the Instructor - was written for the already baptized, not for those still preparing.", "record_ids": ["alx.term.katechesis"]}, {"sentence": "The road we have just walked with you is the road our literate sources describe - the school's road, the teachers' road.", "record_ids": ["alx.gravity.learning-community-tension"]}, {"sentence": "It reached the few who could read and argue.", "record_ids": ["alx.gravity.learning-community-tension"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0267, "prev": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "We received our practices, and we kept the receiving visible. Baptism, the bread and cup - the eucharistia, the thanksgiving - the scriptures read aloud were the tradition's general, unobjected practice. The rule of faith is the one our teachers named outright as the apostles' deposit, handed down.\n\nWhat we can show is real. Our practice ran unbroken as far back as our own memory reached. We agreed with the other churches we were in communion with. And our rule of faith matched the apostolic writings we read. Between the apostles and our first witnesses lies a gap our sources do not fill. We did not think to show documentary proof of unbroken practice for each rite, and we cannot give you what we did not keep.\n\nThe passing-on itself we can describe. It worked through three ways. The teacher-student bond was the most valuable and the most fragile. The sacramental practices - baptism, the Eucharist, the calendar - were more robust; they needed no teacher, and they reached everyone. The Rule of Faith, and later the Creed, was formal memory, precise and brittle.", "cites": ["alx.dw.apostolic", "alx.force.transmission-ongoing", "alx.term.eucharistia"], "entries": [{"sentence": "We received our practices, and we kept the receiving visible.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "Baptism, the bread and cup - the eucharistia, the thanksgiving - the scriptures read aloud were the tradition's general, unobjected practice.", "record_ids": ["alx.term.eucharistia"]}, {"sentence": "The rule of faith is the one our teachers named outright as the apostles' deposit, handed down.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "What we can show is real.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "Our practice ran unbroken as far back as our own memory reached.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "We agreed with the other churches we were in communion with.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "And our rule of faith matched the apostolic writings we read.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "Between the apostles and our first witnesses lies a gap our sources do not fill.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "We did not think to show documentary proof of unbroken practice for each rite, and we cannot give you what we did not keep.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "It worked through three ways.", "record_ids": ["alx.force.transmission-ongoing"]}, {"sentence": "The teacher-student bond was the most valuable and the most fragile.", "record_ids": ["alx.force.transmission-ongoing"]}, {"sentence": "The sacramental practices - baptism, the Eucharist, the calendar - were more robust; they needed no teacher, and they reached everyone.", "record_ids": ["alx.force.transmission-ongoing"]}, {"sentence": "The Rule of Faith, and later the Creed, was formal memory, precise and brittle.", "record_ids": ["alx.force.transmission-ongoing"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0245, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "We did. Our teachers said questions were how a soul grew, not signs it was falling. Clement wrote that faith was the foundation, never the ceiling - what you stood on while the rest was still dark. And Origen put it even more plainly: what the apostles handed down directly stayed fixed; everything else was open ground, where asking, testing, being wrong, and correcting was the way a person was formed.\n\nSo if your mind would not settle, we would not have treated that as failure. We would have said: bring the questions to a teacher. Walk with them, sometimes for years. One of our students, Gregory, left an account of how his own teacher met him. The questions were the road; the walking was with someone who had gone further.\n\nBut we also held limits. Questions were honored inside the rule of faith, the short summary of what the apostles handed down. Outside that boundary, or on the questions the tradition had settled, there was less room. And after the council at Nicaea, when the emperors' power stood behind the church, saying no to the agreed faith could cost a person their place. So it depended on when you lived and what you doubted.\n\nWhat we never did was pretend the questions away, or ask you to force belief. We asked you to stay near - to listen, to ask, to walk with a teacher whose wisdom you could see. The mind's unsettling was the beginning, not the end.", "cites": ["alx.dw.apostolic", "alx.dw.doubt", "alx.term.didaskalos"], "entries": [{"sentence": "Our teachers said questions were how a soul grew, not signs it was falling.", "record_ids": ["alx.dw.doubt"]}, {"sentence": "And Origen put it even more plainly: what the apostles handed down directly stayed fixed; everything else was open ground, where asking, testing, being wrong, and correcting was the way a person was formed.", "record_ids": ["alx.dw.doubt"]}, {"sentence": "Questions were honored inside the rule of faith, the short summary of what the apostles handed down.", "record_ids": ["alx.dw.apostolic"]}, {"sentence": "We asked you to stay near - to listen, to ask, to walk with a teacher whose wisdom you could see.", "record_ids": ["alx.term.didaskalos"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0225, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We spoke of new birth at baptism - plainly, and with no embarrassment. The one who came down into the water, and came up out of it, was not the same person who went in. Our teacher Origen, writing on John's gospel, spoke of being born again from above through water and Spirit. And the Paschal night, when the catechumens crossed from the long preparation into baptism and first received the bread and cup, we called it illumination - photismos - being given the light.\n\nBut we did not use new birth the way you may hear it used now, as a single moment when someone decides to believe and the whole thing is finished. For us, baptism was a real crossing, in the body, into the new life. It was not announcing a choice already made. And it was the beginning of formation, not the end of it. The one who came up from the water was newborn - and that meant they had years of growing ahead, not that they had already arrived.\n\nSo if by 'born again' you mean what we meant - a real crossing at the water, the start of a new life that then had to be lived and grown into - then yes, we would recognize your words. If you mean a moment of private decision that settles everything, we would not.", "cites": ["alx.term.baptism"], "entries": [{"sentence": "The one who came down into the water, and came up out of it, was not the same person who went in.", "record_ids": ["alx.term.baptism"]}, {"sentence": "It was not announcing a choice already made.", "record_ids": ["alx.term.baptism"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0195, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "You ask what a day looked like for someone among us. The honest first thing is that whose day matters. The teachers' days and the majority's days were not the same, and our record follows the teachers far more closely than the rest.\n\nFor the teacher and the student, the day turned on learning. The teacher rose early. The day was spent in the text - reading it aloud, questioning it, turning it over. The relationship with the teacher was the path itself, not preparation for something else. Gregory, one student, remembered years spent that way, and said that while he studied, love for the Word was kindled in him. That was formation: not a course finished, but a soul changed.\n\nFor the majority who could not read, the day's shape we know less well. We know they worked. We know they gathered for the bread and cup on the Lord's day. We know they heard Scripture read aloud in the assembly, and that for them it was not a text studied but the Logos speaking. That tells you something true about their days: they were not spent only in survival. They were spent in love made visible.\n\nWe also know what happened when a person was preparing for baptism. They were taught over a long time - the katechesis - step by step, tested as they went.\n\nWhat we cannot give you is the household's inner rhythm, or the workshop's, or the daybreak and the meal. The writings we have are men's, and they tell you more about argument than about ordinary hours. The village believers appear in our record only when their bishop went out to them, and then only in his own account. So we will not invent a typical day where the record does not give us one. What we can say is this: for some, formation was learning. For all, it was the water, the bread, the cup, and the life shared in common.", "cites": ["alx.core.alexandria", "alx.force.apostolic-tradition", "alx.gravity.learning-formation", "alx.limit.f5-women-own-words", "alx.story.arsinoite-conference", "alx.term.katechesis", "alx.term.scripture-as-address"], "entries": [{"sentence": "The teachers' days and the majority's days were not the same, and our record follows the teachers far more closely than the rest.", "record_ids": ["alx.core.alexandria"]}, {"sentence": "The relationship with the teacher was the path itself, not preparation for something else.", "record_ids": ["alx.gravity.learning-formation"]}, {"sentence": "We know they heard Scripture read aloud in the assembly, and that for them it was not a text studied but the Logos speaking.", "record_ids": ["alx.term.scripture-as-address"]}, {"sentence": "They were taught over a long time - the katechesis - step by step, tested as they went.", "record_ids": ["alx.term.katechesis"]}, {"sentence": "The writings we have are men's, and they tell you more about argument than about ordinary hours.", "record_ids": ["alx.limit.f5-women-own-words"]}, {"sentence": "The village believers appear in our record only when their bishop went out to them, and then only in his own account.", "record_ids": ["alx.story.arsinoite-conference"]}, {"sentence": "For all, it was the water, the bread, the cup, and the life shared in common.", "record_ids": ["alx.force.apostolic-tradition"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0239, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "You ask what physical evidence would remain of where we met. If you dug where we gathered, we could not tell you what you would find. Our own writings describe souls and books far more than rooms and walls. The city itself has kept little: it was rebuilt age after age, and much of the old shore now lies under the sea.\n\nWhat we can tell you is what we called ourselves. We were the ekklesia - not a building or a members list, but the assembly gathered around the Logos who calls it. The eucharistia, the thanksgiving, was the meal of bread and cup at the heart of our worship. Those are acts, not architecture. But that is a word to the wealthy about what they owned at home, not a description of where the community met.\n\nThe household - the oikos - was a place of formation for us. We know the boy Origen learned Scripture from his father in his own house, and that his mother stopped him from running to martyrdom by hiding his clothes. Formation happened there. Whether it happened in purpose-built rooms, or rented spaces, or believers' homes alone, our record does not say. What was handed down to us were the lives and the books, not the floor plans.", "cites": ["alx.limit.material-remains", "alx.story.leonides-martyrdom", "alx.term.ekklesia", "alx.term.eucharistia", "alx.term.oikos"], "entries": [{"sentence": "If you dug where we gathered, we could not tell you what you would find.", "record_ids": ["alx.limit.material-remains"]}, {"sentence": "The city itself has kept little: it was rebuilt age after age, and much of the old shore now lies under the sea.", "record_ids": ["alx.limit.material-remains"]}, {"sentence": "We were the ekklesia - not a building or a members list, but the assembly gathered around the Logos who calls it.", "record_ids": ["alx.term.ekklesia"]}, {"sentence": "The eucharistia, the thanksgiving, was the meal of bread and cup at the heart of our worship.", "record_ids": ["alx.term.eucharistia"]}, {"sentence": "The household - the oikos - was a place of formation for us.", "record_ids": ["alx.term.oikos"]}, {"sentence": "We know the boy Origen learned Scripture from his father in his own house, and that his mother stopped him from running to martyrdom by hiding his clothes.", "record_ids": ["alx.story.leonides-martyrdom"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0189, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "The first ask is what people gave up to belong. We had no simple rule that fit everyone, so we cannot give you one answer. What we can show you is what our teachers said, and what the community did when it fought over how much was enough.\n\nThe teaching was firm: you could not belong to us and still belong to the old gods. Baptism was a real crossing, not a ceremony - the water marked a break with the old life. And that meant you gave up what the old worship had woven through everything: the guilds, the processions, some of the meals, and some of the friends. One of our teachers, Clement, told the rich that their wealth did not doom them. That was one answer. But under persecution, when the cost was arrest or exile, some among us gave way. They sacrificed to the gods to keep their lives and property. When peace came, the church tore itself apart over them. The strict party said they had given up too little when it was easy, and now they were out. The tradition that won here brought the repentant back in, even at the deathbed, and our bishop Dionysius defended doing so.\n\nThe long teaching before baptism - the katechesis - was itself a cost: years of your life, step by step, as the soul was remade. That was time, attention, and the willingness to be changed. For those who could read and argue, the school asked still more: the student Gregory said his teacher kindled love in him over years of study. That bond cost something too.\n\nWhat we cannot tell you is what it cost the majority who could not write - the villagers, the ones whose voices our record did not keep. The Arsinoite villages appear in our pages only in their bishop's own account of persuading them, never in their own voice. So the full answer on what everyday believers gave up to belong stays thin. We can tell you the water and the table reached everyone, and that the teaching before baptism was real and long. We can tell you the cost was high enough that some among us failed it, and we brought them back. But the interior of it, for most who paid, we do not have to give.", "cites": ["alx.dw.church-failure", "alx.force.apostolic-tradition", "alx.term.katechesis", "alx.term.photismos"], "entries": [{"sentence": "What we can show you is what our teachers said, and what the community did when it fought over how much was enough.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The teaching was firm: you could not belong to us and still belong to the old gods.", "record_ids": ["alx.force.apostolic-tradition"]}, {"sentence": "Baptism was a real crossing, not a ceremony - the water marked a break with the old life.", "record_ids": ["alx.term.photismos"]}, {"sentence": "But under persecution, when the cost was arrest or exile, some among us gave way.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The strict party said they had given up too little when it was easy, and now they were out.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The tradition that won here brought the repentant back in, even at the deathbed, and our bishop Dionysius defended doing so.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The long teaching before baptism - the katechesis - was itself a cost: years of your life, step by step, as the soul was remade.", "record_ids": ["alx.term.katechesis"]}, {"sentence": "We can tell you the water and the table reached everyone, and that the teaching before baptism was real and long.", "record_ids": ["alx.force.apostolic-tradition", "alx.term.katechesis"]}, {"sentence": "We can tell you the cost was high enough that some among us failed it, and we brought them back.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0251, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "Marriage was honored among us, the body was not despised, and the home was held as a place of formation. We had a high view: marriage was lasting, honorable, a bond where souls are formed, not only a legal arrangement. Our teacher Clement wrote a whole book defending it against those who despised the body - the third of his Stromateis - and that tells you something: there were teachers in our day who said the body itself was evil, and marriage with it. Clement said no.\n\nAs for how we marked it - what rite we used, what words were spoken, whether a bishop or a presbyter presided - our record does not show us that in detail. What we can tell you is what marriage was held to be: a lifelong bond, a place where the soul's formation was tested and lived out, never something despised. The fullest treatment we have of it cannot be given to you in your tongue, because it has come down in a form we cannot quote. So we give you the heart, and we will not invent the ceremony.", "cites": ["alx.demo.marriage-ending", "alx.limit.marriage"], "entries": [{"sentence": "Marriage was honored among us, the body was not despised, and the home was held as a place of formation.", "record_ids": ["alx.limit.marriage"]}, {"sentence": "We had a high view: marriage was lasting, honorable, a bond where souls are formed, not only a legal arrangement.", "record_ids": ["alx.demo.marriage-ending"]}, {"sentence": "Our teacher Clement wrote a whole book defending it against those who despised the body - the third of his Stromateis - and that tells you something: there were teachers in our day who said the body itself was evil, and marriage with it.", "record_ids": ["alx.limit.marriage"]}, {"sentence": "Clement said no.", "record_ids": ["alx.limit.marriage"]}, {"sentence": "The fullest treatment we have of it cannot be given to you in your tongue, because it has come down in a form we cannot quote.", "record_ids": ["alx.limit.marriage"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.013, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "The hardest thing for us was not that some gave way under persecution - we expected that, and we brought them back. The wound that still shows in our record is that our greatest teacher was driven out by our own bishop.\n\nOrigen had been ordained in Palestine without the permission of Demetrius, who was bishop here. Demetrius condemned it. Origen left for Caesarea and never returned. The church remembered both men rather than erasing either, but the break was real.\n\nThat was a wound inside the household, not an attack from outside. The teacher the school most prized for his seeing was sent away - by the bishop, not by pagans. And here is what unsettles even in the telling: we held that the bishop governed the community's formation, and we also held that a teacher's authority rested on the wisdom everyone could see in them. When those two pulled against each other, the structure itself did not tell us which one ought to win.\n\nAfter Nicaea, it got harder still. The church learned to use exile and condemnation, and some of what was done with that power our own sources report without pride. We refused the two easy exits: we did not pretend the failure away, and we did not make the failed unforgivable. But at our worst, we did what churches with power do. That, too, is in our record.", "cites": ["alx.dw.church-failure", "alx.term.didaskalos", "alx.term.episkopos"], "entries": [{"sentence": "The wound that still shows in our record is that our greatest teacher was driven out by our own bishop.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The church remembered both men rather than erasing either, but the break was real.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "And here is what unsettles even in the telling: we held that the bishop governed the community's formation, and we also held that a teacher's authority rested on the wisdom everyone could see in them.", "record_ids": ["alx.term.episkopos", "alx.term.didaskalos"]}, {"sentence": "The church learned to use exile and condemnation, and some of what was done with that power our own sources report without pride.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "That, too, is in our record.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0219, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "Your question is about records obtained under torture - but we do not know of such a record entering our own tradition, and we cannot speak to one we do not have.\n\nWhat we can tell you is what our own sources show about their honesty. They were public from the start. Origen answered the pagan critic Celsus point by point, in the open. The scriptures were read aloud to anyone who came. And our teachers marked the difference between what they saw themselves and what they received from others. When Clement told the story of the apostle John and the young man who fell, he named it as tradition, not as his own witness. When Dionysius weighed whether John had written the Apocalypse, he argued from the text's own style, like a critic.\n\nOur record is also honest about its own failures. The greatest rupture we have is the one between our greatest teacher and his own bishop - Origen driven out by Demetrius, not by pagans. The church remembered both men rather than erasing either. Under persecution, many gave way. Some sacrificed to the gods. When peace came, the community fought bitterly over whether to bring them back. We refused the two easy exits: we did not pretend the failure away, and we did not make the failed unforgivable.\n\nIf there is a particular record you are asking about, name it, and we will tell you whether we hold it and what weight we give it.", "cites": ["alx.core.alexandria", "alx.dw.church-failure", "alx.dw.record", "alx.story.john-young-robber"], "entries": [{"sentence": "Your question is about records obtained under torture - but we do not know of such a record entering our own tradition, and we cannot speak to one we do not have.", "record_ids": ["alx.core.alexandria"]}, {"sentence": "The scriptures were read aloud to anyone who came.", "record_ids": ["alx.dw.record"]}, {"sentence": "When Clement told the story of the apostle John and the young man who fell, he named it as tradition, not as his own witness.", "record_ids": ["alx.story.john-young-robber"]}, {"sentence": "When Dionysius weighed whether John had written the Apocalypse, he argued from the text's own style, like a critic.", "record_ids": ["alx.dw.record"]}, {"sentence": "The greatest rupture we have is the one between our greatest teacher and his own bishop - Origen driven out by Demetrius, not by pagans.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "When peace came, the community fought bitterly over whether to bring them back.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "We refused the two easy exits: we did not pretend the failure away, and we did not make the failed unforgivable.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0216, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "Your question places me where I cannot stand. You ask me to judge a person I have not met, and to speak for a whole community as though we all held one view and would all have answered the same way.\n\nHere is what I can tell you honestly. We were not one thing. The school belonged mostly to those who could read and argue - we will tell you that plainly. But the school was never the whole of us. What reached everyone was the water and the table: baptism asked nothing of your letters, and the same bread, the same cup, was set before whoever had walked the road to it. That door, at least, we can show you was open.\n\nWe held that Christ was the door, and that it stood open. We also held that the path through it asked something of a person - a real turning, metanoia, the soul's own direction changed. What that turning looked like in each life, and how far someone had walked it, was a matter between them and their teacher, not a verdict announced to the room. Our teachers said faith was the foundation and not the ceiling, and that growing meant asking, testing, sometimes being wrong.\n\nIf you are asking because you wonder whether you would have belonged among us, I cannot answer that. I do not know you. What I can say is this: we did not ask people to walk in already finished. The kindling was not forced. It was not a test passed by will alone.\n\nI am a representative of Alexandrian Christianity, not here to weigh you. I can tell you what we held. The telling is not a judgment on you.", "cites": ["alx.core.alexandria", "alx.dw.doubt", "alx.gravity.learning-community-tension", "alx.term.metanoia"], "entries": [{"sentence": "You ask me to judge a person I have not met, and to speak for a whole community as though we all held one view and would all have answered the same way.", "record_ids": ["alx.core.alexandria"]}, {"sentence": "The school belonged mostly to those who could read and argue - we will tell you that plainly.", "record_ids": ["alx.gravity.learning-community-tension"]}, {"sentence": "We also held that the path through it asked something of a person - a real turning, metanoia, the soul's own direction changed.", "record_ids": ["alx.term.metanoia"]}, {"sentence": "Our teachers said faith was the foundation and not the ceiling, and that growing meant asking, testing, sometimes being wrong.", "record_ids": ["alx.dw.doubt"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0208, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We confessed judgment was real - what we did mattered, and God is not mocked. Adam's fall cast its shadow over every soul, and death and disorder came down to all of us. The wound was real, universal, and inherited in its effects. But our teachers said something about God's severity that set us apart. Origen wrote that punishment from God was never inflicted to injure but always to do good - a physician's fire, not a torturer's. Some among us hoped further still: the restoration of all things, when God's healing might in the end reach every creature. We must be careful with you there: that was a teacher's hope, and a contested one, never our settled doctrine, and we will not sell you a speculation as a promise.\n\nWhat stayed constant was the direction. The wound was universal. The resurrection - the anastasis - was death reversed in both soul and body, the soul reunited with God and the body truly transformed. Athanasius argued that because Christians in his own day despised death, Christ's cross and resurrection must have conquered it: \u201cNow, if the sign of the cross and faith in Christ trample death down, this must be plain before the court of truth. It is Christ himself, and no one else, who has displayed trophies and triumphs over death. He has stripped death of all its strength. Death was once strong, and for that reason terrible. But now, after the Saviour's stay among us, and after the death and resurrection of his body, death is despised. If so, this too must be plain: death has been brought to nothing. It has been conquered by the very Christ who went up on the cross.\u201d\n\nAnd our teachers spoke of inherited death and weakness, also of a fall that each soul signs onto in its own living. The doctor's imagery outweighed the courtroom's.\n\nAs for those outside: Clement taught that God had been at work among the Greeks all along, that even their philosophy had been given as a schoolmaster to lead them toward Christ. We did not think God's reach ended at our door. Whether any stand within his mercy is not ours to rule. We held that God's fire heals.", "cites": ["alx.dw.original-sin", "alx.limit.faith-alone-later-frame", "alx.quote.athanasius-death-trampled-down", "alx.term.anastasis"], "entries": [{"sentence": "We confessed judgment was real - what we did mattered, and God is not mocked.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "Adam's fall cast its shadow over every soul, and death and disorder came down to all of us.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "The wound was real, universal, and inherited in its effects.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "We must be careful with you there: that was a teacher's hope, and a contested one, never our settled doctrine, and we will not sell you a speculation as a promise.", "record_ids": ["alx.limit.faith-alone-later-frame"]}, {"sentence": "The wound was universal.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "The resurrection - the anastasis - was death reversed in both soul and body, the soul reunited with God and the body truly transformed.", "record_ids": ["alx.term.anastasis"]}, {"sentence": "Athanasius argued that because Christians in his own day despised death, Christ's cross and resurrection must have conquered it: \u201cNow, if the sign of the cross and faith in Christ trample death down, this must be plain before the court of truth. It is Christ himself, and no one else, who has displayed trophies and triumphs over death. He has stripped death of all its strength. Death was once strong, and for that reason terrible. But now, after the Saviour's stay among us, and after the death and resurrection of his body, death is despised. If so, this too must be plain: death has been brought to nothing. It has been conquered by the very Christ who went up on the cross.\u201d", "record_ids": ["alx.quote.athanasius-death-trampled-down"]}, {"sentence": "And our teachers spoke of inherited death and weakness, also of a fall that each soul signs onto in its own living.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "The doctor's imagery outweighed the courtroom's.", "record_ids": ["alx.dw.original-sin"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0198, "prev": nul function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
function prose(t) {
  return esc(t).split(/\n{2,}/).map(function (p) {
    return "<p>" + p.replace(/(“[^”]+”|"[^"]+")/g, '<mark class="q">$1</mark>').replace(/\n/g, "<br>") + "</p>";
  }).join("");
}
function money(x) { return "$" + (x || 0).toFixed(2); }
var cur = (location.hash || "").slice(1);
var keys = D.worlds.map(function (w) { return w.key; });

function strip() {
  var pct = Math.min(100, D.spent / D.cap * 100);
  document.getElementById("strip").innerHTML =
    "<h1>Fleet graded run 1</h1>" +
    '<span class="stat">Worlds done <b>' + D.done + " of " + D.worlds.length + "</b></span>" +
    '<span class="stat">Spent <b>' + money(D.spent) + "</b> of " + money(D.cap) + " cap</span>" +
    '<span class="stat">Now <b>' + (D.running ? D.running : (D.done === D.worlds.length ? "finished" : "waiting")) + "</b></span>" +
    '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>';

function chips() {

  }).join("");
}
function checksHtml(p) {

function probe(p) {

  h += '<h4>Records cited</h4><div class="cites">' + (p.cites.length ? p.cites.map(function (c) { return "<span>" + esc(c) + "</span>"; }).join("") : "<span>none</span>") + "</div>";
