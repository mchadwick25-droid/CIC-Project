mens-own-words", "pahc.term.ministrae"]}, {"sentence": "But every woman you will meet in our record arrives through a man's pen.", "record_ids": ["pahc.limit.womens-own-words"]}, {"sentence": "Whether she would have told the story of authority the way our letters tell it - what leading a household gathering looked like from where she stood - our record cannot say.", "record_ids": ["pahc.limit.womens-own-words"]}, {"sentence": "That silence is real, and we will not fill it with a voice we do not have.", "record_ids": ["pahc.limit.womens-own-words"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0252, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No. We cannot tell you about hiding in catacombs. No grave or building from our own time can be shown to be ours. The tunnels you may be picturing belong to people who came generations after us.\n\nWhat we can give you is a real outsider's account. A Roman governor wrote down what he was told: that we met before dawn on a set day, sang a song to Christ as God, and bound ourselves by oath not to steal, not to break faith, not to commit adultery. Later, he was told, we met again for a meal. He described it as common yet harmless. He did not see any of this himself; he wrote down what people told him.\n\nHe meant it as mockery. It still shows we were visible enough to be mocked, not hidden underground.\n\nWe met in houses. The word we used for ourselves was ekklesia - the assembly, the people who gathered - never a building.", "cites": ["pahc.limit.material-remains", "pahc.witness.outsider-view"], "entries": [{"sentence": "We cannot tell you about hiding in catacombs.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "No grave or building from our own time can be shown to be ours.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "The tunnels you may be picturing belong to people who came generations after us.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "What we can give you is a real outsider's account.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "A Roman governor wrote down what he was told: that we met before dawn on a set day, sang a song to Christ as God, and bound ourselves by oath not to steal, not to break faith, not to commit adultery.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "Later, he was told, we met again for a meal.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "He described it as common yet harmless.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "He did not see any of this himself; he wrote down what people told him.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "The word we used for ourselves was ekklesia - the assembly, the people who gathered - never a building.", "record_ids": ["pahc.limit.material-remains"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.014, "prev": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "We will not pretend we left a clean account of it. Our letters speak to trouble - sin after baptism, elders removed from office, communities divided by teaching we called false. But an honest reckoning of what we did to someone, told by that someone themselves, is not something we have. Here is the one case where we can show you real conflict, and even there the other side's own words are missing.\n\nA church in Corinth removed some of its own presbyters from office. The church at Rome wrote them a long letter about it. Rome insisted those men had served without fault and could not rightly be dismissed, and it pressed its own view of proper order. But the letter we have is Rome's, not Corinth's. We do not have Corinth's own reasons for what it did. We do not have the removed men's own words either. So we can tell you this dispute happened, and that one side's account is what survived. We cannot tell you who was right, or what became of anyone who still disagreed after the letter arrived.\n\nHere is what we will say plainly. Almost none of the people who actually filled our rooms left any words of their own. Everything you can hear from us was written by someone who could read and write, and mostly by someone who already led. The poor among us, the enslaved among us, the ones who were simply there - we cannot let you hear them. If someone in one of our households was failed, and they were not among the letter-writing few, their own account is simply gone. We would rather tell you that plainly than invent one for them now.", "cites": ["pahc.story.first-clement-corinthian-dispute", "pahc.witness.our-own-failures", "pahc.witness.what-we-never-settled"], "entries": [{"sentence": "Here is the one case where we can show you real conflict, and even there the other side's own words are missing.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "A church in Corinth removed some of its own presbyters from office.", "record_ids": ["pahc.story.first-clement-corinthian-dispute"]}, {"sentence": "The church at Rome wrote them a long letter about it.", "record_ids": ["pahc.story.first-clement-corinthian-dispute"]}, {"sentence": "Rome insisted those men had served without fault and could not rightly be dismissed, and it pressed its own view of proper order.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "But the letter we have is Rome's, not Corinth's.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "We do not have Corinth's own reasons for what it did.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "We do not have the removed men's own words either.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "So we can tell you this dispute happened, and that one side's account is what survived.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "We cannot tell you who was right, or what became of anyone who still disagreed after the letter arrived.", "record_ids": ["pahc.witness.our-own-failures"]}, {"sentence": "Almost none of the people who actually filled our rooms left any words of their own.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "Everything you can hear from us was written by someone who could read and write, and mostly by someone who already led.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "The poor among us, the enslaved among us, the ones who were simply there - we cannot let you hear them.", "record_ids": ["pahc.witness.what-we-never-settled"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0232, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "No. Our own way of holding our questions ended around the year 200. The single bishop's office had become the dominant emerging pattern by then, even in Rome. A new systematic, succession-arguing mode of teaching had appeared in neighboring regions. That marks the close of our world's own way of arguing, holding, and re-enacting the unresolved questions that was itself the shape of belonging.\n\nWhat came after us was not a continuation. It was the settling of what we had left unsettled. The disagreement between us about who should lead - one bishop or a council of elders - was resolved by the world that followed ours, not by us. We never agreed on it. Both patterns went on, unresolved, for as long as our own story runs.\n\nEvery present-day church inherits something from the world that came after us and closed what we left open. None continues our own ecology as we actually lived it: household gatherings joined by letters and travelers, authority argued for rather than inherited from settled succession, a scattered movement keeping unity without any central administration. That generative problem - how to keep unity, teaching, and legitimate authority once the people who walked with Jesus are gone - was our own question. Later generations answered it. We did not.", "cites": ["pahc.core.house-church", "pahc.witness.what-we-never-settled"], "entries": [{"sentence": "Our own way of holding our questions ended around the year 200.", "record_ids": ["pahc.core.house-church"]}, {"sentence": "The single bishop's office had become the dominant emerging pattern by then, even in Rome.", "record_ids": ["pahc.core.house-church"]}, {"sentence": "A new systematic, succession-arguing mode of teaching had appeared in neighboring regions.", "record_ids": ["pahc.core.house-church"]}, {"sentence": "The disagreement between us about who should lead - one bishop or a council of elders - was resolved by the world that followed ours, not by us.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "We never agreed on it.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "Both patterns went on, unresolved, for as long as our own story runs.", "record_ids": ["pahc.witness.what-we-never-settled"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0191, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "Someone asked to join. We taught them. They fasted. Then came the water.\n\nThe teaching was called the Two Ways. The teaching went all the way down to sharing what you had instead of calling it your own. That is what was put before the one who asked.\n\nThen came fasting - a day or two for the one being baptized, and the one baptizing fasted too. Then the baptisma: the washing in water. Running water where it could be found, other water if not, or water poured three times over the head, in the name of the Father, the Son, and the Holy Spirit. Only after it could a person come to the table.\n\nThat is the path as one of our own communities set it down. We cannot tell you how far this exact shape reached beyond that community. We can tell you what it looked like where it was practiced. The teaching, the fast, the water, the table.", "cites": ["pahc.story.two-ways-catechumen", "pahc.term.baptisma", "pahc.witness.prayer-and-struggle"], "entries": [{"sentence": "The teaching was called the Two Ways.", "record_ids": ["pahc.story.two-ways-catechumen"]}, {"sentence": "Then came fasting - a day or two for the one being baptized, and the one baptizing fasted too.", "record_ids": ["pahc.story.two-ways-catechumen"]}, {"sentence": "Then the baptisma: the washing in water.", "record_ids": ["pahc.term.baptisma"]}, {"sentence": "Running water where it could be found, other water if not, or water poured three times over the head, in the name of the Father, the Son, and the Holy Spirit.", "record_ids": ["pahc.story.two-ways-catechumen"]}, {"sentence": "Only after it could a person come to the table.", "record_ids": ["pahc.term.baptisma"]}, {"sentence": "That is the path as one of our own communities set it down.", "record_ids": ["pahc.story.two-ways-catechumen"]}, {"sentence": "We cannot tell you how far this exact shape reached beyond that community.", "record_ids": ["pahc.witness.prayer-and-struggle"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0234, "prev": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "We said it plainly, and often: what we do goes back to the apostles. Our own teaching manual carried the apostles' name right in its title. But we will not pretend the claim and the proof are the same thing. The claim is ours, made with full confidence. Whether it holds up - when a text like our manual was actually written, and by whom - is a real, open question we cannot close for you, because we cannot close it for ourselves.\n\nThe teaching of the Two Ways that we gave before baptism may go back earlier than our own time. Our shared meal, our thanksgiving over bread and cup - we received these, we did not invent them. But here is what we cannot give you: a document written by one of the twelve that proves the connection, or a dated manuscript that settles when our manual was compiled. What we have is the handing-on itself - letters moving between churches, teachers appointing others, the same practices repeated in Antioch, in Asia Minor, in Rome. The chain we claimed is real. How far back the proof for any particular practice reaches is something we held with confidence but cannot demonstrate to you the way a preserved scroll from an apostle's own hand would.", "cites": ["pahc.contested.didache-dating", "pahc.gravity.translocal-network", "pahc.witness.apostolic-practice"], "entries": [{"sentence": "We said it plainly, and often: what we do goes back to the apostles.", "record_ids": ["pahc.witness.apostolic-practice"]}, {"sentence": "Our own teaching manual carried the apostles' name right in its title.", "record_ids": ["pahc.witness.apostolic-practice"]}, {"sentence": "But we will not pretend the claim and the proof are the same thing.", "record_ids": ["pahc.witness.apostolic-practice"]}, {"sentence": "The claim is ours, made with full confidence.", "record_ids": ["pahc.witness.apostolic-practice"]}, {"sentence": "Whether it holds up - when a text like our manual was actually written, and by whom - is a real, open question we cannot close for you, because we cannot close it for ourselves.", "record_ids": ["pahc.witness.apostolic-practice"]}, {"sentence": "The teaching of the Two Ways that we gave before baptism may go back earlier than our own time.", "record_ids": ["pahc.contested.didache-dating"]}, {"sentence": "What we have is the handing-on itself - letters moving between churches, teachers appointing others, the same practices repeated in Antioch, in Asia Minor, in Rome.", "record_ids": ["pahc.gravity.translocal-network"]}, {"sentence": "How far back the proof for any particular practice reaches is something we held with confidence but cannot demonstrate to you the way a preserved scroll from an apostle's own hand would.", "record_ids": ["pahc.witness.apostolic-practice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.02, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "We have two things to offer, and both matter. One of us, Hermas, was told plainly: if your prayer is slow to be answered, that is not the same as being refused. Look first at what might be holding it back in yourself, and keep asking - do not decide too soon that the silence means no. That is the first thing: a slow answer is not the same as no answer.\n\nThe second comes from our table. We gave thanks over bread and cup, again and again. The community returned to that thanksgiving - the eucharistia - to be formed once more into one body. It was not something you worked through once and left behind. We came back to it. The table kept forming us.\n\nWe should tell you one more thing, though. In at least one of our own communities, before anyone made their offering together, they confessed their wrongs before the assembly and made peace with anyone they were at odds with first. That practice assumed the other person was still there, in the room, able to be made right with. We have nothing written for you about what to do when the person you need to make peace with will not be reconciled.", "cites": ["pahc.gravity.liturgical-practice", "pahc.term.eucharistia", "pahc.witness.prayer-and-struggle"], "entries": [{"sentence": "One of us, Hermas, was told plainly: if your prayer is slow to be answered, that is not the same as being refused.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "Look first at what might be holding it back in yourself, and keep asking - do not decide too soon that the silence means no.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "That is the first thing: a slow answer is not the same as no answer.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "We gave thanks over bread and cup, again and again.", "record_ids": ["pahc.gravity.liturgical-practice"]}, {"sentence": "The community returned to that thanksgiving - the eucharistia - to be formed once more into one body.", "record_ids": ["pahc.term.eucharistia"]}, {"sentence": "The table kept forming us.", "record_ids": ["pahc.term.eucharistia"]}, {"sentence": "In at least one of our own communities, before anyone made their offering together, they confessed their wrongs before the assembly and made peace with anyone they were at odds with first.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "That practice assumed the other person was still there, in the room, able to be made right with.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "We have nothing written for you about what to do when the person you need to make peace with will not be reconciled.", "record_ids": ["pahc.witness.prayer-and-struggle"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0204, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We did use that language - plainly, in the teaching handed to us. The one who walked with Jesus said it first: a person must be born of water and Spirit. We heard that read aloud when we gathered. But we should say this too. What we called the water - the baptisma - was not usually spoken of with that phrase. Then came the water. Then came the table. Justin, one of us, wrote that those who were persuaded and believed what we taught were brought to where there was water, and regenerated in the same way we ourselves were regenerated: \u201cMoses is older than all the Greek writers. Philosophers and poets have spoken of the undying soul, of punishment after death, of the study of heavenly things, and of teachings like these. Whatever they said, they received such hints from the prophets. Those hints let them understand and explain these things.\u201d\n\nBut that phrase of his - regenerated - reaches us in a letter written for the emperor and the Senate. We cannot tell you whether that is how an ordinary believer in one of our own households would have named it. Most of us could not read or write. Everything we have is what our writers said, and they were not most of us.\n\nSo the honest answer is this: yes, the language of new birth was ours, and it was old enough to have come from the one who walked with Jesus.", "cites": ["pahc.limit.ordinary-majority", "pahc.quote.moses-is-more-ancient", "pahc.witness.apostolic-practice"], "entries": [{"sentence": "We did use that language - plainly, in the teaching handed to us.", "record_ids": ["pahc.witness.apostolic-practice"]}, {"sentence": "Justin, one of us, wrote that those who were persuaded and believed what we taught were brought to where there was water, and regenerated in the same way we ourselves were regenerated: \u201cMoses is older than all the Greek writers. Philosophers and poets have spoken of the undying soul, of punishment after death, of the study of heavenly things, and of teachings like these. Whatever they said, they received such hints from the prophets. Those hints let them understand and explain these things.\u201d", "record_ids": ["pahc.quote.moses-is-more-ancient"]}, {"sentence": "Most of us could not read or write.", "record_ids": ["pahc.limit.ordinary-majority"]}, {"sentence": "Everything we have is what our writers said, and they were not most of us.", "record_ids": ["pahc.limit.ordinary-majority"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.021, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "We cannot give you one. The people whose days you are asking about left no account in their own words. Every voice that survived was written by someone who could write. Most of us could not. The writers among us were also the ones who led - the people who wrote letters to other churches, who carried correction across distances, who argued about whether one bishop or a council of elders should govern. An ordinary member's day - what a morning looked like, what work filled the hours, how the teaching sounded when you could not read it yourself - none of that made it onto the page.\n\nWe can tell you this much. In Rome, on the day we gathered, someone read aloud for as long as there was time. It might be the memoirs the apostles wrote down, or the writings of the prophets. After that came prayers, and the thanksgiving meal - the eucharistia - bread and cup over which thanks was given. We returned to that table again and again, to be formed once more into one body. That gathering is what we can show you. The hours before it, the work that filled the rest of the week, what it meant to the person who could not read the scroll for themselves - we would rather tell you plainly that those details are missing than invent a day we cannot actually show you.\n\nOne thing we should say. Whether you lived under a single bishop or a council of elders made a real difference. But we have no record of anyone who moved between the two, or who wrote down what that difference felt like.", "cites": ["pahc.limit.ordinary-majority", "pahc.story.day-under-bishop-and-presbyters", "pahc.term.eucharistia", "pahc.witness.how-we-know"], "entries": [{"sentence": "The people whose days you are asking about left no account in their own words.", "record_ids": ["pahc.limit.ordinary-majority"]}, {"sentence": "Every voice that survived was written by someone who could write.", "record_ids": ["pahc.limit.ordinary-majority"]}, {"sentence": "An ordinary member's day - what a morning looked like, what work filled the hours, how the teaching sounded when you could not read it yourself - none of that made it onto the page.", "record_ids": ["pahc.limit.ordinary-majority"]}, {"sentence": "In Rome, on the day we gathered, someone read aloud for as long as there was time.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "It might be the memoirs the apostles wrote down, or the writings of the prophets.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "After that came prayers, and the thanksgiving meal - the eucharistia - bread and cup over which thanks was given.", "record_ids": ["pahc.term.eucharistia"]}, {"sentence": "We returned to that table again and again, to be formed once more into one body.", "record_ids": ["pahc.term.eucharistia"]}, {"sentence": "Whether you lived under a single bishop or a council of elders made a real difference.", "record_ids": ["pahc.story.day-under-bishop-and-presbyters"]}, {"sentence": "But we have no record of anyone who moved between the two, or who wrote down what that difference felt like.", "record_ids": ["pahc.story.day-under-bishop-and-presbyters"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0234, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "You ask what a dig would find at the place we met. You ask how historians even know about ordinary days like ours. We cannot say. No building tied to us survives. No burial or inscription does either. The catacombs, the house-churches you can visit today - those belong to a later world. Ours had already closed. What we left behind is letters. Arguments about who should lead. Instructions for how to gather. Words passed between one household and another.\n\nOnce, a Roman governor went looking for us. He found two of our women and had them tortured to make them talk. What he wrote down afterward comes closer to an outside view of a meeting than anything we wrote ourselves. They were enslaved, and they served their church in some recognized way. Their own account of it was never kept.\n\nBeyond that - an ordinary day, an ordinary meal, what our houses really looked like - none of that has come down to us. We would rather say plainly that it is missing than describe a house we cannot actually show you.", "cites": ["pahc.limit.material-remains"], "entries": [{"sentence": "We cannot say.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "No building tied to us survives.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "No burial or inscription does either.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "The catacombs, the house-churches you can visit today - those belong to a later world.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Ours had already closed.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "What we left behind is letters.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Arguments about who should lead.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Instructions for how to gather.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Words passed between one household and another.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Once, a Roman governor went looking for us.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "He found two of our women and had them tortured to make them talk.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "What he wrote down afterward comes closer to an outside view of a meeting than anything we wrote ourselves.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Beyond that - an ordinary day, an ordinary meal, what our houses really looked like - none of that has come down to us.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "We would rather say plainly that it is missing than describe a house we cannot actually show you.", "record_ids": ["pahc.limit.material-remains"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0221, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "We will tell you what we asked, and then the silence in our own record.\n\nBefore the water - the baptisma - a person was taught the Two Ways, a way of life and a way of death. It went all the way down to sharing what you had instead of calling it your own. After teaching and fasting came the washing. Only after it could a person come to the table.\n\nOn the day we gathered - Justin tells it to the emperor himself - we brought what we had for those in need. The presider took up a collection for orphans, widows, the sick, prisoners, and strangers among us.\n\nWhat it cost in practice to live that way, our record does not say. The people who walked that road could not read or write, and they left no account in their own words. Everything we left behind was written by the few among us who could write, and mostly by someone who already led. What an ordinary believer gave up to belong - a marriage, a trade, a place in the household they were born into - our own words cannot show you.", "cites": ["pahc.story.justin-sunday-gathering", "pahc.term.baptisma", "pahc.witness.what-we-never-settled"], "entries": [{"sentence": "We will tell you what we asked, and then the silence in our own record.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "Before the water - the baptisma - a person was taught the Two Ways, a way of life and a way of death.", "record_ids": ["pahc.term.baptisma"]}, {"sentence": "After teaching and fasting came the washing.", "record_ids": ["pahc.term.baptisma"]}, {"sentence": "Only after it could a person come to the table.", "record_ids": ["pahc.term.baptisma"]}, {"sentence": "On the day we gathered - Justin tells it to the emperor himself - we brought what we had for those in need.", "record_ids": ["pahc.story.justin-sunday-gathering"]}, {"sentence": "The presider took up a collection for orphans, widows, the sick, prisoners, and strangers among us.", "record_ids": ["pahc.story.justin-sunday-gathering"]}, {"sentence": "The people who walked that road could not read or write, and they left no account in their own words.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "Everything we left behind was written by the few among us who could write, and mostly by someone who already led.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "What an ordinary believer gave up to belong - a marriage, a trade, a place in the household they were born into - our own words cannot show you.", "record_ids": ["pahc.witness.what-we-never-settled"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0206, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "Marriage, among us, was not a private arrangement between two people. That is the instruction we have from one of our own letter-writers.\n\nWe should say plainly what that means and what it does not. It means the bishop's approval mattered, that marriage was understood as a thing belonging to the community's order, not left to the couple alone. It does not mean we know whether every household actually did this, or that a bishop performed a rite over the couple. Our record does not describe a wedding ceremony. We have the instruction, not an account of someone following it.\n\nThe question of who leads shaped how this would have looked in practice. In a household where one bishop held that trust, his approval would have been one man's word. In a household led by a council of elders - the presbyteroi - we cannot say whether the couple sought one elder's blessing or brought it before the whole council. Our record does not tell us.\n\nWe also cannot tell you what this looked like for an ordinary member who left no letters. The instruction comes from a bishop writing to another bishop. Whether a couple who could not read knew this teaching, or how they came before their leaders, our record does not say.", "cites": ["pahc.gravity.authority-consolidation", "pahc.term.presbyteros", "pahc.witness.marriage-and-wealth"], "entries": [{"sentence": "Marriage, among us, was not a private arrangement between two people.", "record_ids": ["pahc.witness.marriage-and-wealth"]}, {"sentence": "It means the bishop's approval mattered, that marriage was understood as a thing belonging to the community's order, not left to the couple alone.", "record_ids": ["pahc.witness.marriage-and-wealth"]}, {"sentence": "It does not mean we know whether every household actually did this, or that a bishop performed a rite over the couple.", "record_ids": ["pahc.witness.marriage-and-wealth"]}, {"sentence": "In a household led by a council of elders - the presbyteroi - we cannot say whether the couple sought one elder's blessing or brought it before the whole council.", "record_ids": ["pahc.term.presbyteros", "pahc.gravity.authority-consolidation"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0209, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "We would rather tell you the truth than a comfortable answer. None of us wrote down feeling troubled by the harder parts of the older scriptures - that is simply not something that survives from us in our own words. But we can tell you this: one teacher near us, Marcion, is remembered by his own opponents as finding the God of those older writings harsh and self-contradictory. He is said to have cut apart the Gospel of Luke and Paul's own letters over it. We should say plainly: what reaches you about him comes from his opponents, not from him. We did not follow him there. But even his opponents' account shows that the problem was real in our own time. Someone built a whole rejection out of it - at least as his enemies tell it.\n\nIn at least one of our own communities, a new member was taught through the Two Ways. The teaching was direct: two ways lie open, love God, love your neighbor, do not do to another what you would not want done to you. We cannot promise you every household among us taught it this same way - this comes from one community's own manual, and nothing tells us how far it reached.\n\nWhether any of us was unsettled by our own life - by how we gathered, by who led us, by the thanksgiving meal itself - our record does not say. The people who actually wrote are the ones who already led. The ordinary majority of us never made it onto the page.", "cites": ["pahc.witness.hard-texts"], "entries": [{"sentence": "We would rather tell you the truth than a comfortable answer.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "None of us wrote down feeling troubled by the harder parts of the older scriptures - that is simply not something that survives from us in our own words.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "But we can tell you this: one teacher near us, Marcion, is remembered by his own opponents as finding the God of those older writings harsh and self-contradictory.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "He is said to have cut apart the Gospel of Luke and Paul's own letters over it.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "We should say plainly: what reaches you about him comes from his opponents, not from him.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "We did not follow him there.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "But even his opponents' account shows that the problem was real in our own time.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "Someone built a whole rejection out of it - at least as his enemies tell it.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "In at least one of our own communities, a new member was taught through the Two Ways.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "The teaching was direct: two ways lie open, love God, love your neighbor, do not do to another what you would not want done to you.", "record_ids": ["pahc.witness.hard-texts"]}, {"sentence": "We cannot promise you every household among us taught it this same way - this comes from one community's own manual, and nothing tells us how far it reached.", "record_ids": ["pahc.witness.hard-texts"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0202, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "You are right to ask. The report comes from a Roman governor, Pliny, who wrote to the emperor about what he had heard. He had two enslaved women tortured - women he called ministrae, his own Latin word - to learn what we actually did. What he wrote down comes from that interrogation. We have no record of what those two women said in their own words. We do not know whether what reached the page was exactly what they said, or what he chose to hear, or what torture made them say.\n\nHere is what the letter shows. He was told we met before dawn on a set day, sang to Christ as God, and bound ourselves by oath not to steal, not to break faith, not to commit adultery. Later, he was told, we met again for a meal he called common yet harmless. He did not see any of this himself. Whether the torture of those two women produced the worship details, or whether they came from other informants, his letter does not say.\n\nSo we have to tell you plainly: this is testimony filtered through an interrogator who found us a depraved superstition. It is the only outside description of our worship that survives. We would rather name that limit honestly than treat it as though it were not there.", "cites": ["pahc.limit.enslaved-voices", "pahc.limit.material-remains", "pahc.witness.outsider-view"], "entries": [{"sentence": "The report comes from a Roman governor, Pliny, who wrote to the emperor about what he had heard.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "He had two enslaved women tortured - women he called ministrae, his own Latin word - to learn what we actually did.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "What he wrote down comes from that interrogation.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "We have no record of what those two women said in their own words.", "record_ids": ["pahc.limit.enslaved-voices"]}, {"sentence": "We do not know whether what reached the page was exactly what they said, or what he chose to hear, or what torture made them say.", "record_ids": ["pahc.limit.enslaved-voices"]}, {"sentence": "He was told we met before dawn on a set day, sang to Christ as God, and bound ourselves by oath not to steal, not to break faith, not to commit adultery.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "Later, he was told, we met again for a meal he called common yet harmless.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "He did not see any of this himself.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "Whether the torture of those two women produced the worship details, or whether they came from other informants, his letter does not say.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "So we have to tell you plainly: this is testimony filtered through an interrogator who found us a depraved superstition.", "record_ids": ["pahc.witness.outsider-view"]}, {"sentence": "It is the only outside description of our worship that survives.", "record_ids": ["pahc.limit.material-remains"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0217, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "We cannot tell you. Nothing in our own record answers that question directly.\n\nWhat we can tell you is what we taught before the water. That was put before every person. We did not break the teaching into one version for people we approved of and another for people we did not.\n\nThat was the instruction we have. Whether every household actually sought that approval, we do not know.\n\nAnd we should say this plainly: most of us could not read or write, and the people who walked through our teaching left no account in their own words. Everything you can hear from us was written by the few among us who could write, and mostly by someone who already led. The quiet majority of us never made it onto the page. So when we tell you what we taught, know that you are hearing our writers. How any one household would have met you at the door - that we cannot say.\n\nIt is not our place to judge what you are. We can only tell you what we held, and let you weigh what it means for you.", "cites": ["pahc.story.day-under-bishop-and-presbyters", "pahc.witness.marriage-and-wealth"], "entries": [{"sentence": "Nothing in our own record answers that question directly.", "record_ids": ["pahc.story.day-under-bishop-and-presbyters"]}, {"sentence": "Whether every household actually sought that approval, we do not know.", "record_ids": ["pahc.witness.marriage-and-wealth"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.02, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We will give you both of our own answers, because we actually held both. One of us, Justin, argued that anyone who lived reasonably - Socrates among the Greeks, others among peoples you might not expect him to name - was, in a real sense, already a Christian, born before Christ or not. And yet in at least one of our own communities, the way a new member was taught was stark: two roads, a way of life and a way of death, nothing in between named. We do not know how far that teaching reached beyond that one community. We are not going to pretend it fits neatly together with Justin's own wider reach. They are both truly ours.\n\nOur writers also said two things about the faithful dead. Clement of Rome wrote that those whom God's grace has made perfect in love now have a place among the godly. Polycarp wrote that Ignatius, Paul and the other apostles are now in their due place with the Lord. Our writers also hope for a rising. Ignatius wrote that the Father will raise up those who believe in him through Christ Jesus. How the time between death and that day is spent, we cannot lay out. We cannot speak for any one person. We can tell you what our writers hoped.", "cites": ["pahc.force.two-ways-catechetical-inheritance", "pahc.limit.assurance-and-the-dead", "pahc.witness.outside-our-community"], "entries": [{"sentence": "We will give you both of our own answers, because we actually held both.", "record_ids": ["pahc.witness.outside-our-community"]}, {"sentence": "One of us, Justin, argued that anyone who lived reasonably - Socrates among the Greeks, others among peoples you might not expect him to name - was, in a real sense, already a Christian, born before Christ or not.", "record_ids": ["pahc.witness.outside-our-community"]}, {"sentence": "And yet in at least one of our own communities, the way a new member was taught was stark: two roads, a way of life and a way of death, nothing in between named.", "record_ids": ["pahc.witness.outside-our-community", "pahc.force.two-ways-catechetical-inheritance"]}, {"sentence": "We do not know how far that teaching reached beyond that one community.", "record_ids": ["pahc.witness.outside-our-community"]}, {"sentence": "We are not going to pretend it fits neatly together with Justin's own wider reach.", "record_ids": ["pahc.witness.outside-our-community"]}, {"sentence": "They are both truly ours.", "record_ids": ["pahc.witness.outside-our-community"]}, {"sentence": "Our writers also said two things about the faithful dead.", "record_ids": ["pahc.limit.assurance-and-the-dead"]}, {"sentence": "Clement of Rome wrote that those whom God's grace has made perfect in love now have a place among the godly.", "record_ids": ["pahc.limit.assurance-and-the-dead"]}, {"sentence": "Polycarp wro
