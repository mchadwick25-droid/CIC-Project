<script>
var D = {"cap": 12.0, "spent": 0.3547, "running": "lpc", "done": 0, "worlds": [{"key": "lpc", "status": "running", "attempts": 1, "spent": 0.35474, "passed": null, "size": 28, "answered": 9, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "To us Jesus is the shepherd whose flock this was before it was ever ours to keep. He is the one who will ask us what became of the people placed in our care. Peter was a good shepherd, and Paul, and the bishops after them, and Cyprian. Yet to good shepherds he commended one good Shepherd.\n\nHis death and rising are not facts we simply affirm and set aside. His crucifixion, burial, rising on the third day, ascension, and sitting at the Father's right hand were ordered deliberately. The life we lead here was modelled on them, not only mystically, but in reality. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising in us. We set our affection on what is above, our life hidden with him in God. That is his ascension and his sitting at God's right hand, worked out in an ordinary life.\n\nWe confess Jesus Christ, the only Son of God, our Lord. Then we go on to confess the Holy Ghost as well. That completes the Trinity that makes up the one Godhead.", "cites": ["lpc.demo.who-is-jesus-to-us", "lpc.witness.the-only-son-and-the-trinity", "lpc.witness.the-pattern-we-are-modelled-on"], "entries": [], "passed": null, "checks": [], "cost": 0.1219, "prev": {"a": "To us Jesus is the shepherd whose flock this was before it was ever ours to keep. He is the one who will ask us what became of the people placed in our care. Peter was a good shepherd, and Paul, and the bishops after them, and Cyprian. Yet to good shepherds he commended one good Shepherd. That is who he is to us.\n\nHis death and rising are not facts we simply affirm and set aside. His crucifixion, burial, rising on the third day, ascension, and sitting at the Father's right hand were ordered deliberately. The life we lead here was modelled on them, not only mystically, but in reality. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising in us. We set our affection on what is above, our life hidden with him in God. That is his ascension and his sitting at God's right hand, worked out in an ordinary life.\n\nWe confess Jesus Christ, the only Son of God, our Lord. Then we go on to confess the Holy Ghost as well. That completes the Trinity that makes up the one Godhead. Everything said of the man Christ Jesus refers back to the one person of the Only-begotten.", "cites": ["lpc.core.latin-pastoral-congregational-christianity", "lpc.witness.the-only-son-and-the-trinity", "lpc.witness.the-pattern-we-are-modelled-on"]}}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "We confess Jesus Christ, the only Son of God, our Lord, within the one Godhead made up of Father, Son, and Holy Ghost. Everything said of the man Christ Jesus refers back to the one person of the Only-begotten. That confession reached us in two ways, not equally: through the apostles' own writings, and through the living voice of the church passing it forward.\n\nScripture stood above everything our bishops wrote, and we held it that way. About what it contains there can be no doubt or argument. That is the first path. The apostles wrote down what they had seen, and their writings reached us.\n\nThe second path is traced differently, and more carefully. Had anyone among us known someone who saw him? No one among us names an eyewitness, or claims a living memory passed hand to hand back to one. That much we cannot give you. But Augustine pointed to the world itself. Obscure, unlearned men persuaded the whole world of something incredible, by testifying in writing that they had seen it themselves. We reason from their testimony, transmitted to us, even though none of us knew any of them.\n\nOur bishops' office was traced back to the apostles by name. Augustine did it most directly. A Donatist presbyter had claimed an episcopal succession for his own side. Augustine answered with the real one. He counted back from the present bishop of Rome, Anastasius, through Siricius, Damasus, Liberius, and on down the list. He reached Linus, Peter's own successor. Cyprian wrote a century and a half earlier. He did not draw up a name list of his own. He stated a principle instead. From Peter onward, the ordering of bishops through the changes of times and successions carries the Church itself forward.\n\nTwo of our practices Augustine traced to the apostles by the same reasoning. He would not rebaptize someone already baptized among heretics. That custom, he said, no one could find to have been invented by a later age. It was rightly believed to have been handed down from the apostles. He said the same of baptizing infants. Neither claim rests on a written text from an apostle's own hand. Both rest on the same reasoning. A custom this old and this universal, with no other explanation for its origin, is rightly believed to have come from the apostles.\n\nWe do not agree among ourselves on one test for whether a practice of ours truly came from the apostles. Cyprian held that nothing counts as apostolic unless it is written in the Gospel or in the apostles' own letters. Custom alone, however old, is not enough. Augustine used a different test. A custom kept everywhere in the Church may fairly be presumed apostolic, even where no apostle's own writing says so. We give you both tests, because both are ours.", "cites": ["lpc.limit.no-chain-of-witnesses", "lpc.witness.apostolic-succession-of-bishops", "lpc.witness.baptism-traced-to-the-apostles", "lpc.witness.scripture-above-councils", "lpc.witness.the-only-son-and-the-trinity", "lpc.witness.tradition-tested-by-apostolic-warrant"], "entries": [], "passed": null, "checks": [], "cost": 0.0382, "prev": {"a": "We held the writings that came down to us as what the apostles left behind -- the four Gospels, Paul's letters, and the other writings we received as apostolic. How those writings reached us, by what route and through whose hands, we do not say in detail the way we trace the line of bishops. Augustine named the succession of Roman bishops from Peter through Linus down to Anastasius, who sat in his own time. He said Peter's own seat at Rome and James's at Jerusalem were still filled by living bishops. That is the chain of office, not the chain of texts.\n\nFor the texts themselves, we do not name copyists or trace manuscripts. We argue instead from what the writings say and from the fact that obscure, unlearned men persuaded the world of something incredible by testifying they had seen it. Augustine pointed to the world itself: that testimony, transmitted in writing to us, is what we reason from. None of us knew any of them.\n\nWe also hold that some of what the apostles gave us was never written down at all. Augustine traced two practices to the apostles that no apostle's own writing gives: that we do not rebaptize someone already baptized among heretics, and that we baptize infants. Both rest on the same reasoning: a custom this old and this universal, with no other explanation for its beginning, is rightly believed to come from the apostles.", "cites": ["lpc.limit.no-chain-of-witnesses", "lpc.witness.apostolic-succession-of-bishops", "lpc.witness.baptism-traced-to-the-apostles"]}}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": "You want to believe and cannot. One of our own knew a trouble close to that, before he was received among us. Years later he wrote it down himself. Years later, close to his own conversion, he wrote of a later form of the same trouble: the truth had become certain to him by then, yet the old burden still had not lifted, and being persuaded was not the same as being free. We do not tell you that struggle away, or promise you it resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nThat restlessness is not a failure on your part. It is what we are made for.", "cites": ["lpc.witness.grant-me-chastity-but-not-yet", "lpc.witness.restless-heart-and-the-unrepentant-enemy"], "entries": [], "passed": null, "checks": [], "cost": 0.0261, "prev": {"a": "You want to believe and cannot. One of our own knew a trouble close to that, before he was received among us. Years later he wrote it down himself. Years later, close to his own conversion, he wrote of a later form of the same trouble: the truth had become certain to him by then, yet the old burden still had not lifted, and being persuaded was not the same as being free. We do not tell you that struggle away, or promise you it resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nIt is the human condition he named, and he named it from inside it.", "cites": ["lpc.witness.grant-me-chastity-but-not-yet"]}}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We confess Jesus Christ, the only Son of God, our Lord. That confession does not stand alone. We go on to confess the Holy Ghost as well. That completes the Trinity that makes up the one Godhead. Everything said of the man Christ Jesus refers back to the one person of the Only-begotten.\n\nIn our creed, the Church comes after the Trinity, as a house belongs to the one who lives in it. This confession did not go unchallenged. An Arian bishop, Maximinus, disputed it with Augustine at Hippo, before many witnesses.\n\nThis is not doctrine we hold at a distance from ourselves. His death and rising are not facts we simply affirm and set aside. His crucifixion, burial, rising on the third day, ascension, and sitting at the Father's right hand were ordered deliberately. The life we lead here was modelled on them, not only mystically, but in reality. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising in us. We set our affection on what is above, our life hidden with him in God. That is his ascension and his sitting at God's right hand, worked out in an ordinary life.", "cites": ["lpc.witness.the-only-son-and-the-trinity", "lpc.witness.the-pattern-we-are-modelled-on"], "entries": [], "passed": null, "checks": [], "cost": 0.0283, "prev": {"a": "We confess Jesus Christ, the only Son of God, our Lord. Then we go on to confess the Holy Ghost as well. That completes the Trinity that makes up the one Godhead. Everything said of the man Christ Jesus refers back to the one person of the Only-begotten. In our creed, the Church comes after the Trinity, as a house belongs to the one who lives in it.\n\nThis confession did not go unchallenged. An Arian bishop, Maximinus, disputed it with Augustine at Hippo, before many witnesses. So we confessed it knowing some would not hold it.\n\nHis death and rising are not facts we simply affirm and set aside. His crucifixion, burial, rising on the third day, ascension, and sitting at the Father's right hand were ordered deliberately. The life we lead here was modelled on them, not only mystically, but in reality. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising in us. We set our affection on what is above, our life hidden with him in God. That is his ascension and his sitting at God's right hand, worked out in an ordinary life.", "cites": ["lpc.witness.the-only-son-and-the-trinity", "lpc.witness.the-pattern-we-are-modelled-on"]}}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "We understand God as the one who holds everything together, not by pretending our failures do not exist, but by making a road back through them. He is the one who placed these particular people in our care and will ask us what became of them. That is not an abstraction to us. It is the fact our whole office stands on.\n\nGod's mercy, we taught, is not a refusal to judge. It is the making of a road where there was none. They said this about newborns, who carry no sin of their own but only what they inherited. Augustine taught the same from Paul's own words. Paul asked God three times to take away a thorn in his flesh. God did not take it away. Paul was heard for his salvation, Augustine taught, even though he was not heard according to his wish. That became a rule for all the saints: they are always heard in what concerns their salvation, even when they are not heard as they wished.\n\nWhat God gives is never ours to claim as though we earned it. Augustine taught that no one has the love of God from himself: \u201cIndeed, he had said, \u2018The love of God has been poured out in our hearts.\u2019 Then he added at once, \u2018through the Holy Spirit, who has been given to us.\u2019 He did this so that no one would think his love for God came from himself. So if you are to love God, let God live in you and love Himself through you. That is, let Him move you to His love. Let Him kindle you, give you light and stir you up.\u201d\n\nWhatever good a person does was given to them before they did it. That is what we mean by grace: no effort of ours is enough on its own.\n\nAnd God judges. He did not flinch from what was coming. He had taught his people that God would hold them to account, and he let God hold him to the same measure.", "cites": ["lpc.quote.no-one-has-the-love-of-god-from-himself", "lpc.term.grace", "lpc.witness.heard-for-salvation-not-for-wish", "lpc.witness.infants-and-the-sin-of-another"], "entries": [], "passed": null, "checks": [], "cost": 0.0273, "prev": {"a": "We understand God as the one who places people in our care and will ask us what we did with them. That is not an abstraction. It shapes what we actually do, day by day, with the ones in front of us.\n\nGod's judgment made Cyprian our bishop, alongside the people's choice. When Augustine became a bishop, he refused at first \u2014 it was not done to make a man bishop while his own bishop still lived. Then examples persuaded him, and he gave way, compelled and constrained. Both times, God's judgment worked through what the people demanded, not around it.\n\nGod's mercy is real, and it reaches further than we do. We taught that it is not to be refused to anyone born of man. That is why we would not make a newborn wait for the font. Sixty-six of us met in council and wrote to Fidus, who had thought a child should wait until the eighth day. No one agreed.\n\nAnd God's grace is not ours to produce or to claim. Augustine taught it from Paul's own words: \u201cIndeed, he had said, \u2018The love of God has been poured out in our hearts.\u2019 Then he added at once, \u2018through the Holy Spirit, who has been given to us.\u2019 He did this so that no one would think his love for God came from himself. So if you are to love God, let God live in you and love Himself through you. That is, let Him move you to His love. Let Him kindle you, give you light and stir you up.\u201d\n\nAny good we do was given to us before we did it. That refusal stands at the center of how Augustine answered the Pelagians. Whether Pelagius himself held what Augustine said he held, we cannot say from our own record.\n\nGod hears, but not always as we ask. Augustine taught this from Paul's thorn in the flesh. Paul asked three times for it to be taken away. God did not take it away. He answered instead that his grace was sufficient, and strength is made perfect in weakness. Paul was heard for his salvation, though not according to his wish. Augustine made that a rule for the saints, not for Paul alone. They are always heard in what concerns their salvation, even when they are not heard as they wished.\n\nGod receives genuine repentance, but repentance is not a feeling declared in private. It is a road walked in the open, under a bishop who will answer for whether it was walked. That road takes time, and the order matters, and everyone can see it.\n\nGod holds us while we fail him. Augustine taught that even good Christians must repent before death, and he did it himself. Possidius tells us that in his last illness, Augustine had the psalms of penance copied and hung on the wall beside his bed, and he wept over them.\n\nThat is how one of our own met God's will when it came for him.\n\nWe do not carry the voices of our own women on these questions, not in their own words. Women appear throughout our record, but almost always in someone else's. Numidicus's wife burned beside him. His daughter searched for his body and found him alive. In our later years there were women at Hippo, and a woman named Albina, but we know them only through a bishop's letter to them and about them. No writing by a woman of our own survives.", "cites": ["lpc.contested.grace-pelagius-characterization", "lpc.force.congregational-acclamation-overriding-preference", "lpc.gravity.grace-and-human-incapacity", "lpc.limit.womens-own-voice", "lpc.quote.no-one-has-the-love-of-god-from-himself", "lpc.story.election-of-cyprian", "lpc.story.numidicus", "lpc.story.the-psalms-on-the-wall", "lpc.term.grace", "lpc.term.reconciliation-penitential-discipline", "lpc.witness.heard-for-salvation-not-for-wish", "lpc.witness.infants-and-the-sin-of-another"]}}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "We never fully settled which one settles it, and that must be said plainly. Cyprian opened the council of 256 with a rule he would not break. A century and a half later, Augustine held a different view. A small council yields to a wider one, he wrote.\n\nThese are real differences, and we do not resolve them. What we can say is this. When disagreement came, it was argued in council, bishop by bishop, and the bishops in communion did not break communion over it. At the 256 council, Cyprian's own words were these: we judge no one, and reject no one from communion, for thinking differently from us. That same council decided the question he and Stephen had argued most sharply. Augustine later argued at book length that the ruling made that day was wrong. He never once put Cyprian outside our communion.\n\nSo the process we can point to is this: councils met, bishops argued, each gave his judgment, and the bond held through the disagreement. Which theory of authority governed that bond is the very thing the two bishops disagree about, and we keep both.", "cites": ["lpc.gravity.collegial-communion-preserved", "lpc.gravity.conciliar-authority-theory", "lpc.gravity.sacramental-ordination-validity", "lpc.term.plenary-council", "lpc.witness.communion-over-separation"], "entries": [], "passed": null, "checks": [], "cost": 0.025, "prev": {"a": "When our own bishops disagreed, sharply, on a matter of real weight, they did not always settle it. They stayed at the same table while the disagreement stood between them. What we can show you from our own record is what two bishops held, and how each one understood his own authority to hold it, not one ending in which the question closed for good.\n\nCyprian held one rule. He stated it at the opening of the council in 256, the council that would decide the hardest question in the room. Each bishop judges for himself, and only Christ judges him. At that same council, he said we judge no one and reject no one from communion for thinking differently from us.\n\nAugustine held a different rule. A small council yields to a wider one. Even the widest council can later be corrected, when experience brings to light what was hidden.\n\nThese are real differences in authority, and we do not pretend they are not. A century and a half later, Augustine argued at book length that the ruling made at Cyprian's council was wrong. He never once put the man who made it outside our communion. We answered the font question twice, by two of our own bishops, and the two answers are opposites. Cyprian held that nothing valid is given outside at all. Augustine held that something real is given even there, though it does the person no good until they come inside. Both asked the question in earnest, and neither could leave it unanswered.\n\nWhat the ground we have does not settle is whether one of these two rules became the ordinary practice of councils across the century between them. A conference was held in 411, the largest single gathering of argument between bishops that our own later years produced. We rest its date on the ordinary record. We do not draw on its own transcript of what was argued there, bishop by bishop. That transcript has not been validly read in building this record. So we cannot tell you how our own bishops, beyond Cyprian and Augustine, argued authority.", "cites": ["lpc.demo.font-twice-answered", "lpc.gravity.collegial-communion-preserved", "lpc.limit.411-gesta-unread", "lpc.term.bishop-of-bishops", "lpc.term.heresy", "lpc.term.plenary-council", "lpc.witness.apostolic-succession-of-bishops", "lpc.witness.communion-over-separation"]}}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "There was, and we knew that struggle from the inside. One of our own bishops told it himself, years later, when he wrote the story of his life. Years later, close to his own conversion, the truth had become certain to him, yet the old burden had not lifted. We do not promise you that struggle resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nHe told them their longing expectation was itself a prayer for him. That restlessness was not something we judged out of existence. It was something we named, plainly, as part of being formed.", "cites": ["lpc.witness.restless-heart-and-the-unrepentant-enemy"], "entries": [], "passed": null, "checks": [], "cost": 0.0221, "prev": {"a": "We knew that struggle from the inside. One of our own bishops carried it before he was received among us, and he wrote it down years later in his own hand. Later, close to his own conversion, he wrote of a later form of the same trouble. The truth had become certain to him by then, yet the old burden still had not lifted. Being persuaded was not the same as being free.\n\nWhat this means for you now, we cannot settle. We do not tell that struggle away, and we do not promise it resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nWe also knew the restless heart he named at the opening of that same account. It is the condition he named for what drives a person toward God at all.", "cites": ["lpc.witness.grant-me-chastity-but-not-yet"]}}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "We held that a newborn does not carry guilt for his own sins, since he has not yet done any. What he carries is something older. Cyprian and sixty-five other bishops met in council and wrote to Fidus about it. Augustine went on to the hard end of this. What the child carries is not his own doing. It is the old death's contagion, passed to him at birth.\n\nWe did not make a newborn wait. We brought them to the water as soon as we could.", "cites": ["lpc.witness.infants-and-the-sin-of-another"], "entries": [], "passed": null, "checks": [], "cost": 0.0279, "prev": {"a": "Yes, and we will not soften what our bishops taught. Cyprian and sixty-five colleagues met in council and wrote to a man named Fidus. He had thought a newborn should not be baptized before the eighth day. None agreed.. We brought infants to the water, and we did not make them wait.\n\nAugustine carried this to its hard end. He wrote that in baptism infants die only to original sin.. He called it the mildest punishment of all.\n\nThat is what they taught. Neither bishop tells us of any one child.", "cites": ["lpc.witness.infants-and-the-sin-of-another"]}}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read the Scriptures as what stands above every one of us.\n\nYet Scripture was not our only authority. We bishops and our councils held real authority of their own, over real disputes among us. Scripture stands first. What we teach and decide comes after it, judged by it.\n\nWhen we taught, we pointed people to what the text itself says. Augustine, preaching on the food that lasts, quoted the Lord directly: the work of God is to believe in the one he sent: \u201c\u2018Jesus answered and said to them, This is the work of God, that you believe in Him whom He has sent.\u2019 This, then, is to eat the food: not the food that perishes, but the food that lasts to eternal life. Why do you get your teeth and stomach ready? Believe, and you have eaten already.\u201d\n\nThe same voice that taught also warned.\n\nWe read Scripture to teach the people placed in our care, and we read it knowing it judges us first.", "cites": ["lpc.quote.believe-and-thou-hast-eaten-already", "lpc.witness.scripture-above-councils"], "entries": [], "passed": null, "checks": [], "cost": 0.0381, "prev": {"a": "We read Scripture together as those who are being formed by it, not merely informed. The scroll is opened in the congregation, and the bishop reads it to people who are there -- baptized believers and those still learning alike, all in the same room. What is read becomes a sermon. It is not a lecture on what the text meant when it was written, and it is not a performance. It is the man answerable for you telling you what he thinks you need to hear in it.\n\nScripture itself stands above every letter of a bishop and above every council. Augustine wrote that about what the canon contains, there can be no doubt or argument. A bishop's letter can be corrected, a council can be corrected by a later one, but Scripture cannot be corrected that way at all. Cyprian, a century and a half earlier, held something kindred. Custom without truth, he said, is only the old age of error. Truth is what we owe our obedience to.\n\nBut Scripture is not our only authority. Our bishops and councils held real authority over real disputes among us. The question is what Scripture itself teaches, and that question has to be settled by someone. We settle it in councils, where each bishop brings what he holds and the judgment is made together.\n\nAugustine also taught Scripture as a picture set before us, not only as commands to obey. Christ's own death, burial, rising and ascent to the Father were ordered deliberately. The life we lead here was cut to their shape. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising. When Augustine says to believe is to have eaten already: \u201c\u2018Jesus answered and said to them, This is the work of God, that you believe in Him whom He has sent.\u2019 This, then, is to eat the food: not the food that perishes, but the food that lasts to eternal life. Why do you get your teeth and stomach ready? Believe, and you have eaten already.\u201d\n\nReading Scripture among us is not separable from being formed. What you hear becomes the pattern your life is shaped to.", "cites": ["lpc.core.latin-pastoral-congregational-christianity", "lpc.quote.believe-and-thou-hast-eaten-already", "lpc.term.preaching", "lpc.witness.scripture-above-councils", "lpc.witness.the-pattern-we-are-modelled-on"]}}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typ   var h = '<details class="p"><summary><span class="pid">' + (p.i + 1) + " · " + p.cell + '</span><span class="q">' + esc(p.q) + "</span>" + tag + "</summary>";
  if (p.a === null) return h + '<div class="body"><p class="empty">Not asked yet.</p></div></details>';
  h += '<div class="body"><div class="cols' + (p.prev ? " two" : "") + '"><div class="col"><h4>' + (p.prev ? "New answer" : "Answer") + '</h4><div class="ans">' + prose(p.a) + "</div>";
  h += '<h4>Records cited</h4><div class="cites">' + (p.cites.length ? p.cites.map(function (c) { return "<span>" + esc(c) + "</span>"; }).join("") : "<span>none</span>") + "</div>";
  if (p.entries && p.entries.length) {
    h += '<h4>Sentence by sentence</h4><div class="checks">' + p.entries.map(function (e) { return esc(e.sentence) + '<br><span class="cites"><span>' + e.record_ids.map(esc).join(", ") + "</span></span>"; }).join("<br><br>") + "</div>";
  }
  h += "<h4>Checks and cost</h4>" + checksHtml(p) + '<div class="checks">' + (p.cost != null ? "Call cost " + "$" + p.cost.toFixed(4) : "") + " · " + esc(p.id) + "</div></div>";
  if (p.prev) h += '<div class="col"><h4>Run 3, same question</h4><div class="ans">' + prose(p.prev.a) + '</div><h4>Records cited</h4><div class="cites">' + p.prev.cites.map(function (c) { return "<span>" + esc(c) + "</span>"; }).join("") + "</div></div>";
  return h + "</div></div></details>";
}
function extra(w) {
  if (!w.extra) return "";
  return w.extra.map(function (s) {
    return '<div class="sec"><h2>' + esc(s.title) + '</h2><p class="sub">' + esc(s.sub || "") + "</p>" +
      s.items.map(function (it) {
        return '<details class="p"><summary><span class="pid">' + esc(it.tag || "") + '</span><span class="q">' + esc(it.q) + '</span><span class="tag wait">' + esc(it.status || "") + "</span></summary>" +
          '<div class="body"><div class="ans">' + prose(it.a || "") + "</div></div></details>";
      }).join("") + "</div>";
  }).join("");
}
function show() {
  var w = D.worlds.filter(function (x) { return x.key === cur; })[0];
  var h = "<h2>" + esc(w.key) + "</h2>";
  var sub = w.status === "done" ? w.passed + " of " + w.size + " questions pass the automatic checks · " + money(w.spent) :
    w.status === "running" ? "Running now: " + w.answered + " of " + w.size + " answered · " + money(w.spent) :
    w.status === "failed" ? "Stopped after a failed call. " + w.answered + " answers kept · " + money(w.spent) : "Not started yet.";
  h += '<p class="sub">' + sub + (w.attempts > 1 ? " · attempt " + w.attempts : "") + "</p>";
  if (w.review) h += '<div class="review"><b>Opus review</b> · ' + esc(w.review.summary) + (w.review.file ? '<br><span class="cites"><span>' + esc(w.review.file) + "</span></span>" : "") + "</div>";
  h += '<p class="legend"><mark class="q">Highlighted text</mark> is quoted from a source.</p>';
  h += w.probes.map(probe).join("") + extra(w);
  document.getElementById("world").innerHTML = h;
}
document.getElementById("chips").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-k]");
  if (!b) return;
  cur = b.dataset.k;
  try { history.replaceState(null, "", "#" + cur); } catch (x) {}
  chips(); show();
});
strip(); chips(); show();
</script>
