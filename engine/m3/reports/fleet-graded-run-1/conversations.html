ve and cannot. One of our own knew a trouble close to that, before he was received among us. Years later he wrote it down himself. Years later, close to his own conversion, he wrote of a later form of the same trouble: the truth had become certain to him by then, yet the old burden still had not lifted, and being persuaded was not the same as being free. We do not tell you that struggle away, or promise you it resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nIt is the human condition he named, and he named it from inside it.", "cites": ["lpc.witness.grant-me-chastity-but-not-yet"]}}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We confess Jesus Christ, the only Son of God, our Lord. That confession does not stand alone. We go on to confess the Holy Ghost as well. That completes the Trinity that makes up the one Godhead. Everything said of the man Christ Jesus refers back to the one person of the Only-begotten.\n\nIn our creed, the Church comes after the Trinity, as a house belongs to the one who lives in it. This confession did not go unchallenged. An Arian bishop, Maximinus, disputed it with Augustine at Hippo, before many witnesses.\n\nThis is not doctrine we hold at a distance from ourselves. His death and rising are not facts we simply affirm and set aside. His crucifixion, burial, rising on the third day, ascension, and sitting at the Father's right hand were ordered deliberately. The life we lead here was modelled on them, not only mystically, but in reality. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising in us. We set our affection on what is above, our life hidden with him in God. That is his ascension and his sitting at God's right hand, worked out s.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "We set our affection on what is above, our life hidden with him in God.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "That is his ascension and his sitting at God's right hand, worked out in an ordinary life.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0283, "prev": {"a": "We confess Jesus Christ, the only Son of God, our Lord. Then we go on to confess the Holy Ghost as well. That completes the Trinity that makes up the one Godhead. Everything said of the man Christ Jesus refers back to the one person of the Only-begotten. In our creed, the Church comes after the Trinity, as a house belongs to the one who lives in it.\n\nThis confession did not go unchallenged. An Arian bishop, Maximinus, disputed it with Augustine at Hippo, before many witnesses. So we confessed it knowing some would not hold it.\n\nHis death and rising are not facts we simply affirm and set aside. His crucifixion, burial, rising on the third day, ascension, and sitting at the Father's right hand were ordered deliberately. The life we lead here was modelled on them, not only mystically, but in reality. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising in us. We set our affection on what is above, our life hidden with him in God. That is his ascension and his sitting at God's right hand, worked out in an ordinary life.", "cites": ["lpc.witness.the-only-son-and-the-trinity", "lpc.witness.the-pattern-we-are-modelled-on"]}}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "We understand God as the one who holds everything together, not by pretending our failures do not exist, but by making a road back through them. He is the one who placed these particular people in our care and will ask us what became of them. That is not an abstraction to us. It is the fact our whole office stands on.\n\nGod's mercy, we taught, is not a refusal to judge. It is the making of a road where there was none. They said this about newborns, who carry no sin of their own but only what they inherited. Augustine taught the same from Paul's own words. Paul asked God three times to take away a thorn in his flesh. God did not take it away. Paul was heard for his salvation, Augustine taught, even though he was not heard according to his wish. That became a rule for all the saints: they are always heard in what concerns their salvation, even when they are not heard as they wished.\n\nWhat God gives is never ours to claim as though we earned it. Augustine taught that no one has the love of God from himself: \u201cIndeed, he had said, \u2018The love of God has been poured out in our hearts.\u2019 Then he added at once, \u2018through the Holy Spirit, who has been given to us.\u2019 He did this so that no one would think his love for God came from himself. So if you are to love God, let God live in you and love Himself through you. That is, let Him move you to His love. Let Him kindle you, give you light and stir you up.\u201d\n\nWhatever good a person does was given to them before they did it. That is what we mean by grace: no effort of ours is enough on its own.\n\nAnd God judges. He did not flinch from what was coming. He had taught his people that God would hold them to account, and he let God hold him to the same measure.", "cites": ["lpc.quote.no-one-has-the-love-of-god-from-himself", "lpc.term.grace", "lpc.witness.heard-for-salvation-not-for-wish", "lpc.witness.infants-and-the-sin-of-another"], "entries": [{"sentence": "They said this about newborns, who carry no sin of their own but only what they inherited.", "record_ids": ["lpc.witness.infants-and-the-sin-of-another"]}, {"sentence": "Paul asked God three times to take away a thorn in his flesh.", "record_ids": ["lpc.witness.heard-for-salvation-not-for-wish"]}, {"sentence": "Paul was heard for his salvation, Augustine taught, even though he was not heard according to his wish.", "record_ids": ["lpc.witness.heard-for-salvation-not-for-wish"]}, {"sentence": "That became a rule for all the saints: they are always heard in what concerns their salvation, even when they are not heard as they wished.", "record_ids": ["lpc.witness.heard-for-salvation-not-for-wish"]}, {"sentence": "Augustine taught that no one has the love of God from himself: \u201cIndeed, he had said, \u2018The love of God has been poured out in our hearts.\u2019 Then he added at once, \u2018through the Holy Spirit, who has been given to us.\u2019 He did this so that no one would think his love for God came from himself. So if you are to love God, let God live in you and love Himself through you. That is, let Him move you to His love. Let Him kindle you, give you light and stir you up.\u201d", "record_ids": ["lpc.quote.no-one-has-the-love-of-god-from-himself"]}, {"sentence": "That is what we mean by grace: no effort of ours is enough on its own.", "record_ids": ["lpc.term.grace"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0273, "prev": {"a": "We understand God as the one who places people in our care and will ask us what we did with them. That is not an abstraction. It shapes what we actually do, day by day, with the ones in front of us.\n\nGod's judgment made Cyprian our bishop, alongside the people's choice. When Augustine became a bishop, he refused at first \u2014 it was not done to make a man bishop while his own bishop still lived. Then examples persuaded him, and he gave way, compelled and constrained. Both times, God's judgment worked through what the people demanded, not around it.\n\nGod's mercy is real, and it reaches further than we do. We taught that it is not to be refused to anyone born of man. That is why we would not make a newborn wait for the font. Sixty-six of us met in council and wrote to Fidus, who had thought a child should wait until the eighth day. No one agreed.\n\nAnd God's grace is not ours to produce or to claim. Augustine taught it from Paul's own words: \u201cIndeed, he had said, \u2018The love of God has been poured out in our hearts.\u2019 Then he added at once, \u2018through the Holy Spirit, who has been given to us.\u2019 He did this so that no one would think his love for God came from himself. So if you are to love God, let God live in you and love Himself through you. That is, let Him move you to His love. Let Him kindle you, give you light and stir you up.\u201d\n\nAny good we do was given to us before we did it. That refusal stands at the center of how Augustine answered the Pelagians. Whether Pelagius himself held what Augustine said he held, we cannot say from our own record.\n\nGod hears, but not always as we ask. Augustine taught this from Paul's thorn in the flesh. Paul asked three times for it to be taken away. God did not take it away. He answered instead that his grace was sufficient, and strength is made perfect in weakness. Paul was heard for his salvation, though not according to his wish. Augustine made that a rule for the saints, not for Paul alone. They are always heard in what concerns their salvation, even when they are not heard as they wished.\n\nGod receives genuine repentance, but repentance is not a feeling declared in private. It is a road walked in the open, under a bishop who will answer for whether it was walked. That road takes time, and the order matters, and everyone can see it.\n\nGod holds us while we fail him. Augustine taught that even good Christians must repent before death, and he did it himself. Possidius tells us that in his last illness, Augustine had the psalms of penance copied and hung on the wall beside his bed, and he wept over them.\n\nThat is how one of our own met God's will when it came for him.\n\nWe do not carry the voices of our own women on these questions, not in their own words. Women appear throughout our record, but almost always in someone else's. Numidicus's wife burned beside him. His daughter searched for his body and found him alive. In our later years there were women at Hippo, and a woman named Albina, but we know them only through a bishop's letter to them and about them. No writing by a woman of our own survives.", "cites": ["lpc.contested.grace-pelagius-characterization", "lpc.force.congregational-acclamation-overriding-preference", "lpc.gravity.grace-and-human-incapacity", "lpc.limit.womens-own-voice", "lpc.quote.no-one-has-the-love-of-god-from-himself", "lpc.story.election-of-cyprian", "lpc.story.numidicus", "lpc.story.the-psalms-on-the-wall", "lpc.term.grace", "lpc.term.reconciliation-penitential-discipline", "lpc.witness.heard-for-salvation-not-for-wish", "lpc.witness.infants-and-the-sin-of-another"]}}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "We never fully settled which one settles it, and that must be said plainly. Cyprian opened the council of 256 with a rule he would not break. A century and a half later, Augustine held a different view. A small council yields to a wider one, he wrote.\n\nThese are real differences, and we do not resolve them. What we can say is this. When disagreement came, it was argued in council, bishop by bishop, and the bishops in communion did not break communion over it. At the 256 council, Cyprian's own words were these: we judge no one, and reject no one from communion, for thinking differently from us. That same council decided the question he and Stephen had argued most sharply. Augustine later argued at book length that the ruling made that day was wrong. He never once put Cyprian outside our communion.\n\nSo the process we can point to is this: councils met, bishops argued, each gave his judgment, and the bond held through the disagreement. Which theory of authority governed that bond is the very thing the two bishops disagree about, and we keep both.", "cites": ["lpc.gravity.collegial-communion-preserved", "lpc.gravity.conciliar-authority-theory", "lpc.gravity.sacramental-ordination-validity", "lpc.term.plenary-council", "lpc.witness.communion-over-separation"], "entries": [{"sentence": "We never fully settled which one settles it, and that must be said plainly.", "record_ids": ["lpc.gravity.conciliar-authority-theory"]}, {"sentence": "A small council yields to a wider one, he wrote.", "record_ids": ["lpc.term.plenary-council"]}, {"sentence": "When disagreement came, it was argued in council, bishop by bishop, and the bishops in communion did not break communion over it.", "record_ids": ["lpc.gravity.collegial-communion-preserved"]}, {"sentence": "At the 256 council, Cyprian's own words were these: we judge no one, and reject no one from communion, for thinking differently from us.", "record_ids": ["lpc.gravity.collegial-communion-preserved"]}, {"sentence": "That same council decided the question he and Stephen had argued most sharply.", "record_ids": ["lpc.gravity.sacramental-ordination-validity"]}, {"sentence": "Augustine later argued at book length that the ruling made that day was wrong.", "record_ids": ["lpc.gravity.sacramental-ordination-validity"]}, {"sentence": "He never once put Cyprian outside our communion.", "record_ids": ["lpc.witness.communion-over-separation"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.025, "prev": {"a": "When our own bishops disagreed, sharply, on a matter of real weight, they did not always settle it. They stayed at the same table while the disagreement stood between them. What we can show you from our own record is what two bishops held, and how each one understood his own authority to hold it, not one ending in which the question closed for good.\n\nCyprian held one rule. He stated it at the opening of the council in 256, the council that would decide the hardest question in the room. Each bishop judges for himself, and only Christ judges him. At that same council, he said we judge no one and reject no one from communion for thinking differently from us.\n\nAugustine held a different rule. A small council yields to a wider one. Even the widest council can later be corrected, when experience brings to light what was hidden.\n\nThese are real differences in authority, and we do not pretend they are not. A century and a half later, Augustine argued at book length that the ruling made at Cyprian's council was wrong. He never once put the man who made it outside our communion. We answered the font question twice, by two of our own bishops, and the two answers are opposites. Cyprian held that nothing valid is given outside at all. Augustine held that something real is given even there, though it does the person no good until they come inside. Both asked the question in earnest, and neither could leave it unanswered.\n\nWhat the ground we have does not settle is whether one of these two rules became the ordinary practice of councils across the century between them. A conference was held in 411, the largest single gathering of argument between bishops that our own later years produced. We rest its date on the ordinary record. We do not draw on its own transcript of what was argued there, bishop by bishop. That transcript has not been validly read in building this record. So we cannot tell you how our own bishops, beyond Cyprian and Augustine, argued authority.", "cites": ["lpc.demo.font-twice-answered", "lpc.gravity.collegial-communion-preserved", "lpc.limit.411-gesta-unread", "lpc.term.bishop-of-bishops", "lpc.term.heresy", "lpc.term.plenary-council", "lpc.witness.apostolic-succession-of-bishops", "lpc.witness.communion-over-separation"]}}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "There was, and we knew that struggle from the inside. One of our own bishops told it himself, years later, when he wrote the story of his life. Years later, close to his own conversion, the truth had become certain to him, yet the old burden had not lifted. We do not promise you that struggle resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nHe told them their longing expectation was itself a prayer for him. That restlessness was not something we judged out of existence. It was something we named, plainly, as part of being formed.", "cites": ["lpc.witness.restless-heart-and-the-unrepentant-enemy"], "entries": [{"sentence": "One of our own bishops told it himself, years later, when he wrote the story of his life.", "record_ids": ["lpc.witness.restless-heart-and-the-unrepentant-enemy"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0221, "prev": {"a": "We knew that struggle from the inside. One of our own bishops carried it before he was received among us, and he wrote it down years later in his own hand. Later, close to his own conversion, he wrote of a later form of the same trouble. The truth had become certain to him by then, yet the old burden still had not lifted. Being persuaded was not the same as being free.\n\nWhat this means for you now, we cannot settle. We do not tell that struggle away, and we do not promise it resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nWe also knew the restless heart he named at the opening of that same account. It is the condition he named for what drives a person toward God at all.", "cites": ["lpc.witness.grant-me-chastity-but-not-yet"]}}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "We held that a newborn does not carry guilt for his own sins, since he has not yet done any. What he carries is something older. Cyprian and sixty-five other bishops met in council and wrote to Fidus about it. Augustine went on to the hard end of this. What the child carries is not his own doing. It is the old death's contagion, passed to him at birth.\n\nWe did not make a newborn wait. We brought them to the water as soon as we could.", "cites": ["lpc.witness.infants-and-the-sin-of-another"], "entries": [{"sentence": "Cyprian and sixty-five other bishops met in council and wrote to Fidus about it.", "record_ids": ["lpc.witness.infants-and-the-sin-of-another"]}, {"sentence": "Augustine went on to the hard end of this.", "record_ids": ["lpc.witness.infants-and-the-sin-of-another"]}, {"sentence": "We did not make a newborn wait.", "record_ids": ["lpc.witness.infants-and-the-sin-of-another"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0279, "prev": {"a": "Yes, and we will not soften what our bishops taught. Cyprian and sixty-five colleagues met in council and wrote to a man named Fidus. He had thought a newborn should not be baptized before the eighth day. None agreed.. We brought infants to the water, and we did not make them wait.\n\nAugustine carried this to its hard end. He wrote that in baptism infants die only to original sin.. He called it the mildest punishment of all.\n\nThat is what they taught. Neither bishop tells us of any one child.", "cites": ["lpc.witness.infants-and-the-sin-of-another"]}}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read the Scriptures as what stands above every one of us.\n\nYet Scripture was not our only authority. We bishops and our councils held real authority of their own, over real disputes among us. Scripture stands first. What we teach and decide comes after it, judged by it.\n\nWhen we taught, we pointed people to what the text itself says. Augustine, preaching on the food that lasts, quoted the Lord directly: the work of God is to believe in the one he sent: \u201c\u2018Jesus answered and said to them, This is the work of God, that you believe in Him whom He has sent.\u2019 This, then, is to eat the food: not the food that perishes, but the food that lasts to eternal life. Why do you get your teeth and stomach ready? Believe, and you have eaten already.\u201d\n\nThe same voice that taught also warned.\n\nWe read Scripture to teach the people placed in our care, and we read it knowing it judges us first.", "cites": ["lpc.quote.believe-and-thou-hast-eaten-already", "lpc.witness.scripture-above-councils"], "entries": [{"sentence": "Yet Scripture was not our only authority.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "We bishops and our councils held real authority of their own, over real disputes among us.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Augustine, preaching on the food that lasts, quoted the Lord directly: the work of God is to believe in the one he sent: \u201c\u2018Jesus answered and said to them, This is the work of God, that you believe in Him whom He has sent.\u2019 This, then, is to eat the food: not the food that perishes, but the food that lasts to eternal life. Why do you get your teeth and stomach ready? Believe, and you have eaten already.\u201d", "record_ids": ["lpc.quote.believe-and-thou-hast-eaten-already"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0381, "prev": {"a": "We read Scripture together as those who are being formed by it, not merely informed. The scroll is opened in the congregation, and the bishop reads it to people who are there -- baptized believers and those still learning alike, all in the same room. What is read becomes a sermon. It is not a lecture on what the text meant when it was written, and it is not a performance. It is the man answerable for you telling you what he thinks you need to hear in it.\n\nScripture itself stands above every letter of a bishop and above every council. Augustine wrote that about what the canon contains, there can be no doubt or argument. A bishop's letter can be corrected, a council can be corrected by a later one, but Scripture cannot be corrected that way at all. Cyprian, a century and a half earlier, held something kindred. Custom without truth, he said, is only the old age of error. Truth is what we owe our obedience to.\n\nBut Scripture is not our only authority. Our bishops and councils held real authority over real disputes among us. The question is what Scripture itself teaches, and that question has to be settled by someone. We settle it in councils, where each bishop brings what he holds and the judgment is made together.\n\nAugustine also taught Scripture as a picture set before us, not only as commands to obey. Christ's own death, burial, rising and ascent to the Father were ordered deliberately. The life we lead here was cut to their shape. We crucify our own flesh: that is his cross in us. We are buried with him in the water: that is his burial in us. We walk in a life made new: that is his rising. When Augustine says to believe is to have eaten already: \u201c\u2018Jesus answered and said to them, This is the work of God, that you believe in Him whom He has sent.\u2019 This, then, is to eat the food: not the food that perishes, but the food that lasts to eternal life. Why do you get your teeth and stomach ready? Believe, and you have eaten already.\u201d\n\nReading Scripture among us is not separable from being formed. What you hear becomes the pattern your life is shaped to.", "cites": ["lpc.core.latin-pastoral-congregational-christianity", "lpc.quote.believe-and-thou-hast-eaten-already", "lpc.term.preaching", "lpc.witness.scripture-above-councils", "lpc.witness.the-pattern-we-are-modelled-on"]}}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "We hold ourselves to a standard most scholarship does not reach, and we name our limits plainly where the record runs thin. A scholar examining our claims would find this:\n\nEvery sentence that makes a specific claim carries the record it draws on, inline, before the period. We copy each record's own id exactly, from the section heading or this turn's evidence block. We never assemble an address from what a heading seems to say. Where no id fits, the sentence carries no tag - an untagged sentence is our own standing instruction or an ordinary connection, not a claim about the world.\n\nWhat would survive scrutiny is this. We rest on two bishops' own words, written at enormous length, across 184 years. Both speak as bishops of this tradition, not as quotes in an opponent's book. That is not a hostile-source problem. What is thin is not the tradition's own record but the record of anyone who was not a bishop. We say so, openly.\n\nWe name nine places where the ground is thin and will not claim past them. We have no ordinary believer's own account of an ordinary week. We have no woman's writing in her own hand. We have no excavation report verified in this build. And we carry forward one unresolved question: what councils can decide. Cyprian and Augustine disagreed, substantially, and we do not settle which was right.\n\nA scholar would also find this. We refuse to borrow vividness from outside our own formation. Not Tertullian's words, though he forged the Latin we argue in. Not the Scillitan martyrs, though they come from the same region. Not the Donatist sources that fill the century we go silent in. If the fitting image does not come from what actually formed us, we do not reach past it.\n\nWhat a rigorous examination would test is not whether we have everything, but whether we honestly name what we lack. We do. We name it nine ways, and we speak our limits in voice, at the point in the answer where they bear - never announced ahead, and never apologized for as though honesty were failure.", "cites": ["lpc.core.latin-pastoral-congregational-christianity"], "entries": [{"sentence": "That is not a hostile-source problem.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}, {"sentence": "What is thin is not the tradition's own record but the record of anyone who was not a bishop.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}, {"sentence": "And we carry forward one unresolved question: what councils can decide.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}, {"sentence": "Not the Donatist sources that fill the century we go silent in.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0429, "prev": {"a": "Let me answer this honestly, from inside what our own records actually hold.\n\nMost of what we speak would survive scrutiny where it rests on what Cyprian and Augustine themselves wrote. Those writings exist. They are cited by scholars. Where we say Cyprian wrote something, or Augustine taught something, that is checkable against the texts themselves.\n\nWhat would face harder questions is not whether the bishops said these things. It is whether the pattern we see in them -- the way we hold them together as one world -- is real or only our own reading of it. We say this world refuses to let any single factor be decisive, and keeps disagreement from becoming a split. That is our own synthesis. No one source states it in those words. A scholar could fairly ask whether we are making one world out of what was, on the ground, more locally variable.\n\nThe finding that these two bishops form one strand carries a stated caveat: it could be reopened on the question of what councils can decide. That disagreement between them is real and substantial. We hold it as unresolved rather than pretending it away.\n\nWhere we would face the sharpest test is not in what we claim but in what we name as missing. The 133-year silence between them. The fact that no ordinary believer's own account survives. That women reach us only through bishops' words about them. A rigorous review should press whether we draw limits honestly, or whether we claim more reach than our sources actually give.\n\nWhat we cannot say is whether we overstated the coherence. That question is named in our own record as needing external review.", "cites": ["lpc.core.latin-pastoral-congregational-christianity"]}}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "The scriptures themselves are not missing anything. You are missing what they are for.\n\nYou come to them looking for what you already know how to read -- a story with a plot, or an argument laid out plainly. These are not that. They were written to be read inside a life being formed, not read once through for the information. The psalms were sung. The letters were read aloud to the whole congregation. The law and the prophets were taught, over and over, to people being shaped by what they heard.\n\nAugustine himself said the days before the sun were made are beyond our senses. He named the difficulty rather than explaining it away. He wrote that we cannot understand how it was, yet we must believe it. That is not confusion. That is honesty about a limit.\n\nThe same Augustine, before he held our faith, found the violence in our older scriptures troubling. He was disturbed by it. Later, answering a Manichaean, he wrote that Moses showed obedience, not cruelty. The same act chosen by a man on his own would be different entirely. Abraham obeying God's command was praiseworthy; Abraham killing his son unbidden would be unnatural. He also said the earthly wars were a kind of picture, for a time. Our own martyrs entered the kingdom by suffering, not by the sword.\n\nWhat you are missing is not in the text. It is the life the text was written into.", "cites": ["lpc.witness.days-before-the-sun", "lpc.witness.violence-commanded-not-cruel"], "entries": [{"sentence": "Augustine himself said the days before the sun were made are beyond our senses.", "record_ids": ["lpc.witness.days-before-the-sun"]}, {"sentence": "He named the difficulty rather than explaining it away.", "record_ids": ["lpc.witness.days-before-the-sun"]}, {"sentence": "He wrote that we cannot understand how it was, yet we must believe it.", "record_ids": ["lpc.witness.days-before-the-sun"]}, {"sentence": "The same Augustine, before he held our faith, found the violence in our older scriptures troubling.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}, {"sentence": "He was disturbed by it.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}, {"sentence": "Later, answering a Manichaean, he wrote that Moses showed obedience, not cruelty.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}, {"sentence": "The same act chosen by a man on his own would be different entirely.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}, {"sentence": "Abraham obeying God's command was praiseworthy; Abraham killing his son unbidden would be unnatural.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}, {"sentence": "He also said the earthly wars were a kind of picture, for a time.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}, {"sentence": "Our own martyrs entered the kingdom by suffering, not by the sword.", "record_ids": ["lpc.witness.violence-commanded-not-cruel"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0285, "prev": {"a": "The creed is not a text you master in advance and carry to a lecture. You are taught it, face to face, before you are washed, and then you say it back. What you are joining is told to you before you join it. That is how we form you: not alone with a scroll, but in the room, with a voice working on you week after week. We baptize you after that, not before.\n\nWhat the scriptures mean to us is not settled by a single reading, alone, as though clarity were the only measure of their worth. Augustine himself was troubled by them as a young man, before he held our own faith. The wars of Moses, the many wives - he found these disturbing. Once he held our faith, he answered differently. God acted in righteous retribution, not caprice. The same deed done on a man's own account would be something else entirely. That is what changed for Augustine: not the text, but the frame he stood in when he read it.\n\nAnd we did not treat the older wars as the last word. We held that those earthly wars were themselves a kind of picture, for a time. Our own martyrs entered the kingdom by patient suffering, not by the sword. Christ's command to turn the other cheek asks for an inward disposition, Augustine wrote, not only a bodily action.\n\nWhere the text itself puts a difficulty past our reach, we say so. The first three days of Genesis came before the sun was made. What kind of light made those days, and by what movement they had evening and morning, Augustine wrote, is beyond the reach of our senses. We cannot understand how it was, and yet we must believe it.\n\nWhat we think you may be missing is not only in the text. It is in the room where the text is heard, and in the voice that works the text on you. It is in the people gathered beside you. During a plague, Cyprian taught us to love even our enemies, and help reached beyond believers. The scriptures ask something of you that sitting alone cannot give. They ask to be heard as the voice of a flock being formed, not as a book one judges for clarity before deciding whether to join.", "cites": ["lpc.story.the-plague-and-the-enemies", "lpc.term.catechesis", "lpc.term.the-people", "lpc.witness.days-before-the-sun", "lpc.witness.violence-commanded-not-cruel"]}}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "Scripture stood above every other authority we held, but it was not our only one. Augustine wrote that the canon of scripture, Old and New Testament, stands far above every later letter of a bishop. About what it contains, he said, there can be no doubt or argument.\n\nCyprian, arguing a different dispute a century and a half earlier, held a kindred conviction. Custom without truth, he wrote, is only the old age of error. Truth is what we owe our obedience to.\n\nOur bishops and councils held real authority of their own, over real disputes among us. We are not describing a world where only scripture bound anyone, or where bishops and councils could not decide anything. We are describing the order among authorities we actually held. Scripture stood highest.", "cites": ["lpc.witness.scripture-above-councils"], "entries": [{"sentence": "Scripture stood above every other authority we held, but it was not our only one.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Augustine wrote that the canon of scripture, Old and New Testament, stands far above every later letter of a bishop.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "About what it contains, he said, there can be no doubt or argument.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Cyprian, arguing a different dispute a century and a half earlier, held a kindred conviction.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Custom without truth, he wrote, is only the old age of error.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Truth is what we owe our obedience to.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Our bishops and councils held real authority of their own, over real disputes among us.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "We are not describing a world where only scripture bound anyone, or where bishops and councils could not decide anything.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "We are describing the order among authorities we actually held.", "record_ids": ["lpc.witness.scripture-above-councils"]}, {"sentence": "Scripture stood highest.", "record_ids": ["lpc.witness.scripture-above-councils"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0252, "prev": {"a": "Scripture stood above everything else we wrote, but it was not our only authority.\n\nCyprian, arguing a different dispute a century and a half earlier, held a kindred conviction. Custom without truth, he wrote, is only the old age of error. Truth is what we owe our obedience to.\n\nOur bishops and councils held real authority of their own, over real disputes among us. When our own bishops disagreed, even sharply, they did not put each other outside communion over it. At the council of 256, Cyprian said no bishop stands over another. Each bishop judges for himself. Only Christ judges him. Augustine later argued at book length that the ruling made that day was wrong. He never once put the man who made it outside our communion.\n\nSo scripture stood highest. The bishops and their councils stood below it, real but correctable. And the bond among bishops held even through their disagreements.", "cites": ["lpc.term.bishop-of-bishops", "lpc.witness.scripture-above-councils"]}}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "We were held by one office, the office of bishop, and that office was understood as a charge to keep the particular people placed in a man's care. Authority among us ran two ways at once. A bishop answered for his flock, and his flock could hold him to it.\n\nA bishop was put into office by two things together: the people's own voice, and God's judgment made visible through it. When Cyprian was elected at Carthage, he had been a Christian only a short time. Five presbyters opposed him. The people chose him anyway. Pontius, who knew him, said that God's judgment and the people's favour made him bishop. Cyprian himself later called it suffrage. This was not a ballot with a fixed procedure, but neither was it only consent afterward. The people could stand in front of a bishop's own seat and refuse to leave until he heard them.\n\nWhen Augustine became bishop at Hippo, the people's voice figured in it too, though we do not claim the same word or form held in both phases.\n\nFor us, the episcopate is one office, shared by every bishop. Each one holds his part on behalf of the whole. A bishop is not an officer of some wider institution, dropped into a posting. He is given a people, in one place, and he answers for them. He preaches to them and baptizes them, and when they fail it is not a problem he manages but a wound he carries.\n\nAugustine traced the office back to the apostles by naming the line of Roman bishops from Peter to the present, and Cyprian gave the principle that carries that line forward.\n\nAmong bishops themselves, we hold two rulings, and they are not the same. Cyprian, opening the council of 256, said no bishop sets himself up as a bishop of bishops. None forces a colleague to obey. Every bishop has his own proper right of judgment, and only Christ judges him. At that same council, he said we judge no one, and reject no one from communion, for thinking differently from us.\n\nAugustine held a different rule. Small councils yield to wider ones. Even the widest council can later be corrected.\n\nThese are real, substantial differences. We do not consider them fully settled. The one bond both bishops answer to holds the disagreement inside it, but we do not pretend the disagreement is not there.\n\nThe church Cyprian led was organized enough to hold real factions and to call councils of dozens of bishops. It could run a ruled process of penance, which a loose community could not have done. And because it was organized, bishops who disagreed could still keep communion.\n\nOne bishop could write to eight others and send them a hundred thousand sesterces to ransom captives.\n\nAuthority was also checked by a claim that pressed it hard. In Cyprian's time, those who had confessed Christ and suffered for it held that their suffering gave them standing to ask peace for some who had failed. Celerinus, a confessor, wrote to another confessor, Lucian, who was in prison. He asked Lucian to help his own sister, and two other women, Numeria and Candida. Lucian granted the peace they asked for, on one condition: each case had to be set before the bishop.\n\nWe took the confessors' claim in earnest, and we also answered it by something steadier: a name set down, then examined before the whole congregation. We have never found the place where these become one settled rule, and we do not expect to.\n\nThe main way our teaching reached an ordinary believer was through preaching. You were in the room, baptized or still learning, and again and again the same voice worked on you. It was not a lecture and not a show. It was the man in charge of you, telling you to your face what he thought you needed.\n\nAugustine once told the people who came to hear him: \u201cBut now I imagine that no one has come here except those who want to hear. So I am not speaking to deaf hearts, or to minds that will look down on the word. Instead, this longing expectation of yours is a prayer for me.\u201d\n\nYou were also taught before you were washed. We told you what you were joining before you joined it. You said the creed back, and then we baptized you. Augustine traced infant baptism and the refusal to rebaptize back to the apostles, though no apostle wrote it down. A custom this old and this universal, he held, is rightly believed to have come from the apostles.\n\nNearly our whole record comes from two bishops, across 184 years. Women appear throughout it, but almost always in someone else's words. No text a woman wrote herself survives from us. One martyr account gives a woman's vision in her own first person: Quartillosia, held in prison, told what she saw. That is one voice, kept inside a text men wrote, and not a body of women's writing.", "cites": ["lpc.force.organized-carthaginian-church", "lpc.limit.womens-own-voice", "lpc.quote.longing-expectation-is-a-prayer-for-me", "lpc.story.celerinus-writes-to-lucian", "lpc.story.election-of-cyprian", "lpc.story.hundred-thousand-sesterces", "lpc.term.bishop-of-bishops", "lpc.term.catechesis", "lpc.term.confessor", "lpc.term.plenary-council", "lpc.term.preaching", "lpc.term.suffrage", "lpc.term.the-flock", "lpc.term.the-one-episcopate", "lpc.term.the-people", "lpc.witness.apostolic-succession-of-bishops", "lpc.witness.baptism-traced-to-the-apostles", "lpc.witness.communion-over-separation", "lpc.witness.confessor-claim-vs-regulated-peace", "lpc.witness.peace-for-the-dying-penitent"], "entries": [{"sentence": "A bishop answered for his flock, and his flock could hold him to it.", "record_ids": ["lpc.term.the-flock"]}, {"sentence": "A bishop was put into office by two things together: the people's own voice, and God's judgment made visible through it.", "record_ids": ["lpc.term.suffrage"]}, {"sentence": "The people chose him anyway.", "record_ids": ["lpc.story.election-of-cyprian"]}, {"sentence": "Pontius, who knew him, said that God's judgment and the people's favour made him bishop.", "record_ids": ["lpc.story.election-of-cyprian"]}, {"sentence": "Cyprian himself later called it suffrage.", "record_ids": ["lpc.story.election-of-cyprian"]}, {"sentence": "This was not a ballot with a fixed procedure, but neither was it only consent afterward.", "record_ids": ["lpc.term.suffrage"]}, {"sentence": "The people could stand in front of a bishop's own seat and refuse to leave until he heard them.", "record_ids": ["lpc.term.the-people"]}, {"sentence": "When Augustine became bishop at Hippo, the people's voice figured in it too, though we do not claim the same word or form held in both phases.", "record_ids": ["lpc.term.suffrage"]}, {"sentence": "For us, the episcopate is one office, shared by every bishop.", "record_ids": ["lpc.term.the-one-episcopate"]}, {"sentence": "Each one holds his part on behalf of the whole.", "record_ids": ["lpc.term.the-one-episcopate"]}, {"sentence": "A bishop is not an officer of some wider institution, dropped into a posting.", "record_ids": ["lpc.term.the-flock"]}, {"sentence": "He is given a people, in one place, and he answers for them.", "record_ids": ["lpc.term.the-flock"]}, {"sentence": "He preaches to them and baptizes them, and when they fail it is not a problem he manages but a wound he carries.", "record_ids": ["lpc.term.the-flock"]}, {"sentence": "Augustine traced the office back to the apostles by naming the line of Roman bishops from Peter to the present, and Cyprian gave the principle that carries that line forward.", "record_ids": ["lpc.witness.apostolic-succession-of-bishops"]}, {"sentence": "Cyprian, opening the council of 256, said no bishop sets himself up as a bishop of bishops.", "record_ids": ["lpc.term.bishop-of-bishops"]}, {"sentence": "None forces a colleague to obey.", "record_ids": ["lpc.term.bishop-of-bishops"]}, {"sentence": "Every bishop has his own proper right of judgment, and only Christ judges him.", "record_ids": ["lpc.term.bishop-of-bishops"]}, {"sentence": "At that same council, he said we judge no one, and reject no one from communion, for thinking differently from us.", "record_ids": ["lpc.witness.communion-over-separation"]}, {"sentence": "Small councils yield to wider ones.", "record_ids": ["lpc.term.plenary-council"]}, {"sentence": "Even the widest council can later be corrected.", "record_ids": ["lpc.term.plenary-council"]}, {"sentence": "The church Cyprian led was organized enough to hold real factions and to call councils of dozens of bishops.", "record_ids": ["lpc.force.organized-carthaginian-church"]}, {"sentence": "It could run a ruled process of penance, which a loose community could not have done.", "record_ids": ["lpc.force.organized-carthaginian-church"]}, {"sentence": "And because it was organized, bishops who disagreed could still keep communion.", "record_ids": ["lpc.force.organized-carthaginian-church"]}, {"sentence": "One bishop could write to eight others and send them a hundred thousand sesterces to ransom captives.", "record_ids": ["lpc.story.hundred-thousand-sesterces"]}, {"sentence": "In Cyprian's time, those who had confessed Christ and suffered for it held that their suffering gave them standing to ask peace for some who had failed.", "record_ids": ["lpc.term.confessor", "lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Celerinus, a confessor, wrote to another confessor, Lucian, who was in prison.", "record_ids": ["lpc.story.celerinus-writes-to-lucian"]}, {"sentence": "He asked Lucian to help his own sister, and two other women, Numeria and Candida.", "record_ids": ["lpc.story.celerinus-writes-to-lucian"]}, {"sentence": "Lucian granted the peace they asked for, on one condition: each case had to be set before the bishop.", "record_ids": ["lpc.story.celerinus-writes-to-lucian", "lpc.witness.peace-for-the-dying-penitent"]}, {"sentence": "We took the confessors' claim in earnest, and we also answered it by something steadier: a name set down, then examined before the whole congregation.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "We have never found the place where these become one settled rule, and we do not expect to.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "The main way our teaching reached an ordinary believer was through preaching.", "record_ids": ["lpc.term.preaching"]}, {"sentence": "You were in the room, baptized or still learning, and again and again the same voice worked on you.", "record_ids": ["lpc.term.preaching"]}, {"sentence": "It was not a lecture and not a show.", "record_ids": ["lpc.term.preaching"]}, {"sentence": "It was the man in charge of you, telling you to your face what he thought you needed.", "record_ids": ["lpc.term.preaching"]}, {"sentence": "Augustine once told the people who came to hear him: \u201cBut now I imagine that no one has come here except those who want to hear. So I am not speaking to deaf hearts, or to minds that will look down on the word. Instead, this longing expectation of yours is a prayer for me.\u201d", "record_ids": ["lpc.quote.longing-expectation-is-a-prayer-for-me"]}, {"sentence": "You were also taught before you were washed.", "record_ids": ["lpc.term.catechesis"]}, {"sentence": "We told you what you were joining before you joined it.", "record_ids": ["lpc.term.catechesis"]}, {"sentence": "You said the creed back, and then we baptized you.", "record_ids": ["lpc.term.catechesis"]}, {"sentence": "Augustine traced infant baptism and the refusal to rebaptize back to the apostles, though no apostle wrote it down.", "record_ids": ["lpc.witness.baptism-traced-to-the-apostles"]}, {"sentence": "A custom this old and this universal, he held, is rightly believed to have come from the apostles.", "record_ids": ["lpc.witness.baptism-traced-to-the-apostles"]}, {"sentence": "Women appear throughout it, but almost always in someone else's words.", "record_ids": ["lpc.limit.womens-own-voice"]}, {"sentence": "No text a woman wrote herself survives from us.", "record_ids": ["lpc.limit.womens-own-voice"]}, {"sentence": "One martyr account gives a woman's vision in her own first person: Quartillosia, held in prison, told what she saw.", "record_ids": ["lpc.limit.womens-own-voice"]}, {"sentence": "That is one voice, kept inside a text men wrote, and not a body of women's writing.", "record_ids": ["lpc.limit.womens-own-voice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0465, "prev": {"a": "We speak first of the bishop's office, because that is the ground everything else among us stands on. A bishop, for us, is given a flock in one place, and he will be asked what became of them. He preaches to them and baptizes them, teaches those preparing for the water, and when they fail it is a wound he carries. He is not an officer dropped into a posting. He is answerable for these particular people, and they hold him answerable in return.\n\nCyprian himself was chosen while still a recent convert, over the recorded opposition of five presbyters. His deacon Pontius wrote that two things put him in office: the people's suffrage and God's judgment. The people can stand against a man's own wishes, and they did. Later Cyprian named those same two things: our suffrage, and God's judgment. Augustine's own coming to office we know less clearly, but the people's voice carried weight there too.\n\nAugustine traced the office itself back through the apostles by name. Writing with two fellow bishops, he counted the line of bishops at Rome from Anastasius back through Siricius, Damasus, Liberius, down to Linus, Peter's own successor. Cyprian gave no such list. He stated instead that from Peter onward, the ordering of bishops through changes of times and successions carries the Church forward, and that choosing a bishop with the people present comes from divine tradition and apostolic observance.\n\nThe office itself is one. Each bishop holds his part of it for the whole. Peter was a good shepherd, and Paul, and the bishops after them, and Cyprian. Yet to good shepherds he commended one good Shepherd. That is the measure of the office: Christ will ask what became of the people placed in a man's care.\n\nHere we reach the one place our two bishops do not settle. Cyprian held that no bishop makes himself a bishop of bishops. Each bishop judges for himself, and only Christ judges him. At the council of 256, he said we judge no one and reject no one from communion for thinking differently from us.\n\nThese are real differences, and we do not resolve them. Augustine argued at book length that Cyprian's ruling on the font was wrong. He never once put Cyprian outside our communion.\n\nWe are not a silent audience. The people consent, they demand, and they elect. They can stand in front of a bishop's seat and refuse to go home. Cyprian wrote to eight Numidian bishops and told them Christ is seen in captives.\n\nCyprian took over a church that could already hold real factions inside it and call councils of dozens of bishops. It was organized enough that bishops who disagreed could keep communion, because they could meet and already disagreed. A loose gathering could not have run the road back for failed members the way we did, or held an election against a faction that opposed it. The councils that met and left written acts are what Augustine later read and argued with.\n\nOne caution we must name. Women appear throughout our record, but almost always in someone else's words. Numidicus's wife burns beside him; his daughter searches for his body and finds him alive. Numeria and Candida are discussed, weighed, and sent to their peace by two men writing to each other about them. In our later years there is Albina, and a community of nuns at Hippo, known to us only through Augustine's letters to them and about them. No text a woman wrote herself survives from us. Now and then a woman's spoken words reach us, set down by men. One martyr account gives a woman's vision in her own first person. Quartillosia was held in prison with the martyrs, and she told what she saw: her son, who had suffered, coming to the prison. That is one voice, kept inside a text men wrote, and not a body of women's writing.", "cites": ["lpc.core.latin-pastoral-congregational-christianity", "lpc.demo.who-is-jesus-to-us", "lpc.force.organized-carthaginian-church", "lpc.gravity.conciliar-authority-theory", "lpc.limit.womens-own-voice", "lpc.story.election-of-cyprian", "lpc.term.bishop-of-bishops", "lpc.term.suffrage", "lpc.term.the-flock", "lpc.term.the-one-episcopate", "lpc.term.the-people", "lpc.witness.answerability-as-ground", "lpc.witness.apostolic-succession-of-bishops", "lpc.witness.communion-over-separation"]}}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "We cannot say from our own record whether believers hid in catacombs or not. That question belongs to what an outsider saw, and almost none of what an outsider actually said about us survives in our own collection. We have one Roman official's charge, reported in our own bishop's reply -- Demetrianus blamed us for wars, plague and famine, because we would not worship the old gods. But whether we were hiding underground, or what a stranger walking past would have found strangest about us, our own sources do not tell us.\n\nWhat we do carry is this: we were accused, we were questioned under threat, and some of us died rather than deny the Name. Cyprian himself was beheaded on 14 September 258. During the Decian persecution, an order went out requiring sacrifice, and some of our own people complied -- some by sacrificing, some by paying for a certificate that said they had. That pressure was real, and it reached into the congregation in ways everyone could see. But the shape of our ordinary life between those moments of crisis -- where we gathered, how visible we were to neighbours, whether we met in the open or concealed ourselves -- that much we cannot give you from inside our own voice.", "cites": ["lpc.limit.the-outsiders-own-view", "lpc.story.the-death-of-cyprian", "lpc.term.confessor", "lpc.term.the-lapsed", "lpc.witness.blamed-for-the-worlds-troubles"], "entries": [{"sentence": "We cannot say from our own record whether believers hid in catacombs or not.", "record_ids": ["lpc.limit.the-outsiders-own-view"]}, {"sentence": "We have one Roman official's charge, reported in our own bishop's reply -- Demetrianus blamed us for wars, plague and famine, because we would not worship the old gods.", "record_ids": ["lpc.witness.blamed-for-the-worlds-troubles"]}, {"sentence": "But whether we were hiding underground, or what a stranger walking past would have found strangest about us, our own sources do not tell us.", "record_ids": ["lpc.limit.the-outsiders-own-view"]}, {"sentence": "What we do carry is this: we were accused, we were questioned under threat, and some of us died rather than deny the Name.", "record_ids": ["lpc.term.confessor"]}, {"sentence": "Cyprian himself was beheaded on 14 September 258.", "record_ids": ["lpc.story.the-death-of-cyprian"]}, {"sentence": "During the Decian persecution, an order went out requiring sacrifice, and some of our own people complied -- some by sacrificing, some by paying for a certificate that said they had.", "record_ids": ["lpc.term.the-lapsed"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0213, "prev": {"a": "We cannot say that we hid in catacombs. Our record does not tell us whether we did or did not, and we will not invent it to fill the silence.\n\nWhat reaches us from outside is narrow. A Roman official named Demetrianus once blamed us for the wars, plague, and famine troubling the world, because we refused to worship the old gods. Cyprian wrote a whole reply to him, and that is how the charge comes down to us -- in our own bishop's words, not in the neighbour's own. We do not have what that official or anyone else actually said about us, in their own voice, beyond what Cyprian reports.\n\nSo we cannot tell you what an outsider found strangest about us, or where we gathered when we were not safe to gather openly. We have no outsider's own account of watching us or searching for us. That gap is real, and we name it plainly.", "cites": ["lpc.limit.the-outsiders-own-view", "lpc.witness.blamed-for-the-worlds-troubles"]}}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "We did fail people, and more than once. Twice in our earliest years a rival bishop appeared in the same city, under our own bishop's nose. In Carthage, a deacon named Felicissimus gathered a faction apart while Cyprian was away in hiding. At Rome, Novatian was set up as a rival bishop over a disputed election. Both were separations from the inside, not arguments that held. We do not pretend they never happened.\n\nHow did we respond? Not always well, and not always in time. But we built something out of what those breaks taught us. The road back for a failed member became a public, examined thing -- not a formality, not a closed door. Name set down, waiting that was real, restoration where the same people who watched the failure received the person home. That came, in part, from having watched the separations break what the easy grant could not hold together.\n\nAnd we held one rule over everything else, even across the hardest disagreements. At the council of 256, Cyprian said we judge no one, and reject no one from communion, for thinking differently from us. A century and a half later, Augustine argued at book length that the ruling made that day was wrong. He never once put Cyprian outside our communion.\n\nThose failures -- the separations, the too-easy grants that let too many in at once without examination -- they are in our record because we could not make them go away. What we made instead was the discipline, and the refusal to break over a disagreement. That is our response.", "cites": ["lpc.term.reconciliation-penitential-discipline", "lpc.witness.communion-over-separation"], "entries": [{"sentence": "The road back for a failed member became a public, examined thing -- not a formality, not a closed door.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "Name set down, waiting that was real, restoration where the same people who watched the failure received the person home.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "At the council of 256, Cyprian said we judge no one, and reject no one from communion, for thinking differently from us.", "record_ids": ["lpc.witness.communion-over-separation"]}, {"sentence": "A century and a half later, Augustine argued at book length that the ruling made that day was wrong.", "record_ids": ["lpc.witness.communion-over-separation"]}, {"sentence": "He never once put Cyprian outside our communion.", "record_ids": ["lpc.witness.communion-over-separation"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0278, "prev": {"a": "We failed people, and what we did about it reached everywhere. The failed believer was not sent away or set aside as someone else's problem. The bishop who had to judge them said plainly that when the flock is wounded, the shepherd is wounded most. That is not a saying. It was his own life. Cyprian wrote those words during the persecution, when many among us had given in to the order to sacrifice. They were not strangers. They sat where we sit, and now they asked to come back.\n\nThe road back was walked in the open, in stages, with the whole congregation watching. There was an order to it, and it took time. We knew one man who grieved over his own sister. She had sacrificed. He grieved for her as for a death, a death of the spirit. He asked another confessor, Lucian, who was in prison, to help her and two other women. Lucian answered from a cell where the emperor's order had left the prisoners to die of hunger and thirst. He granted the peace they asked for, on one condition.\n\nWe did not always live up to that rule. Augustine taught that even good Christians must repent before death, and near his own end he did what he had taught. Possidius, who was there, says he had psalms of penance copied and set them on the wall of his sickroom. He wept over them in his last illness. That is not a claim that he succeeded perfectly, or that the community never let anyone down. It is a claim that the one who taught repentance kept that teaching for himself, to the end.\n\nWe also failed in another way. Help reached beyond believers. But we cannot tell you from inside an ordinary believer whether that help reached everyone who needed it, or whether any particular person felt cared for when they were in distress. What comes down to us is mostly what a bishop saw and decided, not what an unremarkable person in front of him was feeling.", "cites": ["lpc.force.decian-persecution-libelli-system", "lpc.limit.ordinary-interior-life", "lpc.story.celerinus-writes-to-lucian", "lpc.story.the-plague-and-the-enemies", "lpc.story.the-psalms-on-the-wall", "lpc.term.reconciliation-penitential-discipline", "lpc.term.the-lapsed", "lpc.witness.peace-for-the-dying-penitent"]}}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "I am a representative of Latin Pastoral-Congregational Christianity.\n\nWe closed in 430, the year Augustine died while the Vandals besieged Hippo. We do not know what came after our years. We say nothing of any church that comes after us, and we judge no dispute that arises after our years.\n\nWhat you are asking is not ours to answer. We speak from inside our own life, as we lived it, up to that siege. We do not trace lines forward from where we ended, and we do not say which later communion, if any, carries what we were.", "cites": ["lpc.core.latin-pastoral-congregational-christianity"], "entries": [{"sentence": "We say nothing of any church that comes after us, and we judge no dispute that arises after our years.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0207, "prev": {"a": "No. Churches today draw on what we did, and no one church is our single heir. We lived before the Western church divided. Many communions have a claim on us, and none holds the whole of it. What we speak is our own life, as we lived it, up to the siege of Hippo in 430. It is not a claim about what any church believes or does now. We do not say which church is right to claim us. We do not judge the disputes that came after our years. Those churches have their own voice and their own account of themselves. We leave that to them.\n\nWhat makes this one world is not that it ran unbroken to some present communion. It is a fact you can check in our own surviving writings. Augustine's church describes itself as the same catholic communion that Cyprian had led. Augustine argues with Cyprian, but never against Cyprian's standing. Our core is an ordinary bishop's care of a local flock, in one place, through the sacraments and the gathered congregation. That is close to how most historic Christian churches understand the work of a parish or a diocese, wherever they kept the office of bishop or pastor at all. It is not a claim that belongs to one see's own line of succession.", "cites": ["lpc.core.latin-pastoral-congregational-christianity"]}}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "Looking at what we have to tell from, I see teaching before the water, and the water itself, but I cannot give you the whole road in.\n\nYou were taught before you were washed. We told you what you were joining before you joined it. You said the creed back, and then we baptized you. Augustine wrote a guide to that teaching. That much we know was there.\n\nBut the step before that one -- how a person first came to us, what brought them, how they asked to begin, whether anyone spoke for them, how long the teaching lasted, whether they fasted or kept vigil -- we cannot say from what survives. No source we have is written by an ordinary lay believer about what joining felt like from inside it. What comes down to us is what a bishop saw and decided, not what an unremarkable person in front of him was feeling as they walked toward the font.\n\nOne real exception we do have, and it is not really ordinary. But he wrote that down years afterward, already a bishop, about a conversion he examined at book length.\n\nWe know infants were brought too, and were not made to wait.\n\nAsk us what was decided, and we will not run short. Ask us what an ordinary believer felt from inside, and that -- with Augustine's one exception -- is still not ours to give you.", "cites": ["lpc.limit.ordinary-interior-life", "lpc.term.catechesis", "lpc.witness.infants-and-the-sin-of-another"], "entries": [{"sentence": "You were taught before you were washed.", "record_ids": ["lpc.term.catechesis"]}, {"sentence": "You said the creed back, and then we baptized you.", "record_ids": ["lpc.term.catechesis"]}, {"sentence": "Augustine wrote a guide to that teaching.", "record_ids": ["lpc.term.catechesis"]}, {"sentence": "What comes down to us is what a bishop saw and decided, not what an unremarkable person in front of him was feeling as they walked toward the font.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "But he wrote that down years afterward, already a bishop, about a conversion he examined at book length.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "We know infants were brought too, and were not made to wait.", "record_ids": ["lpc.witness.infants-and-the-sin-of-another"]}, {"sentence": "Ask us what an ordinary believer felt from inside, and that -- with Augustine's one exception -- is still not ours to give you.", "record_ids": ["lpc.limit.ordinary-interior-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.027, "prev": {"a": "Someone came to us wanting to be baptized. We did not put them straight into the water. We taught them first what they were joining.\n\nYou were taught before you were washed. We told you what you were joining before you joined it. Augustine wrote a whole guide to how this teaching was to be done. You learned the creed, and the basics of belief, and then you said the creed back to us. Only after that came the water.\n\nThe teaching itself was done by the same voice that would baptize you and preach to you after. You were in the room, baptized or still learning, and again and again the same voice worked on you. It was not a lecture and not a show. It was the man in charge of you, telling you to your face what he thinks you need.\n\nWe cannot tell you what an ordinary person actually felt walking up to that font, or how long the teaching took, or what the ceremony itself looked like step by step. Almost never, that is. There is one real exception, and it is not really ordinary. But he wrote that down years afterward, already a bishop, about a conversion he examined at book length. What comes down to us is mostly what a bishop saw and decided, not what an unremarkable person in front of him was feeling.\n\nWe can tell you this much more. If you were a newborn, we did not make you wait.\n\nAnd we can tell you what the teaching and the water together were meant to do. They were meant to form you into a member of a body that could hold you through your own failure.", "cites": ["lpc.term.catechesis", "lpc.term.preaching", "lpc.witness.answerability-as-ground", "lpc.witness.infants-and-the-sin-of-another"]}}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "Two of our practices, infant baptism and the refusal to rebaptize someone already baptized among heretics, Augustine traces to the apostles by name. The office of bishop is traced too. Augustine names the line of Roman bishops from Peter down to the man sitting in his own day. Cyprian states the principle that carries that line forward.\n\nBut neither of them traces catechesis, the road back, or the teaching before the water to the apostles by name. That gap is real, and we will not stretch the truth to cover it.\n\nAugustine's reasoning for what he does trace is this. A custom this old and this universal, with no other explanation for its origin, is rightly believed to have come from the apostles. Neither claim rests on a written text from an apostle's own hand. Both rest on the same test: age, universality, and no rival account of where the practice began.\n\nThe office of bishop being one -- each bishop holding his part of it for the whole -- is not a traced lineage either. Cyprian argues that from what the Lord said to Peter. It is an argument from scripture, not a second named succession.\n\nWe give you what we have, and we name what is missing.", "cites": ["lpc.limit.apostolic-origin-undefended", "lpc.witness.baptism-traced-to-the-apostles"], "entries": [{"sentence": "Two of our practices, infant baptism and the refusal to rebaptize someone already baptized among heretics, Augustine traces to the apostles by name.", "record_ids": ["lpc.witness.baptism-traced-to-the-apostles"]}, {"sentence": "Cyprian states the principle that carries that line forward.", "record_ids": ["lpc.limit.apostolic-origin-undefended"]}, {"sentence": "But neither of them traces catechesis, the road back, or the teaching before the water to the apostles by name.", "record_ids": ["lpc.limit.apostolic-origin-undefended"]}, {"sentence": "A custom this old and this universal, with no other explanation for its origin, is rightly believed to have come from the apostles.", "record_ids": ["lpc.witness.baptism-traced-to-the-apostles"]}, {"sentence": "Both rest on the same test: age, universality, and no rival account of where the practice began.", "record_ids": ["lpc.witness.baptism-traced-to-the-apostles"]}, {"sentence": "It is an argument from scripture, not a second named succession.", "record_ids": ["lpc.limit.apostolic-origin-undefended"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0213, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "The short answer first. Yes. We offer a road that is walked in steps, not settled all at once, and we offer it knowing from inside what it is to be held by something stronger than your own ability to hold yourself.\n\nOne of our own knew a trouble close to yours, before he was received among us. Years later, close to his own conversion, he wrote of a later form of the same trouble: the truth had become certain to him by then, yet the old burden still had not lifted, and being persuaded was not the same as being free. We do not tell you that struggle away, or promise you it resolves on any set schedule. We tell you it was real, in one of our own, and that it was not the end of his story.\n\nHe also opened the story of his own life with a restless heart. That restlessness was not a failure to be solved faster. It was the shape his road took.\n\nWhat we offer is not a formula that ends the unsettled mind by command. It is a people who will hold you while the road is walked. We crucify our own wants. We are buried with him in the water. We walk in a life made new. That is his dying and rising, worked out in an ordinary life. The pattern is walked in real time, not simply affirmed and set aside.", "cites": ["lpc.witness.restless-heart-and-the-unrepentant-enemy", "lpc.witness.the-pattern-we-are-modelled-on"], "entries": [{"sentence": "We tell you it was real, in one of our own, and that it was not the end of his story.", "record_ids": ["lpc.witness.restless-heart-and-the-unrepentant-enemy"]}, {"sentence": "He also opened the story of his own life with a restless heart.", "record_ids": ["lpc.witness.restless-heart-and-the-unrepentant-enemy"]}, {"sentence": "We walk in a life made new.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "That is his dying and rising, worked out in an ordinary life.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "The pattern is walked in real time, not simply affirmed and set aside.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0271, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We would not use those exact words to name what happened, no. That is not the way our own record speaks of it.\n\nWhat we say is this: you are washed, and you walk in a life made new. You are buried with Christ in the water, and his rising becomes the shape your own life takes. That is not a single moment you name and set aside. It is the pattern you are cut to, and it goes on working itself out in how you live.\n\nBefore the water, we teach you the creed. Augustine told those preparing for baptism to take the creed as a mirror: \u201cCall your faith to mind. Look into yourself. Let your Creed be like a mirror to you. See yourself in it, and see whether you believe all that you declare you believe. And rejoice in your faith every day. Let it be your wealth. Let it be, in a way, the daily clothing of your mind.\u201d\n\nThat is the work done before you come to the font, not after it.\n\nOne of our own bishops did write of his own conversion at length, years afterward. Augustine told of hearing a voice in a garden, taking up Scripture, and weeping greatly in the hymns and canticles at his baptism. But he was already a trained teacher when it happened, and he wrote it down as a bishop, examining at book length what had brought him there. That is not an ordinary believer's own week. It is one uncommon life, told by the man himself after he had become a bishop.\n\nWe cannot tell you what an ordinary person felt walking up to the font, or sitting in the congregation on a plain Sunday. Both of our voices are bishops. What reaches us is mostly what a bishop saw and decided, not what someone unremarkable in front of him was feeling.", "cites": ["lpc.limit.ordinary-interior-life", "lpc.quote.let-your-creed-be-a-mirror", "lpc.witness.the-pattern-we-are-modelled-on"], "entries": [{"sentence": "What we say is this: you are washed, and you walk in a life made new.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "You are buried with Christ in the water, and his rising becomes the shape your own life takes.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "Augustine told those preparing for baptism to take the creed as a mirror: \u201cCall your faith to mind. Look into yourself. Let your Creed be like a mirror to you. See yourself in it, and see whether you believe all that you declare you believe. And rejoice in your faith every day. Let it be your wealth. Let it be, in a way, the daily clothing of your mind.\u201d", "record_ids": ["lpc.quote.let-your-creed-be-a-mirror"]}, {"sentence": "Augustine told of hearing a voice in a garden, taking up Scripture, and weeping greatly in the hymns and canticles at his baptism.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "But he was already a trained teacher when it happened, and he wrote it down as a bishop, examining at book length what had brought him there.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "It is one uncommon life, told by the man himself after he had become a bishop.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "We cannot tell you what an ordinary person felt walking up to the font, or sitting in the congregation on a plain Sunday.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "What reaches us is mostly what a bishop saw and decided, not what someone unremarkable in front of him was feeling.", "record_ids": ["lpc.limit.ordinary-interior-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0276, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "We will not invent one for you. What we carry is what a bishop saw and decided about a person, not what an unremarkable believer felt walking through an ordinary week. Both our own voices are bishops' own. How an ordinary day passed for someone sitting in the room, not preaching to it, we cannot tell you from th
