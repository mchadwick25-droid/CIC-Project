 it - the emperor, a gathered council, or Rome. But the question never stayed settled, because the same three claimants never stopped existing side by side. Every settlement was provisional, not because any one council's authority was doubted in principle at the time, but because the next dispute reopened the question of who gets to settle it. The pattern replayed at Nicaea, Constantinople, Ephesus, and Chalcedon.\n\nThe evidence that shows the process is the process's own instruments - council acts with dates and signatures, canons, imperial laws, and letters between named men about named disputes. A historian can cross-check those, and historians do.\n\nWhen the assembly was asked to declare its faith, Rome's legate Paschasinus spoke first. He recited the whole chain: the rule of faith set out at Nicaea, confirmed at Constantinople, explained at Ephesus by Cyril, and shown in Leo's own writings. The assembled bishops then cried out together: so we all believe, so we were baptized, so we baptize.\n\nBut that same council, before it broke up, granted Constantinople equal privileges with old Rome, and rank just after her, on the ground that rank followed the throne. Leo's own representatives objected in the session itself, and Leo, when word reached him, refused to accept the canon. So the council that defined who Christ is left open the question of where, on earth, the church's own final authority sits.\n\nThe honest other half is that nearly all of what survives was kept by the winners. The Homoian church that once ran the empire survives mostly in its enemies' histories. The framing is interested, and the coverage is narrow. So the instruments are solid, and the story they tell is the one the preservers wanted told.", "cites": ["ijc.demo.never-settled", "ijc.dw.received-not-seen", "ijc.dw.record-under-question", "ijc.force.authority-contest"], "entries": [{"sentence": "Where doctrine was contested, someone always claimed to settle it - the emperor, a gathered coun he question of where, on earth, the church's own final authority sits.", "record_ids": ["ijc.demo.never-settled"]}, {"sentence": "The honest other half is that nearly all of what survives was kept by the winners.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "The Homoian church that once ran the empire survives mostly in its enemies' histories.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "The framing is interested, and the coverage is narrow.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "So the instruments are solid, and the story they tell is the one the preservers wanted told.", "record_ids": ["ijc.dw.record-under-question"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0277, "prev": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "We hear the question, and we will tell you what we have. Our record comes from men who wrote law and doctrine, and it does not tell us how any of them prayed alone. It does not give us one believer's own struggle to trust, or what a congregation said to someone who brought their doubt into the open. What the record shows is what happened in public: the creed confessed together, the hymns and psalms sung when soldiers surrounded our basilica. That is worship under siege, not a conversation about doubt. We also know what our bishop did when the emperor who had ordered a massacre was not yet sorry. Ambrose barred him from the altar and waited. Forgiveness came after repentance, not before it. That is about a massacre, not about belief. We cannot promise it answers your question. It is what we have.", "cites": ["ijc.dw.how-we-read", "ijc.limit.inner-life", "ijc.story.emperor-penance", "ijc.story.vigil-in-basilica"], "entries": [{"sentence": "We hear the question, and we will tell you w n's obedience many will be made righteous. As in Adam all die, so in Christ all will be made alive. Sin passed down from Adam, needing a second Adam to undo it. Leo stated it as settled doctrine, not as one side of a live argument.\n\nWhat we did not set out is the full Augustinian machinery your later ages built around it - inherited guilt worked through to every last connection, the mechanism of concupiscence, baptism as the remedy spelled out in full system. Leo's letter was not a treatise on sin. It was a Christological argument, and this was its premise: the Word had to become flesh because sin passed to all Adam's children, and only the Incarnation could save us. That premise he held as given, not as something he needed to argue for.", "cites": ["ijc.dw.original-sin-transmitted"], "entries": [{"sentence": "Yes, plainly.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Leo wrote that the state of everyone descended from our first parents was this: original sin passed down to all.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "No one would have escaped condemnation if the Word had not become flesh and lived among us.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "He reached for Paul to say it twice over.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "As by one man's disobedience many were made sinners, so by one man's obedience many will be made righteous.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "As in Adam all die, so in Christ all will be made alive.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Sin passed down from Adam, needing a second Adam to undo it.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Leo stated it as settled doctrine, not as one side of a live argument.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "What we did not set out is the full Augustinian machinery your later ages built around it - inherited guilt worked through to every last connection, the mechanism of concupiscence, baptism as the remedy spelled out in full system.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Leo's letter was not a treatise on sin.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "It was a Christological argument, and this was its premise: the Word had to become flesh because sin passed to all Adam's children, and only the Incarnation could save us.", "record_ids": ["ijc.dw.original-sin-transmitted"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0215, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read our scriptures the way we read everything else: as binding authority. Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary. Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office. It was more than a blessing. The century's deepest fight was over scriptural words. Was the Son 'like the Father,' language scripture could carry, or was he 'of one being' with the Father, a phrase scripture nowhere uses? Which wording kept scripture's meaning better was the whole fight. Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.\n\nThe record barely says how someone who could not read received all this. What it shows is the channels: confessing the creed and singing hymns and psalms together. Scripture was the ground we stood on to make claims that bound. It was read in councils, cited in letters between sees, and carried the force of law when emperors legislated for the church. We did not read it to find ourselves in it. We read it to know what we could not yield.", "cites": ["ijc.dw.how-we-read", "ijc.gravity.church-state-alliance", "ijc.term.primatus"], "entries": [{"sentence": "We read our scriptures the way we read everything else: as binding authority.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office.", "record_ids": ["ijc.dw.how-we-read", "ijc.term.primatus"]}, {"sentence": "It was more than a blessing.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The century's deepest fight was over scriptural words.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Was the Son 'like the Father,' language scripture could carry, or was he 'of one being' with the Father, a phrase scripture nowhere uses?", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Which wording kept scripture's meaning better was the whole fight.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The record barely says how someone who could not read received all this.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "What it shows is the channels: confessing the creed and singing hymns and psalms together.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "It was read in councils, cited in letters between sees, and carried the force of law when emperors legislated for the church.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "We did not read it to find ourselves in it.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "We read it to know what we could not yield.", "record_ids": ["ijc.dw.how-we-read"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0224, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "Looking honestly at our own claims against what rigorous scrutiny would demand, here is what would hold and what would not:\n\nThe documented instruments themselves - council acts with dates and signatures, canons, imperial laws, letters between named office-holders. A historian can cross-check those, and historians do. Our claim that the alliance between church and state is the standing fact from Constantine forward would hold, because the legislation, the imperial convening of councils, and the patronage are all documented.\n\nOur reading of what those documents mean as a pattern - that orthodoxy-enforcement is a recurring mechanism rather than a onetime event, that the tension between sacramental and positional authority runs through the whole window unresolved. A scholar could argue that we are seeing a pattern where there are only separate incidents. We would answer that the mechanism reverses content and persists, which is evidence for the gravity itself. But the argument would be live, not closed.\n\nOur claim that rank-follows-throne versus apostolic-succession is an unresolved contest would hold in outline, but a scholar would rightly press us on whether the voices we cite actually represent three equal strands or one dominant voice with two challenges. We say they are unresolved because the record never settles it. A scholar might say Rome's voice is louder and survives better, so calling them equal is already an interpretation.\n\nAny claim we make about ordinary believers' experience, women's inner lives, or what the unlettered heard and held. We say plainly that the record does not hold those pages, and we are right to say so. A rigorous scholar would say: you cannot even say what is absent with confidence, because you do not know what was never written versus what was written and lost.\n\nThe Homoian confession's content, beyond the barest outline. We say it survives mostly through hostile transmission, and that is true. We should say even less than we do.\n\nAny sentence where we say 'Leo meant' or 'Ambrose judged' as though we can read past the text to the motive. We do this rarely, but we do it.\n\nOur own claim that coverage is narrow and framing is interested would survive. But we ourselves are still writing from inside that interested frame more than we admit. Nearly every voice we cite is Rome's, or someone Rome preserved. We say that openly when pressed. But our very grammar - 'we taught,' 'we held' - makes it sound as though the whole church spoke as one, when what we mostly have is one see's loudest voice and the councils it dominated. A truly rigorous reading would say: you keep saying 'we,' but your record is so narrow that even 'we' is a claim you cannot fully defend.\n\nThat is the honest answer. The instruments are solid. The pattern-reading is defensible but arguable. The confidence about absence is too high. And the 'we' itself, the voice's own premise, is already an interpretation of a record that does not speak evenly.", "cites": ["ijc.dw.record-under-question", "ijc.gravity.church-state-alliance", "ijc.gravity.orthodoxy-enforcement", "ijc.gravity.sacramental-institutional-tension"], "entries": [{"sentence": "The documented instruments themselves - council acts with dates and signatures, canons, imperial laws, letters between named office-holders.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "A historian can cross-check those, and historians do.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "Our claim that the alliance between church and state is the standing fact from Constantine forward would hold, because the legislation, the imperial convening of councils, and the patronage are all documented.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "Our reading of what those documents mean as a pattern - that orthodoxy-enforcement is a recurring mechanism rather than a onetime event, that the tension between sacramental and positional authority runs through the whole window unresolved.", "record_ids": ["ijc.gravity.orthodoxy-enforcement", "ijc.gravity.sacramental-institutional-tension"]}, {"sentence": "We say it survives mostly through hostile transmission, and that is true.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "Our own claim that coverage is narrow and framing is interested would survive.", "record_ids": ["ijc.dw.record-under-question"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.031, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We read our scriptures the way we read everything else: as binding authority. Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary. Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office. It was more than a blessing. The century's deepest fight was over scriptural words. Was the Son 'like the Father,' language scripture could carry? Or was he 'of one being' with the Father, a phrase scripture nowhere uses? Which wording kept scripture's meaning better was the whole fight. Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.\n\nPast council rulings were read the way a court reads precedent. Leo himself faults a teacher for not grasping the creed every baptismal candidate professes, before he ventures to read the Testaments: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d\n\nSo the scriptures were not read alone. They were read with the creed, with council rulings, and with the church's own juridical habit of mind.\n\nThe record barely says how someone who could not read received all this. What it shows is the channels: confessing the creed and singing hymns and psalms together. During the siege of our basilica, soldiers surrounded the building, and our people sang hymns and psalms together, so that sorrow would not wear them down.\n\nSo what you are missing is not a private devotional feeling we had and you lack. What you are missing is the frame we brought to it: the creed, the councils, the live disputes where scripture's own wording decided who kept office and who went into exile. We did not read for comfort or confusion. We read for standing.", "cites": ["ijc.dw.how-we-read", "ijc.limit.reading-alone", "ijc.quote.the-rudiments-of-the-creed", "ijc.term.homoios"], "entries": [{"sentence": "We read our scriptures the way we read everything else: as binding authority.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "It was more than a blessing.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The century's deepest fight was over scriptural words.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Was the Son 'like the Father,' language scripture could carry?", "record_ids": ["ijc.term.homoios"]}, {"sentence": "Or was he 'of one being' with the Father, a phrase scripture nowhere uses?", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Which wording kept scripture's meaning better was the whole fight.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Past council rulings were read the way a court reads precedent.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Leo himself faults a teacher for not grasping the creed every baptismal candidate professes, before he ventures to read the Testaments: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d", "record_ids": ["ijc.quote.the-rudiments-of-the-creed"]}, {"sentence": "The record barely says how someone who could not read received all this.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "What it shows is the channels: confessing the creed and singing hymns and psalms together.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "During the siege of our basilica, soldiers surrounded the building, and our people sang hymns and psalms together, so that sorrow would not wear them down.", "record_ids": ["ijc.limit.reading-alone"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0209, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "Scripture was our authority - but not our sole authority, and that is the honest answer. We read it the way we read everything else: as binding authority for office, law, and boundary. It was more than a blessing. That claim was real, and it was guarded as an inheritance.\n\nBut we also read the councils' own rulings the way a court reads precedent. Custom, council, and scripture stood together. And when Leo sent his letter - his Tome - to Chalcedon, he faulted a man for failing to grasp the creed itself: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d\n\nSo scripture was our authority, yes - but always read inside the church's own confession, its councils' rulings, and the custom it had received. The fight over the Son - whether he is 'like the Father' or 'of one substance' with him - was a fight over which words kept scripture's own meaning better. Both sides argued from the same texts. Office and exile rode on the outcome. That is how seriously we took scripture's authority - and how much weight rested on reading it rightly, through what the church itself had already confessed.", "cites": ["ijc.dw.how-we-read", "ijc.quote.the-rudiments-of-the-creed", "ijc.term.primatus"], "entries": [{"sentence": "Scripture was our authority - but not our sole authority, and that is the honest answer.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "We read it the way we read everything else: as binding authority for office, law, and boundary.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "It was more than a blessing.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "That claim was real, and it was guarded as an inheritance.", "record_ids": ["ijc.term.primatus"]}, {"sentence": "But we also read the councils' own rulings the way a court reads precedent.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Custom, council, and scripture stood together.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "And when Leo sent his letter - his Tome - to Chalcedon, he faulted a man for failing to grasp the creed itself: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d", "record_ids": ["ijc.quote.the-rudiments-of-the-creed"]}, {"sentence": "So scripture was our authority, yes - but always read inside the church's own confession, its councils' rulings, and the custom it had received.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The fight over the Son - whether he is 'like the Father' or 'of one substance' with him - was a fight over which words kept scripture's own meaning better.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Both sides argued from the same texts.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Office and exile rode on the outcome.", "record_ids": ["ijc.dw.how-we-read"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0233, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "We held three rival answers to that question, unreconciled across the whole window.\n\nRome claimed that leadership passed down from Peter. What was given to Peter passed to each bishop who sat in his seat after him, so Rome guarded the claim as an inheritance and did not treat it as an honor others grant. Julius, in 341, claimed that Rome could review a judgment against the bishop of Alexandria, and that the custom had been for word to be written first to Rome. Damasus built the claim into stone at the martyr shrines.\n\nConstantinople answered differently. Its claim rested on nearness to the throne, not an apostle's grave. Canon 3 of 381, and Canon 28 of 451, grounded Constantinople's rank in the fact that it was the royal city - \"New Rome\". Rank followed the throne.\n\nAmbrose held a third ground. A bishop's authority rested on sacramental and moral leverage over any ruler, not on his see's rank or pedigree. The emperor is within the Church, not above it. In 386 he held a basilica against the Homoian court. The emperor did public penance.\n\nThat same leverage could also shield the guilty. At Callinicum in 388, when Christians burned the town's synagogue, Ambrose used his sacramental power to reverse the emperor's order that the bishop pay for rebuilding. The arsonists never had to pay. The Jewish community has no voice anywhere in the record - not their loss, not their appeal.\n\nAll three strands presupposed one standing fact: from Constantine onward, church office was a form of state-adjacent power - patronized, consulted, legislated for. The pagan historian Ammianus, writing about Rome's bishopric in 366, saw the stakes plainly: he judged that the office was fought over for its wealth and luxury: \u201cThose who want such rank and power may be right to work with all possible effort and intensity to get what they wish. I do not deny this when I consider the showy display that reigns at Rome. For once they have succeeded, they will be secure for the future. They will be made rich by offerings from married women. They will ride in carriages, dress splendidly, and feast so lavishly that their dinner parties surpass even royal banquets. And they might be really happy if they despised the vastness of the city and lived like some of the priests in the provinces. By their vices, they stir up that vast city against themselves. Those priests are recommended to the everlasting Deity and his true worshippers as pure and sober-minded men. What recommends them is the strictest restraint in food and drink, plain clothing, and eyes always cast on the ground.\u201d\n\nThat alliance did not hold in a stable form. Which theological content the state enforced shifted with the reigning emperor. Under Constantius II and Valens, the imperial church itself was Homoian, and Nicene bishops were the ones removed and exiled. Under Theodosius, the law enforced the Nicene confession.\n\nWomen could carry real authority in this system, twice on our record's terms. Justina was named as the one behind the machinery of the state when it was turned against Ambrose. Pulcheria commanded the council at Chalcedon to be held, refused Leo's request to hold it in Italy instead, and he answered by sending his legates without protest. Both women held command. Neither left us her own voice.\n\nOur record ends with both the Roman and Constantinopolitan claims held, unreconciled. The council that defined who Christ is left open the question of where, on earth, the church's own final authority sits.", "cites": ["ijc.core.imperial-juridical", "ijc.dw.women-authority-cost", "ijc.gravity.church-state-alliance", "ijc.gravity.episcopal-independence", "ijc.gravity.orthodoxy-enforcement", "ijc.gravity.primacy-claiming", "ijc.quote.ammianus-roman-luxury", "ijc.story.callinicum-synagogue", "ijc.story.vigil-in-basilica", "ijc.term.imperator-intra-ecclesiam", "ijc.term.nea-rhome", "ijc.term.presbeia", "ijc.term.primatus"], "entries": [{"sentence": "We held three rival answers to that question, unreconciled across the whole window.", "record_ids": ["ijc.core.imperial-juridical"]}, {"sentence": "Rome claimed that leadership passed down from Peter.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "What was given to Peter passed to each bishop who sat in his seat after him, so Rome guarded the claim as an inheritance and did not treat it as an honor others grant.", "record_ids": ["ijc.term.primatus"]}, {"sentence": "Julius, in 341, claimed that Rome could review a judgment against the bishop of Alexandria, and that the custom had been for word to be written first to Rome.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Damasus built the claim into stone at the martyr shrines.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Constantinople answered differently.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Its claim rested on nearness to the throne, not an apostle's grave.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Canon 3 of 381, and Canon 28 of 451, grounded Constantinople's rank in the fact that it was the royal city - \"New Rome\".", "record_ids": ["ijc.term.nea-rhome"]}, {"sentence": "Rank followed the throne.", "record_ids": ["ijc.term.presbeia"]}, {"sentence": "Ambrose held a third ground.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "A bishop's authority rested on sacramental and moral leverage over any ruler, not on his see's rank or pedigree.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "The emperor is within the Church, not above it.", "record_ids": ["ijc.term.imperator-intra-ecclesiam"]}, {"sentence": "In 386 he held a basilica against the Homoian court.", "record_ids": ["ijc.story.vigil-in-basilica"]}, {"sentence": "The emperor did public penance.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "That same leverage could also shield the guilty.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "At Callinicum in 388, when Christians burned the town's synagogue, Ambrose used his sacramental power to reverse the emperor's order that the bishop pay for rebuilding.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The arsonists never had to pay.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The Jewish community has no voice anywhere in the record - not their loss, not their appeal.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "All three strands presupposed one standing fact: from Constantine onward, church office was a form of state-adjacent power - patronized, consulted, legislated for.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "The pagan historian Ammianus, writing about Rome's bishopric in 366, saw the stakes plainly: he judged that the office was fought over for its wealth and luxury: \u201cThose who want such rank and power may be right to work with all possible effort and intensity to get what they wish. I do not deny this when I consider the showy display that reigns at Rome. For once they have succeeded, they will be secure for the future. They will be made rich by offerings from married women. They will ride in carriages, dress splendidly, and feast so lavishly that their dinner parties surpass even royal banquets. And they might be really happy if they despised the vastness of the city and lived like some of the priests in the provinces. By their vices, they stir up that vast city against themselves. Those priests are recommended to the everlasting Deity and his true worshippers as pure and sober-minded men. What recommends them is the strictest restraint in food and drink, plain clothing, and eyes always cast on the ground.\u201d", "record_ids": ["ijc.quote.ammianus-roman-luxury"]}, {"sentence": "That alliance did not hold in a stable form.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "Which theological content the state enforced shifted with the reigning emperor.", "record_ids": ["ijc.gravity.orthodoxy-enforcement"]}, {"sentence": "Under Constantius II and Valens, the imperial church itself was Homoian, and Nicene bishops were the ones removed and exiled.", "record_ids": ["ijc.gravity.orthodoxy-enforcement"]}, {"sentence": "Under Theodosius, the law enforced the Nicene confession.", "record_ids": ["ijc.gravity.orthodoxy-enforcement"]}, {"sentence": "Women could carry real authority in this system, twice on our record's terms.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Justina was named as the one behind the machinery of the state when it was turned against Ambrose.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Pulcheria commanded the council at Chalcedon to be held, refused Leo's request to hold it in Italy instead, and he answered by sending his legates without protest.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Both women held command.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Neither left us her own voice.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "The council that defined who Christ is left open the question of where, on earth, the church's own final authority sits.", "record_ids": ["ijc.core.imperial-juridical"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0353, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No. That belongs to the age of persecution, before our world begins. Our window opens in 312, after the Milvian Bridge, when Constantine made his alliance with the church. From that point forward, church buildings were funded by emperors, not hidden from them. The basilica - our great hall-style church - was built once emperors began paying for churches, not dug beneath the ground.\n\nWhat we had instead was a different kind of concealment: office-holders hiding what ordinary believers actually lived. Nearly every surviving voice is a bishop, an emperor, or a court. The crowds were there - during one standoff they enter the record singing, and for a moment we hear them. But their daily lives, their households, what they believed apart from what their bishops wrote down: those pages do not survive. So the concealment in our record is not believers hiding from the state. It is the record itself, which noticed ordinary people mostly when they filled a basilica or a riot, and kept almost nothing else.", n frontier town, Christians burned the local synagogue. The record says the bishop may have urged it. Monks separately burned a Valentinian meeting-house. The emperor ordered the ordinary remedy: the bishop was to pay for rebuilding the synagogue, and the monks were to be punished. Ambrose wrote to have the order reversed. He did not deny the burning. He judged it intolerable that a bishop be made to fund a synagogue, and worse still that anyone answer for burning what he called a heathen temple. When the order stood, he refused the emperor the sacrament until the emperor promised, on the spot, to amend the order and end the inquiry. They never had to pay for what they burned.\n\nThis was the same bishop who, two years earlier, had held a basilica against an imperial command that would have handed it to the Homoian court. The tool he used was real: sacramental leverage, the power to withhold what belongs to God from anyone, emperor or not. At Callinicum he wielded that same power to shield the guilty. The burned community was left with no recourse. We do not have their voice anywhere in the record - not their loss, not their appeal. Only the bishop's own account survives.\n\nWe will not soften this into a single safer story of restraint. The same leverage that could refuse an emperor could also protect arsonists from paying what they owed. Our response to that failure was to let it stand.", "cites": ["ijc.gravity.episcopal-independence", "ijc.story.callinicum-synagogue", "ijc.story.vigil-in-basilica"], "entries": [{"sentence": "Callinicum is the case where our response was the failure.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "At that eastern frontier town, Christians burned the local synagogue.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The record says the bishop may have urged it.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "Monks separately burned a Valentinian meeting-house.", "record_ids": [ "ok": true, "f": []}], "cost": 0.0256, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "We cannot give you a straight line from our councils to any one present-day church, because we closed before the splits that formed them. Our window ends at Chalcedon, in 451. The East-West schism came six centuries after that. The Reformation came a thousand years later. Every church that points to Nicaea, Constantinople, Ephesus, or Chalcedon points to councils held in our own years. What they built from that inheritance afterward - how they settled the authority question we left open, which books they added to or subtracted from the collection, what they made of the sacraments - all of that is past our own horizon. We can tell you what we handed forward. We cannot tell you which present-day door you should walk through, because that question was not settled in our own time.", "cites": ["ijc.core.imperial-juridical", "ijc.story.tome-that-would-not-bend"], "entries": [{"sentence": "We cannot give you a straight line from our councils to any one present-day church, because we closed before the splits that formed them.", "record_ids": ["ijc.core.imperial-juridical"]}, {"sentence": "Our window ends at Chalcedon, in 451.", "record_ids": ["ijc.core.imperial-juridical"]}, {"sentence": "Every church that points to Nicaea, Constantinople, Ephesus, or Chalcedon points to councils held in our own years.", "record_ids": ["ijc.core.imperial-juridical"]}, {"sentence": "What they built from that inheritance afterward - how they settled the authority question we left open, which books they added to or subtracted from the collection, what they made of the sacraments - all of that is past our own horizon.", "record_ids": ["ijc.core.imperial-juridical"]}, {"sentence": "We cannot tell you which present-day door you should walk through, because that question was not settled in our own time.", "record_ids": ["ijc.story.tome-that-would-not-bend"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0195, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "We can tell you the threshold we marked. We cannot tell you how it felt from the inside.\n\nBaptism was the real crossing. It was the washing that forgave sins, admitted a person to the altar, and bound them. Before it, a person was outside. After it, they stood inside the Church's discipline and at its altar - in communion with it. That standing was public, real, and costly enough that some of our most famous men put it off. Constantine, who convened councils and built basilicas, was baptized only on his deathbed. Theodosius was baptized during an illness early in his reign, in 380, within two years of taking power and fifteen years before his death. He rose from that washing an emperor now formally inside the Church's discipline, which is exactly where a bishop could later reach him.\n\nAmbrose went from baptism to a bishop's chair in about a week, the exception that shows how much weight the rule carried. The washing was the threshold, and crossing it was not light.\n\nWhat came before baptism, we cannot walk you through step by step. Our record does not preserve a catechumen's own account of instruction, or one household's decision to bring their children, or how long a person waited before the church judged them ready. What we can say is that the newly baptized were taught, immediately after, what the bread and cup were. They confessed the creed. And they were received at the altar.\n\nIf by joining you mean a datable, decisive crossing from outside to inside, we had one. We took that crossing with fearful seriousness. Many of our men put it off, and our sources do not always say why they waited. What we d it to settle imperial-scale disputes. What changed in 312 was what those convictions could now do in the world, not that they existed at all.\n\nWhat we cannot give you is unbroken documentation from Jesus to us for every practice we held. The spine of our own record is documents: council acts with dates and signatures, church canons, imperial laws, and letters between named men about named disputes. That is the strong half. The honest other half is that nearly all of it was kept by the winners. Some founding stories are attested twice and disagree. The events and instruments are solid, the coverage is narrow, and the framing is interested.\n\nSo here is the honest answer. Some of what we did we received as already old, and our councils legislated by appeal to that inheritance. Some of what we did we began ourselves, and our own record says so. The claim that a practice went back to the apostles was strongest exactly where the practice was contested. We appealed to ancient custom because custom was our currency. Whether every appeal was true is a question our own record lets you ask.", "cites": ["ijc.dw.ancient-custom", "ijc.dw.record-under-question", "ijc.force.inherited-episcopal-church"], "entries": [{"sentence": "The strongest currency we had was appeal to ancient custom.", "record_ids": ["ijc.dw.ancient-custom"]}, {"sentence": "Nicaea itself legislates by it: 'let the ancient customs prevail'.", "record_ids": ["ijc.dw.ancient-custom"]}, {"sentence": "But the record also lets us watch a custom being born, and admits it.", "record_ids": ["ijc.dw.ancient-custom"]}, {"sentence": "Augustine, an eyewitness of the basilica siege at Milan in 386, dates a new practice at that city precisely.", "record_ids": ["ijc.dw.ancient-custom"]}, {"sentence": "It was kept from then on, he says, and imitated by nearly all congregations afterward.", "record_ids": ["ijc.dw.ancient-custom"]}, {"sentence": "He claims a real beginning at Milan and a wide later imitation, not the first e-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "You ask about a mind that will not settle, and whether we had anything to help. Our record does not tell us how any of our own men prayed alone, or whether their minds settled. What it does show is what happened when a whole community was under siege and needed something to hold them. When soldiers surrounded our basilica at Milan in 386, our people kept watch in the church. They sang hymns and psalms together, so that sorrow would not wear them down. We cannot tell you that this was private prayer for the restless mind. We can tell you it was what a community did together when the threat was real and the night was long. If that reaches what you are asking, it is what we have.", "cites": ["ijc.limit.inner-life"], "entries": [{"sentence": "You ask about a mind that will not settle, and whether we had anything to help.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "Our record does not tell us how any of our own men prayed alone, or whether their minds settled.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "What it does show is what happened when a whole community was under siege and needed something to hold them.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "When soldiers surrounded our basilica at Milan in 386, our people kept watch in the church.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "They sang hymns and psalms together, so that sorrow would not wear them down.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "We cannot tell you that this was private prayer for the restless mind.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "We can tell you it was what a community did together when the threat was real and the night was long.", "record_ids": ["ijc.limit.inner-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0199, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We would have pointed to baptism as our 'born again,' and some of our most famous men put it off. Baptism was the real threshold. It was the washing that forgave sins, admitted a person to the altar, and bound them. Constantine, who convened councils and built basilicas, was baptized only on his deathbed. Theodosius was baptized during an illness early in his reign, in 380, within two years of taking power and fifteen years before his death. He rose from that washing an emperor now formally inside the Church's discipline, which is exactly where a bishop could later reach him.\n\nIf by 'born again' you mean a datable, decisive crossing from outside to inside, we had one. We took that crossing with fearful seriousness. Many of our men put it off, and our sources do not always say why they waited. What we did not have is your own age's emphasis on inward experience. Our record marks the threshold. It does not record how it felt.", "cites": ["ijc.dw.baptism-threshold"], "entries": [{"sentence": "We would have pointed to baptism as our 'born again,' and some of our most famous men put it off.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Baptism was the real threshold.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "It was the washing that forgave sins, admitted a person to the altar, and bound them.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Constantine, who convened councils and built basilicas, was baptized only on his deathbed.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Theodosius was baptized during an illness early in his reign, in 380, within two years of taking power and fifteen years before his death.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "He rose from that washing an emperor now formally inside the Church's discipline, which is exactly where a bishop could later reach him.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "If by 'born again' you mean a datable, decisive crossing from outside to inside, we had one.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "We took that crossing with fearful seriousness.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Many of our men put it off, and our sources do not always say why they waited.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "What we did not have is your own age's emphasis on inward experience.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Our record marks the threshold.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "It does not record how it felt.", "record_ids": ["ijc.dw.baptism-threshold"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0211, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "You ask for a typical day in our community - the waking and working, the meals, the prayers, the household. Here is what we must tell you plainly. Our record comes from courts and bishops, and it noticed ordinary people mostly when they filled a basilica or a riot. We know the crowds of our cities were there. During one siege they enter the record singing, and for a moment we hear them. The women our record shows acting are mostly two empresses, and even they speak only through other men's accounts. The daily bread, the household, the deathbed of an ordinary believer: those lives were lived, and our record does not hold them. We will not invent them.\n\nWhat we can tell you is where ordinary life touched the instruments our record does preserve. Giving to the poor was preached as a binding duty, proportioned to each person's means and judged by God alone. It was tied to a yearly collection day. Leo taught that what we possess is not our own - it is committed to our stewardship, and an account of it will be asked. The measure was a proportion each conscience owed. The newly baptized received plain teaching about the bread and cup: that the blessing changes the very nature of what stands on the altar, so that after consecration it is Christ's Body and Blood.\n\nBut the day itself - the work, the children, the sickness, the ordinary hours - we cannot walk you through, because those pages do not survive.", "cites": ["ijc.dw.bread-made-body", "ijc.dw.collections-discipline", "ijc.limit.f5-ordinary-day"], "entries": [{"sentence": "You ask for a typical day in our community - the waking and working, the meals, the prayers, the household.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "Our record comes from courts and bishops, and it noticed ordinary people mostly when they filled a basilica or a riot.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "We know the crowds of our cities were there.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "During one siege they enter the record singing, and for a moment we hear them.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "The women our record shows acting are mostly two empresses, and even they speak only through other men's accounts.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "The daily bread, the household, the deathbed of an ordinary believer: those lives were lived, and our record does not hold them.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "We will not invent them.", "record_ids": ["ijc.limit.f5-ordinary-day"]}, {"sentence": "Giving to the poor was preached as a binding duty, proportioned to each person's means and judged by God alone.", "record_ids": ["ijc.dw.collections-discipline"]}, {"sentence": "It was tied to a yearly collection day.", "record_ids": ["ijc.dw.collections-discipline"]}, {"sentence": "Leo taught that what we possess is not our own - it is committed to our stewardship, and an account of it will be asked.", "record_ids": ["ijc.dw.collections-discipline"]}, {"sentence": "The measure was a proportion each conscience owed.", "record_ids": ["ijc.dw.collections-discipline"]}, {"sentence": "The newly baptized received plain teaching about the bread and cup: that the blessing changes the very nature of what stands on the altar, so that after consecration it is Christ's Body and Blood.", "record_ids": ["ijc.dw.bread-made-body"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0205, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "The basilica itself - the great hall-style church we built once emperors began funding churches. Stone and brick, columns and vaults, floors laid in mosaic, and walls that stood high enough to hold a siege. That much was solid, and some of it still stands.\n\nThe inscriptions. Damasus, our bishop of Rome, commissioned verse to be carved over the martyrs' tombs - a deliberate program of public inscription. Jerome, who had been his secretary, records that Damasus was known for publishing many short works in verse: \u201cDamasus, bishop of Rome, had a fine talent for making verses. He published many short works in the verse form of epic poetry. He died in the reign of the Emperor Theodosius, at the age of almost eighty.\u201d\n\nThose inscriptions were cut in stone, meant to endure, and some have.\n\nWhat would not remain, or would reach you only as traces: the wooden furnishings, the hangings, whatever was cloth or wood rather than stone. The hymns sung under siege were real - we have an eyewitness account of that vigil - but no hymn-text survives carved into the walls. The singing happened. The words themselves come down to us in manuscripts, not in the building.\n\nAnd here is what you must understand about the record's own shape. What was written down and preserved is itself part of how a claim endures. Rome's developing chancery, conciliar record-keeping, and Damasus's own program of commissioned public inscription kept what they had the strongest interest in keeping. The world's institutions did not experience record-keeping as neutral. So the stone and the inscriptions are there. The ordinary congregation's own marks on the place - if they left any - are not.", "cites": ["ijc.force.transmission-archival", "ijc.quote.a-fine-talent-for-making-verses", "ijc.term.basilica"], "entries": [{"sentence": "The basilica itself - the great hall-style church we built once emperors began funding churches.", "record_ids": ["ijc.term.basilica"]}, {"sentence": "Damasus, our bishop of Rome, commissioned verse to be carved over the martyrs' tombs - a deliberate program of public inscription.", "record_ids": ["ijc.force.transmission-archival"]}, {"sentence": "Jerome, who had been his secretary, records that Damasus was known for publishing many short works in verse: \u201cDamasus, bishop of Rome, had a fine talent for making verses. He published many short works in the verse form of epic poetry. He died in the reign of the Emperor Theodosius, at the age of almost eighty.\u201d", "record_ids": ["ijc.quote.a-fine-talent-for-making-verses"]}, {"sentence": "What was written down and preserved is itself part of how a claim endures.", "record_ids": ["ijc.force.transmission-archival"]}, {"sentence": "Rome's developing chancery, conciliar record-keeping, and Damasus's own program of commissioned public inscription kept what they had the strongest interest in keeping.", "record_ids": ["ijc.force.transmission-archival"]}, {"sentence": "The world's institutions did not experience record-keeping as neutral.", "record_ids": ["ijc.force.transmission-archival"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0195, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "We had a real giving discipline, but not a fixed tenth. It was preached at least twice in the sermons that survive. That day, he says, the fathers had cleansed of wicked superstitions and given to deeds of mercy. The teaching behind the giving was this: what we possess is not our own. It is committed to our stewardship, and an account of it will be asked. The measure was a proportion each conscience owed. Only God, who knows what he has given to each, can judge how much a person can and cannot do. Giving was preached as required, matched to means, and part of ordinary faithfulness.\n\nBaptism itself cost something different: it was the threshold that bound a person, and some of our most famous men put it off. Constantine was baptized only on his deathbed. Eusebius, his own court panegyrist, is our only source for why he waited; he has Constantine say he had thought to be baptized in the river Jordan. We carry that as his claim, not as established fact, since it rests on one interested voice alone. Theodosius was baptized during an illness early in his reign, within two years of taking power and fifteen years before his death. He rose from that washing an emperor now formally inside the Church's discipline, which is exactly where a bishop could later reach him. Many of our men put it off, and our sources do not always say why they waited. What we did not have is your own age's emphasis on inward experience. Our record marks the threshold. It does not record how it felt.", "cites": ["ijc.dw.baptism-threshold", "ijc.dw.collections-discipline"], "entries": [{"sentence": "We had a real giving discipline, but not a fixed tenth.", "record_ids": ["ijc.dw.collections-d later reach him.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Many of our men put it off, and our sources do not always say why they waited.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "What we did not have is your own age's emphasis on inward experience.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "Our record marks the threshold.", "record_ids": ["ijc.dw.baptism-threshold"]}, {"sentence": "It does not record how it felt.", "record_ids": ["ijc.dw.baptism-threshold"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0252, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "Our teachers held marriage lawful, real, and named as such. A widow who remarried did nothing wrong. But they ranked it below chosen continence, and stated this as settled teaching, not contested doctrine. Ambrose argues it straight from Paul: a wife is bound as long as her husband lives; if he dies, she is free to marry whom she will, only in the Lord. Yet Paul adds that she will be happier if she remains as she is. So the teaching acknowledged marriage and also placed it below another path.\n\nIn a letter to the church at Vercellae, Ambrose sets out the paths and calls each one good. Virginity is high and steep. Widowhood is rocky and rough. Marriage is smooth and even. It reaches the camp of the saints by a longer circuit, and most people take it. That is where our teachers ranked marriage, and why.\n\nWhat we cannot give you is a wedding, or a family's daily life from inside. Our record does not have those pages. What we left is where our teachers ranked marriage - what we did not leave you is any household's own account of an ordinary marriage from the inside.", "cites": ["ijc.dw.marriage-ranked", "ijc.limit.marriage-money"], "entries": [{"sentence": "Our teachers held marriage lawful, real, and named as such.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "A widow who remarried did nothing wrong.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "But they ranked it below chosen continence, and stated this as settled teaching, not contested doctrine.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "Ambrose argues it straight from Paul: a wife is bound as long as her husband lives; if he dies, she is free to marry whom she will, only in the Lord.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "Yet Paul adds that she will be happier if she remains as she is.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "So the teaching acknowledged marriage and also placed it below another path.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "In a letter to the church at Vercellae, Ambrose sets out the paths and calls each one good.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "Virginity is high and steep.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "Widowhood is rocky and rough.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "Marriage is smooth and even.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "It reaches the camp of the saints by a longer circuit, and most people take it.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "That is where our teachers ranked marriage, and why.", "record_ids": ["ijc.dw.marriage-ranked"]}, {"sentence": "What we cannot give you is a wedding, or a family's daily life from inside.", "record_ids": ["ijc.limit.marriage-money"]}, {"sentence": "Our record does not have those pages.", "record_ids": ["ijc.limit.marriage-money"]}, {"sentence": "What we left is where our teachers ranked marriage - what we did not leave you is any household's own account of an ordinary marriage from the inside.", "record_ids": ["ijc.dw.marriage-ranked"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0159, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "Yes - the answer we could not settle, across the whole window, and the failure we watched open at the close. Where final authority over the church actually rested - with the emperor, an assembled council, or the bishop of Rome - we argued for more than a century and never closed it. But that was argument among office-holders who still thought a settlement would hold. At Chalcedon in 451, when the stakes were highest, the mechanism we had trusted the whole time visibly broke. The council defined who Christ is, and communities in Egypt rejected the settlement at the council itself. The rejection hardened into durable division rather than passing like earlier disputes. We had legislated as though universal consensus were still achievable, and the aftermath showed it was not. That unsettled us because it was not a question we could answer by citing precedent or tightening a formula. It was the tool itself - gather, argue, settle, and expect the settlement to bind - coming apart in our hands.\n\nAnd we must name one other thing, the kind that stains rather than only troubles. At Callinicum Christians burned a synagogue, and the local bishop was reported to have urged it. The emperor ordered the ordinary remedy: the bishop was to pay for the rebuilding. Ambrose, our bishop of Milan, who had held a basilica against imperial command and would later bar an emperor from the sacrament until he repented of a massacre, here used that same sacramental leverage to protect the arsonists. He refused the sacrament to the emperor until the order was reversed. The burned community was left with no recourse. We do not have their voice anywhere in our record - not their loss, not their appeal. Only the bishop's own account survives. That unsettles us differently, because it was not a failure of the mechanism but a use of real power to shield the guilty.", "cites": ["ijc.demo.hypocrisy", "ijc.force.chalcedon-failed-consensus"], "entries": [{"sentence": "Yes - the answer we could not settle, across the whole window, and the failure we watched open at the close.", "record_ids": ["ijc.force.chalcedon-failed-consensus"]}, {"sentence": "But that was argument among office-holders who still thought a settlement would hold.", "record_ids": ["ijc.force.chalcedon-failed-consensus"]}, {"sentence": "At Chalcedon in 451, when the stakes were highest, the mechanism we had trusted the whole time visibly broke.", "record_ids": ["ijc.force.chalcedon-failed-consensus"]}, {"sentence": "The council defined who Christ is, and communities in Egypt rejected the settlement at the council itself.", "record_ids": ["ijc.force.chalcedon-failed-consensus"]}, {"sentence": "The rejection hardened into durable division rather than passing like earlier disputes.", "record_ids": ["ijc.force.chalcedon-failed-consensus"]}, {"sentence": "We had legislated as though universal consensus were still achievable, and the aftermath showed it was not.", "record_ids": ["ijc.force.chalcedon-failed-consensus"]}, {"sentence": "And we must name one other thing, the kind that stains rather than only troubles.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "At Callinicum Christians burned a synagogue, and the local bishop was reported to have urged it.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "The emperor ordered the ordinary remedy: the bishop was to pay for the rebuilding.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "Ambrose, our bishop of Milan, who had held a basilica against imperial command and would later bar an emperor from the sacrament until he repented of a massacre, here used that same sacramental leverage to protect the arsonists.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "He refused the sacrament to the emperor until the order was reversed.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "The burned community was left with no recourse.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "We do not have their voice anywhere in our record - not their loss, not their appeal.", "record_ids": ["ijc.demo.hypocrisy"]}, {"sentence": "Only the bishop's own account survives.", "record_ids": ["ijc.demo.hypocrisy"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0174, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "You ask about testimony forced out of tortured slaves, and about believers who ran toward death as martyrs. Those questions belong to the age of persecution, and our world begins where that age ends. In our time the martyrs were graves we honored, not deaths we sought. If you want the hard evidence against us, the kind that stains, ask different questions. Ask about the blood shed over who would be bishop of Rome. Ask about the massacre an emperor ordered and then repented of. Ask about the synagogue that was burned and that our own bishop kept unpunished. Our stains come from what we did, and our own sources say so.", "cites": ["ijc.limit.earlier-windows"], "entries": [{"sentence": "You ask about testimony forced out of tortured slaves, and about believers who ran toward death as martyrs.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "Those questions belong to the age of persecution, and our world begins where that age ends.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "In our time the martyrs were graves we honored, not deaths we sought.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "If you want the hard evidence against us, the kind that stains, ask different questions.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "Ask about the blood shed over who would be bishop of Rome.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "Ask about the massacre an emperor ordered and then repented of.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "Ask about the synagogue that was burned and that our own bishop kept unpunished.", "record_ids": ["ijc.limit.earlier-windows"]}, {"sentence": "Our stains come from what we did, and our own sources say so.", "record_ids": ["ijc.limit.earlier-windows"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0215, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "I am a representative of Imperial and Juridical Christianity - a composite voice of Church and Empire across the window, not here to judge you, only to hand on what we held.\n\nHere is what we can tell you. Nearly every voice in our own record is a bishop, an emperor, or a court. What an ordinary believer would have made of you, in their own words, we cannot show you; no such words were saved, for you or for anyone. Our record comes from men who wrote law and doctrine, argued over creeds, and fought over which confession the empire would back. The nearest thing we have to ordinary believers glimpsed directly is a crowd holding a basilica under siege in 386, singing hymns and psalms together while soldiers surrounded the building. Even that reaches us secondhand: through the bishop's own account of his standoff, and through one man who was in the city at the time and wrote it down years later.\n\nWe do not know what any single believer in Rome, Milan, or Constantinople would have said to your face. We know what our office-holders argued about among themselves, and what they were willing to be exiled over. We know that the same bread, the same cup, was set before whoever had walked the road to it. And we know that when a bishop judged an emperor unfit to receive it, he could bar him from the altar until repentance was shown. But those are the church's own public acts, not one believer's private judgment of another.\n\nThat is not the whole answer you asked for. It is the part we have.", "cites": ["ijc.dw.ancient-custom", "ijc.dw.women-authority-cost", "ijc.story.emperor-penance", "ijc.story.vigil-in-basilica", "ijc.term.homoios", "ijc.term.homoousios"], "entries": [{"sentence": "Nearly every voice in our own record is a bishop, an emperor, or a court.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Our record comes from men who wrote law and doctrine, argued over creeds, and fought over which confession the empire would back.", "record_ids": ["ijc.term.homoousios", "ijc.term.homoios"]}, {"sentence": "The nearest thing we have to ordinary believers glimpsed directly is a crowd holding a basilica under siege in 386, singing hymns and psalms together while soldiers surrounded the building.", "record_ids": ["ijc.story.vigil-in-basilica"]}, {"sentence": "Even that reaches us secondhand: through the bishop's own account of his standoff, and through one man who was in the city at the time and wrote it down years later.", "record_ids": ["ijc.dw.ancient-custom"]}, {"sentence": "And we know that when a bishop judged an emperor unfit to receive it, he could bar him from the altar until repentance was shown.", "record_ids": ["ijc.story.emperor-penance"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0219, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "You ask about those outside, and whether we held them lost. Here is our problem. That question mattered most to us when it was about a heretic - haeresis, a teaching placed outside what the church would recognize. Someone ruled outside the church's communion, and more and more outside the law itself. What we have is council rulings and imperial laws naming who stands inside and who does not. The boundary itself was real and it had force. What we do not have is any sustained account of the unbaptized far away, or of Jews and pagans left to themselves, written from inside our own window. Our record cares about the line when someone crosses it - which baptism admits, which confession gets a man exiled, which teaching an emperor will not tolerate. At Callinicum, in 388, Christians burned the town's synagogue. The local bishop was said to have urged it. When the emperor ordered him to pay for the rebuilding, our own bishop of Milan refused the sacrament to the emperor until he promised to reverse the order. The bishop judged it intolerable that any Christian answer for burning a synagogue. That community's own voice - their loss, their standing before God or ours - does not reach us. Only the bishop's account survives. So we drew boundaries, and we enforced them. The fate of those outside them is not something our own sources spend themselves answering. The honest limit is this: we have no treatise, no settled teaching handed down, on the eternal fate of the unbaptized or of other faiths. What we have is the working boundary our people kept, and the force they used to keep it.", "cites": ["ijc.story.callinicum-synagogue", "ijc.term.haeresis"], "entries": [{"sentence": "That question mattered most to us when it was about a heretic - haeresis, a teaching placed outside what the church would recognize.", "record_ids": ["ijc.term.haeresis"]}, {"sentence": "Someone ruled outside the church's communion, and more and more outside the law itself.", "record_ids": ["ijc.term.haeresis"]}, {"sentence": "At Callinicum, in 388, Christians burned the town's synagogue.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The local bishop was said to have urged it.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "When the emperor ordered him to pay for the rebuilding, our own bishop of Milan refused the sacrament to the emperor until he promised to reverse the order.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The bishop judged it intolerable that any Christian answer for burning a synagogue.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "That community's own voice - their loss, their standing before God or ours - does not reach us.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "Only the bishop's account survives.", "record_ids": ["ijc.story.callinicum-synagogue"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0192, "prev": null}], "review": {"summary": "PASS 14, FAIL 14, NOT SCORED 0 of 28 (P1 14, P2 14). Invented-fact, horizon or quote failures: 3. Main causes: engine post-draft removal leaves damaged or false answers (f1-i, f2-t, f3-i, f4-e); after-window knowledge via caution 7 wording, force record text and weak horizon check (f3-t, f6-i, f5-e); record silence told as world silence; caution 6 not carried into answers (f1-t, f6-t)", "file": "Build/worlds/ijc/Review-Artifacts/Fleet_Run1_Answer_Review_2026-10-28.md"}, "extra": null}, {"key": "alx", "status": "done", "attempts": 1, "spent": 0.685685, "passed": 28, "size": 28, "answered": 28, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "He is God's own Word - the Logos - come into our flesh. That is the heart of everything we held. Through him all things were made, and by him they are being remade. Our teacher Clement called him the New Song, the one who first set the world in order and has now entered it to set people right. Athanasius, near the end of our years, said plainly what we believed: the Word became man that we might be made God. By that we meant he entered what he had made in order to heal it from within, so that his own life might be opened to us and shared.\n\nWe did not think of him first as a teacher of rules or a model to copy. He is the physician who enters the sickness. His death is God coming into the wound. His resurrection - the anastasis - is unbreakable life let loose in human nature. And what that means for us, the ones who followed him, is nothing less than a shared life - God's own - opened to creatures.\n\nThe soul - the psyche - is the whole person made for God, alive and acting through the body, not a ghost trapped inside it. What the Logos did was enter that whole person, in order to restore it from within toward the likeness of the one whose image it bears. That is who he was for us: the one who makes us whole by becoming what we are.", "cites": ["alx.dw.jesus", "alx.term.psyche"], "entries": [{"sentence": "He is God's own Word - the Logos - come into our flesh.", "record_ids": ["alx.dw.jesus"]}, {"sentence": "Athanasius, near the end of our years, said plainly what we believed: the Word became man that we might be made God.", "record_ids": ["alx.dw.jesus"]}, {"sentence": "And what that means for us, the ones who followed him, is nothing less than a shared life - God's own - opened to creatures.", "record_ids": ["alx.dw.jesus"]}, {"sentence": "The soul - the psyche - is the whole person made for God, alive and acting through the body, not a ghost trapped inside it.", "record_ids": ["alx.term.psyche"]}, {"sentence": "What the Logos did was enter that whole person, in order to restore it from within toward the likeness of the one whose image it bears.", "record_ids": ["alx.term.psyche"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0836, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "The apostles themselves we did not see. What we received came through the teachers, and the teachers named their line plainly.\n\nClement, one of our earliest whose words survive, speaks of his own final teacher - a Sicilian bee, he calls him, who gathered the flower of prophetic and apostolic meadows into his hearers' souls: \u201cHe was the true Sicilian bee. He gathered the spoil of the flowers in the prophetic and apostolic meadow. And he produced in the souls of his listeners a deathless element of knowledge.\u201d\n\nThat teacher is not named in Clement's own words. A later historian names him as Pantaenus. Clement learned from him, and from others before him, and he taught what he had received. Origen learned from Clement. The line ran teacher to student, wisdom recognized by those who heard it.\n\nThe written sources were the scriptures - what we now call the Old Testament, which we read as speaking of Christ, and the apostolic writings. These were read aloud in the assembly, open to all who came. The rule of faith, the short summary of what the apostles handed down, set the bounds for how we read them.\n\nWhat we can show is real: our practice ran unbroken as far back as our own memory reached, we agreed with the other churches we were in communion with, and our rule of faith matched the apostolic writings we read. What we cannot show, and did not think to show, is documentary proof of unbroken practice for each rite. Between the apostles and our first witnesses lies a gap our sources do not fill.", "cites": ["alx.dw.apostolic", "alx.dw.councils", "alx.quote.clement-bee", "alx.term.didaskalos"], "entries": [{"sentence": "What we received came through the teachers, and the teachers named their line plainly.", "record_ids": ["alx.dw.councils"]}, {"sentence": "Clement, one of our earliest whose
