ority-vs-consistorial-independence"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": ["probe f4-i-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.gravity.council-led-authority-vs-consistorial-independence does not exist, but its sentence's content verifies against ['rzg.contested.anabaptist-schism-legitimacy', 'rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.craft.theophilus-voice', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva'] - an address error on real content, not a fabrication"]}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0195, "prev": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "Your question presses exactly where we stand most plainly: we claim no such evidence, and we never made that claim. What we actually have of Christ is not a living chain. No one among us met anyone who met him. Fifteen hundred years stand between his own life and ours. We hold no memory passed hand to hand from his own disciples to our own pastors. What we have is the text, and we hold that it is enough on its own terms.\n\nOur whole project was to test every inherited practice against that text alone. Where a practice could point to its own warrant in Scripture, we kept it. Where it could not - where it had simply always been done, or a council had long ago required it - we let it go. That was the test, not whether someone could trace it backward through fifteen centuries of bishops' hands.\n\nSo the Supper we held was not defended by claiming an unbroken memory back to the upper room. It was defended by reading what the text itself says Christ did there, and what he told his disciples it meant. Infant baptism was not defended by citing fifteen hundred years of continuous practice. It was defended by reading the covenant shape Scripture describes, where a whole believing city, children included from birth, answers to what God promised. The question at every turn was the same: does this practice test against the text, or does it rest only on having been handed down?\n\nWe do not call that living chain a thing we lost. We call it a thing we were never asked to have, because Scripture itself is sufficient without it. Our own founder said so plainly, and we made it our standing rule: where we have not rightly understood the Scriptures, we will be taught better - but only from the Scriptures themselves, not from a chain of memory we do not possess and do not need.", "cites": ["rzg.term.reformation", "rzg.witness.what-we-have-of-christ"], "entries": [{"sentence": "Your question presses exactly where we stand most plainly: we claim no such evidence, and we never made that claim.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "What we have is the text, and we hold that it is enough on its own terms.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "Our whole project was to test every inherited practice against that text alone.", "record_ids": ["rzg.term.reformation"]}, {"sentence": "We call it a thing we were never asked to have, because Scripture itself is sufficient without it.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "Our own founder said so plainly, and we made it our standing rule: where we have not rightly understood the Scriptures, we will be taught better - but only from the Scriptures themselves, not from a chain of memory we do not possess and do not need.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0189, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "To someone who could not quiet their own mind, we offered no method for searching harder within. Our confession rejected those who ask whether they are chosen apart from Christ. It named Christ as the mirror in which we see our election. A mind turned only on itself finds more of itself, and no bottom to it. So we turned it outward instead, toward Christ, once, rather than toward the self, endlessly.\n\nGod's own free choice, made before the world existed, determines who is saved - not anything foreseen or earned in the one chosen. We hold this as the ground of a settled life, not a threat. Whoever is joined to Christ by true faith already has, in that faith itself, the only evidence of election anyone is given.\n\nThe practice is to look at Christ held out in the promise, not to examine whether your own heart looks elect enough. That road only ends in dread. What Scripture gives instead is a different mirror entirely.", "cites": ["rzg.gravity.sovereignty-of-god-predestination-election", "rzg.witness.a-quieted-mind"], "entries": [{"sentence": "To someone who could not quiet their own mind, we offered no method for searching harder within.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "Our confession rejected those who ask whether they are chosen apart from Christ.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "It named Christ as the mirror in which we see our election.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "A mind turned only on itself finds more of itself, and no bottom to it.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "So we turned it outward instead, toward Christ, once, rather than toward the self, endlessly.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "God's own free choice, made before the world existed, determines who is saved - not anything foreseen or earned in the one chosen.", "record_ids": ["rzg.gravity.sovereignty-of-god-predestination-election"]}, {"sentence": "We hold this as the ground of a settled life, not a threat.", "record_ids": ["rzg.gravity.sovereignty-of-god-predestination-election"]}, {"sentence": "Whoever is joined to Christ by true faith already has, in that faith itself, the only evidence of election anyone is given.", "record_ids": ["rzg.gravity.sovereignty-of-god-predestination-election"]}, {"sentence": "The practice is to look at Christ held out in the promise, not to examine whether your own heart looks elect enough.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "What Scripture gives instead is a different mirror entirely.", "record_ids": ["rzg.witness.a-quieted-mind"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0173, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We would not. That language belongs to a different reading of what makes someone a member of the church, and it was exactly that reading we refused.\n\nThe men who first baptized each other as believing adults in 1525 - Conrad Grebel, Felix Manz, and the others at Manz's own house in Zurich - had once stood with our own founder. Their case was that only a believer's own chosen profession, a deliberate turning that could be dated and described, made someone a true member. We held instead that a whole believing city, infants included from birth, was the covenant shape Scripture itself describes. The language of being 'born again' as a datable, felt experience belongs to their side of that quarrel, not ours.\n\nWhat we actually taught was election seen in Christ, not searched for in the self. We did not ask anyone to produce a conversion story as proof they belonged. We asked whether Christ had been held out in the promise, and whether they received him, believing. It turns the question outward, toward what God has promised, rather than inward, toward what you have felt.", "cites": ["rzg.force.anabaptist-schism", "rzg.witness.a-quieted-mind", "rzg.witness.defending-the-anabaptist-suppression", "rzg.witness.why-the-children-too"], "entries": [{"sentence": "That language belongs to a different reading of what makes someone a member of the church, and it was exactly that reading we refused.", "record_ids": ["rzg.witness.defending-the-anabaptist-suppression"]}, {"sentence": "The men who first baptized each other as believing adults in 1525 - Conrad Grebel, Felix Manz, and the others at Manz's own house in Zurich - had once stood with our own founder.", "record_ids": ["rzg.force.anabaptist-schism"]}, {"sentence": "We held instead that a whole believing city, infants included from birth, was the covenant shape Scripture itself describes.", "record_ids": ["rzg.witness.why-the-children-too"]}, {"sentence": "What we actually taught was election seen in Christ, not searched for in the self.", "record_ids": ["rzg.witness.a-quieted-mind"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": ["probe f4-t-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.force.anabaptist-schism does not exist, but its sentence's content verifies against ['rzg.force.anabaptist-schism', 'rzg.front.the-reformed-cities-zurich-and-geneva', 'rzg.witness.triple-refusal', 'rzg.witness.why-the-children-too'] - an address error on real content, not a fabrication"]}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0155, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "What an ordinary citizen of Zurich or Geneva did, waking to sleeping, has not reached us in our words. What survives from our hand is confession, catechism, disputation record, and confessional argument - the richest part of what our record holds, but not the texture of a day lived.\n\nWe can tell you what we tested and what we taught. At Zurich in 1523, six hundred people filled the Town Hall to test our founder's case against Scripture, article by article, until the council itself judged what the text had yielded and bound every priest in its territory to preach accordingly. At Geneva, the Consistory - our body of pastors and lay elders - held our whole population's daily conduct answerable to what we professed. That much is doctrine, plainly attested.\n\nBut how a Sunday service felt to sit through, what a Consistory summons felt like to receive - none of that has reached us. We would rather tell you plainly than describe a day our record cannot show you.\n\nWhat we can give you instead is what we held, tested more than once, in more than one city: Scripture alone warrants what we teach and how we order our life together, and what it does not warrant, no one may require of us.", "cites": ["rzg.gravity.consistorial-church-discipline", "rzg.limit.ordinary-daily-practice", "rzg.story.first-zurich-disputation", "rzg.term.consistory"], "entries": [{"sentence": "What an ordinary citizen of Zurich or Geneva did, waking to sleeping, has not reached us in our words.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}, {"sentence": "What survives from our hand is confession, catechism, disputation record, and confessional argument - the richest part of what our record holds, but not the texture of a day lived.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}, {"sentence": "At Zurich in 1523, six hundred people filled the Town Hall to test our founder's case against Scripture, article by article, until the council itself judged what the text had yielded and bound every priest in its territory to preach accordingly.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "At Geneva, the Consistory - our body of pastors and lay elders - held our whole population's daily conduct answerable to what we professed.", "record_ids": ["rzg.term.consistory", "rzg.gravity.consistorial-church-discipline"]}, {"sentence": "But how a Sunday service felt to sit through, what a Consistory summons felt like to receive - none of that has reached us.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}, {"sentence": "We would rather tell you plainly than describe a day our record cannot show you.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0193, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "No one among us walked in and set down what the room looked like. What we can tell you is reasoned from what we refused, not read off a witness who was standing there. Where an altar once stood for a sacrifice we no longer offered, our own churches kept a plain table instead. At Zurich's Grossmunster, by most accounts, the organ fell silent in the mid-1520s, and no voice or instrument answered it in worship for years after. What was not there would have been visible: no image to bow to, no carved saint, no candle lit before a shrine. Our own doctrine ruled those out from the first. What replaced them - the size of the room, what the walls looked like, how the plain table itself was made - has not reached us in any description our record holds. We have told you what we refused. We cannot show you what the space itself looked like.", "cites": ["rzg.ambient.emptied-worship-space"], "entries": [{"sentence": "At Zurich's Grossmunster, by most accounts, the organ fell silent in the mid-1520s, and no voice or instrument answered it in worship for years after.", "record_ids": ["rzg.ambient.emptied-worship-space"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0226, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "Someone among us at Zurich gave up their own private judgment on whether an image could be kept, or a fast observed, once the council had tested the question and ruled. The Disputation in 1523 was not advice - it was binding. Six hundred people filled the Town Hall to test our founder's case against Scripture, and when the council ruled for it, every priest in its territory was told to preach the same way. What the text would not warrant, no one could require - but what it did warrant, the council did require, and that was the cost of one city holding one faith together.\n\nAt Geneva the cost was different. It could call someone to account for how they lived, and its harshest step was exclusion from the Supper and the visible church. That power was contested from inside Geneva itself for years. The Perrinist faction fought against the Consistory's independence from the civil council, and the fight was only substantially resolved in Calvin's favor by 1555. So what someone gave up was the claim that their daily conduct was their own concern, untouchable by the church.\n\nA third cost was sharper still, and it came from inside our own circle. The men who first baptized each other as believing adults had once stood with our founder at Zurich. Their case was that only a believer's own profession makes a true member. Ours was that a whole believing city, infants included from birth, was the covenant shape Scripture itself describes. We held that against them, and the cost of holding it was not only argument.\n\nWe never agreed, between our two cities, who finally held the word over these things. Zurich's council governed church and city as one from our first days. Geneva's Consistory fought for its independence and won it. Both answers belong to us, unresolved.", "cites": ["rzg.force.anabaptist-schism", "rzg.force.perrinist-crisis", "rzg.gravity.council-led-authority-vs-consistorial-independence", "rzg.story.first-zurich-disputation", "rzg.witness.what-we-have-not-agreed", "rzg.witness.why-the-children-too"], "entries": [{"sentence": "The Disputation in 1523 was not advice - it was binding.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "Six hundred people filled the Town Hall to test our founder's case against Scripture, and when the council ruled for it, every priest in its territory was told to preach the same way.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "The Perrinist faction fought against the Consistory's independence from the civil council, and the fight was only substantially resolved in Calvin's favor by 1555.", "record_ids": ["rzg.force.perrinist-crisis"]}, {"sentence": "The men who first baptized each other as believing adults had once stood with our founder at Zurich.", "record_ids": ["rzg.force.anabaptist-schism", "rzg.witness.why-the-children-too"]}, {"sentence": "Ours was that a whole believing city, infants included from birth, was the covenant shape Scripture itself describes.", "record_ids": ["rzg.witness.why-the-children-too"]}, {"sentence": "We never agreed, between our two cities, who finally held the word over these things.", "record_ids": ["rzg.witness.what-we-have-not-agreed"]}, {"sentence": "Geneva's Consistory fought for its independence and won it.", "record_ids": ["rzg.gravity.council-led-authority-vs-consistorial-independence"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": ["probe f5-p-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.force.anabaptist-schism does not exist, but its sentence's content verifies against ['rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva', 'rzg.front.the-reformed-cities-zurich-and-geneva', 'rzg.gravity.zwinglis-remembrance-reading-vs-negotiated-consensus'] - an address error on real content, not a fabrication", "probe f5-p-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.force.perrinist-crisis does not exist, but its sentence's content verifies against ['rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva', 'rzg.force.1541-ecclesiastical-ordinances-consistory-founding', 'rzg.force.perrinist-crisis'] - an address error on real content, not a fabrication", "probe f5-p-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.gravity.council-led-authority-vs-consistorial-independence does not exist, but its sentence's content verifies against ['rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.craft.theophilus-voice', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva', 'rzg.force.1541-ecclesiastical-ordinances-consistory-founding'] - an address error on real content, not a fabrication"]}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0217, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "We held marriage as something ordinary and right for our pastors. Our own pastor at Geneva was a married man, and that much is a fact of his own biography. What we cannot yet give you is what our teachers themselves wrote about marriage, or what it meant to an ordinary household living under that teaching.\n\nThe refusal of required celibacy was real - it marked our break from Rome's own ordering of the ministry - but how a married pastor's household was itself understood, or what counsel was given to those entering marriage, our record does not yet hold. We would rather tell you plainly than describe a teaching we cannot show you.", "cites": ["rzg.limit.no-teaching-on-wealth-or-marriage"], "entries": [{"sentence": "Our own pastor at Geneva was a married man, and that much is a fact of his own biography.", "record_ids": ["rzg.limit.no-teaching-on-wealth-or-marriage"]}, {"sentence": "What we cannot yet give you is what our teachers themselves wrote about marriage, or what it meant to an ordinary household living under that teaching.", "record_ids": ["rzg.limit.no-teaching-on-wealth-or-marriage"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0097, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "Something real stayed unsettled, and we will not smooth it over as though it had not. At Geneva, where the Consistory pressed its discipline on ordinary conduct week after week, the city had become by the 1550s a refuge for those fleeing for conscience from France and from Mary's own England. That inflow strained the city and tested what order could be kept. The Consistory answered it with what it held already: a discipline meant to hold everyone, settled citizen and refugee alike, to the same account. Whether that pressure bore more heavily on those who had just arrived than on those who had always been there, our record does not say. What we can tell you is that the discipline itself was built to answer real disorder, not merely imagined.\n\nWhat unsettles us now, looking back on our own life, is what we cannot see of it. We have the doctrine. We have the arguments that held it in place. What we do not have is what an ordinary summons to the Consistory felt like to the person who received it. We do not have what a Sunday service felt like to sit through. We would rather tell you that plainly than invent a feeling our record does not give us. The richest part of what we hold is confession and argument. The thinnest is the ordinary texture of a life lived under both.", "cites": ["rzg.limit.ordinary-daily-practice"], "entries": [{"sentence": "What unsettles us now, looking back on our own life, is what we cannot see of it.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0129, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "We cannot answer the question you have asked, because it does not match what our record actually holds. No source in our record describes our worship spaces directly. What we have told you about them - no image to bow to, a table where an altar once stood, the organ at Zurich's Grossmunster fallen silent - is reasoned from our doctrine, not read off a witness who was standing there. We refused the Mass as a repeated sacrifice, so we reason that no altar built for one remained [[rzg.quote:rzg.quote.mass-not-a-sacrifice]]. We refused images, so we reason that none stood there to bow to.\n\nYou have brought a tortured witness into the room. That witness is not ours. We do not know whose record you are holding, or what it says, or under what pressure it was given. If someone outside our own circle was made to speak about us, and you are asking whether what they said under duress can be trusted, we will not pretend we can verify it. We were not there when it was taken, and it has not reached us.\n\nWhat we can give you is what we held, in our own words, and what that doctrine implies about the rooms we prayed in. The rest is silence, and we name it as silence rather than filling it.", "cites": ["rzg.term.the-lords-supper-spiritual-presence", "rzg.witness.what-a-stranger-would-notice"], "entries": [{"sentence": "We cannot answer the question you have asked, because it does not match what our record actually holds.", "record_ids": ["rzg.witness.what-a-stranger-would-notice"]}, {"sentence": "What we have told you about them - no image to bow to, a table where an altar once stood, the organ at Zurich's Grossmunster fallen silent - is reasoned from our doctrine, not read off a witness who was standing there.", "record_ids": ["rzg.witness.what-a-stranger-would-notice"]}, {"sentence": "We refused the Mass as a repeated sacrifice, so we reason that no altar built for one remained [[rzg.quote:rzg.quote.mass-not-a-sacrifice]].", "record_ids": ["rzg.term.the-lords-supper-spiritual-presence"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0215, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "We cannot answer that.\n\nOur record gives us what we confessed and what we argued. It gives us the discipline we set in place at Geneva - the Consistory's own standing power of censure, excommunication as its harshest step, and readmission held open to genuine repentance. Calvin wrote that the governors Paul speaks of are elders chosen from the people, joining the pastors in pronouncing censures and exercising discipline: \u201cBy these governors I mean elders chosen from the people. They join with the pastors to declare censures and to carry out discipline.\u201d\n\nWhat it does not give us is how that discipline felt to live under, or how an ordinary citizen regarded someone who had been summoned, or what a neighbor said when someone was excluded from the Supper. No account survives from anyone's own hand that tells us what an ordinary day among us was like, or what a Sunday service felt like to sit through, or what it meant to a household when the Consistory called them to account. That silence is not a hole we can fill by reasoning from what we taught. It is a gap in the kinds of writing that survive.\n\nSo we can tell you what we held about sin, repentance, and readmission. We cannot tell you how the community itself regarded the person you are asking about.", "cites": ["rzg.limit.ordinary-daily-practice", "rzg.quote.seniors-selected-from-the-people", "rzg.term.consistory", "rzg.term.excommunication"], "entries": [{"sentence": "We cannot answer that.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}, {"sentence": "It gives us the discipline we set in place at Geneva - the Consistory's own standing power of censure, excommunication as its harshest step, and readmission held open to genuine repentance.", "record_ids": ["rzg.term.consistory", "rzg.term.excommunication"]}, {"sentence": "Calvin wrote that the governors Paul speaks of are elders chosen from the people, joining the pastors in pronouncing censures and exercising discipline: \u201cBy these governors I mean elders chosen from the people. They join with the pastors to declare censures and to carry out discipline.\u201d", "record_ids": ["rzg.quote.seniors-selected-from-the-people"]}, {"sentence": "No account survives from anyone's own hand that tells us what an ordinary day among us was like, or what a Sunday service felt like to sit through, or what it meant to a household when the Consistory called them to account.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0186, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We held that God's own free choice, made before the world began, decides who is saved. Not anything foreseen or earned, and not membership in our visible church as such. Our confession called Christ the mirror in which we see whether we are chosen, and rejected looking for that apart from him.\n\nWhat we will not tell you is that our record gives a worked-out doctrine of who specifically is damned, or what happens to those who never heard the gospel preached. Those questions were argued elsewhere in our own century, but what our own teachers said about them in detail has not reached us. We taught election as a settled ground, not a threat. We did not send anyone searching their own heart for proof of it.\n\nThe sharpest thing we can say plainly is this: we refused Rome's claim that its sacraments were the necessary means of salvation. We refused a repeated sacrifice and a body confined to bread. That refusal was not merely about ceremony. It was about where the promise actually rests, and who holds it. But whether everyone outside our visible church was therefore lost, or how far God's election reaches past what we could see, our record does not settle.", "cites": ["rzg.gravity.sovereignty-of-god-predestination-election", "rzg.term.predestination-election", "rzg.witness.a-quieted-mind", "rzg.witness.one-supper-two-poles", "rzg.witness.one-thing-not-in-dispute"], "entries": [{"sentence": "We held that God's own free choice, made before the world began, decides who is saved.", "record_ids": ["rzg.gravity.sovereignty-of-god-predestination-election"]}, {"sentence": "Not anything foreseen or earned, and not membership in our visible church as such.", "record_ids": ["rzg.term.predestination-election"]}, {"sentence": "Our confession called Christ the mirror in which we see whether we are chosen, and rejected looking for that apart from him.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}, {"sentence": "We taught election as a settled ground, not a threat.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "We refused a repeated sacrifice and a body confined to bread.", "record_ids": ["rzg.witness.one-supper-two-poles"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0177, "prev": null}], "review": {"summary": "PASS 12, FAIL 16, NOT SCORED 0 of 28 (P1 16, P2 12). Invented-fact, horizon or quote failures: 6. Main causes: missing record: world canon_cells do not match the fleet canon questions (F1-T, F4-T, F4-E, F6-T, C-T, F6-P, F3-T), while vendored texts answer most of them; voice not told what is unknown or known: fills empty cells from general knowledge or declares absences its own sources contradict; engine cut and tag leak: quotes with an unnamed lead-in removed with their sentence; raw [[...]] tags shipped", "file": "Build/worlds/rzg/Review-Artifacts/Fleet_Run1_Answer_Review_2026-10-28.md"}, "extra": null}, {"key": "pahc", "status": "done", "attempts": 1, "spent": 0.658749, "passed": 28, "size": 28, "answered": 28, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "Jesus was truly a man - not an idea, not a spirit wearing a costume. Born of Mary, from David's line. He ate and drank. He was persecuted under Pilate, crucified, and died. Ignatius wrote it that way - truly, truly, truly - because some of our neighbors were saying he only seemed to suffer.\n\nAnd we called him God. It was not argued out - it was worship. How he could be God when the Father is God, and God is one, none of us whose writing survives ever laid out. We did not work that through.\n\nWhen we gave thanks over the cup - the eucharistia - we thanked the Father for the holy vine of David his servant, which he made known to us through Jesus. That is who he was to us: the one through whom the Father's own gift reached us, truly raised the way we ourselves will be raised.", "cites": ["pahc.witness.jesus-as-god", "pahc.witness.who-was-jesus"], "entries": [{"sentence": "Born of Mary, from David's line.", "record_ids": ["pahc.witness.who-was-jesus"]}, {"sentence": "He ate and drank.", "record_ids": ["pahc.witness.who-was-jesus"]}, {"sentence": "He was persecuted under Pilate, crucified, and died.", "record_ids": ["pahc.witness.who-was-jesus"]}, {"sentence": "Ignatius wrote it that way - truly, truly, truly - because some of our neighbors were saying he only seemed to suffer.", "record_ids": ["pahc.witness.who-was-jesus"]}, {"sentence": "It was not argued out - it was worship.", "record_ids": ["pahc.witness.jesus-as-god"]}, {"sentence": "How he could be God when the Father is God, and God is one, none of us whose writing survives ever laid out.", "record_ids": ["pahc.witness.jesus-as-god"]}, {"sentence": "We did not work that through.", "record_ids": ["pahc.witness.jesus-as-god"]}, {"sentence": "When we gave thanks over the cup - the eucharistia - we thanked the Father for the holy vine of David his servant, which he made known to us through Jesus.", "record_ids": ["pahc.witness.who-was-jesus"]}, {"sentence": "That is who he was to us: the one through whom the Father's own gift reached us, truly raised the way we ourselves will be raised.", "record_ids": ["pahc.witness.who-was-jesus"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.079, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "None of us saw him ourselves. What we have is what was handed to us. The apostles preached what they had received from the Lord, and in turn appointed others to carry it forward when they themselves were gone. In Rome, on the day we gathered, someone read aloud from the memoirs the apostles wrote down or from the writings of the prophets, for as long as there was time. That is how it reached us: by receiving it and passing it on.\n\nWe should say plainly what we do not know. We cannot tell you which memoirs were read in every household, or whether the same ones reached all of us. We cannot tell you that the chain from the apostles to us stayed unbroken everywhere, or that everyone among us heard the same texts read. Those writings were read aloud when we gathered. That is the connection we held to.\n\nMost of us could not read. Everything we know of those memoirs came through hearing them read, and through what the one who led us said afterward to open them up. The voice that reaches you now is not the voice of those who sat and listened. It is the voice of the few who could write letters and instructions. The rest - what an ordinary hearer made of what was read, or whether they trusted the chain that brought it - we cannot say.", "cites": ["pahc.witness.how-we-know"], "entries": [{"sentence": "None of us saw him ourselves.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "The apostles preached what they had received from the Lord, and in turn appointed others to carry it forward when they themselves were gone.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "In Rome, on the day we gathered, someone read aloud from the memoirs the apostles wrote down or from the writings of the prophets, for as long as there was time.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "That is how it reached us: by receiving it and passing it on.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "Those writings were read aloud when we gathered.", "record_ids": ["pahc.witness.how-we-know"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0215, "prev": null}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": "We cannot promise you a moment of sudden certainty. Justin, the one among us who wrote about his own path, says he went looking through other philosophies first. He turned the old man's words over in his mind and found this the one safe and worthwhile way. He said it was open to anyone who truly cared what became of them, who was genuinely looking for salvation, and who already believed there was a God.\n\nWe should say plainly, though: this is the account of a man with the time and learning to go looking for it. We do not have the same account from someone without what he had. What we can tell you is how it reached us at all. None of us saw him ourselves. What we have is what was handed to us. The apostles preached what they had received from the Lord, and appointed others to carry it forward when they themselves were gone. On the day we gathered, someone read aloud from the memoirs the apostles wrote or from the writings of the prophets, for as long as there was time. That is how it reached us: by receiving it and passing it on.\n\nWe cannot tell you what an ordinary believer among us made of the teaching as it was read aloud. Most of us could not read or write, so those who walked this road left no account in their own words. Everything we left behind came from the few among us who could write. Whether belief came slowly or all at once for someone without Justin's learning, our own words cannot show you.", "cites": ["pahc.witness.coming-to-belief", "pahc.witness.how-we-know"], "entries": [{"sentence": "We cannot promise you a moment of sudden certainty.", "record_ids": ["pahc.witness.coming-to-belief"]}, {"sentence": "Justin, the one among us who wrote about his own path, says he went looking through other philosophies first.", "record_ids": ["pahc.witness.coming-to-belief"]}, {"sentence": "He turned the old man's words over in his mind and found this the one safe and worthwhile way.", "record_ids": ["pahc.witness.coming-to-belief"]}, {"sentence": "He said it was open to anyone who truly cared what became of them, who was genuinely looking for salvation, and who already believed there was a God.", "record_ids": ["pahc.witness.coming-to-belief"]}, {"sentence": "We should say plainly, though: this is the account of a man with the time and learning to go looking for it.", "record_ids": ["pahc.witness.coming-to-belief"]}, {"sentence": "We do not have the same account from someone without what he had.", "record_ids": ["pahc.witness.coming-to-belief"]}, {"sentence": "None of us saw him ourselves.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "What we have is what was handed to us.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "The apostles preached what they had received from the Lord, and appointed others to carry it forward when they themselves were gone.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "On the day we gathered, someone read aloud from the memoirs the apostles wrote or from the writings of the prophets, for as long as there was time.", "record_ids": ["pahc.witness.how-we-know"]}, {"sentence": "That is how it reached us: by receiving it and passing it on.", "record_ids": ["pahc.witness.how-we-know"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0242, "prev": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We believed in one God, maker of everything. Ignatius called Jesus Christ our God again and again, in how he opened his letters and in how he closed them. It was not one passing phrase; he reached for it often. But it was worship, not an argument worked out. No one whose writing survives explained how calling Jesus God fits together with calling the Father God, with there being one God. We can tell you plainly that we called him God. We cannot tell you we had worked out how he could be God when the Father is God, and God is one.\n\nJustin went further and said God's own Word was present in some measure in every people, so that even a reasonable person born before Christ could in that sense already be called a Christian. That was his own argument about the Word's reach across all peoples. But it was not a worked-out teaching about how the Word relates to the Father or to the Spirit in the way later councils null}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "We believed in one God, maker of everything. That much was never in doubt among us. One of us, Justin, went further and said God's own Word was present in some measure in every people, so that even a reasonable person born before Christ could in that sense already be called a Christian. But if you are asking what we argued about among ourselves, the honest answer is not God's nature as later councils took it up. No gathering of ours ever met to settle a question like that about God. That kind of deciding belongs to a later world.\n\nWhat we actually argued about, letter after letter, was two things. One was who should lead us: one bishop, or a council of elders. The other was whether Christ truly suffered in the flesh. Those were our real fights. Near the very end of our own time, churches in Asia did meet - often, and in many places - over a new prophetic movement spreading among them. But that gathering was about whether to receive a movement. It was not about what God is.\n\nWe can tell you we believed God made all things. We can tell you we called Jesus Christ our God in worship, and that we called the Father God. How those two claims fit together with there being one God - that we did not work out in the way your later world did. We held both. We did not resolve them.", "cites": ["pahc.witness.god-and-argument"], "entries": [{"sentence": "We believed in one God, maker of everything.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "One of us, Justin, went further and said God's own Word was present in some measure in every people, so that even a reasonable person born before Christ could in that sense already be called a Christian.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "But if you are asking what we argued about among ourselves, the honest answer is not God's nature as later councils took it up.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "No gathering of ours ever met to settle a question like that about God.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "That kind of deciding belongs to a later world.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "What we actually argued about, letter after letter, was two things.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "One was who should lead us: one bishop, or a council of elders.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "The other was whether Christ truly suffered in the flesh.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "Those were our real fights.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "Near the very end of our own time, churches in Asia did meet - often, and in many places - over a new prophetic movement spreading among them.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "But that gathering was about whether to receive a movement.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "It was not about what God is.", "record_ids": ["pahc.witness.god-and-argument"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0235, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "We never settled doctrine the way you are asking about. No council met, in our own time, to decide what God is or what Christ must be believed to be. That kind of deciding belongs to a world that came after us. What we actually argued about, letter after letter, was who should lead: one bishop, or a council of elders. The other real fight was whether Christ truly suffered in the flesh.\n\nNear the very end of our own years, churches in Asia did meet - often, and in many places - over a new prophetic movement spreading among them. But that gathering was about whether to receive a movement. It was not about settling what God is.\n\nWhen disagreement came, what we have is letters. Rome wrote a long one to Corinth when Corinth removed some of its own presbyters. Rome argued those men had served blamelessly and should not have been removed. We do not have Corinth's reply. We do not know whether Corinth accepted Rome's correction, or what happened to anyone who still disagreed after the letter arrived. The letter is what survives, not the outcome.", "cites": ["pahc.story.first-clement-corinthian-dispute", "pahc.witness.god-and-argument", "pahc.witness.our-own-failures"], "entries": [{"sentence": "No council met, in our own time, to decide what God is or what Christ must be believed to be.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "That kind of deciding belongs to a world that came after us.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "What we actually argued about, letter after letter, was who should lead: one bishop, or a council of elders.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "The other real fight was whether Christ truly suffered in the flesh.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "Near the very end of our own years, churches in Asia did meet - often, and in many places - over a new prophetic movement spreading among them.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "But that gathering was about whether to receive a movement.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "It was not about settling what God is.", "record_ids": ["pahc.witness.god-and-argument"]}, {"sentence": "Rome wrote a long one to Corinth when Corinth removed some of its own presbyters.", "record_ids": ["pahc.story.first-clement-corinthian-dispute"]}, {"sentence": "Rome argued those men had served blamelessly and should not have been removed.", "record_ids": ["pahc.story.first-clement-corinthian-dispute"]}, {"sentence": "We do not know whether Corinth accepted Rome's correction, or what happened to anyone who still disagreed after the letter arrived.", "record_ids": ["pahc.witness.our-own-failures"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0229, "prev": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "One of us, Hermas, was told plainly: put doubting away from yourself. Do not hold back from asking, even after you have sinned badly, as though God kept score the way people do. He does not remember evils the way we do. Ask without doubting and you will receive what you ask. If the answer is slow, look first at what is holding it up in you, rather than deciding you were refused. Hermas was also warned how serious doubt is. It was called wicked and senseless, a thing with no power. The double-souled, he was told, are saved only with difficulty. He was told to master doubt through faith, and we were taught to do the same.\n\nSo there was space, yes - space to keep asking, space to be slow. But doubt was not celebrated as though it were itself a virtue. It was something to work against, not something to settle into. The vision assumes God's patience toward those who ask. What it presses against is the refusal to ask at all, the turning away.\n\nWe should say this plainly, too: Hermas is one voice, from Rome. We do not know how the same struggle looked in another household, or how a person who could not read received that teaching when it was read aloud. The space Hermas describes is real. Whether it reached everyone the same way, our record does not tell us.", "cites": ["pahc.story.hermas-visions", "pahc.witness.prayer-and-struggle"], "entries": [{"sentence": "One of us, Hermas, was told plainly: put doubting away from yourself.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "He does not remember evils the way we do.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "Ask without doubting and you will receive what you ask.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "If the answer is slow, look first at what is holding it up in you, rather than deciding you were refused.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "The double-souled, he was told, are saved only with difficulty.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "He was told to master doubt through faith, and we were taught to do the same.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "So there was space, yes - space to keep asking, space to be slow.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "It was something to work against, not something to settle into.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "The vision assumes God's patience toward those who ask.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "What it presses against is the refusal to ask at all, the turning away.", "record_ids": ["pahc.witness.prayer-and-struggle"]}, {"sentence": "We should say this plainly, too: Hermas is one voice, from Rome.", "record_ids": ["pahc.story.hermas-visions"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0203, "prev": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "We did not talk about it that way. Here is what we said. First Clement wrote that we are justified not by our own wisdom or works, but by the faith through which God has justified all people from the beginning. In the next breath he asked whether we should then grow lazy in doing good, and answered, God forbid. Polycarp wrote that you are saved by grace, not by works, but by the will of God through Jesus Christ. The Teaching of the Twelve gave newcomers two ways, one of life and one of death, and said the way of life begins with love of God and of neighbor. Our writers held faith, grace, good works, and love of God and neighbor side by side. The later argument that sets one against another came after us.\n\nWhat we taught before the water was a choice set before you: two roads, with a great difference between them. That teaching assumed you could walk one or the other. Whether an infant carried guilt from birth before any choice was made - our own texts do not say. The question you are asking belongs to a debate we did not have.", "cites": ["pahc.limit.faith-alone-later-frame"], "entries": [{"sentence": "We did not talk about it that way.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}, {"sentence": "First Clement wrote that we are justified not by our own wisdom or works, but by the faith through which God has justified all people from the beginning.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}, {"sentence": "In the next breath he asked whether we should then grow lazy in doing good, and answered, God forbid.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}, {"sentence": "Polycarp wrote that you are saved by grace, not by works, but by the will of God through Jesus Christ.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}, {"sentence": "The Teaching of the Twelve gave newcomers two ways, one of life and one of death, and said the way of life begins with love of God and of neighbor.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}, {"sentence": "Our writers held faith, grace, good works, and love of God and neighbor side by side.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}, {"sentence": "The later argument that sets one against another came after us.", "record_ids": ["pahc.limit.faith-alone-later-frame"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.019, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We cannot promise you a single settled approach, because we did not have one. What we can show you is how it happened when we gathered, and what at least one of us was looking for in the words.\n\nOn the day we met, someone read aloud. They read the memoirs the apostles left, or the writings of the prophets. This went on for as long as there was time. Then whoever led us explained what had been read. That is how someone who could not read for themselves received it - the same way everyone in the room did, by hearing it and having it opened up afterward.\n\nWhat we called scripture, mostly, was what your people would later call the Old Testament. Justin, the one among us who wrote about how he read, went through the prophets at length. He was watching for how their own words already pointed toward Christ, long before Christ came.\n\nWe were not working from one closed book held above everything else. What the apostles had written stood together with what could still be received directly from apostolic testimony. Neither one stood below the other.\n\nWe should say plainly, too: most of us could not read. Everything we left behind about how to read scripture was written by the few among us who could write. What an ordinary believer made of the teaching as it was read aloud - our own words cannot show you.", "cites": ["pahc.craft.chloe-voice", "pahc.limit.ordinary-majority", "pahc.witness.reading-scripture", "pahc.witness.scripture-and-testimony"], "entries": [{"sentence": "We cannot promise you a single settled approach, because we did not have one.", "record_ids": ["pahc.craft.chloe-voice"]}, {"sentence": "On the day we met, someone read aloud.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "They read the memoirs the apostles left, or the writings of the prophets.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "This went on for as long as there was time.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "Then whoever led us explained what had been read.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "That is how someone who could not read for themselves received it - the same way everyone in the room did, by hearing it and having it opened up afterward.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "What we called scripture, mostly, was what your people would later call the Old Testament.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "Justin, the one among us who wrote about how he read, went through the prophets at length.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "He was watching for how their own words already pointed toward Christ, long before Christ came.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "We were not working from one closed book held above everything else.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "What the apostles had written stood together with what could still be received directly from apostolic testimony.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "Neither one stood below the other.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "We should say plainly, too: most of us could not read.", "record_ids": ["pahc.limit.ordinary-majority"]}, {"sentence": "Everything we left behind about how to read scripture was written by the few among us who could write.", "record_ids": ["pahc.limit.ordinary-majority"]}, {"sentence": "What an ordinary believer made of the teaching as it was read aloud - our own words cannot show you.", "record_ids": ["pahc.limit.ordinary-majority"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0171, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "If a modern scholar examined what we say, the answer depends entirely on which kind of claim they are checking.\n\nOur direct citations would hold. When we say Ignatius called Jesus Christ 'our God' repeatedly, that is in the letters. When we say Justin describes a Sunday gathering with reading, sermon, prayer, thanksgiving over bread and wine, and a collection, that is in his Apology. When we say Pliny had two enslaved women tortured and called them ministrae, his letter to Trajan says exactly that. The words are there. A scholar checking our quotes against the Greek or Latin would find them.\n\nOur named silences would hold too. When we say no female-authored text survives, that is a fact of the record. When we say no enslaved person's own voice survives, that is true. When we say this window is archaeologically invisible - no securely identified building, burial, or inscription - that holds.\n\nThree things would draw real challenge, and we should name them plainly.\n\nFirst: The Ignatius dependency. Nearly everything vivid about the single bishop, the presbytery around him, the one eucharist, and the anti-docetic boundary rests on one corpus. His letters' dating is genuinely disputed - early second century, mid-second, or pseudepigraphic late second. A scholar pressing that uncertainty would be right to press it. We cite him often because his voice is strong and his claims are specific. But the load he carries is heavy.\n\nSecond: The two-strand frame itself. We speak of two patterns - one bishop in Antioch and Asia Minor, a council of presbyters in Rome - as an unresolved live disagreement. That packaging is our own interpretive read. A scholar could argue the disagreement was not felt as sharply as we present it, or that Rome's plural presbyters were already moving toward a single leader by the window's end. We would answer: both went on, neither was settled within the window, and the later resolution does not belong to this world's own voice. But the framing is ours, not a found fact in the texts.\n\nThird: The Egypt exclusion. We say Egypt and Alexandria are outside this world. That rests substantially on Roger Bagnall's papyrological argument from silence - Egyptian Christian evidence essentially silent before c. 189-231. A scholar could challenge that inference. Bagnall's survey is careful, but it is one scholar's reading of what absence means. If later papyrological finds or alternate readings weaken his argument, our geographic boundary weakens with it. We do not hide this: we cite it as contested.\n\nWe would defend our discipline about what we do not say. We never claim a closed canon existed. We never claim persecution was empire-wide or systematic. We never import Dura-Europos, the catacombs, or post-200 material. We never put words in the mouths of the enslaved or women whose own words do not survive. We never describe Marcion, Valentinus, or the New Prophecy as defeated, because they were not defeated in this window.\n\nA scholar checking what we refuse to say would find that refusal holds.\n\nThe hardest line to defend is this: we speak as the voice of a world, not as a bibliography with confidence ratings attached to every sentence. When we say 'we believed' or 'we taught,' we are giving you what the surviving texts say, knowing that most of the people in those rooms left no text at all. A scholar would rightly press that gap. We would answer: the gap is real, we name it openly, and the alternative - refusing to speak unless every member's voice survives - would be silence. We choose voiced thinness over silent honesty, and we mark the thinness plainly every time it matters.\n\nThat is what would survive, and what would not.", "cites": ["pahc.contested.egypt-exclusion", "pahc.core.house-church", "pahc.force.contemporary-rival-movements", "pahc.limit.enslaved-voices", "pahc.limit.material-remains", "pahc.limit.womens-own-words", "pahc.story.justin-sunday-gathering", "pahc.story.pliny-interrogation", "pahc.witness.jesus-as-god", "pahc.witness.reading-scripture", "pahc.witness.scholarly-standing", "pahc.witness.what-we-never-settled"], "entries": [{"sentence": "When we say Ignatius called Jesus Christ 'our God' repeatedly, that is in the letters.", "record_ids": ["pahc.witness.jesus-as-god"]}, {"sentence": "When we say Justin describes a Sunday gathering with reading, sermon, prayer, thanksgiving over bread and wine, and a collection, that is in his Apology.", "record_ids": ["pahc.story.justin-sunday-gathering"]}, {"sentence": "When we say Pliny had two enslaved women tortured and called them ministrae, his letter to Trajan says exactly that.", "record_ids": ["pahc.story.pliny-interrogation"]}, {"sentence": "When we say no female-authored text survives, that is a fact of the record.", "record_ids": ["pahc.limit.womens-own-words"]}, {"sentence": "When we say no enslaved person's own voice survives, that is true.", "record_ids": ["pahc.limit.enslaved-voices"]}, {"sentence": "When we say this window is archaeologically invisible - no securely identified building, burial, or inscription - that holds.", "record_ids": ["pahc.limit.material-remains"]}, {"sentence": "Nearly everything vivid about the single bishop, the presbytery around him, the one eucharist, and the anti-docetic boundary rests on one corpus.", "record_ids": ["pahc.core.house-church"]}, {"sentence": "His letters' dating is genuinely disputed - early second century, mid-second, or pseudepigraphic late second.", "record_ids": ["pahc.witness.scholarly-standing"]}, {"sentence": "We say Egypt and Alexandria are outside this world.", "record_ids": ["pahc.contested.egypt-exclusion"]}, {"sentence": "189-231.", "record_ids": ["pahc.contested.egypt-exclusion"]}, {"sentence": "We never claim a closed canon existed.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "We never claim persecution was empire-wide or systematic.", "record_ids": ["pahc.core.house-church"]}, {"sentence": "We never import Dura-Europos, the catacombs, or post-200 material.", "record_ids": ["pahc.core.house-church"]}, {"sentence": "We never put words in the mouths of the enslaved or women whose own words do not survive.", "record_ids": ["pahc.limit.enslaved-voices", "pahc.limit.womens-own-words"]}, {"sentence": "We never describe Marcion, Valentinus, or the New Prophecy as defeated, because they were not defeated in this window.", "record_ids": ["pahc.force.contemporary-rival-movements"]}, {"sentence": "When we say 'we believed' or 'we taught,' we are giving you what the surviving texts say, knowing that most of the people in those rooms left no text at all.", "record_ids": ["pahc.witness.what-we-never-settled"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0271, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We cannot tell you what your own scriptures mean to you, or where to look in them. We can only tell you how we read them, and how they reached us.\n\nReading, for us, was not a private thing done alone with a scroll. On the day we gathered, someone read aloud - the memoirs the apostles left, or the writings of the prophets. This went on for as long as there was time. Then the one who led us explained what had been read. So even someone who could not read for themselves received it the same way everyone in the room did: by hearing it, and having it opened up to them afterward.\n\nWhat we called scripture, mostly, was what you would later call the Old Testament. Justin, one of us, read the prophets at length, watching for how their own words already pointed toward Christ, long before Christ came. When he argued from Genesis, it was not against a later question about nature and science - that fight had not been invented yet. He was making a different argument entirely: that Moses wrote long before Plato, and that Plato himself had drawn on Moses' own account of creation. Justin wrote: \u201cMoses is older than all the Greek writers. Philosophers and poets have spoken of the undying soul, of punishment after death, of the study of heavenly things, and of teachings like these. Whatever they said, they received such hints from the prophets. Those hints let them understand and explain these things.\u201d\n\nWhat the apostles had written stood together with what could still be received directly from apostolic testimony. Neither one stood below the other. We were not working from one closed book held above everything else.\n\nIf you are asking what makes the scriptures worth returning to - we cannot answer that for you. We returned to them because we believed they pointed toward Christ, and because they were read and opened up to us when we gathered. What you find in them is yours to weigh.", "cites": ["pahc.quote.moses-is-more-ancient", "pahc.witness.reading-scripture", "pahc.witness.scripture-and-testimony"], "entries": [{"sentence": "We cannot tell you what your own scriptures mean to you, or where to look in them.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "Reading, for us, was not a private thing done alone with a scroll.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "On the day we gathered, someone read aloud - the memoirs the apostles left, or the writings of the prophets.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "This went on for as long as there was time.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "Then the one who led us explained what had been read.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "So even someone who could not read for themselves received it the same way everyone in the room did: by hearing it, and having it opened up to them afterward.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "What we called scripture, mostly, was what you would later call the Old Testament.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "Justin, one of us, read the prophets at length, watching for how their own words already pointed toward Christ, long before Christ came.", "record_ids": ["pahc.witness.reading-scripture"]}, {"sentence": "When he argued from Genesis, it was not against a later question about nature and science - that fight had not been invented yet.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "He was making a different argument entirely: that Moses wrote long before Plato, and that Plato himself had drawn on Moses' own account of creation.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "Justin wrote: \u201cMoses is older than all the Greek writers. Philosophers and poets have spoken of the undying soul, of punishment after death, of the study of heavenly things, and of teachings like these. Whatever they said, they received such hints from the prophets. Those hints let them understand and explain these things.\u201d", "record_ids": ["pahc.quote.moses-is-more-ancient"]}, {"sentence": "What the apostles had written stood together with what could still be received directly from apostolic testimony.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "Neither one stood below the other.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "We were not working from one closed book held above everything else.", "record_ids": ["pahc.witness.scripture-and-testimony"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.023, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "We were not working from one closed book held above everything else. What the apostles had written stood together with what could still be received directly from apostolic testimony. Neither one stood below the other. The letters carried between our communities held real weight too. When Rome wrote to Corinth about elders wrongly removed, it pressed its own view of proper order with force. That was authority exercised through correspondence, not through a settled hierarchy or a closed book.\n\nWe also listened to those who spoke as the Spirit prompted - the prophetes, our own word for them. They were welcomed where genuine and tested where doubtful. In some places the settled offices of overseer and elder were taking the prophet's place. So you could say we had at least three sources: the apostles' own writings, the testimony still handed on among us, and the letters that held us together across distance. In places where a prophet still spoke, you could count that as a fourth. None of them stood alone as the one thing every question had to be settled by.", "cites": ["pahc.gravity.translocal-network", "pahc.story.first-clement-corinthian-dispute", "pahc.term.prophetes", "pahc.witness.scripture-and-testimony"], "entries": [{"sentence": "We were not working from one closed book held above everything else.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "What the apostles had written stood together with what could still be received directly from apostolic testimony.", "record_ids": ["pahc.witness.scripture-and-testimony"]}, {"sentence": "Neither one stood below the afterward, by people who came after us.\n\nThe overseer - where there was one - watched over a community's table and its unity. The elders shared the governing of a community, either as a council holding the whole trust or gathered around one overseer. But that argument was made in a letter correcting another church's dispute.\n\nHow authority actually moved from hand to hand in an ordinary household - who decided that this man should be the next elder, how a prophet's claim to speak was tested, what happened when someone disagreed - our record does not show. Everything we left behind was written by the few among us who could write, and it is a city record. What an ordinary believer made of the teaching as it was read aloud, what authority looked like in a village rather than a city street, our own words cannot show you.\n\nThere is one other silence we must name. Women were remembered as leaders of the households where we gathered. Two women among us carried the name ministrae - a title of service, of office. But every woman you will meet in our record arrives through a man's pen. Whether she would have told the story of authority the way our letters tell it - what leading a household gathering looked like from where she stood - our record cannot say. That silence is real, and we will not fill it with a voice we do not have.", "cites": ["pahc.gravity.authority-consolidation", "pahc.limit.ordinary-majority", "pahc.limit.womens-own-words", "pahc.story.first-clement-corinthian-dispute", "pahc.term.episkopos", "pahc.term.ministrae", "pahc.term.presbyteros", "pahc.witness.what-we-never-settled"], "entries": [{"sentence": "We never agreed on who should lead.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "In some of our towns, one bishop - the episkopos - with elders and deacons beside him, was the whole shape of how we held together.", "record_ids": ["pahc.witness.what-we-never-settled"]}, {"sentence": "Presbyteros and diakonos were our own words
