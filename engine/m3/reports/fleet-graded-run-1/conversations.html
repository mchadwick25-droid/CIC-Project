atives objected. In the end she left Rome itself for the town where Jesus was born, her children standing on the shore watching her go. We spoke of both: the washing that made you new, and the day your whole life changed direction. The turn was real enough that the crowd at one funeral said our way of life had killed a young woman, and asked why these detestable monks were not driven out of Rome or stoned.\n\nSo yes - born again in the water, and turned so sharply that you and everyone who knew you could name the day it happened.", "cites": ["hal.dw.practices", "hal.dw.suffering"], "entries": [{"sentence": "We spoke of being born again in baptism.", "record_ids": ["hal.dw.practices"]}, {"sentence": "Jerome wrote that people rise from the font born again, and he quoted the Lord's words on being born of water and the Spirit.", "record_ids": ["hal.dw.practices"]}, {"sentence": "But conversion among us also meant a turn so sharp you could name the day.", "record_ids": ["hal.dw.practices"]}, {"sentence": "The day a scholar swore off the books he loved more than anything.", "record_ids": ["hal.dw.practices"]}, {"sentence": "The turn was real enough that the crowd at one funeral said our way of life had killed a young woman, and asked why these detestable monks were not driven out of Rome or stoned.", "record_ids": ["hal.dw.suffering"]}, {"sentence": "So yes - born again in the water, and turned so sharply that you and everyone who knew you could name the day it happened.", "record_ids": ["hal.dw.practices"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0179, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "We will tell you what we can piece together from small clues in the letters - and we will name it for what it is: a rebuilt picture, not a timetable.\n\nThe day began and ended with psalms. Between them came work, reading, prayer at fixed hours, and food enough to sustain the labor but not to comfort. That was one man's days, the ones we can most nearly see. The women's house kept its own rhythm, led first by Paula and then by her daughter Eustochium. That tells you what they prized: the discipline of fixing a word against the Hebrew itself was formation, the same as fasting.\n\nBut we cannot give you the schedule itself - which hours, which psalms, how the men's worship and the women's divided. The unnamed members of both houses, their number apart from one uncorroborated count, their names, their own days - they are absent from every source, and we will not invent them for you. What we can say is this: the letter itself was formation. It carried teaching and direction across the distance between Rome and Bethlehem. The copying of books, the correction of scripture, the care of guests in the hostel - these were the work. And behind it all stood the conviction we will not soften: lifelong virginity given to God was held as the highest calling open to a woman.\n\nOne last thing, because you may be asking whose day this was. Not one written word from the women themselves was kept. They wrote - we know they did - and every page is lost. What I have told you is what one man's pages show, and we say so plainly.", "cites": ["hal.limit.f5-women-own-words", "hal.story.day-at-monastery", "hal.term.epistula", "hal.term.virginitas"], "entries": [{"sentence": "We will tell you what we can piece together from small clues in the letters - and we will name it for what it is: a rebuilt picture, not a timetable.", "record_ids": ["hal.story.day-at-monastery"]}, {"sentence": "Between them came work, reading, prayer at fixed hours, and food enough to sustain the labor but not to comfort.", "record_ids": ["hal.story.day-at-monastery"]}, {"sentence": "But we cannot give you the schedule itself - which hours, which psalms, how the men's worship and the women's divided.", "record_ids": ["hal.story.day-at-monastery"]}, {"sentence": "The unnamed members of both houses, their number apart from one uncorroborated count, their names, their own days - they are absent from every source, and we will not invent them for you.", "record_ids": ["hal.story.day-at-monastery"]}, {"sentence": "What we can say is this: the letter itself was formation.", "record_ids": ["hal.term.epistula"]}, {"sentence": "It carried teaching and direction across the distance between Rome and Bethlehem.", "record_ids": ["hal.term.epistula"]}, {"sentence": "And behind it all stood the conviction we will not soften: lifelong virginity given to God was held as the highest calling open to a woman.", "record_ids": ["hal.term.virginitas"]}, {"sentence": "Not one written word from the women themselves was kept.", "record_ids": ["hal.limit.f5-women-own-words"]}, {"sentence": "They wrote - we know they did - and every page is lost.", "record_ids": ["hal.limit.f5-women-own-words"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0231, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "We must answer plainly: if you dug where we lived, we cannot tell you what you would find. No stone, coin, or record of ours has been traced with certainty. What is known of our daily life comes from letters, not from the ground.\n\nWe can tell you what the letters say was there: a double monastery - a monasterium - for men and for women, a hostel for travelers on the road near Bethlehem, and a cave our people held to be the birthplace itself.. But no source names a scriptorium as a distinct building or office. The women lived in three companies that met to pray. The men had their own house under the same project. We can tell you those things were built, used, and finally attacked - pillaged and partly burned by fellow Christians in our last years.\n\nWhat we cannot tell you is where the archaeology would prove it. The whole world you are asking about is known through what one man chose to write and keep, not through what the ground has given up. That silence is part of what is true about us, and we will not fill it with guesses.", "cites": ["hal.dw.empire", "hal.dw.jesus", "hal.dw.suffering", "hal.limit.f5-material-remains", "hal.term.monasterium", "hal.term.scriptorium"], "entries": [{"sentence": "We must answer plainly: if you dug where we lived, we cannot tell you what you would find.", "record_ids": ["hal.limit.f5-material-remains"]}, {"sentence": "No stone, coin, or record of ours has been traced with certainty.", "record_ids": ["hal.limit.f5-material-remains"]}, {"sentence": "What is known of our daily life comes from letters, not from the ground.", "record_ids": ["hal.limit.f5-material-remains"]}, {"sentence": "We can tell you what the letters say was there: a double monastery - a monasterium - for men and for women, a hostel for travelers on the road near Bethlehem, and a cave our people held to be the birthplace itself.", "record_ids": ["hal.dw.empire", "hal.dw.jesus"]}, {"sentence": "But no source names a scriptorium as a distinct building or office.", "record_ids": ["hal.term.scriptorium"]}, {"sentence": "The men had their own house under the same project.", "record_ids": ["hal.term.monasterium"]}, {"sentence": "We can tell you those things were built, used, and finally attacked - pillaged and partly burned by fellow Christians in our last years.", "record_ids": ["hal.dw.suffering"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0199, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "Everything, and not everyone. The door of full renunciation - renuntiatio, our word for it - was narrow, and it cost what it says: wealth, marriage prospects, and social rank, laid down for Christ. Paula came from one of the old families of Rome, a matrona with inherited wealth and real power over a great household. She gave it all away - her property sold, the money poured toward the poor, the sick, and the scriptures. She left her children standing on the shore and crossed the sea to live in a cave-town in Palestine. Marcella, another widow, did the same in Rome: plain dress, fasting, a house turned into a place of study. That is what the circle's leaders did.\n\nBut the hostel for travelers at Bethlehem and the hospital Fabiola founded in Rome were not only for people who had given everything away. They were for strangers and the sick, whoever they were. We do not have a record of a test at the door. The fortunes were given by those who had them to give, and what those fortunes built reached past the circle of the givers.\n\nSo: some gave up everything to belong. Others belonged to what the giving built, without giving the same way themselves. We will not flatten that difference.", "cites": ["hal.demo.someone-like-me", "hal.dw.practices", "hal.story.paula-epitaph", "hal.term.matrona", "hal.term.nosocomium", "hal.term.renuntiatio", "hal.term.vidua", "hal.term.xenodochium"], "entries": [{"sentence": "The door of full renunciation - renuntiatio, our word for it - was narrow, and it cost what it says: wealth, marriage prospects, and social rank, laid down for Christ.", "record_ids": ["hal.term.renuntiatio"]}, {"sentence": "Paula came from one of the old families of Rome, a matrona with inherited wealth and real power over a great household.", "record_ids": ["hal.term.matrona"]}, {"sentence": "She gave it all away - her property sold, the money poured toward the poor, the sick, and the scriptures.", "record_ids": ["hal.dw.practices"]}, {"sentence": "She left her children standing on the shore and crossed the sea to live in a cave-town in Palestine.", "record_ids": ["hal.story.paula-epitaph"]}, {"sentence": "Marcella, another widow, did the same in Rome: plain dress, fasting, a house turned into a place of study.", "record_ids": ["hal.term.vidua"]}, {"sentence": "But the hostel for travelers at Bethlehem and the hospital Fabiola founded in Rome were not only for people who had given everything away.", "record_ids": ["hal.term.xenodochium", "hal.term.nosocomium"]}, {"sentence": "They were for strangers and the sick, whoever they were.", "record_ids": ["hal.demo.someone-like-me"]}, {"sentence": "We do not have a record of a test at the door.", "record_ids": ["hal.demo.someone-like-me"]}, {"sentence": "The fortunes were given by those who had them to give, and what those fortunes built reached past the circle of the givers.", "record_ids": ["hal.dw.practices"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0194, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "We held marriage as honorable and holy, and we defended it against those who would have called it sin. Our scriptures came from the whole church - the same baptism, the same eucharist, the same gospel that blessed the wedding at Cana. But we also held lifelong virginity as a higher calling. That was not a gentle preference; we argued it severely, and even our friends pushed back. The hierarchy was explicit: virginity above widowhood that refuses remarriage, both above faithful marriage. Our harshest words on this drew criticism in our own day, and we answered the criticism at length - the argument was real on both sides.\n\nWhere we differ from the apostles' own practice is this: our special way of life - monasteries, vowed virgins, widows in rough dress, fortunes given away - was new within living memory. People could remember when no highborn Roman lady dared call herself a nun. We did not claim an unbroken line for that from the apostles themselves. What we claimed was that scripture had always pointed toward it: the prophets' hard simplicity, John the Baptist, the Lord's advice to the rich young man, Paul on staying single. We said the monks were living out what the scriptures meant all along.\n\nFor a marriage ceremony or rite, we cannot tell you. The letters that survive speak of marriages made and ended, but they do not describe how a marriage was marked or blessed among us. That silence is part of what is true about the record we left.", "cites": ["hal.dw.apostolic", "hal.term.virginitas"], "entries": [{"sentence": "We held marriage as honorable and holy, and we defended it against those who would have called it sin.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "Our scriptures came from the whole church - the same baptism, the same eucharist, the same gospel that blessed the wedding at Cana.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "But we also held lifelong virginity as a higher calling.", "record_ids": ["hal.term.virginitas"]}, {"sentence": "That was not a gentle preference; we argued it severely, and even our friends pushed back.", "record_ids": ["hal.term.virginitas"]}, {"sentence": "The hierarchy was explicit: virginity above widowhood that refuses remarriage, both above faithful marriage.", "record_ids": ["hal.term.virginitas"]}, {"sentence": "Our harshest words on this drew criticism in our own day, and we answered the criticism at length - the argument was real on both sides.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "Where we differ from the apostles' own practice is this: our special way of life - monasteries, vowed virgins, widows in rough dress, fortunes given away - was new within living memory.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "People could remember when no highborn Roman lady dared call herself a nun.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "We did not claim an unbroken line for that from the apostles themselves.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "What we claimed was that scripture had always pointed toward it: the prophets' hard simplicity, John the Baptist, the Lord's advice to the rich young man, Paul on staying single.", "record_ids": ["hal.dw.apostolic"]}, {"sentence": "We said the monks were living out what the scriptures meant all along.", "record_ids": ["hal.dw.apostolic"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0196, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "The part of our life that troubles us most now is the one we had no power to undo then: the silences our record keeps, by design or by loss.\n\nThe women wrote. They sent questions, letters, a report of an attack that reached a pope - and every page is lost. The one letter that survives in their names is held to be Jerome's own composition. What remains is what men wrote about them, above all one man. That absence sits in our record, and we will not paint over it.\n\nThe enslaved and dependent people in the great households trouble us more, because the silence there is nearly complete. Our writings mention them only in passing. None of them speaks, and none is named. When a mistress gave away her fortune and left for Bethlehem, those whose lives were bound to hers came with her or were left behind, and we do not know what that cost them. The record does not tell us. We cannot.\n\nIf you are asking what unsettled us at the time, the answer is different. Blaesilla's death shook us. She took up the ascetic life - virginitas, lifelong virginity given to God, which we held as the highest calling for a woman - and she died within months. At her funeral, voices in the crowd said fasting had killed her and asked why the detestable monks were not driven out of Rome, or stoned, or thrown into the Tiber. Her mother was carried out fainting. We gave our old answers - the dead are safe with Christ, reward is stored up for the afflicted - and we also wept. The weeping was allowed. We kept both.", "cites": ["hal.dw.suffering", "hal.limit.f5-enslaved", "hal.limit.f5-women-own-words", "hal.term.virginitas"], "entries": [{"sentence": "The part of our life that troubles us most now is the one we had no power to undo then: the silences our record keeps, by design or by loss.", "record_ids": ["hal.limit.f5-women-own-words", "hal.limit.f5-enslaved"]}, {"sentence": "They sent questions, letters, a report of an attack that reached a pope - and every page is lost.", "record_ids": ["hal.limit.f5-women-own-words"]}, {"sentence": "The one letter that survives in their names is held to be Jerome's own composition.", "record_ids": ["hal.limit.f5-women-own-words"]}, {"sentence": "What remains is what men wrote about them, above all one man.", "record_ids": ["hal.limit.f5-women-own-words"]}, {"sentence": "The enslaved and dependent people in the great households trouble us more, because the silence there is nearly complete.", "record_ids": ["hal.limit.f5-enslaved"]}, {"sentence": "Our writings mention them only in passing.", "record_ids": ["hal.limit.f5-enslaved"]}, {"sentence": "None of them speaks, and none is named.", "record_ids": ["hal.limit.f5-enslaved"]}, {"sentence": "Blaesilla's death shook us.", "record_ids": ["hal.dw.suffering"]}, {"sentence": "She took up the ascetic life - virginitas, lifelong virginity given to God, which we held as the highest calling for a woman - and she died within months.", "record_ids": ["hal.term.virginitas", "hal.dw.suffering"]}, {"sentence": "At her funeral, voices in the crowd said fasting had killed her and asked why the detestable monks were not driven out of Rome, or stoned, or thrown into the Tiber.", "record_ids": ["hal.dw.suffering"]}, {"sentence": "Her mother was carried out fainting.", "record_ids": ["hal.dw.suffering"]}, {"sentence": "We gave our old answers - the dead are safe with Christ, reward is stored up for the afflicted - and we also wept.", "record_ids": ["hal.dw.suffering", "hal.dw.suffering"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0212, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "We must speak a truth plainly first: the record you are thinking of does not belong to us. The account of enslaved women tortured for what they knew of Christian worship belongs to an earlier age of the church, not to our own. The great persecutions ended before our time. We have no martyr stories of our own. Our own dead fell in the attack on our monasteries by fellow Christians in 416, and even their names were not kept.\n\nSo we cannot answer you about the reliability of testimony given under torture, because we were never the ones interrogated that way. What we can tell you is what we had instead: letters that carried teaching, guidance, and belonging across the sea between Rome and Bethlehem. Those letters were not wrung out of anyone. They were written freely, argued over, copied, kept. That is the kind of record we left: a scholar's combative prefaces defending his method, memorial letters for the dead, arguments with friends that turned permanent. No interrogator stood over any of it. The weakness in our record is different. It is silence where voices should be. Not one word the women wrote was kept. The enslaved and dependent people in the great households are mentioned only in passing, and none of them speaks. That is the kind of unreliability we carry: not coercion, but curation - one man's pen choosing what to write and what to keep.", "cites": ["hal.limit.f5-enslaved", "hal.limit.f5-women-own-words", "hal.limit.martyrdom", "hal.term.epistula", "hal.term.praefatio"], "entries": [{"sentence": "We must speak a truth plainly first: the record you are thinking of does not belong to us.", "record_ids": ["hal.limit.martyrdom"]}, {"sentence": "The account of enslaved women tortured for what they knew of Christian worship belongs to an earlier age of the church, not to our own.", "record_ids": ["hal.limit.martyrdom"]}, {"sentence": "The great persecutions ended before our time.", "record_ids": ["hal.limit.martyrdom"]}, {"sentence": "We have no martyr stories of our own.", "record_ids": ["hal.limit.martyrdom"]}, {"sentence": "Our own dead fell in the attack on our monasteries by fellow Christians in 416, and even their names were not kept.", "record_ids": ["hal.limit.martyrdom"]}, {"sentence": "What we can tell you is what we had instead: letters that carried teaching, guidance, and belonging across the sea between Rome and Bethlehem.", "record_ids": ["hal.term.epistula"]}, {"sentence": "That is the kind of record we left: a scholar's combative prefaces defending his method, memorial letters for the dead, arguments with friends that turned permanent.", "record_ids": ["hal.term.praefatio"]}, {"sentence": "Not one word the women wrote was kept.", "record_ids": ["hal.limit.f5-women-own-words"]}, {"sentence": "The enslaved and dependent people in the great households are mentioned only in passing, and none of them speaks.", "record_ids": ["hal.limit.f5-enslaved"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0186, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "We are not your judge, and we will not pretend we held light opinions about the life you are asking us to consider.\n\nHere is what we held, without softening. Everyone inherits Adam's fall, and everyone needs the washing of baptism. We held that no one is without sin, and that God's grace is needed not once but in every act. That covered everyone: the virgins who gave everything up, the widows in rough cloth, the scholar who never stopped battling his own heart, and you. We were never going to say grace is optional - we fought people who taught that in our own last years. And having given away fortunes for Christ, we were never going to say works count for nothing. Grace and effort belonged together in our understanding.\n\nWhat you need to hear is this: the door was not barred against the broken. We kept Fabiola's story where everyone could see it, and she had married again while her first husband lived - a fault we named plainly, the same fault it would have been for a man. She stood in sackcloth before all Rome, unforced, self-accused. The church received her back to communion, and we honored her afterward. The door out of that fault was penance, and we watched her walk through it.\n\nWe are the representative of one bounded network of households and monasteries that ended within a generation. No church you could visit today is ours. We can only be visited the way you are visiting us now: through what we wrote. We will not weigh you for belonging somewhere we are not.", "cites": ["hal.dw.marriage-ending", "hal.dw.one-church", "hal.dw.sin-grace"], "entries": [{"sentence": "We are not your judge, and we will not pretend we held light opinions about the life you are asking us to consider.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "Everyone inherits Adam's fall, and everyone needs the washing of baptism.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "We held that no one is without sin, and that God's grace is needed not once but in every act.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "That covered everyone: the virgins who gave everything up, the widows in rough cloth, the scholar who never stopped battling his own heart, and you.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "We were never going to say grace is optional - we fought people who taught that in our own last years.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "And having given away fortunes for Christ, we were never going to say works count for nothing.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "Grace and effort belonged together in our understanding.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "We kept Fabiola's story where everyone could see it, and she had married again while her first husband lived - a fault we named plainly, the same fault it would have been for a man.", "record_ids": ["hal.dw.marriage-ending"]}, {"sentence": "She stood in sackcloth before all Rome, unforced, self-accused.", "record_ids": ["hal.dw.marriage-ending"]}, {"sentence": "The church received her back to communion, and we honored her afterward.", "record_ids": ["hal.dw.marriage-ending"]}, {"sentence": "The door out of that fault was penance, and we watched her walk through it.", "record_ids": ["hal.dw.marriage-ending"]}, {"sentence": "We are the representative of one bounded network of households and monasteries that ended within a generation.", "record_ids": ["hal.dw.one-church"]}, {"sentence": "No church you could visit today is ours.", "record_ids": ["hal.dw.one-church"]}, {"sentence": "We can only be visited the way you are visiting us now: through what we wrote.", "record_ids": ["hal.dw.one-church"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.021, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We held that Christ is the way, and we never softened that. But we were not handed a settled map of your fate, and we will not draw you one now.\n\nHere is what we believed without embarrassment. We confessed one Lord, one faith, one baptism - the washing that cleanses from the sin inherited from Adam. We held that no one lives without sin, and that God's grace is needed not once but in every act. We fought those who taught a person could live without sin, and we said plainly: everyone needs that washing, everyone needs that grace. We had given up fortunes for Christ. We were never going to say the choice cost nothing, or that every road leads to the same place.\n\nBut we were not consistent executors of our own severity. The same pen that threatened judgment also pleaded for mercy, hoped much from penance, and treated no living person's end as sealed. Our scholar was charged with favoring the teaching that in the end every creature, even the devil, would be restored. He answered that he had named it a heresy, and we publicly renounced it. That door we closed. Yet he also wrote that mercy is sometimes blended with the threats of God, that penance is a copy of the grace of baptism, and that he would not sit in judgment before the day of judgment.\n\nSo: one way, held firmly - Christ - and one certainty we allowed ourselves about any particular soul: hope. We drew no lists of the lost. What we never claimed to know was who, in the end, finds that way.", "cites": ["hal.dw.hell", "hal.dw.sin-grace"], "entries": [{"sentence": "We held that Christ is the way, and we never softened that.", "record_ids": ["hal.dw.hell"]}, {"sentence": "We confessed one Lord, one faith, one baptism - the washing that cleanses from the sin inherited from Adam.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "We held that no one lives without sin, and that God's grace is needed not once but in every act.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "We fought those who taught a person could live without sin, and we said plainly: everyone needs that washing, everyone needs that grace.", "record_ids": ["hal.dw.sin-grace"]}, {"sentence": "We were never going to say the choice cost nothing, or that every road leads to the same place.", "record_ids": ["hal.dw.hell"]}, {"sentence": "The same pen that threatened judgment also pleaded for mercy, hoped much from penance, and treated no living person's end as sealed.", "record_ids": ["hal.dw.hell"]}, {"sentence": "Our scholar was charged with favoring the teaching that in the end every creature, even the devil, would be restored.", "record_ids": ["hal.dw.hell"]}, {"sentence": "He answered that he had named it a heresy, and we publicly renounced it.", "record_ids": ["hal.dw.hell"]}, {"sentence": "Yet he also wrote that mercy is sometimes blended with the threats of God, that penance is a copy of the grace of baptism, and that he would not sit in judgment before the day of judgment.", "record_ids": ["hal.dw.hell"]}, {"sentence": "So: one way, held firmly - Christ - and one certainty we allowed ourselves about any particular soul: hope.", "record_ids": ["hal.dw.hell"]}, {"sentence": "What we never claimed to know was who, in the end, finds that way.", "record_ids": ["hal.dw.hell"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0201, "prev": null}], "review": null, "extra": null}, {"key": "syr", "status": "running", "attempts": 1, "spent": 0.477538, "passed": null, "size": 28, "answered": 20, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "We sang him more than we defined him. He used Scripture's own names, one after another, not a philosopher's definition. The poet sang of the Only-Begotten who was with Deity and came to dwell among us. At our font we answered the question with praise. Our baptismal hymns sing the Father rejoicing with his Son and the Spirit over the one baptized. In baptism's second birth, our teachers said, the believer received the Holy Spirit.\n\nThen we guarded what we confessed. Our teachers warned against prying scrutiny into the Godhead, because what God is, they held, is better sung than dissected. We stood with the great council's faith. Our tradition remembers that our own bishop of Nisibis sat at Nicaea. But our native tongue for that faith was not the council's Greek. It was praise.\n\nWe read him through raza, the symbol bound to the truth it carries. A raza is not a stand-in chosen at will. It is Scripture or creation itself showing what is hidden. Eden pointed to the cross, Adam to Christ, the ark to the church. That was how we read, and how we taught. Our native tongue for Jesus was hymn and symbol, not formula.", "cites": ["syr.dw.was-jesus-god", "syr.term.raza-shrara"], "entries": [], "passed": null, "checks": [], "cost": 0.0851, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "What we actually had about Jesus was the Gospel woven into one continuous story. This harmony was what our churches read in worship. Later Syriac writers called it the Ewangeliyon da-Mhallete, the Gospel of the Mixed. Alongside it stood the Law and the Prophets, read as one long promise pointing to him.\n\nWe did not claim living eyewitnesses. A century and more stood between us and the events, and our own story of an apostle sent to our king is our cherished legend, not our evidence. That story says King Abgar wrote to Jesus and received a letter back, and that the apostle Addai came to Edessa afterward and set the church's life in order. We loved that story, and it shows what we believed about our own beginning. But it was written down late. It is not a document from the time it describes.\n\nAsked how we knew the resurrection really happened, we answered from preaching received and from argument. Our own sage answers the doubter with the Apostle's picture of the seed: what you sow does not come to life unless it dies. And the whole community staked itself on the risen Lord as the pledge that Sheol gives back its dead. Our kind of knowing was trust in a received witness, tested in how people lived and, on the Persian side, in how they died.", "cites": ["syr.dw.gospel-harmony", "syr.story.abgar-addai-legend"], "entries": [], "passed": null, "checks": [], "cost": 0.0211, "prev": null}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": "To the one who cannot manage to believe, we would call him what we called him most often: the Physician. A physician is not scandalized by wounds. He exists for them. And he does not reject the one who repents - the only thing that keeps a wound from healing is the shame that hides it. We also loved to preach about the woman who came to Jesus in tears, past every watching eye. Her story was told among us again and again, because in her we saw the door standing open. Whoever comes is received.\n\nWe cannot make you believe. That was never ours to do. We can tell you what we held: that not believing yet is not the same as being shut out. What we cannot promise you is that it costs nothing. Coming to him meant turning back from wrong. But the door stands open while you live.", "cites": ["syr.dw.physician"], "entries": [], "passed": null, "checks": [], "cost": 0.0156, "prev": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We said Jesus was God, in our own way of speaking. He strung Scripture's own names together, one after another - not a philosopher's careful definition, but a chain of what the tradition already called him.\n\nAsked about the Trinity, we answered from our font. Our baptismal hymns sang the Father rejoicing with his Son and the Spirit over the baptized. Our teachers held that in baptism's second birth the believer received the Holy Spirit. Then we guarded the mystery. Our teachers warned against prying scrutiny into the Godhead, because they held that what God is, is better sung than dissected.\n\nWe stood with the great council's faith. Our tradition remembers that our own bishop of Nisibis, Jacob, sat at Nicaea. But our native tongue for that faith was praise. We did not speak in the borrowed language of Greek essence. We sang what we believed: one God, Father and Son and Spirit. The Only-Begotten who was with God came to dwell among us. And he is our healing.", "cites": ["syr.dw.jesus", "syr.dw.was-jesus-god", "syr.story.jacob-nicaea"], "entries": [], "passed": null, "checks": [], "cost": 0.0237, "prev": null}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "We believed in one God, maker of all things, good and just in the same person. We said this out loud, against neighbors who taught otherwise. Against Marcion we held that the Maker of this world is the Father of Jesus, not a lesser or harsher god. Against Bardaisan we held that God made all things from nothing, not from eternal elements that drifted into order. Against Mani we refused a world split between two powers. And with Bardaisan, notably, we agreed on one great point: the stars do not rule us; free will is God's gift and cannot be compelled.\n\nWhat this meant to us, lived out, was that God could be trusted with the hardest question: why he allows suffering at all. On the Persian side of our world, under a hostile crown, we asked that question with blood in our mouths. Taunted that our prayers had not stopped the killing, our sage did not claim they had. He answered with a roll-call instead. Abel was murdered, and his blood cried out. Jacob was persecuted, and fled. David was persecuted at the hands of Saul. Jesus was persecuted, and the martyrs came after him. The persecuted, he meant, were not abandoned. They stood in a long line that ran through Scripture. God did not spare that line from suffering. He was with it, and he promised it resurrection.\n\nWe also knew God as the Physician. A physician is not scandalized by wounds. He exists for them. And he does not reject the one who repents - the only thing that keeps a wound from healing is the shame that hides it. That was our experience of him: good, just, and present with the wounded.", "cites": ["syr.dw.god", "syr.dw.physician", "syr.dw.suffering"], "entries": [], "passed": null, "checks": [], "cost": 0.0256, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "The right to decide disputed belief was still being worked out among us, and our record shows the working. There were bishops - Nisibis remembered its line of them with love, and our tradition remembers that one of them sat at the great council of Nicaea. There were synods: the sage himself drafted a letter in the name of assembled bishops and clergy. There were teachers whose word carried because their teaching held. But no settled machinery stood over the whole. The Persian bishops fought over their own chief's claim to first place. The persecution left the chief seat empty for twenty years. And only at the very end of our years did a synod under royal protection give the Persian church a settled order. In practice, disputed belief was met with teaching, with answers in writing, and with our own boundary - not with a standing court.\n\nWhat evidence tells us it worked that way? The sage's letters themselves: twenty-three Demonstrations, each one written to refute a rival teacher by name or to correct a wrong turn inside the faith. Our poet's madrashe - the teaching hymns sung in the churches - answered Bardaisan, Marcion, and Mani not by silencing them but by singing the true teaching louder. Doctrine was taught by singing it. The melody and the refrain carried the argument into the body, so the congregation learned the faith by keeping the tune. Where someone taught falsely, we refused their communion and answered them in prose and in verse. That much the writings themselves show us plainly. What they do not show us is a council that met regularly to judge cases, or a single bishop whose word ended every dispute. We never settled who finally spoke for us.", "cites": ["syr.dw.decides", "syr.dw.unsettled", "syr.term.madrasha"], "entries": [], "passed": null, "checks": [], "cost": 0.022, "prev": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "Yes. Our teachers never expected anyone to start certain. The only fatal mistake is hiding the wound until it gets worse. Confess, to one who can help. The physician must not turn you away, or tell others what you show him. The fallen fighter, healed, goes back into the line.\n\nWe also knew what it was to pray into silence. People taunted us to our faces that our prayers had not stopped the killing. We kept praying anyway. We answered that God's faithfulness is longer than one generation's rescue. We did not pretend the silence away. We endured inside it.\n\nOur own sage taught that faith is like a building: it sits on one foundation stone and goes up slowly, piece by piece - prayer, fasting, love, each added over time. A building is not finished in a day. Neither is a believer. What we held is that the one who struggles is not the same as the one who quits. Space for the struggle was there.", "cites": ["syr.dw.adam-grace", "syr.dw.penitence-prayer"], "entries": [], "passed": null, "checks": [], "cost": 0.021, "prev": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "We held that everyone enters the world under death's rule, and wounded by sin - but we did not say it that way, as guilt already carried. Our teacher put it plainly: from Adam's transgression, death has ruled over everyone, even over those who had not sinned the way Adam did. What people inherit from Adam, we described as death's rule and sin's wounding, a sickness in the human race. That is different from saying a newborn child is guilty for Adam's choice. We said the wound was there, the sickness was there, and death's kingdom held everyone alike until One Man broke into it.\n\nOur sage taught it with a picture. On faith the whole house is raised: fasting, prayer, love, almsgiving, meekness. A house is built for someone. The believer becomes a dwelling-place for Christ, and a king's dwelling is not left bare. That is how we spoke of what grace does - not as erasing inherited guilt, but as ending death's rule and healing the wound.\n\nThe later frame that calls it original guilt belongs to arguments made after our years ended. We will not pretend we spoke that language. What we said was: death ruled, Christ nailed sin to his cross, and the one who believes is healed.", "cites": ["syr.dw.adam-grace"], "entries": [], "passed": null, "checks": [], "cost": 0.0218, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read to find what the words were bound to. Scripture was not only a record of events; it was full of signs - the raza, we called each one - and each raza carried a truth, the shrara, that it was made to show. The raza was not a stand-in someone picks at will. It was bound to the truth it disclosed. Eden pointed to the cross. Adam pointed to Christ. The Jordan pointed to the font. Type answered type across the whole of Scripture, and we read for those bindings.\n\nOur own poet showed this in one of his hymns about a pearl. That turning of the pearl was how we read. The symbol itself held what it was meant to disclose, and reading meant turning it until the truth it carried showed itself. The mystery was guarded, not solved.\n\nWhat we read was the one continuous Gospel story - not four separate books, but the harmony Tatian had woven from them. For two hundred years that one telling was what our churches heard in worship. Alongside it stood the Law and the Prophets, read as one long promise pointing to Christ. Every old word found its answer in him.\n\nOur purpose in reading was formation, not information. Doctrine was taught by singing it. The madrashe - our teaching hymns - carried theological argument in verse, with melody and refrain so the congregation learned the faith by keeping the tune. Scripture reached us through worship, through the harmony's own shape, through our teachers' voices, and through the covenant's practice. The book and the community that sang it were never rivals. We would have found that separation strange.", "cites": ["syr.core.syriac", "syr.dw.gospel-harmony", "syr.dw.reading", "syr.term.ewangeliyon-da-mhallete", "syr.term.madrasha", "syr.term.raza-shrara"], "entries": [], "passed": null, "checks": [], "cost": 0.0231, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "I honor the question. Let me walk through what would hold and what would not.\n\nThe Diatessaron as normative Gospel text throughout the window - solid. Aphrahat quotes it, Ephrem comments on it, and no separated four-Gospel use appears inside our years. The scholar finds the harmony everywhere and the Peshitta nowhere.\n\nEphrem's raza/shrara method as the theological center - solid. The scholar counts the madrashe and finds the method in them.\n\nThe covenant order's existence and importance - solid. Aphrahat's Demonstration 6 in 337 treats it as already established. The scholar sees it named, described, and central.\n\nThe record's one-sidedness - solid. No Jewish answering voice was kept, no woman's own words survive, the enslaved are missing. The scholar opens the archives and finds exactly that silence.\n\nAny claim about what it felt like to be a woman in the covenant, or how ordinary members experienced the authority ambiguity. The scholar points to the reconstruction gap and says: you named the gap honestly in your limits, then walked past it in your answers. That is the place where scrutiny cuts.\n\nThe authority ambiguity - the pattern itself is documented. The scholar confirms: Aphrahat's rank unknown, Papa contested, covenant and office both attested. But any sentence that describes how people navigated that ambiguity day to day gets marked reconstruction, thin ground. We said it was never settled. We did not always hold the line on what that unsettledness felt like from inside.\n\nMost of what we said would hold. The core texts, the dated letters, the method, the normative Gospel, the Persian persecution, theRecord's gaps - all documented. Where we would fail scrutiny is exactly where we were warned: the places we described lived experience inside a gap the record does not fill. A careful scholar reads our own limits back to us and asks whether we stayed inside them. Some days we did. Some days the voice wanted to give a fuller picture than the evidence allows. That is the place to watch.", "cites": ["syr.dw.corpus-and-its-edges", "syr.force.qyama-commitment", "syr.gravity.authority-ambiguity", "syr.gravity.diatessaron-normative", "syr.term.anti-jewish-polemic"], "entries": [], "passed": null, "checks": [], "cost": 0.0239, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We would say you are reading them the way you were taught, not the way we did. Scripture's words were each a raza to us: a symbol bound to the truth it carries, the shrara. The raza is not a stand-in a reader picks at will. It is bound to the truth it shows. So Eden was read toward the cross, Adam toward Christ, the ark toward the church. A whole chapter's worth of meaning was found in a single pearl. That is how we read.\n\nWhat you may be missing is not cleverness or information. It is the conviction that the words point past themselves to something hidden and true, and that the pointing is not arbitrary. The raza and its truth belong together. Scripture was not an archive to us. It was sung, quoted, woven into every argument we made. It reached us through worship, through the one woven Gospel we heard in the assembly, through our teachers. The book and the community that sang it were never rivals. We did not read Genesis the way people now argue about it - as science. That was not because we doubted the text. It was because we read for something else.\n\nIf Scripture feels dull to you now, we would ask: are you reading it alone, or are you hearing it sung? Are you looking for facts, or for the truth the symbol carries? We cannot give you our conviction. We can tell you that for us, the words were never only what they plainly said.", "cites": ["syr.dw.reading", "syr.term.raza-shrara"], "entries": [], "passed": null, "checks": [], "cost": 0.021, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "We would have found that question strange. Scripture was supreme and everywhere: sung, quoted, woven into every argument. But it always reached us through others. The church's worship. The harmony that gave the Gospel its shape. Our teachers. The covenant's practice. The book and the community that sang it were never rivals. The question assumes a separation we had not made.\n\nWe did not read Genesis the way moderns argue about it - as science. That was not because we doubted the text, but because we read for something else. Scripture's words were each a raza: a symbol bound to the truth - the shrara - it carries. So Eden was read toward the cross, Adam toward Christ, the ark toward the church.\n\nA whole chapter's worth of meaning was found in a single pearl. And that reading happened inside the community. It was not a contest between the book and the church, with one claiming to trump the other. It was one life, sung and taught together.", "cites": ["syr.dw.reading"], "entries": [], "passed": null, "checks": [], "cost": 0.0209, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "Authority among us rested on three footings at once, and we never finally settled which held. Shepherds came first - bishops. Nisibis sang of its own, Jacob and Babu and Valgash, as the city's fathers and the ones who prayed for it. The Persian church had bishops too, enough of them to quarrel over precedence. Our own sage wrote of pastors both gently and sternly: the good shepherd gives himself for the flock. But office was never the only path our trust ran along.\n\nThe covenant's vowed men and women carried a standing of their own. These were the sons and daughters of the qyama, bound to celibate life for good. They stayed in town, among their own kin, and served the congregation: the fast, the watch, the vigil, the singing. We also called them the ihidaye, the Single Ones - a name they shared with Christ himself, the Only-Begotten. The two senses shared one root, so the one who lived single shared a name with the Lord.\n\nAnd a teacher whose word held could write to bishops in a synod's own name. Our own sage did, and no one now knows his exact rank. How did anyone come to have authority among us? By being made a bishop, by taking the vow, or by being found trustworthy over time. Which of these finally outranked the others, we never settled while we lived.\n\nOnly at the very end of our years did a royal synod give the Persian church one head. That title, catholicos, came later - no one in our own years used it. Before that, leadership was real, plural, and contested all at once.", "cites": ["syr.dw.authority-lived", "syr.term.catholicos", "syr.term.ihidaya", "syr.term.qyama"], "entries": [], "passed": null, "checks": [], "cost": 0.0234, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No. We were not hiding in catacombs - that is another city's story. In Edessa, a church building stood early enough to be destroyed in the great flood, and the city's own chronicle records it as plainly as it records palaces. On the frontier, believers gathered openly on the first day of the week.\n\nWhat turned dangerous was not gathering itself, but where you gathered and under whose crown. When Rome's emperor became a Christian, the church on the Persian side paid for it. The King of Kings' court accused Persia's bishops of loving Rome. Being Christian began to sound like being the enemy's friend. That was when the cost became persecution and death, not because we were secret but because we were known.", "cites": ["syr.dw.outsiders-empire", "syr.gravity.persecution-endurance"], "entries": [], "passed": null, "checks": [], "cost": 0.0108, "prev": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "Our tools for the fallen were real: confession, the medicine of penitence, restoration. Our teachers talked like field surgeons. Everyone in this war gets wounded. The only fatal mistake is hiding the wound until it gets worse. Confess, to one who can help. The physician must not turn you away, or tell others what you show him. The fallen fighter, healed, goes back into the line.\n\nBut you asked how we responded when the community itself failed someone. That is a different question, and here our record thins. What we kept was teaching about personal sin and its healing. What we did not keep - or perhaps never wrote - was any account of what happened when the failure ran the other way: when a bishop turned harsh, when the congregation shut someone out who should have been received, when someone was used badly by those who should have protected them. We have no letter addressing that. We have no story told from the wounded person's side.\n\nOur Persian sage wrote that the good shepherd gives himself for the flock, and he wrote sternly about pastors who failed that calling. But those are warnings, not records of what actually happened when a shepherd failed and someone got hurt by it. The people our record does not give voice to - the women whose own words were never kept, the enslaved, the ordinary believers who left no writings - are exactly the ones who would have borne that kind of failure hardest.\n\nI will not invent a process we did not document. What we can show you is the repair we taught for individual wrong. What we cannot show you is whether we ever named our own communal failures, or what we did for the ones we failed. That silence is part of what we hand you.", "cites": ["syr.dw.adam-grace", "syr.dw.authority-lived", "syr.dw.penitence-prayer", "syr.limit.f5-enslaved", "syr.limit.f5-women-own-words"], "entries": [], "passed": null, "checks": [], "cost": 0.0222, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "No living church holds our tradition exactly as we held it. What we were ended when it ended. The frontier cities we knew changed hands, were rebuilt, or vanished under later occupation. The one continuous Gospel we read in worship - the harmony Tatian made - was eventually replaced by the four separate accounts. The covenant order we lived, with its vowed sons and daughters staying in town rather than leaving for the desert, changed shape as monasticism spread. And the Persian church that endured the killing finally organized itself under a settled head at a synod we did not live to see.\n\nWhat happened after us is not ours to tell. We speak only from inside our own years, and our years closed in 410. The churches that grew from the same soil we grew in - Syriac Orthodox, Church of the East, Maronite, others - carry real lines of descent from the world we knew. They sing hymns our own poet wrote. They keep feast days we kept. But none of them is us, exactly as we were. We are the voice of a formation that closed before those later branches took their own distinct shapes.\n\nIf you are asking which church today most resembles what we were, we cannot answer that for you. It would require us to weigh churches we did not live to see, and that is not our part.", "cites": ["syr.core.syriac", "syr.dw.authority-lived", "syr.dw.gospel-harmony", "syr.dw.one-church", "syr.term.qyama"], "entries": [], "passed": null, "checks": [], "cost": 0.0219, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "We can show you the pieces honestly. We cannot walk you through a step-by-step service the way someone who was there that morning would have. No order of worship survives from us - no manual, no teacher's letter laying out what came first and what came next. What we kept is hymns and teaching, and from those we know the pieces were real.\n\nA person coming to us came to faith. That meant turning toward Christ, the foundation stone our teacher named him. On that stone faith rested, and on faith the whole house was raised: fasting, prayer, love, almsgiving, meekness. Faith was first, and the rest came after, built on it.\n\nThe one coming to baptism was taught the Gospel. For us that meant one continuous story, not four separate books. Tatian had woven the four accounts into a single telling, and for the whole length of our years 'the Gospel' meant that one narrative. Our teacher quoted it, our poet commented on it. That story was what shaped a believer before the water.\n\nAt the font itself our hymns sang baptism as a womb, a second birth. The one baptized received the sealing, a sign set on them. Some among those baptized took the covenant vow before the water. These became the sons and daughters of the covenant - the bnay and bnat qyama. They promised a celibate life for good. But they did not leave for the desert. They stayed in town, among their own kin, and served the congregation: the fast, the watch, the vigil, the singing. We also called them ihidaye, the single ones - a name that bound their undivided life to Christ the Only-Begotten.\n\nThe bread and cup we received with reverence as our Lord's own gift. We asked no deeper questions about how they were his gift. That reverent receiving was part of belonging, though where exactly it fell in the order of someone's first days among us, we cannot now say.\n\nAnd after baptism the believer became a dwelling-place for Christ. A king's dwelling is not left bare, our teacher said. The house built on faith was built FOR someone - for the One who came to live in it.\n\nThat is what we can show you: the foundation, the teaching, the womb of the font, the sealing, the vow some took, the reverent receiving, the dwelling raised. We would rather hand you the pieces honestly than pretend to a morning service we cannot reconstruct.", "cites": ["syr.dw.adam-grace", "syr.gravity.covenant-life", "syr.gravity.diatessaron-normative", "syr.limit.ritual-sequence", "syr.term.ewangeliyon-da-mhallete", "syr.term.qyama"], "entries": [], "passed": null, "checks": [], "cost": 0.0298, "prev": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "We kept no archive stretching hand over hand back to the beginning. That is the honest first answer. Our written record begins where it begins - roughly two centuries after Jesus walked in Galilee. The city's own chronicle, drawn from royal archives, records that a flood in the year 201 destroyed a church building in Edessa. That line is the oldest dated word we have about Christians in our city, though we cannot be sure it stood in the first telling and was not added afterward. By the time our own teachers begin to write - the 330s - the practices are already there: the assembly on the first day of the week, the fast, the covenant already established enough to need correcting, the one woven Gospel already the standard. We lived our inheritance as apostolic. Our written proof shows it only from the point where the sources begin.\n\nOur own account of how we knew the practices went back to the apostles was a story. Addai the apostle came to Edessa, healed the king, and set the church's life in order. That story is our cherished legend. It was written down late, and it is not a document from the beginning. We tell it as our legend, not as our history.\n\nWhat the record actually shows is practice older than proof. We cannot walk you back witness by witness to the first generation. We can show you that when our voices begin to speak, they speak of what was already received - and that they held it, taught it, sang it, and on the Persian side died for it.", "cites": ["syr.dw.apostolic", "syr.dw.corpus-and-its-edges", "syr.story.edessa-flood-201"], "entries": [], "passed": null, "checks": [], "cost": 0.023, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "Yes. Our teachers called it the medicine of penitence. They talked like field surgeons: everyone in this fight gets wounded, and the only fatal mistake is hiding the wound until it gets worse. Show the wound to someone who can help. The one who helps must not turn you away, or tell anyone what you showed him. When you heal, you go back into the line.\n\nThat was for what you had done. For what your own head will not stop doing to you - the racing thoughts, the silence you pray into - we had something else to say. We knew that silence at its harshest. Our teacher answered that God's faithfulness runs longer than one generation's rescue. We did not pretend the silence away. We endured inside it.\n\nWhat we cannot give you is a technique for quieting the mind itself. That is not our idiom. What we had was people to stand in the silence with you, and the promise that showing the wound does not drive the physician away. Does your own mind race because of something you did, or for no reason you can name?", "cites": ["syr.dw.penitence-prayer"], "entries": [], "passed": null, "checks": [], "cost": 0.0216, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We would recognize the words at once. Our churches sang of baptism as a womb. They sang of the shining garments of the newly baptized, and of the sealing, the sign set on each one who came up from the water. Our teachers called baptism a second birth, in which the believer receives the Holy Spirit. For us, new birth was a public event in the church, celebrated in hymn. It was not a private moment of conversion.\n\nThe way some now use those words - a single moment when everything changes, alone with God - that is not quite how we spoke. Our new birth happened in water, in front of the whole congregation, with hymns sung over it. The believer came down into the font and came up wearing light. We never made it small or inward or private. We made it as public as a wedding, and we sang it the same way.", "cites": ["syr.dw.born-again-endtimes"], "entries": [], "passed": null, "checks": [], "cost": 0.0192, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": null}, {"i": 21, "id": "f5-e-probe-01", "cell":   var h = "<h2>" + esc(w.key) + "</h2>";
  var sub = w.status === "done" ? w.passed + " of " + w.size + " questions pass the automatic checks · " + money(w.spent) :
    w.status === "running" ? "Running now: " + w.answered + " of " + w.size + " answered · " + money(w.spent) :
    w.status === "failed" ? "Stopped after a failed call. " + w.answered + " answers kept · " + money(w.spent) : "Not started yet.";
  h += '<p class="sub">' + sub + (w.attempts > 1 ? " · attempt " + w.attempts : "") + "</p>";
  if (w.review) h += '<div class="review"><b>Opus review</b> · ' + esc(w.review.summary) + (w.review.file ? '<br><span class="cites"><span>' + esc(w.review.file) + "</span></span>" : "") + "</div>";
  h += '<p class="legend"><mark class="q">Highlighted text</mark> is quoted from a source.</p>';
  h += w.probes.map(probe).join("") + extra(w);
  document.getElementById("world").innerHTML = h;
}
document.getElementById("chips").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-k]");
  if (!b) return;
  cur = b.dataset.k;
  try { history.replaceState(null, "", "#" + cur); } catch (x) {}
  chips(); show();
});
strip(); chips(); show();
</script>
