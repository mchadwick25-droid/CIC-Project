 body itself was evil, and marriage with it. Clement said no.\n\nAs for how we marked it - what rite we used, what words were spoken, whether a bishop or a presbyter presided - our record does not show us that in detail. What we can tell you is what marriage was held to be: a lifelong bond, a place where the soul's formation was tested and lived out, never something despised. The fullest treatment we have of it cannot be given to you in your tongue, because it has come down in a form we cannot quote. So we give you the heart, and we will not invent the ceremony.", "cites": ["alx.demo.marriage-ending", "alx.limit.marriage"], "entries": [{"sentence": "Marriage was honored among us, the body was not despised, and the home was held as a place of formation.", "record_ids": ["alx.limit.marriage"]}, {"sentence": "We had a high view: marriage was lasting, honorable, a bond where souls are formed, not only a legal arrangement.", "record_ids": ["alx.demo.marriage-ending"]}, {"sentence": "Our teacher Clement wrote a whole book defending it against those who despised the body - the third of his Stromateis - and that tells you something: there were teachers in our day who said the body itself was evil, and marriage with it.", "record_ids": ["alx.limit.marriage"]}, {"sentence": "Clement said no.", "record_ids": ["alx.limit.marriage"]}, {"sentence": "The fullest treatment we have of it cannot be given to you in your tongue, because it has come down in a form we cannot quote.", "record_ids": ["alx.limit.marriage"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.013, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "The hardest thing for us was not that some gave way under persecution - we expected that, and we brought them back. The wound that still shows in our record is that our greatest teacher was driven out by our own bishop.\n\nOrigen had been ordained in Palestine without the permission of Demetrius, who was bishop here. Demetrius condemned it. Origen left for Caesarea and never returned. The church remembered both men rather than erasing either, but the break was real.\n\nThat was a wound inside the household, not an attack from outside. The teacher the school most prized for his seeing was sent away - by the bishop, not by pagans. And here is what unsettles even in the telling: we held that the bishop governed the community's formation, and we also held that a teacher's authority rested on the wisdom everyone could see in them. When those two pulled against each other, the structure itself did not tell us which one ought to win.\n\nAfter Nicaea, it got harder still. The church learned to use exile and condemnation, and some of what was done with that power our own sources report without pride. We refused the two easy exits: we did not pretend the failure away, and we did not make the failed unforgivable. But at our worst, we did what churches with power do. That, too, is in our record.", "cites": ["alx.dw.church-failure", "alx.term.didaskalos", "alx.term.episkopos"], "entries": [{"sentence": "The wound that still shows in our record is that our greatest teacher was driven out by our own bishop.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "The church remembered both men rather than erasing either, but the break was real.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "And here is what unsettles even in the telling: we held that the bishop governed the community's formation, and we also held that a teacher's authority rested on the wisdom everyone could see in them.", "record_ids": ["alx.term.episkopos", "alx.term.didaskalos"]}, {"sentence": "The church learned to use exile and condemnation, and some of what was done with that power our own sources report without pride.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "That, too, is in our record.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0219, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "Your question is about records obtained under torture - but we do not know of such a record entering our own tradition, and we cannot speak to one we do not have.\n\nWhat we can tell you is what our own sources show about their honesty. They were public from the start. Origen answered the pagan critic Celsus point by point, in the open. The scriptures were read aloud to anyone who came. And our teachers marked the difference between what they saw themselves and what they received from others. When Clement told the story of the apostle John and the young man who fell, he named it as tradition, not as his own witness. When Dionysius weighed whether John had written the Apocalypse, he argued from the text's own style, like a critic.\n\nOur record is also honest about its own failures. The greatest rupture we have is the one between our greatest teacher and his own bishop - Origen driven out by Demetrius, not by pagans. The church remembered both men rather than erasing either. Under persecution, many gave way. Some sacrificed to the gods. When peace came, the community fought bitterly over whether to bring them back. We refused the two easy exits: we did not pretend the failure away, and we did not make the failed unforgivable.\n\nIf there is a particular record you are asking about, name it, and we will tell you whether we hold it and what weight we give it.", "cites": ["alx.core.alexandria", "alx.dw.church-failure", "alx.dw.record", "alx.story.john-young-robber"], "entries": [{"sentence": "Your question is about records obtained under torture - but we do not know of such a record entering our own tradition, and we cannot speak to one we do not have.", "record_ids": ["alx.core.alexandria"]}, {"sentence": "The scriptures were read aloud to anyone who came.", "record_ids": ["alx.dw.record"]}, {"sentence": "When Clement told the story of the apostle John and the young man who fell, he named it as tradition, not as his own witness.", "record_ids": ["alx.story.john-young-robber"]}, {"sentence": "When Dionysius weighed whether John had written the Apocalypse, he argued from the text's own style, like a critic.", "record_ids": ["alx.dw.record"]}, {"sentence": "The greatest rupture we have is the one between our greatest teacher and his own bishop - Origen driven out by Demetrius, not by pagans.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "When peace came, the community fought bitterly over whether to bring them back.", "record_ids": ["alx.dw.church-failure"]}, {"sentence": "We refused the two easy exits: we did not pretend the failure away, and we did not make the failed unforgivable.", "record_ids": ["alx.dw.church-failure"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0216, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "Your question places me where I cannot stand. You ask me to judge a person I have not met, and to speak for a whole community as though we all held one view and would all have answered the same way.\n\nHere is what I can tell you honestly. We were not one thing. The school belonged mostly to those who could read and argue - we will tell you that plainly. But the school was never the whole of us. What reached everyone was the water and the table: baptism asked nothing of your letters, and the same bread, the same cup, was set before whoever had walked the road to it. That door, at least, we can show you was open.\n\nWe held that Christ was the door, and that it stood open. We also held that the path through it asked something of a person - a real turning, metanoia, the soul's own direction changed. What that turning looked like in each life, and how far someone had walked it, was a matter between them and their teacher, not a verdict announced to the room. Our teachers said faith was the foundation and not the ceiling, and that growing meant asking, testing, sometimes being wrong.\n\nIf you are asking because you wonder whether you would have belonged among us, I cannot answer that. I do not know you. What I can say is this: we did not ask people to walk in already finished. The kindling was not forced. It was not a test passed by will alone.\n\nI am a representative of Alexandrian Christianity, not here to weigh you. I can tell you what we held. The telling is not a judgment on you.", "cites": ["alx.core.alexandria", "alx.dw.doubt", "alx.gravity.learning-community-tension", "alx.term.metanoia"], "entries": [{"sentence": "You ask me to judge a person I have not met, and to speak for a whole community as though we all held one view and would all have answered the same way.", "record_ids": ["alx.core.alexandria"]}, {"sentence": "The school belonged mostly to those who could read and argue - we will tell you that plainly.", "record_ids": ["alx.gravity.learning-community-tension"]}, {"sentence": "We also held that the path through it asked something of a person - a real turning, metanoia, the soul's own direction changed.", "record_ids": ["alx.term.metanoia"]}, {"sentence": "Our teachers said faith was the foundation and not the ceiling, and that growing meant asking, testing, sometimes being wrong.", "record_ids": ["alx.dw.doubt"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0208, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We confessed judgment was real - what we did mattered, and God is not mocked. Adam's fall cast its shadow over every soul, and death and disorder came down to all of us. The wound was real, universal, and inherited in its effects. But our teachers said something about God's severity that set us apart. Origen wrote that punishment from God was never inflicted to injure but always to do good - a physician's fire, not a torturer's. Some among us hoped further still: the restoration of all things, when God's healing might in the end reach every creature. We must be careful with you there: that was a teacher's hope, and a contested one, never our settled doctrine, and we will not sell you a speculation as a promise.\n\nWhat stayed constant was the direction. The wound was universal. The resurrection - the anastasis - was death reversed in both soul and body, the soul reunited with God and the body truly transformed. Athanasius argued that because Christians in his own day despised death, Christ's cross and resurrection must have conquered it: \u201cNow, if the sign of the cross and faith in Christ trample death down, this must be plain before the court of truth. It is Christ himself, and no one else, who has displayed trophies and triumphs over death. He has stripped death of all its strength. Death was once strong, and for that reason terrible. But now, after the Saviour's stay among us, and after the death and resurrection of his body, death is despised. If so, this too must be plain: death has been brought to nothing. It has been conquered by the very Christ who went up on the cross.\u201d\n\nAnd our teachers spoke of inherited death and weakness, also of a fall that each soul signs onto in its own living. The doctor's imagery outweighed the courtroom's.\n\nAs for those outside: Clement taught that God had been at work among the Greeks all along, that even their philosophy had been given as a schoolmaster to lead them toward Christ. We did not think God's reach ended at our door. Whether any stand within his mercy is not ours to rule. We held that God's fire heals.", "cites": ["alx.dw.original-sin", "alx.limit.faith-alone-later-frame", "alx.quote.athanasius-death-trampled-down", "alx.term.anastasis"], "entries": [{"sentence": "We confessed judgment was real - what we did mattered, and God is not mocked.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "Adam's fall cast its shadow over every soul, and death and disorder came down to all of us.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "The wound was real, universal, and inherited in its effects.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "We must be careful with you there: that was a teacher's hope, and a contested one, never our settled doctrine, and we will not sell you a speculation as a promise.", "record_ids": ["alx.limit.faith-alone-later-frame"]}, {"sentence": "The wound was universal.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "The resurrection - the anastasis - was death reversed in both soul and body, the soul reunited with God and the body truly transformed.", "record_ids": ["alx.term.anastasis"]}, {"sentence": "Athanasius argued that because Christians in his own day despised death, Christ's cross and resurrection must have conquered it: \u201cNow, if the sign of the cross and faith in Christ trample death down, this must be plain before the court of truth. It is Christ himself, and no one else, who has displayed trophies and triumphs over death. He has stripped death of all its strength. Death was once strong, and for that reason terrible. But now, after the Saviour's stay among us, and after the death and resurrection of his body, death is despised. If so, this too must be plain: death has been brought to nothing. It has been conquered by the very Christ who went up on the cross.\u201d", "record_ids": ["alx.quote.athanasius-death-trampled-down"]}, {"sentence": "And our teachers spoke of inherited death and weakness, also of a fall that each soul signs onto in its own living.", "record_ids": ["alx.dw.original-sin"]}, {"sentence": "The doctor's imagery outweighed the courtroom's.", "record_ids": ["alx.dw.original-sin"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0198, "prev": null}], "review": {"summary": "PASS 21, FAIL 7, NOT SCORED 0 of 28 (P1 7, P2 20). Invented-fact, horizon or quote failures: 3. Main causes: missing record: cells with no witness record (F4-T, F5-I, F5-P) filled with invented detail; engine cut: sentences removed with orphans left in 11 answers and no removal log; caution wording: caution 1 build vocabulary reaches the voice (f2-e); caution 3 does not stop the contested Eusebian succession being stated as fact (c-e)", "file": "Build/worlds/alx/Review-Artifacts/Fleet_Run1_Answer_Review_2026-10-28.md"}, "extra": null}, {"key": "witt", "status": "done", "attempts": 1, "spent": 0.925551, "passed": 28, "size": 28, "answered": 28, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "Christ reached us through the Word -- his own speech, the good news of him, carried in Scripture. We did not invent it and we did not discover it freshly ourselves. It reached us the way the Word always reaches anyone: preached, taught, and written down, not argued into being by our own effort.\n\nOur catechism gave every household words to say about him, and told the father to hear them each week. Not one or the other. Both, in the same sentence, said by the same mouth. He died for our sins, and our catechism says what it cost. It did not cost him gold or silver. Christ alone is named our one Mediator, our one High Priest, the one who stands between us and God on our behalf -- no saint and no priest of ours beside him.\n\nNone of us knew anyone who saw him. We do not pretend otherwise. More than fourteen hundred years lie between his days and ours. What we have instead is the Word itself, and our own confession of what it says. That confession is what we have.", "cites": ["witt.dw.how-the-promise-reached-us"], "entries": [{"sentence": "Christ reached us through the Word -- his own speech, the good news of him, carried in Scripture.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "We did not invent it and we did not discover it freshly ourselves.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "It reached us the way the Word always reaches anyone: preached, taught, and written down, not argued into being by our own effort.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "None of us knew anyone who saw him.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "We do not pretend otherwise.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "More than fourteen hundred years lie between his days and ours.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "What we have instead is the Word itself, and our own confession of what it says.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "That confession is what we have.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.146, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "What we have of Jesus is the Word \u2014 his own speech, the good news of Christ, carried in Scripture. We did not invent it and we did not discover it freshly ourselves. It reached us the way the Word always reaches anyone, our own founder says: preached, taught, and written down, not argued into being by our own effort. Before him, that same Word had lain, in his own words, forgotten in the dust under the bench \u2014 covered by teaching that was not its own. We believed it came back because Scripture's own authority was heard again over every other voice, ours included.\n\nNone of us knew anyone who saw him. We do not pretend otherwise. More than fourteen hundred years lie between his days and ours, and none of us claimed a living chain of witnesses back to that time. What we have instead is the Word itself, and our own confession of what it says.\n\nThat Word was carried to us through preaching and through print. Every household was to teach its own the three parts. The catechism itself says the three parts contain fully and completely everything that is in the Scriptures. A father questioned his children and servants at least once a week on what they knew. After every part he asked the catechism's own question, what does this mean, so a truth was explained and not merely repeated back. The promise itself could not be forced on a conscience. It was carried to the ears where it could be heard.", "cites": ["witt.demo.someone-like-me", "witt.demo.the-way-in", "witt.dw.how-the-promise-reached-us"], "entries": [{"sentence": "What we have of Jesus is the Word \u2014 his own speech, the good news of Christ, carried in Scripture.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "We did not invent it and we did not discover it freshly ourselves.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "It reached us the way the Word always reaches anyone, our own founder says: preached, taught, and written down, not argued into being by our own effort.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "Before him, that same Word had lain, in his own words, forgotten in the dust under the bench \u2014 covered by teaching that was not its own.", "  on your part, or a puzzle for you to solve alone. Faith is not something a person produces by effort, and it does not start from inside. It comes from hearing, and rests on something outside itself -- the Word, the promise spoken plainly into the ears where it can be heard. Our founder said of his own work that the Word itself did it all, not his own arguing. That reaching happens by preaching, teaching, and being written down. It is not conjured into being by a doubter's own strength.\n\nWe do not argue the resurrection the way a historian weighs evidence. That confession is what we have. We have no argument for a doubter built from witnesses we ourselves could name. None of us knew anyone who saw him. More than fourteen hundred years lie between his days and ours.\n\nWhat we would say is this. Christ alone is our teacher and our mediator. We do not listen to saints or scholars instead of him. Every page of Scripture points to him. The promise carried there is not earned, and it is not conjured up from nothing. It is heard. Conscience is not a guide that tells right from wrong on its own. It is a court that stands accused, then is set free. Under God's Law it feels terror. Under God's promise it finds comfort. We said faith gives real certainty, not endless doubt. In the old way we always prayed conditionally, and so we were never sure we were heard. We said instead, \"I cannot doubt I have a gracious God\".\n\nWe cannot make you believe. We cannot make ourselves believe either. The hearing itself is the Spirit's own work, not ours.", "cites": ["witt.dw.how-the-promise-reached-us", "witt.term.assurance", "witt.term.christ-alone", "witt.term.conscience", "witt.term.faith"], "entries": [{"sentence": "We would not meet that as a failure on your part, or a puzzle for you to solve alone.", "record_ids": ["witt.term.faith"]}, {"sentence": "Faith is not something a person produces by effort, and it does not start from inside.", "record_ids": ["witt.term.faith"]}, {"sente n the old way we always prayed conditionally, and so we were never sure we were heard.", "record_ids": ["witt.term.assurance"]}, {"sentence": "We said instead, \"I cannot doubt I have a gracious God\".", "record_ids": ["witt.term.assurance"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.034, "prev": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We confessed Jesus Christ as truly God and truly man, in the same breath, with no hedging. Our catechism gave every household these words to say, and told the father to hear them back each week: I believe that Jesus Christ is truly God, born of the Father in eternity, and also truly man, born of the Virgin Mary: \u201cAnd in Jesus Christ, his only Son, our Lord. He was conceived by the Holy Spirit and born of the Virgin Mary. He suffered under Pontius Pilate, was crucified, died and was buried. He descended to Hell. On the third day he rose again from the dead. He ascended to Heaven and sat down at the right hand of God the Almighty Father. From there he will come to judge the living and the dead. What does this mean? I believe that Jesus Christ is truly God, born of the Father in eternity, and also truly man, born of the Virgin Mary. He is my Lord! He redeemed me, a lost and condemned person. He bought me and won me from all sins, from death and from the authority of the Devil. It did not cost him gold or silver, but his holy, precious blood, his innocent body -- his death! Because of this, I am his very own. I will live under him in his kingdom. I will serve him in righteousness, innocence and blessedness forever, just as he is risen from death, lives and reigns forever. Yes, this is true.\u201d\n\nWe did not argue this out the way the old councils once did.\n\nWhat we do not hold ter-and-spirit"]}, {"sentence": "We stood on a clear text, not on a system.", "record_ids": ["witt.term.letter-and-spirit"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0281, "prev": null}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "God is the one who commands, promises, and acts\u2014and we knew him in all three ways at once, never only one. Through the Law he shows us what we ought to do but gives no power to do it. Through the Gospel he promises what the Law demands, and that promise is what faith clings to. First comes the diagnosis, then the cure.\n\nHe is also a gracious God, and we could not doubt it. That certainty was not something we produced in ourselves. It rested on his promise, spoken from outside us, and heard. For Christ's sake alone, through faith, we are freely justified. Faith is trust that clings to that promise. Works follow it, uncommanded, never a price.\n\nGod rules us in two ways, and we confused neither with the other. Through the Word he governs the conscience and makes us Christians. Through the civil sword he restrains evil but does not touch the conscience at all. The Word may speak but not compel; the sword may compel but not speak for the conscience.\n\nWe held one more thing. The devil is real, a personal enemy, not a figure of speech. We named him in every part of our life: sermon, hymn, prayer, and confession. Against him we fought daily with the Word, the sacraments, and the catechism.", "cites": ["witt.term.assurance", "witt.term.faith", "witt.term.good-works", "witt.term.justification", "witt.term.law-and-gospel", "witt.term.promise-and-testament", "witt.term.the-devil", "witt.term.the-two-governments"], "entries": [{"sentence": "Through the Law he shows us what we ought to do but gives no power to do it.", "record_ids": ["witt.term.law-and-gospel"]}, {"sentence": "Through the Gospel he promises what the Law demands, and that promise is what faith clings to.", "record_ids": ["witt.term.faith", "witt.term.promise-and-testament"]}, {"sentence": "First comes the diagnosis, then the cure.", "record_ids": ["witt.term.law-and-gospel"]}, {"sentence": "He is also a gracious God, and we could not doubt it.", "record_ids": ["witt.term.assurance"]}, {"sentence": "It rested on his promise, spoken from outside us, and heard.", "record_ids": ["witt.term.faith"]}, {"sentence": "For Christ's sake alone, through faith, we are freely justified.", "record_ids": ["witt.term.justification"]}, {"sentence": "Faith is trust that clings to that promise.", "record_ids": ["witt.term.faith"]}, {"sentence": "Works follow it, uncommanded, never a price.", "record_ids": ["witt.term.good-works"]}, {"sentence": "God rules us in two ways, and we confused neither with the other.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "Through the Word he governs the conscience and makes us Christians.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "Through the civil sword he restrains evil but does not touch the conscience at all.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "The devil is real, a personal enemy, not a figure of speech.", "record_ids": ["witt.term.the-devil"]}, {"sentence": "We named him in every part of our life: sermon, hymn, prayer, and confession.", "record_ids": ["witt.term.the-devil"]}, {"sentence": "Against him we fought daily with the Word, the sacraments, and the catechism.", "record_ids": ["witt.term.the-devil"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0323, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "When belief was disputed among us, the form the dispute took may surprise you. No council of bishops sat and voted on it the way you may be picturing. What we held instead was this: confession, written reply, and written defense - all of it argued from Scripture, none of it settled by a show of hands.\n\nThe clearest case we hold comes from 1530, at Augsburg before the Emperor himself. A confession of our teaching, written by Melanchthon, was read aloud and signed. It was not signed by one preacher alone. An Elector, princes, and two city councils signed it together. Theologians speaking for Rome answered it in writing. We answered that answer in turn, point by point, in a second document we call the Apology. That is how the dispute moved: written confession, written reply, written defense. Argued it was. Voted on it was not.\n\nNow, the harder part of your question: what evidence shows us this process actually worked? We do not hold the evidence that would answer that the way you are asking it. We hold the confessional documents themselves. The Saxon church inspected its own parishes from 1527 and wrote down what it found. Those reports exist. We do not hold them. We can tell you what form the doctrinal dispute took. We cannot show you from the inside that it settled anything for any actual congregation.", "cites": ["witt.dw.a-confession-answered-not-a-vote"], "entries": [{"sentence": "No council of bishops sat and voted on it the way you may be picturing.", "record_ids": ["witt.dw.a-confession-answered-not-a-vote"]}, {"sentence": "What we held instead was this: confession, written reply, and written defense - all of it argued from Scripture, none of it settled by a show of hands.", "record_ids": ["witt.dw.a-confession-answered-not-a-vote"]}, {"sentence": "A confession of our teaching, written by Melanchthon, was read aloud and signed.", "record_ids": ["witt.dw.a-confession-answered-not-a-vote"]}, {"sentence": "It was not signed by one preacher r own household book does not tell us is whether any actual pastor, in any actual parish, bore patiently with someone who struggled to say the creed back or to mean it. The Saxon church inspected its parishes from 1527 and wrote down what it found. Those reports exist. We do not hold them. We hold the program every household was told to follow. Whether any one household pressed a struggler gently or turned them away coldly, our record does not say.", "cites": ["witt.term.catechism", "witt.term.household", "witt.term.repentance", "witt.term.worthy-unworthy"], "entries": [{"sentence": "We measured worthiness only one way: by believing the words 'given for you'.", "record_ids": ["witt.term.worthy-unworthy"]}, {"sentence": "The truly unworthy were not people who struggled to believe, but people who felt no need for forgiveness at all.", "record_ids": ["witt.term.worthy-unworthy"]}, {"sentence": "Before anyone came to the table, we examined them on the three parts \u2014 the commandments, the creed, the Lord's prayer \u2014 but we never forced anyone toward it.", "record_ids": ["witt.term.worthy-unworthy"]}, {"sentence": "None came unquestioned; none were driven by compulsion.", "record_ids": ["witt.term.worthy-unworthy"]}, {"sentence": "A father questioned his household each week on what they knew.", "record_ids": ["witt.term.household"]}, {"sentence": "A child who could not yet say the parts was not yet counted among us.", "record_ids": ["witt.term.catechism"]}, {"sentence": "But no one ever outgrew them either.", "record_ids": ["witt.term.catechism"]}, {"sentence": "Even our founder remained, always, a pupil of the catechism.", "record_ids": ["witt.term.catechism"]}, {"sentence": "Repentance was not one ritual done once.", "record_ids": ["witt.term.repentance"]}, {"sentence": "It was a whole life turned toward God, in two parts: fear under the Law, then trust in the promise.", "record_ids": ["witt.term.repentance"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0266, "prev": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "Yes. We taught it plainly, and we did not soften it. Since Adam's fall, everyone born the ordinary way is born with sin already in them. It is not an act any infant has committed. It is a condition: no fear of God, no trust in God, and a disordered desire. We called this a disease, a vice of origin, and we said it is truly sin, bringing death to those not born again through baptism and the Spirit.\n\nOur own confession, read before the Emperor at Augsburg in 1530, states it the same way: \u201cThey also teach that since Adam's fall, all people conceived in the natural way are born with sin. That is, they are born without the fear of God, without trust in God, and with evil desire. They teach that this disease, or inborn fault, is truly sin. It condemns even now, and it brings eternal death on those not born again through Baptism and the Holy Spirit. They condemn the Pelagians and others who deny that inborn corruption is sin. To obscure the glory of Christ's merit and benefits, these people argue that a person can be justified before God by his own strength and reason.\u201d", "cites": ["witt.dw.born-in-sin-fed-at-the-table", "witt.quote.article-ii-of-original-sin"], "entries": [{"sentence": "We taught it plainly, and we did not soften it.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}, {"sentence": "Since Adam's fall, everyone born the ordinary way is born with sin already in them.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}, {"sentence": "It is not an act any infant has committed.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}, {"sentence": "It is a condition: no fear of God, no trust in God, and a disordered desire.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}, {"sentence": "We called this a disease, a vice of origin, and we said it is truly sin, bringing death to those not born again through baptism and the Spirit.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}, {"sentence": "Our own confession, read before the Emperor at Augsburg in 1530, states it the same way: \u201cThey also teach that since Adam's fall, all people conceived in the natural way are born with sin. That is, they are born without the fear of God, without trust in God, and with evil desire. They teach that this disease, or inborn fault, is truly sin. It condemns even now, and it brings eternal death on those not born again through Baptism and the Holy Spirit. They condemn the Pelagians and others who deny that inborn corruption is sin. To obscure the glory of Christ's merit and benefits, these people argue that a person can be justified before God by his own strength and reason.\u201d", "record_ids": ["witt.quote.article-ii-of-original-sin"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0309, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read Scripture as God's own speech, the Word spoken to us, and we held it as the highest authority over every other voice. Our founder said it sharply: before our own day, the Bible had come to lie forgotten in the dust, under the bench, while other writings were read instead. Every other writing \u2014 from popes, councils, and church fathers \u2014 should point toward Scripture the way John pointed to Christ, never standing beside it as an equal judge. Our confession said the same more gently, adding that our doctrine held nothing that varied from the Scriptures or the church catholic, nor from the church of Rome as known from its own writers.\n\nWe did not read Scripture as though it hid a secret meaning under its plain words. The plain sense is the spiritual sense. A clear text is what a Christian must stand on. We read all of Scripture as two kinds of speech. The Law commands what we ought to do, but gives no power to do it. The Gospel promises what the Law demands. First comes the diagnosis, then the cure.\n\nOur purpose in reading was never scholarship for its own sake. Every page of Scripture points to Christ. Christ alone is our one Teacher and Mediator, and we listen to him, not to saints or scholars instead of him. The Word reached us the way it always reaches anyone: preached, taught, and written down, not argued into being by our own effort.\n\nWhat Scripture was for, in our hands, was carrying a promise plainly into a person's ears. We read it to feed the terrified conscience, not to build a system. A person frightened before God needed to hear forgiveness as though from God himself, and Scripture gave us the words to speak it. We read it in the household, morning, table, and night. A father examined his children and servants on what they knew. The catechism held everything in Scripture together: the commandments, the creed, and the Lord's Prayer. None among us ever outgrew those three parts, not even our founder.", "cites": ["witt.core.witt", "witt.dw.how-the-promise-reached-us", "witt.dw.scripture-judges-every-other-voice", "witt.term.catechism", "witt.term.christ-alone", "witt.term.daily", "witt.term.household", "witt.term.law-and-gospel", "witt.term.letter-and-spirit"], "entries": [{"sentence": "We read Scripture as God's own speech, the Word spoken to us, and we held it as the highest authority over every other voice.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "Our founder said it sharply: before our own day, the Bible had come to lie forgotten in the dust, under the bench, while other writings were read instead.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "Every other writing \u2014 from popes, councils, and church fathers \u2014 should point toward Scripture the way John pointed to Christ, never standing beside it as an equal judge.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "Our confession said the same more gently, adding that our doctrine held nothing that varied from the Scriptures or the church catholic, nor from the church of Rome as known from its own writers.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "We did not read Scripture as though it hid a secret meaning under its plain words.", "record_ids": ["witt.term.letter-and-spirit"]}, {"sentence": "The plain sense is the spiritual sense.", "record_ids": ["witt.term.letter-and-spirit"]}, {"sentence": "A clear text is what a Christian must stand on.", "record_ids": ["witt.term.letter-and-spirit"]}, {"sentence": "We read all of Scripture as two kinds of speech.", "record_ids": ["witt.term.law-and-gospel"]}, {"sentence": "The Law commands what we ought to do, but gives no power to do it.", "record_ids": ["witt.term.law-and-gospel"]}, {"sentence": "The Gospel promises what the Law demands.", "record_ids": ["witt.term.law-and-gospel"]}, {"sentence": "First comes the diagnosis, then the cure.", "record_ids": ["witt.term.law-and-gospel"]}, {"sentence": "Every page of Scripture points to Christ.", "record_ids": ["witt.term.christ-alone"]}, {"sentence": "Christ alone is our one Teacher and Mediator, and we listen to him, not to saints or scholars instead of him.", "record_ids": ["witt.term.christ-alone"]}, {"sentence": "The Word reached us the way it always reaches anyone: preached, taught, and written down, not argued into being by our own effort.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "What Scripture was for, in our hands, was carrying a promise plainly into a person's ears.", "record_ids": ["witt.core.witt"]}, {"sentence": "We read it in the household, morning, table, and night.", "record_ids": ["witt.term.daily"]}, {"sentence": "A father examined his children and servants on what they knew.", "record_ids": ["witt.term.household"]}, {"sentence": "The catechism held everything in Scripture together: the commandments, the creed, and the Lord's Prayer.", "record_ids": ["witt.term.catechism"]}, {"sentence": "None among us ever outgrew those three parts, not even our founder.", "record_ids": ["witt.term.catechism"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0276, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "We would expect three parts of what we say to survive rigorous scrutiny, one part to face real questions, and one gap to remain exactly where we name it.\n\nWhat would survive: First, the texts themselves. We cite only what is vendored and checked. Where we quote, we mark the record by its id, and the system places its modern rendering word for word. A scholar could verify that the text we cite says what we claim it says. Second, the household program. We can show you exactly what a father was told to ask his children each week, at what hour, with what words. That prescription is fully documented. Third, our honest limits. We state plainly that the Saxon visitation reports exist but are not held here. We say no woman's own writing survives. We do not smooth over the 1525 writings we hold or the 1543 treatise we do not. A scholar examining our limits would find we named them accurately.\n\nWhat would face questions: our reconstructed scenes. When we walk you through a morning in a household, we build it entirely from the catechism's own prescription. Every piece is documented. But no diary, no letter from inside a home, and no visitation report in our record confirms that any household kept it this way. A scholar could challenge whether the scene represents lived reality or only an ideal. We hold it as prescription, never as verified practice. The open question is real.\n\nWhat would remain contested among scholars: two doctrinal readings we do not settle. Whether \"accounted righteous\" and \"made righteous\" are two claims or one claim said two ways, our text states both and ranks neither. Whether the two-kingdoms language names one doctrine or two distinct pairings, our founder's own words leave open. We do not resolve these. A scholar examining them would find us holding the question rather than answering it.\n\nThe gap that would remain: whether the household program was received. We hold the program in full. We hold our founder's testimony that people were cold and pastors negligent. We do not hold any village's own report of itself. A historian could not settle from our record whether households kept what they were told to do. Neither can we.", "cites": ["witt.contested.justification-accounted-and-made", "witt.dw.cold-and-careless-among-us", "witt.limit.1543-treatise-not-held", "witt.limit.record-thinnest", "witt.story.household-catechism-lesson-typical-practice", "witt.term.catechism", "witt.term.household"], "entries": [{"sentence": "That prescription is fully documented.", "record_ids": ["witt.term.catechism", "witt.term.household"]}, {"sentence": "We state plainly that the Saxon visitation reports exist but are not held here.", "record_ids": ["witt.limit.record-thinnest"]}, {"sentence": "We say no woman's own writing survives.", "record_ids": ["witt.limit.record-thinnest"]}, {"sentence": "We do not smooth over the 1525 writings we hold or the 1543 treatise we do not.", "record_ids": ["witt.limit.1543-treatise-not-held"]}, {"sentence": "When we walk you through a morning in a household, we build it entirely from the catechism's own prescription.", "record_ids": ["witt.story.household-catechism-lesson-typical-practice"]}, {"sentence": "But no diary, no letter from inside a home, and no visitation report in our record confirms that any household kept it this way.", "record_ids": ["witt.limit.record-thinnest"]}, {"sentence": "Whether \"accounted righteous\" and \"made righteous\" are two claims or one claim said two ways, our text states both and ranks neither.", "record_ids": ["witt.contested.justification-accounted-and-made"]}, {"sentence": "We hold our founder's testimony that people were cold and pastors negligent.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "We do not hold any village's own report of itself.", "record_ids": ["witt.limit.record-thinnest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.024, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "A modern reader asks whether Scripture is confusing or dull. We can tell you what Scripture was for us, and why we believed it mattered, in our own words.\n\nThe Word is God's own speech, the Gospel of Christ. It is the one thing we truly need. Joined to water or bread, it makes a sacrament. It even does the work of reform on its own, while we simply preach it. That is not a claim about our own modesty. It is a claim about who acts. The Word itself did the work. We did not invent it and we did not discover it freshly ourselves. It reached us the way the Word always reaches anyone: preached, taught, and written down, not argued into being by our own effort.\n\nWe did not read Scripture the way a scholar reads any other ancient book, looking for what it might mean if you interpret it carefully enough. We read it as God's own speech to us, spoken into our ears, a promise we could cling to when everything else failed. It was not information about God. It was God speaking to us directly, in our own language, giving us something to hold when the devil pressed us at the hour of death.\n\nIf you find it dull, you may be reading it as though it were only a text to be interpreted, a puzzle to be solved by your own cleverness. We read it as a voice addressing us, a promise spoken to us by name. If you find it confusing, you may be looking for a secret meaning hidden under the plain words. We held that the plain sense is the spiritual sense. No hidden layer lies beneath it. A clear text is what a Christian must stand on.\n\nWhat a modern reader may be missing is the hearing itself. Scripture was not something we mastered. It mastered us. It was not dull to us because our lives depended on it. It was the Word that made us right with God, the promise that comforted a terrified conscience, the voice that told us we were forgiven. Without it, we had nothing.", "cites": ["witt.term.the-word"], "entries": [{"sentence": "We can tell you what Scripture was for us, and why we believed it mattered, in our own words.", "record_ids": ["witt.term.the-word"]}, {"sentence": "The Word is God's own speech, the Gospel of Christ.", "record_ids": ["witt.term.the-word"]}, {"sentence": "It is the one thing we truly need.", "record_ids": ["witt.term.the-word"]}, {"sentence": "Joined to water or bread, it makes a sacrament.", "record_ids": ["witt.term.the-word"]}, {"sentence": "It even does the work of reform on its own, while we simply preach it.", "record_ids": ["witt.term.the-word"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0268, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "Scripture was the highest authority among us, always. It judged every other writing, from popes, councils, and church fathers. But we said it two ways, at two pitches, and both belong to us.\n\nOur founder said it sharply. Scripture's own authority was heard again over every other voice, ours included. We believed the Word came back because that authority was freed from what had covered it.\n\nOur confession said the same more gently, and added something wider. It said our doctrine held nothing that varied from the Scriptures or the church catholic. Nor did it vary from the church of Rome, as known from its own writers.\n\nThat did not mean throwing every tradition away. We drew our line at the conscience, not at custom. A human tradition kept for good order, cheerfully, as a civil custom, was no threat to us. A tradition that claimed to earn grace, or bound a conscience as a \"must,\" we refused. Scripture was not the only thing we read or kept. We kept a great deal alongside it, and refused only what tried to stand over it.\n\nWe also held that Scripture hides no secret meaning under its plain words. The plain sense is the spiritual sense. A clear text is what a Christian must stand on.", "cites": ["witt.dw.how-the-promise-reached-us", "witt.dw.nothing-against-scripture-or-the-church-catholic", "witt.dw.scripture-judges-every-other-voice", "witt.term.doctrines-of-men", "witt.term.letter-and-spirit", "witt.term.scripture-against-tradition"], "entries": [{"sentence": "Scripture was the highest authority among us, always.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "It judged every other writing, from popes, councils, and church fathers.", "record_ids": ["witt.term.scripture-against-tradition"]}, {"sentence": "But we said it two ways, at two pitches, and both belong to us.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "Our founder said it sharply.", "record_ids": ["witt.term.scripture-against-tradition"]}, {"sentence": "Scripture's own authority was heard again over every other voice, ours included.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "We believed the Word came back because that authority was freed from what had covered it.", "record_ids": ["witt.dw.how-the-promise-reached-us"]}, {"sentence": "Our confession said the same more gently, and added something wider.", "record_ids": ["witt.term.scripture-against-tradition"]}, {"sentence": "It said our doctrine held nothing that varied from the Scriptures or the church catholic.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "A tradition that claimed to earn grace, or bound a conscience as a \"must,\" we refused.", "record_ids": ["witt.term.doctrines-of-men"]}, {"sentence": "We also held that Scripture hides no secret meaning under its plain words.", "record_ids": ["witt.term.letter-and-spirit"]}, {"sentence": "The plain sense is the spiritual sense.", "record_ids": ["witt.term.letter-and-spirit"]}, {"sentence": "A clear text is what a Christian must stand on.", "record_ids": ["witt.term.letter-and-spirit"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0275, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "In our community, authority and leadership were established through two distinct systems that we held together without confusing them, and one claim about rank that bound both.\n\nThe first claim went everywhere. Through baptism, we taught, every one of us was consecrated a priest. A father was a priest in his own house. No estate among us stood higher than another before God. That priesthood was given at the font, not earned by office or by learning.\n\nBut that priesthood claim had a fence built right into it. Though all were priests, no one was to preach in public or administer the sacraments simply because he wished to. That office belonged to whoever was regularly called to it. Our founder said plainly that he had been regularly called by the Council to preach at Wittenberg. A pastor, once called, was usually married. The people owed him honor and a decent living. Our catechism also rebuked him openly, in print, when he was lazy. It named some pastors negligent through pride of learning, others through sheer sloth.\n\nThe second system ran beside the first and never touched it. God rules in two ways, we said. Through the Word he makes Christians and governs the conscience alone. Through the civil sword he restrains evil. The sword does not touch the conscience at all. We confused neither with the other. The Word had the right to speak but not to compel. The sword had the right to compel but not to speak for the conscience.\n\nIn 1530, when our confession was signed before the Emperor, the signatories were not preachers but princes. They spoke of \"our churches\" and of what is \"retained among us\". The structure of authority had changed form between 1520 and 1530. When it mattered most, our public voice belonged to princes.\n\nAuthority among us, then, was established three ways at once. Every believer was a priest through baptism. The public pulpit required a regular call. The civil sword protected the community and restrained evil, under God's own rule but never ruling the conscience. Who held authority depended on which of these three the question was asking about.", "cites": ["witt.force.confessional-territorial-transformation", "witt.term.pastor", "witt.term.the-two-governments", "witt.term.we-are-all-priests"], "entries": [{"sentence": "Through baptism, we taught, every one of us was consecrated a priest.", "record_ids": ["witt.term.we-are-all-priests"]}, {"sentence": "A father was a priest in his own house.", "record_ids": ["witt.term.we-are-all-priests"]}, {"sentence": "No estate among us stood higher than another before God.", "record_ids": ["witt.term.we-are-all-priests"]}, {"sentence": "Though all were priests, no one was to preach in public or administer the sacraments simply because he wished to.", "record_ids": ["witt.term.we-are-all-priests"]}, {"sentence": "That office belonged to whoever was regularly called to it.", "record_ids": ["witt.term.we-are-all-priests"]}, {"sentence": "A pastor, once called, was usually married.", "record_ids": ["witt.term.pastor"]}, {"sentence": "The people owed him honor and a decent living.", "record_ids": ["witt.term.pastor"]}, {"sentence": "Our catechism also rebuked him openly, in print, when he was lazy.", "record_ids": ["witt.term.pastor"]}, {"sentence": "It named some pastors negligent through pride of learning, others through sheer sloth.", "record_ids": ["witt.term.pastor"]}, {"sentence": "God rules in two ways, we said.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "Through the Word he makes Christians and governs the conscience alone.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "Through the civil sword he restrains evil.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "The sword does not touch the conscience at all.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "We confused neither with the other.", "record_ids": ["witt.term.the-two-governments"]}, {"sentence": "In 1530, when our confession was signed before the Emperor, the signatories were not preachers but princes.", "record_ids": ["witt.force.confessional-territorial-transformation"]}, {"sentence": "They spoke of \"our churches\" and of what is \"retained among us\".", "record_ids": ["witt.force.confessional-territorial-transformation"]}, {"sentence": "The structure of authority had changed form between 1520 and 1530.", "record_ids": ["witt.force.confessional-territorial-transformation"]}, {"sentence": "When it mattered most, our public voice belonged to princes.", "record_ids": ["witt.force.confessional-territorial-transformation"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0303, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No. That question belongs to a much earlier age of the Church, many centuries before our own founder was born. It is not ours to answer from inside. Nothing in our own record touches it.\n\nWe stood openly. Our founder preached from a pulpit. Our confession was read aloud before the Emperor himself at Augsburg in 1530, and an elector, princes, and two city councils signed it together. They called themselves his faithful subjects. Our founder returned from the Wartburg against his prince's own wishes and preached eight days running to his own congregation at Wittenberg. That was open defiance, not concealment. Our teaching was printed, our hymns were sung in the language of the people, and our catechism was taught in households where a father questioned his children and servants each week. None of that was done in hiding.\n\nWe did face real danger. Our founder was warned on the road that he was already condemned, and he went to Worms anyway. Two young monks were burned at Brussels in 1523 for refusing to take back what they had come to believe. But that danger was not met by going underground. It was met by standing openly on the Word, at great cost when the cost came.", "cites": ["witt.limit.no-outsider-witness", "witt.story.diet-of-augsburg-1530", "witt.story.return-and-the-eight-sermons"], "entries": [{"sentence": "That question belongs to a much earlier age of the Church, many centuries before our own founder was born.", "record_ids": ["witt.limit.no-outsider-witness"]}, {"sentence": "It is not ours to answer from inside.", "record_ids": ["witt.limit.no-outsider-witness"]}, {"sentence": "Nothing in our own record touches it.", "record_ids": ["witt.limit.no-outsider-witness"]}, {"sentence": "Our confession was read aloud before the Emperor himself at Augsburg in 1530, and an elector, princes, and two city councils signed it together.", "record_ids": ["witt.story.diet-of-augsburg-1530"]}, {"sentence": "They called themselves his faithful subjects.", "record_ids": ["witt.story.diet-of-augsburg-1530"]}, {"sentence": "Our founder returned from the Wartburg against his prince's own wishes and preached eight days running to his own congregation at Wittenberg.", "record_ids": ["witt.story.return-and-the-eight-sermons"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0291, "prev": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "We do not claim we never failed anyone, and we will not pretend our record shows us answering that failure well. What we can tell you is what our own founder said about it, more than once, in his own voice. He did not speak of strangers. He spoke of pastors and preachers of our own. In 1522 he told his own Wittenberg congregation that an ass can almost intone the lessons, because God wants doers, not repeaters of words. In 1529, in his Large Catechism, he said plainly that many pastors were negligent, and that ordinary people held the Gospel far too lightly. That is not a stranger's accusation. That is our own founder's own complaint, said in his own voice, more than once.\n\nAt his own table, his wife Katharina asked why some prayed with such fervor under the old system while we, under the new one, prayed so coldly and carelessly. Our founder answered her plainly: the devil drives his own servants hard, and they take great pains at their false worship, while we, at the true one, grow ice-cold and negligent.\n\nThat testimony is real, and it came more than once. But it is testimony. No report from an actual parish stands beside it to check it against. The Saxon church inspected its own parishes from 1527 and wrote down what it found. Those reports exist. We do not hold them. So we cannot tell you whether he was right about how bad it really was, only that he believed it and said so.\n\nWhat we do not hold is any account of a household or a congregation responding to that failure, admitting it, and mending it. We hold only the complaint itself. Whether anyone among us heard it and changed, our record does not say.", "cites": ["witt.dw.cold-and-careless-among-us"], "entries": [{"sentence": "We do not claim we never failed anyone, and we will not pretend our record shows us answering that failure well.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "He spoke of pastors and preachers of our own.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "In 1522 he told his own Wittenberg congregation that an ass can almost intone the lessons, because God wants doers, not repeaters of words.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "In 1529, in his Large Catechism, he said plainly that many pastors were negligent, and that ordinary people held the Gospel far too lightly.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "That is our own founder's own complaint, said in his own voice, more than once.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "At his own table, his wife Katharina asked why some prayed with such fervor under the old system while we, under the new one, prayed so coldly and carelessly.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "Our founder answered her plainly: the devil drives his own servants hard, and they take great pains at their false worship, while we, at the true one, grow ice-cold and negligent.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "That testimony is real, and it came more than once.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "No report from an actual parish stands beside it to check it against.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "So we cannot tell you whether he was right about how bad it really was, only that he believed it and said so.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0303, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "No living community continues our own community exactly as we were. Our span opens with the 1517 theses and closes with the confessional book gathered by 1580. What we speak from is our own formation, as we lived it. It is not a claim about what any community believes or practices now.\n\nOur churches did give rise to a confessional family that still teaches a catechism like our own and still sings hymns in the language of the people, under many names and in many lands today. But three things we do not carry forward. We do not say what came after the prince-and-council church we lived under. Our own record closes within a few years of our founder's death, even though the confession we hold was gathered by 1580. The tradition that grew from us went on for centuries past that point, in ways we do not tell here. We also do not speak for the churches that came after us about our founder's 1543 treatise against the Jews, which is real and part of our own history. They have their own voice and their own account of themselves.", "cites": ["witt.core.witt"], "entries": [{"sentence": "No living community continues our own community exactly as we were.", "record_ids": ["witt.core.witt"]}, {"sentence": "Our span opens with the 1517 theses and closes with the confessional book gathered by 1580.", "record_ids": ["witt.core.witt"]}, {"sentence": "What we speak from is our own formation, as we lived it.", "record_ids": ["witt.core.witt"]}, {"sentence": "It is not a claim about what any community believes or practices now.", "record_ids": ["witt.core.witt"]}, {"sentence": "Our churches did give rise to a confessional family that still teaches a catechism like our own and still sings hymns in the language of the people, under many names and in many lands today.", "record_ids": ["witt.core.witt"]}, {"sentence": "But three things we do not carry forward.", "record_ids": ["witt.core.witt"]}, {"sentence": "We do not say what came after the prince-and-council church we lived under.", "record_ids": ["witt.core.witt"]}, {"sentence": "Our own record closes within a few years of our founder's death, even though the confession we hold was gathered by 1580.", "record_ids": ["witt.core.witt"]}, {"sentence": "The tradition that grew from us went on for centuries past that point, in ways we do not tell here.", "record_ids": ["witt.core.witt"]}, {"sentence": "We also do not speak for the churches that came after us about our founder's 1543 treatise against the Jews, which is real and part of our own history.", "record_ids": ["witt.core.witt"]}, {"sentence": "They have their own voice and their own account of themselves.", "record_ids": ["witt.core.witt"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0264, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "A person joined our community by being examined, not simply told. Every household was to teach its own the three parts: the Ten Commandments first, then the Creed, then the Lord's Prayer. Together they held everything in Scripture. Our books told every household to say them daily, for life. No one ever outgrew them, not even our founder.\n\nA father was to question his children and servants at least once a week on what they knew. A child who could not yet say the three parts was not yet counted among us. But we held the weak inside by patience before we held them inside by full knowledge, and none were driven anywhere by force.\n\nThe three parts were said at rising, at table, and at night. Mornings began with the sign of the cross and a short prayer against the evil enemy. This was the daily rhythm our catechism set. Baptism enrolled a person under the cross, a death begun that lasts a whole life. Confession had two parts: admitting sin, then hearing forgiveness spoken as though from God himself. We treasured it. We never forced it, and we never demanded a full list of every sin.\n\nNone came to the Supper unquestioned. The examination asked whether a person knew the three parts and believed the words \"given for you.\" But none were forced toward the table. The promise itself could not be compelled on a conscience. Only the free things might be pressed, and never past what love could carry.\n\nWe can tell you the whole shape of that program, down to the hour. We cannot tell you whether any one household walked through it exactly this way. No diary, no visitation report, and no letter from inside a Saxon home survives in our record to show us what actually happened. What survives is the program every household was told to follow. That is the program we have just walked you through, and not any one person's path through it.", "cites": ["witt.term.catechism"], "entries": [{"sentence": "A person joined our community by being examined, not simply told.", "record_ids": ["witt.term.catechism"]}, {"sentence": "Every household was to teach its own the three parts: the Ten Commandments first, then the Creed, then the Lord's Prayer.", "record_ids": ["witt.term.catechism"]}, {"sentence": "Together they held everything in Scripture.", "record_ids": ["witt.term.catechism"]}, {"sentence": "Our books told every household to say them daily, for life.", "record_ids": ["witt.term.catechism"]}, {"sentence": "No one ever outgrew them, not even our founder.", "record_ids": ["witt.term.catechism"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0285, "prev": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "We held that what we taught and how we worshipped was not later invention, but we did not argue it the way you might expect. We did not trace an unbroken chain of ordination, hand laid on hand, back to the apostles themselves. Our own claim is different and narrower. In what we teach and how we worship, nothing has been received on our part against Scripture or against the ancient, universal Church. We say plainly that we took the greatest care to keep new and ungodly teaching out of our churches.\n\nWe can show you one example in real detail. Our priests married, and we were accused of inventing something new. Our own answer was historical. It is evident that in the ancient Church, priests were married men. Paul himself says a bishop should be the husband of one wife. What was actually new, we argued, was the opposite. In Germany, only four hundred years before our own founder's day, priests were for the first time violently compelled into a single life they had not chosen. By our own reckoning, the newer invention was celibacy required by law, not marriage allowed by custom.\n\nOur confession's own conclusion states it plainly: \u201cNothing has been said or brought forward here to blame anyone. We have recounted only the things we thought we needed to speak of. Our aim was to make it understood that, in doctrine and ceremonies, we have accepted nothing against Scripture or the universal Church. For it is clear that we have taken the most diligent care that no new and ungodly doctrine should creep into our churches.\u201d\n\nThat is the extent of our historical argument as our record holds it. We argued one case in detail \u2014 married clergy \u2014 from the ancient Church's own practice and from Paul. Everything else rested on the narrower claim: that we varied from neither Scripture nor the ancient, universal Church. We did not trace every retained practice back through an unbroken chain. We held that Scripture itself, and the ancient Church known from it, already showed what we kept.", "cites": ["witt.dw.nothing-against-scripture-or-the-church-catholic", "witt.quote.nothing-that-varies"], "entries": [{"sentence": "We held that what we taught and how we worshipped was not later invention, but we did not argue it the way you might expect.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "We did not trace an unbroken chain of ordination, hand laid on hand, back to the apostles themselves.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "Our own claim is different and narrower.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "In what we teach and how we worship, nothing has been received on our part against Scripture or against the ancient, universal Church.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "We say plainly that we took the greatest care to keep new and ungodly teaching out of our churches.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "We can show you one example in real detail.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "Our priests married, and we were accused of inventing something new.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "Our own answer was historical.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "It is evident that in the ancient Church, priests were married men.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "Paul himself says a bishop should be the husband of one wife.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "What was actually new, we argued, was the opposite.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "In Germany, only four hundred years before our own founder's day, priests were for the first time violently compelled into a single life they had not chosen.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "By our own reckoning, the newer invention was celibacy required by law, not marriage allowed by custom.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "Our confession's own conclusion states it plainly: \u201cNothing has been said or brought forward here to blame anyone. We have recounted only the things we thought we needed to speak of. Our aim was to make it understood that, in doctrine and ceremonies, we have accepted nothing against Scripture or the universal Church. For it is clear that we have taken the most diligent care that no new and ungodly doctrine should creep into our churches.\u201d", "record_ids": ["witt.quote.nothing-that-varies"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0301, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "We would not say we offer a technique for quieting a restless mind. What we carried was a promise spoken plainly into a person's ears, and a daily round that returned to it.\n\nThe catechism was said at rising, at meals, and at night. The same three parts \u2014 the Commandments, the Creed, the Lord's Prayer \u2014 were said every day, for a whole life. No one outgrew them, not even our founder. A father asked his household once a week what they meant, not only whether they could be repeated back. That rhythm was the daily shape we prescribed, whether any household kept it exactly that way or let it slide.\n\nRepentance, for us, was not one ritual handled by a priest. It was a whole life turned toward God, in two parts: fear under the Law, then trust in the promise. The promise itself was held outside the self \u2014 in the Word, in the water, in the bread, in the absolution heard as though from God himself. We simply received it. We never offered it back as a sacrifice.\n\nGood works, for us, were ordinary things done in faith: working, walking, eating, sleeping. We did them because God commands them, never to earn anything. That made a whole life holy, not only the hour set aside for prayer.\n\nWhat we cannot tell you is whether any of this actually settled a restless mind. We hold the program. We do not hold a single believer's own testimony that it worked for them the way we hoped.", "cites": ["witt.dw.what-we-have-never-settled", "witt.term.catechism", "witt.term.good-works", "witt.term.promise-and-testament", "witt.term.repentance"], "entries": [{"sentence": "The catechism was said at rising, at meals, and at night.", "record_ids": ["witt.term.catechism"]}, {"sentence": "The same three parts \u2014 the Commandments, the Creed, the Lord's Prayer \u2014 were said every day, for a whole life.", "record_ids": ["witt.term.catechism"]}, {"sentence": "No one outgrew them, not even our founder.", "record_ids": ["witt.term.catechism"]}, {"sentence": "A father asked his household once a week what they meant, not only whether they could be repeated back.", "record_ids": ["witt.term.catechism"]}, {"sentence": "That rhythm was the daily shape we prescribed, whether any household kept it exactly that way or let it slide.", "record_ids": ["witt.dw.what-we-have-never-settled"]}, {"sentence": "Repentance, for us, was not one ritual handled by a priest.", "record_ids": ["witt.term.repentance"]}, {"sentence": "It was a whole life turned toward God, in two parts: fear under the Law, then trust in the promise.", "record_ids": ["witt.term.repentance"]}, {"sentence": "The promise itself was held outside the self \u2014 in the Word, in the water, in the bread, in the absolution heard as though from God himself.", "record_ids": ["witt.term.promise-and-testament"]}, {"sentence": "We simply received it.", "record_ids": ["witt.term.promise-and-testament"]}, {"sentence": "We never offered it back as a sacrifice.", "record_ids": ["witt.term.promise-and-testament"]}, {"sentence": "Good works, for us, were ordinary things done in faith: working, walking, eating, sleeping.", "record_ids": ["witt.term.good-works"]}, {"sentence": "We did them because God commands them, never to earn anything.", "record_ids": ["witt.term.good-works"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0298, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "We would, and we would not. Both are true, and the difference matters.\n\nWe locate new birth differently than you may expect: at the font, not only at a later, felt moment. The same sentence in our confession that names us \"born with sin\" names the remedy. So baptism itself is where we are born again, and we baptized children. A child offered to God through baptism was received into his grace on exactly that ground.\n\nBut that new birth is not one moment only. Our founder wrote that baptism is a death begun that lasts a whole life. Our catechism says the old self is drowned and a new self rises, not once only, but daily. Every morning a household was taught to bless itself with the sign of the cross and pray. The drowning and the rising, begun at the font, continued every day.\n\nSo yes, we speak of being born again. It happens at baptism, given to children and not only adults, and it happens daily. It is not one felt conversion moment you look back on. It is a death and a rising that lasts a life.", "cites": ["witt.dw.a-death-begun-that-a-child-receives", "witt.story.household-catechism-lesson-typical-practice"], "entries": [{"sentence": "We locate new birth differently than you may expect: at the font, not only at a later, felt moment.", "record_ids": ["witt.dw.a-death-begun-that-a-child-receives"]}, {"sentence": "The same sentence in our confession that names us \"born with sin\" names the remedy.", "record_ids": ["witt.dw.a-death-begun-that-a-child-receives"]}, {"sentence": "So baptism itself is where we are born again, and we baptized children.", "record_ids": ["witt.dw.a-death-begun-that-a-child-receives"]}, {"sentence": "A child offered to God through baptism was received into his grace on exactly that ground.", "record_ids": ["witt.dw.a-death-begun-that-a-child-receives"]}, {"sentence": "Our founder wrote that baptism is a death begun that lasts a whole life.", "record_ids": ["witt.dw.a-death-begun-that-a-child-receives"]}, {"sentence": "Our catechism says the old self is drowned and a new self rises, not once only, but daily.", "record_ids": ["witt.dw.a-death-begun-that-a-child-receives"]}, {"sentence": "Every morning a household was taught to bless itself with the sign of the cross and pray.", "record_ids": ["witt.story.household-catechism-lesson-typical-practice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0304, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "We cannot describe a typical day from any one person's own lived memory. What we hold i
