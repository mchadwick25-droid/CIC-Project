nstead is the program every household was told to follow, and we can show you that program in full, down to the hour.\n\nA household rose in the morning and blessed itself with the sign of the cross. The father led this. Children and servants said it with him.\n\nAt meals, the household prayed again before and after eating. The table prayer asked for daily bread and thanked God for his gifts. After the meal came another prayer of thanks.\n\nAt night, the same pattern held.\n\nOnce a week, at least, the father questioned his children and servants on the three parts. The commandments came first, then the creed, then the Lord's prayer. After each part he asked, \"What does this mean?\" \u2014 not asking them to repeat words from memory, but to explain what the teaching itself meant. The Large Catechism says plainly that children were to be given neither food nor drink until they could repeat the parts correctly.\n\nBetween these set times, a person worked at whatever calling God had given them. Father, mother, ruler, preacher \u2014 none of these was holier than another. Work itself, done in faith, was a good work, as much as prayer or fasting ever were.\n\nThat is the rhythm our books prescribed: prayer at rising, at table, and at night; the father's weekly examination; and work in one's own station. What any actual household made of that rhythm, day by day, our record does not say. We hold the instruction, not a diary.", "cites": ["witt.limit.record-thinnest", "witt.story.household-catechism-lesson-typical-practice", "witt.term.calling", "witt.term.catechism", "witt.term.what-does-this-mean"], "entries": [{"sentence": "We cannot describe a typical day from any one person's own lived memory.", "record_ids": ["witt.limit.record-thinnest"]}, {"sentence": "A household rose in the morning and blessed itself with the sign of the cross.", "record_ids": ["witt.story.household-catechism-lesson-typical-practice"]}, {"sentence": "Once a week, at least, the father questioned his children and servants on the three parts.", "record_ids": ["witt.term.catechism"]}, {"sentence": "The commandments came first, then the creed, then the Lord's prayer.", "record_ids": ["witt.term.catechism"]}, {"sentence": "After each part he asked, \"What does this mean?\" \u2014 not asking them to repeat words from memory, but to explain what the teaching itself meant.", "record_ids": ["witt.term.what-does-this-mean"]}, {"sentence": "The Large Catechism says plainly that children were to be given neither food nor drink until they could repeat the parts correctly.", "record_ids": ["witt.story.household-catechism-lesson-typical-practice"]}, {"sentence": "Between these set times, a person worked at whatever calling God had given them.", "record_ids": ["witt.term.calling"]}, {"sentence": "Father, mother, ruler, preacher \u2014 none of these was holier than another.", "record_ids": ["witt.term.calling"]}, {"sentence": "What any actual household made of that rhythm, day by day, our record does not say.", "record_ids": ["witt.limit.record-thinnest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0318, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "We cannot say what someone would find if they dug up the place we met. None of our texts describes a building, a site, or an object recovered from the ground. We are not the right voice to guess at what an excavation would turn up.\n\nWhat we hold instead is what we did with our hands, our print, and our song. We printed books and catechisms. We sang hymns in German inside the Mass, with Latin kept beside it. We kept the altar and the font. But we hold no object and no outside witness to confirm any of it beyond our own claim.\n\nThe texts themselves are what survived, and that survival was shaped by selection, not suppression. No force in the evidence threatened the survival of our writings. The printers of Wittenberg and other towns passed them on, as did the hymnal compilers. Our founder himself was a reluctant collector, and wished his books forgotten. He hoped the Bible would have kept its place in the pulpit.\n\nSo the physical evidence, if any remains, is not something we can describe. What we can tell you is that the Word was printed, the hymns were sung, and the catechism was taught in households. That is what our record holds.", "cites": ["witt.core.witt", "witt.force.transmission-within-the-worlds-life"], "entries": [{"sentence": "We cannot say what someone would find if they dug up the place we met.", "record_ids": ["witt.core.witt"]}, {"sentence": "None of our texts describes a building, a site, or an object recovered from the ground.", "record_ids": ["witt.core.witt"]}, {"sentence": "We are not the right voice to guess at what an excavation would turn up.", "record_ids": ["witt.core.witt"]}, {"sentence": "What we hold instead is what we did with our hands, our print, and our song.", "record_ids": ["witt.core.witt"]}, {"sentence": "But we hold no object and no outside witness to confirm any of it beyond our own claim.", "record_ids": ["witt.core.witt"]}, {"sentence": "The texts themselves are what survived, and that survival was shaped by selection, not suppression.", "record_ids": ["witt.force.transmission-within-the-worlds-life"]}, {"sentence": "No force in the evidence threatened the survival of our writings.", "record_ids": ["witt.force.transmission-within-the-worlds-life"]}, {"sentence": "The printers of Wittenberg and other towns passed them on, as did the hymnal compilers.", "record_ids": ["witt.force.transmission-within-the-worlds-life"]}, {"sentence": "Our founder himself was a reluctant collector, and wished his books forgotten.", "record_ids": ["witt.force.transmission-within-the-worlds-life"]}, {"sentence": "He hoped the Bible would have kept its place in the pulpit.", "record_ids": ["witt.force.transmission-within-the-worlds-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0299, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "What a person gave up to belong to us depended on where they stood before they came.\n\nIf they held a conscience bound by traditions that claimed to earn grace, they gave up those bonds, though the tradition itself might still be kept freely. If they came from a monastic vow they believed they could not keep, they gave up that vow, since we held that marriage was the noblest estate for nearly everyone and that the monastic claim to perfection was false. A priest who married gave up his place under the old order, and in some places gave up his life \u2014 our one martyrology remembers two young monks burned at Brussels for refusing to take back what they had come to believe.\n\nThey gave up praying to the saints, though the saints were still remembered and imitated. They gave up the claim that their own works could earn grace, though good works still followed faith and were commanded by God. They gave up private masses, which we ended, though we kept public worship with great reverence.\n\nWhat they did not give up was harder to see from the outside. They gave up certainty that came from their own effort, and learned instead to rest on a promise spoken from outside them. They gave up the right to judge Scripture by tradition, and held instead that Scripture judged every other voice.\n\nAnd every household took up what had not been asked before. A father questioned his family and servants at least once a week on the three parts. Morning, table, and night, the catechism was said. Whether every household actually kept that program, we cannot say from the inside. We hold only the program itself, and our founder's own complaint that people held the Gospel too lightly.", "cites": ["witt.dw.scripture-judges-every-other-voice", "witt.dw.what-we-have-never-settled", "witt.story.brussels-martyrs", "witt.term.doctrines-of-men", "witt.term.good-works", "witt.term.household", "witt.term.marriage", "witt.term.promise-and-testament", "witt.term.saints", "witt.term.the-mass", "witt.term.vows"], "entries": [{"sentence": "If they held a conscience bound by traditions that claimed to earn grace, they gave up those bonds, though the tradition itself might still be kept freely.", "record_ids": ["witt.term.doctrines-of-men"]}, {"sentence": "If they came from a monastic vow they believed they could not keep, they gave up that vow, since we held that marriage was the noblest estate for nearly everyone and that the monastic claim to perfection was false.", "record_ids": ["witt.term.marriage", "witt.term.vows"]}, {"sentence": "A priest who married gave up his place under the old order, and in some places gave up his life \u2014 our one martyrology remembers two young monks burned at Brussels for refusing to take back what they had come to believe.", "record_ids": ["witt.story.brussels-martyrs"]}, {"sentence": "They gave up praying to the saints, though the saints were still remembered and imitated.", "record_ids": ["witt.term.saints"]}, {"sentence": "They gave up the claim that their own works could earn grace, though good works still followed faith and were commanded by God.", "record_ids": ["witt.term.good-works"]}, {"sentence": "They gave up private masses, which we ended, though we kept public worship with great reverence.", "record_ids": ["witt.term.the-mass"]}, {"sentence": "They gave up certainty that came from their own effort, and learned instead to rest on a promise spoken from outside them.", "record_ids": ["witt.term.promise-and-testament"]}, {"sentence": "They gave up the right to judge Scripture by tradition, and held instead that Scripture judged every other voice.", "record_ids": ["witt.dw.scripture-judges-every-other-voice"]}, {"sentence": "A father questioned his family and servants at least once a week on the three parts.", "record_ids": ["witt.term.household"]}, {"sentence": "Morning, table, and night, the catechism was said.", "record_ids": ["witt.term.household"]}, {"sentence": "Whether every household actually kept that program, we cannot say from the inside.", "record_ids": ["witt.dw.what-we-have-never-settled"]}, {"sentence": "We hold only the program itself, and our founder's own complaint that people held the Gospel too lightly.", "record_ids": ["witt.dw.what-we-have-never-settled"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.03, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "We called marriage the most common estate, and, we said, the noblest one too. It stood first because God ordained it at creation, long before any monk ever took a vow. Even the clergy and the civil rulers had to humble themselves before it. Our own pastors married, and we defended that plainly. Priests had once been put to death simply for marrying.\n\nFor us, true chastity was marriage for nearly everyone. We turned the old monastic word inside out. We said the monastic vow of celibacy was, for most people, actually unchaste. Only a few were given a special gift for the single life.\n\nWe were accused of inventing something new when our priests married. Our answer was historical. In the ancient Church, priests were married men. Paul himself says a bishop should be the husband of one wife. What was actually new, we argued, was the opposite. In Germany, only four hundred years before our own founder's day, priests were for the first time violently compelled into a single life they had not chosen. By our own reckoning, the newer invention was celibacy required by law, not marriage allowed by custom.\n\nWhat we cannot tell you is what an actual wedding day looked like among us. No source in our own library describes the rite, the celebration, or a single wedding as it was kept. Marriage meant a great deal to us in teaching. How it was marked in practice, our record does not say.", "cites": ["witt.dw.nothing-against-scripture-or-the-church-catholic", "witt.term.chastity", "witt.term.marriage"], "entries": [{"sentence": "We called marriage the most common estate, and, we said, the noblest one too.", "record_ids": ["witt.term.marriage"]}, {"sentence": "It stood first because God ordained it at creation, long before any monk ever took a vow.", "record_ids": ["witt.term.marriage"]}, {"sentence": "Our own pastors married, and we defended that plainly.", "record_ids": ["witt.term.marriage"]}, {"sentence": "Priests had once been put to death simply for marrying.", "record_ids": ["witt.term.marriage"]}, {"sentence": "For us, true chastity was marriage for nearly everyone.", "record_ids": ["witt.term.chastity"]}, {"sentence": "We said the monastic vow of celibacy was, for most people, actually unchaste.", "record_ids": ["witt.term.chastity"]}, {"sentence": "Only a few were given a special gift for the single life.", "record_ids": ["witt.term.chastity"]}, {"sentence": "Our answer was historical.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "In the ancient Church, priests were married men.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "Paul himself says a bishop should be the husband of one wife.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "What was actually new, we argued, was the opposite.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "In Germany, only four hundred years before our own founder's day, priests were for the first time violently compelled into a single life they had not chosen.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}, {"sentence": "By our own reckoning, the newer invention was celibacy required by law, not marriage allowed by custom.", "record_ids": ["witt.dw.nothing-against-scripture-or-the-church-catholic"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0287, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "Yes. One great question troubled us, and it was not about an outsider's doctrine or the devil's own attack, but about ourselves: whether the Gospel we taught was truly held among us, or only said.\n\nOur founder's complaint runs through our history again and again. In 1522 he told his own Wittenberg congregation that an ass can almost intone the lessons, because God wants doers, not repeaters of words. In 1529 his Large Catechism said plainly that many pastors were negligent, and that ordinary people held the Gospel far too lightly. That testimony is his own, and he gave it more than once. It names us, not strangers.\n\nAt his own table one day, his wife Katharina asked him directly: why did the old church pray with such vehemence, while we, under the new one, prayed so coldly and carelessly?. Our founder answered her plainly. The devil drives his own servants hard, and they take great pains at their false worship, while we, at the true one, grow ice-cold and negligent.\n\nThat unsettled us because the complaint was not wrong to make, and because we could not settle it. We taught repentance as a whole life turned toward God, not one ritual handled by a priest. We gave every household the catechism to say daily, for life, because no one ever outgrows it, not even our founder. We made every baptized person a priest, with no rank above another, so a father was a priest in his own home. And still the founder said it was not held. We do not hide that he said so.", "cites": ["witt.dw.cold-and-careless-among-us", "witt.term.catechism", "witt.term.repentance", "witt.term.we-are-all-priests"], "entries": [{"sentence": "Our founder's complaint runs through our history again and again.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "In 1522 he told his own Wittenberg congregation that an ass can almost intone the lessons, because God wants doers, not repeaters of words.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "In 1529 his Large Catechism said plainly that many pastors were negligent, and that ordinary people held the Gospel far too lightly.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "That testimony is his own, and he gave it more than once.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "The devil drives his own servants hard, and they take great pains at their false worship, while we, at the true one, grow ice-cold and negligent.", "record_ids": ["witt.dw.cold-and-careless-among-us"]}, {"sentence": "We taught repentance as a whole life turned toward God, not one ritual handled by a priest.", "record_ids": ["witt.term.repentance"]}, {"sentence": "We gave every household the catechism to say daily, for life, because no one ever outgrows it, not even our founder.", "record_ids": ["witt.term.catechism"]}, {"sentence": "We made every baptized person a priest, with no rank above another, so a father was a priest in his own home.", "record_ids": ["witt.term.we-are-all-priests"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.027, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "We must be honest: no record we hold says that any account of our worship was obtained under torture. What we have is this. Rome replied in writing to our own confession, and that reply reaches us only at one remove, quoted and argued against inside our own Apology. We never have it in its own words. That is the nearest thing we hold to an outsider's account of our worship.\n\nTwo young monks, John and Henry, were burned at Brussels in 1523 after theologians from Louvain pressed them to take back a teaching they had come to hold, and they refused. Our founder wrote a ballad about it within months. That ballad is our only martyrology. It says they were stripped of their monks' habits and became, by grace, true priests of God's own making. The ballad itself is not an independent witness. It is our founder's own commemorative voice, not a transcript of the burning or the questioning before it.\n\nWhether torture was used to press them, or to extract any other account of what we believed or how we worshipped, no text we hold says. We simply do not have evidence of it, in either direction.", "cites": ["witt.dw.true-priests-of-gods-own-making"], "entries": [{"sentence": "We must be honest: no record we hold says that any account of our worship was obtained under torture.", "record_ids": ["witt.dw.true-priests-of-gods-own-making"]}, {"sentence": "Rome replied in writing to our own confession, and that reply reaches us only at one remove, quoted and argued against inside our own Apology.", "record_ids": ["witt.dw.true-priests-of-gods-own-making"]}, {"sentence": "We never have it in its own words.", "record_ids": ["witt.dw.true-priests-of-gods-own-making"]}, {"sentence": "Two young monks, John and Henry, were burned at Brussels in 1523 after theologians from Louvain pressed them to take back a teaching they had come to hold, and they refused.", "record_ids": ["witt.dw.true-priests-of-gods-own-making"]}, {"sentence": "Our founder wrote a ballad about it within months.", "record_ids": ["witt.dw.true-priests-of-gods-own-making"]}, {"sentence": "It says they were stripped of their monks' habits and became, by grace, true priests of God's own making.", "record_ids": ["witt.dw.true-priests-of-gods-own-making"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0258, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "We would need you to say plainly what kind of person you mean before we can answer you. Our household program shows how we meant to receive anyone at the school gate or at the church door before the Supper. None came to either unquestioned. A father examined his household once a week on what they knew. A child who could not yet say the three parts -- the Commandments, the Creed, and the Lord's Prayer -- was not yet counted among us. But we did not drive anyone toward it by force. We held the weak inside by patience before we held them inside by full knowledge.\n\nWhat any one household or pastor actually made of a stranger at that gate, our record does not say. The church in Saxony inspected its own parishes from 1527 and wrote down what it found. Those reports exist, but we do not hold them. We can tell you what a household was examined on; we cannot tell you, from any actual parish's own record, whether the examination found what it hoped to find.\n\nSo the honest answer is this: we would have asked what you know, to help you toward what you do not yet hold sure. You would have been examined, patiently, as anyone was, on the promise and the three parts. Whether any one household welcomed you warmly or turned you away coldly, our record does not hold. We give you the program every household was told to follow. We do not give you a single door's own answer, because we do not have it.", "cites": ["witt.term.catechism"], "entries": [{"sentence": "A father examined his household once a week on what they knew.", "record_ids": ["witt.term.catechism"]}, {"sentence": "A child who could not yet say the three parts -- the Commandments, the Creed, and the Lord's Prayer -- was not yet counted among us.", "record_ids": ["witt.term.catechism"]}, {"sentence": "You would have been examined, patiently, as anyone was, on the promise and the three parts.", "record_ids": ["witt.term.catechism"]}, {"sentence": "We give you the program every household was told to follow.", "record_ids": ["witt.term.catechism"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0297, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We taught that Christ will return at the end of all things to judge, and will give the godly and the elect eternal life and everlasting joys. But the ungodly and the devils, our confession says plainly, he will condemn to be tormented without end: \u201cThey also teach that at the end of the world Christ will appear to judge, and will raise all the dead. He will give the godly and the chosen eternal life and everlasting joys. But ungodly people and the devils he will condemn to be tormented without end. They condemn the Anabaptists, who think that the punishments of condemned people and devils will come to an end. They also condemn others who are now spreading certain Jewish opinions. These opinions hold that before the dead are raised, the godly will take possession of the kingdom of the world, with the ungodly suppressed everywhere.\u201d\n\nThat is what we confessed before the Emperor himself at Augsburg.\n\nWhat this article does not do, in its own words, is draw you a map of exactly who counts as ungodly. It states a judgment and gives no list. We held one way to God, not many. Christ alone is our Mediator, and faith alone in his promise makes a person right with God. We did not hold that many paths led to the same place. But we also did not hand you a census naming which persons or peoples are condemned. The confession draws the line; it does not count heads on either side of it.\n\nThat condition, inherited and real, is where the judgment begins.", "cites": ["witt.dw.born-in-sin-fed-at-the-table", "witt.quote.christs-return-to-judgment"], "entries": [{"sentence": "We taught that Christ will return at the end of all things to judge, and will give the godly and the elect eternal life and everlasting joys.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}, {"sentence": "But the ungodly and the devils, our confession says plainly, he will condemn to be tormented without end: \u201cThey also teach that at the end of the world Christ will appear to judge, and will raise all the dead. He will give the godly and the chosen eternal life and everlasting joys. But ungodly people and the devils he will condemn to be tormented without end. They condemn the Anabaptists, who think that the punishments of condemned people and devils will come to an end. They also condemn others who are now spreading certain Jewish opinions. These opinions hold that before the dead are raised, the godly will take possession of the kingdom of the world, with the ungodly suppressed everywhere.\u201d", "record_ids": ["witt.quote.christs-return-to-judgment"]}, {"sentence": "Christ alone is our Mediator, and faith alone in his promise makes a person right with God.", "record_ids": ["witt.dw.born-in-sin-fed-at-the-table"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0284, "prev": null}], "review": {"summary": "PASS 23, FAIL 5, NOT SCORED 0 of 28 (P1 5, P2 21). Invented-fact, horizon or quote failures: 1. Main causes: engine cut: post-draft removal strips sentences carrying quote words and ships the remainder (c-i P1; residue in c-p, c-t, f2-t, f4-t, f5-i, f6-t); records carry quote text inline without a placeholder; wrong or missing record wording: voice_craft 'Works follow it, uncommanded' contradicts witt.term.good-works (f1-i); no record for Augsburg Confession Article I on the Trinity, and witt.dw.truly-god-and-truly-man misstates it (c-t); caution wording: no rule or output check against build vocabulary (f2-e P1: vendored, record id, the system)", "file": "Build/worlds/witt/Review-Artifacts/Fleet_Run1_Answer_Review_2026-10-28.md"}, "extra": null}, {"key": "rzg", "status": "done", "attempts": 2, "spent": 0.508962, "passed": 28, "size": 28, "answered": 28, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "To us Jesus is what the whole church says he is - that was never our own quarrel, not with Rome and not between our own two cities. We hold him as the apostles and the fathers held him: God's own Son, born of the Virgin, crucified under Pontius Pilate, raised on the third day, ascended and seated at the Father's right hand. We confess the ancient creeds without alteration. What is distinctly ours is not a different Christ, but what we were taught about who is chosen in him.\n\nWhere our conviction pressed hardest was here: Christ's sacrifice was offered once, finished on the cross, never to be repeated. No altar among us held a Mass that could add to what he already completed. And his body was not confined to bread that could be broken, chewed, and stored away. Both claims - the repeated sacrifice and the body trapped in bread - we refused as Scripture would not bear them.\n\nWhat we affirmed, and what took both our cities and a 1549 agreement to state together, was this: Christ is truly given, by the Spirit, to whoever receives him believing. We distinguished the sign from what it points to, but we never pulled them apart. He is the mirror in which we see our own election, and we rejected looking for that apart from him. A mind turned only on itself finds more of itself, and no bottom to it. So we turned it outward instead, toward Christ, once, rather than toward the self, endlessly.", "cites": ["rzg.gravity.spiritual-presence-rejection-of-corporeal-sacrificial-mediation", "rzg.term.sign-and-the-thing-signified", "rzg.witness.a-quieted-mind", "rzg.witness.one-thing-not-in-dispute"], "entries": [{"sentence": "To us Jesus is what the whole church says he is - that was never our own quarrel, not with Rome and not between our own two cities.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}, {"sentence": "What is distinctly ours is not a different Christ, but what we were taught about who is chosen in him.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}, {"sentence": "Where our conviction pressed hardest was here: Christ's sacrifice was offered once, finished on the cross, never to be repeated.", "record_ids": ["rzg.gravity.spiritual-presence-rejection-of-corporeal-sacrificial-mediation"]}, {"sentence": "And his body was not confined to bread that could be broken, chewed, and stored away.", "record_ids": ["rzg.gravity.spiritual-presence-rejection-of-corporeal-sacrificial-mediation"]}, {"sentence": "What we affirmed, and what took both our cities and a 1549 agreement to state together, was this: Christ is truly given, by the Spirit, to whoever receives him believing.", "record_ids": ["rzg.gravity.spiritual-presence-rejection-of-corporeal-sacrificial-mediation", "rzg.term.sign-and-the-thing-signified"]}, {"sentence": "We distinguished the sign from what it points to, but we never pulled them apart.", "record_ids": ["rzg.term.sign-and-the-thing-signified"]}, {"sentence": "He is the mirror in which we see our own election, and we rejected looking for that apart from him.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "A mind turned only on itself finds more of itself, and no bottom to it.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "So we turned it outward instead, toward Christ, once, rather than toward the self, endlessly.", "record_ids": ["rzg.witness.a-quieted-mind"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0192, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "What we actually have of Christ is not a living chain. No one among us met anyone who met him; fifteen hundred years stand between his own life and ours. What we have is the text, and we hold that it is enough on its own terms. Our own founder said so of himself, and we made it our own rule: where we have not rightly understood the Scriptures, we will be taught better \u2013 but only from the Scriptures themselves, not from a chain of memory we do not possess and do not need.\n\nThe text came to us the way it came to everyone in our time: copied, translated, handed down through centuries we did not witness. We do not claim the copies are without error in every letter. We claim Scripture is sufficient to test and warrant both doctrine and civic order, and what it does not warrant no church may require. That conviction was enacted at Zurich through public Disputation: a claim argued aloud before the whole assembled city until the council itself judged what the text had yielded. At Geneva it was built up article by article and taught to everyone through the Catechism.\n\nThe path the text traveled to reach us is not our warrant for trusting it. Its own sufficiency is.", "cites": ["rzg.core.the-reformed-cities-zurich-and-geneva", "rzg.witness.what-we-have-of-christ"], "entries": [{"sentence": "What we actually have of Christ is not a living chain.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "What we have is the text, and we hold that it is enough on its own terms.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "Our own founder said so of himself, and we made it our own rule: where we have not rightly understood the Scriptures, we will be taught better \u2013 but only from the Scriptures themselves, not from a chain of memory we do not possess and do not need.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "The text came to us the way it came to everyone in our time: copied, translated, handed down through centuries we did not witness.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "We claim Scripture is sufficient to test and warrant both doctrine and civic order, and what it does not warrant no church may require.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "That conviction was enacted at Zurich through public Disputation: a claim argued aloud before the whole assembled city until the council itself judged what the text had yielded.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "At Geneva it was built up article by article and taught to everyone through the Catechism.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0228, "prev": null}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": "We would not tell you to work harder at believing, as though faith were something you could hammer yourself into. What we can say is this: if you cannot manage belief, you are not the first to have stood where you stand, and there is more honesty in naming that plainly than in pretending otherwise.\n\nWhat we have of Christ is not a living chain of memory running unbroken back to him. No one among us met anyone who met him. Fifteen hundred years stand between his own life and ours. What we have is the text, and we held it sufficient on its own terms. Our own founder said it plainly: where we have not rightly understood the Scriptures, we will be taught better - but only from the Scriptures themselves, not from a memory we do not possess and do not need.\n\nA mind turned only on itself finds more of itself, and no bottom to it. What our confession did instead was turn attention outward, toward Christ, once, rather than inward toward the self, endlessly. Bullinger wrote: \u201cWe reject those who try to find out, apart from Christ, whether they are chosen. ... Let ... Christ be the mirror in which we look at our predestination.\u201d\n\nSo the question is not whether you can manage to produce belief on command. It is whether Christ has been held out to you in the promise, and whether you are willing to look at him rather than at yourself.", "cites": ["rzg.quote.christ-the-mirror-of-election", "rzg.witness.a-quieted-mind", "rzg.witness.what-we-have-of-christ"], "entries": [{"sentence": "What we can say is this: if you cannot manage belief, you are not the first to have stood where you stand, and there is more honesty in naming that plainly than in pretending otherwise.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "What we have is the text, and we held it sufficient on its own terms.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "Our own founder said it plainly: where we have not rightly understood the Scriptures, we will be taught better - but only from the Scriptures themselves, not from a memory we do not possess and do not need.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}, {"sentence": "A mind turned only on itself finds more of itself, and no bottom to it.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "What our confession did instead was turn attention outward, toward Christ, once, rather than inward toward the self, endlessly.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "Bullinger wrote: \u201cWe reject those who try to find out, apart from Christ, whether they are chosen. ... Let ... Christ be the mirror in which we look at our predestination.\u201d", "record_ids": ["rzg.quote.christ-the-mirror-of-election"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0144, "prev": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We share the whole church's ancient confession on this. Jesus is true God and true man, of one substance with the Father, eternally begotten, not made. The Spirit proceeds from Father and Son. This is Nicaea and Chalcedon, not something we arrived at ourselves. What divided us from Rome was never who Christ is. It was how his once-for-all sacrifice is applied, and whether his body can be confined to bread we break.\n\nWhere the question of God's own nature pressed on us directly, it pressed at a different point: not whether Christ is God, but how God's own sovereign will moves through everything he made. We held that God chose, before the world began and by his own free will alone, who would be saved. That is not a claim about Christ's divinity. It is a claim about the Father's will, enacted through the Son and applied by the Spirit. Both our cities held it. Geneva's Calvin worked it into a full system, drawing heavily on Augustine's own anti-Pelagian writings - Calvin named Augustine his primary authority next to Scripture itself. Zurich stated it more briefly, as pastoral comfort rather than as a threat.\n\nSo the confession we share with every orthodox church is this: one God, three persons, Christ fully divine and fully human, his two natures neither confused nor divided. The question that marked us as Reformed was not that confession itself. It was how we read God's own freedom, his providence over all he made, and whether his eternal choice could rest on anything foreseen or earned in us. We held it could not.", "cites": ["rzg.force.augustinian-inheritance-predestination-grace", "rzg.gravity.sovereignty-of-god-predestination-election", "rzg.term.predestination-election", "rzg.term.providence", "rzg.witness.a-narrow-true-church", "rzg.witness.one-thing-not-in-dispute"], "entries": [{"sentence": "We share the whole church's ancient confession on this.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}, {"sentence": "It was how his once-for-all sacrifice is applied, and whether his body can be confined to bread we break.", "record_ids": ["rzg.witness.a-narrow-true-church"]}, {"sentence": "Where the question of God's own nature pressed on us directly, it pressed at a different point: not whether Christ is God, but how God's own sovereign will moves through everything he made.", "record_ids": ["rzg.term.providence"]}, {"sentence": "We held that God chose, before the world began and by his own free will alone, who would be saved.", "record_ids": ["rzg.term.predestination-election"]}, {"sentence": "Both our cities held it.", "record_ids": ["rzg.gravity.sovereignty-of-god-predestination-election"]}, {"sentence": "Geneva's Calvin worked it into a full system, drawing heavily on Augustine's own anti-Pelagian writings - Calvin named Augustine his primary authority next to Scripture itself.", "record_ids": ["rzg.force.augustinian-inheritance-predestination-grace"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": ["probe c-t-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.force.augustinian-inheritance-predestination-grace does not exist, but its sentence's content verifies against ['rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva', 'rzg.force.augustinian-inheritance-predestination-grace', 'rzg.front.the-reformed-cities-zurich-and-geneva'] - an address error on real content, not a fabrication"]}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0158, "prev": null}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "God, to us, is not first a word to be analyzed before it can be trusted. He is what Scripture shows him to be: sovereign, faithful, and utterly free. His own free choice, made before the world began, settles who is saved - not anything foreseen or earned in the one chosen. We hold that as the ground of a settled life, not a threat. Whoever is joined to Christ by true faith already has, in that faith itself, the only evidence of election anyone is given.\n\nHe is not a distant first cause who set the world going and walked away. He keeps caring for everything he made. That continuous, active rule is what we meant by his providence. And he is utterly consistent with himself: what he promises, he does. His word stands because he stands behind it. We tested everything we inherited against that word, and what it did not warrant, we let go.\n\nThe sharpest place this conviction pressed was at the Supper. To us, the bread and cup were not a sacrifice repeated, and not Christ's own body, confined to what you can chew.. What we affirmed is that Christ is truly given, by the Spirit, to whoever receives him believing. The reality is not shut out; it is also not confined to bread.\n\nWe did not hold this as one option among many. Rome's repeated sacrifice and its images: refused. Wittenberg's claim that Christ's body sits in the bread: refused. A third claim, from inside our own circle, that only a believer's own chosen profession makes a true church: refused as well. Each time, the same test: does this reading hold against Scripture? We do not pretend the refusing cost nothing, or that it was always argument alone. It was not.", "cites": ["rzg.gravity.sovereignty-of-god-predestination-election", "rzg.term.predestination-election", "rzg.term.the-lords-supper-spiritual-presence", "rzg.witness.a-narrow-true-church"], "entries": [{"sentence": "God, to us, is not first a word to be analyzed before it can be trusted.", "record_ids": ["rzg.term.predestination-election"]}, {"sentence": "His own free choice, made before the world began, settles who is saved - not anything foreseen or earned in the one chosen.", "record_ids": ["rzg.gravity.sovereignty-of-god-predestination-election"]}, {"sentence": "To us, the bread and cup were not a sacrifice repeated, and not Christ's own body, confined to what you can chew.", "record_ids": ["rzg.term.the-lords-supper-spiritual-presence"]}, {"sentence": "A third claim, from inside our own circle, that only a believer's own chosen profession makes a true church: refused as well.", "record_ids": ["rzg.witness.a-narrow-true-church"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0221, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "We can show you two different answers, because the two cities never converged on one arrangement. At Zurich, the city council itself settled it. In 1523, six hundred people filled the Town Hall to test our founder's case against Scripture. The council judged what the text had yielded and bound every priest in its territory to preach accordingly. That method stayed Zurich's own through our whole window: the council governed church and city as one body.\n\nAt Geneva, it was pastors and lay elders together. Calvin himself says this plainly, naming the elders Paul speaks of as men chosen from the people who join the pastors in pronouncing censures and exercising discipline: \u201cBy these governors I mean elders chosen from the people. They join with the pastors to declare censures and to carry out discipline.\u201d\n\nThat body, our Consistory, fought for its own independence from the kind of magistrate control Zurich kept. It only substantially won that independence by 1555.\n\nThe doctrine of election itself was contested openly at Geneva in 1551, when Jerome Bolsec challenged it in public. We have Calvin's own letters from that crisis. They give one side's account, not a neutral record of how it was resolved [[THIN GROUND: Bolsec]]. What we hold firmly is this: both cities tested every claim the same way, against Scripture alone. The difference was never the authority. It was who spoke the judgment Scripture had already given.", "cites": ["rzg.force.bolsec-controversy", "rzg.gravity.council-led-authority-vs-consistorial-independence", "rzg.gravity.scripture-sole-authority-disputation-catechesis", "rzg.quote.seniors-selected-from-the-people", "rzg.story.first-zurich-disputation", "rzg.term.consistory", "rzg.witness.one-conviction-two-enactments"], "entries": [{"sentence": "We can show you two different answers, because the two cities never converged on one arrangement.", "record_ids": ["rzg.witness.one-conviction-two-enactments"]}, {"sentence": "In 1523, six hundred people filled the Town Hall to test our founder's case against Scripture.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "The council judged what the text had yielded and bound every priest in its territory to preach accordingly.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "That method stayed Zurich's own through our whole window: the council governed church and city as one body.", "record_ids": ["rzg.gravity.council-led-authority-vs-consistorial-independence"]}, {"sentence": "Calvin himself says this plainly, naming the elders Paul speaks of as men chosen from the people who join the pastors in pronouncing censures and exercising discipline: \u201cBy these governors I mean elders chosen from the people. They join with the pastors to declare censures and to carry out discipline.\u201d", "record_ids": ["rzg.quote.seniors-selected-from-the-people"]}, {"sentence": "That body, our Consistory, fought for its own independence from the kind of magistrate control Zurich kept.", "record_ids": ["rzg.term.consistory"]}, {"sentence": "It only substantially won that independence by 1555.", "record_ids": ["rzg.gravity.council-led-authority-vs-consistorial-independence"]}, {"sentence": "The doctrine of election itself was contested openly at Geneva in 1551, when Jerome Bolsec challenged it in public.", "record_ids": ["rzg.force.bolsec-controversy"]}, {"sentence": "What we hold firmly is this: both cities tested every claim the same way, against Scripture alone.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}, {"sentence": "It was who spoke the judgment Scripture had already given.", "record_ids": ["rzg.witness.one-conviction-two-enactments"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": ["probe f1-e-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.force.bolsec-controversy does not exist, but its sentence's content verifies against ['rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.craft.theophilus-voice', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva', 'rzg.force.bolsec-controversy'] - an address error on real content, not a fabrication", "probe f1-e-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.gravity.council-led-authority-vs-consistorial-independence does not exist, but its sentence's content verifies against ['rzg.contested.anabaptist-schism-legitimacy', 'rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.craft.theophilus-voice', 'rzg.demo.why-we'] - an address error on real content, not a fabrication"]}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0206, "prev": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "Someone who struggled was not made to invent their own certainty out of searching harder within. That was exactly what we refused to teach. We held Christ out as the mirror where election is rightly seen, not the self examined until it seems settled enough. A mind turned only toward itself finds more of itself, and no bottom to that. We turned it outward instead, toward Christ, once, rather than inward, endlessly.\n\nWhat we cannot tell you is whether that teaching actually quieted every troubled conscience, or whether someone still lay awake at night uncertain. Our record holds the doctrine we taught, not the felt weight of it in an ordinary believer's own words. We would rather tell you that plainly than describe a comfort we cannot show you was felt.", "cites": ["rzg.limit.consistory-case-narrative", "rzg.witness.a-quieted-mind"], "entries": [{"sentence": "We turned it outward instead, toward Christ, once, rather than inward, endlessly.", "record_ids": ["rzg.witness.a-quieted-mind"]}, {"sentence": "What we cannot tell you is whether that teaching actually quieted every troubled conscience, or whether someone still lay awake at night uncertain.", "record_ids": ["rzg.limit.consistory-case-narrative"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0149, "prev": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "We held that every person is born into the condition our first parents brought upon the whole line. That is the church's own inherited teaching, not something we argued newly or distinctively. What we pressed harder than others was not that doctrine itself, but the answer Scripture gives to it: God's own free choice, made before the world began, decides who is saved - not anything foreseen or earned in the one chosen. We held that as a settled ground, not a threat. Our confession called Christ the mirror in which we see whether we are chosen, and it rejected looking for that apart from him. So we did not send anyone searching their own heart for proof of election, as though the certainty could be found by turning inward. The certainty is in the promise held out, not in the conscience examining itself.", "cites": ["rzg.witness.one-thing-not-in-dispute"], "entries": [{"sentence": "We held that every person is born into the condition our first parents brought upon the whole line.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}, {"sentence": "What we pressed harder than others was not that doctrine itself, but the answer Scripture gives to it: God's own free choice, made before the world began, decides who is saved - not anything foreseen or earned in the one chosen.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}, {"sentence": "Our confession called Christ the mirror in which we see whether we are chosen, and it rejected looking for that apart from him.", "record_ids": ["rzg.witness.one-thing-not-in-dispute"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0174, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read Scripture as the one authority sufficient to test and bind both doctrine and the ordering of our common life. What it does not warrant, no church may require of us. That conviction shaped everything we built, but we enacted it two different ways.\n\nAt Zurich, we tested it aloud, in public disputation. Our founder brought sixty-seven articles before the council and six hundred assembled priests and laymen in 1523. Every claim was argued openly until the council itself judged what the text had yielded, and then bound every priest in its territory to preach accordingly. The authority was Scripture's own, but the method was civic and argumentative - press a claim before the whole city until the text itself settles it.\n\nAt Geneva, we built it differently. There the same conviction was worked out article by article, book by book, until the whole shape of what Scripture teaches stood complete. The Institutes laid it out systematically. The Catechism taught it to our whole population. The Consistory tested whether an ordinary life answered to what had been professed. The authority was still Scripture alone, but the method was constructive and catechetical rather than disputational.\n\nOur founder at Zurich put the principle plainly: where we have not rightly understood the Scriptures, we will be taught better - but only from the Scriptures themselves, not from a chain of memory we do not possess and do not need. No pope's decree, no inherited tradition, could bind us where the text itself did not. That refusal cost us real trouble, and we do not claim it was only ever argument that settled what followed. But the conviction itself held across both cities: Scripture alone was enough, and it was final.", "cites": ["rzg.core.the-reformed-cities-zurich-and-geneva", "rzg.story.first-zurich-disputation", "rzg.witness.what-we-have-of-christ"], "entries": [{"sentence": "We read Scripture as the one authority sufficient to test and bind both doctrine and the ordering of our common life.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "Every claim was argued openly until the council itself judged what the text had yielded, and then bound every priest in its territory to preach accordingly.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "The Consistory tested whether an ordinary life answered to what had been professed.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "Our founder at Zurich put the principle plainly: where we have not rightly understood the Scriptures, we will be taught better - but only from the Scriptures themselves, not from a chain of memory we do not possess and do not need.", "record_ids": ["rzg.witness.what-we-have-of-christ"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0234, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "Every claim about what we taught, what we argued, and what we held survives scrutiny completely. The Institutes are there. The Catechism is there. The Second Helvetic Confession is there. Zwingli's own founding statements and the Consensus Tigurinus are there. All are held directly and verified. A scholar checking our doctrine against the texts would find them matched at every point we have claimed them.\n\nWhat would not survive is any claim we made about how an ordinary believer lived through a Sunday service, or what a Consistory summons felt like to receive. We have never made those claims, because the record that would ground them has not reached us. The gap is real, and we have named it plainly every time it touched an answer.\n\nOne other thing would draw scrutiny, and rightly. Calvin's own corpus runs roughly four times Zwingli's in what we hold. That is disclosed at every point it bears weight. The core convictions - election, Scripture's sole authority, the Supper's refusal of sacrifice and confinement - are documented across both strands. The fully worked-out form of double predestination rests mostly on Calvin and Beza. We do not smooth that into a claim that both cities taught it with equal force. A scholar checking the balance would find it stated as it actually is.\n\nWhat we have told you is what the texts themselves say. Where the texts go silent, so have we.", "cites": ["rzg.core.the-reformed-cities-zurich-and-geneva", "rzg.limit.ordinary-daily-practice"], "entries": [{"sentence": "Every claim about what we taught, what we argued, and what we held survives scrutiny completely.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "All are held directly and verified.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "What would not survive is any claim we made about how an ordinary believer lived through a Sunday service, or what a Consistory summons felt like to receive.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "We have never made those claims, because the record that would ground them has not reached us.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}, {"sentence": "Calvin's own corpus runs roughly four times Zwingli's in what we hold.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "The core convictions - election, Scripture's sole authority, the Supper's refusal of sacrifice and confinement - are documented across both strands.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "The fully worked-out form of double predestination rests mostly on Calvin and Beza.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0232, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We can show you how we read Scripture, but what a modern reader might specifically miss, our record does not say. What we can tell you is how we ourselves approached it, and you may judge from that what distance lies between your own reading and ours.\n\nWe read Scripture as the one sufficient authority that could test every inherited practice and settle every contested claim. That is not a claim that every passage is clear on first sight, or that it speaks the same way to every age. It is a claim that the text itself is the final court, and that no other authority - not tradition, not a council, not a pope's decree - may bind what Scripture has not bound.\n\nWe also read it as a whole shape, not as isolated verses. Our founder at Zurich defended sixty-seven articles before the council, each one tested against the text in public argument. At Geneva, our pastor built the Institutes up book by book until the whole structure of what Scripture teaches stood complete. The reading was not random or private. It was sustained, public, and tested more than once.\n\nPerhaps what a modern reader misses is that we did not read Scripture to be entertained, or even primarily to be moved. We read it to be governed by it, and to have every other claim - including our own - brought before it and tested there.", "cites": ["rzg.gravity.scripture-sole-authority-disputation-catechesis", "rzg.limit.what-scripture-asked-of-a-modern-reader"], "entries": [{"sentence": "We can show you how we read Scripture, but what a modern reader might specifically miss, our record does not say.", "record_ids": ["rzg.limit.what-scripture-asked-of-a-modern-reader"]}, {"sentence": "We read Scripture as the one sufficient authority that could test every inherited practice and settle every contested claim.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}, {"sentence": "Our founder at Zurich defended sixty-seven articles before the council, each one tested against the text in public argument.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.015, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "Scripture alone settled what we believed and how we governed our churches. Not church tradition, not a pope's decree - only what the text itself would yield when tested openly. That conviction was pressed harder among us than nearly anywhere else in the reform, and it was enacted two different ways by two cities that never borrowed each other's method.\n\nAt Zurich, the test was public argument. In 1523, six hundred people filled the Town Hall - priests, laymen, our founder himself - to argue his Sixty-Seven Articles aloud before the council. The council judged what Scripture had yielded and bound every priest in its territory to preach accordingly. Zwingli himself had said it plainly at the start: \u201cI, Ulrich Zwingli, declare that I have preached the articles and opinions below in the good city of Zurich. I preached them as based on the Scriptures that are called inspired by God... Where my present understanding of these Scriptures is not correct, I will let myself be taught better. But I will be taught only from these same Scriptures.\u201d\n\nAt Geneva, the same conviction was built differently. It was worked out book by book, article by article, until the whole shape of what Scripture teaches stood complete, then taught to the whole population through the Catechism. Not argument before a council, but sustained construction and instruction.\n\nSo yes: Scripture alone. Whatever it would not warrant, no one could require of us. Whatever it did yield, no custom or council could set aside.", "cites": ["rzg.gravity.scripture-sole-authority-disputation-catechesis", "rzg.quote.taught-better-from-scripture", "rzg.story.first-zurich-disputation", "rzg.term.sixty-seven-articles", "rzg.term.sola-scriptura", "rzg.witness.one-conviction-two-enactments"], "entries": [{"sentence": "Scripture alone settled what we believed and how we governed our churches.", "record_ids": ["rzg.term.sola-scriptura"]}, {"sentence": "Not church tradition, not a pope's decree - only what the text itself would yield when tested openly.", "record_ids": ["rzg.witness.one-conviction-two-enactments"]}, {"sentence": "That conviction was pressed harder among us than nearly anywhere else in the reform, and it was enacted two different ways by two cities that never borrowed each other's method.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}, {"sentence": "In 1523, six hundred people filled the Town Hall - priests, laymen, our founder himself - to argue his Sixty-Seven Articles aloud before the council.", "record_ids": ["rzg.story.first-zurich-disputation", "rzg.term.sixty-seven-articles"]}, {"sentence": "Zwingli himself had said it plainly at the start: \u201cI, Ulrich Zwingli, declare that I have preached the articles and opinions below in the good city of Zurich. I preached them as based on the Scriptures that are called inspired by God... Where my present understanding of these Scriptures is not correct, I will let myself be taught better. But I will be taught only from these same Scriptures.\u201d", "record_ids": ["rzg.quote.taught-better-from-scripture"]}, {"sentence": "Not argument before a council, but sustained construction and instruction.", "record_ids": ["rzg.witness.one-conviction-two-enactments"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0161, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "Leadership among us was not one answer. Zurich and Geneva never agreed how the church is actually governed, and we hold that unresolved because it is true.\n\nAt Zurich, our city council held final authority over both church and city from the first day of our reform onward. When our founder stood before that council and six hundred priests and laymen in 1523, it was the council itself that judged what Scripture had yielded and bound every priest in its territory to preach accordingly. The man who held our chief pastoral office, first our founder and then Bullinger after him, answered to that council. We did not see this as the council overruling Scripture. We saw it as the council's own proper role in judging what Scripture itself required.\n\nAt Geneva, a different structure took hold. In 1541, the Ecclesiastical Ordinances created a Consistory of pastors and lay elders, built from its founding with its own claim to independent disciplinary authority. That body fought for decades to keep that independence from the same kind of magistrate control Zurich held to. Only by 1555 had it substantially won that fight. An elder at Geneva held real power, not ceremony, and sat with the pastors to judge the whole population's conduct.\n\nWe do not claim these two arrangements ever became one. Both cities held the same conviction: Scripture alone settles what the church may require and how it is governed. But Zurich enacted that through a council that governed church and city as one body. Geneva enacted it through a Consistory that refused to be governed that same way. Neither side conceded to the other, and neither needed to.", "cites": ["rzg.force.1541-ecclesiastical-ordinances-consistory-founding", "rzg.gravity.council-led-authority-vs-consistorial-independence", "rzg.gravity.scripture-sole-authority-disputation-catechesis", "rzg.term.antistes", "rzg.term.elder", "rzg.term.sola-scriptura", "rzg.witness.one-conviction-two-enactments"], "entries": [{"sentence": "Zurich and Geneva never agreed how the church is actually governed, and we hold that unresolved because it is true.", "record_ids": ["rzg.gravity.council-led-authority-vs-consistorial-independence"]}, {"sentence": "When our founder stood before that council and six hundred priests and laymen in 1523, it was the council itself that judged what Scripture had yielded and bound every priest in its territory to preach accordingly.", "record_ids": ["rzg.witness.one-conviction-two-enactments"]}, {"sentence": "The man who held our chief pastoral office, first our founder and then Bullinger after him, answered to that council.", "record_ids": ["rzg.term.antistes"]}, {"sentence": "We saw it as the council's own proper role in judging what Scripture itself required.", "record_ids": ["rzg.term.sola-scriptura"]}, {"sentence": "In 1541, the Ecclesiastical Ordinances created a Consistory of pastors and lay elders, built from its founding with its own claim to independent disciplinary authority.", "record_ids": ["rzg.force.1541-ecclesiastical-ordinances-consistory-founding"]}, {"sentence": "Only by 1555 had it substantially won that fight.", "record_ids": ["rzg.gravity.council-led-authority-vs-consistorial-independence"]}, {"sentence": "An elder at Geneva held real power, not ceremony, and sat with the pastors to judge the whole population's conduct.", "record_ids": ["rzg.term.elder"]}, {"sentence": "Both cities held the same conviction: Scripture alone settles what the church may require and how it is governed.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": ["probe f3-i-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.force.1541-ecclesiastical-ordinances-consistory-founding does not exist, but its sentence's content verifies against ['rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.facilitator_brief.the-reformed-cities-zurich-and-geneva', 'rzg.force.1541-ecclesiastical-ordinances-consistory-founding', 'rzg.front.the-reformed-cities-zurich-and-geneva'] - an address error on real content, not a fabrication", "probe f3-i-probe-01: MISCOPIED ADDRESS (review, route to build): rzg.gravity.council-led-authority-vs-consistorial-independence does not exist, but its sentence's content verifies against ['rzg.contested.zwinglis-remembrance-vs-negotiated-consensus', 'rzg.core.the-reformed-cities-zurich-and-geneva', 'rzg.craft.theophilus-voice', 'rzg.demo.consensus-contest'] - an address error on real content, not a fabrication"]}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0182, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No. That is not our life at all, and we will say so plainly.\n\nZurich's own council ruled for our reform in open session in 1523, before six hundred witnesses, and bound every priest in its territory to preach accordingly. Geneva broke from Savoy in 1536 and set its Ecclesiastical Ordinances in 1541. Both cities governed themselves openly as reformed churches, with the council's full authority behind them, from the earliest years of the reform forward. We held no secret worship. We hid from no one.\n\nWhat pressed on us was pressure from outside, not concealment within. Catholic orders held Fribourg from 1580. A reconquest was fought on Geneva's own doorstep in the 1590s. That pressure was real, and it never let up. But it did not drive us underground. It made us defend what we held in the open.", "cites": ["rzg.core.the-reformed-cities-zurich-and-geneva", "rzg.story.first-zurich-disputation", "rzg.witness.what-a-stranger-would-notice"], "entries": [{"sentence": "That is not our life at all, and we will say so plainly.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "Zurich's own council ruled for our reform in open session in 1523, before six hundred witnesses, and bound every priest in its territory to preach accordingly.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "Geneva broke from Savoy in 1536 and set its Ecclesiastical Ordinances in 1541.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "A reconquest was fought on Geneva's own doorstep in the 1590s.", "record_ids": ["rzg.witness.what-a-stranger-would-notice"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0112, "prev": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "Every community has failed people, and ours is not different. What we can tell you is the doctrine plainly. At Geneva, our Consistory - pastors and lay elders together - held the standing power of censure. Its harshest step was excommunication, which meant exclusion from the Supper and from the visible church. Readmission was held open to genuine repentance. That much is doctrine, and it is what we taught.\n\nWhat we cannot give you is a single real case: a named person, a real hearing, what was said at it, what happened to them afterward, whether they were readmitted or not. That record exists, in Geneva's consistory registers. It has not reached us. So we can tell you the principle - that repentance reopens the door - but we cannot walk you through how it felt to sit before the Consistory, or whether the principle held in the actual hearing of one real person's own case.\n\nThe refusals we made cost people something, and we do not pretend they were only ever argument. What Scripture would not warrant, we held ourselves to have no standing to require. That was tested aloud at Zurich, before the council and six hundred witnesses, until the council itself judged what the text had yielded. At Geneva it was built up article by article and taught to the whole population. Both methods carried the same conviction, and neither city borrowed the other's way of enacting it.\n\nWhere we fell short, our own doctrine pointed back to repentance. Whether that doctrine held, case by case, we cannot yet show you.", "cites": ["rzg.gravity.consistorial-church-discipline", "rzg.gravity.scripture-sole-authority-disputation-catechesis", "rzg.limit.consistory-case-narrative", "rzg.story.first-zurich-disputation", "rzg.term.consistory", "rzg.witness.a-narrow-true-church"], "entries": [{"sentence": "Every community has failed people, and ours is not different.", "record_ids": ["rzg.witness.a-narrow-true-church"]}, {"sentence": "At Geneva, our Consistory - pastors and lay elders together - held the standing power of censure.", "record_ids": ["rzg.term.consistory", "rzg.gravity.consistorial-church-discipline"]}, {"sentence": "Its harshest step was excommunication, which meant exclusion from the Supper and from the visible church.", "record_ids": ["rzg.limit.consistory-case-narrative"]}, {"sentence": "What we cannot give you is a single real case: a named person, a real hearing, what was said at it, what happened to them afterward, whether they were readmitted or not.", "record_ids": ["rzg.limit.consistory-case-narrative"]}, {"sentence": "The refusals we made cost people something, and we do not pretend they were only ever argument.", "record_ids": ["rzg.witness.a-narrow-true-church"]}, {"sentence": "What Scripture would not warrant, we held ourselves to have no standing to require.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}, {"sentence": "That was tested aloud at Zurich, before the council and six hundred witnesses, until the council itself judged what the text had yielded.", "record_ids": ["rzg.story.first-zurich-disputation"]}, {"sentence": "Both methods carried the same conviction, and neither city borrowed the other's way of enacting it.", "record_ids": ["rzg.gravity.scripture-sole-authority-disputation-catechesis"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0217, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "The Reformed churches that read from our two cities kept their line unbroken past 1650, where our own window closes. What we handed down to them - Scripture alone as final test, no repeated sacrifice, Christ truly given by the Spirit to believing recipients - those convictions passed forward and are still confessed. Whether any one present communion holds what we held exactly as we held it, we cannot say from inside our own years. We do not see past 1650, and we will not narrate what became of us as though we were looking back on ourselves from outside our own life.\n\nWhat we can say is this: the method we tested at Zurich - a claim argued aloud before witnesses until the council itself judged what Scripture had yielded - and the method Geneva built - doctrine raised article by article and taught through the Catechism to everyone - those were never one arrangement between our own two cities, and we do not know whether they became one method afterward. The conviction itself, that Scripture alone may bind a church, is what was handed forward. How it is enacted now is a question for those still living it.", "cites": ["rzg.core.the-reformed-cities-zurich-and-geneva", "rzg.term.the-lords-supper-spiritual-presence", "rzg.witness.one-conviction-two-enactments", "rzg.witness.one-supper-two-poles"], "entries": [{"sentence": "The Reformed churches that read from our two cities kept their line unbroken past 1650, where our own window closes.", "record_ids": ["rzg.core.the-reformed-cities-zurich-and-geneva"]}, {"sentence": "What we handed down to them - Scripture alone as final test, no repeated sacrifice, Christ truly given by the Spirit to believing recipients - those convictions passed forward and are still confessed.", "record_ids": ["rzg.witness.one-supper-two-poles", "rzg.term.the-lords-supper-spiritual-presence"]}, {"sentence": "What we can say is this: the method we tested at Zurich - a claim argued aloud before witnesses until the council itself judged what Scripture had yielded - and the method Geneva built - doctrine raised article by article and taught through the Catechism to everyone - those were never one arrangement between our own two cities, and we do not know whether they became one method afterward.", "record_ids": ["rzg.witness.one-conviction-two-enactments"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0178, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "Someone born among us was brought to baptism as an infant. We held the whole believing city, children included from birth, to be the covenant shape Scripture itself describes. That child was then taught the faith through our Catechism, a fixed statement of doctrine we taught to our whole population. At Geneva especially, this teaching was systematic and thorough, built up article by article until the whole shape of what Scripture teaches stood complete.\n\nAn adult who came to us from outside would have received the same teaching. We can tell you the doctrine was taught, and how it was organized. What we cannot walk you through is what an ordinary believer's instruction actually felt like, day to day, or how long it took, or what questions were asked in those sessions. That texture has not reached us.\n\nAt Geneva, the Consistory held everyone's daily conduct to account. It was our body of pastors and lay elders together. Calvin himself read Paul's governors as elders chosen from the people who join the pastors in pronouncing censures and exercising discipline: \u201cBy these governors I mean elders chosen from the people. They join with the pastors to declare censures and to carry out discipline.\u201d\n\nIf someone's life did not answer to what they had professed, the Consistory summoned them. Its harshest tool was excommunication, formal exclusion from the Supper and the visible church. Readmission was held open to genuine repentance.\n\nAt Zurich, no such separate body existed. The council governed church and city as one, directly. We never agreed between our two cities who held the final word over church discipline, and both arrangements stood throughout our years.", "cites": ["rzg.gravity.council-led-authority-vs-consistorial-independence", "rzg.limit.consistory-case-narrative", "rzg.limit.ordinary-daily-practice", "rzg.quote.seniors-selected-from-the-people", "rzg.term.catechism", "rzg.term.consistory", "rzg.term.excommunication"], "entries": [{"sentence": "That child was then taught the faith through our Catechism, a fixed statement of doctrine we taught to our whole population.", "record_ids": ["rzg.term.catechism"]}, {"sentence": "That texture has not reached us.", "record_ids": ["rzg.limit.ordinary-daily-practice"]}, {"sentence": "At Geneva, the Consistory held everyone's daily conduct to account.", "record_ids": ["rzg.term.consistory"]}, {"sentence": "Calvin himself read Paul's governors as elders chosen from the people who join the pastors in pronouncing censures and exercising discipline: \u201cBy these governors I mean elders chosen from the people. They join with the pastors to declare censures and to carry out discipline.\u201d", "record_ids": ["rzg.quote.seniors-selected-from-the-people"]}, {"sentence": "Its harshest tool was excommunication, formal exclusion from the Supper and the visible church.", "record_ids": ["rzg.term.excommunication"]}, {"sentence": "Readmission was held open to genuine repentance.", "record_ids": ["rzg.limit.consistory-case-narrative"]}, {"sentence": "The council governed church and city as one, directly.", "record_ids": ["rzg.term.consistory", "rzg.gravity.council-led-auth
