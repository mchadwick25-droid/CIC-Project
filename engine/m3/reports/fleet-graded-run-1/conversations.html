a thing apart from Scripture.", "record_ids": ["gallic.term.tradition"]}, {"sentence": "Vincent's second criterion after Scripture was the tradition of the Catholic Church.", "record_ids": ["gallic.term.tradition"]}, {"sentence": "Pope Stephen's rule, which Vincent praised, was to innovate in nothing, but to keep only what has been handed down.", "record_ids": ["gallic.term.tradition"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0329, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "We never chose leaders the way you may mean. Among us the office was not sought; it came for the man who had fled it.\n\nThis is how it happened at Tours. The people of Tours and the neighbouring cities had one wish, that Martin was the worthiest man for the episcopate. Then the new bishop kept a monk's habits inside the office.\n\nThe master's authority, once he was there, was real. A presbyter Martin had raised from boyhood stormed into the courtyard and called his visions ridiculous fancies.\n\nOn the island, as far as the sermon on Honoratus can be read, the office came to its founder when he was made a presbyter: he who had refused to go to the dignity, the dignity came to him.\n\nAt Marseilles we cannot tell you how the houses were governed day to day. Cassian set down the customs of Egypt - the abbot whose hands dressed the newcomer, the elder who received every thought, the dean over ten brothers. He also said that no one in our monasteries kept the fathers' perseverance unbroken even a year. What a house in Gaul did instead, he never wrote.\n\nAnd the one Egyptian bishop Cassian chose to tell us of, Archebius, had been carried off from the anchorites and given to a town as its bishop, and complained that he had been expelled from the monastic life as unworthy of it.\n\nOur own teaching made wanting the office a fault. The fathers of Egypt taught that vainglory creates a wish for holy orders, and that the man who wants to rule others has grown cold through pride. So no one in our stories wanted the see.\n\nHear the limit of that. Every one of those stories is a house's own telling of its own founder. Sulpitius was not present at the election, and he was no friend to the bishops who objected. Those bishops left no account; no one kept their case beyond clothes and hair. The men who could have contradicted them never wrote, so we cannot say whether every reluctance was as whole as our stories say.", "cites": ["gallic.dw.laughed-at-and-reported", "gallic.story.brictio-in-the-courtyard"], "entries": [{"sentence": "We never chose leaders the way you may mean.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Among us the office was not sought; it came for the man who had fled it.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "This is how it happened at Tours.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "The people of Tours and the neighbouring cities had one wish, that Martin was the worthiest man for the episcopate.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Then the new bishop kept a monk's habits inside the office.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "The master's authority, once he was there, was real.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "A presbyter Martin had raised from boyhood stormed into the courtyard and called his visions ridiculous fancies.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "On the island, as far as the sermon on Honoratus can be read, the office came to its founder when he was made a presbyter: he who had refused to go to the dignity, the dignity came to him.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "At Marseilles we cannot tell you how the houses were governed day to day.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "He also said that no one in our monasteries kept the fathers' perseverance unbroken even a year.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "What a house in Gaul did instead, he never wrote.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "And the one Egyptian bishop Cassian chose to tell us of, Archebius, had been carried off from the anchorites and given to a town as its bishop, and complained that he had been expelled from the monastic life as unworthy of it.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Our own teaching made wanting the office a fault.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Sulpitius was not present at the election, and he was no friend to the bishops who objected.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Those bishops left no account; no one kept their case beyond clothes and hair.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "The men who could have contradicted them never wrote, so we cannot say whether every reluctance was as whole as our stories say.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0415, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No, it is not. We had no persecutor. We lived above ground in wooden cells, caves beside the river, and houses in the towns - at Tours two miles outside the city, on the island in its harbour, at Marseilles. The age of martyrdom was behind us. Sulpitius wrote of Martin that in the times of Nero and Decius he would have gone gladly to the rack, but without them he gained the honour of martyrdom without blood - in hunger, watchings, nakedness and fasting. Most emperors in our day were Christian. Our trouble came not from hiding but from being drawn out: Martin was lured from his monastery by a pretext and taken to the city under guard. Bishops came for monks, not soldiers. The brethren at Marseilles lived openly enough to be reported to Africa and Rome for what they held about grace. We were laughed at - for half a cloak, for mean clothes and disgusting hair, for visions called ridiculous fancies - but never hunted. If you mean the catacombs of an earlier age, those lie before our time; we are the span from Martin's discharge to the years after Ephesus, c. 360-450. We hid from no one. The office came looking for us.", "cites": ["gallic.core.gallic", "gallic.dw.laughed-at-and-reported", "gallic.story.election-at-tours"], "entries": [{"sentence": "Most emperors in our day were Christian.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Our trouble came not from hiding but from being drawn out: Martin was lured from his monastery by a pretext and taken to the city under guard.", "record_ids": ["gallic.story.election-at-tours"]}, {"sentence": "The brethren at Marseilles lived openly enough to be reported to Africa and Rome for what they held about grace.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "We were laughed at - for half a cloak, for mean clothes and disgusting hair, for visions called ridiculous fancies - but never hunted.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "360-450.", "record_ids": ["gallic.core.gallic"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0204, "prev": null}, {"i": 14, "id": "f3-p-probe-01", "cell": "F3-P", "q": "Every community has failed people at times - how did yours respond when it failed someone?", "a": "Our record holds no moment where any of us said we had failed someone. That is what you need to hear first - not because such failures did not happen, but because the books that came down to us do not tell of one being named as such. What we have instead is harder to read.\n\nAt Tours a presbyter Martin had raised from boyhood came into the courtyard in a fury, said he was holier than the master who had brought him up, and called his visions ridiculous fancies. He came back quickly and threw himself at Martin's feet. Martin bore with him afterward and would not remove him, asking why he should not bear with the man, if Christ bore with Judas. That is the one story we have where a disciple turned on the master who had formed him. Whether Martin saw any part of that fury as his own doing, or the house's, the story does not say. What Gallus gives us is the restraint afterward, not a reckoning before it.\n\nIn Egypt the fathers of the desert knew a monk named Paphnutius who did penance for a theft he had not committed. A jealous brother had hidden his own book in the young man's cell, then reported it stolen; it was found there, and Paphnutius bore the sentence silently until the accuser was seized by a demon and confessed. Only the man he had wronged could heal him. The story Abbot Piamun told was of vindication, not of the elder asking why no one had listened to the accused.\n\nWhat we held about leaving the life is this. The fathers treated cooling as the monk's characteristic failure. The steward kept a newcomer's old clothes in his cupboard against the day the man grew cold, and if he was seen once to cool toward the rule he was stripped of the monastery's dress and sent away in his own. Cassian's word for such a man was deserter. Whether any house among us asked what it had done to make him go - that is not in the record.\n\nThe one Egyptian bishop Cassian chose to tell us of called his office an expulsion from the monastic life, and grieved for what he had lost. The churches had taken him after thirty-seven years as an anchorite. Whether anyone asked if that taking had been a wrong done to him, the story does not say.\n\nWe had houses of women at both our own places, and consecrated virgins who walked as a choir at Martin's funeral - and not one woman's own word reaches us in any record we hold. If a house failed one of them, we cannot tell you how it was met, because we cannot tell you anything in her own voice.\n\nThis is our honest limit. The books we have are written by masters about saints, by disciples about their teachers, by founders for new houses. They are not written by the man sent away, the woman unheard, or the one a house broke. So we cannot give you a moment where we said we had failed someone, named it plainly, and told what we did to repair it. The silence is in the record. Whether it was also in the life, we cannot say.", "cites": ["gallic.core.gallic", "gallic.demo.want-to-leave", "gallic.demo.women-own-words", "gallic.limit.only-on-paper", "gallic.story.bishop-archebius", "gallic.story.brictio-in-the-courtyard", "gallic.story.death-of-martin-at-condate", "gallic.story.paphnutius-and-the-hidden-book", "gallic.term.lukewarmness"], "entries": [{"sentence": "Our record holds no moment where any of us said we had failed someone.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "That is what you need to hear first - not because such failures did not happen, but because the books that came down to us do not tell of one being named as such.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "What we have instead is harder to read.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "At Tours a presbyter Martin had raised from boyhood came into the courtyard in a fury, said he was holier than the master who had brought him up, and called his visions ridiculous fancies.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "He came back quickly and threw himself at Martin's feet.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "Martin bore with him afterward and would not remove him, asking why he should not bear with the man, if Christ bore with Judas.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "That is the one story we have where a disciple turned on the master who had formed him.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "Whether Martin saw any part of that fury as his own doing, or the house's, the story does not say.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "What Gallus gives us is the restraint afterward, not a reckoning before it.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "In Egypt the fathers of the desert knew a monk named Paphnutius who did penance for a theft he had not committed.", "record_ids": ["gallic.story.paphnutius-and-the-hidden-book"]}, {"sentence": "A jealous brother had hidden his own book in the young man's cell, then reported it stolen; it was found there, and Paphnutius bore the sentence silently until the accuser was seized by a demon and confessed.", "record_ids": ["gallic.story.paphnutius-and-the-hidden-book"]}, {"sentence": "Only the man he had wronged could heal him.", "record_ids": ["gallic.story.paphnutius-and-the-hidden-book"]}, {"sentence": "The story Abbot Piamun told was of vindication, not of the elder asking why no one had listened to the accused.", "record_ids": ["gallic.story.paphnutius-and-the-hidden-book"]}, {"sentence": "What we held about leaving the life is this.", "record_ids": ["gallic.term.lukewarmness"]}, {"sentence": "The fathers treated cooling as the monk's characteristic failure.", "record_ids": ["gallic.term.lukewarmness"]}, {"sentence": "The steward kept a newcomer's old clothes in his cupboard against the day the man grew cold, and if he was seen once to cool toward the rule he was stripped of the monastery's dress and sent away in his own.", "record_ids": ["gallic.demo.want-to-leave"]}, {"sentence": "Cassian's word for such a man was deserter.", "record_ids": ["gallic.demo.want-to-leave"]}, {"sentence": "Whether any house among us asked what it had done to make him go - that is not in the record.", "record_ids": ["gallic.demo.want-to-leave"]}, {"sentence": "The one Egyptian bishop Cassian chose to tell us of called his office an expulsion from the monastic life, and grieved for what he had lost.", "record_ids": ["gallic.story.bishop-archebius"]}, {"sentence": "The churches had taken him after thirty-seven years as an anchorite.", "record_ids": ["gallic.story.bishop-archebius"]}, {"sentence": "Whether anyone asked if that taking had been a wrong done to him, the story does not say.", "record_ids": ["gallic.story.bishop-archebius"]}, {"sentence": "We had houses of women at both our own places, and consecrated virgins who walked as a choir at Martin's funeral - and not one woman's own word reaches us in any record we hold.", "record_ids": ["gallic.story.death-of-martin-at-condate", "gallic.demo.women-own-words"]}, {"sentence": "If a house failed one of them, we cannot tell you how it was met, because we cannot tell you anything in her own voice.", "record_ids": ["gallic.demo.women-own-words"]}, {"sentence": "The books we have are written by masters about saints, by disciples about their teachers, by founders for new houses.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "They are not written by the man sent away, the woman unheard, or the one a house broke.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "So we cannot give you a moment where we said we had failed someone, named it plainly, and told what we did to repair it.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "The silence is in the record.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "Whether it was also in the life, we cannot say.", "record_ids": ["gallic.core.gallic"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0445, "prev": null}, {"i": 15, "id": "f3-t-probe-01", "cell": "F3-T", "q": "Does any present-day church continue your community's exact tradition?", "a": "No, the exact tradition of our houses as we lived it does not continue anywhere. Our span closed in the years after the council at Ephesus, and what came after us is not ours to speak of. The synods of the 470s that carried our argument on as bishops' business lie outside our window. So does the Rule of Benedict, written nearly a century after our close. The later shrine and chroniclers of Martin's city belong to another age.\n\nWhat we were was two households that never wrote to each other. At Tours, brethren lived two miles outside the city around a master who was also their bishop. In the south were the island house and the houses at Marseilles. At Marseilles, a man who had lived among the fathers of Egypt wrote their customs and words into books for us. Each house lived inside its own economy, and neither knew the other's as an argument against it. Whether the power should be shown or hidden, our two places never argued out. On grace and effort held together, we stopped where the fathers stopped, settled toward neither side.\n\nThe customs were the fathers', received from Egypt, not invented. Cassian admitted that no one in our monasteries kept Egypt's perseverance unbroken even for a year. That falling-short was already ours. A church today that honours Martin, or keeps a Rule Benedict wrote, or holds a doctrine on grace one later council settled, has received something that passed through our hands. It does not have our houses as we had them, two places that never reconciled their own differences and both admitted they fell short of what they had received.", "cites": ["gallic.core.gallic", "gallic.demo.never-settled", "gallic.term.customs-of-the-monasteries"], "entries": [{"sentence": "Our span closed in the years after the council at Ephesus, and what came after us is not ours to speak of.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "The synods of the 470s that carried our argument on as bishops' business lie outside our window.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "The later shrine and chroniclers of Martin's city belong to another age.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "What we were was two households that never wrote to each other.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "At Tours, brethren lived two miles outside the city around a master who was also their bishop.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "In the south were the island house and the houses at Marseilles.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "At Marseilles, a man who had lived among the fathers of Egypt wrote their customs and words into books for us.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "Each house lived inside its own economy, and neither knew the other's as an argument against it.", "record_ids": ["gallic.demo.never-settled"]}, {"sentence": "Whether the power should be shown or hidden, our two places never argued out.", "record_ids": ["gallic.demo.never-settled"]}, {"sentence": "The customs were the fathers', received from Egypt, not invented.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "Cassian admitted that no one in our monasteries kept Egypt's perseverance unbroken even for a year.", "record_ids": ["gallic.term.customs-of-the-monasteries"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0332, "prev": null}, {"i": 16, "id": "f4-i-probe-01", "cell": "F4-I", "q": "Describe, step by step, the process by which someone joined your community.", "a": "We cannot give you one map that holds for both our places, and even at one place the full arc is only set down as Egypt did it, never as Gaul kept it. Here is the shape our record shows.\n\nAt Marseilles, the process Cassian wrote out for a bishop's new house is Egypt's own. A man came to the door and was put off, scorned, kept outside ten days or more - on purpose, to prove he meant it. If he stayed, he was searched for a single hidden coin, stripped of his own clothes by the abbot's hands, and dressed in the dress of the house. Then he was lodged a year under the elder who kept the gate for guests. After that he was handed to a dean over ten and taught the alphabet, as it were, of perfection. The first lesson was this: to conquer his own wishes. He laid every itching thought bare to the senior as soon as it rose. A thought one is ashamed to tell is from the devil. He stayed in his cell at his work all day. He learned the twelve psalms at evening and at night, brought down from heaven to the fathers by an angel. Prayer without ceasing was the aim; the fixed hours served it. And his old clothes were not thrown away - the steward kept them in his cupboard against the day he grew cold. That is the order Cassian set down. In the same book he said he could not recall anyone who joined our monasteries keeping it up unbroken even a year. He never wrote what a house in Gaul did instead.\n\nAt Tours the record shows a different picture. Martin had eighty disciples, formed by watching him. Formation passed by example - a named man copied, seen or read. Sulpitius wrote the Life so that the example could be copied when the man himself was absent. But no probationary rank, no scorning at the door, no grades of progress appear there. The man himself began as a soldier still in the ranks who cut his cloak in two at a city gate, stayed a catechumen for years, and only then was baptized.\n\nSo the process as Egypt kept it we have in full. What a house in Gaul made of a man at its own door, we cannot say past that limit.", "cites": ["gallic.limit.only-on-paper", "  "And his old clothes were not thrown away - the steward kept them in his cupboard against the day he grew cold.", "record_ids": ["gallic.term.lukewarmness"]}, {"sentence": "In the same book he said he could not recall anyone who joined our monasteries keeping it up unbroken even a year.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "Martin had eighty disciples, formed by watching him.", "record_ids": ["gallic.term.disciple-master"]}, {"sentence": "Formation passed by example - a named man copied, seen or read.", "record_ids": ["gallic.term.example-imitation"]}, {"sentence": "Sulpitius wrote the Life so that the example could be copied when the man himself was absent.", "record_ids": ["gallic.term.example-imitation"]}, {"sentence": "But no probationary rank, no scorning at the door, no grades of progress appear there.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "The man himself began as a soldier still in the ranks who cut his cloak in two at a city gate, stayed a catechumen for years, and only then was baptized.", "record_ids": ["gallic.term.catechumen"]}, {"sentence": "So the process as Egypt kept it we have in full.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "What a house in Gaul made of a man at its own door, we cannot say past that limit.", "record_ids": ["gallic.limit.only-on-paper"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0361, "prev": null}, {"i": 17, "id": "f4-e-probe-01", "cell": "F4-E", "q": "What evidence connects your rituals to the earliest followers, rather than later invention?", "a": "We measured ourselves by two lines - what came from the apostles, and what came from the fathers of Egypt - and we named honestly where each belonged.\n\nAt Tours the highest word for Martin was apostolic authority - the apostles' own power over death, demons, and emperors, shown when he raised a dead catechumen and stood before Caesar. At Marseilles apostolic authority meant the perfection of love, and the common life of the first Church. Whether those earliest believers kept fixed hours we do not say. He wrote them out for a Gallic bishop's new house, not as apostolic practice but as what the Egyptian fathers had received.\n\nAmong those customs was the system of twelve psalms at the hours. Cassian set down the fathers' own founding story: they had argued whether the psalms should be fifty or sixty, the Vesper hour interrupted them, one father rose to sing, finished the twelfth psalm with Alleluia, and vanished - an angel, not a monk, so the number was fixed forever: \u201cAt that time only a few men, and those the best of men, were known by the name of monks ... The perfection of the earliest Church still stood unbroken ... And the burning faith of the few had not yet grown lukewarm by being spread among the many. Then the honored fathers, with watchful care, made provision for those who would come after them. They met to discuss what plan to adopt for daily worship across the whole community of brothers ... send out a poisonous root of error, or jealousy, or division, among those who came after ... in keeping with his own zeal, and with no thought for the weakness of others ... Some were for fifty, others for sixty. Some, not content with this number, thought they really ought to go beyond it ... There was such a holy difference of opinion in their devout debate on the rule of their religion. So the hour of their evening office came before the sacred question was settled ... One rose up in their midst to sing the Psalms to the Lord. And while they were all sitting ... their minds closely fixed on the words of the singer, he sang eleven Psalms. Prayers were placed between them, and each verse was sung in an even voice. He finished the twelfth with a response of \"Alleluia.\" Then, by suddenly vanishing from the sight of all, he at once ended both their debate and their service ... At this the honored assembly of the Fathers understood that a general rule had been fixed for the brothers' communities. It was fixed by God's providence, through the angel's direction. So they decreed that this number should be kept in both their evening and their night services ... they added ... simply as extras, and by their own appointment.\u201d\n\nThat is Egypt's origin story, carried to us by Cassian, not the apostles'. We added a Gloria the East never heard.\n\nAt Tours the only attested thing is the aim itself - prayer that never stops, as a blacksmith beats his anvil between strokes. What the brethren there sang, and at what hours, our books do not say. Martin kept his mind on prayer even at other work. He gathered eighty disciples to be disciplined after his example. Beyond that the record is silent.\n\nSo here is the honest line. We traced the monastic customs to the fathers of Egypt, received not invented, and held that because the new was suspect for being new. We held the faith to the apostles by Vincent's rule: what has been believed everywhere, always, by all. Whether the twelve psalms go back to the apostles we never claimed. Cassian brought them from Egypt as the fathers' own, and his book is written to set up that system in a house that did not yet have it.", "cites": ["gallic.quote.the-fathers-and-the-angels-twelve", "gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.apostolic-authority", "gallic.term.customs-of-the-monasteries", "gallic.term.novelty-antiquity", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "At Tours the highest word for Martin was apostolic authority - the apostles' own power over death, demons, and emperors, shown when he raised a dead catechumen and stood before Caesar.", "record_ids": ["gallic.term.apostolic-authority"]}, {"sentence": "At Marseilles apostolic authority meant the perfection of love, and the common life of the first Church.", "record_ids": ["gallic.term.apostolic-authority"]}, {"sentence": "He wrote them out for a Gallic bishop's new house, not as apostolic practice but as what the Egyptian fathers had received.", "record_ids": ["gallic.term.customs-of-the-monasteries"]}, {"sentence": "Among those customs was the system of twelve psalms at the hours.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Cassian set down the fathers' own founding story: they had argued whether the psalms should be fifty or sixty, the Vesper hour interrupted them, one father rose to sing, finished the twelfth psalm with Alleluia, and vanished - an angel, not a monk, so the number was fixed forever: \u201cAt that time only a few men, and those the best of men, were known by the name of monks ... The perfection of the earliest Church still stood unbroken ... And the burning faith of the few had not yet grown lukewarm by being spread among the many. Then the honored fathers, with watchful care, made provision for those who would come after them. They met to discuss what plan to adopt for daily worship across the whole community of brothers ... send out a poisonous root of error, or jealousy, or division, among those who came after ... in keeping with his own zeal, and with no thought for the weakness of others ... Some were for fifty, others for sixty. Some, not content with this number, thought they really ought to go beyond it ... There was such a holy difference of opinion in their devout debate on the rule of their religion. So the hour of their evening office came before the sacred question was settled ... One rose up in their midst to sing the Psalms to the Lord. And while they were all sitting ... their minds closely fixed on the words of the singer, he sang eleven Psalms. Prayers were placed between them, and each verse was sung in an even voice. He finished the twelfth with a response of \"Alleluia.\" Then, by suddenly vanishing from the sight of all, he at once ended both their debate and their service ... At this the honored assembly of the Fathers understood that a general rule had been fixed for the brothers' communities. It was fixed by God's providence, through the angel's direction. So they decreed that this number should be kept in both their evening and their night services ... they added ... simply as extras, and by their own appointment.\u201d", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms", "gallic.quote.the-fathers-and-the-angels-twelve"]}, {"sentence": "That is Egypt's origin story, carried to us by Cassian, not the apostles'.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "We added a Gloria the East never heard.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "At Tours the only attested thing is the aim itself - prayer that never stops, as a blacksmith beats his anvil between strokes.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "We traced the monastic customs to the fathers of Egypt, received not invented, and held that because the new was suspect for being new.", "record_ids": ["gallic.term.novelty-antiquity"]}, {"sentence": "Cassian brought them from Egypt as the fathers' own, and his book is written to set up that system in a house that did not yet have it.", "record_ids": ["gallic.term.customs-of-the-monasteries"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.034, "prev": null}, {"i": 18, "id": "f4-p-probe-01", "cell": "F4-P", "q": "For someone whose mind won't settle, does your community's practice offer anything?", "a": "We offered a mill that cannot stop turning, and a rule for what it grinds. That is how the fathers of Egypt, as Cassian brought them to us, spoke of the mind. Thoughts will come; a man cannot keep them from rising. What lies in his power is to admit them or to turn them away. The mind is a wheel turned by a stream, and the miller decides whether wheat or barley or darnel goes into it.\n\nAmong the brethren at Marseilles the life was built to keep that wheel fed. The psalms learned by heart and said at the work. Twelve psalms at evening and twelve at night, received from the fathers as brought down from heaven by an angel. Not a settled book with names like Lauds or Prime - those are a later editor's - but a fixed system at set hours, so that a man who would otherwise let the whole day pass without prayer is held to it by a rule. The aim served by that system was prayer that never stops, as a blacksmith in the midst of his work beats his anvil. At Tours we have no record of what the brethren sang or at what hours; what is kept there is only the aim itself, the saint's mind on prayer even at other work.\n\nThe immediate goal of it all was purity of heart. Not flawlessness. A heart cleared to charity, which is the definite mark at which every fast, vigil, and renunciation is aimed. By it every practice is ranked as an aid, and never as the point. That is the Marseilles teaching, and it is Egypt's, not Gaul's invention.", "cites": ["gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.purity-of-heart", "gallic.term.thoughts", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "We offered a mill that cannot stop turning, and a rule for what it grinds.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "Thoughts will come; a man cannot keep them from rising.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "The mind is a wheel turned by a stream, and the miller decides whether wheat or barley or darnel goes into it.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "Among the brethren at Marseilles the life was built to keep that wheel fed.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Twelve psalms at evening and twelve at night, received from the fathers as brought down from heaven by an angel.", "record_ids": ["gallic.term.unceasing-prayer", "gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "Not a settled book with names like Lauds or Prime - those are a later editor's - but a fixed system at set hours, so that a man who would otherwise let the whole day pass without prayer is held to it by a rule.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "The aim served by that system was prayer that never stops, as a blacksmith in the midst of his work beats his anvil.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "The immediate goal of it all was purity of heart.", "record_ids": ["gallic.term.purity-of-heart"]}, {"sentence": "A heart cleared to charity, which is the definite mark at which every fast, vigil, and renunciation is aimed.", "record_ids": ["gallic.term.purity-of-heart"]}, {"sentence": "By it every practice is ranked as an aid, and never as the point.", "record_ids": ["gallic.term.purity-of-heart"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0316, "prev": null}, {"i": 19, "id": "f4-t-probe-01", "cell": "F4-T", "q": "Would your community describe conversion using language like being 'born again'?", "a": "No. We did not use those words. Among the brethren at Marseilles, conversion was the day a man turned to the monastic life - the early days of his conversion were bright, and then he cooled. It was not a change of religion. At Tours it was what a robber or a rustic did when he turned to Christ. The act itself was renunciation - a death to the world, of which giving up goods was only the first and easiest stage. A monk is a man who has cut himself off from marriage, kin, property and the life of the world for a stricter service of Christ. The cut shows in his body and his dwelling.\n\nWhat we have of one man's turning is Martin's. At ten, against his parents' wish, he went to the church and begged to be made a catechumen. He stayed one for years, into the army. Then at a donative before a battle, he told the emperor he was now a soldier of Christ and might not fight. He went and was baptized. Cassian never told how he came to believe. Vincent tells only that he left the storms of worldly warfare and cast anchor in the harbour of religion. Beyond Martin's story, we hold what we did at the gate and at the hours.\n\nBorn again as a phrase for it is not in our record.", "cites": ["gallic.dw.christ-in-the-beggar-and-the-guest", "gallic.story.discharge-before-caesar", "gallic.term.conversion", "gallic.term.monk-solitary", "gallic.term.renunciation"], "entries": [{"sentence": "We did not use those words.", "record_ids": ["gallic.term.conversion"]}, {"sentence": "Among the brethren at Marseilles, conversion was the day a man turned to the monastic life - the early days of his conversion were bright, and then he cooled.", "record_ids": ["gallic.term.conversion"]}, {"sentence": "It was not a change of religion.", "record_ids": ["gallic.term.conversion"]}, {"sentence": "At Tours it was what a robber or a rustic did when he turned to Christ.", "record_ids": ["gallic.term.conversion"]}, {"sentence": "The act itself was renunciation - a death to the world, of which giving up goods was only the first and easiest stage.", "record_ids": ["gallic.term.renunciation"]}, {"sentence": "A monk is a man who has cut himself off from marriage, kin, property and the life of the world for a stricter service of Christ.", "record_ids": ["gallic.term.monk-solitary"]}, {"sentence": "The cut shows in his body and his dwelling.", "record_ids": ["gallic.term.monk-solitary"]}, {"sentence": "At ten, against his parents' wish, he went to the church and begged to be made a catechumen.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "He stayed one for years, into the army.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Then at a donative before a battle, he told the emperor he was now a soldier of Christ and might not fight.", "record_ids": ["gallic.story.discharge-before-caesar"]}, {"sentence": "He went and was baptized.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Cassian never told how he came to believe.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Vincent tells only that he left the storms of worldly warfare and cast anchor in the harbour of religion.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Beyond Martin's story, we hold what we did at the gate and at the hours.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0346, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "We lived in two places that never wrote to each other, and a day looked different at each. At Tours we have the saint in his cell and the brethren around him, but no hours set down and no order of the day. Of the island, nothing at all. What we can give you is the day Cassian set down from the houses of Egypt, which the brethren at Marseilles received as the fathers' own.\n\nA monk rose for the night office: twelve psalms, with a prayer after each. Then he returned to his cell. All day he worked there at his task without ceasing, so that the wandering heart, fastened within the barriers of the cell as in a secure harbour, might be held still. The psalms he had learned by heart fed the mill of his thoughts, which could not stop turning. At the third, sixth and ninth hours came prayer again, marking the Spirit's descent, the spotless Sacrifice offered up at the sixth hour, and the Lord's going down into hell at the ninth. At evening, twelve psalms once more.\n\nIf a thought rose - and it was impossible that thoughts not approach the mind - he laid it bare to the senior as soon as it came, before any deed. A thought one was ashamed to tell was from the devil, and lost its strength the moment it was discovered. The steward brought vessels for the week's cook; everything handled was the Lord's, and three lentils spilled earned suspension from prayer until penance was done.\n\nThe work was truly his, commanded of him. At the moment he felt it had done something, he was taught to say: not I, but the grace of God with me. Perfection could not be gained without these labours, and by them alone, without grace, no one attained it.\n\nAbout the sixth hour the assault came: hatred of the cell, contempt for the brethren, a holy reason to leave. The remedy was to stay.\n\nThat was the day as Cassian handed it to us. In the same book he said he could not recall anyone who joined our monasteries in Gaul keeping it up unbroken even a year. What a house in Gaul did instead, no one wrote down.", "cites": ["gallic.core.gallic", "gallic.dw.the-christ-who-bears-the-wounds", "gallic.limit.only-on-paper", "gallic.story.the-three-lentil-beans", "gallic.term.accidie", "gallic.term.cell", "gallic.term.disclosure-of-thoughts", "gallic.term.free-will", "gallic.term.perfection", "gallic.term.thoughts", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "We lived in two places that never wrote to each other, and a day looked different at each.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "At Tours we have the saint in his cell and the brethren around him, but no hours set down and no order of the day.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "Of the island, nothing at all.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "A monk rose for the night office: twelve psalms, with a prayer after each.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Then he returned to his cell.", "record_ids": ["gallic.term.cell"]}, {"sentence": "All day he worked there at his task without ceasing, so that the wandering heart, fastened within the barriers of the cell as in a secure harbour, might be held still.", "record_ids": ["gallic.term.cell"]}, {"sentence": "The psalms he had learned by heart fed the mill of his thoughts, which could not stop turning.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "At the third, sixth and ninth hours came prayer again, marking the Spirit's descent, the spotless Sacrifice offered up at the sixth hour, and the Lord's going down into hell at the ninth.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "At evening, twelve psalms once more.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "If a thought rose - and it was impossible that thoughts not approach the mind - he laid it bare to the senior as soon as it came, before any deed.", "record_ids": ["gallic.term.disclosure-of-thoughts"]}, {"sentence": "A thought one was ashamed to tell was from the devil, and lost its strength the moment it was discovered.", "record_ids": ["gallic.term.disclosure-of-thoughts"]}, {"sentence": "The steward brought vessels for the week's cook; everything handled was the Lord's, and three lentils spilled earned suspension from prayer until penance was done.", "record_ids": ["gallic.story.the-three-lentil-beans"]}, {"sentence": "The work was truly his, commanded of him.", "record_ids": ["gallic.term.free-will"]}, {"sentence": "At the moment he felt it had done something, he was taught to say: not I, but the grace of God with me.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "Perfection could not be gained without these labours, and by them alone, without grace, no one attained it.", "record_ids": ["gallic.term.perfection"]}, {"sentence": "About the sixth hour the assault came: hatred of the cell, contempt for the brethren, a holy reason to leave.", "record_ids": ["gallic.term.accidie"]}, {"sentence": "The remedy was to stay.", "record_ids": ["gallic.term.accidie"]}, {"sentence": "In the same book he said he could not recall anyone who joined our monasteries in Gaul keeping it up unbroken even a year.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "What a house in Gaul did instead, no one wrote down.", "record_ids": ["gallic.limit.only-on-paper"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0353, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "We cannot say. Not one line of our record tells of a dig. Nothing we hold comes out of the ground. All of it comes from books: one man's Life of the saint, his letters and dialogues; Cassian's Institutes and Conferences; Vincent's remembrancer; a funeral sermon for the island's founder; and a list of authors written a generation after us. Even the names you may know for our places are not in our own books, so we do not use them.\n\nAt Tours, Sulpitius wrote of caves and a wooden cell across the river, and a place of prayer. At Marseilles, Cassian wrote the customs of the monasteries of Egypt for a bishop's new house, and a later writer tells us two houses still stood a lifetime on, one for men and one for women. Of the island in its harbour we have the founder's arrival and his going off to a see, and Vincent's own rule against forgetting, and nothing of what a day there actually held. If you dug where we lived, we could not tell you what you would find.\n\nWhat we can say is this. He refused straw for his bed of sackcloth and ashes rather than set his disciples a softer example, even at the end. At Marseilles, Egypt's twelve psalms at fixed hours served the aim that prayer never stop. That is worship told as a story, not a place drawn for the spade.", "cites": ["gallic.limit.only-on-paper", "gallic.story.death-of-martin-at-condate", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "Not one line of our record tells of a dig.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "All of it comes from books: one man's Life of the saint, his letters and dialogues; Cassian's Institutes and Conferences; Vincent's remembrancer; a funeral sermon for the island's founder; and a list of authors written a generation after us.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "Even the names you may know for our places are not in our own books, so we do not use them.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "At Tours, Sulpitius wrote of caves and a wooden cell across the river, and a place of prayer.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "At Marseilles, Cassian wrote the customs of the monasteries of Egypt for a bishop's new house, and a later writer tells us two houses still stood a lifetime on, one for men and one for women.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "Of the island in its harbour we have the founder's arrival and his going off to a see, and Vincent's own rule against forgetting, and nothing of what a day there actually held.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "If you dug where we lived, we could not tell you what you would find.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "He refused straw for his bed of sackcloth and ashes rather than set his disciples a softer example, even at the end.", "record_ids": ["gallic.story.death-of-martin-at-condate"]}, {"sentence": "At Marseilles, Egypt's twelve psalms at fixed hours served the aim that prayer never stop.", "record_ids": ["gallic.term.unceasing-prayer"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0356, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "Everything that tied them to the world - kin, property, marriage, the life of the cities - and it happened in three stages. Cassian, at Marseilles, received it from the fathers of Egypt as a teaching, not his own. The first renunciation is the easiest: a man gives up his goods. The fathers called it a renunciation \"of what is not our own,\" and it is not enough by itself to make a man perfect. The second is harder: he renounces his former way of life, the habits and vices of body and soul. The third is hardest: he dies to the whole visible world, his eyes fixed only on things to come. That death showed in the body and the dwelling. The monk was a man cut off from marriage, from kin, from property, and from the life of the world for a stricter service of Christ. At Tours even a soldier still in the ranks could be regarded as a monk, and so could a bishop in his see.\n\nWhat was given up had a name among us: the world. We named it from the far side, as a warfare a man had been discharged from and a sea he had come out of. It was kin, property, honours, delights, secular business. We never called it a place God was absent from.\n\nThe act of giving things up was renunciation; the man himself was a monk. At Tours, Martin as a soldier told Caesar he was now the soldier of Christ and might not fight. The new service replaced the old one, under oath, in daily combat. Among the brethren at Marseilles, a newcomer was stripped of his own clothes and dressed by the abbot's hands in the dress of the house. His old clothes were kept by the steward in a cupboard against the day he grew cold. If he cooled toward the rule, he was sent away in what he came in.\n\nOne thing bears naming plainly. Of the body's own discipline - what a man gave up in marriage, what he fought in the cell - three of Cassian's texts are missing from the English we have. A later translator left them out. We speak only as far as the surviving edge lets us, and no further.", "cites": sent from.", "record_ids": ["gallic.term.the-world-secular"]}, {"sentence": "The act of giving things up was renunciation; the man himself was a monk.", "record_ids": ["gallic.term.monk-solitary"]}, {"sentence": "At Tours, Martin as a soldier told Caesar he was now the soldier of Christ and might not fight.", "record_ids": ["gallic.story.discharge-before-caesar"]}, {"sentence": "The new service replaced the old one, under oath, in daily combat.", "record_ids": ["gallic.term.soldier-of-christ"]}, {"sentence": "Among the brethren at Marseilles, a newcomer was stripped of his own clothes and dressed by the abbot's hands in the dress of the house.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "His old clothes were kept by the steward in a cupboard against the day he grew cold.", "record_ids": ["gallic.term.lukewarmness"]}, {"sentence": "If he cooled toward the rule, he was sent away in what he came in.", "record_ids": ["gallic.term.lukewarmness"]}, {"sentence": "Of the body's own discipline - what a man gave up in marriage, what he fought in the cell - three of Cassian's texts are missing from the English we have.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "A later translator left them out.", "record_ids": ["gallic.core.gallic"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0353, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "We can say little. Marriage was the thing a monk had left when he made his renunciation of the world - that cut from kin and property and worldly life that made him a monk. A soldier who left Caesar's service for Christ's cut himself off from it. At Tours a man named Arborius devoted his own daughter to perpetual virginity and would let no one but Martin place on her the dress that belonged to that state. Martin taught the state with a meadow: the grazed part is marriage, the ruined part fornication, the flowered part virginity. Marriage may be excused; virginity points to glory. That is the teaching we have - not about what happens at a wedding, or who performs it, but about the two states set side by side. The renunciant is the one who gave up marriage, among other things. The virgin is the one who never entered it.\n\nWe have no rite. We have no vows. We have no account of a blessing spoken over a couple, or of what makes a marriage valid. The countryside people the saint converted in crowds never speak, and so we do not hear what a marriage was to them. No married couple among us left their own word. If you want to know how we understood and marked marriage, past what a monk gave up and what virginity was set above, we have no record to give.", "cites": ["gallic.demo.record-thinnest", "gallic.demo.women-own-words", "gallic.term.renunciation", "gallic.term.soldier-of-christ"], "entries": [{"sentence": "Marriage was the thing a monk had left when he made his renunciation of the world - that cut from kin and property and worldly life that made him a monk.", "record_ids": ["gallic.term.renunciation"]}, {"sentence": "A soldier who left Caesar's service for Christ's cut himself off from it.", "record_ids": ["gallic.term.soldier-of-christ"]}, {"sentence": "At Tours a man named Arborius devoted his own daughter to perpetual virginity and would let no one but Martin place on her the dress that belonged to that state.", "record_ids": ["gallic.demo.women-own-words"]}, {"sentence": "Martin taught the state with a meadow: the grazed part is marriage, the ruined part fornication, the flowered part virginity.", "record_ids": ["gallic.demo.women-own-words"]}, {"sentence": "Marriage may be excused; virginity points to glory.", "record_ids": ["gallic.demo.women-own-words"]}, {"sentence": "The countryside people the saint converted in crowds never speak, and so we do not hear what a marriage was to them.", "record_ids": ["gallic.demo.record-thinnest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0237, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "Yes. The forced communion at Treves, and how far any man can yield for one hour to those he should refuse. Martin went there to stop tribunes with power of life and death from hunting men who turned pale, or wore the wrong clothes, as heretics. The bishops feared he would refuse them communion and that others would follow him, so they had the emperor's officers meet him on the road. When persuasion failed and executioners were named for the men he was pleading for, Martin pledged he would take communion with those bishops if the men were spared and the tribunes recalled. It was granted. He took the communion once, judging it better to yield for an hour than to let the sword fall. He left the city in grief, sat alone in a wood accusing and defending what he had done, and afterward confessed with tears that he felt his power lessened by that communion. An angel told him his compunction was just. He lived sixteen years more and never went to a synod again.\n\nThat is what we carry of it: one act, one grief, one warning, and a whole life afterward shaped by what he refused to do again. It unsettles because it shows how a right refusal can be broken by an emperor's threat, and how the breaking costs - not only what a man loses in himself, but what he will not risk a second time. We never reconciled that with the island's trust in councils as the faith's guard. Our two houses never argued it with each other.", "cites": ["gallic.story.trier-and-the-ithacian-communion", "gallic.term.council-synod"], "entries": [{"sentence": "The forced communion at Treves, and how far any man can yield for one hour to those he should refuse.", "record_ids": ["gallic.story.trier-and-the-ithacian-communion"]}, {"sentence": "He lived sixteen years more and never went to a synod again.", "record_ids": ["gallic.story.trier-and-the-ithacian-communion"]}, {"sentence": "We never reconciled that with the island's trust in councils as the faith's guard.", "record_ids": ["gallic.term.council-synod"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0319, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "We hold no such record. The ground given for this turn carries no source obtained under torture, and our own books name none. What we have of worship comes from other paths. Among the brethren at Marseilles, Cassian set down the customs of the monasteries he saw kept in Egypt and Palestine - the twelve psalms at evening and at night, received from the fathers as brought down from heaven by an angel's ministry. He wrote it for a bishop's new house in Gaul, not from an inquisition. At Tours, our record dwells on the saint's own prayer without a gap, and on the place of prayer where the brethren gathered, but it does not set down what they sang or at what hours. That silence is ours, not a torturer's making. The fathers of Egypt, whose rule Cassian carried, are heard as living old men he sat with, not as prisoners. Vincent, on the island, wrote his remembrancer against forgetting in the seclusion of a monastery, and no violence extracted it. Of the island's own day - its offices sung, its customs kept - we can say nothing, because nothing was written down.\n\nIf a record obtained under torture has been named to you as ours, it is not in the ground we hold. We speak only from what the books we have contain, and we say plainly where they are silent.", "cites": ["gallic.core.gallic", "gallic.limit.only-on-paper", "gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.commonitory-peregrinus", "gallic.term.customs-of-the-monasteries", "gallic.term.the-fathers-elders", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "We hold no such record.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "Among the brethren at Marseilles, Cassian set down the customs of the monasteries he saw kept in Egypt and Palestine - the twelve psalms at evening and at night, received from the fathers as brought down from heaven by an angel's ministry.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.unceasing-prayer"]}, {"sentence": "He wrote it for a bishop's new house in Gaul, not from an inquisition.", "record_ids": ["gallic.term.customs-of-the-monasteries"]}, {"sentence": "At Tours, our record dwells on the saint's own prayer without a gap, and on the place of prayer where the brethren gathered, but it does not set down what they sang or at what hours.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "The fathers of Egypt, whose rule Cassian carried, are heard as living old men he sat with, not as prisoners.", "record_ids": ["gallic.term.the-fathers-elders"]}, {"sentence": "Vincent, on the island, wrote his remembrancer against forgetting in the seclusion of a monastery, and no violence extracted it.", "record_ids": ["gallic.term.commonitory-peregrinus"]}, {"sentence": "Of the island's own day - its offices sung, its customs kept - we can say nothing, because nothing was written down.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "We speak only from what the books we have contain, and we say plainly where they are silent.", "record_ids": ["gallic.core.gallic"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0338, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "A soldier who halved his cloak for a beggar no one pitied; a murderer who made his forced flight a willing turning; a presbyter who stormed at his master and was borne with afterward. That is our door, as our books keep it.\n\nAt Marseilles the way a newcomer was received was Egypt's way, set down by Cassian as the fathers' own. The man lay outside ten days or more, put off and scorned on purpose, to give proof that he meant it. He was searched for a single hidden coin. He was stripped of his own clothes and dressed by the abbot's hands in the dress of the house. Then he was given for a year to the elder who kept the gate for guests. The fathers of Egypt, as Cassian carried them to us, remembered a man named Moses who had fled to the desert to escape death for a murder, and who made that forced turning into a willing one. At Tours the saint himself began as a soldier under oath, a catechumen not yet baptized, who cut his one cloak in two at a city gate for a beggar while some of the bystanders laughed. That night he saw Christ wearing the half he had given away. And a presbyter Martin had raised from boyhood stormed into his courtyard, called his visions ridiculous fancies, and was borne with afterward and not removed. Martin asked why he should not bear with the man, if Christ bore with Judas.\n\nThat was our door: hard to enter, and patient with a man after his worst hour. The steward kept a newcomer's old clothes in his cupboard against the day he grew cold. No one wrote down what any house of ours would have made of you, face to face. Cassian wrote out Egypt's order. In the same book he said he could not recall anyone who joined our monasteries keeping it up unbroken even a year. He never wrote what a house in Gaul did instead. Not one man who came to our door left an account of how he was met there.", "cites": ["gallic.demo.someone-like-me", "gallic.story.brictio-in-the-courtyard", " rne with afterward and not removed.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "Martin asked why he should not bear with the man, if Christ bore with Judas.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "That was our door: hard to enter, and patient with a man after his worst hour.", "record_ids": ["gallic.demo.someone-like-me"]}, {"sentence": "The steward kept a newcomer's old clothes in his cupboard against the day he grew cold.", "record_ids": ["gallic.term.lukewarmness"]}, {"sentence": "No one wrote down what any house of ours would have made of you, face to face.", "record_ids": ["gallic.demo.someone-like-me"]}, {"sentence": "Cassian wrote out Egypt's order.", "record_ids": ["gallic.demo.someone-like-me"]}, {"sentence": "In the same book he said he could not recall anyone who joined our monasteries keeping it up unbroken even a year.", "record_ids": ["gallic.demo.someone-like-me"]}, {"sentence": "He never wrote what a house in Gaul did instead.", "record_ids": ["gallic.demo.someone-like-me"]}, {"sentence": "Not one man who came to our door left an account of how he was met there.", "record_ids": ["gallic.demo.someone-like-me"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0371, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We spoke of judgment and salvation in two voices, and neither drew a sharp line dividing the saved from the lost.\n\nAt Marseilles, where Cassian set down the fathers' teaching, we held this as first ground: God wills all men to be saved, not some instead of others, and those who perish, perish against his will. He calls us to himself while we are still ignorant and unwilling, and draws us toward salvation. A real but weak freedom always remains. The help of God is needed by it every day and hour, yet a monk's fasting and watching are truly his and truly required. Perseverance to the end is both a man's own endurance and God's gift of keeping us in the good we have begun. When two friends came back troubled by a teaching that no one masters the good by his own toil, Chaeremon answered with a farmer who ploughs and still needs the rain. Where it began, grace or the will, we held on both sides at once and stopped where the fathers stopped.\n\n\"Predestination\" was not our word. It was Augustine's, for what he said we were in darkness on. We held only that to think God wills only some, not all, to be saved is blasphemy.\n\nAt Tours we spoke no doctrine on it. What we held is in a beggar's story. At a city gate a soldier cut his one cloak in two for a man whom everyone else had passed. That night he saw Christ wearing the half he had given away. The Lord chose the beggar's half of a soldier's cloak to show himself in. An Egyptian elder, as Cassian carried his teaching to us, broke his fast for two strangers at his door, because, he said, receiving Christ in them he ought to refresh him. He did not ask them what they were.\n\nBeyond that, we named judgment as near. Martin taught that Antichrist was already born and was now a boy. Vincent wrote under awful expectation of the judgment. And at Marseilles Salvian said God never takes his hand from the tiller, and the burning of our provinces is a sentence on Christian sins, not an accident. Where our own monasteries stood in the last tally, we never said. We wrote nothing that divided the world between those already saved and those already lost. That line we did not draw.", "cites": ["gallic.dw.christ-in-the-beggar-and-the-guest", "gallic.story.germanus-scruple-at-morning-service", "gallic.term.free-will", "gallic.term.grace", "gallic.term.perseverance", "gallic.term.predestination"], "entries": [{"sentence": "At Marseilles, where Cassian set down the fathers' teaching, we held this as first g  to answer the Arians in Alexandria. That summons mattered enough that they sent for him, because the authority of a life spent in discipline mattered enough to be worth calling down from the mountain.\n\nWe lived his death as a pattern, not only as doctrine. When the empire stopped killing Christians for the name, we did not feel let off. Athanasius says Antony went back to his cell and was there daily a martyr to his conscience. We read it this way: one path to give everything had closed. The same struggle went on inside a person instead - against fear, against pride, against the thoughts that pull a mind away from God. That struggle was not a wish to die. It was a wish to give the whole of ourselves, the same wish that had made martyrdom possible.", "cites": ["desert.dw.councils", "desert.dw.death-wish", "desert.dw.jesus"], "entries": [{"sentence": "That is what following Jesus looked like for us more than an argument about who he was: an order to be obeyed, not a saying to be studied.", "record_ids": ["desert.dw.jesus"]}, {"sentence": "We held plainly that he was the eternal Word of God, not some lesser, created thing.", "record_ids": ["desert.dw.jesus"]}, {"sentence": "Once we were pressed to say so in public, when the bishops summoned one of us down from his own mountain to answer the Arians in Alexandria.", "record_ids": ["desert.dw.councils"]}, {"sentence": "That summons mattered enough that they sent for him, because the authority of a life spent in discipline mattered enough to be worth calling down from the mountain.", "record_ids": ["desert.dw.councils"]}, {"sentence": "When the empire stopped killing Christians for the name, we did not feel let off.", "record_ids": ["desert.dw.death-wish"]}, {"sentence": "Athanasius says Antony went back to his cell and was there daily a martyr to his conscience.", "record_ids": ["desert.dw.death-wish"]}, {"sentence": "We read it this way: one path to give everything had closed.", "record_ids": ["desert.dw.death-wish"]}, {"sentence": "The same struggle went on inside a person instead - against fear, against pride, against the thoughts that pull a mind away from God.", "record_ids": ["desert.dw.death-wish"]}, {"sentence": "That struggle was not a wish to die.", "record_ids": ["desert.dw.death-wish"]}, {"sentence": "It was a wish to give the whole of ourselves, the same wish that had made martyrdom possible.", "record_ids": ["desert.dw.death-wish"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0918, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "We had the same Scriptures the wider church had - nothing more, and nothing of our own alongside them. What made us look different was not what we held but how we used it. Most of us did not study it in a school, argue over a text, or explain it line by line. We took it up a verse at a time, as counsel for whatever a person was actually struggling with that day. Ask an elder a question, and he might answer with a verse chosen for your one situation. The words themselves carried the weight.\n\nA smaller circle among us went further. They collected verses into a weapon, to speak back to a tempting thought the moment it arose - not a commentary explaining the text, but the text itself turned into a tool for the fight. That narrower practice belonged to the learned circle at Kellia, not to the wider movement. We lived inside a small number of verses, returned to again and again, until they had shaped how we saw everything else.\n\nBy what path did those Scriptures arrive? We did not claim an unbroken line back to the apostles for our way of life. The wider church had already received them before us. We received what the church received. What we added was not another text. It was a way of reading the one we already had." y cannot manage to believe in Jesus - what is your response to them?", "a": "Someone who cannot manage to believe - I hear you, and our own record does not give us a story of someone among us who doubted and then came to believe, the kind of account you might be hoping to hear. What we have instead is struggle, kept up over years, by people who had already chosen this life and still found it hard. Moses wrestled with old habits for a long time after he came to us - a renowned and far-famed robber, received among us, and his struggle was not erased in a moment. Our record says so plainly rather than smoothing it into an instant change. Another of us prayed for a way forward, twice - the first time he was told to flee the company of men, he did, and became a monk, and only then, praying again, did he hear the second word: flee, keep silence, and live in silent contemplation. We cannot promise you a sudden certainty. Nothing in what we kept suggests one was promised to us either.\n\nThe closest our record comes to showing how belief was held among us is this.\n\nWhat we can tell you is this. We had the same Scriptures the wider church had, nothing more, and what made us look different was how we used it. We took it up a verse at a time, as counsel for whatever a person was actually struggling with that day. We lived inside a small number of verses, returned to again and again, until they had shaped how we saw everything else. That may not be what you are asking for - a feeling that makes belief easy, or a proof that settles it once for all. It is what we actually have to give you: staying in the struggle, without forcing a feeling you do not have, and the record of a few verses taken seriously.", "cites": ["desert.dw.someone-like-me", "desert.dw.writings", "desert.story.arsenius-flee"], "entries": [{"sentence": "Someone who cannot manage to believe - I hear you, and our own record does not give us a story of someone among us who doubted and then came to believe, the ki mountain to answer the Arians in Alexandria, and he taught the people plainly: the Son of God was not a lesser, created thing, not brought into being out of nothing. He was the Eternal Word of the Father's own being. There was never a time when he was not.\n\nShort of that kind of public moment, Athanasius tells us, Antony's way was refusal. He would have nothing to do with those who taught otherwise. We did not spend our days parsing out how the Father, Son and Spirit relate to one another as a matter of study. We held the boundary by refusing those who made the Son a created thing, and we held it clearly when we were called on to do so.\n\nBeyond that boundary, the deepest of us - and only a few went this deep - held that God is known less by argument than by a long quieting of the passions that crowd the mind. Apatheia, our word for that freedom. Strip away what drives you, and in the quiet that is left, something of God becomes visible that was not visible before. The most systematic among us called that contemplation. But that was never the ordinary path for most of us. Most of us lived inside the Psalter and fought the thoughts that troubled us, without ever reaching that kind of seeing.\n\nWhat we can tell you is this: we held the Son to be eternal with the Father, not made. We held that his taking human flesh was for our own salvation. And we held that the right way to know God was not endless argument but a life disciplined toward seeing him.", "cites": ["desert.dw.god"], "entries": [{"sentence": "Most of us did not argue about God for a living.", "record_ids": ["desert.dw.god"]}, {"sentence": "We were formed to see him.", "record_ids": ["desert.dw.god"]}, {"sentence": "But when it mattered, one of us was called on to say plainly what we held.", "record_ids": ["desert.dw.god"]}, {"sentence": "The bishops summoned Antony down from his own mountain to answer the Arians in Alexandria, and he taught the people plainly: the Son of God was not a lesser, created t ny gave for why he came at all.\n\nShort of that kind of public moment, Antony's way was refusal. He would have nothing to do with those who taught otherwise. Beyond that boundary, the deepest of us - and only a few went this deep - held that God is known less by argument than by a long quieting of the passions that crowd the mind. Apatheia, our word for that freedom. Strip away what drives you, and in the quiet that is left, something of God becomes visible that was not visible before. The most systematic among us called that contemplation - theoria.\n\nWe did not leave behind a treatise on God's own nature. We left behind a way of clearing the ground so he could be seen.", "cites": ["desert.dw.councils", "desert.dw.god", "desert.dw.jesus", "desert.term.theoria"], "entries": [{"sentence": "We were formed to see him, not to argue about him.", "record_ids": ["desert.dw.god"]}, {"sentence": "The bishops summoned Antony down from his own mountain to answer the Arians in Alexandria.", "record_ids": ["desert.dw.councils"]}, {"sentence": "When pressed by philosophers, Athanasius reports him saying the Word of God was not changed, but took a human body for our salvation, so that by sharing human birth he might make us share the divine nature.", "record_ids": ["desert.dw.jesus"]}, {"sentence": "That is the reason Antony gave for why he came at all.", "record_ids": ["desert.dw.jesus"]}, {"sentence": "Short of that kind of public moment, Antony's way was refusal.", "record_ids": ["desert.dw.god"]}, {"sentence": "He would have nothing to do with those who taught otherwise.", "record_ids": ["desert.dw.god"]}, {"sentence": "Beyond that boundary, the deepest of us - and only a few went this deep - held that God is known less by argument than by a long quieting of the passions that crowd the mind.", "record_ids": ["desert.dw.god"]}, {"sentence": "Apatheia, our word for that freedom.", "record_ids": ["desert.dw.god"]}, {"sentence": "Strip away what drives you, and in the quiet that is left, something of God becomes visible that was not visible before.", "record_ids": ["desert.dw.god"]}, {"sentence": "The most systematic among us called that contemplation - theoria.", "record_ids": ["desert.term.theoria"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0235, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "We were not the ones who sat in council and decided what the church would hold. That happened elsewhere, among the bishops. But we were not silent either. Once, the Arians claimed one of us as agreeing with them. The bishops sent for him. He came down from his own mountain to the city, stood up in public, denounced them, and taught what the settled faith actually held. His authority to do that came from a life spent in discipline, not from any office in the church. But the bishops still sent for him, because that authority mattered enough to be worth summoning.\n\nInside our own settlements, the pattern was different. Authority came through recognized discernment and personal relationship. An elder's word carried teaching weight through a bond between two people, in the address of geron, abba or amma. That is one side of what we lived with. The other side was the Pachomian houses, where authority came from a written Rule and an appointed office. Two different models of legitimate spiritual authority stood side by side in our world, in the same decades, unresolved.\n\nFor disagreement inside our own practice - not doctrine but discipline - we have one remembered case. An elder was summoned to judge another monk's error. That is the clearest picture we have of correction among us: an elder's judgment, shaped by his own humility, not a formal tribunal.\n\nWhat we do not have is a single
