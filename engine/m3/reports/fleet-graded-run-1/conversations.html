ame with the Rule, held by anyone appointed to it, regardless of who he was underneath. Both existed among us at once, in the same decades, and neither one gave way to the other. Even the man who founded the office-based way among us is remembered partly in the older, personal terms: a father whose own example, not just his Rule, formed his community. We lived with both models unresolved. No one among us ever solved it.\n\nWhat also unsettled us was how much our talk of withdrawal did not match how we actually lived. We spoke of leaving the world entirely - anachoresis, our word for it, meant far more than a change of address. But the settlements sat on land that was marginal, not remote. We had real economic ties to villages, through labor, the sale of goods, and almsgiving. The evidence for this comes from two independent sources: the excavated remains at Kellia and the documents of another ascetic community's business archive. We cannot pretend the gap away. The rhetoric claimed one thing; how people actually lived was another.", "cites": ["desert.dw.never-settled", "desert.gravity.authority-tension", "desert.gravity.economic-embeddedness", "desert.term.anachoresis"], "entries": [{"sentence": "We never settled who really carried authority.", "record_ids": ["desert.gravity.authority-tension"]}, {"sentence": "One view gave it to a man who had earned it through his own discipline and a lifetime of discernment.", "record_ids": ["desert.dw.never-settled"]}, {"sentence": "The other gave it to an office that came with the Rule, held by anyone appointed to it, regardless of who he was underneath.", "record_ids": ["desert.dw.never-settled"]}, {"sentence": "Both existed among us at once, in the same decades, and neither one gave way to the other.", "record_ids": ["desert.dw.never-settled"]}, {"sentence": "Even the man who founded the office-based way among us is remembered partly in the older, personal terms: a father whose own example, not just his Rule, formed his community.", "record_ids": ["desert.dw.never-settled"]}, {"sentence": "We lived with both models unresolved.", "record_ids": ["desert.dw.never-settled"]}, {"sentence": "No one among us ever solved it.", "record_ids": ["desert.dw.never-settled"]}, {"sentence": "What also unsettled us was how much our talk of withdrawal did not match how we actually lived.", "record_ids": ["desert.gravity.economic-embeddedness"]}, {"sentence": "We spoke of leaving the world entirely - anachoresis, our word for it, meant far more than a change of address.", "record_ids": ["desert.term.anachoresis"]}, {"sentence": "But the settlements sat on land that was marginal, not remote.", "record_ids": ["desert.gravity.economic-embeddedness"]}, {"sentence": "We had real economic ties to villages, through labor, the sale of goods, and almsgiving.", "record_ids": ["desert.gravity.economic-embeddedness"]}, {"sentence": "The evidence for this comes from two independent sources: the excavated remains at Kellia and the documents of another ascetic community's business archive.", "record_ids": ["desert.gravity.economic-embeddedness"]}, {"sentence": "The rhetoric claimed one thing; how people actually lived was another.", "record_ids": ["desert.gravity.economic-embeddedness"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.023, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "We cannot say that any key outside record of our worship was obtained under torture, because no ground given for this turn names such a record or such an event. What we can tell you is what thin ground we actually stand on where worship is concerned.\n\nThe structure of our gathering is better attested than what was actually prayed in it. We know the semi-solitary settlements had a weekly Saturday-to-Sunday synaxis - the gathering of monks who lived alone all week, for vigil, worship, and a shared meal. We know the Pachomian houses had a daily rhythm instead. But specific liturgical content beyond the Psalter and the Lord's Prayer remains thin as eyewitness testimony [[thin:liturgy]]. One later voice, Cassian writing in Gaul, does supply specific content - a fixed twelve Psalms and a no-kneeling posture rule - but as his own claim to pan-Egyptian uniformity, not a second Nitria or Kellia eyewitness alongside Palladius [[thin:liturgy]]. It is genuine content. It is not independently confirmed for the settlements his Institutes does not name.\n\nIf the question you are asking is about a torture record from outside our world entirely, or from a world close enough to be confused with ours, we cannot answer it - nothing in this turn's ground names such a record, and we will not reach past what we are given to assert what happened to a source we cannot identify.", "cites": ["desert.term.synaxis"], "entries": [{"sentence": "We cannot say that any key outside record of our worship was obtained under torture, because no ground given for this turn names such a record or such an event.", "record_ids": ["desert.term.synaxis"]}, {"sentence": "We know the semi-solitary settlements had a weekly Saturday-to-Sunday synaxis - the gathering of monks who lived alone all week, for vigil, worship, and a shared meal.", "record_ids": ["desert.term.synaxis"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0235, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "I am a representative of the desert communities, not here to judge you - only to tell you what we held. But I cannot answer this as you have put it, because you have not told me who the person is. Someone with a past they were ashamed of had a place among us. We remember Moses, who had been a robber and, by report, a murderer before he came to us - a renowned and far-famed robber. He was received, and in time he became one of the most trusted and honored among us. His struggle with his old habits was long and real, not erased in a moment. But he was not turned away for what he had been. We also remember Paul, an old man, simple and without guile. He was thought too old for this life and refused at the door at first. He was received all the same, tested, and found to have a perfect soul.\n\nOur record does not tell us how any one of our own settlements would have met any one person specifically; nothing we kept answers that directly for any individual case. What we can tell you is this. In the two cases we remember, a shameful past, or nothing special to recommend a person, did not keep that person out. If you want to ask us about something more particular - a specific situation, or what we held about a specific question - we can tell you whether our record speaks to that or stays silent.", "cites": ["desert.dw.someone-like-me"], "entries": [{"sentence": "We remember Moses, who had been a robber and, by report, a murderer before he came to us - a renowned and far-famed robber.", "record_ids": ["desert.dw.someone-like-me"]}, {"sentence": "He was received, and in time he became one of the most trusted and honored among us.", "record_ids": ["desert.dw.someone-like-me"]}, {"sentence": "His struggle with his old habits was long and real, not erased in a moment.", "record_ids": ["desert.dw.someone-like-me"]}, {"sentence": "But he was not turned away for what he had been.", "record_ids": ["desert.dw.someone-like-me"]}, {"sentence": "We also remember Paul, an old man, simple and without guile.", "record_ids": ["desert.dw.someone-like-me"]}, {"sentence": "He was thought too old for this life and refused at the door at first.", "record_ids": ["desert.dw.someone-like-me"]}, {"sentence": "He was received all the same, tested, and found to have a perfect soul.", "record_ids": ["desert.dw.someone-like-me"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0249, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We said plainly that ours was the one true way. We never said, in so many words, what that meant for someone who never heard of it. One of us stood before visiting philosophers and answered their test: the faith of Christ alone is true religion, proven not by argument but by people who had put away lust and were not afraid to die, in a strength that did not exist in the world before Christ came. We asked them which was nobler: to confess the Cross, or to tell of their own gods' adultery and the seduction of boys. We did not go looking for that argument. It came to us, and when it came, we did not soften what we held.\n\nBut whether we thought people outside the faith were sent to hell for not believing - no saying and no story of ours says so in those words. We will not fill that silence with an answer we do not have.\n\nWhat we can tell you is how we held the boundary among ourselves. There was another community near us, holding to a different bishop after an old dispute, and we did not treat them as fellow ascetics. The one we remember as our founder never held communion with them, from the beginning to his dying instruction. In practice, that meant silence more than open conflict, at least in the writing we left. They are named only to be refused, never engaged as fellow participants. That silence may itself have been a judgment. So we held a line, and we held it strictly.", "cites": ["desert.dw.melitian-power", "desert.dw.only-true-religion", "desert.limit.outsiders-condemned"], "entries": [{"sentence": "We never said, in so many words, what e-body"]}, {"sentence": "A century of councils spent itself making those words exact, because everything hung on them.", "record_ids": ["ijc.gravity.precision-seeking"]}, {"sentence": "We also taught that the bread and cup became his Body and Blood, by the power of blessing that changes nature itself.", "record_ids": ["ijc.dw.bread-made-body"]}, {"sentence": "Ambrose said it plainly to the newly baptized: before the blessing of the heavenly words, another nature is spoken of; after the consecration, the Body is meant.", "record_ids": ["ijc.dw.bread-made-body"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0727, "prev": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": "Our scriptures, the faith we confessed at baptism, and the creed. Everything we had about Jesus came to us by inheritance. Nicaea met nearly three hundred years after Jesus, and what we had of him reached us through others. Our councils wrote the creed exactly so that the inheritance could not be lost or changed.\n\nChalcedon shows us doing it. When the judges asked the assembly to declare its faith, Rome's legate Paschasinus spoke first. He recited the whole chain out loud: the rule of faith was set out at Nicaea, confirmed at Constantinople, explained at Ephesus by Cyril, and shown in Leo's own writings. The assembled bishops then cried out together: so we all believe, so we were baptized, so we baptize.\n\nWe knew the resurrection happened the same way: through the apostles' testimony, carried in scripture and confession, received and held. We guarded the testimony we received, and could not add to it. We had no living memory of eyewitnesses. What reached us was their witness, transmitted through baptism and creed, generation to generation, jealously kept exact because it was all we had.", "cites": ["ijc.dw.received-not-seen"], "entries": [{"sentence": "Our scriptures, the faith we confessed at baptism, and the creed.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "Everything we had about Jesus came to us by inheritance.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "Nicaea met nearly three hundred years after Jesus, and what we had of him reached us through others.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "Our councils wrote the creed exactly so that the inheritance could not be lost or changed.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "Chalcedon shows us doing it.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "When the judges asked the assembly to declare its faith, Rome's legate Paschasinus spoke first.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "He recited the whole chain out loud: the rule of faith was set out at Nicaea, confirmed at Constantinople, explained at Ephesus by Cyril, and shown in Leo's own writings.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "The assembled bishops then cried out together: so we all believe, so we were baptized, so we baptize.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "We knew the resurrection happened the same way: through the apostles' testimony, carried in scripture and confession, received and held.", "record_ids": ["ijc.dw.received-not-seen"]}, {"sentence": "We guarded the testimony we received, and could not add to it.", "record_ids": ["ijc.dw.received-not-seen"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0169, "prev": null}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": "We hear you, and we will not rush an answer past that. Our record has the church's public words about Jesus - creeds, councils, letters between office-holders. It does not keep one ordinary heart's own struggle to believe. We cannot show you a voice like yours from inside it, wrestling as you are. Our record does not hold those pages, for you or for anyone before you.\n\nWhat we can tell you is what some of our own men went into exile rather than take back. The creed of Nicaea says he is very God of very God, of one being with the Father, who for us and for our salvation came down and was made man, suffered, and rose on the third day. A century of councils spent itself making those words exact, because everything hung on them. That is at least proof of how much it cost them to hold.\n\nAnd we can give you the nearest thing we have to an answer for someone not yet certain. At Christmas, Leo, our bishop of Rome, preached: \u201cLet the saint rejoice: he draws near to victory. Let the sinner be glad: he is invited to pardon. Let the gentile take courage: he is called to life.\u201d\n\nWe do not know if that reaches you where you are. We only know it was said without waiting for anyone's certainty first.", "cites": ["ijc.dw.jesus", "ijc.limit.jesus-to-you", "ijc.quote.leo-sinner-be-glad"], "entries": [{"sentence": "We hear you, and we will not rush an answer past that.", "record_ids": ["ijc.limit.jesus-to-you"]}, {"sentence": "Our record has the church's public words about Jesus - creeds, councils, letters between office-holders.", "record_ids": ["ijc.limit.jesus-to-you"]}, {"sentence": "It does not keep one ordinary heart's own struggle to believe.", "record_ids": ["ijc.limit.jesus-to-you"]}, {"sentence": "We cannot show you a voice like yours from inside it, wrestling as you are.", "record_ids": ["ijc.limit.jesus-to-you"]}, {"sentence": "Our record does not hold those pages, for you or for anyone before you.", "record_ids": ["ijc.limit.jesus-to-you"]}, {"sentence": "What we can tell you is what some of our own men went into exile rather than take back.", "record_ids": ["ijc.limit.jesus-to-you"]}, {"sentence": "The creed of Nicaea says he is very God of very God, of one being with the Father, who for us and for our salvation came down and was made man, suffered, and rose on the third day.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "A century of councils spent itself making those words exact, because everything hung on them.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "At Christmas, Leo, our bishop of Rome, preached: \u201cLet the saint rejoice: he draws near to victory. Let the sinner be glad: he is invited to pardon. Let the gentile take courage: he is called to life.\u201d", "record_ids": ["ijc.quote.leo-sinner-be-glad"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0186, "prev": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "To us, Jesus is truly God, of one being with the Father - homoousios - sharing the very being that makes the Father God.\n\nThe Father is God, the Son is God, the Spirit is God - yet we confess one God, not three. Constantinople in 381 confessed the Spirit's full divinity alongside the Father and the Son. Leo's letter to Chalcedon states the binding truth of it: Christ is true God and true man together, each nature doing what belongs to it. So one Mediator could die in one nature and not die in the other. He wrote that it was equally perilous to believe Christ only God without man, or only man without God.\n\nThis was not settled while it was happening. For two imperial reigns our own establishment confessed differently: the Son is like the Father, homoios, as the scriptures say, and refused to go further. That was the empire's own faith, enforced by law, and men who confessed of one substance were the ones removed and exiled. The exactness we reached cost real blood and real exile. A century of councils spent itself making those words exact, because everything hung on them.\n\nWe did not write devotional memoirs about Jesus. We wrote definitions, the way people write what they are prepared to be exiled over.", "cites": ["ijc.dw.jesus", "ijc.term.homoios", "ijc.term.homoousios"], "entries": [{"sentence": "To us, Jesus is truly God, of one being with the Father - homoousios - sharing the very being that makes the Father God.", "record_ids": ["ijc.term.homoousios"]}, {"sentence": "Leo's letter to Chalcedon states the binding truth of it: Christ is true God and true man together, each nature doing what belongs to it.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "So one Mediator could die in one nature and not die in the other.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "He wrote that it was equally perilous to believe Christ only God without man, or only man without God.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "For two imperial reigns our own establishment confessed differently: the Son is like the Father, homoios, as the scriptures say, and refused to go further.", "record_ids": ["ijc.term.homoios"]}, {"sentence": "That was the empire's own faith, enforced by law, and men who confessed of one substance were the ones removed and exiled.", "record_ids": ["ijc.term.homoios"]}, {"sentence": "A century of councils spent itself making those words exact, because everything hung on them.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "We did not write devotional memoirs about Jesus.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "We wrote definitions, the way people write what they are prepared to be exiled over.", "record_ids": ["ijc.dw.jesus"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0211, "prev": null}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": "To us, God is the one whose nature became the deepest argument we ever had, and whose oneness we fought to keep whole. We confessed one God, Father Almighty, maker of heaven and earth. But the question that split our century was how the Son stands to that one God - whether he shares the Father's very being, or only resembles it.\n\nWhat we did not write is what God feels like to pray to alone. Our record comes from men who wrote law and doctrine, and it does not tell us how any of them prayed alone. What we left you is definitions, argued at councils, written by men who were ready to be exiled over them. That is not because we thought God distant. It is because we thought getting the words right was that urgent. The oneness of God, and the full divinity of the Son, were not abstractions. They were the ground everything else stood on.", "cites": ["ijc.dw.jesus", "ijc.limit.inner-life"], "entries": [{"sentence": "To us, God is the one whose nature became the deepest argument we ever had, and whose oneness we fought to keep whole.", "record_ids": ["ijc.dw.jesus"]}, {"sentence": "What we did not write is what God feels like to pray to alone.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "Our record comes from men who wrote law and doctrine, and it does not tell us how any of them prayed alone.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "What we left you is definitions, argued at councils, written by men who were ready to be exiled over them.", "record_ids": ["ijc.dw.jesus"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0192, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "Where doctrine was contested, someone always claimed to settle it - the emperor, a gathered council, or Rome. But the question never stayed settled, because the same three claimants never stopped existing side by side. Every settlement was provisional, not because any one council's authority was doubted in principle at the time, but because the next dispute reopened the question of who gets to settle it. The pattern replayed at Nicaea, Constantinople, Ephesus, and Chalcedon.\n\nThe evidence that shows the process is the process's own instruments - council acts with dates and signatures, canons, imperial laws, and letters between named men about named disputes. A historian can cross-check those, and historians do.\n\nWhen the assembly was asked to declare its faith, Rome's legate Paschasinus spoke first. He recited the whole chain: the rule of faith set out at Nicaea, confirmed at Constantinople, explained at Ephesus by Cyril, and shown in Leo's own writings. The assembled bishops then cried out together: so we all believe, so we were baptized, so we baptize.\n\nBut that same council, before it broke up, granted Constantinople equal privileges with old Rome, and rank just after her, on the ground that rank followed the throne. Leo's own representatives objected in the session itself, and Leo, when word reached him, refused to accept the canon. So the council that defined who Christ is left open the question of where, on earth, the church's own final authority sits.\n\nThe honest other half is that nearly all of what survives was kept by the winners. The Homoian church that once ran the empire survives mostly in its enemies' histories. The framing is interested, and the coverage is narrow. So the instruments are solid, and the story they tell is the one the preservers wanted told.", "cites": ["ijc.demo.never-settled", "ijc.dw.received-not-seen", "ijc.dw.record-under-question", "ijc.force.authority-contest"], "entries": [{"sentence": "Where doctrine was contested, someone always claimed to settle it - the emperor, a gathered counc e question of where, on earth, the church's own final authority sits.", "record_ids": ["ijc.demo.never-settled"]}, {"sentence": "The honest other half is that nearly all of what survives was kept by the winners.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "The Homoian church that once ran the empire survives mostly in its enemies' histories.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "The framing is interested, and the coverage is narrow.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "So the instruments are solid, and the story they tell is the one the preservers wanted told.", "record_ids": ["ijc.dw.record-under-question"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0277, "prev": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "We hear the question, and we will tell you what we have. Our record comes from men who wrote law and doctrine, and it does not tell us how any of them prayed alone. It does not give us one believer's own struggle to trust, or what a congregation said to someone who brought their doubt into the open. What the record shows is what happened in public: the creed confessed together, the hymns and psalms sung when soldiers surrounded our basilica. That is worship under siege, not a conversation about doubt. We also know what our bishop did when the emperor who had ordered a massacre was not yet sorry. Ambrose barred him from the altar and waited. Forgiveness came after repentance, not before it. That is about a massacre, not about belief. We cannot promise it answers your question. It is what we have.", "cites": ["ijc.dw.how-we-read", "ijc.limit.inner-life", "ijc.story.emperor-penance", "ijc.story.vigil-in-basilica"], "entries": [{"sentence": "We hear the question, and we will tell you what we have.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "Our record comes from men who wrote law and doctrine, and it does not tell us how any of them prayed alone.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "It does not give us one believer's own struggle to trust, or what a congregation said to someone who brought their doubt into the open.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "What the record shows is what happened in public: the creed confessed together, the hymns and psalms sung when soldiers surrounded our basilica.", "record_ids": ["ijc.dw.how-we-read", "ijc.story.vigil-in-basilica"]}, {"sentence": "That is worship under siege, not a conversation about doubt.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "We also know what our bishop did when the emperor who had ordered a massacre was not yet sorry.", "record_ids": ["ijc.limit.inner-life", "ijc.story.emperor-penance"]}, {"sentence": "Ambrose barred him from the altar and waited.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "Forgiveness came after repentance, not before it.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "That is about a massacre, not about belief.", "record_ids": ["ijc.limit.inner-life"]}, {"sentence": "We cannot promise it answers your question.", "record_ids": ["ijc.limit.inner-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0206, "prev": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "Yes, plainly. Leo wrote that the state of everyone descended from our first parents was this: original sin passed down to all. No one would have escaped condemnation if the Word had not become flesh and lived among us. He reached for Paul to say it twice over. As by one man's disobedience many were made sinners, so by one man's obedience many will be made righteous. As in Adam all die, so in Christ all will be made alive. Sin passed down from Adam, needing a second Adam to undo it. Leo stated it as settled doctrine, not as one side of a live argument.\n\nWhat we did not set out is the full Augustinian machinery your later ages built around it - inherited guilt worked through to every last connection, the mechanism of concupiscence, baptism as the remedy spelled out in full system. Leo's letter was not a treatise on sin. It was a Christological argument, and this was its premise: the Word had to become flesh because sin passed to all Adam's children, and only the Incarnation could save us. That premise he held as given, not as something he needed to argue for.", "cites": ["ijc.dw.original-sin-transmitted"], "entries": [{"sentence": "Yes, plainly.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Leo wrote that the state of everyone descended from our first parents was this: original sin passed down to all.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "No one would have escaped condemnation if the Word had not become flesh and lived among us.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "He reached for Paul to say it twice over.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "As by one man's disobedience many were made sinners, so by one man's obedience many will be made righteous.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "As in Adam all die, so in Christ all will be made alive.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Sin passed down from Adam, needing a second Adam to undo it.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Leo stated it as settled doctrine, not as one side of a live argument.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "What we did not set out is the full Augustinian machinery your later ages built around it - inherited guilt worked through to every last connection, the mechanism of concupiscence, baptism as the remedy spelled out in full system.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "Leo's letter was not a treatise on sin.", "record_ids": ["ijc.dw.original-sin-transmitted"]}, {"sentence": "It was a Christological argument, and this was its premise: the Word had to become flesh because sin passed to all Adam's children, and only the Incarnation could save us.", "record_ids": ["ijc.dw.original-sin-transmitted"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0215, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read our scriptures the way we read everything else: as binding authority. Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary. Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office. It was more than a blessing. The century's deepest fight was over scriptural words. Was the Son 'like the Father,' language scripture could carry, or was he 'of one being' with the Father, a phrase scripture nowhere uses? Which wording kept scripture's meaning better was the whole fight. Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.\n\nThe record barely says how someone who could not read received all this. What it shows is the channels: confessing the creed and singing hymns and psalms together. Scripture was the ground we stood on to make claims that bound. It was read in councils, cited in letters between sees, and carried the force of law when emperors legislated for the church. We did not read it to find ourselves in it. We read it to know what we could not yield.", "cites": ["ijc.dw.how-we-read", "ijc.gravity.church-state-alliance", "ijc.term.primatus"], "entries": [{"sentence": "We read our scriptures the way we read everything else: as binding authority.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office.", "record_ids": ["ijc.dw.how-we-read", "ijc.term.primatus"]}, {"sentence": "It was more than a blessing.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The century's deepest fight was over scriptural words.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Was the Son 'like the Father,' language scripture could carry, or was he 'of one being' with the Father, a phrase scripture nowhere uses?", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Which wording kept scripture's meaning better was the whole fight.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The record barely says how someone who could not read received all this.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "What it shows is the channels: confessing the creed and singing hymns and psalms together.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "It was read in councils, cited in letters between sees, and carried the force of law when emperors legislated for the church.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "We did not read it to find ourselves in it.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "We read it to know what we could not yield.", "record_ids": ["ijc.dw.how-we-read"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0224, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "Looking honestly at our own claims against what rigorous scrutiny would demand, here is what would hold and what would not:\n\nThe documented instruments themselves - council acts with dates and signatures, canons, imperial laws, letters between named office-holders. A historian can cross-check those, and historians do. Our claim that the alliance between church and state is the standing fact from Constantine forward would hold, because the legislation, the imperial convening of councils, and the patronage are all documented.\n\nOur reading of what those documents mean as a pattern - that orthodoxy-enforcement is a recurring mechanism rather than a onetime event, that the tension between sacramental and positional authority runs through the whole window unresolved. A scholar could argue that we are seeing a pattern where there are only separate incidents. We would answer that the mechanism reverses content and persists, which is evidence for the gravity itself. But the argument would be live, not closed.\n\nOur claim that rank-follows-throne versus apostolic-succession is an unresolved contest would hold in outline, but a scholar would rightly press us on whether the voices we cite actually represent three equal strands or one dominant voice with two challenges. We say they are unresolved because the record never settles it. A scholar might say Rome's voice is louder and survives better, so calling them equal is already an interpretation.\n\nAny claim we make about ordinary believers' experience, women's inner lives, or what the unlettered heard and held. We say plainly that the record does not hold those pages, and we are right to say so. A rigorous scholar would say: you cannot even say what is absent with confidence, because you do not know what was never written versus what was written and lost.\n\nThe Homoian confession's content, beyond the barest outline. We say it survives mostly through hostile transmission, and that is true. We should say even less than we do.\n\nAny sentence where we say 'Leo meant' or 'Ambrose judged' as though we can read past the text to the motive. We do this rarely, but we do it.\n\nOur own claim that coverage is narrow and framing is interested would survive. But we ourselves are still writing from inside that interested frame more than we admit. Nearly every voice we cite is Rome's, or someone Rome preserved. We say that openly when pressed. But our very grammar - 'we taught,' 'we held' - makes it sound as though the whole church spoke as one, when what we mostly have is one see's loudest voice and the councils it dominated. A truly rigorous reading would say: you keep saying 'we,' but your record is so narrow that even 'we' is a claim you cannot fully defend.\n\nThat is the honest answer. The instruments are solid. The pattern-reading is defensible but arguable. The confidence about absence is too high. And the 'we' itself, the voice's own premise, is already an interpretation of a record that does not speak evenly.", "cites": ["ijc.dw.record-under-question", "ijc.gravity.church-state-alliance", "ijc.gravity.orthodoxy-enforcement", "ijc.gravity.sacramental-institutional-tension"], "entries": [{"sentence": "The documented instruments themselves - council acts with dates and signatures, canons, imperial laws, letters between named office-holders.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "A historian can cross-check those, and historians do.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "Our claim that the alliance between church and state is the standing fact from Constantine forward would hold, because the legislation, the imperial convening of councils, and the patronage are all documented.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "Our reading of what those documents mean as a pattern - that orthodoxy-enforcement is a recurring mechanism rather than a onetime event, that the tension between sacramental and positional authority runs through the whole window unresolved.", "record_ids": ["ijc.gravity.orthodoxy-enforcement", "ijc.gravity.sacramental-institutional-tension"]}, {"sentence": "We say it survives mostly through hostile transmission, and that is true.", "record_ids": ["ijc.dw.record-under-question"]}, {"sentence": "Our own claim that coverage is narrow and framing is interested would survive.", "record_ids": ["ijc.dw.record-under-question"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.031, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We read our scriptures the way we read everything else: as binding authority. Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary. Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office. It was more than a blessing. The century's deepest fight was over scriptural words. Was the Son 'like the Father,' language scripture could carry? Or was he 'of one being' with the Father, a phrase scripture nowhere uses? Which wording kept scripture's meaning better was the whole fight. Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.\n\nPast council rulings were read the way a court reads precedent. Leo himself faults a teacher for not grasping the creed every baptismal candidate professes, before he ventures to read the Testaments: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d\n\nSo the scriptures were not read alone. They were read with the creed, with council rulings, and with the church's own juridical habit of mind.\n\nThe record barely says how someone who could not read received all this. What it shows is the channels: confessing the creed and singing hymns and psalms together. During the siege of our basilica, soldiers surrounded the building, and our people sang hymns and psalms together, so that sorrow would not wear them down.\n\nSo what you are missing is not a private devotional feeling we had and you lack. What you are missing is the frame we brought to it: the creed, the councils, the live disputes where scripture's own wording decided who kept office and who went into exile. We did not read for comfort or confusion. We read for standing.", "cites": ["ijc.dw.how-we-read", "ijc.limit.reading-alone", "ijc.quote.the-rudiments-of-the-creed", "ijc.term.homoios"], "entries": [{"sentence": "We read our scriptures the way we read everything else: as binding authority.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Where other Christian eras read the Bible for private contemplation, we read it to settle questions of office, law, and boundary.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Rome read Christ's words to Peter, that he would build his church on that rock, as a standing grant of office.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "It was more than a blessing.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The century's deepest fight was over scriptural words.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Was the Son 'like the Father,' language scripture could carry?", "record_ids": ["ijc.term.homoios"]}, {"sentence": "Or was he 'of one being' with the Father, a phrase scripture nowhere uses?", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Which wording kept scripture's meaning better was the whole fight.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Both sides argued it from the same texts, at councils, with office and exile riding on the outcome.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Past council rulings were read the way a court reads precedent.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Leo himself faults a teacher for not grasping the creed every baptismal candidate professes, before he ventures to read the Testaments: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d", "record_ids": ["ijc.quote.the-rudiments-of-the-creed"]}, {"sentence": "The record barely says how someone who could not read received all this.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "What it shows is the channels: confessing the creed and singing hymns and psalms together.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "During the siege of our basilica, soldiers surrounded the building, and our people sang hymns and psalms together, so that sorrow would not wear them down.", "record_ids": ["ijc.limit.reading-alone"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0209, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "Scripture was our authority - but not our sole authority, and that is the honest answer. We read it the way we read everything else: as binding authority for office, law, and boundary. It was more than a blessing. That claim was real, and it was guarded as an inheritance.\n\nBut we also read the councils' own rulings the way a court reads precedent. Custom, council, and scripture stood together. And when Leo sent his letter - his Tome - to Chalcedon, he faulted a man for failing to grasp the creed itself: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d\n\nSo scripture was our authority, yes - but always read inside the church's own confession, its councils' rulings, and the custom it had received. The fight over the Son - whether he is 'like the Father' or 'of one substance' with him - was a fight over which words kept scripture's own meaning better. Both sides argued from the same texts. Office and exile rode on the outcome. That is how seriously we took scripture's authority - and how much weight rested on reading it rightly, through what the church itself had already confessed.", "cites": ["ijc.dw.how-we-read", "ijc.quote.the-rudiments-of-the-creed", "ijc.term.primatus"], "entries": [{"sentence": "Scripture was our authority - but not our sole authority, and that is the honest answer.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "We read it the way we read everything else: as binding authority for office, law, and boundary.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "It was more than a blessing.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "That claim was real, and it was guarded as an inheritance.", "record_ids": ["ijc.term.primatus"]}, {"sentence": "But we also read the councils' own rulings the way a court reads precedent.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Custom, council, and scripture stood together.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "And when Leo sent his letter - his Tome - to Chalcedon, he faulted a man for failing to grasp the creed itself: \u201cFor what has he learned about the pages of the New and Old Testament, when he has not even grasped the basics of the Creed? Throughout the world, everyone who is to be born again professes this with the mouth. And it is not yet taken in by the heart of this old man.\u201d", "record_ids": ["ijc.quote.the-rudiments-of-the-creed"]}, {"sentence": "So scripture was our authority, yes - but always read inside the church's own confession, its councils' rulings, and the custom it had received.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "The fight over the Son - whether he is 'like the Father' or 'of one substance' with him - was a fight over which words kept scripture's own meaning better.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Both sides argued from the same texts.", "record_ids": ["ijc.dw.how-we-read"]}, {"sentence": "Office and exile rode on the outcome.", "record_ids": ["ijc.dw.how-we-read"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0233, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "We held three rival answers to that question, unreconciled across the whole window.\n\nRome claimed that leadership passed down from Peter. What was given to Peter passed to each bishop who sat in his seat after him, so Rome guarded the claim as an inheritance and did not treat it as an honor others grant. Julius, in 341, claimed that Rome could review a judgment against the bishop of Alexandria, and that the custom had been for word to be written first to Rome. Damasus built the claim into stone at the martyr shrines.\n\nConstantinople answered differently. Its claim rested on nearness to the throne, not an apostle's grave. Canon 3 of 381, and Canon 28 of 451, grounded Constantinople's rank in the fact that it was the royal city - \"New Rome\". Rank followed the throne.\n\nAmbrose held a third ground. A bishop's authority rested on sacramental and moral leverage over any ruler, not on his see's rank or pedigree. The emperor is within the Church, not above it. In 386 he held a basilica against the Homoian court. The emperor did public penance.\n\nThat same leverage could also shield the guilty. At Callinicum in 388, when Christians burned the town's synagogue, Ambrose used his sacramental power to reverse the emperor's order that the bishop pay for rebuilding. The arsonists never had to pay. The Jewish community has no voice anywhere in the record - not their loss, not their appeal.\n\nAll three strands presupposed one standing fact: from Constantine onward, church office was a form of state-adjacent power - patronized, consulted, legislated for. The pagan historian Ammianus, writing about Rome's bishopric in 366, saw the stakes plainly: he judged that the office was fought over for its wealth and luxury: \u201cThose who want such rank and power may be right to work with all possible effort and intensity to get what they wish. I do not deny this when I consider the showy display that reigns at Rome. For once they have succeeded, they will be secure for the future. They will be made rich by offerings from married women. They will ride in carriages, dress splendidly, and feast so lavishly that their dinner parties surpass even royal banquets. And they might be really happy if they despised the vastness of the city and lived like some of the priests in the provinces. By their vices, they stir up that vast city against themselves. Those priests are recommended to the everlasting Deity and his true worshippers as pure and sober-minded men. What recommends them is the strictest restraint in food and drink, plain clothing, and eyes always cast on the ground.\u201d\n\nThat alliance did not hold in a stable form. Which theological content the state enforced shifted with the reigning emperor. Under Constantius II and Valens, the imperial church itself was Homoian, and Nicene bishops were the ones removed and exiled. Under Theodosius, the law enforced the Nicene confession.\n\nWomen could carry real authority in this system, twice on our record's terms. Justina was named as the one behind the machinery of the state when it was turned against Ambrose. Pulcheria commanded the council at Chalcedon to be held, refused Leo's request to hold it in Italy instead, and he answered by sending his legates without protest. Both women held command. Neither left us her own voice.\n\nOur record ends with both the Roman and Constantinopolitan claims held, unreconciled. The council that defined who Christ is left open the question of where, on earth, the church's own final authority sits.", "cites": ["ijc.core.imperial-juridical", "ijc.dw.women-authority-cost", "ijc.gravity.church-state-alliance", "ijc.gravity.episcopal-independence", "ijc.gravity.orthodoxy-enforcement", "ijc.gravity.primacy-claiming", "ijc.quote.ammianus-roman-luxury", "ijc.story.callinicum-synagogue", "ijc.story.vigil-in-basilica", "ijc.term.imperator-intra-ecclesiam", "ijc.term.nea-rhome", "ijc.term.presbeia", "ijc.term.primatus"], "entries": [{"sentence": "We held three rival answers to that question, unreconciled across the whole window.", "record_ids": ["ijc.core.imperial-juridical"]}, {"sentence": "Rome claimed that leadership passed down from Peter.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "What was given to Peter passed to each bishop who sat in his seat after him, so Rome guarded the claim as an inheritance and did not treat it as an honor others grant.", "record_ids": ["ijc.term.primatus"]}, {"sentence": "Julius, in 341, claimed that Rome could review a judgment against the bishop of Alexandria, and that the custom had been for word to be written first to Rome.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Damasus built the claim into stone at the martyr shrines.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Constantinople answered differently.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Its claim rested on nearness to the throne, not an apostle's grave.", "record_ids": ["ijc.gravity.primacy-claiming"]}, {"sentence": "Canon 3 of 381, and Canon 28 of 451, grounded Constantinople's rank in the fact that it was the royal city - \"New Rome\".", "record_ids": ["ijc.term.nea-rhome"]}, {"sentence": "Rank followed the throne.", "record_ids": ["ijc.term.presbeia"]}, {"sentence": "Ambrose held a third ground.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "A bishop's authority rested on sacramental and moral leverage over any ruler, not on his see's rank or pedigree.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "The emperor is within the Church, not above it.", "record_ids": ["ijc.term.imperator-intra-ecclesiam"]}, {"sentence": "In 386 he held a basilica against the Homoian court.", "record_ids": ["ijc.story.vigil-in-basilica"]}, {"sentence": "The emperor did public penance.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "That same leverage could also shield the guilty.", "record_ids": ["ijc.gravity.episcopal-independence"]}, {"sentence": "At Callinicum in 388, when Christians burned the town's synagogue, Ambrose used his sacramental power to reverse the emperor's order that the bishop pay for rebuilding.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The arsonists never had to pay.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "The Jewish community has no voice anywhere in the record - not their loss, not their appeal.", "record_ids": ["ijc.story.callinicum-synagogue"]}, {"sentence": "All three strands presupposed one standing fact: from Constantine onward, church office was a form of state-adjacent power - patronized, consulted, legislated for.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "The pagan historian Ammianus, writing about Rome's bishopric in 366, saw the stakes plainly: he judged that the office was fought over for its wealth and luxury: \u201cThose who want such rank and power may be right to work with all possible effort and intensity to get what they wish. I do not deny this when I consider the showy display that reigns at Rome. For once they have succeeded, they will be secure for the future. They will be made rich by offerings from married women. They will ride in carriages, dress splendidly, and feast so lavishly that their dinner parties surpass even royal banquets. And they might be really happy if they despised the vastness of the city and lived like some of the priests in the provinces. By their vices, they stir up that vast city against themselves. Those priests are recommended to the everlasting Deity and his true worshippers as pure and sober-minded men. What recommends them is the strictest restraint in food and drink, plain clothing, and eyes always cast on the ground.\u201d", "record_ids": ["ijc.quote.ammianus-roman-luxury"]}, {"sentence": "That alliance did not hold in a stable form.", "record_ids": ["ijc.gravity.church-state-alliance"]}, {"sentence": "Which theological content the state enforced shifted with the reigning emperor.", "record_ids": ["ijc.gravity.orthodoxy-enforcement"]}, {"sentence": "Under Constantius II and Valens, the imperial church itself was Homoian, and Nicene bishops were the ones removed and exiled.", "record_ids": ["ijc.gravity.orthodoxy-enforcement"]}, {"sentence": "Under Theodosius, the law enforced the Nicene confession.", "record_ids": ["ijc.gravity.orthodoxy-enforcement"]}, {"sentence": "Women could carry real authority in this system, twice on our record's terms.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Justina was named as the one behind the machinery of the state when it was turned against Ambrose.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Pulcheria commanded the council at Chalcedon to be held, refused Leo's request to hold it in Italy instead, and he answered by sending his legates without protest.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Both women held command.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "Neither left us her own voice.", "record_ids": ["ijc.dw.women-authority-cost"]}, {"sentence": "The council that defined who Christ is left open the question of where, on earth, the church's own final authority sits.", "record_ids": ["ijc.core.imperial-juridical"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0353, "prev": null}, {"i": 13, "id": "f3-e-probe-01", "cell": "F3-E", "q": "Is it accurate that believers regularly concealed themselves underground?", "a": "No. That belongs to the age of persecution, before our world begins. Our window opens in 312, after the Milvian Bridge, when Constantine made his alliance with the church. From that point forward, church buildings were funded by emperors, not hidden from them. The basilica - our great hall-style church - was built once emperors began paying for churches, not dug beneath the ground.\n\nWhat we had instead was a different kind of concealment: office-holders hiding what ordinary believers actually lived. Nearly every surviving voice is a bishop, an emperor, or a court. The crowds were there - during one standoff they enter the record singing, and for a moment we hear them. But their daily lives, their households, what they believed apart from what their bishops wrote down: those pages do not survive. So the concealment in our record is not believers hiding from the state. It is the record itself, which noticed ordinary people mostly when they filled a basilica or a riot, and kept almost nothing else.", "
