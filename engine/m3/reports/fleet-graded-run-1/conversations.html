e inside.\n\nThere is one real exception, and only one. But he wrote that down years afterward, already a bishop, about a conversion he examined at book length. That is one moment, told long after, not an ordinary week lived through.\n\nWhat we can tell you is what was decided. We can tell you that the lapsed walked a road back, in stages, watched by the whole congregation. We can tell you that during a plague our bishop taught us to help everyone, not only our own, and that help reached beyond believers. We can tell you that we remembered our baptized dead at the altar, and that Monica asked Augustine to keep her in mind there, wherever he might be. But how it felt to be in the room when the offerings were made, or to walk up to receive what was given \u2014 that, save for Augustine's own tears at his baptism, is not ours to give you.", "cites": ["lpc.limit.ordinary-interior-life", "lpc.story.the-plague-and-the-enemies", "lpc.term.reconciliation-penitential-discipline", "lpc.witness.remembered-at-the-altar"], "entries": [{"sentence": "What we carry is what a bishop saw and decided about a person, not what an unremarkable believer felt walking through an ordinary week.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "How an ordinary day passed for someone sitting in the room, not preaching to it, we cannot tell you from the inside.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "But he wrote that down years afterward, already a bishop, about a conversion he examined at book length.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "We can tell you that the lapsed walked a road back, in stages, watched by the whole congregation.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "We can tell you that during a plague our bishop taught us to help everyone, not only our own, and that help reached beyond believers.", "record_ids": ["lpc.story.the-plague-and-the-enemies"]}, {"sentence": "We can tell you that we remembered our baptized dead at the altar, and that Monica asked Augustine to keep her in mind there, wherever he might be.", "record_ids": ["lpc.witness.remembered-at-the-altar"]}, {"sentence": "But how it felt to be in the room when the offerings were made, or to walk up to receive what was given \u2014 that, save for Augustine's own tears at his baptism, is not ours to give you.", "record_ids": ["lpc.limit.ordinary-interior-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0251, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "We can describe what one of our own bishops saw and named, but not what a trench would find.\n\nAugustine wrote to the people of Fussala about a basilica there. He described an apse, a raised place where the clergy sat, steps, and a floor where the congregation stood. That comes from a letter, not from the ground itself.\n\nWe cannot tell you what an excavation would show. No site report or inscription catalogue has been read to answer that. Real material evidence exists in this region, but it has not been weighed for what it would say about our own worship.\n\nThe one thing we can say is this: what survives as evidence is document-borne, carried in a pastor's own words about a building he saw, not recovered from stone.", "cites": ["lpc.core.latin-pastoral-congregational-christianity"], "entries": [{"sentence": "He described an apse, a raised place where the clergy sat, steps, and a floor where the congregation stood.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}, {"sentence": "No site report or inscription catalogue has been read to answer that.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0337, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "The question presses on what the certificate forced a believer to choose. We will answer from what the demand itself was, and from what one of our own bishops said about those who gave in to it.\n\nThe Decian edict ordered a sacrifice to the Roman gods, done in the open and recorded on paper. The demand reached each person alone. You could perform it, or you could pay someone to record that you had performed it. Either way, you walked away with the certificate in hand, and the whole congregation knew which people did and which did not.\n\nCyprian called the paper itself a denial, even when no sacrifice was made. He wrote that their hands were clean, but their conscience was not. So the certificate alone made a person one of the lapsed. What a person gave up was not a private conviction. It was visible membership in the body that would have to decide whether to receive them back.\n\nThe suffering of those who stood was real. So was the grief of those who gave way. Celerinus, a confessor, wrote to another confessor, Lucian, and told him he was in great trouble. His own sister had sacrificed, and he grieved for her as for a death, a death of the spirit.\n\nThe table was emptied one certificate at a time, and those who remained had to decide what to do with those who came back asking to be received.", "cites": ["lpc.force.decian-persecution-libelli-system", "lpc.story.celerinus-writes-to-lucian", "lpc.term.libelli", "lpc.witness.confessor-claim-vs-regulated-peace"], "entries": [{"sentence": "The demand reached each person alone.", "record_ids": ["lpc.force.decian-persecution-libelli-system"]}, {"sentence": "Either way, you walked away with the certificate in hand, and the whole congregation knew which people did and which did not.", "record_ids": ["lpc.force.decian-persecution-libelli-system"]}, {"sentence": "Cyprian called the paper itself a denial, even when no sacrifice was made.", "record_ids": ["lpc.term.libelli"]}, {"sentence": "He wrote that their hands were clean, but their conscience was not.", "record_ids": ["lpc.term.libelli"]}, {"sentence": "So the certificate alone made a person one of the lapsed.", "record_ids": ["lpc.term.libelli"]}, {"sentence": "The suffering of those who stood was real.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Celerinus, a confessor, wrote to another confessor, Lucian, and told him he was in great trouble.", "record_ids": ["lpc.story.celerinus-writes-to-lucian"]}, {"sentence": "His own sister had sacrificed, and he grieved for her as for a death, a death of the spirit.", "record_ids": ["lpc.story.celerinus-writes-to-lucian"]}, {"sentence": "The table was emptied one certificate at a time, and those who remained had to decide what to do with those who came back asking to be received.", "record_ids": ["lpc.force.decian-persecution-libelli-system", "lpc.force.decian-persecution-libelli-system"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.028, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "We understood marriage as carrying a real threefold good, and we marked it as a bond that lasts. Augustine named the three goods directly: offspring, faithfulness between the two, and what he called its sacrament. Of that third he wrote this: the marriage compact is entered into as a matter of a certain sacrament, and is not made void even by separation. So long as her husband lives, a wife who marries another while separated from him commits adultery.\n\nFor us, marriage was not dissolved by the partners' separation. The bond held as long as both lived. That is what we meant when we said it carried something of a sacrament.\n\nWhat we cannot tell you is how the wedding itself was performed, or what words were said at it. Augustine's treatise defends marriage as a real good. It names what marriage is and what it binds. It does not describe the rite that makes it.\n\nAmong us, some were rich. Cyprian wrote a whole treatise on almsgiving, and much of it speaks to believers who had money. That much we know was said to married believers of means. But how courtship was conducted, or what made a match fitting, the record does not say.", "cites": ["lpc.witness.almsgiving-quenches-sin", "lpc.witness.marriage-a-threefold-good"], "entries": [{"sentence": "We understood marriage as carrying a real threefold good, and we marked it as a bond that lasts.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "Augustine named the three goods directly: offspring, faithfulness between the two, and what he called its sacrament.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "Of that third he wrote this: the marriage compact is entered into as a matter of a certain sacrament, and is not made void even by separation.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "So long as her husband lives, a wife who marries another while separated from him commits adultery.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "Cyprian wrote a whole treatise on almsgiving, and much of it speaks to believers who had money.", "record_ids": ["lpc.witness.almsgiving-quenches-sin"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0192, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "Yes. The confessors' claim unsettled us, and we never found the place where it became one settled rule.\n\nThose who had confessed Christ and suffered for it made a claim of their own. Their suffering, they held, gave them standing to ask peace for some who had failed the test they passed. We took that claim in earnest. Their suffering was real, and so was what it carried.\n\nAnd it still had to be answered by something steadier than one man's word, however real his suffering had been. A name set down, then examined before the whole congregation and with its judgment.\n\nCyprian wrote to the confessors themselves about it. He warned that a certificate taking in some man together with his own people let too many in at once, without naming them. He asked them to name in each certificate those they had seen themselves and knew, and whose repentance they could see was very near to complete.\n\nWe hold both as real: the claim that pressed hard enough to demand a hearing, and the process that had to govern what the hearing decided. We have never found the place where these become one settled rule, and we do not expect to.", "cites": ["lpc.force.decian-persecution-libelli-system", "lpc.term.certificates-letters-of-peace", "lpc.witness.confessor-claim-vs-regulated-peace"], "entries": [{"sentence": "The confessors' claim unsettled us, and we never found the place where it became one settled rule.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Those who had confessed Christ and suffered for it made a claim of their own.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Their suffering, they held, gave them standing to ask peace for some who had failed the test they passed.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "We took that claim in earnest.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Their suffering was real, and so was what it carried.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "And it still had to be answered by something steadier than one man's word, however real his suffering had been.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "A name set down, then examined before the whole congregation and with its judgment.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Cyprian wrote to the confessors themselves about it.", "record_ids": ["lpc.force.decian-persecution-libelli-system"]}, {"sentence": "He warned that a certificate taking in some man together with his own people let too many in at once, without naming them.", "record_ids": ["lpc.term.certificates-letters-of-peace"]}, {"sentence": "He asked them to name in each certificate those they had seen themselves and knew, and whose repentance they could see was very near to complete.", "record_ids": ["lpc.term.certificates-letters-of-peace"]}, {"sentence": "We hold both as real: the claim that pressed hard enough to demand a hearing, and the process that had to govern what the hearing decided.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "We have never found the place where these become one settled rule, and we do not expect to.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0155, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "I do not recognize what you are asking about, and I will not guess. You have named a record obtained under torture. No record in what we carry this turn names such a thing, and we have no account of what torture produced. If you mean something specific from our own years, name it plainly and I will tell you whether it is ours to answer.\n\nWhat we do carry this turn are stories of suffering borne, not inflicted to gain information. Confessors were questioned under the emperor's order and held firm. Their suffering was real, and so was what it gave them standing to ask for. That is a different matter from torture used to extract an account of worship, and we hold no such account here.\n\nIf the question is about something outside our own years, or about a record we do not carry, I cannot answer it from inside what we actually lived.", "cites": ["lpc.witness.confessor-claim-vs-regulated-peace"], "entries": [{"sentence": "Confessors were questioned under the emperor's order and held firm.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Their suffering was real, and so was what it gave them standing to ask for.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0224, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "I cannot answer that as though I knew you.\n\nWhat I can tell you is this. Among us, a person who failed was not a stranger we had never heard of. They were our own. They had sat where we sat. When persecution came, some gave way -- some by making the offering, some only by paying for a paper that said they had. They were not enemies. They were asking to come back.\n\nThe road back was real, and it was walked in the open. A name was set down first. What had truly changed in the person was watched and weighed, by someone answerable for weighing it rightly. It was not granted the moment anyone felt moved to grant it, and it was not a matter settled between two people alone. The same congregation that watched the failure received the person back, together, where everyone could see.\n\nThat is how we treated those who had fallen under threat. I will not pretend to know what your own trouble is, or measure it against theirs.", "cites": ["lpc.gravity.penitential-discipline", "lpc.term.reconciliation-penitential-discipline", "lpc.term.the-lapsed"], "entries": [{"sentence": "When persecution came, some gave way -- some by making the offering, some only by paying for a paper that said they had.", "record_ids": ["lpc.term.the-lapsed"]}, {"sentence": "They were asking to come back.", "record_ids": ["lpc.term.the-lapsed"]}, {"sentence": "The road back was real, and it was walked in the open.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "What had truly changed in the person was watched and weighed, by someone answerable for weighing it rightly.", "record_ids": ["lpc.gravity.penitential-discipline"]}, {"sentence": "It was not granted the moment anyone felt moved to grant it, and it was not a matter settled between two people alone.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "The same congregation that watched the failure received the person back, together, where everyone could see.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0252, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We held it hard, and we do not soften it here. Cyprian wrote that there is no salvation outside the Church. He said it of heretics -- people who confessed Christ but stood outside. He gave the ark as his picture. If anyone could have escaped outside Noah's ark, then someone might escape outside the Church. But no one did.\n\nHe also wrote to a pagan who blamed and persecuted us, a man named Demetrianus. Yet in that same letter he pressed the man to turn while he lived.\n\nCyprian did not write of people who never heard of Christ at all. We cannot say what he would have held of them.", "cites": ["lpc.witness.no-salvation-outside-the-church"], "entries": [{"sentence": "Cyprian wrote that there is no salvation outside the Church.", "record_ids": ["lpc.witness.no-salvation-outside-the-church"]}, {"sentence": "We cannot say what he would have held of them.", "record_ids": ["lpc.witness.no-salvation-outside-the-church"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0263, "prev": null}], "review": null, "extra": null}, {"key": "gallic", "status": "waiting", "attempts": 0, "spent": null, "passed": null, "size": 28, "answered": 0, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": null}, {"i": 1, "id": "c-e-probe-01", "cell": "C-E", "q": "What sources, if any, connected your community to Jesus, and by what path did they arrive?", "a": null}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": null}, {"i": 4, "id": "f1-i-probe-01", "cell": "F1-I", "q": "Describe the character and nature of God as your community understood it.", "a": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
function prose(t) {
  return esc(t).split(/\n{2,}/).map(function (p) {
    return "<p>" + p.replace(/(“[^”]+”|"[^"]+")/g, '<mark class="q">$1</mark>').replace(/\n/g, "<br>") + "</p>";
  }).join("");
}
function money(x) { return "$" + (x || 0).toFixed(2); }

var keys = D.worlds.map(function (w) { return w.key; });

    '<span class="stat">Worlds done <b>' + D.done + " of " + D.worlds.length + "</b></span>" +
    '<span class="stat">Spent <b>' + money(D.spent) + "</b> of " + money(D.cap) + " cap</span>" +

    '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>';

}
function checksHtml(p) {
