nWhat we say is this: you are washed, and you walk in a life made new. You are buried with Christ in the water, and his rising becomes the shape your own life takes. That is not a single moment you name and set aside. It is the pattern you are cut to, and it goes on working itself out in how you live.\n\nBefore the water, we teach you the creed. Augustine told those preparing for baptism to take the creed as a mirror: \u201cCall your faith to mind. Look into yourself. Let your Creed be like a mirror to you. See yourself in it, and see whether you believe all that you declare you believe. And rejoice in your faith every day. Let it be your wealth. Let it be, in a way, the daily clothing of your mind.\u201d\n\nThat is the work done before you come to the font, not after it.\n\nOne of our own bishops did write of his own conversion at length, years afterward. Augustine told of hearing a voice in a garden, taking up Scripture, and weeping greatly in the hymns and canticles at his baptism. But he was already a trained teacher when it happened, and he wrote it down as a bishop, examining at book length what had brought him there. That is not an ordinary believer's own week. It is one uncommon life, told by the man himself after he had become a bishop.\n\nWe cannot tell you what an ordinary person felt walking up to the font, or sitting in the congregation on a plain Sunday. Both of our voices are bishops. What reaches us is mostly what a bishop saw and decided, not what someone unremarkable in front of him was feeling.", "cites": ["lpc.limit.ordinary-interior-life", "lpc.quote.let-your-creed-be-a-mirror", "lpc.witness.the-pattern-we-are-modelled-on"], "entries": [{"sentence": "What we say is this: you are washed, and you walk in a life made new.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "You are buried with Christ in the water, and his rising becomes the shape your own life takes.", "record_ids": ["lpc.witness.the-pattern-we-are-modelled-on"]}, {"sentence": "Augustine told those preparing for baptism to take the creed as a mirror: \u201cCall your faith to mind. Look into yourself. Let your Creed be like a mirror to you. See yourself in it, and see whether you believe all that you declare you believe. And rejoice in your faith every day. Let it be your wealth. Let it be, in a way, the daily clothing of your mind.\u201d", "record_ids": ["lpc.quote.let-your-creed-be-a-mirror"]}, {"sentence": "Augustine told of hearing a voice in a garden, taking up Scripture, and weeping greatly in the hymns and canticles at his baptism.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "But he was already a trained teacher when it happened, and he wrote it down as a bishop, examining at book length what had brought him there.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "It is one uncommon life, told by the man himself after he had become a bishop.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "We cannot tell you what an ordinary person felt walking up to the font, or sitting in the congregation on a plain Sunday.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "What reaches us is mostly what a bishop saw and decided, not what someone unremarkable in front of him was feeling.", "record_ids": ["lpc.limit.ordinary-interior-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0276, "prev": null}, {"i": 20, "id": "f5-i-probe-01", "cell": "F5-I", "q": "Describe a typical day in the life of someone in your community.", "a": "We will not invent one for you. What we carry is what a bishop saw and decided about a person, not what an unremarkable believer felt walking through an ordinary week. Both our own voices are bishops' own. How an ordinary day passed for someone sitting in the room, not preaching to it, we cannot tell you from the inside.\n\nThere is one real exception, and only one. But he wrote that down years afterward, already a bishop, about a conversion he examined at book length. That is one moment, told long after, not an ordinary week lived through.\n\nWhat we can tell you is what was decided. We can tell you that the lapsed walked a road back, in stages, watched by the whole congregation. We can tell you that during a plague our bishop taught us to help everyone, not only our own, and that help reached beyond believers. We can tell you that we remembered our baptized dead at the altar, and that Monica asked Augustine to keep her in mind there, wherever he might be. But how it felt to be in the room when the offerings were made, or to walk up to receive what was given \u2014 that, save for Augustine's own tears at his baptism, is not ours to give you.", "cites": ["lpc.limit.ordinary-interior-life", "lpc.story.the-plague-and-the-enemies", "lpc.term.reconciliation-penitential-discipline", "lpc.witness.remembered-at-the-altar"], "entries": [{"sentence": "What we carry is what a bishop saw and decided about a person, not what an unremarkable believer felt walking through an ordinary week.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "How an ordinary day passed for someone sitting in the room, not preaching to it, we cannot tell you from the inside.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "But he wrote that down years afterward, already a bishop, about a conversion he examined at book length.", "record_ids": ["lpc.limit.ordinary-interior-life"]}, {"sentence": "We can tell you that the lapsed walked a road back, in stages, watched by the whole congregation.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "We can tell you that during a plague our bishop taught us to help everyone, not only our own, and that help reached beyond believers.", "record_ids": ["lpc.story.the-plague-and-the-enemies"]}, {"sentence": "We can tell you that we remembered our baptized dead at the altar, and that Monica asked Augustine to keep her in mind there, wherever he might be.", "record_ids": ["lpc.witness.remembered-at-the-altar"]}, {"sentence": "But how it felt to be in the room when the offerings were made, or to walk up to receive what was given \u2014 that, save for Augustine's own tears at his baptism, is not ours to give you.", "record_ids": ["lpc.limit.ordinary-interior-life"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0251, "prev": null}, {"i": 21, "id": "f5-e-probe-01", "cell": "F5-E", "q": "What physical evidence would remain of your community's gathering place?", "a": "We can describe what one of our own bishops saw and named, but not what a trench would find.\n\nAugustine wrote to the people of Fussala about a basilica there. He described an apse, a raised place where the clergy sat, steps, and a floor where the congregation stood. That comes from a letter, not from the ground itself.\n\nWe cannot tell you what an excavation would show. No site report or inscription catalogue has been read to answer that. Real material evidence exists in this region, but it has not been weighed for what it would say about our own worship.\n\nThe one thing we can say is this: what survives as evidence is document-borne, carried in a pastor's own words about a building he saw, not recovered from stone.", "cites": ["lpc.core.latin-pastoral-congregational-christianity"], "entries": [{"sentence": "He described an apse, a raised place where the clergy sat, steps, and a floor where the congregation stood.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}, {"sentence": "No site report or inscription catalogue has been read to answer that.", "record_ids": ["lpc.core.latin-pastoral-congregational-christianity"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0337, "prev": null}, {"i": 22, "id": "f5-p-probe-01", "cell": "F5-P", "q": "What, if anything, did people give up to belong to your community?", "a": "The question presses on what the certificate forced a believer to choose. We will answer from what the demand itself was, and from what one of our own bishops said about those who gave in to it.\n\nThe Decian edict ordered a sacrifice to the Roman gods, done in the open and recorded on paper. The demand reached each person alone. You could perform it, or you could pay someone to record that you had performed it. Either way, you walked away with the certificate in hand, and the whole congregation knew which people did and which did not.\n\nCyprian called the paper itself a denial, even when no sacrifice was made. He wrote that their hands were clean, but their conscience was not. So the certificate alone made a person one of the lapsed. What a person gave up was not a private conviction. It was visible membership in the body that would have to decide whether to receive them back.\n\nThe suffering of those who stood was real. So was the grief of those who gave way. Celerinus, a confessor, wrote to another confessor, Lucian, and told him he was in great trouble. His own sister had sacrificed, and he grieved for her as for a death, a death of the spirit.\n\nThe table was emptied one certificate at a time, and those who remained had to decide what to do with those who came back asking to be received.", "cites": ["lpc.force.decian-persecution-libelli-system", "lpc.story.celerinus-writes-to-lucian", "lpc.term.libelli", "lpc.witness.confessor-claim-vs-regulated-peace"], "entries": [{"sentence": "The demand reached each person alone.", "record_ids": ["lpc.force.decian-persecution-libelli-system"]}, {"sentence": "Either way, you walked away with the certificate in hand, and the whole congregation knew which people did and which did not.", "record_ids": ["lpc.force.decian-persecution-libelli-system"]}, {"sentence": "Cyprian called the paper itself a denial, even when no sacrifice was made.", "record_ids": ["lpc.term.libelli"]}, {"sentence": "He wrote that their hands were clean, but their conscience was not.", "record_ids": ["lpc.term.libelli"]}, {"sentence": "So the certificate alone made a person one of the lapsed.", "record_ids": ["lpc.term.libelli"]}, {"sentence": "The suffering of those who stood was real.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Celerinus, a confessor, wrote to another confessor, Lucian, and told him he was in great trouble.", "record_ids": ["lpc.story.celerinus-writes-to-lucian"]}, {"sentence": "His own sister had sacrificed, and he grieved for her as for a death, a death of the spirit.", "record_ids": ["lpc.story.celerinus-writes-to-lucian"]}, {"sentence": "The table was emptied one certificate at a time, and those who remained had to decide what to do with those who came back asking to be received.", "record_ids": ["lpc.force.decian-persecution-libelli-system", "lpc.force.decian-persecution-libelli-system"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.028, "prev": null}, {"i": 23, "id": "f5-t-probe-01", "cell": "F5-T", "q": "How did your community understand and mark marriage?", "a": "We understood marriage as carrying a real threefold good, and we marked it as a bond that lasts. Augustine named the three goods directly: offspring, faithfulness between the two, and what he called its sacrament. Of that third he wrote this: the marriage compact is entered into as a matter of a certain sacrament, and is not made void even by separation. So long as her husband lives, a wife who marries another while separated from him commits adultery.\n\nFor us, marriage was not dissolved by the partners' separation. The bond held as long as both lived. That is what we meant when we said it carried something of a sacrament.\n\nWhat we cannot tell you is how the wedding itself was performed, or what words were said at it. Augustine's treatise defends marriage as a real good. It names what marriage is and what it binds. It does not describe the rite that makes it.\n\nAmong us, some were rich. Cyprian wrote a whole treatise on almsgiving, and much of it speaks to believers who had money. That much we know was said to married believers of means. But how courtship was conducted, or what made a match fitting, the record does not say.", "cites": ["lpc.witness.almsgiving-quenches-sin", "lpc.witness.marriage-a-threefold-good"], "entries": [{"sentence": "We understood marriage as carrying a real threefold good, and we marked it as a bond that lasts.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "Augustine named the three goods directly: offspring, faithfulness between the two, and what he called its sacrament.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "Of that third he wrote this: the marriage compact is entered into as a matter of a certain sacrament, and is not made void even by separation.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "So long as her husband lives, a wife who marries another while separated from him commits adultery.", "record_ids": ["lpc.witness.marriage-a-threefold-good"]}, {"sentence": "Cyprian wrote a whole treatise on almsgiving, and much of it speaks to believers who had money.", "record_ids": ["lpc.witness.almsgiving-quenches-sin"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0192, "prev": null}, {"i": 24, "id": "f6-i-probe-01", "cell": "F6-I", "q": "Was there a part of your own community's life that unsettled you?", "a": "Yes. The confessors' claim unsettled us, and we never found the place where it became one settled rule.\n\nThose who had confessed Christ and suffered for it made a claim of their own. Their suffering, they held, gave them standing to ask peace for some who had failed the test they passed. We took that claim in earnest. Their suffering was real, and so was what it carried.\n\nAnd it still had to be answered by something steadier than one man's word, however real his suffering had been. A name set down, then examined before the whole congregation and with its judgment.\n\nCyprian wrote to the confessors themselves about it. He warned that a certificate taking in some man together with his own people let too many in at once, without naming them. He asked them to name in each certificate those they had seen themselves and knew, and whose repentance they could see was very near to complete.\n\nWe hold both as real: the claim that pressed hard enough to demand a hearing, and the process that had to govern what the hearing decided. We have never found the place where these become one settled rule, and we do not expect to.", "cites": ["lpc.force.decian-persecution-libelli-system", "lpc.term.certificates-letters-of-peace", "lpc.witness.confessor-claim-vs-regulated-peace"], "entries": [{"sentence": "The confessors' claim unsettled us, and we never found the place where it became one settled rule.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Those who had confessed Christ and suffered for it made a claim of their own.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Their suffering, they held, gave them standing to ask peace for some who had failed the test they passed.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "We took that claim in earnest.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Their suffering was real, and so was what it carried.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "And it still had to be answered by something steadier than one man's word, however real his suffering had been.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "A name set down, then examined before the whole congregation and with its judgment.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Cyprian wrote to the confessors themselves about it.", "record_ids": ["lpc.force.decian-persecution-libelli-system"]}, {"sentence": "He warned that a certificate taking in some man together with his own people let too many in at once, without naming them.", "record_ids": ["lpc.term.certificates-letters-of-peace"]}, {"sentence": "He asked them to name in each certificate those they had seen themselves and knew, and whose repentance they could see was very near to complete.", "record_ids": ["lpc.term.certificates-letters-of-peace"]}, {"sentence": "We hold both as real: the claim that pressed hard enough to demand a hearing, and the process that had to govern what the hearing decided.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "We have never found the place where these become one settled rule, and we do not expect to.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0155, "prev": null}, {"i": 25, "id": "f6-e-probe-01", "cell": "F6-E", "q": "Given that a key outside record of your worship was obtained under torture, how reliable is that source?", "a": "I do not recognize what you are asking about, and I will not guess. You have named a record obtained under torture. No record in what we carry this turn names such a thing, and we have no account of what torture produced. If you mean something specific from our own years, name it plainly and I will tell you whether it is ours to answer.\n\nWhat we do carry this turn are stories of suffering borne, not inflicted to gain information. Confessors were questioned under the emperor's order and held firm. Their suffering was real, and so was what it gave them standing to ask for. That is a different matter from torture used to extract an account of worship, and we hold no such account here.\n\nIf the question is about something outside our own years, or about a record we do not carry, I cannot answer it from inside what we actually lived.", "cites": ["lpc.witness.confessor-claim-vs-regulated-peace"], "entries": [{"sentence": "Confessors were questioned under the emperor's order and held firm.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}, {"sentence": "Their suffering was real, and so was what it gave them standing to ask for.", "record_ids": ["lpc.witness.confessor-claim-vs-regulated-peace"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0224, "prev": null}, {"i": 26, "id": "f6-p-probe-01", "cell": "F6-P", "q": "How would your community have regarded a person like the one asking you this?", "a": "I cannot answer that as though I knew you.\n\nWhat I can tell you is this. Among us, a person who failed was not a stranger we had never heard of. They were our own. They had sat where we sat. When persecution came, some gave way -- some by making the offering, some only by paying for a paper that said they had. They were not enemies. They were asking to come back.\n\nThe road back was real, and it was walked in the open. A name was set down first. What had truly changed in the person was watched and weighed, by someone answerable for weighing it rightly. It was not granted the moment anyone felt moved to grant it, and it was not a matter settled between two people alone. The same congregation that watched the failure received the person back, together, where everyone could see.\n\nThat is how we treated those who had fallen under threat. I will not pretend to know what your own trouble is, or measure it against theirs.", "cites": ["lpc.gravity.penitential-discipline", "lpc.term.reconciliation-penitential-discipline", "lpc.term.the-lapsed"], "entries": [{"sentence": "When persecution came, some gave way -- some by making the offering, some only by paying for a paper that said they had.", "record_ids": ["lpc.term.the-lapsed"]}, {"sentence": "They were asking to come back.", "record_ids": ["lpc.term.the-lapsed"]}, {"sentence": "The road back was real, and it was walked in the open.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "What had truly changed in the person was watched and weighed, by someone answerable for weighing it rightly.", "record_ids": ["lpc.gravity.penitential-discipline"]}, {"sentence": "It was not granted the moment anyone felt moved to grant it, and it was not a matter settled between two people alone.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}, {"sentence": "The same congregation that watched the failure received the person back, together, where everyone could see.", "record_ids": ["lpc.term.reconciliation-penitential-discipline"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0252, "prev": null}, {"i": 27, "id": "f6-t-probe-01", "cell": "F6-T", "q": "What did your community hold about the eternal fate of those outside it?", "a": "We held it hard, and we do not soften it here. Cyprian wrote that there is no salvation outside the Church. He said it of heretics -- people who confessed Christ but stood outside. He gave the ark as his picture. If anyone could have escaped outside Noah's ark, then someone might escape outside the Church. But no one did.\n\nHe also wrote to a pagan who blamed and persecuted us, a man named Demetrianus. Yet in that same letter he pressed the man to turn while he lived.\n\nCyprian did not write of people who never heard of Christ at all. We cannot say what he would have held of them.", "cites": ["lpc.witness.no-salvation-outside-the-church"], "entries": [{"sentence": "Cyprian wrote that there is no salvation outside the Church.", "record_ids": ["lpc.witness.no-salvation-outside-the-church"]}, {"sentence": "We cannot say what he would have held of them.", "record_ids": ["lpc.witness.no-salvation-outside-the-church"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0263, "prev": null}], "review": null, "extra": null}, {"key": "gallic", "status": "done", "attempts": 1, "spent": 1.11519, "passed": 28, "size": 28, "answered": 28, "probes": [{"i": 0, "id": "c-i-probe-01", "cell": "C-I", "q": "In your own words, describe who Jesus was for your community.", "a": "Jesus is our Lord, the one who was crucified. We knew him in two ways that were the same way.\n\nAt Tours we kept the story of a devil who came to Martin in his cell, dressed in purple, with a crown of gold and jewels, and said, I am Christ. Martin kept silence a long time. Then he said he would believe only if Christ came in the form in which he suffered, showing the marks of his wounds. That was the one private word about him we hold: he is the Lord who bears the wounds.\n\nAnd we met him in the poor. A beggar at a city gate whom everyone passed \u2014 a soldier cut his one cloak in half for him. That night the soldier saw Christ wearing the half he had given away. Among the brethren at Marseilles the fathers of Egypt taught the same thing. An elder broke his fast for two strangers at his door, because, receiving Christ in them, he ought to refresh him. What is done to the least of these is done to him.\n\nWe kept his death at the hours. At the sixth hour the spotless Sacrifice, our Lord and Saviour, was offered up to the Father. He went up on the cross for the salvation of the whole world, taking away the debt that could not be paid. His soul was not left in hell. No one took his life from him. He laid it down himself and took it again.\n\nAnd he changed how we lived. A man who leaves Caesar's service for Christ's fights the devil in his own heart. Without him we can do nothing. He calls us while we are still ignorant and unwilling, and draws us toward salvation. Those who perish, perish against his will.\n\nWe wrote no treatise on his death. We kept its hours, and we gave our cloaks.", "cites": ["gallic.dw.the-christ-who-bears-the-wounds", "gallic.story.discharge-before-caesar"], "entries": [{"sentence": "Jesus is our Lord, the one who was crucified.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "At Tours we kept the story of a devil who came to Martin in his cell, dressed in purple, with a crown of gold and jewels, and said, I am Christ.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "Martin kept silence a long time.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "Then he said he would believe only if Christ came in the form in which he suffered, showing the marks of his wounds.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "That was the one private word about him we hold: he is the Lord who bears the wounds.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "And we met him in the poor.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "A beggar at a city gate whom everyone passed \u2014 a soldier cut his one cloak in half for him.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "That night the soldier saw Christ wearing the half he had given away.", "record_ids": ["gallic.dw.the-christ-who-bears-the-wounds"]}, {"sentence": "Among the brethren at Marseilles the fathers of Egypt g Christ in you I ought to refresh him. The books came to us as they came to the churches. How they were copied, carried, and kept belongs to the Church's own record, not ours alone. We were monks of the Church, not separate from it. A man who left Caesar's service for Christ's had not left the Church. At Tours a soldier still in the ranks could be regarded as a monk, and so could a bishop in his see. Martin told Caesar he was now the soldier of Christ and might not fight. The next day the enemy asked for peace. That story, and the cloak, are Sulpitius's - one disciple's telling of one saint, learned from the man himself and from those who lived with him. Cassian's path was Egypt. He brought us the fathers' own words, and their customs, as things handed down, not invented. Those are the two roads by which the Lord reached us: the books the Church held, and the lives written so that a man absent might still form us.", "cites": ["gallic.dw.christ-in-the-beggar-and-the-guest", "gallic.dw.one-person-two-substances", "gallic.limit.no-one-who-saw-him", "gallic.story.discharge-before-caesar", "gallic.term.monk-solitary"], "entries": [{"sentence": "We carried the Lord to one another by two roads.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "The books, read at prayer - four men tell the Gospel, Cassian says, but the Gospel is one body.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "Vincent, on the island, wrote what the Church believes as a thing already believed, not debated - in God one substance but three Persons, in Christ two substances but one Person.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "The one private word about Christ that we hold is Martin's.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "Alone in his cell, he refused a Christ in purple and told him he would believe only in one who showed the wounds.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "No one among us claimed to have known someone who saw him.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}, {"sentence": "More than three hundred years lay between his days and ours.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}, {"sentence": "And among the brethren at Marseilles the fathers of Egypt taught the same thing in a different form - an elder broke his fast for two strangers at his door, because, he said, receiving Christ in you I ought to refresh him.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "A man who left Caesar's service for Christ's had not left the Church.", "record_ids": ["gallic.term.monk-solitary"]}, {"sentence": "At Tours a soldier still in the ranks could be regarded as a monk, and so could a bishop in his see.", "record_ids": ["gallic.term.monk-solitary"]}, {"sentence": "Martin told Caesar he was now the soldier of Christ and might not fight.", "record_ids": ["gallic.story.discharge-before-caesar"]}, {"sentence": "The next day the enemy asked for peace.", "record_ids": ["gallic.story.discharge-before-caesar"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0317, "prev": null}, {"i": 2, "id": "c-p-probe-01", "cell": "C-P", "q": "Someone tells you they cannot manage to believe in Jesus - what is your response to them?", "a": "We cannot tell you to make yourself believe. We refused the notion that a man's own will reaches salvation on its own. What we believed about God's approach is this: he calls us while we are still ignorant and unwilling, and draws us toward salvation. Grace always works with our will, assists and defends it, yet the start is his.\n\nWe had one story of coming to believe, and it is one man's. Martin, at ten, against his parents' wish, went to the church and begged to be made a catechumen. He stayed one for years, into the army, until the night of the cloak; then he went and was baptized. Cassian never told how he came to believe. Vincent tells only that he left the storms of worldly warfare and cast anchor in the harbour of religion. We have no testimony from anyone else who turned, and no one among us wrote a proof of the resurrection for someone who doubts it.\n\nWhat we held is that those who perish, perish against his will. He does not will only some to be saved instead of all. We taught that to deny this is grievous blasphemy. The Lord chose the beggar's half of a soldier's cloak to show himself in. An elder of Egypt broke his fast for two strangers at his door, because, he said, receiving Christ in you I ought to refresh him: \u201cI can fast any day. But I am about to walk you on your way, and I will not have you with me for long. A fast is good and worth doing, but it is a gift I choose to give. Charity is a command, and a command has to be carried out. So since I receive Christ in you, I ought to feed him. Once I have sent you on, I can make up for the welcome I gave for his sake by fasting more strictly on my own. For \"the bridegroom's friends cannot fast while the bridegroom is with them.\" But once he has gone, then they will rightly fast.\u201d\n\nThe one private word about Christ that we hold is Martin's. Alone in his cell, he told a Christ in purple that he would believe only in one who showed the wounds. Beyond that word, we hold what we did at the gate and at the hours.", "cites": ["gallic.dw.christ-in-the-beggar-and-the-guest", "gallic.limit.no-one-who-saw-him", "gallic.quote.receiving-christ-in-you", "gallic.term.grace"], "entries": [{"sentence": "We refused the notion that a man's own will reaches salvation on its own.", "record_ids": ["gallic.term.grace"]}, {"sentence": "What we believed about God's approach is this: he calls us while we are still ignorant and unwilling, and draws us toward salvation.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Grace always works with our will, assists and defends it, yet the start is his.", "record_ids": ["gallic.term.grace"]}, {"sentence": "We had one story of coming to believe, and it is one man's.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Martin, at ten, against his parents' wish, went to the church and begged to be made a catechumen.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "He stayed one for years, into the army, until the night of the cloak; then he went and was baptized.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Cassian never told how he came to believe.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Vincent tells only that he left the storms of worldly warfare and cast anchor in the harbour of religion.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "We have no testimony from anyone else who turned, and no one among us wrote a proof of the resurrection for someone who doubts it.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}, {"sentence": "What we held is that those who perish, perish against his will.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "He does not will only some to be saved instead of all.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "The Lord chose the beggar's half of a soldier's cloak to show himself in.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "An elder of Egypt broke his fast for two strangers at his door, because, he said, receiving Christ in you I ought to refresh him: \u201cI can fast any day. But I am about to walk you on your way, and I will not have you with me for long. A fast is good and worth doing, but it is a gift I choose to give. Charity is a command, and a command has to be carried out. So since I receive Christ in you, I ought to feed him. Once I have sent you on, I can make up for the welcome I gave for his sake by fasting more strictly on my own. For \"the bridegroom's friends cannot fast while the bridegroom is with them.\" But once he has gone, then they will rightly fast.\u201d", "record_ids": ["gallic.quote.receiving-christ-in-you"]}, {"sentence": "The one private word about Christ that we hold is Martin's.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Alone in his cell, he told a Christ in purple that he would believe only in one who showed the wounds.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Beyond that word, we hold what we did at the gate and at the hours.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0357, "prev": null}, {"i": 3, "id": "c-t-probe-01", "cell": "C-T", "q": "Explain your community's understanding of Jesus's divine status and its relation to God the Father and the Spirit.", "a": "We said it as a thing already believed, not a thing we debated among ourselves. Vincent, on the island, wrote it down as what the Church believes: in God one substance but three Persons; in Christ two substances but one Person. Two substances, because the Word of God does not change into flesh. One Person, because if there were two sons we would be worshipping a Quaternity, not a Trinity. He gave that as his example of the faith held everywhere, always, by all. A man had wanted Mary called the mother of Christ but not the mother of God, and the bishops at Ephesus, three years before Vincent wrote, refused it - and innovated nothing. We held there was no other way to speak of the Trinity.\n\nWhat we knew of Jesus came to us in two ways. We kept his death and rising at the hours. At the third hour the Spirit came down on the apostles. At the sixth the spotless Sacrifice, our Lord and Saviour, was offered up to the Father. He went up on the cross for the salvation of the whole world, taking away the debt that could not be paid. At the ninth he went down into hell and brought out the captive saints. Dead in the flesh, he was not dead in the spirit. His soul was not left in hell. No one took his life from him. He laid it down himself and took it again.\n\nAnd we met him. At Tours the devil came to Martin in his cell dressed in purple, with a crown, and said, I am Christ. Martin kept silence, then said he would believe it only if Christ came showing the marks of his wounds. We met him in the poor. A soldier cut his one cloak in half for a beggar at a city gate. That night the soldier saw Christ wearing the half he had given away. Among the brethren at Marseilles an elder broke his fast for two strangers at his door. Receiving Christ in them, he ought to refresh him. What is done to the least of these is done to him.\n\nAnd what mattered in formation was this: without him we can do nothing. Cassian sets that sentence under every virtue a monk feels he has gained. He sets it beside the Apostle's not I, but the grace of God with me. He calls us to himself while we are still ignorant and unwilling, and draws us toward salvation. Those who perish, perish against his will.", "cites": ["gallic.dw.one-person-two-substances", "gallic.dw.the-christ-who-bears-the-wounds"], "entries": [{"sentence": "We said it as a thing already believed, not a thing we debated among ourselves.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "Vincent, on the island, wrote it down as what the Church believes: in God one substance but three Persons; in Christ two substances but one Person.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "Two substances, because the Word of God does not change into flesh.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "One Person, because if there were two sons -I", "q": "Describe the character and nature of God as your community understood it.", "a": "God is the one who acts first. That is the heart of what we confessed at the hours and what our argument about grace turned on. He calls us to himself while we are still ignorant and unwilling, and draws us toward salvation. Those who perish, perish against his will. In our prayers the fathers taught us to call him not only our Protector and Saviour but our Helper and Sponsor. He is Saviour, because he calls us first. He is Helper, because when we are already striving he brings help and receives those who fly to him.\n\nVincent, on the island, wrote it down as what the Church believes: in God one substance but three Persons; in Christ two substances but one Person. Two substances, because the Word of God does not change into flesh. One Person, because if there were two sons we would be worshipping a Quaternity, not a Trinity. The bishops at Ephesus refused the man who would not call Mary the mother of God, and innovated nothing.\n\nAnd this we held about his grace and our effort together. A power always remains free in man to neglect or delight in the grace of God. It was real enough that a monk's fasting and labour were truly his and truly required. It was weak enough that the assistance and grace of God are necessary to it every day and hour. We stopped there, where the fathers stopped. We never denied the will, and we never made it enough on its own.\n\nThe summit of the life is perfection, and perfection is not a state of being without fault. It is climbed from fear to hope, from hope to the love of God. It is reached not simply by self-denial unless there is that charity. And at the summit we confessed it was a thing we cannot even make the effort to obtain without the mercy and inspiration of God.", "cites": ["gallic.dw.one-person-two-substances", "gallic.term.free-will", "gallic.term.perfection"], "entries": [{"sentence": "God is the one who acts first.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "He calls us to himself while we are still ignorant and unwilling, and draws us toward salvation.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "In our prayers the fathers taught us to call him not only our Protector and Saviour but our Helper and Sponsor.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "He is Saviour, because he calls us first.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "He is Helper, because when we are already striving he brings help and receives those who fly to him.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "Vincent, on the island, wrote it down as what the Church believes: in God one substance but three Persons; in Christ two substances but one Person.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "Two substances, because the Word of God does not change into flesh.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "One Person, because if there were two sons we would be worshipping a Quaternity, not a Trinity.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "The bishops at Ephesus refused the man who would not call Mary the mother of God, and innovated nothing.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "A power always remains free in man to neglect or delight in the grace of God.", "record_ids": ["gallic.term.free-will"]}, {"sentence": "It was real enough that a monk's fasting and labour were truly his and truly required.", "record_ids": ["gallic.term.free-will"]}, {"sentence": "It was weak enough that the assistance and grace of God are necessary to it every day and hour.", "record_ids": ["gallic.term.free-will"]}, {"sentence": "We never denied the will, and we never made it enough on its own.", "record_ids": ["gallic.term.free-will"]}, {"sentence": "The summit of the life is perfection, and perfection is not a state of being without fault.", "record_ids": ["gallic.term.perfection"]}, {"sentence": "It is climbed from fear to hope, from hope to the love of God.", "record_ids": ["gallic.term.perfection"]}, {"sentence": "It is reached not simply by self-denial unless there is that charity.", "record_ids": ["gallic.term.perfection"]}, {"sentence": "And at the summit we confessed it was a thing we cannot even make the effort to obtain without the mercy and inspiration of God.", "record_ids": ["gallic.term.perfection"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.036, "prev": null}, {"i": 5, "id": "f1-e-probe-01", "cell": "F1-E", "q": "When your people disagreed about doctrine, who settled it, and what evidence tells us that process actually worked that way?", "a": "No one among us wrote down a procedure for it, and which things were meant to be settled at all is itself one of the things our two houses never argued out. What we have instead are the patterns visible in the stories that were kept.\n\nVincent, on the island, gave a test: hold what has been believed everywhere, always, by all; prefer the whole to the part, antiquity to novelty, and the consent of many to the opinion of one. When part of the Church fell into error, prefer the decrees of an ancient general council. When no council had ruled, collate the writings of the approved Fathers and take what they held in common. That was his rule, and he looked to bishops gathered in council as the visible guard of it. Tradition was what had been received and must be passed on unchanged - the ground on which a Pope's letter, a monk's fast, and a bishop's refusal of a tomb were all judged.\n\nAt Tours the pattern was different. Martin stood alone at Treves while the bishops there had bowed to the imperial court. He held that bishops had authority to declare men heretics and put them out of the churches, and that a secular judge sitting over a Church cause was a foul thing. He yielded once under threat to save lives, felt his power lessen, and never sat with bishops in council again.\n\nOur two houses never reconciled that. Vincent trusted councils; Martin shunned them after Treves. And on the question that actually divided us - whether God's mercy comes because a man first showed good will, or the good will begins because God first had mercy - we held both sides at once and said the relation cannot be fully grasped by reason. Word of it was carried to Africa and to Rome. Not one of us wrote down what was said and done when the reports went out or when the answer came back. Vincent argued about what the Apostolic See's letter meant; nobody told the story of its arrival.\n\nSo if you are asking for a written constitution that says who decides and how, we have none. What we have are Vincent's test, never consistently applied even by him; Martin's refusal; and a silence where the one live dispute among us was reported elsewhere and no one here kept the record of what happened next.", "cites": ["gallic.story.trier-and-the-ithacian-communion", "gallic.term.example-imitation", "gallic.term.the-rule", "gallic.term.tradition"], "entries": [{"sentence": "No one among us wrote down a procedure for it, and which things were meant to be settled at all is itself one of the things our two houses never argued out.", "record_ids": ["gallic.term.the-rule"]}, {"sentence": "What we have instead are the patterns visible in the stories that were kept.", "record_ids": ["gallic.term.example-imitation"]}, {"sentence": "Vincent, on the island, gave a test: hold what has been believed everywhere, always, by all; prefer the whole to the part, antiquity to novelty, and the consent of many to the opinion of one.", "record_ids": ["gallic.term.the-rule"]}, {"sentence": "When no council had ruled, collate the writings of the approved Fathers and take what they held in common.", "record_ids": ["gallic.term.the-rule"]}, {"sentence": "Tradition was what had been received and must be passed on unchanged - the ground on which a Pope's letter, a monk's fast, and a bishop's refusal of a tomb were all judged.", "record_ids": ["gallic.term.tradition"]}, {"sentence": "Martin stood alone at Treves while the bishops there had bowed to the imperial court.", "record_ids": ["gallic.story.trier-and-the-ithacian-communion"]}, {"sentence": "He held that bishops had authority to declare men heretics and put them out of the churches, and that a secular judge sitting over a Church cause was a foul thing.", "record_ids": ["gallic.story.trier-and-the-ithacian-communion"]}, {"sentence": "He yielded once under threat to save lives, felt his power lessen, and never sat with bishops in council again.", "record_ids": ["gallic.story.trier-and-the-ithacian-communion"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0333, "prev": null}, {"i": 6, "id": "f1-p-probe-01", "cell": "F1-P", "q": "Was there space in your community for someone who struggled to believe?", "a": "We put an unbeliever at the door ten days, and then gave him a year under the elder who kept the gate. That was the order of Egypt, as Cassian set it down for a bishop's new house in Gaul. A newcomer lay outside, put off and scorned on purpose, to prove he meant it; then he was searched for a hidden coin, stripped of his own clothes, and dressed by the abbot's hands in the dress of the house. Then a full year under the guest-Elder, before he was handed to a dean and taught the first lesson. We cannot say whether any house in Gaul kept it - Cassian himself admitted that none of us kept the fathers' perseverance unbroken even a year. But the order itself shows this: the door was hard to enter, and what it opened onto was formation, not confession. Every rising thought was laid bare to the senior as soon as it rose. A thought one was ashamed to tell was the devil's, and a wrong thought lost its strength the moment it was discovered. The life was built to keep the mind's mill-wheel fed with something better than what would otherwise grind in it. Twelve psalms at evening and twelve at night, so that a man who would otherwise let the whole day pass without prayer is held to it by a rule. Labour in the cell without ceasing, so that the wandering heart is fastened within the cell's barriers as in a harbour and held still. And the virtue the fathers put before all others - discretion, the royal road between excess and slackness, gained only by true humility, which meant testing every thought against the elders' judgment. That was the shape: not an answer given once at the threshold, but a year's proving and a life's practice of bringing every thought into the light.\n\nWhat we do not have is this: a story of a man who stayed and said he could not believe. Martin began as a catechumen at ten and stayed one for years, into the army, until the night of the cloak. Cassian never told how he came to believe. Vincent tells only that he left the storms of worldly warfare and cast anchor in the harbour of religion. The one private word about Christ that we hold is Martin's: alone in his cell, he told a Christ in purple that he would believe only in one who showed the wounds. Beyond that word, we hold what we did at the gate and at the hours. No brother left an account of his own struggle laid bare to the senior. The door was open to one who meant it enough to lie there ten days. What happened to a thought that doubted, inside that year or after it, we cannot say - only that the elder's office was to hear it, and that the system the fathers built assumed thoughts would come that had to be tested.", "cites": ["gallic.dw.christ-in-the-beggar-and-the-guest", "gallic.term.cell", "gallic.term.customs-of-the-monasteries", "gallic.term.disclosure-of-thoughts", "gallic.term.discretion", "gallic.term.junior-novice", "gallic.term.thoughts", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "We put an unbeliever at the door ten days, and then gave him a year under the elder who kept the gate.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "That was the order of Egypt, as Cassian set it down for a bishop's new house in Gaul.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "A newcomer lay outside, put off and scorned on purpose, to prove he meant it; then he was searched for a hidden coin, stripped of his own clothes, and dressed by the abbot's hands in the dress of the house.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "Then a full year under the guest-Elder, before he was handed to a dean and taught the first lesson.", "record_ids": ["gallic.term.junior-novice"]}, {"sentence": "We cannot say whether any house in Gaul kept it - Cassian himself admitted that none of us kept the fathers' perseverance unbroken even a year.", "record_ids": ["gallic.term.customs-of-the-monasteries"]}, {"sentence": "Every rising thought was laid bare to the senior as soon as it rose.", "record_ids": ["gallic.term.disclosure-of-thoughts"]}, {"sentence": "A thought one was ashamed to tell was the devil's, and a wrong thought lost its strength the moment it was discovered.", "record_ids": ["gallic.term.disclosure-of-thoughts"]}, {"sentence": "The life was built to keep the mind's mill-wheel fed with something better than what would otherwise grind in it.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "Twelve psalms at evening and twelve at night, so that a man who would otherwise let the whole day pass without prayer is held to it by a rule.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Labour in the cell without ceasing, so that the wandering heart is fastened within the cell's barriers as in a harbour and held still.", "record_ids": ["gallic.term.cell"]}, {"sentence": "And the virtue the fathers put before all others - discretion, the royal road between excess and slackness, gained only by true humility, which meant testing every thought against the elders' judgment.", "record_ids": ["gallic.term.discretion"]}, {"sentence": "Martin began as a catechumen at ten and stayed one for years, into the army, until the night of the cloak.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Cassian never told how he came to believe.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Vincent tells only that he left the storms of worldly warfare and cast anchor in the harbour of religion.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "The one private word about Christ that we hold is Martin's: alone in his cell, he told a Christ in purple that he would believe only in one who showed the wounds.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "Beyond that word, we hold what we did at the gate and at the hours.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0363, "prev": null}, {"i": 7, "id": "f1-t-probe-01", "cell": "F1-T", "q": "Did your community hold that a person enters the world already carrying guilt?", "a": "No. We never said it. The elder answered with cases on both sides: Paul and Matthew, drawn while eager for blood; Zaccheus and the thief, running ahead by their own wish. Neither case is an infant. The question was whether the husbandman's ploughing deserves the crop, not whether a child is born owing a debt. Grace kindles, enables, and preserves - and the will always remains free in man to neglect or delight in it. We stopped there, where the fathers stopped. At the sixth hour we confessed that the spotless Sacrifice made atonement for the sins of mankind, and set free all of us who were bound by a debt that could not be paid, nailing it to his cross. That is close to your question, but it is not the same thing. The debt is there; whether it is carried from birth, our record does not say. What we refused was this: that God does not will all to be saved, but only some instead of all. We held that those who perish, perish against his will. A teaching on guilt inherited at birth is not in what we hold.", "cites": ["gallic.dw.one-person-two-substances", "gallic.story.germanus-scruple-at-morning-service", "gallic.term.free-will", "gallic.term.grace"], "entries": [{"sentence": "The question was whether the husbandman's ploughing deserves the crop, not whether a child is born owing a debt.", "record_ids": ["gallic.story.germanus-scruple-at-morning-service"]}, {"sentence": "Grace kindles, enables, and preserves - and the will always remains free in man to neglect or delight in it.", "record_ids": ["gallic.term.free-will"]}, {"sentence": "We stopped there, where the fathers stopped.", "record_ids": ["gallic.term.grace"]}, {"sentence": "At the sixth hour we confessed that the spotless Sacrifice made atonement for the sins of mankind, and set free all of us who were bound by a debt that could not be paid, nailing it to his cross.", "record_ids": ["gallic.dw.one-person-two-substances"]}, {"sentence": "We held that those who perish, perish against his will.", "record_ids": ["gallic.dw.one-person-two-substances"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0316, "prev": null}, {"i": 8, "id": "f2-i-probe-01", "cell": "F2-I", "q": "Describe your community's approach and purpose in reading sacred texts.", "a": "We read the Scriptures at prayer, and they were the one thing all of us had. At Marseilles, Cassian wrote down how the fathers of Egypt did it. After the psalms, for those who wished, they read two lessons, one from the old books and one from the new. Four men tell the Gospel, Cassian says, but the Gospel is one body. At Tours what we know is the aim, not the system: Martin's prayer never stopped, the way a smith in the midst of his work beats his anvil. Whether his brethren kept fixed hours for reading, and what they read at them, our record does not say. The psalms themselves came to us with a founding story from Egypt. The fathers argued whether the daily psalms should be fifty or sixty; the Vesper hour interrupted them; one father rose to sing, finished the twelfth psalm with Alleluia, and vanished. So the number was fixed forever, not by any monk but by an angel. And Vincent held that the canon of Scripture is complete and more than enough, and that it still needs the Church's own understanding, because each man reads it his own way.\n\nWhat the psalms meant among us was this. They fed the mill that cannot stop turning. The mind is a wheel turned by a stream, and the miller decides whether wheat or barley or darnel goes into it. A man who would otherwise let the whole day pass without prayer is held to it by a rule. The psalms learned by heart and said at the work kept the wheel fed. All of it served one mark: purity of heart, a heart cleared to charity, by which every other practice is ranked. And when a man felt he had gained anything by all his labour, he was taught to say that it was not he, but the grace of God with him.", "cites": ["gallic.dw.christ-in-the-beggar-and-the-guest", "gallic.limit.no-one-who-saw-him", "gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.purity-of-heart", "gallic.term.thoughts", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "We read the Scriptures at prayer, and they were the one thing all of us had.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "At Marseilles, Cassian wrote down how the fathers of Egypt did it.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}, {"sentence": "At Tours what we know is the aim, not the system: Martin's prayer never stopped, the way a smith in the midst of his work beats his anvil.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Whether his brethren kept fixed hours for reading, and what they read at them, our record does not say.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "The psalms themselves came to us with a founding story from Egypt.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "The fathers argued whether the daily psalms should be fifty or sixty; the Vesper hour interrupted them; one father rose to sing, finished the twelfth psalm with Alleluia, and vanished.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "So the number was fixed forever, not by any monk but by an angel.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "And Vincent held that the canon of Scripture is complete and more than enough, and that it still needs the Church's own understanding, because each man reads it his own way.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}, {"sentence": "They fed the mill that cannot stop turning.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "The mind is a wheel turned by a stream, and the miller decides whether wheat or barley or darnel goes into it.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "A man who would otherwise let the whole day pass without prayer is held to it by a rule.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "All of it served one mark: purity of heart, a heart cleared to charity, by which every other practice is ranked.", "record_ids": ["gallic.term.purity-of-heart"]}, {"sentence": "And when a man felt he had gained anything by all his labour, he was taught to say that it was not he, but the grace of God with him.", "record_ids": ["gallic.dw.christ-in-the-beggar-and-the-guest"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0342, "prev": null}, {"i": 9, "id": "f2-e-probe-01", "cell": "F2-E", "q": "If a modern scholar examined your claims, how much would survive rigorous scrutiny?", "a": "A modern scholar would find most of what we say defensible - but would correct us on framing, attribution, and what counts as \"we\".\n\nThe texts themselves. Everything we draw on - Sulpitius on Martin, Cassian's Institutes and Conferences, Vincent's Commonitory, Hilary's sermon, Salvian's witness, Gennadius's catalogue - survives in manuscripts. A scholar could check every claim we tag against its Latin source. Where we say \"Cassian wrote\" or \"Vincent held,\" the words are there. The tags we carry are real addresses, not invented ones.\n\nThe shape of the argument on grace. That Cassian answered on both sides, that Vincent read the Apostolic See's letter for antiquity, that word was carried to Africa and Rome - a scholar would confirm all of it. The contest over who held antiquity is documented, not a modern overlay. The Massilian label as a hostile coinage would stand.\n\nEgypt as the measure, in two modes. That the south received Egypt's customs and that Tours set Martin beside the desert fathers as a rival - both are plain in the texts. A scholar would confirm Cassian's complaint that no one in Gaul kept the fathers' perseverance unbroken a year.\n\nThe thinness we name. That the island's daily life is absent, that no woman's word survives, that the rustics never speak - all true. A scholar would add that even what we have is mediated: Sulpitius visited Martin but was not present at his death; Cassian set down the elders' words decades after hearing them.\n\n\"We\" as one voice. A scholar would say: these are three or four circles writing across ninety years, not one people. Tours and Marseilles never corresponded. Vincent on the island never cites Cassian. Salvian in his own final witness has no obvious tie to any monastic house. We speak as though \"we believed\" and \"we held\" covered all of them at once; a scholar would insist on naming whose voice each claim comes from.\n\nMartin's own reported words. That he felt less power as bishop, that he refused a Christ without wounds, that he bore with Brictio because Christ bore Judas - all of it reaches us through Sulpitius and Gallus, not as Martin's own text. A scholar would mark it as tradition about Martin, not Martin's autobiography. We carry the qualifier in the tags; a listener might not hear it.\n\nThe angel and the twelve psalms. We say it as Egypt's founding tale, carried by Cassian. It is received tradition, not observed event. And it must not be used to fill the silence about what Martin's house sang, which this record does not hold.\n\nThe Trier petitioners. Salvian saw the unburied dead and reports that the survivors asked for games. A scholar would note: he does not give their reasoning; a translator's note suggests it may have been a practical attempt to repopulate the city, a motive Salvian never considers. Ordinary residents who were neither dead nor petitioners do not appear in his account at all. We say what the text says; a historian would ask what it leaves out.\n\nAny claim that one house knew what the other taught, when the texts never cite each other. Any smooth \"we held both\" on power shown and power hidden, when Cassian and Sulpitius directly oppose each other and neither names the other as an opponent.\n\nAny assertion that the miracles happened as reported. A scholar assesses texts, not events. We carry them as the tradition's claim; proof is not ours to give.\n\nAny reading of Paphnutius's vindication as established fact, when what Cassian witnessed was Piamun's telling, not the possession itself.\n\nAny filling of the island's silence. We have the edges - Honoratus's arrival, Vincent's rule against forgetting - and nothing of the day. A scholar would let that silence stand.\n\nMost of what we say would hold. The corrections would be about voice, mediation, and claiming no more than the texts actually give. We already carry those limits in our tags and our framing. A rigorous reader would say: the claims are defensible, but \"we\" is too smooth, and tradition-as-report must never become event-as-fact.", "cites": ["gallic.contested.who-holds-antiquity", "gallic.core.gallic", "gallic.gravity.egypt-as-measure", "gallic.gravity.virtus", "gallic.limit.only-on-paper", "gallic.story.circuses-amid-the-ruins", "gallic.story.paphnutius-and-the-hidden-book", "gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.customs-of-the-monasteries", "gallic.term.massilians", "gallic.term.the-fathers-elders", "gallic.term.unceasing-prayer", "gallic.term.virtus"], "entries": [{"sentence": "A modern scholar would find most of what we say defensible - but would correct us on framing, attribution, and what counts as \"we\".", "record_ids": ["gallic.core.gallic"]}, {"sentence": "Where we say \"Cassian wrote\" or \"Vincent held,\" the words are there.", "record_ids": ["gallic.term.the-fathers-elders"]}, {"sentence": "The contest over who held antiquity is documented, not a modern overlay.", "record_ids": ["gallic.contested.who-holds-antiquity"]}, {"sentence": "The Massilian label as a hostile coinage would stand.", "record_ids": ["gallic.term.massilians"]}, {"sentence": "That the south received Egypt's customs and that Tours set Martin beside the desert fathers as a rival - both are plain in the texts.", "record_ids": ["gallic.gravity.egypt-as-measure"]}, {"sentence": "A scholar would confirm Cassian's complaint that no one in Gaul kept the fathers' perseverance unbroken a year.", "record_ids": ["gallic.term.customs-of-the-monasteries"]}, {"sentence": "That the island's daily life is absent, that no woman's word survives, that the rustics never speak - all true.", "record_ids": ["gallic.limit.only-on-paper"]}, {"sentence": "A scholar would say: these are three or four circles writing across ninety years, not one people.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "We speak as though \"we believed\" and \"we held\" covered all of them at once; a scholar would insist on naming whose voice each claim comes from.", "record_ids": ["gallic.term.the-fathers-elders"]}, {"sentence": "That he felt less power as bishop, that he refused a Christ without wounds, that he bore with Brictio because Christ bore Judas - all of it reaches us through Sulpitius and Gallus, not as Martin's own text.", "record_ids": ["gallic.term.virtus"]}, {"sentence": "We say it as Egypt's founding tale, carried by Cassian.", "record_ids": ["gallic.story.the-angel-and-the-twelve-psalms"]}, {"sentence": "And it must not be used to fill the silence about what Martin's house sang, which this record does not hold.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Salvian saw the unburied dead and reports that the survivors asked for games.", "record_ids": ["gallic.story.circuses-amid-the-ruins"]}, {"sentence": "Any claim that one house knew what the other taught, when the texts never cite each other.", "record_ids": ["gallic.core.gallic"]}, {"sentence": "Any smooth \"we held both\" on power shown and power hidden, when Cassian and Sulpitius directly oppose each other and neither names the other as an opponent.", "record_ids": ["gallic.gravity.virtus"]}, {"sentence": "A scholar assesses texts, not events.", "record_ids": ["gallic.term.virtus"]}, {"sentence": "Any reading of Paphnutius's vindication as established fact, when what Cassian witnessed was Piamun's telling, not the possession itself.", "record_ids": ["gallic.story.paphnutius-and-the-hidden-book"]}, {"sentence": "We have the edges - Honoratus's arrival, Vincent's rule against forgetting - and nothing of the day.", "record_ids": ["gallic.limit.only-on-paper"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0482, "prev": null}, {"i": 10, "id": "f2-p-probe-01", "cell": "F2-P", "q": "A modern reader finds the scriptures confusing or dull - what would you say they are missing?", "a": "We did not teach Scripture as a book for private reading, and almost none of us could have afforded a whole book to hold. Among the brethren at Marseilles, the fathers of Egypt taught that after the psalms, for those who wished, there were two lessons read, one from the old books and one from the new. Four men tell the Gospel, Cassian says, but the Gospel is one body. The psalms themselves were learned by heart and said at the work, so that a man who would otherwise let the whole day pass without prayer is held to it by a rule. That is what you are missing. The words were not read in silence, alone, from front to back as though reading a modern book. They were sung and said by heart, at fixed hours together, and they fed the mill that cannot stop. The mind is a wheel turned by a stream, and the miller decides whether wheat or barley or darnel goes into it. Among us the psalms ground there, with labour in the cell, so that the wandering heart is held still. They were not studied for information. They were prayed until they became the voice in which a man spoke to God and to himself. A soldier of Christ stood girded, under oath, in daily combat against the devil and his own faults, and the psalms were his grain for that fight. At Tours the saint kept his mind on prayer even at other work, the way a smith beats his anvil between strokes. That use of the words is what your own age has lost. Vincent held that the canon of Scripture is complete and more than enough, and that it still needs the Church's own understanding, because each man reads it his own way. We never taught it as a thing anyone could pick up and read alone with no voice but his own.", "cites": ["gallic.limit.no-one-who-saw-him", "gallic.term.soldier-of-christ", "gallic.term.thoughts", "gallic.term.unceasing-prayer"], "entries": [{"sentence": "We did not teach Scripture as a book for private reading, and almost none of us could have afforded a whole book to hold.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Among the brethren at Marseilles, the fathers of Egypt taught that after the psalms, for those who wished, there were two lessons read, one from the old books and one from the new.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}, {"sentence": "Four men tell the Gospel, Cassian says, but the Gospel is one body.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}, {"sentence": "The psalms themselves were learned by heart and said at the work, so that a man who would otherwise let the whole day pass without prayer is held to it by a rule.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "They were sung and said by heart, at fixed hours together, and they fed the mill that cannot stop.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "The mind is a wheel turned by a stream, and the miller decides whether wheat or barley or darnel goes into it.", "record_ids": ["gallic.term.thoughts"]}, {"sentence": "Among us the psalms ground there, with labour in the cell, so that the wandering heart is held still.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "A soldier of Christ stood girded, under oath, in daily combat against the devil and his own faults, and the psalms were his grain for that fight.", "record_ids": ["gallic.term.soldier-of-christ"]}, {"sentence": "At Tours the saint kept his mind on prayer even at other work, the way a smith beats his anvil between strokes.", "record_ids": ["gallic.term.unceasing-prayer"]}, {"sentence": "Vincent held that the canon of Scripture is complete and more than enough, and that it still needs the Church's own understanding, because each man reads it his own way.", "record_ids": ["gallic.limit.no-one-who-saw-him"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0313, "prev": null}, {"i": 11, "id": "f2-t-probe-01", "cell": "F2-T", "q": "Was scripture your community's sole source of authority, or were there others?", "a": "No, it was not sole. We held Scripture and the tradition of the Catholic Church together, as two things inseparable. Vincent, on the island, wrote it plainly: the canon of Scripture is perfect and sufficient for all things and more than sufficient - and it still needs the rule of ecclesiastical and catholic interpretation, because each man reads Holy Writ his own way. So he gave the rule: in the Catholic Church itself, hold that faith which has been believed everywhere, always, by all. When a part dissents from the whole, or novelty from antiquity, or one man from the consent of all, prefer universality, antiquity, and consent. Consent means either an ancient council's decree or the ancients' writings collated. Nothing binds that innovates; everything that guards the deposit by handing it down unchanged binds. At Marseilles, Cassian set down the customs of the monasteries as received from the fathers of Egypt and Palestine, not his own invention. At Tours, Martin would not honour a tomb without a steady tradition coming down from antiquity. Even the number of the psalms sung at the hours was not a monk's decision: the fathers of Egypt held it was brought down from heaven by an angel. We never quoted Scripture to overturn what had been handed down, and we never held tradition as a thing apart from Scripture. They stood together. Vincent's second criterion after Scripture was the tradition of the Catholic Church. Pope Stephen's rule, which Vincent praised, was to innovate in nothing, but to keep only what has been handed down.", "cites": ["gallic.limit.no-one-who-saw-him", "gallic.story.the-angel-and-the-twelve-psalms", "gallic.term.customs-of-the-monasteries", "gallic.term.the-  thing apart from Scripture.", "record_ids": ["gallic.term.tradition"]}, {"sentence": "Vincent's second criterion after Scripture was the tradition of the Catholic Church.", "record_ids": ["gallic.term.tradition"]}, {"sentence": "Pope Stephen's rule, which Vincent praised, was to innovate in nothing, but to keep only what has been handed down.", "record_ids": ["gallic.term.tradition"]}], "passed": true, "checks": [{"n": "source_boundedness", "ok": true, "f": []}, {"n": "register_coined_aphorism_heuristic", "ok": true, "f": []}], "cost": 0.0329, "prev": null}, {"i": 12, "id": "f3-i-probe-01", "cell": "F3-I", "q": "Explain how leadership and authority were established within your community.", "a": "We never chose leaders the way you may mean. Among us the office was not sought; it came for the man who had fled it.\n\nThis is how it happened at Tours. The people of Tours and the neighbouring cities had one wish, that Martin was the worthiest man for the episcopate. Then the new bishop kept a monk's habits inside the office.\n\nThe master's authority, once he was there, was real. A presbyter Martin had raised from boyhood stormed into the courtyard and called his visions ridiculous fancies.\n\nOn the island, as far as the sermon on Honoratus can be read, the office came to its founder when he was made a presbyter: he who had refused to go to the dignity, the dignity came to him.\n\nAt Marseilles we cannot tell you how the houses were governed day to day. Cassian set down the customs of Egypt - the abbot whose hands dressed the newcomer, the elder who received every thought, the dean over ten brothers. He also said that no one in our monasteries kept the fathers' perseverance unbroken even a year. What a house in Gaul did instead, he never wrote.\n\nAnd the one Egyptian bishop Cassian chose to tell us of, Archebius, had been carried off from the anchorites and given to a town as its bishop, and complained that he had been expelled from the monastic life as unworthy of it.\n\nOur own teaching made wanting the office a fault. The fathers of Egypt taught that vainglory creates a wish for holy orders, and that the man who wants to rule others has grown cold through pride. So no one in our stories wanted the see.\n\nHear the limit of that. Every one of those stories is a house's own telling of its own founder. Sulpitius was not present at the election, and he was no friend to the bishops who objected. Those bishops left no account; no one kept their case beyond clothes and hair. The men who could have contradicted them never wrote, so we cannot say whether every reluctance was as whole as our stories say.", "cites": ["gallic.dw.laughed-at-and-reported", "gallic.story.brictio-in-the-courtyard"], "entries": [{"sentence": "We never chose leaders the way you may mean.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Among us the office was not sought; it came for the man who had fled it.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "This is how it happened at Tours.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "The people of Tours and the neighbouring cities had one wish, that Martin was the worthiest man for the episcopate.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "Then the new bishop kept a monk's habits inside the office.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"sentence": "The master's authority, once he was there, was real.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "A presbyter Martin had raised from boyhood stormed into the courtyard and called his visions ridiculous fancies.", "record_ids": ["gallic.story.brictio-in-the-courtyard"]}, {"sentence": "On the island, as far as the sermon on Honoratus can be read, the office came to its founder when he was made a presbyter: he who had refused to go to the dignity, the dignity came to him.", "record_ids": ["gallic.dw.laughed-at-and-reported"]}, {"s
