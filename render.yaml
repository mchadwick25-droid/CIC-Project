# Render Blueprint for Church in Conversation.
#
# ONE service: cic-engine (engine/api on Bedrock), which also builds and
# serves cic-poc/frontend same-origin (engine/Dockerfile's frontend
# stage, engine/api/app.py's static mount) - so no separate static site
# and no CORS_ORIGINS.
#
# THE OLD cic-poc SERVICE IS RETIRED. Its entry was removed 2026-08-28 on
# Mark's decision ("yes we can retire the old systems"), completing
# PHASE-1-LAUNCH.md Stage 6: churchinconversation.com's links moved to
# cic-engine 2026-08-25 (PR #54) and the service was suspended in the
# dashboard the same day. Removing the entry here lets the next Blueprint
# sync flag the suspended service for deletion - Render asks for a
# dashboard confirmation before deleting; that confirmation is Mark's
# account action, and the last one open: the Anthropic keys were disabled
# by Mark 2026-08-28 (the account's remaining credit goes to another,
# non-CiC project), so ALL CiC model spend now flows through AWS Bedrock
# alone - one channel, which is exactly what the spec-principle-13
# invoice reconciliation wants. The old pilot's transcripts live in Supabase, a
# separate service this touches not at all. The whole retired entry -
# including its Haiku-switch history and the Supabase-durability
# rationale - is in git history at this file's prior revisions.
#
# This service is Blueprint-managed, so this file - not a manual
# dashboard edit - is the actual source of truth for what runs. A
# dashboard-only change is exactly the failure mode this comment exists
# to prevent.
#
# AWS credentials are marked sync: false on purpose - never committed,
# set in the Render dashboard (Settings -> Environment) after the first
# deploy. engine.provider.bedrock.make_client() reads them via boto3's
# standard credential chain, not a CIC_API_-prefixed var - the exact key
# names Render needs are AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (and
# AWS_SESSION_TOKEN if the identity uses temporary credentials).
# PHASE-1-LAUNCH.md Stage 3's own caution still holds: cic-bedrock-dev is
# a DEV identity - production wants its own, scoped to Bedrock invoke on
# the models actually used. CIC_API_VOICE_MODEL_PATTERN is still left at
# its code default; CIC_API_SAFETY_MODEL_PATTERN is pinned below (Stage
# 0d, Build-Plan.md) to the exact profile id the safety battery was last
# tallied against, not the loose pattern.
#
# TWO SERVICES, one blueprint, D3's promotion model (Repo Structure
# Cleanup phase 3, 2026-09-15 - Ministry/Operations/Standing/
# CiC_Repo_Structure_Tracking.md). `main` is the integration sandbox;
# `live` is the protected branch production actually deploys from,
# advanced only by a deliberate, logged promotion (a reviewed PR from
# `main` into `live`) after tests and Mark's own verification - never a
# direct push. `cic-engine` (prod) pins `branch: live`; `cic-engine-
# staging` pins `branch: main`, so both exist in the same Render
# account without either silently deploying the other's content. This
# supersedes the older single-branch convention this comment used to
# describe - each service's own `branch:` key below is now the source
# of truth for what it deploys, not a dashboard-only setting. Render
# still requires a one-time dashboard step to connect a NEW service
# from this blueprint (Settings -> Blueprints -> sync) and to set its
# own sync: false secrets afterward - that part stays a dashboard
# action, same as it always was for AWS credentials.
#
# Object storage for compiled world packages (WO-1, 2026-09-16 -
# engine/m4/object_storage.py, engine/m4/package_fetch.py). Cloudflare R2,
# same account cic-website already uses - CIC_API_PACKAGE_BUCKET/
# _ENDPOINT/_ACCESS_KEY_ID/_SECRET_ACCESS_KEY are all sync: false, unset
# until Mark completes the one-time R2 setup in
# Ministry/Operations/Standing/CiC_Object_Storage_Runbook.md. Until then
# CIC_API_PACKAGE_BUCKET stays empty and every world loads exactly as it
# always did, straight off this image's own baked-in packages/ - object
# storage is a fallback for a world installed since the last deploy, not
# a replacement for the baked-in set. Both services point at the SAME
# bucket on purpose: a package proven on staging and then promoted needs
# no second upload, it is already sitting where prod's own fetch would
# look.
#
# events.db/usage.db live on the Render Disk below (CIC_API_EVENTS_DB /
# CIC_API_USAGE_DB point at its mount), so they survive restarts and
# redeploys. They were in-container ephemeral storage until 2026-08-28 -
# the same failure shape the retired cic-poc entry once documented for
# its own JSONL transcripts. The disk closed that gap (foundation audit,
# blocker #1): with
# the DB paths at their in-container defaults, EVERY restart and redeploy
# erased every transcript, every gate_decision audit record, and the M8
# cost ledger - and every live session died mid-conversation with
# "invalid session". The deferral was documented and scoped to "a short
# pilot's worth of restarts"; the launch ambition outgrew it. A disk pins
# this service to one instance, which the SQLite session store already
# requires - horizontal scale arrives with the Postgres move, not before.
# Scheduled WITH persistence, not after it: retention/TTL and the
# deletion_requested writer (audit move 6) - persistence without
# retention converts data LOSS into unbounded GROWTH.
#
# Backups (Tech-Readiness Package 2, 2026-09-21 -
# Ministry/Operations/Standing/CiC_Backup_Restore_Runbook.md). The disk
# above is the only copy of events.db/usage.db until this is set up - a
# 1GB Render Disk is not itself a backup target (it IS the primary; a
# backup that lives beside what it backs up protects against nothing).
# engine/api/db_backup.py runs a daily in-process online backup (same
# in-process-daily-thread pattern as engine/m7/scheduler.py and
# engine/m4/idle_close.py, for the same reason: a Render Cron Job or
# one-off Job cannot reach a disk already attached to this service) and
# uploads to a SEPARATE Cloudflare R2 bucket from CIC_API_PACKAGE_BUCKET
# above - these backups carry real participant transcripts and usage
# records, a different sensitivity class from compiled world packages,
# so they get their own credential rather than widening the package
# bucket's own blast radius. sync: false, unset until Mark completes the
# runbook's one-time bucket setup; until then the daily thread backs up
# locally, verifies, and discards without uploading (logged, not fatal -
# same deferred-until-configured pattern CIC_API_PACKAGE_BUCKET already
# uses above).
services:
  - type: web
    name: cic-engine
    branch: live
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    plan: standard
    disk:
      name: cic-engine-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CIC_API_REGION
        value: us-east-1
      - key: CIC_API_EVENTS_DB
        value: /data/cic_api_events.db
      - key: CIC_API_USAGE_DB
        value: /data/cic_api_usage.db
      # Stage 0d (Build-Plan.md): pinned to the EXACT profile id the safety
      # battery's last real tally ran against (engine/m5/reports/safety-
      # script-run-*.json), not left at the loose "us.anthropic.claude-
      # haiku-4-5" pattern (engine/api/config.py's code default), which
      # would silently resolve to whatever dated profile matches that
      # substring at deploy time - including one the battery never ran
      # against. resolve_model_id (engine/provider/bedrock.py) still
      # requires exactly one live match, so this exact id is refused, loud,
      # the day it stops existing in the account rather than quietly
      # drifting. Repin only alongside a fresh --all tally
      # (engine/api/README.md has the full rationale).
      - key: CIC_API_SAFETY_MODEL_PATTERN
        value: us.anthropic.claude-haiku-4-5-20251001-v1:0
      # THE ADMISSION GATE - ON. The doors were opened by Mark, 2026-08-28,
      # in session ("open the doors, flip the switch"), the same day he
      # admitted all six worlds ("yes i admit all six worlds") on the
      # fleet-parity battery's 28/28. The declared deferral this flag
      # carried from birth (spec SS8: "deferrals documented, never hidden";
      # "0" = informed-tester practice serving un-admitted built worlds) is
      # ENDED: from here on only admitted/open worlds are listed or seated,
      # interview and table alike (engine/api/config.py
      # Settings.enforce_admission) - exactly the six the registry admits;
      # the synthetic fixture world is now unreachable in production, as
      # its own registry comment always required.
      - key: CIC_ENFORCE_ADMISSION
        value: "1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # /api/admin/pilot-summary (2026-09-05): a real, random Bearer token
      # Mark sets in the dashboard, never committed - same sync: false
      # pattern as the AWS keys above. Left unset, the route 404s outright
      # (engine.api.app._authenticate_admin); there is no code default to
      # accidentally ship a guessable one.
      - key: CIC_API_ADMIN_TOKEN
        sync: false
      # Anonymous per-visitor daily cap (Tech-Readiness P1-Security item 3,
      # 2026-09-21 - engine/api/anon_cap.py). Declared here, explicitly
      # off, rather than left unset entirely: this is the escalation this
      # package raised (mechanism/numbers proposed, not yet decided by
      # Mark - see that package's Report.md), so the switch should have a
      # visible, reviewable home in config-as-code once he decides, not a
      # dashboard-only toggle nobody else can see the state of. Flipping
      # to "1" also requires setting CIC_API_ANON_VISITOR_SECRET below (any
      # random string) - the app refuses to start otherwise.
      - key: CIC_API_ANON_CAP_ENABLED
        value: "0"
      - key: CIC_API_ANON_VISITOR_SECRET
        sync: false
      - key: CIC_API_PACKAGE_CACHE_DIR
        value: /data/packages-cache
      - key: CIC_API_PACKAGE_BUCKET
        sync: false
      - key: CIC_API_PACKAGE_BUCKET_ENDPOINT
        sync: false
      - key: CIC_API_PACKAGE_BUCKET_ACCESS_KEY_ID
        sync: false
      - key: CIC_API_PACKAGE_BUCKET_SECRET_ACCESS_KEY
        sync: false
      # DB backups (see this file's top-of-file note) - own bucket, own
      # credential, never CIC_API_PACKAGE_BUCKET*'s. Unset until Mark
      # completes CiC_Backup_Restore_Runbook.md's one-time setup.
      - key: CIC_API_BACKUP_BUCKET
        sync: false
      - key: CIC_API_BACKUP_BUCKET_ENDPOINT
        sync: false
      - key: CIC_API_BACKUP_BUCKET_ACCESS_KEY_ID
        sync: false
      - key: CIC_API_BACKUP_BUCKET_SECRET_ACCESS_KEY
        sync: false

  # STAGING (D3, phase 3, 2026-09-15). Deploys every push to `main` -
  # the integration sandbox - so a change is running here before it is
  # ever proposed for promotion into `live`. Same image, same
  # Dockerfile, deliberately smaller plan and its own disk: staging
  # traffic is verification, not participants, and the two services
  # must never share a disk (SQLite, one writer). `CIC_ENFORCE_ADMISSION`
  # is "0" here on purpose, not a staging oversight - Artifact-6 SS3's
  # own original environments split ("staging: fixture world + candidate
  # packages") wants exactly this: a built-but-not-yet-admitted world is
  # testable here before Mark admits it, the same way it never could be
  # if staging enforced the live gate too.
  - type: web
    name: cic-engine-staging
    branch: main
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: cic-engine-staging-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CIC_API_REGION
        value: us-east-1
      - key: CIC_API_EVENTS_DB
        value: /data/cic_api_events.db
      - key: CIC_API_USAGE_DB
        value: /data/cic_api_usage.db
      - key: CIC_ENFORCE_ADMISSION
        value: "0"
      # Same pin, same reason, as cic-engine's own CIC_API_SAFETY_MODEL_
      # PATTERN comment above (Stage 0d, Build-Plan.md) - staging validates
      # against the same tallied model production runs, not a floating
      # pattern that could quietly diverge from it.
      - key: CIC_API_SAFETY_MODEL_PATTERN
        value: us.anthropic.claude-haiku-4-5-20251001-v1:0
      # Own credentials, own scope - never the prod keys pointed at a
      # second service. PHASE-1-LAUNCH.md Stage 3's caution (a DEV
      # identity is not a production one) runs the other direction here:
      # staging should hold the narrower, cheaper-to-rotate identity: no
      # reason for a compromised staging key to reach anything prod's
      # own key can.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CIC_API_ADMIN_TOKEN
        sync: false
      # Same feature, own secret - see cic-engine's own comment above.
      - key: CIC_API_ANON_CAP_ENABLED
        value: "0"
      - key: CIC_API_ANON_VISITOR_SECRET
        sync: false
      - key: CIC_API_PACKAGE_CACHE_DIR
        value: /data/packages-cache
      # Same bucket as cic-engine (see this file's own top-of-file note) -
      # same values, not a separate R2 API token. A compromised staging
      # credential reading a bucket of already-public-ish compiled
      # packages is a different risk shape than a compromised Bedrock
      # key, so this one pattern doesn't need cic-engine's own "never
      # share a credential across services" rule to apply.
      - key: CIC_API_PACKAGE_BUCKET
        sync: false
      - key: CIC_API_PACKAGE_BUCKET_ENDPOINT
        sync: false
      - key: CIC_API_PACKAGE_BUCKET_ACCESS_KEY_ID
        sync: false
      - key: CIC_API_PACKAGE_BUCKET_SECRET_ACCESS_KEY
        sync: false
      # DB backups - own bucket, distinct from BOTH cic-engine's backup
      # bucket AND this service's own CIC_API_PACKAGE_BUCKET above, unlike
      # the package bucket's sharing above: staging's events.db is
      # synthetic verification traffic, never a real participant
      # transcript, and has no legitimate reason to read or write into
      # prod's own backup history - same "own credentials, own scope"
      # reasoning this service's AWS keys already follow, applied here.
      - key: CIC_API_BACKUP_BUCKET
        sync: false
      - key: CIC_API_BACKUP_BUCKET_ENDPOINT
        sync: false
      - key: CIC_API_BACKUP_BUCKET_ACCESS_KEY_ID
        sync: false
      - key: CIC_API_BACKUP_BUCKET_SECRET_ACCESS_KEY
        sync: false
