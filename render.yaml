# Render Blueprint for cic-poc (the conversation table, 6 worlds).
# One Docker service: backend serves the built frontend from the same
# origin (see cic-poc/Dockerfile) — no separate static site needed here.
#
# To deploy: Render dashboard -> New -> Blueprint -> connect this repo.
# Render finds this file automatically at the repo root.
#
# ANTHROPIC_API_KEY and CORS_ORIGINS are marked sync: false on purpose -
# never committed. Set them in the Render dashboard after the first
# deploy assigns a URL (Settings -> Environment).
#
# plan: starter - the real fix for the OOM (status 137) was moving
# index-building out of runtime startup and into the Docker build step
# (see build_indices.py + the Dockerfile's own RUN step) - the runtime
# instance was rebuilding FAISS indices for all 6 worlds from scratch on
# every single boot, which is what actually needed the extra RAM, not
# steady-state serving. Trying starter (512MB, $7/mo - the original
# budget target) first now that the real cause is fixed; only move up
# to standard (2GB, $25/mo) if this still isn't enough.
# This service is Blueprint-managed, so this file - not a manual
# dashboard edit - is the actual source of truth for its plan.
services:
  - type: web
    name: cic-poc
    runtime: docker
    dockerfilePath: ./cic-poc/Dockerfile
    dockerContext: ./cic-poc
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      # Mark's cost decision 2026-08-10: Haiku fleet-wide, with a spending
      # limit set console-side. Sonnet remains one line away as rollback.
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
