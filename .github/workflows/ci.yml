name: CI

# First automated check this project has ever had (2026-08-05 full-system
# review, Engineering P1-3 step 1). Deliberately minimal: two checks that
# are fast, hermetic, and need no secrets or models. A two-click regression
# on atlas-v3.html (P0-3, fixed the same night this workflow was added)
# would have been caught by neither check on its own - that gap is real and
# is Wave 3's Playwright-in-CI item (P1-8), not this workflow's job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Per-job path filtering added 2026-09-10, replacing an earlier
  # workflow-level paths-ignore from the same day. Origin: Mark's GitHub
  # Actions minutes were fully exhausted 10 days into a 30-day billing
  # cycle (3,000/3,000 used, real overage already billed). The first pass
  # (paths-ignore on Ministry/**, **/reports/**, **.md) helped but had two
  # real gaps: (1) it blanket-skipped ALL of Ministry/**, including
  # validate-census's own dependency
  # (Ministry/Features/Atlas-World-Map/Design/tools/validate-census.mjs) -
  # a change to the validator itself would have silently never run the
  # job that exists to catch it; (2) it did nothing for cic-website/-only
  # commits (e.g. support.html copy edits, same day) - none of the 13 jobs
  # below read anything under cic-website/ except validate-census (one
  # file: cic-website/data/world-census.json) and docker-build (which
  # bundles cic-poc/frontend, a different tree entirely), so those commits
  # still paid for the full suite for zero coverage.
  #
  # This replaces the blanket ignore with per-job filters scoped to what
  # each job's own steps actually read (pip installs, pytest paths, the M2
  # restore/staleness targets, the Docker COPY sources) - verified against
  # every job's own steps and its explanatory comment below, not guessed.
  # A commit touching real code still runs everything it should; only
  # commits outside every filtered path (docs, decision logs, worksheet
  # updates, cic-website copy that isn't the census file) skip the suite
  # entirely now.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      frontend: ${{ steps.filter.outputs.frontend }}
      census: ${{ steps.filter.outputs.census }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - 'records/**'
              - 'packages/**'
              - 'fixtures/**'
            frontend:
              - 'cic-poc/frontend/**'
            census:
              - 'cic-website/data/world-census.json'
              - 'Ministry/Features/Atlas-World-Map/Design/tools/validate-census.mjs'

  # Two jobs were removed 2026-08-24: "Repository views current (all six
  # worlds)" (cic-poc/backend) and "Frontend build (tsc + vite build)"
  # (cic-poc/frontend). Not dead weight that crept in - they guarded the
  # deployed prototype, and they were right to exist while it was the
  # product. Mark's ruling that day: cic-poc is being retired along with the
  # Anthropic Console API it calls, and the site is not in use, so no cutover
  # window needs engineering.
  #
  # Nothing current lost coverage. The views job read cic-poc's OWN copy of
  # the records (wrs/views/repository.py resolves records_root under
  # cic-poc/backend/wrs/records/), not the records/ tree the engine compiles
  # from - it checked the old system's data against itself. The frontend job
  # built cic-poc's frontend.
  #
  # cic-poc itself is deliberately NOT deleted here. Its frontend is 48 files
  # and the only participant-facing surface anywhere in this repository; the
  # engine has none. That is worth salvaging on purpose rather than deleting
  # and rediscovering the need. Retiring the directory belongs with the
  # render.yaml repoint and the surface build, in one move, made by whoever
  # builds the replacement.
  validate-census:
    needs: changes
    if: needs.changes.outputs.census == 'true'
    name: Validate world-census.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node Ministry/Features/Atlas-World-Map/Design/tools/validate-census.mjs cic-website/data/world-census.json

  m1-gates-selftest:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 1 of the redesign build (Build-Blueprint.md, branch
    # build/phase-1). The stage-1 gate is exactly this: the gate battery
    # passes the clean fixture world and fails every seeded-defect fixture
    # in fixtures/seeded_defects.yaml, with an inertness check that a gate
    # which never fires anywhere is itself a reported failure. Hermetic on
    # purpose (no textstat/nltk network fetch - see engine/m1/fk.py) so this
    # job needs no secrets and can't flake on an external resource.
    name: M1 gate battery selftest (fixture world)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m pytest engine/m1/tests -q

  prose-primitives:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # engine/prose.py sits under five production modules - the cell keyword
    # corpus, compile-time demonstration tagging, Stage A/B retrieval
    # scoring, and every per-sentence grounding verdict - and until now had
    # no test of its own; it was exercised only sideways through M4's net
    # tests, which check policy rather than the measurement underneath it.
    # Needs m1's requirements because one test loads all six worlds to hold
    # the no-abbreviation-in-prose-fields invariant.
    name: Prose primitives (shared measurement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m pytest engine/tests -q

  stage3-canon-v1:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 3 (Canon v1 as records + sealed held-out admission
    # paraphrases). Named stage3- (not m3-) deliberately: "M3" is the
    # admission-harness MODULE (built at stage 4, its own job below) -
    # different thing, and this repo already has one stage/module name
    # collision (M2=compiler, M3=admission) worth not compounding with a CI
    # job name that reads as the wrong one. The stage-3 gate: every cell has
    # sealed probes before any world answers it (28/28) - and the sealed
    # plaintext stays isolated from every world-build code path, enforced
    # here rather than trusted.
    name: Canon v1 + sealed probe isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m pytest engine/canon/tests -q
      - run: python -m engine.canon.check_seal_isolation

  m3-admission-harness:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 4 (M3 admission harness, Artifact-2 §1's validation/
    # admission/). The stage-4 gate: catches a seeded register defect and a
    # seeded fabrication on the fixture world - the two M3-layer entries in
    # fixtures/seeded_defects.yaml that engine/m1/selftest.py deliberately
    # left "deferred-to-stage-4". This harness runs on FixtureRecordAnswerer
    # (a deterministic, no-model stand-in) - no live model call, no cost;
    # but engine/m3/generation.py imports engine/m4/generation.py (for
    # LiveModelAnswerer), which imports the anthropic SDK at module load
    # time even when it's never called - so this job needs m4's
    # requirements (same reasoning as the m4-event-log job below), not
    # m1's alone, or test collection fails with ModuleNotFoundError.
    name: M3 admission harness (mock, fixture world)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m4/requirements.txt
      # Compiled packages are derived and not in git (see .gitignore); rebuild
      # the pinned ones from records before any job that reads package bytes.
      # restore runs the M2 compiler, so it needs the compiler's own deps
      # (jsonschema for the M1 gates) on top of whatever this job installs.
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m engine.m2.cli restore
      - run: python -m pytest engine/m3/tests -q

  m4-event-log:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Started stage 5 non-model half (Artifact-3's event log/store, session
    # projection, session codes, entrance seal - "resume across two
    # processes incl. accumulator" and "entrance-seal test"). SQLite-backed
    # for dev/test (DECIDABLE - see engine/m4/store.py); real deployment is
    # managed Postgres per Artifact-6. Grew to cover the turn loop
    # (world_loader, generation, grounding, crisis_resources, turn) once the
    # live-model half of stage 5 started - test_turn.py/test_crisis_
    # resources.py are hermetic (a fake client, or no client at all) even
    # though the modules they test make real Bedrock calls when actually
    # run; the real calls themselves are by-hand evidence runs
    # (engine/m4/live_turn_run.py, engine/m4/lazy_load_measure.py), never CI.
    name: M4 event log, projection, entrance seal, resume, turn loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # engine/m4/requirements.txt (not m1's) since test_turn.py imports
      # engine.m4.turn -> engine.m5.live_calls -> anthropic transitively -
      # m1's requirements.txt has no reason to know that and shouldn't.
      - run: pip install -r engine/m4/requirements.txt
      # Compiled packages are derived and not in git (see .gitignore); rebuild
      # the pinned ones from records before any job that reads package bytes.
      # restore runs the M2 compiler, so it needs the compiler's own deps
      # (jsonschema for the M1 gates) on top of whatever this job installs.
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m engine.m2.cli restore
      - run: python -m pytest engine/m4/tests -q

  m5-gate-routing:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 5 (partial). The Facilitator gate's deterministic routing
    # merge and failure/fail-open semantics (Artifact-4 SS3-4) are pure code
    # over already-classified safety/reader outputs - testable without a
    # live model call, unlike the classification calls themselves (blocked
    # on Bedrock access, see Redesign-Spec/BUILD-HANDOFF.md).
    name: M5 Facilitator gate routing + failure semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m pytest engine/m5/tests -q

  provider-seam-unit-tests:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 5 (the model-provider seam, spec principle 16c). CI runs
    # ONLY the mocked unit tests (model-id resolution, usage normalization)
    # - never engine/provider/preflight.py, which makes a real, billed
    # Bedrock call against a live AWS account and needs real credentials CI
    # doesn't have. The preflight is a by-hand, one-time-per-provider check
    # (spec SS7), not a CI job.
    name: Provider seam unit tests (mocked, no live AWS call)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/provider/requirements.txt
      - run: python -m pytest engine/provider/tests -q

  m8-cost-observability:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 6 (M8: usage attribution, parity, cost unit - CiC-
    # Program-Spec.md M8, stage-6 gate: "parity against raw usage shapes;
    # zero unattributed calls; cache economics re-measured and recorded
    # with the band"). CI runs only the hermetic unit tests (attribution,
    # the SQLite log store, the parity check against synthetic raw usage
    # shapes, the cost-unit structure) - never a live Bedrock call. The
    # lapsed-cache-window and real cache-economics re-measurement are
    # by-hand evidence runs (engine/m8/cache_economics_measure.py), same
    # discipline as the safety script and the preflight.
    name: M8 cost & observability unit tests (mocked, no live AWS call)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m8/requirements.txt
      - run: python -m pytest engine/m8/tests -q

  m2-compiler-checks:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added stage 2 (M2 compiler, Artifact-2). Covers two of the stage-2
    # gate's three legs directly: "determinism twice (byte-identical)" and
    # "manifest hash verified by a stub loader" (engine/m2/tests/
    # test_compiler.py). The third leg - staleness - needs a real committed
    # package to recompile against, so it's the separate job below rather
    # than folded in here.
    name: M2 compiler checks (determinism, stub loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      # Compiled packages are derived and not in git (see .gitignore); rebuild
      # the pinned ones from records before any job that reads package bytes.
      # restore runs the M2 compiler, whose deps this job already installs.
      - run: python -m engine.m2.cli restore
      - run: python -m pytest engine/m2/tests -q

  m2-staleness-check:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # The third stage-2 gate leg: recompile every built/admitted/open world
    # from its stored records_commit and check it still produces the package
    # worlds.yaml is pinned to. Needs NO restore step: it compares against
    # each package's committed manifest.json, not against stored bytes.
    # Only fires real work once a world is actually built (packages/fix/**
    # committed, records/worlds.yaml fix.state=built) - until then this job
    # passes trivially by finding zero checkable worlds, which is exactly
    # the "0% fire rate read as health" landmine (Build-Blueprint.md SS6) if
    # nobody ever notices. engine/m2/reports/staleness-report.json is the
    # committed evidence that it found a real world to check, not zero.
    name: M2 staleness sweep (built/admitted/open worlds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m engine.m2.cli staleness-check

  api-tests:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Added: engine/api/ (minimal test backend over the M4/M5 turn loop -
    # HTTP shape only, no new pipeline logic; see
    # /root/.claude/plans/linear-popping-dawn.md). Same discipline as every
    # other job here: a fake Bedrock client + the real committed fixture-
    # world package, never a live AWS call. engine/api/requirements.txt (not
    # m4's) since this job also needs fastapi/uvicorn/httpx on top of
    # everything engine.m4.turn already pulls in transitively.
    name: engine/api tests (mocked Bedrock, fixture world)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/api/requirements.txt
      # Compiled packages are derived and not in git (see .gitignore); rebuild
      # the pinned ones from records before any job that reads package bytes.
      # restore runs the M2 compiler, so it needs the compiler's own deps
      # (jsonschema for the M1 gates) on top of whatever this job installs.
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m engine.m2.cli restore
      - run: python -m pytest engine/api/tests -q

  docker-build:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.frontend == 'true'
    # Added: engine/Dockerfile (PHASE-1-LAUNCH.md Stage 3 - "the container
    # builds"). GitHub Actions runners carry a real Docker daemon; the
    # sandbox this Dockerfile was originally written and verified in does
    # not (no permission to start dockerd), so every individual step it
    # performs was proven working in isolation - pip install, the M2
    # restore + hash verification, the full test suite - but never
    # `docker build` itself. This job is that missing check, gated on every
    # push/PR from here on rather than left a one-time manual step.
    #
    # Deliberately build-only, not run-then-curl-/health: the running
    # container only builds a real app when CIC_API_REGION is set
    # (engine/api/app.py), which resolves model IDs via a live, credentialed
    # Bedrock call at startup - exactly the "never a live AWS call in CI"
    # line every other job here already holds. /health itself is already
    # covered without Docker or AWS by engine/api/tests/test_app.py::
    # test_health (TestClient + fake deps) - that is the right layer for
    # HTTP behavior; this job's job is only "does the image assemble."
    name: Docker build (engine/Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f engine/Dockerfile -t cic-engine .
