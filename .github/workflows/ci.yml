name: CI

# First automated check this project has ever had (2026-08-05 full-system
# review, Engineering P1-3 step 1). Deliberately minimal: two checks that
# are fast, hermetic, and need no secrets or models. A two-click regression
# on atlas-v3.html (P0-3, fixed the same night this workflow was added)
# would have been caught by neither check on its own - that gap is real and
# is Wave 3's Playwright-in-CI item (P1-8), not this workflow's job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-census:
    name: Validate world-census.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node Ministry/Features/Atlas-World-Map/Design/tools/validate-census.mjs cic-website/data/world-census.json

  deploy-views-current:
    # Was "Repository views current (all six worlds)", added 2026-08-09 and
    # pointed at cic-poc/backend. It had failed on EVERY run since
    # 2026-08-14 on three stale files in that tree, which is the worst
    # possible state for a guard: a red job people learn to scroll past.
    # Retargeted 2026-08-17 rather than deleted, because its premise - "a
    # generated view nobody verifies is a stale view" - turned out to be
    # exactly right, just aimed at the wrong tree.
    #
    # cic/deploy/ is generated from cic/records/ by the seven builders
    # below, and NOTHING was checking it. When this job was first pointed
    # here it found 70 files drifted across all six worlds: quotes.json
    # missing 12 of 27 licensed quotes (imperial_juridical carried 1 of its
    # 11), repository.json missing whole source records, and story chunks
    # still holding pre-readability-pass sentences the records had since
    # been edited out of. The runtime serves that directory, and the
    # Dockerfile builds its FAISS indices from it, so stale here means
    # stale in what a participant is actually given.
    #
    # No --check mode is needed on the builders: regenerate, then ask git
    # whether anything moved. A dirty tree IS the failure, and the diff in
    # the log is the report.
    name: Deploy views current (all six worlds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # textstat is NOT optional despite this job touching no models: a
      # term record's Level 2 face runs through plain_explanation, which
      # readability-checks its own output. nltk's cmudict is what textstat
      # counts syllables through, and pip does not install it with the
      # package.
      - run: pip install pyyaml textstat nltk
      - run: python -c "import nltk; nltk.download('cmudict')"
      # Four builders run once over all worlds; three take --world and are
      # looped. Kept as an explicit list rather than a glob so that adding
      # a builder is a deliberate edit here - a new generator that silently
      # never runs would recreate exactly the gap this job exists to close.
      - name: Regenerate every deploy view
        working-directory: cic/engine
        run: |
          set -euo pipefail
          for g in build_figure_registry build_quotes_index build_repository \
                   mechanism_dependencies; do
            echo "--- $g"
            python "$g.py"
          done
          for w in alexandria desert hieronymian imperial_juridical pahc syriac; do
            for g in build_capsule build_chunks build_prompt; do
              echo "--- $g --world $w"
              python "$g.py" --world "$w"
            done
          done
      - name: Views must already match their records
        run: |
          if ! git diff --quiet -- cic/deploy/; then
            echo "::error::cic/deploy/ is stale - these views no longer match cic/records/."
            echo "Regenerate locally (see the step above) and commit the result."
            git --no-pager diff --stat -- cic/deploy/
            exit 1
          fi
          echo "cic/deploy/ is current with cic/records/."

  clean-tree-checks:
    # Added 2026-08-15 (Tier 3, T3-C). Until now the cic/ tree had NO CI at
    # all - every job above runs against cic-poc/. The clean tree is where
    # the records, the engine and the runtime actually live, and its three
    # exit-code-returning checks (schema validation, old-tree isolation, the
    # gate battery) had to be remembered by hand. Nothing ran them.
    #
    # The gate step is a RATCHET, not a floor. The six worlds carry ~193
    # pre-existing violations; failing on any violation would be red on the
    # first run and every run after, and a permanently-red check is one
    # people learn to ignore. --check fails only when a gate rises above its
    # committed per-world baseline (cic/engine/gate_baseline.json), or when a
    # world has no baseline at all. Existing violations stay visible and do
    # not block; new ones cannot land silently.
    #
    # Advisory findings (mechanism_coverage, per Mark's 2026-08-15 decision;
    # readability, per Mark's 2026-08-16 decision) are excluded by
    # construction and can never fail this job - verified by taking a
    # world's last quote record away and confirming the job stays green
    # while the coverage report shows the loss.
    name: Clean tree (schema + isolation + gate ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # jsonschema for validate.py's per-type validation, pyyaml for
      # front-matter parsing. textstat is now required (2026-08-16, T3
      # follow-on): gate_voice_readability is wired into GATES and calls
      # readability_check, which hard-fails on import if textstat is
      # missing rather than silently reporting a false pass - the same
      # discipline repository-views-current already follows above.
      - run: pip install pyyaml jsonschema textstat
      # textstat counts syllables through nltk's cmudict corpus, which pip
      # does not install with the package. Added 2026-08-17 after the
      # two-move readability split's first calibration run died on the
      # missing corpus locally; gates.readability_check now raises an
      # actionable LookupError instead of nltk's forty-line one, and this
      # step is what keeps the runner from ever needing to read it.
      - run: python -c "import nltk; nltk.download('cmudict')"
      - run: python cic/engine/validate.py
      - run: python cic/checks/isolation.py
      # Proves each gate still passes a clean fixture and fails its seeded
      # defects - and that every gate HAS fixtures. Runs before --check
      # deliberately: a green ratchet means nothing if the gates behind it
      # have quietly stopped firing.
      - run: python cic/engine/run_gates.py --selftest
      - run: python cic/engine/run_gates.py --check

  runtime-tests:
    # Added 2026-08-17. clean-tree-checks above covers cic/'s records,
    # schema and gates; nothing ran the runtime's own tests, because until
    # now there were none - cic/runtime/tests/ did not exist, while
    # nodes.py cited tests/test_transcript_window_isolation.py and
    # events.py cited app/graph/replay/state_parity.py. The claims lived in
    # docstrings and nothing checked them.
    #
    # Its own job rather than a step inside clean-tree-checks: that job is
    # about records and gates, this one is about serving behaviour, and a
    # red result should say which without anyone reading the log. They also
    # run in parallel.
    #
    # GATING, not advisory. readability and mechanism_coverage are excluded
    # from the ratchet above because they are judgement calls over a corpus
    # carrying known violations. These are neither: they assert on prompt
    # assembly, which is pure Python, and they are deterministic, hermetic
    # and fast - 9 tests, ~0.5s, no models, no secrets, no network, no API
    # key. Verified green in a clean venv with exactly the dependencies
    # below BEFORE this job was added, which is the check
    # repository-views-current learned to do the hard way.
    #
    # If this job ever goes red for an environment reason rather than a
    # code reason, that is a bug in tests/conftest.py, which is written to
    # skip rather than fail when a dependency is genuinely absent.
    name: Runtime tests (prompt assembly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cic/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light dependencies only, by design. The serving stack (torch,
      # FAISS, sentence-transformers) is stubbed in conftest.py so
      # app.graph.nodes can be imported at all; nothing on the
      # prompt-assembly path is faked. Installing the real ones would add
      # minutes to every PR to exercise code these tests deliberately do
      # not reach.
      - run: pip install pytest langgraph langchain-core pydantic-settings pyyaml
      - run: python -m pytest tests/ -q

  frontend-typecheck:
    name: Frontend build (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cic-poc/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cic-poc/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
