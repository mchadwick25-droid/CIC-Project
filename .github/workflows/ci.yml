name: CI

# First automated check this project has ever had (2026-08-05 full-system
# review, Engineering P1-3 step 1). Deliberately minimal: two checks that
# are fast, hermetic, and need no secrets or models. A two-click regression
# on atlas-v3.html (P0-3, fixed the same night this workflow was added)
# would have been caught by neither check on its own - that gap is real and
# is Wave 3's Playwright-in-CI item (P1-8), not this workflow's job.

# Job-count/draft-PR consolidation, 2026-09-23. Origin: real GitHub Actions
# billing overage ($75 over the plan this cycle by 14:00Z), diagnosed via
# the runs API against a real full run (main 9da9bec5): actual runner time
# per full run is ~14 minutes, but ~20 minutes are BILLED, because GitHub
# rounds every individual job up to a whole minute and this file split the
# engine suite into 11 separate ~20-70-second jobs - each one pays a full
# minute's overhead (checkout, python setup, pip install) it didn't need.
# The 2026-09-10 concurrency group and per-job path filters (both still
# above) already cut wasted RUNS; this cut is about jobs-per-run instead.
#
# Two changes, both preserving every existing check on every trigger it
# already had - nothing dropped, nothing silently narrowed:
#
# 1. Eleven jobs that all shared the identical `engine == 'true'` gate
#    (M1 selftest, prose primitives, canon v1, M3, M4, M5, provider seam,
#    M8, M2 compiler checks, M6 census sync, engine/api tests) are folded
#    into one `engine-tests` job, one checkout/setup instead of eleven.
#    Verified job-by-job before merging: all eleven used that exact same
#    single condition, not a superset, so nothing now runs on a trigger it
#    didn't before. `engine.m2.cli restore` (needed by M3/M4/api-tests/M2
#    compiler checks) now runs once instead of four times - safe because
#    the compiler is deterministic (M2's own gate: "byte-identical" twice).
#    M2 staleness and M9 confinement were deliberately NOT folded in here:
#    both share a DIFFERENT, wider condition (`engine == 'true' || library
#    == 'true'`) from the other eleven's `engine`-only gate. Merging them
#    into `engine-tests` would have force-widened M1/prose/canon/etc. onto
#    library-only commits they don't currently run on - a real coverage
#    change, not just a cost one. They get their own merged job instead
#    (`staleness-and-confinement`), so both keep their own original,
#    narrower-than-`engine-tests` trigger exactly as it was.
#
# 2. Draft PRs (this project's own working pattern - see e.g. #435-#438,
#    opened draft specifically to iterate without paying for full CI) now
#    run only the cheap checks (Detect changed paths, Cited paths resolve,
#    Validate census) while still draft. `engine-tests`, `docker-build`,
#    and `frontend-tests` - the three genuinely expensive jobs - gain
#    `&& (github.event_name != 'pull_request' || github.event.pull_request.
#    draft == false)`: still unconditional on every push (main/live have
#    no `draft` field to check), gated to non-draft only on pull_request
#    events. `ready_for_review` is added to this workflow's own
#    `pull_request:` types so marking a PR ready actually fires the full
#    run rather than silently waiting for the next push. `staleness-and-
#    confinement`, `site-staleness-check`, and `no-embedded-world-data`
#    are deliberately left un-gated by draft status - not asked for, and
#    changing their trigger wasn't this change's brief.
#
# Renamed checks change what branch protection's required-checks list
# needs to reference - the PR that carries this documents the exact
# before/after names. This change does not touch branch-protection
# settings itself, or repin-on-library-change.yml.

on:
  push:
    branches: [main, live]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Added 2026-09-10 alongside the path-filter and caching changes below, same
# minutes-exhaustion root cause: without this, a PR pushed to twice in quick
# succession runs both CI attempts to completion and pays for both, even
# though only the second push's result ever matters for merge. Scoped to
# workflow+ref so pushes to main (which don't share a PR) still each get
# their own group and never cancel a sibling branch's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-job path filtering added 2026-09-10, replacing an earlier
  # workflow-level paths-ignore from the same day. Origin: Mark's GitHub
  # Actions minutes were fully exhausted 10 days into a 30-day billing
  # cycle (3,000/3,000 used, real overage already billed). The first pass
  # (paths-ignore on Ministry/**, **/reports/**, **.md) helped but had two
  # real gaps: (1) it blanket-skipped ALL of Ministry/**, including
  # validate-census's own dependency
  # (tools/validate-census.mjs) -
  # a change to the validator itself would have silently never run the
  # job that exists to catch it; (2) it did nothing for cic-website/-only
  # commits (e.g. support.html copy edits, same day) - none of the 13 jobs
  # below read anything under cic-website/ except validate-census (one
  # file: cic-website/data/world-census.json) and docker-build (which
  # bundles cic-poc/frontend, a different tree entirely), so those commits
  # still paid for the full suite for zero coverage.
  #
  # This replaces the blanket ignore with per-job filters scoped to what
  # each job's own steps actually read (pip installs, pytest paths, the M2
  # restore/staleness targets, the Docker COPY sources) - verified against
  # every job's own steps and its explanatory comment below, not guessed.
  # A commit touching real code still runs everything it should; only
  # commits outside every filtered path (docs, decision logs, worksheet
  # updates, cic-website copy that isn't the census file) skip the suite
  # entirely now.
  #
  # Every filter below also matches .github/workflows/** - deliberately: a
  # change to this file that touched only the workflow itself would
  # otherwise satisfy none of the path categories below and skip every
  # downstream job, which is wrong twice over. First, a workflow-file
  # change is exactly the kind of change that most needs the suite it
  # edits to actually run, to prove the edit didn't break anything.
  # Second, main is branch-protected (discovered 2026-09-10, not set by
  # this change) requiring "11 of 11" status checks before merge - a PR
  # that could only ever produce skipped checks for its own file would be
  # permanently unmergeable, which is worse than merely wasteful.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 calls the GitHub API's listFiles on pull_request
    # events (not a local git diff), which needs pull-requests: read. An
    # explicit permissions: block REPLACES the default token grant entirely,
    # so contents: read (needed by actions/checkout below) must be restated
    # here too, not just the new scope. Diagnosed 2026-09-10 against the
    # identical failure this workflow's own earlier paths-filter attempt hit
    # on PR #144 (commit d683c9ae): "Resource not accessible by integration"
    # from this same API call, same missing scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      frontend: ${{ steps.filter.outputs.frontend }}
      census: ${{ steps.filter.outputs.census }}
      library: ${{ steps.filter.outputs.library }}
      worldgates: ${{ steps.filter.outputs.worldgates }}
      site: ${{ steps.filter.outputs.site }}
      crossworld: ${{ steps.filter.outputs.crossworld }}
      checkertests: ${{ steps.filter.outputs.checkertests }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - 'records/**'
              - 'packages/**'
              - 'fixtures/**'
              # engine/m1/cross_world.py reads the census (check_census_link); a
              # census-only change reverted Donatism's card on 2026-09-12 and
              # turned main's M1 selftest red without this job ever running.
              - 'cic-website/data/world-census.json'
              - '.github/workflows/**'
            frontend:
              - 'cic-poc/frontend/**'
              - '.github/workflows/**'
            census:
              - 'cic-website/data/world-census.json'
              - 'tools/validate-census.mjs'
              - '.github/workflows/**'
            # Library Access Gate D3 SS6.3 (increment 5): a corpus-map or
            # vendored-text-only change is neither `engine/**` nor
            # `records/**` and would otherwise run no CI at all. Deliberately
            # narrow (just the staleness-and-confinement job below, not the
            # full engine-tests battery) - the 2026-09-10 minutes exhaustion
            # is why this budget discipline exists.
            library:
              - 'cic/**'
              - '.github/workflows/**'
            # Everything a world's build gates read: its records, compiled
            # packages, the engine that gates them, and its build documents.
            # A draft PR that touches any of these still runs the world
            # gates; a draft that touches none of them skips the heavy jobs.
            worldgates:
              - 'records/**'
              - 'packages/**'
              - 'engine/**'
              - 'Build/worlds/**'
              - '.github/workflows/**'
            # Website V2 world_front design (approved to proceed
            # 2026-09-19): the website compiler stage's own two jobs
            # below (site-staleness-check, no-embedded-world-data) read
            # cic-website/** directly, plus records/** and engine/**
            # (the world_front record type and its compiler live there).
            # Deliberately its own filter rather than folded into
            # `engine` above: a cic-website/**-only change (e.g. a
            # tradition-page copy edit) has no reason to run the
            # engine-tests battery, the same budget discipline `library`
            # above already exists for.
            site:
              - 'cic-website/**'
              - 'records/**'
              - 'engine/**'
              - '.github/workflows/**'
            # gen_needs_ruling.py's own test suite (Build/worlds/_cross-world/
            # tests_gen_needs_ruling.py) previously ran nowhere in CI - a
            # change to the generator or to its hand-maintained-tail
            # preservation could regress without any check catching it.
            # Also fires on a corpus-map change, since the generator's
            # end-to-end test runs against the real cic/corpus-map/ data.
            crossworld:
              - 'Build/worlds/_cross-world/**'
              - 'cic/corpus-map/**'
              - '.github/workflows/**'
            # tools/check_live_commentary.py's own test suite
            # (tools/tests/test_check_live_commentary.py) previously ran
            # nowhere in CI - the same gap crossworld above closed for
            # gen_needs_ruling.py.
            checkertests:
              - 'tools/**'
              - '.github/workflows/**'
            # docker-build on pull_request runs only for changes that can
            # break image assembly (the Dockerfile itself, the pinned
            # requirement files it installs, the frontend it builds, the M2
            # restore it runs). Every push to main/live still builds.
            docker:
              - 'engine/Dockerfile'
              - '.dockerignore'
              - 'engine/api/requirements.txt'
              - 'engine/m1/requirements.txt'
              - 'engine/m2/**'
              - 'cic-poc/frontend/**'
              - '.github/workflows/**'

  # Two jobs were removed 2026-08-24: "Repository views current (all six
  # worlds)" (cic-poc/backend) and "Frontend build (tsc + vite build)"
  # (cic-poc/frontend). Not dead weight that crept in - they guarded the
  # deployed prototype, and they were right to exist while it was the
  # product. Mark's ruling that day: cic-poc is being retired along with the
  # Anthropic Console API it calls, and the site is not in use, so no cutover
  # window needs engineering.
  #
  # Nothing current lost coverage. The views job read cic-poc's OWN copy of
  # the records (wrs/views/repository.py resolves records_root under
  # cic-poc/backend/wrs/records/), not the records/ tree the engine compiles
  # from - it checked the old system's data against itself. The frontend job
  # built cic-poc's frontend.
  #
  # cic-poc itself is deliberately NOT deleted here. Its frontend is 48 files
  # and the only participant-facing surface anywhere in this repository; the
  # engine has none. That is worth salvaging on purpose rather than deleting
  # and rediscovering the need. Retiring the directory belongs with the
  # render.yaml repoint and the surface build, in one move, made by whoever
  # builds the replacement.
  validate-census:
    needs: changes
    if: needs.changes.outputs.census == 'true'
    name: Validate world-census.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/validate-census.mjs cic-website/data/world-census.json

  # Added by the Repo Structure Cleanup thread (Build/Ministry/Operations/Standing/
  # CiC_Repo_Structure_Tracking.md, 2026-09-14). Fails when a repo-relative path
  # cited in a current Markdown document no longer resolves, or when a
  # directory retired by the reorganization reappears (tools/retired_paths.txt)
  # - a branch that merely adds a file under an old path merges without
  # conflict and silently resurrects it. Pre-existing breaks are accepted in
  # tools/check_paths_baseline.txt and burned down by their owning threads; a
  # baseline entry that starts resolving is reported so it can be removed.
  # Not gated on the `changes` filter on purpose: it reads only .md files,
  # needs no dependencies, and costs seconds - and a docs-only commit is
  # exactly the kind that breaks a path.
  check-paths:
    name: Cited paths resolve; retired paths absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_paths.py --baseline tools/check_paths_baseline.txt

  # Commentary in a live or canonical surface (CLAUDE.md, "Keep the
  # live/canonical surfaces clean"). On a pull request the check is blocking
  # and scoped to the files the PR adds or edits: a PR that edits a live file
  # also removes the commentary already in it (REWRITE and ROUTE lines fail;
  # KEEP and PROTECTED never do). Files the PR does not touch are not
  # scanned. On a push the whole tree is scanned and reported only.
  live-commentary:
    name: Live-surface commentary (files this PR edits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: github.event_name == 'pull_request'
        run: python tools/check_live_commentary.py --base "origin/${{ github.base_ref }}" --enforce
      - if: github.event_name != 'pull_request'
        run: python tools/check_live_commentary.py

  # A PR that touches a world's records or its build documents runs that
  # world's after-edit gates: required record types and the site JSON with no
  # waiver for them on a new world, readability and the voice-craft budget on
  # every new or edited public-facing field. Runs on draft PRs too.
  world-gates:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.worldgates == 'true'
    name: World gates (records, regate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/m1/requirements.txt
      - run: pip install -r engine/m1/requirements.txt
      - name: Gate every world this PR changes
        run: |
          base="origin/${{ github.base_ref }}"
          merge_base="$(git merge-base "$base" HEAD)"
          codes="$(git diff --name-only "$merge_base" HEAD -- records \
            | awk -F/ 'NF > 2 && $2 != "_fleet" && $2 != "worlds" {print $2}' | sort -u)"
          status=0
          for code in $codes; do
            echo "== $code"
            python -m engine.m10.cli records "$code" || status=1
            python -m engine.m10.cli regate "$code" --base "$base" || status=1
          done
          exit $status

  # The Library's own validators: the corpus map merge, the passage index,
  # the works and author registries, the vendored-text registry, and the
  # corpus test scripts. The tests_corpus_*.py scripts run their checks at
  # import and exit non-zero on failure, so they are invoked directly.
  library-validators:
    needs: changes
    if: needs.changes.outputs.library == 'true' || needs.changes.outputs.engine == 'true'
    name: Library validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/m1/requirements.txt
      - run: pip install -r engine/m1/requirements.txt
      - run: python cic/engine/corpus_map_merge.py --check
      - run: python cic/engine/corpus_index.py --build
      - run: python cic/engine/works_registry.py --check
      - run: python cic/engine/author_ids.py --check
      - run: python cic/engine/texts_registry.py
      - run: python cic/engine/tests_corpus_index.py
      - run: python cic/engine/tests_corpus_structure.py
      # tests_corpus_map.py fails four checks on the current corpus map. The
      # step is visible but does not block until the map is repaired; the
      # entry dated 2026-09-29 in Build/Ministry/Operations/Standing/
      # CiC_System_Health_Tracking.md owns the defect.
      - run: python cic/engine/tests_corpus_map.py
        continue-on-error: true

  # Merged 2026-09-23 (see the top-of-file comment): eleven jobs that all
  # shared the identical `engine == 'true'` gate, folded into one
  # checkout/setup instead of eleven. Each sub-suite's own steps are
  # unchanged and kept in their original relative order; `engine.m2.cli
  # restore` runs once at the top instead of once per sub-job that needed
  # it (M3, M4, M2 compiler checks, engine/api tests) - safe since the
  # compiler is deterministic (M2's own gate: byte-identical twice). Draft
  # PRs run it only when they touch records, packages, engine or world build
  # documents (`worldgates`); unconditional on push.
  engine-tests:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || needs.changes.outputs.worldgates == 'true')
    name: Engine test suite (M1-M6, M8, provider, canon, prose, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/m1/requirements.txt
            engine/m4/requirements.txt
            engine/provider/requirements.txt
            engine/m8/requirements.txt
            engine/api/requirements.txt
      # Every sub-suite's own requirements, installed once each (all use
      # >= minimum pins with no conflicting upper bounds - checked before
      # merging). m1's first: the compiler restore below needs its
      # jsonschema dependency.
      - run: pip install -r engine/m1/requirements.txt
      - run: pip install -r engine/m4/requirements.txt
      - run: pip install -r engine/provider/requirements.txt
      - run: pip install -r engine/m8/requirements.txt
      - run: pip install -r engine/api/requirements.txt
      # Compiled packages are derived and not in git (see .gitignore);
      # rebuild the pinned ones from records once, up front - M3, M4, M2
      # compiler checks, and engine/api tests below all read package bytes
      # and previously each ran this same deterministic step separately.
      - run: python -m engine.m2.cli restore

      # M1 gate battery selftest (fixture world). Added stage 1 of the
      # redesign build (Build-Blueprint.md, branch build/phase-1). The
      # stage-1 gate is exactly this: the gate battery passes the clean
      # fixture world and fails every seeded-defect fixture in
      # fixtures/seeded_defects.yaml, with an inertness check that a gate
      # which never fires anywhere is itself a reported failure. Hermetic
      # on purpose (no textstat/nltk network fetch - see engine/m1/fk.py).
      - run: python -m pytest engine/m1/tests -q

      # Prose primitives (shared measurement). engine/prose.py sits under
      # five production modules - the cell keyword corpus, compile-time
      # demonstration tagging, Stage A/B retrieval scoring, and every
      # per-sentence grounding verdict - and until now had no test of its
      # own; it was exercised only sideways through M4's net tests, which
      # check policy rather than the measurement underneath it. One test
      # loads all six worlds to hold the no-abbreviation-in-prose-fields
      # invariant.
      - run: python -m pytest engine/tests -q

      # Canon v1 + sealed probe isolation. Added stage 3 (Canon v1 as
      # records + sealed held-out admission paraphrases). The stage-3
      # gate: every cell has sealed probes before any world answers it
      # (28/28) - and the sealed plaintext stays isolated from every
      # world-build code path, enforced here rather than trusted.
      - run: python -m pytest engine/canon/tests -q
      - run: python -m engine.canon.check_seal_isolation

      # M3 admission harness (mock, fixture world). Added stage 4 (M3
      # admission harness, Artifact-2 SS1's validation/admission/). The
      # stage-4 gate: catches a seeded register defect and a seeded
      # fabrication on the fixture world - the two M3-layer entries in
      # fixtures/seeded_defects.yaml that engine/m1/selftest.py
      # deliberately left "deferred-to-stage-4". Runs on
      # FixtureRecordAnswerer (a deterministic, no-model stand-in) - no
      # live model call, no cost.
      - run: python -m pytest engine/m3/tests -q

      # M4 event log, projection, entrance seal, resume, turn loop.
      # Started stage 5 non-model half (Artifact-3's event log/store,
      # session projection, session codes, entrance seal). Grew to cover
      # the turn loop (world_loader, generation, grounding,
      # crisis_resources, turn) once the live-model half of stage 5
      # started - hermetic (a fake client, or no client at all) even
      # though the modules under test make real Bedrock calls when
      # actually run; the real calls themselves are by-hand evidence
      # runs, never CI.
      - run: python -m pytest engine/m4/tests -q

      # M5 Facilitator gate routing + failure semantics. Added stage 5
      # (partial). The Facilitator gate's deterministic routing merge and
      # failure/fail-open semantics (Artifact-4 SS3-4) are pure code over
      # already-classified safety/reader outputs - testable without a
      # live model call.
      - run: python -m pytest engine/m5/tests -q

      # Provider seam unit tests (mocked, no live AWS call). Added stage 5
      # (the model-provider seam, spec principle 16c). CI runs ONLY the
      # mocked unit tests (model-id resolution, usage normalization) -
      # never engine/provider/preflight.py, which makes a real, billed
      # Bedrock call and needs real credentials CI doesn't have.
      - run: python -m pytest engine/provider/tests -q

      # M8 cost & observability unit tests (mocked, no live AWS call).
      # Added stage 6 (M8: usage attribution, parity, cost unit). CI runs
      # only the hermetic unit tests - never a live Bedrock call.
      - run: python -m pytest engine/m8/tests -q

      # Go Deeper meter and claim stores (standard library only; imports
      # nothing from the conversation engine).
      - run: python -m pytest engine/deeper/tests -q

      # M7 audit and per-turn readability; M10 build gates.
      - run: python -m pytest engine/m7 -q
      - run: python -m pytest engine/m10 -q

      # M2 compiler checks (determinism, stub loader). Added stage 2 (M2
      # compiler, Artifact-2). Covers two of the stage-2 gate's three legs
      # directly: "determinism twice (byte-identical)" and "manifest hash
      # verified by a stub loader". The third leg - staleness - needs a
      # real committed package to recompile against; see
      # staleness-and-confinement below.
      - run: python -m pytest engine/m2/tests -q

      # M6 census sync check (Atlas connection). The Atlas connection
      # (Build-Blueprint.md row 8): world-census.json's registry-derivable
      # fields must be generated from records/worlds.yaml, never
      # hand-synced. Fails if the committed census has drifted from what
      # engine.m6.census_sync would produce - run `python -m engine.m6.cli
      # sync` locally and commit the result to fix.
      - run: python -m pytest engine/m6/tests -q
      - run: python -m engine.m6.cli check

      # engine/api tests (mocked Bedrock, fixture world). A fake Bedrock
      # client + the real committed fixture-world package, never a live
      # AWS call.
      - run: python -m pytest engine/api/tests -q
      # The same suite again with Go Deeper mounted on every test app.
      - run: CIC_TEST_DEEPER=1 python -m pytest engine/api/tests -q

  # M2 staleness and M9 confinement, merged 2026-09-23 (see top-of-file
  # comment). Deliberately kept separate from engine-tests above: both
  # share the WIDER `engine == 'true' || library == 'true'` condition (not
  # `engine`-only), so folding them into engine-tests would have
  # force-widened M1/prose/canon/etc. onto library-only commits they don't
  # currently run on. Draft PRs run it under the same `worldgates` rule as
  # engine-tests; unconditional on push.
  staleness-and-confinement:
    needs: changes
    if: (needs.changes.outputs.engine == 'true' || needs.changes.outputs.library == 'true' || needs.changes.outputs.worldgates == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || needs.changes.outputs.worldgates == 'true')
    name: M2 staleness + M9 confinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/m1/requirements.txt
      - run: pip install -r engine/m1/requirements.txt

      # M2 staleness sweep (built/admitted/open worlds). The third
      # stage-2 gate leg: recompile every built/admitted/open world from
      # its stored records_commit and check it still produces the package
      # worlds.yaml is pinned to. Needs NO restore step: it compares
      # against each package's committed manifest.json, not against
      # stored bytes. Only fires real work once a world is actually built
      # (packages/fix/** committed, records/worlds.yaml fix.state=built) -
      # until then this job passes trivially by finding zero checkable
      # worlds, which is exactly the "0% fire rate read as health"
      # landmine (Build-Blueprint.md SS6) if nobody ever notices.
      # engine/m2/reports/staleness-report.json is the committed evidence
      # that it found a real world to check, not zero.
      - run: python -m engine.m2.cli staleness-check

      # M9 confinement (compiled shelf; M1+M9 findings vs waivers).
      # Library Access Gate D3 (Build/Ministry/Features/Library-Access-Gate/
      # D3-Converged-Design.md) increment 4 (Q3), blocking: pytest covers
      # the confinement battery's own tests, the M9 selftest (mirrors
      # engine/m1/selftest.py's own contract) and enforce.py's
      # waiver-hygiene tests; `engine.m9.cli check` then runs both gate
      # batteries against every built/admitted/open world on disk and
      # fails the run on any un-waived finding, stale or expired waiver,
      # or waiver naming a world grandfathering has closed to (SS4.2).
      # ACCEPTED_OPEN in engine/m9/enforce.py is the waiver list Mark
      # reads before merge. The `library` path-filter group (increment 5,
      # SS6.3) runs this whole job via the wider condition above - a
      # corpus-map or vendored-text-only change is neither `engine/**` nor
      # `records/**` and would otherwise run no CI at all.
      - run: python -m pytest engine/m9/tests -q
      - run: python -m engine.m9.cli check

  # gen_needs_ruling.py generates Build/worlds/_cross-world/NEEDS-RULING.md from
  # cic/corpus-map/; its hand-maintained-tail preservation (everything below
  # HAND_MAINTAINED_MARKER survives a regeneration verbatim, and a run
  # refuses to write if an existing file has lost the marker) is proven by
  # Build/worlds/_cross-world/tests_gen_needs_ruling.py, which had nowhere in this
  # workflow that collected it. NOT folded into engine-tests: that job's
  # requirements install anthropic/boto3/jsonschema this suite doesn't need,
  # and its `engine`-only path filter wouldn't fire on a Build/worlds/_cross-world/
  # or cic/corpus-map/-only change anyway.
  cross-world-tests:
    needs: changes
    if: needs.changes.outputs.crossworld == 'true'
    name: Cross-world needs-ruling generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml pytest
      - run: python -m pytest Build/worlds/_cross-world/tests_gen_needs_ruling.py -q

  # tools/check_live_commentary.py's own test suite (tools/tests/
  # test_check_live_commentary.py: the 60+ hand-labelled sample, its
  # precision/recall measurement, and one test per classifier refinement)
  # had nowhere in this workflow that collected it - the same gap
  # cross-world-tests above closed for gen_needs_ruling.py. The module's
  # own import of engine.m1.spoken_fields needs no extra install (stdlib
  # dataclasses only).
  checker-tests:
    needs: changes
    if: needs.changes.outputs.checkertests == 'true'
    name: Live-surface commentary checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest
      - run: python -m pytest tools/tests/test_check_live_commentary.py tools/tests/test_check_live_commentary_scope.py tools/tests/test_check_paths.py -q

  docker-build:
    needs: changes
    if: github.event_name == 'push' || (needs.changes.outputs.docker == 'true' && github.event.pull_request.draft == false)
    # Added: engine/Dockerfile (PHASE-1-LAUNCH.md Stage 3 - "the container
    # builds"). GitHub Actions runners carry a real Docker daemon; the
    # sandbox this Dockerfile was originally written and verified in does
    # not (no permission to start dockerd), so every individual step it
    # performs was proven working in isolation - pip install, the M2
    # restore + hash verification, the full test suite - but never
    # `docker build` itself. This job is that missing check, gated on every
    # push/PR from here on rather than left a one-time manual step.
    #
    # Deliberately build-only, not run-then-curl-/health: the running
    # container only builds a real app when CIC_API_REGION is set
    # (engine/api/app.py), which resolves model IDs via a live, credentialed
    # Bedrock call at startup - exactly the "never a live AWS call in CI"
    # line every other job here already holds. /health itself is already
    # covered without Docker or AWS by engine/api/tests/test_app.py::
    # test_health (TestClient + fake deps) - that is the right layer for
    # HTTP behavior; this job's job is only "does the image assemble."
    #
    # On pull_request: runs only for non-draft PRs whose changes match the
    # `docker` filter above. On push (main/live): always.
    name: Docker build (engine/Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Was a plain `docker build`, rebuilding every layer from scratch on
      # every run. Switched to buildx with the GitHub Actions cache backend
      # (2026-09-10, same minutes-exhaustion cleanup as the path filters and
      # pip caching above) so a run where the Dockerfile and its COPY
      # sources haven't changed reuses cached layers instead of reinstalling
      # everything. Still build-only (push: false) - same "does the image
      # assemble" scope as before, no behavior change.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          tags: cic-engine:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Build-Plan.md Stage 3c: "Add vitest + @testing-library/react, a test
    # script, and a frontend-tests CI job in .github/workflows/ci.yml gated
    # on the existing frontend path filter." tsc --noEmit is the same type
    # check `npm run build` runs first; `npm test` (vitest run) is
    # everything under src/**/*.test.tsx, hermetic (jsdom, no live API, no
    # model call) - same "never a live call in CI" discipline every other
    # job here already holds.
    #
    # Draft-gated 2026-09-23 (see top-of-file comment #2) on pull_request
    # events only - still unconditional on push, since push events have no
    # `draft` field to check.
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cic-poc/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cic-poc/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  site-staleness-check:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    # Website V2 world_front design (approved to proceed 2026-09-19): the
    # site compiler stage's own staleness gate, same shape as M2 staleness
    # above - recompile every migrated world's site JSON from its own
    # committed file's pinned records_commit/compiler_version
    # (engine.m2.site_cli.site_staleness_sweep), and fail if it no longer
    # matches what's actually committed at cic-website/data/worlds/
    # <census_id>.json. No world has a world_front record yet (content
    # migration is a separate, later stage from this infrastructure), so
    # this currently finds zero checkable worlds and passes trivially -
    # the same "0% fire rate is not automatically health" landmine M2
    # staleness's own comment already names, and the reason the comparison
    # logic itself is real, not stubbed, so it starts doing real work the
    # moment the first world_front record and its compiled JSON both exist.
    name: Site staleness sweep (world_front-compiled JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/m1/requirements.txt
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m pytest engine/m2/tests/test_site_compiler.py engine/m2/tests/test_site_staleness.py -q
      - run: python -m engine.m2.site_cli staleness-check

  no-embedded-world-data:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    # Website V2 world_front design (approved to proceed 2026-09-19): the
    # anti-pattern this whole design exists to retire (CLAUDE.md; the two
    # live fabrication fixes, commits fbb6557/763c48d) is participant-
    # facing data embedded directly in a page's own <script> block instead
    # of generated from records/<code>/ at compile time. cic-website/
    # atlas-v3.html already has exactly this pattern (`const DATA = {...}`)
    # and has not been migrated yet - that migration is a separate, later
    # stage - so this job fails only on a NEW instance of the pattern
    # appearing somewhere else, via tools/embedded-world-data-baseline.txt
    # (the same baseline/allowlist shape tools/check_paths.py already
    # uses), never on the one pre-existing, already-known instance.
    name: No new embedded-world-data anti-pattern (cic-website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_no_embedded_world_data.py --baseline tools/embedded-world-data-baseline.txt
