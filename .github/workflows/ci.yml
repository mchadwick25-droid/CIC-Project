name: CI

# First automated check this project has ever had (2026-08-05 full-system
# review, Engineering P1-3 step 1). Deliberately minimal: two checks that
# are fast, hermetic, and need no secrets or models. A two-click regression
# on atlas-v3.html (P0-3, fixed the same night this workflow was added)
# would have been caught by neither check on its own - that gap is real and
# is Wave 3's Playwright-in-CI item (P1-8), not this workflow's job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-census:
    name: Validate world-census.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node Ministry/Features/Atlas-World-Map/Design/tools/validate-census.mjs cic-website/data/world-census.json

  repository-views-current:
    # Added 2026-08-09. The repository/sources views are GENERATED
    # (wrs/views/repository.py) and had drifted five days behind their own
    # records without anything noticing - the builder had a --check mode from
    # the start and nothing ever ran it. A generated view nobody verifies is
    # a stale view; this is the cheapest possible guard (bare python + pyyaml,
    # no models, no secrets, no network).
    name: Repository views current (all six worlds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cic-poc/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # textstat is NOT optional here despite this job touching no models:
      # a term record's Level 2 face runs through plain_explanation, which
      # readability-checks its own output (wrs/gates/core.readability_check).
      # The first version of this job installed pyyaml alone and failed on
      # the runner - my local "bare interpreter" check had textstat already
      # installed from earlier in the same session, so the dependency was
      # invisible to me and visible to CI. That is the job earning its place
      # on its first run.
      - run: pip install pyyaml textstat
      - run: python wrs/views/repository.py --check

  m1-gates-selftest:
    # Added stage 1 of the redesign build (Build-Blueprint.md, branch
    # build/phase-1). The stage-1 gate is exactly this: the gate battery
    # passes the clean fixture world and fails every seeded-defect fixture
    # in fixtures/seeded_defects.yaml, with an inertness check that a gate
    # which never fires anywhere is itself a reported failure. Hermetic on
    # purpose (no textstat/nltk network fetch - see engine/m1/fk.py) so this
    # job needs no secrets and can't flake on an external resource.
    name: M1 gate battery selftest (fixture world)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/m1/requirements.txt
      - run: python -m pytest engine/m1/tests -q

  frontend-typecheck:
    name: Frontend build (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cic-poc/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cic-poc/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
